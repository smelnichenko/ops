---
# Setup Istio sidecar mesh on kubeadm cluster
#
# Installs:
#   - Istio sidecar (base, istiod, cni)
#   - Enables sidecar injection for schnappy namespace
#
# Gateway uses ClusterIP + externalIPs (192.168.11.2) — no LB controller needed.
#
# Prerequisites:
#   - kubeadm cluster running (setup-kubeadm.yml)
#   - Gateway API CRDs installed (setup-kubeadm.yml)
#   - schnappy-mesh Argo CD app deployed (gateway + routes)
#
# Usage:
#   task deploy:istio

- name: Setup Istio sidecar mesh
  hosts: target
  become: true
  gather_facts: false

  vars:
    istio_version: "1.25.2"
    ns: schnappy
    # Argo CD's own values for istiod and istio-cni (infra checkout next to ops): a run here installs what Argo would -
    # its own copy of them drifted (no hub, CNI or pilot settings of production's)
    infra_dir: "{{ infra_dir_override | default(playbook_dir + '/../../../../infra') }}"
    # the values read from infra's main, not from whatever branch the checkout has (a feature branch's values went to
    # production through it); a branch under test: -e infra_values_ref_override=<ref>
    infra_values_ref: "{{ infra_values_ref_override | default('main') }}"

  tasks:
    # ================================================================
    # Phase 1: Install Istio Helm charts
    # ================================================================

    - name: Add Istio Helm repo
      kubernetes.core.helm_repository:
        name: istio
        repo_url: https://blob.istio.io/istio-release/charts  # GCP-hosted repo retired (Istio 1.31); same charts
        force_update: true  # a host that registered the old URL under this name gets the new one

    - name: Check if Istio is already installed
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: istiod
        namespace: istio-system
      register: istio_exists

    - name: Install Istio base (CRDs)
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: istio-base
        chart_ref: istio/base
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        create_namespace: true
        wait: true
        wait_timeout: 60s
      when: istio_exists.resources | length == 0

    # the Istio values from production's main: a local main behind origin's (CD pushed meanwhile) or with commits never
    # pushed installed other values than production runs - refused; a ref given on purpose is read as given
    - name: Infra's local main is origin's (the Istio values read from it)
      ansible.builtin.shell: |
        set -euo pipefail
        git -C {{ infra_dir | quote }} fetch -q origin main
        [ "$(git -C {{ infra_dir | quote }} rev-parse main)" = "$(git -C {{ infra_dir | quote }} rev-parse origin/main)" ] \
          || { echo "REFUSED: the main of {{ infra_dir }} is not origin/main - pull it first"; exit 1; }
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      check_mode: false
      when: infra_values_ref == 'main'

    - name: Install istiod
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: istiod
        chart_ref: istio/istiod
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        wait: true
        wait_timeout: 120s
        values: >-
          {{ lookup('ansible.builtin.pipe', 'git -C ' ~ (infra_dir | quote) ~ ' show ' ~ (infra_values_ref
                    ~ ':clusters/production/istio/istiod-values.yaml') | quote) | from_yaml }}
      when: istio_exists.resources | length == 0

    - name: Install Istio CNI
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: istio-cni
        chart_ref: istio/cni
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        wait: true
        wait_timeout: 120s
        values: >-
          {{ lookup('ansible.builtin.pipe', 'git -C ' ~ (infra_dir | quote) ~ ' show ' ~ (infra_values_ref
                    ~ ':clusters/production/istio/cni-values.yaml') | quote) | from_yaml }}
      when: istio_exists.resources | length == 0

    - name: Verify Istio pods
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get pods -n istio-system --no-headers | grep -v Running | grep -v Completed
      args:
        executable: /bin/bash
      register: istio_check
      failed_when: istio_check.stdout | length > 0
      changed_when: false

    - name: "PHASE 1: Istio installed"
      ansible.builtin.debug:
        msg: "istiod and CNI running"

    # ================================================================
    # Phase 2: Enable sidecar injection for schnappy namespace
    # ================================================================

    - name: Label schnappy namespace for sidecar injection
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: patched
        api_version: v1
        kind: Namespace
        name: "{{ ns }}"
        definition:
          metadata:
            labels:
              istio-injection: enabled

    - name: "PHASE 2: schnappy namespace sidecar injection enabled"
      ansible.builtin.debug:
        msg: "New/restarted pods in {{ ns }} will get Envoy sidecar"

    # ================================================================
    # Phase 3: Verify
    # ================================================================

    - name: Wait for Istio gateway service
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: schnappy-gateway-istio
        namespace: "{{ ns }}"
      register: gateway_svc
      retries: 30
      delay: 10
      until:
        - gateway_svc.resources | length > 0
        - gateway_svc.resources[0].spec.externalIPs is defined
        - gateway_svc.resources[0].spec.externalIPs | length > 0

    - name: Set gateway VIP fact
      ansible.builtin.set_fact:
        gateway_vip_addr: "{{ gateway_svc.resources[0].spec.externalIPs[0] }}"

    - name: Test Istio gateway  # noqa: command-instead-of-module
      # curl --resolve pins pmon.dev to the gateway VIP; uri module has no equivalent. Verified: the gateway serves the
      # public *.pmon.dev certificate
      ansible.builtin.shell: |
        curl -s -o /dev/null -w '%{http_code}' --resolve pmon.dev:443:{{ gateway_vip_addr }} https://pmon.dev/api/health
      register: gateway_test
      changed_when: false
      failed_when: false

    - name: "RESULT"
      ansible.builtin.debug:
        msg: |
          Istio sidecar mesh: RUNNING
          Gateway VIP: {{ gateway_vip_addr }}
          Health check: {{ 'OK' if gateway_test.stdout == '200' else 'NOT YET (app pods may still be starting)' }}
          PeerAuth: STRICT mTLS
