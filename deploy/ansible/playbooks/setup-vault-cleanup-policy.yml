---
# Provisions the scoped Vault token used by the stale-pr-envs-sweeper
# CronJob (it deletes the Vault secrets of preview environments that are gone).
#
# - Creates a Vault policy that allows LIST on `secret/metadata/` and
#   DELETE on `secret/metadata/schnappy-pr-*` (no other paths, no
#   read).
# - Issues a periodic token bound to that policy (period 720h): it lives
#   only while renewed within its period - the sweeper renews it itself
#   (renew-self) at every run; Vault renews nothing on its own.
# - Stores the token at `secret/argocd/vault-cleanup-token` so ESO
#   can surface it as a Secret in the argocd namespace.
#
# Idempotent: re-runs reconcile the policy + skip token re-issue if
# the path already has a token Vault still knows. A stored token Vault
# calls dead (expired, revoked - production's, never renewed until
# 2026-10, died after 30 days) is replaced.
#
# Usage:
#   task deploy:setup-vault-cleanup-policy

- name: Provision Vault cleanup token for PR-env GC
  hosts: pi1
  become: true
  gather_facts: false

  vars:
    vault_addr: "https://127.0.0.1:8200"
    policy_name: "argocd-pr-env-cleanup"

  tasks:
    - name: Ensure python3-hvac is installed
      ansible.builtin.apt:
        name: python3-hvac
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Read Vault root token
      ansible.builtin.slurp:
        src: /etc/vault-unseal/root-token
      register: vault_token_raw
      no_log: true

    - name: Set token fact
      ansible.builtin.set_fact:
        vault_token_value: "{{ vault_token_raw.content | b64decode | trim }}"
      no_log: true

    - name: Write Vault ACL policy (LIST + DELETE on schnappy-pr-* paths)
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        ca_cert: /etc/vault.d/tls/ca-cert.pem
        path: "sys/policies/acl/{{ policy_name }}"
        data:
          policy: |
            # List the secret mount root to discover schnappy-pr-* prefixes.
            path "secret/metadata/" {
              capabilities = ["list"]
            }
            # LIST + DELETE on schnappy-pr-* (partial-segment match —
            # Vault's `+` is single-segment-wildcard, not partial-match;
            # `*` is glob-suffix and is the correct primitive here).
            path "secret/metadata/schnappy-pr-*" {
              capabilities = ["list", "delete"]
            }
            # Explicitly DENY everything else under secret/ (defense in
            # depth — `deny` always wins over `allow` in Vault ACLs).
            path "secret/data/*" {
              capabilities = ["deny"]
            }
            path "secret/metadata/schnappy" {
              capabilities = ["deny"]
            }
            path "secret/metadata/schnappy/*" {
              capabilities = ["deny"]
            }
            path "secret/metadata/schnappy-test" {
              capabilities = ["deny"]
            }
            path "secret/metadata/schnappy-test/*" {
              capabilities = ["deny"]
            }
            path "secret/metadata/schnappy-infra" {
              capabilities = ["deny"]
            }
            path "secret/metadata/schnappy-infra/*" {
              capabilities = ["deny"]
            }
            path "secret/metadata/argocd" {
              capabilities = ["deny"]
            }
            path "secret/metadata/argocd/*" {
              capabilities = ["deny"]
            }

    - name: Check if cleanup token already provisioned
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        ca_cert: /etc/vault.d/tls/ca-cert.pem
        path: "argocd/vault-cleanup-token"
      register: _existing_token
      failed_when: false
      no_log: true

    # the copy stored is not proof of a live token: looked up in Vault (a read - in a preview too). 200: it lives; 403
    # "bad token": dead; any other answer fails the play rather than issue a second token beside a live one
    - name: Look the stored cleanup token up in Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/token/lookup"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token_value }}"
        body_format: json
        body:
          token: "{{ _existing_token.secret.token }}"
        ca_path: /etc/vault.d/tls/ca-cert.pem
        follow_redirects: none
        status_code: [200, 403]
      register: _token_lookup
      when: _existing_token.secret is defined and _existing_token.secret.token | default('') != ''
      check_mode: false
      no_log: true

    - name: The stored token lives, or Vault calls it dead
      ansible.builtin.assert:
        that: _token_lookup is skipped or _token_lookup.status == 200 or 'bad token' in (_token_lookup.json.errors | default([]))
        # rendered even when the assert passes (ansible-core 2.20): a skipped lookup has neither
        fail_msg: "Vault's token lookup answered {{ _token_lookup.status | default('-') }} {{ (_token_lookup.json | default({})).errors | default('') }}"
        quiet: true

    - name: Issue new periodic token bound to {{ policy_name }}
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        ca_cert: /etc/vault.d/tls/ca-cert.pem
        path: "auth/token/create"
        data:
          policies: ["{{ policy_name }}"]
          # Periodic (auto-renewable indefinitely as long as renewed
          # within the period). 720h = 30d.
          period: "720h"
          display_name: "argocd-pr-env-cleanup"
          renewable: true
      register: _new_token
      no_log: true
      when: >-
        _existing_token.secret is not defined or _existing_token.secret.token | default('') == ''
        or _token_lookup.status | default(200) == 403

    - name: Store cleanup token at secret/argocd/vault-cleanup-token
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        ca_cert: /etc/vault.d/tls/ca-cert.pem
        path: "argocd/vault-cleanup-token"
        data:
          token: "{{ _new_token.data.auth.client_token }}"
      # Only run after the previous task minted a fresh token; not a
      # notify-handler chain because we need the register's payload. A
      # preview mints none (vault_write answers nothing in check mode).
      when: _new_token is changed and not ansible_check_mode  # noqa: no-handler
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: |
          Policy `{{ policy_name }}` reconciled.
          Cleanup token: {{
            'reused (already at secret/argocd/vault-cleanup-token, alive)'
            if _new_token is skipped
            else 'newly issued + stored at secret/argocd/vault-cleanup-token'
              ~ (' (the stored one was dead)' if _token_lookup.status | default(200) == 403 else '')
          }}
