---
# Vault on both Pis to vault_version (vars/vault.yml), its release checked against HashiCorp's SHA256SUMS - in
# HashiCorp's HA order: the standby first, the active last, so the failover runs from the older server to the newer,
# never back. Each: stopped (SIGTERM - the active steps down), its binary replaced, started, unsealed by the Pi's own
# unseal script (rewritten first: its key shares go to the API on stdin, its waits are bounded), on the new version
# before the next. Before anything: both unsealed, one active (also checked when nothing is to do), the root token
# working on each Pi (2.x's break-glass), each binary on disk the one its process runs; a Consul snapshot (Vault's
# storage) and an export of Vault's keys alone (vault/ - restoring the whole snapshot would also roll Patroni back) into
# /var/backups/vault-upgrade on the active Pi, both fetched to the controller (vars/vault-upgrade-backups/); the running
# binary kept beside the new (/usr/local/bin/vault-<ver>). The way back: restore-vault.yml (task deploy:vault:way-back) -
# that export into vault/, that binary back, rehearsed on the copy (task test:copy:vault-way-back). Never a downgrade; a Pi
# already on the version is not restarted; nothing to do when both are. Any Pi failing stops the run on both (one Pi
# upgraded alone is no HA).
#
# Usage: task deploy:vault:upgrade   (production; Vagrant: task test:vault-upgrade)
- name: Vault on both Pis to one version
  hosts: pis
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    vault_api: https://127.0.0.1:8200
    upgrade_dir: /var/backups/vault-upgrade
  tasks:
    - name: Each Vault's state (200 active, 429 standby, 503 sealed)
      ansible.builtin.uri:
        url: "{{ vault_api }}/v1/sys/health"
        ca_path: /etc/vault.d/tls/ca-cert.pem  # its certificate names 127.0.0.1
        status_code: [200, 429, 503]
        return_content: true
      register: _health

    - name: Its version and role
      ansible.builtin.set_fact:
        _running: "{{ _health.json.version }}"
        _active: "{{ _health.status == 200 }}"

    - name: Never a downgrade
      ansible.builtin.assert:
        that: _running is version(vault_version, '<=')
        fail_msg: "REFUSED: {{ inventory_hostname }} runs Vault {{ _running }}, newer than {{ vault_version }}"
        quiet: true

    - name: Both unsealed, exactly one active (also when nothing is to do - a sealed one needs a look, not a pass)
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | map('extract', hostvars, ['_health', 'status']) | reject('in', [200, 429]) | list | length == 0
          - ansible_play_hosts | map('extract', hostvars, '_active') | select | list | length == 1
        fail_msg: >-
          REFUSED: Vault not as an upgrade needs it - {{ ansible_play_hosts | zip(ansible_play_hosts
          | map('extract', hostvars, ['_health', 'status'])) | list }} (200 active, 429 standby)
        quiet: true
      run_once: true

    - name: Nothing to do - every Pi runs {{ vault_version }}
      ansible.builtin.meta: end_play
      when: ansible_play_hosts | map('extract', hostvars, '_running') | unique | list == [vault_version]

    # the break-glass from 2.0 on: sys/rekey and sys/generate-root need a token besides the key shares (HashiCorp's 2.0.0
    # notes) - the root token kept on each Pi (setup-vault-pi writes it, backup-vault-keys copies it off) must work
    # before any version move, or a lost one leaves a Vault that unseals but cannot be administered (operator 2026-11-27)
    - name: The root token works here (vault token lookup)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          export VAULT_ADDR={{ vault_api }} VAULT_CACERT=/etc/vault.d/tls/ca-cert.pem
          VAULT_TOKEN=$(cat /etc/vault-unseal/root-token) vault token lookup -format=json > /dev/null
      register: _root_token
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true  # the token in its environment

    - name: The root token works on every Pi - else nothing touched
      ansible.builtin.assert:
        that: _root_token.rc | default(1) == 0
        fail_msg: >-
          REFUSED: /etc/vault-unseal/root-token on {{ inventory_hostname }} does not pass vault token lookup - Vault 2.x needs
          a token for sys/rekey and sys/generate-root: put a working root token back (backup-vault-keys.yml keeps a copy;
          on 1.x vault operator generate-root makes one from the key shares) - nothing touched
        quiet: true

    - name: The binary on disk
      ansible.builtin.command: /usr/local/bin/vault version
      register: _on_disk
      changed_when: false

    - name: The binary on disk is the one running (else it was replaced under the process - look first)
      ansible.builtin.assert:
        that: (_on_disk.stdout.split()[1] | regex_replace('^v', '')) == _running
        fail_msg: "REFUSED: {{ inventory_hostname }} runs Vault {{ _running }}, its binary on disk is {{ _on_disk.stdout }}"
        quiet: true

    - name: The release, checked
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
        dest: "/usr/local/lib/vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
        checksum: "sha256:{{ vault_checksums[vault_arch] }}"
        mode: '0644'

    - name: Its directory
      ansible.builtin.file:
        path: "/usr/local/lib/vault-{{ vault_version }}"
        state: directory
        mode: '0755'

    - name: Unpacked
      ansible.builtin.unarchive:
        src: "/usr/local/lib/vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
        dest: "/usr/local/lib/vault-{{ vault_version }}"
        remote_src: true
        creates: "/usr/local/lib/vault-{{ vault_version }}/vault"

    - name: The running binary kept (the way back)
      ansible.builtin.copy:
        src: /usr/local/bin/vault
        dest: "/usr/local/bin/vault-{{ _running }}"
        remote_src: true
        mode: '0755'
        force: false
      when: _running != vault_version

    - name: Consul's snapshot first (Vault's storage), on the active Pi
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          mkdir -p {{ upgrade_dir }} && chmod 0700 {{ upgrade_dir }}
          out={{ upgrade_dir }}/consul-$(date -u +%Y%m%dT%H%M%SZ)-vault-{{ _running }}
          consul snapshot save "$out.snap" > /dev/null
          consul snapshot inspect "$out.snap" > /dev/null
          # Vault's keys alone too: restoring the whole snapshot would also roll Patroni's state back
          consul kv export vault/ > "$out.vault-kv.json"
          python3 -c 'import json, sys; n = len(json.load(open(sys.argv[1]))); assert n > 0, "no vault/ keys"' "$out.vault-kv.json"
          chmod 0600 "$out.snap" "$out.vault-kv.json"
          echo "$out.snap"
      register: _snapshot
      changed_when: true
      when: _active | bool

    # one Pi's disk alone is no backup: both files on the controller too, before anything stops (the gitignored
    # vars/vault-upgrade-backups/ - a way back after that Pi is lost copies them back to a Pi: restore-vault.yml)
    - name: Both backups fetched to the controller, before anything stops
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ playbook_dir }}/../vars/vault-upgrade-backups/"
        flat: true
        fail_on_missing: true
      loop: ["{{ _snapshot.stdout }}", "{{ _snapshot.stdout | regex_replace('[.]snap$', '.vault-kv.json') }}"]
      when: _active | bool

    - name: The Pi's own unseal - the current script and unit, before anything restarts
      ansible.builtin.include_tasks: tasks/vault-unseal.yml

    - name: The standby first, then the active
      ansible.builtin.include_tasks: tasks/vault-upgrade-node.yml
      loop: "{{ [false, true] }}"
      loop_control:
        loop_var: _turn_active
        label: "{{ 'the active' if _turn_active else 'the standby' }}"

    - name: Each on the version, unsealed
      ansible.builtin.uri:
        url: "{{ vault_api }}/v1/sys/health"
        ca_path: /etc/vault.d/tls/ca-cert.pem  # its certificate names 127.0.0.1
        status_code: [200, 429]
        return_content: true
      register: _after
      retries: 24
      delay: 5
      until: _after.status in [200, 429] and _after.json.version == vault_version

    - name: Each sees a leader (the failover done)
      ansible.builtin.uri:
        url: "{{ vault_api }}/v1/sys/leader"
        ca_path: /etc/vault.d/tls/ca-cert.pem  # its certificate names 127.0.0.1
        return_content: true
      register: _leader
      retries: 24
      delay: 5
      until: _leader.json.leader_address | length > 0

    - name: Exactly one active, the same leader seen by both
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | map('extract', hostvars, ['_leader', 'json', 'is_self']) | select | list | length == 1
          - ansible_play_hosts | map('extract', hostvars, ['_leader', 'json', 'leader_address']) | unique | list | length == 1
        fail_msg: "{{ ansible_play_hosts | map('extract', hostvars, ['_leader', 'json']) | list | to_json }}"
        quiet: true
      run_once: true

    - name: Upgraded
      ansible.builtin.debug:
        msg: >-
          VAULT {{ vault_version }} on {{ ansible_play_hosts | join(', ') }} (was {{ ansible_play_hosts
          | map('extract', hostvars, '_running') | unique | join(', ') }}); active now
          {{ _leader.json.leader_address }}; snapshot
          {{ ansible_play_hosts | map('extract', hostvars, '_snapshot') | map(attribute='stdout', default='') | select | join('') }}
      run_once: true
