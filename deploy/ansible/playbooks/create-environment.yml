---
# Create a new schnappy environment
#
# Usage:
#   task env:create ENV_NAME=staging
#
# Creates: namespace, values files, cluster-config, ApplicationSet entries,
# Vault secrets, Keycloak redirect URI, gateway ReferenceGrant entry.
# Commits and pushes infra repo. ArgoCD auto-syncs.
#
# Prerequisites:
#   - Wildcard DNS *.pmon.dev → 192.168.11.2
#   - Vault running on Pi
#   - ArgoCD running with ApplicationSets

- name: Create schnappy environment  # env_name passed via -e
  hosts: pi1
  become: true
  gather_facts: false

  vars:
    env_ns: "schnappy-{{ env_name }}"
    release_name: "schnappy-{{ env_name }}"
    infra_dir: "{{ infra_dir_override | default(playbook_dir + '/../../../../infra') }}"
    cluster_dir: "{{ infra_dir }}/clusters/production"
    vault_addr: "https://127.0.0.1:8200"
    forgejo_url: "http://localhost:3000"
    keycloak_url: "http://localhost:8080"
    infra_git_url: "{{ infra_git_url_override | default('') }}"
    # Prelude for every `vault` shell task. It runs on the target as root and reads the
    # root token where it already lives (setup-vault-pi.yml writes it there, on the
    # Vagrant pi1 too), so the token never crosses the controller: not in argv, not in
    # a fact, not in the `-vvv` EXEC line that prints a task's `environment:`.
    vault_cli_env: |
      export VAULT_ADDR="{{ vault_addr }}" VAULT_SKIP_VERIFY=1
      VAULT_TOKEN="$(cat /etc/vault-unseal/root-token)" || { echo "vault_cli_env: cannot read /etc/vault-unseal/root-token (needs become)" >&2; exit 1; }
      [ -n "$VAULT_TOKEN" ] || { echo "vault_cli_env: root-token file is empty" >&2; exit 1; }
      export VAULT_TOKEN

  pre_tasks:
    - name: Validate env_name
      ansible.builtin.assert:
        that:
          - env_name is defined
          - env_name | length > 0
          - env_name != "production"
          - env_name is match("^[a-z0-9-]+$")
        fail_msg: "env_name must be lowercase alphanumeric (got: '{{ env_name | default('undefined') }}')"

    - name: Check environment doesn't already exist
      ansible.builtin.stat:
        path: "{{ cluster_dir }}/{{ env_ns }}-data/values.yaml"
      register: env_exists
      delegate_to: localhost
      become: false

    - name: Fail if environment exists
      ansible.builtin.fail:
        msg: "Environment {{ env_ns }} already exists"
      when: env_exists.stat.exists

    - name: Generate passwords
      ansible.builtin.set_fact:
        gen_db_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
        gen_valkey_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
        gen_minio_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
        gen_kafka_cluster_id: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=22') }}"
      delegate_to: localhost
      become: false

  tasks:
    # ================================================================
    # Phase 1: Seed Vault secrets
    # ================================================================

    - name: Ensure KV secrets engine is mounted
      ansible.builtin.shell: |
        set -o pipefail
        {{ vault_cli_env }}
        vault secrets list -format=json | grep -q '"secret/"' || \
        vault secrets enable -path=secret kv-v2
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    # The generated values and the external keys (from .env via lookup('env'), like
    # seed-vault-secrets.yml) reach the script through the task environment and go
    # to Vault as JSON on stdin — no secret on the command line, no K=V parsing
    # (a value starting with `@` or `-` would be read as a file or stdin by the CLI),
    # no shell re-parsing of quotes or `$`. An absent key is skipped visibly, never
    # written as a placeholder. Caveat: at -vvv Ansible prints a task's environment
    # in the EXEC line, so never run this at that verbosity on a shared terminal.
    - name: Seed Vault secrets for {{ env_ns }}
      ansible.builtin.shell: |
        set -eo pipefail
        {{ vault_cli_env }}
        jq -n --arg database monitor --arg username monitor --arg password "$GEN_DB_PASSWORD" \
          '{database: $database, username: $username, password: $password}' | vault kv put secret/{{ env_ns }}/postgres -
        jq -n --arg password "$GEN_VALKEY_PASSWORD" '{password: $password}' | vault kv put secret/{{ env_ns }}/valkey -
        jq -n --arg access_key admin --arg secret_key "$GEN_MINIO_PASSWORD" \
          '{access_key: $access_key, secret_key: $secret_key}' | vault kv put secret/{{ env_ns }}/s3gw -
        jq -n --arg cluster_id "$GEN_KAFKA_CLUSTER_ID" '{cluster_id: $cluster_id}' | vault kv put secret/{{ env_ns }}/kafka -
        if [ -n "$ANTHROPIC_API_KEY" ]; then
          jq -n --arg api_key "$ANTHROPIC_API_KEY" '{api_key: $api_key}' | vault kv put secret/{{ env_ns }}/ai -
        else
          echo "SKIPPED secret/{{ env_ns }}/ai: ANTHROPIC_API_KEY not in .env (no placeholder written)"
        fi
        if [ -n "$MAIL_PASSWORD" ]; then
          jq -n --arg password "$MAIL_PASSWORD" '{password: $password}' | vault kv put secret/{{ env_ns }}/mail -
        else
          echo "SKIPPED secret/{{ env_ns }}/mail: MAIL_PASSWORD not in .env (no placeholder written)"
        fi
        if [ -n "$RESEND_WEBHOOK_SECRET" ] && [ -n "$RESEND_API_KEY" ]; then
          jq -n --arg signing_secret "$RESEND_WEBHOOK_SECRET" --arg api_key "$RESEND_API_KEY" \
            '{signing_secret: $signing_secret, api_key: $api_key}' | vault kv put secret/{{ env_ns }}/webhook -
        else
          echo "SKIPPED secret/{{ env_ns }}/webhook: needs both RESEND_WEBHOOK_SECRET and RESEND_API_KEY in .env (missing:$([ -z "$RESEND_WEBHOOK_SECRET" ] && printf ' RESEND_WEBHOOK_SECRET')$([ -z "$RESEND_API_KEY" ] && printf ' RESEND_API_KEY')); no placeholder written"
        fi
      args:
        executable: /bin/bash
      environment:
        GEN_DB_PASSWORD: "{{ gen_db_password }}"
        GEN_VALKEY_PASSWORD: "{{ gen_valkey_password }}"
        GEN_MINIO_PASSWORD: "{{ gen_minio_password }}"
        GEN_KAFKA_CLUSTER_ID: "{{ gen_kafka_cluster_id }}"
        ANTHROPIC_API_KEY: "{{ lookup('env', 'ANTHROPIC_API_KEY') | trim }}"
        MAIL_PASSWORD: "{{ lookup('env', 'MAIL_PASSWORD') | trim }}"
        RESEND_WEBHOOK_SECRET: "{{ lookup('env', 'RESEND_WEBHOOK_SECRET') | trim }}"
        RESEND_API_KEY: "{{ lookup('env', 'RESEND_API_KEY') | trim }}"
      changed_when: true

    - name: "PHASE 1: Vault secrets seeded"
      ansible.builtin.debug:
        msg: "Seeded secrets at secret/{{ env_ns }}/*"

    # ================================================================
    # Phase 2: Add Keycloak redirect URI
    # ================================================================

    - name: Check if Keycloak schnappy realm exists
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/realms/schnappy/.well-known/openid-configuration"
        validate_certs: false
        status_code: [200, 404]
      register: kc_realm_check
      failed_when: false

    - name: Get Keycloak admin password
      ansible.builtin.shell: |
        {{ vault_cli_env }}
        vault kv get -field=admin_password secret/schnappy/keycloak
      register: kc_password
      changed_when: false
      no_log: true   # stdout IS the admin password
      when: kc_realm_check.status == 200

    - name: Get Keycloak admin token
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          username: admin
          password: "{{ kc_password.stdout }}"
          grant_type: password
        validate_certs: false
      register: kc_token
      no_log: true   # the request body carries the admin password, the result the token
      when: kc_realm_check.status == 200

    - name: Get app client config
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/admin/realms/schnappy/clients?clientId=app&first=0&max=1"
        headers:
          Authorization: "Bearer {{ kc_token.json.access_token }}"
        validate_certs: false
      register: kc_app_client
      when: kc_realm_check.status == 200

    - name: Add redirect URI
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/admin/realms/schnappy/clients/{{ kc_app_client.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ kc_token.json.access_token }}"
          Content-Type: application/json
        body_format: json
        body:
          clientId: app
          redirectUris: "{{ kc_app_client.json[0].redirectUris + ['https://' + env_name + '.pmon.dev/*'] | unique }}"
          webOrigins: "{{ kc_app_client.json[0].webOrigins }}"
        validate_certs: false
        status_code: 204
      when: kc_realm_check.status == 200

    - name: "PHASE 2: Keycloak redirect URI added"
      ansible.builtin.debug:
        msg: "{{ 'Added https://' + env_name + '.pmon.dev/* to Keycloak' if kc_realm_check.status == 200 else 'Skipped (no schnappy realm)' }}"

    # ================================================================
    # Phase 3: Create infra files (runs on localhost)
    # ================================================================

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ cluster_dir }}/{{ env_ns }}-data"
        - "{{ cluster_dir }}/{{ env_ns }}-apps"
        - "{{ cluster_dir }}/{{ env_ns }}-mesh"
        - "{{ cluster_dir }}/cluster-config"
        - "{{ cluster_dir }}/argocd/apps"
      delegate_to: localhost
      become: false

    - name: Create data values
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/{{ env_ns }}-data/values.yaml"
        mode: '0644'
        content: |
          vault:
            secretsEnabled: true
            secretPathPrefix: "secret/data/{{ env_ns }}"

          networkPolicies:
            enabled: true

          postgres:
            enabled: false

          valkey:
            enabled: true
            existingSecret: {{ env_ns }}-valkey
            image: valkey/valkey:8.1-alpine
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 100m, memory: 128Mi }

          kafka:
            enabled: false
            existingSecret: {{ env_ns }}-kafka
            resources:
              requests: { cpu: 50m, memory: 512Mi }
              limits: { cpu: 1000m, memory: 1536Mi }
            retention:
              hours: 24
              bytes: "2147483648"
            storage:
              size: 2Gi
              storageClass: local-path

          scylla:
            enabled: false
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { cpu: 1000m, memory: 512Mi }

          scyllaOperator:
            enabled: true
            version: "6.2.3"
            agentVersion: "3.9.0"
            developerMode: true

          minio:
            enabled: true
            existingSecret: {{ env_ns }}-minio
            bucket: email-attachments
            buckets:
              - email-attachments
            image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
            storage:
              size: 5Gi
              storageClass: local-path
            resources:
              requests: { cpu: 25m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }

          strimzi:
            enabled: true

          cnpg:
            enabled: true
            import: false
            backup: false

          aptCache:
            enabled: false
      delegate_to: localhost
      become: false

    - name: Create apps values
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/{{ env_ns }}-apps/values.yaml"
        mode: '0644'
        content: |
          vault:
            secretsEnabled: true
            secretPathPrefix: "secret/data/{{ env_ns }}"

          app:
            replicas: 1
            javaOpts: -Xmx1g -XX:+UseZGC
            image:
              pullPolicy: IfNotPresent
              repository: git.pmon.dev/schnappy/monitor
              tag: "latest"
            ingress:
              enabled: false
            resources:
              requests: { cpu: 50m, memory: 512Mi }
              limits: { cpu: 2000m, memory: 2Gi }

          site:
            enabled: true
            replicas: 1
            image:
              pullPolicy: IfNotPresent
              repository: git.pmon.dev/schnappy/site
              tag: "latest"
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { cpu: 500m, memory: 128Mi }

          games: []

          captcha:
            enabled: false

          chess:
            enabled: true

          chat:
            e2eEnabled: false

          monitor:
            enabled: true

          networkPolicies:
            enabled: true

          strimzi:
            enabled: true

          cnpg:
            enabled: true

          scyllaOperator:
            enabled: true

          ai:
            enabled: false

          mail:
            enabled: false

          webhook:
            enabled: false

          admin:
            enabled: true
            image:
              repository: git.pmon.dev/schnappy/admin
              pullPolicy: IfNotPresent
              tag: "latest"
            replicas: 1
            javaOpts: -Xmx512m -XX:+UseZGC
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { cpu: 1000m, memory: 1Gi }

          chatService:
            enabled: true
            image:
              repository: git.pmon.dev/schnappy/chat
              pullPolicy: IfNotPresent
              tag: "latest"
            replicas: 1
            javaOpts: -Xmx512m -XX:+UseZGC
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { cpu: 1000m, memory: 1Gi }

          chessService:
            enabled: true
            image:
              repository: git.pmon.dev/schnappy/chess
              pullPolicy: IfNotPresent
              tag: "latest"
            replicas: 1
            javaOpts: -Xmx512m -XX:+UseZGC
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { cpu: 1000m, memory: 1Gi }

          tracing:
            enabled: false

          smokeTest:
            enabled: false

          hyperfoil:
            enabled: false

          postgres:
            database: monitor
            existingSecret: {{ env_ns }}-postgres
          valkey:
            existingSecret: {{ env_ns }}-valkey
          minio:
            existingSecret: {{ env_ns }}-minio
          alertmanager:
            enabled: false
          keycloak:
            enabled: false
      delegate_to: localhost
      become: false

    - name: Create mesh values
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/{{ env_ns }}-mesh/values.yaml"
        mode: '0644'
        content: |
          scyllaOperator:
            enabled: true

          peerAuthentication:
            enabled: true
            mode: STRICT

          authorizationPolicies:
            enabled: true

          gateway:
            enabled: false
            external:
              enabled: true
              gatewayName: schnappy-infra-gateway
              gatewayNamespace: schnappy-infra
              hostname: {{ env_name }}.pmon.dev

          jwt:
            enabled: false
      delegate_to: localhost
      become: false

    - name: Create namespace manifest
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/cluster-config/{{ env_ns }}-namespace.yaml"
        mode: '0644'
        content: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ env_ns }}
            labels:
              istio.io/rev: default
              # The schnappy-infra default-deny admits gateway/Prometheus egress only to
              # namespaces labelled environment=production|test; the env's own name goes
              # on a separate label. (A non-admitted value = an unreachable environment
              # that Argo still reports Synced/Healthy.)
              environment: production
              schnappy.io/env: {{ env_name }}
      delegate_to: localhost
      become: false

    - name: Create default-deny + quota
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/cluster-config/{{ env_ns }}-default-deny.yaml"
        mode: '0644'
        content: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: {{ env_ns }}-default-deny
            namespace: {{ env_ns }}
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - from:
                  - podSelector: {}
              - from:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: argocd
                ports:
                  - protocol: TCP
                    port: 8080
              - from:
                  - namespaceSelector:
                      matchLabels:
                        gateway: "true"
                    podSelector:
                      matchLabels:
                        gateway.istio.io/managed: istio.io-gateway-controller
              - ports:
                  - protocol: TCP
                    port: 15021
            egress:
              - ports:
                  - { protocol: UDP, port: 53 }
                  - { protocol: TCP, port: 53 }
              - to:
                  - podSelector: {}
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: istio-system
                ports:
                  - { protocol: TCP, port: 15012 }
                  - { protocol: TCP, port: 15010 }
                  - { protocol: TCP, port: 15014 }
                  - { protocol: TCP, port: 443 }
              - ports:
                  - { protocol: TCP, port: 443 }
                  - { protocol: TCP, port: 6443 }
              - to:
                  - ipBlock:
                      cidr: 192.168.11.5/32
                ports:
                  - { protocol: TCP, port: 8200 }
              - to:
                  - namespaceSelector:
                      matchLabels:
                        gateway: "true"
                ports:
                  - { protocol: TCP, port: 4318 }
          ---
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: {{ env_ns }}-quota
            namespace: {{ env_ns }}
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.cpu: "32"
              limits.memory: 24Gi
      delegate_to: localhost
      become: false

    - name: Add forgejo-registry secret
      ansible.builtin.blockinfile:
        path: "{{ cluster_dir }}/cluster-config/forgejo-registry-secret.yaml"
        marker: "# {mark} {{ env_ns }}"
        create: true
        mode: "0644"
        insertbefore: EOF
        block: |
          ---
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: forgejo-registry-es
            namespace: {{ env_ns }}
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: forgejo-registry
              template:
                type: kubernetes.io/dockerconfigjson
                data:
                  .dockerconfigjson: |
                    {"auths":{"git.pmon.dev":{"username":"{{ '{{' }} .registry_user {{ '}}' }}","password":"{{ '{{' }} .registry_token {{ '}}' }}"}}}
            data:
              - secretKey: registry_user
                remoteRef:
                  key: secret/data/schnappy/forgejo
                  property: admin_username
              - secretKey: registry_token
                remoteRef:
                  key: secret/data/schnappy/forgejo
                  property: admin_password
      delegate_to: localhost
      become: false

    - name: "PHASE 3: Infra files created"
      ansible.builtin.debug:
        msg: "Created values, namespace, NP, quota, forgejo-registry"

    # ================================================================
    # Phase 4: Update ApplicationSets + gateway ReferenceGrant
    # ================================================================

    - name: Add env to ApplicationSets
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/scripts/update-appsets.py
          {{ cluster_dir }}
          {{ env_name }}
          {{ env_ns }}
          {{ release_name }}
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Add namespace to gateway allowedNamespaces
      ansible.builtin.lineinfile:
        path: "{{ cluster_dir }}/schnappy-mesh/values.yaml"
        insertafter: 'allowedNamespaces:'
        line: "    - {{ env_ns }}"
        create: true
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: "PHASE 4: ApplicationSets and gateway updated"
      ansible.builtin.debug:
        msg: "Added {{ env_name }} to ApplicationSets and gateway ReferenceGrant"

    # ================================================================
    # Phase 5: Commit and push
    # ================================================================

    - name: Commit and push infra changes
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/git-commit-push.sh '{{ infra_dir }}' 'env: create {{ env_ns }}' '{{ infra_git_url }}'"
      delegate_to: localhost
      become: false
      changed_when: true
      environment:
        GIT_AUTHOR_NAME: "env-automation"
        GIT_AUTHOR_EMAIL: "automation@pmon.dev"
        GIT_COMMITTER_NAME: "env-automation"
        GIT_COMMITTER_EMAIL: "automation@pmon.dev"

    - name: "DONE"
      ansible.builtin.debug:
        msg: |
          Environment {{ env_ns }} created.
          ArgoCD will sync within 3 minutes.
          URL: https://{{ env_name }}.pmon.dev
