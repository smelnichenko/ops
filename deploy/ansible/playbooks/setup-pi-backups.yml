---
# The Pis' tier-0 data backed up daily into the Pi backup store (bucket pi-backups, keys <UTC time>/<file>), once a
# day from whichever Pi's timer gets there first: Consul's lock serializes the two, and a day with a success already is
# done - the other Pi's run, or a failed first run's retry by it. (By the VIP's holder it was none at all when the VIP
# moved between the two firings; two runs at once both purged, the loser's purge failing after its upload.)
#   consul.snap        `consul snapshot save` - Vault's data lives in Consul, and Patroni's cluster state; checked
#                      with `consul snapshot inspect`. Restoring all of it rolls Patroni's state back too: pause
#                      Patroni first, or restore it into a throwaway agent and import only vault/ from there
#   pg-<db>.dump       pg_dump --format=custom of every Patroni database (Forgejo's, Keycloak's, ...) through HAProxy
#                      (the primary); each listed back with pg_restore --list
#   pg-globals.sql     pg_dumpall --globals-only (roles)
#   keycloak-<realm>.json  each realm's partial export (clients, groups, roles) - a readable copy across Keycloak
#                      versions, not a restore source: Keycloak masks client and identity-provider secrets in it
#                      (**********) and leaves users out; Keycloak's restore is its database dump
#   last-success       the run's time, written last - a check in the cluster alerts when it is old
# Uploaded with rclone and compared (rclone check); copies older than pi_backup_retention_days deleted by their names,
# the newest pi_backup_keep kept whatever the clock says - in this bucket only (the store's key is its root key: an
# empty bucket name would reach every bucket, so it stops the run). A failed Keycloak export still uploads the rest,
# then fails the run without a new last-success.
# Secrets stay off command lines (any local user reads those in /proc): the Keycloak password and token go to curl
# on stdin and through a config read from a pipe. A run is bounded (its unit's start limit; curl's own).
#
# Until now nothing backed these up: replication was the only copy, and the Pis' nightly vault-backup tarred
# /var/lib/vault, which holds no secrets (they are in Consul).
#
# The store is the Pis' own (versitygw on Gluster): this survives a lost Pi or a logical mistake, not both Pis lost -
# an off-site copy is still an open decision.
#
# Usage: task deploy:pi-backups   (production)   /   the Vagrant rehearsal: task test:pi-backups
- name: The Pis' tier-0 backups
  hosts: pis
  become: true
  gather_facts: false
  vars:
    pi_backup_bucket: pi-backups
    pi_backup_retention_days: 30
    # the newest backups kept whatever their age - retention reads the Pi's clock
    pi_backup_keep: 7
    # after CNPG's (01:30) and Velero's (02:00), before the Scylla repair window - all three in UTC, as the day the
    # script reads from last-success: on the Pis' zone (Europe/Tallinn) 02:40 was 23:40 UTC in summer (the other Pi's
    # run after midnight backed up again, the next night was skipped) and the spring change's Monday was skipped
    pi_backup_on_calendar: "*-*-* 02:40:00 UTC"
  tasks:
    - name: The S3 client - rclone, Debian's
      ansible.builtin.apt:
        name: rclone
        state: present

    - name: The backup's directory, root only
      ansible.builtin.file:
        path: /etc/pi-backup
        state: directory
        mode: '0700'

    # an empty one (a key missing from .env) would overwrite the working file, and the backups stop until the late
    # check fires a day later
    - name: Its credentials are all there
      ansible.builtin.assert:
        that:
          - backup_root_user | length > 0
          - backup_root_password | length > 0
          - postgres_admin_password | length > 0
          - keycloak_admin_password | length > 0
        fail_msg: "REFUSED: an empty credential (BACKUP_ACCESS_KEY, BACKUP_SECRET_KEY, KEYCLOAK_DB_PASSWORD or KEYCLOAK_ADMIN_PASSWORD in .env)"
        quiet: true
      no_log: true

    - name: Its credentials, root only (the store's, Postgres', Keycloak's admin)
      ansible.builtin.copy:
        dest: /etc/pi-backup/env
        mode: '0600'
        content: |
          RCLONE_CONFIG_STORE_TYPE=s3
          RCLONE_CONFIG_STORE_PROVIDER=Other
          RCLONE_CONFIG_STORE_ENDPOINT=http://127.0.0.1:9000
          RCLONE_CONFIG_STORE_ACCESS_KEY_ID={{ backup_root_user }}
          RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY={{ backup_root_password }}
          PGPASSWORD={{ postgres_admin_password }}
          KC_ADMIN_PASSWORD={{ keycloak_admin_password }}
          PI_BACKUP_BUCKET={{ pi_backup_bucket }}
          PI_BACKUP_RETENTION_DAYS={{ pi_backup_retention_days }}
          PI_BACKUP_KEEP={{ pi_backup_keep }}
      no_log: true

    - name: The backup script
      ansible.builtin.copy:
        dest: /usr/local/sbin/pi-tier0-backup.sh
        mode: '0700'
        content: |
          #!/bin/bash
          # The Pis' tier-0 data into the Pi store - setup-pi-backups.yml (ops) explains it. Credentials from the unit's
          # EnvironmentFile. Exit 0 also when today's backup is done (the other Pi's, or this one's earlier).
          set -euo pipefail
          : "${PI_BACKUP_BUCKET:?no bucket}" "${PI_BACKUP_RETENTION_DAYS:?no retention}"
          : "${PI_BACKUP_KEEP:?no count of backups to keep}"
          # one Pi at a time (Consul's lock: the other's run waits for it, then finds the day done). The run's failure
          # passed on (by default the lock exits 0 whatever its child did - the unit green); the wait bounded: a hung
          # run holding it fails this one with time left in the unit's budget, rather than starving it
          if [ -z "${PI_BACKUP_LOCKED:-}" ]; then
            PI_BACKUP_LOCKED=1 exec consul lock -child-exit-code -timeout=30m pi-tier0-backup "$0"
          fi
          # a day with a success is done - PI_BACKUP_EVEN_TODAY=1 backs up again (a test, a backup by hand). The day is
          # UTC's, as the timer's. Any failed read is "none": the run goes on to a backup, which fails if the store is
          # what failed - never a day skipped on a read error
          last=$(rclone cat "store:$PI_BACKUP_BUCKET/last-success" 2> /dev/null || true)
          if [ "${last:0:8}" = "$(date -u +%Y%m%d)" ] && [ -z "${PI_BACKUP_EVEN_TODAY:-}" ]; then
            echo "today's backup is done (last-success $last)"; exit 0
          fi
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          work=$(mktemp -d /var/backups/pi-tier0.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          # Consul: Vault's data and Patroni's state
          consul snapshot save "$work/consul.snap" > /dev/null
          consul snapshot inspect "$work/consul.snap" > /dev/null
          # every Patroni database through HAProxy (the primary), and the roles
          P=(-h 127.0.0.1 -p 5000 -U postgres)
          dbs=$(psql "${P[@]}" -d postgres -Atc "select datname from pg_database where not datistemplate and datname <> 'postgres'")
          [ -n "$dbs" ] || { echo "no database to dump"; exit 1; }
          for db in $dbs; do
            pg_dump "${P[@]}" --format=custom --file "$work/pg-$db.dump" "$db"
            pg_restore --list "$work/pg-$db.dump" > /dev/null
          done
          pg_dumpall "${P[@]}" --globals-only > "$work/pg-globals.sql"
          # Keycloak's realms (users are in its database dump). Best effort: Keycloak down, or its admin's password
          # changed, must not throw away the Consul and Postgres backups above - they are uploaded, and the run then
          # fails without a new last-success (the late check reports it)
          keycloak() {
            local kc=http://127.0.0.1:8080 token realms realm
            # the password on curl's stdin, the token in a config curl reads from a pipe (printf is bash's own)
            token=$(printf '%s' "$KC_ADMIN_PASSWORD" | curl -fsS --max-time 30 -d client_id=admin-cli -d username=admin \
              --data-urlencode password@- -d grant_type=password "$kc/realms/master/protocol/openid-connect/token" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])') || return 1
            kc_auth() { printf 'header = "Authorization: Bearer %s"\n' "$token"; }
            realms=$(curl -fsS --max-time 30 -K <(kc_auth) "$kc/admin/realms" \
              | python3 -c 'import json, sys; print(" ".join(r["realm"] for r in json.load(sys.stdin)))') || return 1
            [ -n "$realms" ] || return 1
            for realm in $realms; do
              curl -fsS --max-time 120 -X POST -K <(kc_auth) \
                "$kc/admin/realms/$realm/partial-export?exportClients=true&exportGroupsAndRoles=true" \
                > "$work/keycloak-$realm.json" || return 1
              python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["realm"] == sys.argv[2]' \
                "$work/keycloak-$realm.json" "$realm" || return 1
            done
          }
          kc_ok=yes
          if ! keycloak; then
            kc_ok=no
            rm -f "$work"/keycloak-*.json
            echo "the Keycloak realm export failed - the rest is backed up, no last-success" > "$work/KEYCLOAK-EXPORT-FAILED"
          fi
          # into the store, compared
          rclone mkdir "store:$PI_BACKUP_BUCKET"
          rclone copy "$work" "store:$PI_BACKUP_BUCKET/$ts"
          rclone check "$work" "store:$PI_BACKUP_BUCKET/$ts" --one-way
          [ "$kc_ok" = yes ] || { echo "PI TIER-0 BACKUP $ts PARTIAL: Keycloak's realms missing"; exit 1; }
          # the old ones gone - by their own names (UTC), the newest $PI_BACKUP_KEEP kept whatever the clock says
          cutoff=$(date -u -d "-${PI_BACKUP_RETENTION_DAYS} days" +%Y%m%dT%H%M%SZ)
          mapfile -t backups < <(rclone lsf --dirs-only "store:$PI_BACKUP_BUCKET" | sed 's#/$##' \
            | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort)
          total=$(printf '%s\n' "${backups[@]}" | grep -c .)  # (not the array's length operator: Jinja reads it)
          for i in "${!backups[@]}"; do
            if [ $(( total - i )) -gt "$PI_BACKUP_KEEP" ] && [[ "${backups[$i]}" < "$cutoff" ]]; then
              # gone meanwhile - another run purged it first (the lock lost with a dropped Consul session) - is
              # purged all the same; still listed, or the listing failing, fails the run
              if ! rclone purge "store:$PI_BACKUP_BUCKET/${backups[$i]}"; then
                listing=$(rclone lsf --dirs-only "store:$PI_BACKUP_BUCKET")
                if grep -qx "${backups[$i]}/" <<< "$listing"; then
                  echo "the old copy ${backups[$i]} could not be purged"; exit 1
                fi
              fi
            fi
          done
          # then the time of this success
          echo "$ts" | rclone rcat "store:$PI_BACKUP_BUCKET/last-success"
          echo "PI TIER-0 BACKUP $ts: $(ls "$work" | tr '\n' ' ')"

    - name: The service and its daily timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: '0644'
        content: "{{ item.content }}"
      loop:
        - name: pi-tier0-backup.service
          content: |
            [Unit]
            Description=The Pis' tier-0 data into the Pi backup store
            After=network-online.target consul.service patroni.service keycloak.service versitygw.service
            [Service]
            Type=oneshot
            EnvironmentFile=/etc/pi-backup/env
            ExecStart=/usr/local/sbin/pi-tier0-backup.sh
            # a hung run must not block the next day's (the late-backup check reports it)
            TimeoutStartSec=3600
        - name: pi-tier0-backup.timer
          content: |
            [Unit]
            Description=The Pis' tier-0 backup, daily
            [Timer]
            OnCalendar={{ pi_backup_on_calendar }}
            RandomizedDelaySec=300
            Persistent=true
            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"

    - name: The timer on
      ansible.builtin.systemd:
        name: pi-tier0-backup.timer
        enabled: true
        state: started
        daemon_reload: true
