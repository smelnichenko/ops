---
# The Pis' tier-0 backup kept off this server's Consul agent while it goes away (setup-consul's restart, the reboot in
# upgrade-pi-packages): its timer stopped - registered as _tier0_timer, the caller starts it again where it ran, whatever
# happens - then no backup holding its Consul lock (tier0-backup-lock.yml). The lock's read stays the last task: the
# caller's restart or reboot follows it at once.

# its timer stopped here first: a backup it started between the lock's read and the restart took the lock
# through this server's agent, and the restart ended it (started again in always, where it ran)
- name: The tier-0 backup's timer here, before its lock is read
  ansible.builtin.systemd_service:
    name: pi-tier0-backup.timer
  register: _tier0_timer
  # a host without the timer reads LoadState not-found (no failure); a read that fails is no timer stopped - it stops here
  check_mode: false  # a read

- name: The tier-0 backup's timer stopped for the restart
  ansible.builtin.systemd_service:
    name: pi-tier0-backup.timer
    state: stopped
  when: _tier0_timer.status.ActiveState | default('') == 'active'

- name: The tier-0 lock read (tasks/tier0-backup-lock.yml)
  ansible.builtin.include_tasks: tier0-backup-lock.yml
