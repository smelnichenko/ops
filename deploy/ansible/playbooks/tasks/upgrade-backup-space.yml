---
# Room for a Wave 0 copy before it is made: local_dir's filesystem must have free at least the sources' size (an upper
# bound - the archives are gzipped), one upload part (written beside the archive while it uploads) and 1 GiB - and keep
# above the kubelet's eviction floor after it (imagefs.available<15%, the higher of its two defaults: under it the
# node's pods are evicted, long before the disk is full). A tar that fills ten's root filesystem fails the backup and
# every write on the node with it. On the image store's filesystem (containerd's root: ten has one disk) the copy must
# also leave it under the kubelet's image GC threshold less 5 (read from its configz, as tasks/image-store-room.yml
# does): the merge's pre-pull refuses past that - a copy ending between 80% and 85% passed here and blocked the merge.
#
# The Pi backup store, which the copy is uploaded to, keeps 10% of its volume free after it (the gateway's own backend
# directory, from its unit on upgrade_backup_store_host): a full store stops CNPG's WAL archiving into it too.
#
# Expects: space_dirs (one or more directories on this host), local_dir, upload_part_bytes, kubeconfig,
# upgrade_backup_store_host (a Pi of the store).
- name: "Space - room in the local directory for a copy of: {{ space_dirs | join(', ') }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      src=$(du -sbc {{ space_dirs | map('quote') | join(' ') }} | tail -n 1 | cut -f1)
      need=$(( src + {{ upload_part_bytes | int }} + 1073741824 ))
      free=$(df --output=avail -B1 {{ local_dir | quote }} | tail -n 1 | tr -d ' ')
      size=$(df --output=size -B1 {{ local_dir | quote }} | tail -n 1 | tr -d ' ')
      floor=$(( size * 15 / 100 ))
      echo "sources $src bytes, need $need, free $free, the kubelet's eviction floor $floor"
      [ "$free" -ge "$need" ] || { echo "not enough room in {{ local_dir }}"; exit 1; }
      [ $(( free - need )) -ge "$floor" ] \
        || { echo "the copy would leave $(( free - need )) bytes free, under the kubelet's eviction floor $floor"; exit 1; }
      # quoted "..." by containerd 1.7, '...' by 2.x
      store=$(containerd config dump | sed -n 's/^root = .\(.*\).$/\1/p')
      [ -n "$store" ] || { echo "containerd's root unread"; exit 1; }
      if [ "$(df --output=source "$store" | tail -n 1)" = "$(df --output=source {{ local_dir | quote }} | tail -n 1)" ]; then
        high=""
        for i in 1 2 3; do
          if high=$(kubectl --kubeconfig {{ kubeconfig | quote }} --request-timeout=30s \
              get --raw "/api/v1/nodes/$(hostname)/proxy/configz" \
              | python3 -c 'import json, sys; print(int(json.load(sys.stdin)["kubeletconfig"]["imageGCHighThresholdPercent"]))'); then
            break
          fi
          high=""
          [ "$i" = 3 ] || sleep 5
        done
        [ -n "$high" ] || { echo "the kubelet's image GC threshold unread (configz, 3 tries): the room cannot be judged"; exit 1; }
        bound=$(( size * (100 - (high - 5)) / 100 ))
        echo "the image store ($store) shares this filesystem: its bound $bound bytes free (image GC at ${high}% less 5)"
        [ $(( free - need )) -ge "$bound" ] \
          || { echo "the copy would leave $(( free - need )) bytes free, past the image store's bound $bound"; exit 1; }
      fi
  register: _space
  changed_when: false
  failed_when: _space.rc != 0 or space_dirs | length == 0

- name: "Space - room in the Pi backup store for that copy, 10% of its volume kept free"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      # the gateway's own backend directory: its unit's last argument
      dir=$(systemctl show -p ExecStart --value versitygw | sed -n 's/.*argv\[\]=\([^;]*\);.*/\1/p' | awk '{print $NF}')
      [ -n "$dir" ] || { echo "the gateway's backend directory unread (its unit)"; exit 1; }
      read -r avail size < <(df --output=avail,size -B1 "$dir" | tail -n 1)
      src={{ _space.stdout | regex_findall('sources ([0-9]+) bytes') | first }}
      keep=$(( size / 10 ))
      echo "the Pi store ($dir): $avail of $size bytes free, the copy at most $src, 10% kept: $keep"
      [ $(( avail - src )) -ge "$keep" ] \
        || { echo "the Pi store would keep $(( avail - src )) bytes free, under 10% of its volume ($keep)"; exit 1; }
  delegate_to: "{{ upgrade_backup_store_host }}"
  register: _store_space
  changed_when: false
  check_mode: false  # a read: a preview runs it
