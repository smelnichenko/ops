---
# A CNPG barman base backup of {{ cluster }} (namespace {{ pg_namespace }}) named {{ cnpg_backup }}, to the object
# store the cluster archives to; it must complete. Used by postgres-base-backup.yml and the upgrade test's
# restore-check.yml.
- name: Back the cluster up now ({{ cnpg_backup }})
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Backup
      metadata: { name: "{{ cnpg_backup }}", namespace: "{{ pg_namespace }}" }
      spec:
        method: barmanObjectStore
        cluster: { name: "{{ cluster }}" }

- name: The backup completes ({{ cnpg_backup }})
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ kubeconfig }} -n {{ pg_namespace }} get backups.postgresql.cnpg.io {{ cnpg_backup }}
    -o jsonpath={.status.phase}
  register: _cnpg_backup_phase
  changed_when: false
  retries: 60
  delay: 10
  # CNPG's ended phases (its IsDone(), as the runner's BACKUP_ENDED_PHASES) - and the two it retries for ever (as the
  # runner's BACKUP_RETRIED_PHASES): a Backup failing on its WAL or its definition fails the wait at once
  until: >-
    _cnpg_backup_phase.stdout in ['completed', 'failed', 'walArchivingFailing']
    or _cnpg_backup_phase.stdout.startswith('invalid')
  failed_when: _cnpg_backup_phase.stdout != 'completed'
