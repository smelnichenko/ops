---
# Forgejo's admin made where it is missing - setup-pi-services (a new install) and setup-patroni (Postgres rebuilt from
# scratch: Forgejo migrates its schema on the first connection, no admin made) import these; one copy (two drifted
# apart once each fix had to land twice). Needs forgejo_admin_user, forgejo_admin_email, forgejo_admin_password.
- name: Check if Forgejo admin user exists
  ansible.builtin.shell: |
    set -eo pipefail
    su - forgejo -c "forgejo admin user list \
      --config /var/lib/forgejo/custom/conf/app.ini" 2>&1 \
      | awk 'NR>1 { print $2 }'
  register: _forgejo_users
  check_mode: false  # a read: a preview (--check) runs it, and what reads it
  changed_when: false

- name: Create Forgejo admin user (with retries — Forgejo can be slow to settle after first start)
  # Forgejo's CLI takes a password only as an argument (any local user reads those in /proc): the admin made with a
  # random one Forgejo makes itself (forgejo's own shell given the user and the e-mail on stdin), then its password
  # set through Forgejo's API - the random one on curl's config descriptor, the real one in the request's body on
  # stdin. A retry after the create (the user there, its random one unknown): a write:admin token from Forgejo's
  # CLI (on its stdout - no password on any argument, a throwaway's either) sets it, then every such token deleted
  # with the real password. All three on the task's stdin: templated into the script, root's shell ran $( ) and `
  # in them. Proven against Forgejo 15.0.9 (2026-10-08), the retry's token made, used and deleted
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      IFS= read -r user && IFS= read -r email && IFS= read -r pw
      conf=/var/lib/forgejo/custom/conf/app.ini
      esc() { sed 's/[\\"]/\\&/g' <<< "$1"; }
      api=http://localhost:3000/api/v1
      if out=$(printf '%s\n%s\n' "$user" "$email" | su - forgejo -c 'IFS= read -r user && IFS= read -r email &&
          exec forgejo admin user create --admin --username "$user" --email "$email" --random-password \
          --must-change-password=false --config '"$conf" 2>&1); then
        random=$(sed -n "s/^generated random password is '\(.*\)'$/\1/p" <<< "$out")
        [ -n "$random" ] || { echo "no random password in Forgejo's answer"; exit 1; }
        auth=$(printf 'user = "%s:%s"' "$(esc "$user")" "$(esc "$random")")
      elif grep -q 'already exists' <<< "$out"; then
        name="password-reset-$(python3 -c 'import secrets; print(secrets.token_hex(4))')"
        token=$(printf '%s\n%s\n' "$user" "$name" | su - forgejo -c 'IFS= read -r user && IFS= read -r name &&
          exec forgejo admin user generate-access-token --username "$user" --token-name "$name" \
          --scopes write:admin --raw --config '"$conf")
        [[ $token =~ ^[0-9a-f]{40}$ ]] || { echo "no token in Forgejo's answer"; exit 1; }
        auth=$(printf 'header = "Authorization: token %s"' "$token")
      else
        sed "s/is '.*'/is '***'/" <<< "$out"
        exit 1
      fi
      printf '%s' "$pw" | python3 -c 'import json, sys
      print(json.dumps({"login_name": sys.argv[1], "source_id": 0, "password": sys.stdin.read(),
                        "must_change_password": False}))' "$user" \
        | curl -sf --max-time 30 -o /dev/null -X PATCH -H 'Content-Type: application/json' \
            -K <(printf '%s\n' "$auth") --data @- "$api/admin/users/$user"
      # the reset tokens (this retry's, any an earlier one left) deleted with the password now set - read page by page
      # (Forgejo pages its answer: 30 a page by default, 50 at most; one on a later page was left), till a page not full
      real=$(printf 'user = "%s:%s"' "$(esc "$user")" "$(esc "$pw")")
      ids=""
      for page in $(seq 1 20); do
        got=$(curl -sf --max-time 30 -K <(printf '%s\n' "$real") "$api/users/$user/tokens?limit=50&page=$page" \
          | python3 -c '
      import json, sys
      tokens = json.load(sys.stdin)
      print(len(tokens), " ".join(str(t["id"]) for t in tokens if t["name"].startswith("password-reset-")))')
        ids+=" ${got#* }"
        [ "${got%% *}" -eq 50 ] || break
        [ "$page" -lt 20 ] || { echo "over 1000 tokens of $user - not all read"; exit 1; }
      done
      for id in $ids; do
        curl -sf --max-time 30 -o /dev/null -X DELETE -K <(printf '%s\n' "$real") "$api/users/$user/tokens/$id"
      done
    stdin: "{{ forgejo_admin_user }}\n{{ forgejo_admin_email }}\n{{ forgejo_admin_password }}"
  register: _forgejo_admin_create
  retries: 5
  delay: 5
  until: _forgejo_admin_create.rc == 0
  when: forgejo_admin_user not in (_forgejo_users.stdout_lines | default([]))
  changed_when: true
  no_log: true  # the password on stdin: a module's arguments are logged on its host
