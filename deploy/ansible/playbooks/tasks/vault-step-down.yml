---
# Vault's active node handed to the other Pi's standby before this server's Consul agent goes away - setup-consul's
# restart of it, upgrade-pi-packages' reboot of its Pi. Expects: _other_pi (the other Pi), consul_handover_seconds (how
# long the handover may take), the pis group; on the third server (no Vault) nothing is done.

# Vault on the Pi being restarted: running, it may be the active node (a first install has none yet)
- name: Vault on this Pi
  ansible.builtin.systemd:
    name: vault
  register: _vault_unit
  when: inventory_hostname in groups['pis']

# Vault's storage is this Pi's Consul agent: its active node, here, would lose its lock with the restart and
# Vault be without one until the other Pi's took over - handed over first, to a standby there, unsealed. Run
# on this Pi (up until its restart; setup-vault-pi keeps the root token on both - pinned to pi1, it failed while
# pi1 was down), against both Pis' addresses. A Vault running here whose status is not read is refused, never taken for a standby; each read
# bounded - the CLI's own are a 60 s timeout, retried twice - and the wait by the clock
- name: Vault stepped down here first - the other Pi's active
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      export VAULT_CACERT=/etc/vault.d/tls/ca-cert.pem VAULT_CLIENT_TIMEOUT=5 VAULT_MAX_RETRIES=0
      here=https://{{ hostvars[inventory_hostname]['ansible_host'] }}:8200
      other=https://{{ hostvars[_other_pi]['ansible_host'] }}:8200
      # a status: its JSON, unsealed (exit 0) or sealed (2); none (unreachable, timed out) reads UNREAD
      st() { VAULT_ADDR=$1 vault status -format=json 2> /dev/null; }
      get() { python3 -c 'import json, sys
      try:
          print(json.loads(sys.stdin.read()).get(sys.argv[1]))
      except ValueError:
          print("UNREAD")' "$1"; }
      self=$(st $here | get is_self)
      if [ "$self" = UNREAD ]; then
        echo "REFUSED: Vault runs on {{ inventory_hostname }} and its status was not read ($here)"
        exit 1
      fi
      if [ "$self" != True ]; then echo "VAULT NOT ACTIVE HERE"; exit 0; fi
      o=$(st $other)
      if [ "$(get sealed <<< "$o")" != False ] || [ "$(get ha_enabled <<< "$o")" != True ]; then
        echo "REFUSED: Vault is active on {{ inventory_hostname }} and {{ _other_pi }}'s is not standing by" \
          "(sealed or unreachable)"
        exit 1
      fi
      if ! VAULT_TOKEN=$(cat /etc/vault-unseal/root-token 2> /dev/null) || [ -z "$VAULT_TOKEN" ]; then
        echo "REFUSED: no root token on {{ inventory_hostname }} (/etc/vault-unseal/root-token) to step Vault" \
          "down with - step it down by hand (VAULT_ADDR=$here vault operator step-down), then run again"
        exit 1
      fi
      export VAULT_TOKEN
      if ! VAULT_ADDR=$here vault operator step-down > /dev/null; then
        echo "REFUSED: Vault's step-down on {{ inventory_hostname }} failed"
        exit 1
      fi
      # the wait on the host's uptime (a wall-clock step - chrony's on a Pi without a clock - moves SECONDS)
      # hundredths: whole seconds cut a wait begun late in a second to just over its length less one
      up() { local u; read -r u _ < /proc/uptime; u=${u/./}; echo "$((10#$u))"; }
      end=$(( $(up) + {{ consul_handover_seconds }} * 100 ))
      while [ "$(up)" -lt "$end" ]; do
        if [ "$(st $here | get is_self)" != True ] && [ "$(st $other | get is_self)" = True ]; then
          echo "STEPPED DOWN: {{ _other_pi }}'s Vault active"
          exit 0
        fi
        sleep 1
      done
      echo "REFUSED: Vault's step-down not taken in {{ consul_handover_seconds }} s"
      exit 1
  register: _vault_handover
  changed_when: "'STEPPED DOWN' in _vault_handover.stdout"
  when:
    - inventory_hostname in groups['pis']
    - _vault_unit.status.ActiveState | default('') == 'active'
