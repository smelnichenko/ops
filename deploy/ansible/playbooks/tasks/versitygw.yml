---
# versitygw — stateless S3 gateway over the shared Gluster backup volume.
#
# Replaces the MinIO xl-single + consul-lock arrangement. Each object is a plain
# file on the POSIX (Gluster) backend, so there is NO cluster-state DB and TWO
# gateways can serve the same volume concurrently without the dual-writer hazard
# that forced MinIO's consul lock. Therefore: no consul lock, and versitygw runs
# on BOTH Pis at once — keepalived only routes the VIP to a healthy gateway.
# Object metadata uses a --sidecar directory of regular files on Gluster,
# avoiding the user.* xattr path that GlusterFS-over-FUSE handles poorly.
#
# Migration history: MinIO's xl-single on-disk format is NOT readable by
# versitygw, so the 2026-06-27 cutover was an S3-level `mc mirror` (object
# keys/bytes preserved, so kopia/barman/scylla repositories kept working), not a
# format swap. MinIO is fully retired; versitygw owns :9000 on both Pis.
#
# Expects: the minio user (uid 9000, owns the Gluster mount), backup_root_user /
# backup_root_password, forgejo_arch, rclone on PATH, and the Gluster backup volume
# mounted at vgw_gluster_mount.

- name: Set versitygw default vars
  ansible.builtin.set_fact:
    vgw_version: "{{ vgw_version | default('1.6.0') }}"
    vgw_port: "{{ vgw_port | default('9000') }}"
    # self-sufficient so a targeted `--tags versitygw` run (which skips the MinIO
    # phase that normally sets forgejo_arch) still resolves the package arch.
    forgejo_arch: "{{ forgejo_arch | default('arm64' if ansible_architecture == 'aarch64' else 'amd64') }}"
    vgw_gluster_mount: "{{ vgw_gluster_mount | default('/var/lib/minio/data') }}"
    vgw_backend_dir: "{{ vgw_backend_dir | default('/var/lib/minio/data/buckets') }}"
    vgw_sidecar_dir: "{{ vgw_sidecar_dir | default('/var/lib/minio/data/.sidecar') }}"

- name: The versitygw binary (absent on a first run)
  ansible.builtin.stat:
    path: /usr/bin/versitygw
  register: _vgw_binary

- name: Check installed versitygw version
  check_mode: false
  ansible.builtin.command: versitygw --version
  register: _vgw_installed
  changed_when: false
  when: _vgw_binary.stat.exists

# the version itself, compared whole (a substring test took 1.8.0 for installed in 11.8.0, or in a build number)
- name: The installed versitygw's version (empty when none)
  ansible.builtin.set_fact:
    _installed_version: "{{ _vgw_installed.stdout | default('') | regex_search('[0-9]+[.][0-9]+[.][0-9]+') | default('', true) }}"

# A deb install moves the version either way: a run with the old default after an upgrade would go back (the
# upgrade moves the default in the same change)
- name: No downgrade - the installed versitygw is not newer than {{ vgw_version }}
  ansible.builtin.assert:
    that: _installed_version == '' or _installed_version is version(vgw_version, '<=')
    fail_msg: "REFUSED: versitygw {{ _installed_version }} is installed; this run would install {{ vgw_version }} - set vgw_version"
    quiet: true

# The package's sha256 per version and arch (the release's checksums.txt, its assets' digests and the files' own sums
# agreed, 2026-10-09): installed as root on both Pis, never unchecked. A new version adds its line.
- name: The versitygw packages' checksums
  ansible.builtin.set_fact:
    vgw_checksums:
      "1.6.0":
        amd64: e6973164fae36318c9965c7f280360a16cf1392fc494c42a07b1879d1bcab8e3
        arm64: c93371db77ee8ded21b27c60a7d60362e5fc7d8119b9d7887434ef17715b96b6
      "1.8.0":
        amd64: 75fbd1d2f6b640e5d7cb7ac596286de02972ece0ca7dae2c74f66ade914fcc9f
        arm64: 06fcdf9ef14c0f7f8b000e17bd5409903f79eb602f6105ec4eb7d725c1ac3b4b

- name: A checksum for versitygw {{ vgw_version }} on {{ forgejo_arch }}
  ansible.builtin.assert:
    that: forgejo_arch in vgw_checksums[vgw_version] | default({})
    fail_msg: "REFUSED: no sha256 for versitygw {{ vgw_version }} ({{ forgejo_arch }}) in vgw_checksums - add it first"
    quiet: true

# fetched in a preview too (a file in apt's way, nothing installed): its checksum is checked before the real run
- name: The package's directory
  ansible.builtin.file:
    path: /var/cache/versitygw
    state: directory
    mode: '0755'
  check_mode: false
  when: _installed_version != vgw_version

- name: Download versitygw {{ vgw_version }}, its sha256 checked
  ansible.builtin.get_url:
    url: "https://github.com/versity/versitygw/releases/download/v{{ vgw_version }}/versitygw_{{ vgw_version }}_linux_{{ forgejo_arch }}.deb"
    dest: "/var/cache/versitygw/versitygw_{{ vgw_version }}_linux_{{ forgejo_arch }}.deb"
    checksum: "sha256:{{ vgw_checksums[vgw_version][forgejo_arch] }}"
    mode: '0644'
  check_mode: false
  when: _installed_version != vgw_version

- name: Install versitygw {{ vgw_version }}
  ansible.builtin.apt:
    deb: "/var/cache/versitygw/versitygw_{{ vgw_version }}_linux_{{ forgejo_arch }}.deb"
  when: _installed_version != vgw_version

# Backend (buckets) and sidecar (metadata) live on the Gluster volume so both
# gateways share them; iam-dir is local because the root key comes from the env
# file (no shared IAM state to coordinate).
- name: Create versitygw backend, sidecar (on Gluster) and local iam dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: minio
    group: minio
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vgw_backend_dir }}", mode: '0750' }
    - { path: "{{ vgw_sidecar_dir }}", mode: '0750' }
    - { path: /var/lib/versitygw/iam, mode: '0700' }

- name: Create /etc/versitygw (parent dir for the env file)
  ansible.builtin.file:
    path: /etc/versitygw
    state: directory
    owner: minio
    group: minio
    mode: '0750'

- name: Write versitygw environment file (root S3 key, 0400 minio:minio)
  ansible.builtin.copy:
    dest: /etc/versitygw/env
    owner: minio
    group: minio
    mode: '0400'
    content: |
      ROOT_ACCESS_KEY={{ backup_root_user }}
      ROOT_SECRET_KEY={{ backup_root_password }}
  no_log: true
  register: _vgw_env

- name: Install versitygw systemd unit (stateless, runs on every Pi, no consul lock)
  ansible.builtin.copy:
    dest: /etc/systemd/system/versitygw.service
    mode: '0644'
    content: |
      [Unit]
      Description=versitygw S3 gateway (stateless, over Gluster)
      After=network-online.target
      Wants=network-online.target
      # Delegate the mount dependency to systemd so versitygw never serves an
      # empty pre-mount directory on boot.
      RequiresMountsFor={{ vgw_gluster_mount }}
      [Service]
      Type=simple
      User=minio
      Group=minio
      EnvironmentFile=/etc/versitygw/env
      # No consul lock: object=file on a POSIX (Gluster) backend is safe across
      # concurrent gateways, unlike MinIO xl-single's cluster state. --sidecar
      # keeps metadata as regular files on Gluster (no user.* xattr dependency).
      ExecStart=/usr/bin/versitygw --port :{{ vgw_port }} --health /health \
        --iam-dir /var/lib/versitygw/iam \
        posix --sidecar {{ vgw_sidecar_dir }} {{ vgw_backend_dir }}
      Restart=on-failure
      RestartSec=10
      [Install]
      WantedBy=multi-user.target
  register: _vgw_unit

- name: Enable + start versitygw (active on both Pis — no active-passive gating)
  ansible.builtin.systemd:
    name: versitygw
    enabled: true
    state: started
    daemon_reload: true

# A new package replaces the binary under the running gateway, which keeps serving the old one ("(deleted)"): the
# upgrade restarted nothing, and a run that failed between install and restart left no trace for the next. So the
# running process is compared with the installed binary, whatever this run changed.
- name: The binary the running versitygw executes
  check_mode: false
  ansible.builtin.shell: |
    set -euo pipefail
    pid=$(systemctl show -p MainPID --value versitygw)
    if [ "$pid" = 0 ]; then echo "not running"; else readlink /proc/$pid/exe; fi
  args:
    executable: /bin/bash
  register: _vgw_running_exe
  changed_when: false

- name: Facts - does versitygw need a restart here
  ansible.builtin.set_fact:
    _vgw_restart: "{{ _vgw_unit is changed or _vgw_env is changed or _vgw_running_exe.stdout != '/usr/bin/versitygw' }}"

# the Pi holding the VIP restarts last: its gateway's restart then moves the VIP once, to a gateway restarted already
- name: Whether this Pi holds the VIP
  ansible.builtin.command: ip -o addr show to {{ keepalived_vip }}/32
  register: _vgw_vip
  changed_when: false
  check_mode: false

- name: Facts - the VIP here or not
  ansible.builtin.set_fact:
    _vgw_vip_here: "{{ _vgw_vip.stdout | length > 0 }}"

# one Pi at a time, each serving again before the next: both gateways down at once is the backup store down. A failed
# item does not stop the loop, so each restart first refuses to take down the last serving gateway: only while the
# other Pi's serves, or this one's does not. Serving again is its S3 API answering (a bucket listing with the gateway
# root key): /health answers before it does
- name: Restart versitygw where needed - one Pi at a time, each serving S3 before the next  # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -euo pipefail
    up() { curl -fsS -o /dev/null --max-time 10 "http://$1:{{ vgw_port }}/health"; }
    s3() (
      set -a; . /etc/versitygw/env; set +a
      home=$(mktemp -d); trap 'rm -rf "$home"' EXIT
      HOME=$home RCLONE_CONFIG="" RCLONE_CONFIG_VGW_TYPE=s3 RCLONE_CONFIG_VGW_PROVIDER=Other \
        RCLONE_CONFIG_VGW_ENDPOINT=http://localhost:{{ vgw_port }} RCLONE_CONFIG_VGW_ACCESS_KEY_ID="$ROOT_ACCESS_KEY" \
        RCLONE_CONFIG_VGW_SECRET_ACCESS_KEY="$ROOT_SECRET_KEY" rclone lsd vgw: > /dev/null 2>&1
    )
    if up localhost && ! up {{ _peer }}; then
      echo "REFUSED on {{ item }}: versitygw serves here but not on the other Pi ({{ _peer }})" >&2; exit 1
    fi
    systemctl restart versitygw
    for _ in $(seq 30); do
      if up localhost && s3; then
        exit 0
      fi
      sleep 2
    done
    echo "versitygw on {{ item }} not serving S3 60 s after its restart" >&2
    exit 1
  args:
    executable: /bin/bash
  vars:
    _peer: "{{ hostvars[groups['pis'] | difference([item]) | first]['ansible_host'] }}"
  delegate_to: "{{ item }}"
  loop: >-
    {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_vgw_restart', 'defined') | selectattr('_vgw_restart')
       | sort(attribute='_vgw_vip_here') | map(attribute='inventory_hostname') | list }}
  run_once: true
  changed_when: true

- name: Versitygw serves, on the installed binary, version {{ vgw_version }}
  when: not ansible_check_mode
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsS -o /dev/null --max-time 10 http://localhost:{{ vgw_port }}/health
    pid=$(systemctl show -p MainPID --value versitygw)
    echo "running $(readlink /proc/$pid/exe)"
    versitygw --version
  args:
    executable: /bin/bash
  register: _vgw_serving
  changed_when: false
  retries: 20
  delay: 3
  until: >-
    _vgw_serving.rc == 0 and 'running /usr/bin/versitygw' in _vgw_serving.stdout_lines
    and (_vgw_serving.stdout | regex_findall('[0-9]+[.][0-9]+[.][0-9]+')) == [vgw_version]

# Buckets are top-level dirs, but create them via the S3 API so versitygw also
# records the bucket in its sidecar metadata (idempotent).
- name: Ensure backup buckets exist (idempotent, via the gateway)
  ansible.builtin.shell: |
    set -ea; . /etc/versitygw/env; set +a
    # the rclone remote vgw is configured by environment alone (no config file); mkdir of an existing bucket is a no-op
    # a private HOME: nothing of rclone under a fixed name in the shared temp directory
    home=$(mktemp -d); trap 'rm -rf "$home"' EXIT
    export HOME=$home RCLONE_CONFIG="" RCLONE_CONFIG_VGW_TYPE=s3 RCLONE_CONFIG_VGW_PROVIDER=Other \
      RCLONE_CONFIG_VGW_ENDPOINT=http://localhost:{{ vgw_port }} \
      RCLONE_CONFIG_VGW_ACCESS_KEY_ID="$ROOT_ACCESS_KEY" RCLONE_CONFIG_VGW_SECRET_ACCESS_KEY="$ROOT_SECRET_KEY"
    for b in velero pg-dump postgres-backups scylla-backups etcd-backups; do
      rclone mkdir "vgw:$b"
    done
  register: _vgw_buckets
  # /health can answer 200 before the S3 API is ready to serve bucket ops, so
  # let the create itself be the readiness gate — retry until it's accepted.
  until: _vgw_buckets.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  no_log: true
  run_once: true
  delegate_to: "{{ groups['pis'] | first }}"
