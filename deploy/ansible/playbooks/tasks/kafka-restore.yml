---
# A Kafka dump from the Pi store produced back into its topics: a Job built from the backup CronJob's own pod (its images,
# its store keys, its resources, its labels - so its network policy reaches the store - and its annotations: in the mesh
# with a native sidecar, Kafka's 9092 taking mTLS only): the dump fetched
# (kafka_dump: a dump's UTC timestamp, or newest - the newest complete one holding messages, its DONE there; a store
# read that fails stops it) and PINNED in the store (the prune never removes it - the operator unpins it once Kafka is
# whole: task deploy:kafka-backup-unpin, the marker says so), then the chart's restore.sh
# (the console producer; a keyed message on its partition again) - kafka_topics (space-separated) restores those alone.
# A dump of 0 messages is refused (kafka_allow_empty=true restores one). restore.sh checks the dump against itself, and
# refuses a topic missing, of other partitions, or holding other messages (kafka_force=true produces anyway), and a
# consumer group live on a restored topic; it moves the dump's groups to the end after (kafka_reset_groups=false leaves
# them). Never two restores at once, nor one beside a dump: the nightly dump held off for the restore's span by the lock
# its CronJob mounts (its name read from the CronJob: a chart without it refuses the restore), kept when the restore
# failed (a Kafka half restored: a dump now would capture the half - KafkaBackupRestoreLockStale says so). Waited for
# by the clock; its log must say what it restored. After it, the store's BASELINE for the topics restored (kafka_topics,
# or all): the next dumps compare them with dumps from now on (the backup's guard), every other topic as before. The Job
# removed once it succeeded. Sets kafka_restored (restore.sh's last line) and kafka_restored_from (the dump).
#
# Expects: kubectl; kafka_dump; kafka_namespace (default schnappy-production); kafka_topics (default: every topic).
- name: The backup CronJob's pod (the restore Job is built from it)
  ansible.builtin.command: >-
    {{ kubectl }} -n {{ kafka_namespace | default('schnappy-production') }}
    get cronjob {{ kafka_namespace | default('schnappy-production') }}-kafka-backup -o json
  register: _kr_cronjob
  changed_when: false

- name: No other restore running (two would produce every message twice)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      {{ kubectl }} -n {{ kafka_namespace | default('schnappy-production') }} get jobs -o json \
        | python3 -c 'import json, sys; print(" ".join(j["metadata"]["name"] for j in json.load(sys.stdin)["items"]
      if j["metadata"]["name"].startswith("kafka-restore-") and not (j.get("status", {}).get("succeeded") or j.get("status", {}).get("failed"))))'
  register: _kr_running
  changed_when: false
  failed_when: _kr_running.rc != 0 or _kr_running.stdout | trim | length > 0

- name: The restore's lock as the backup CronJob mounts it (its dump refuses while that ConfigMap is there)
  ansible.builtin.set_fact:
    _kr_lock: >-
      {{ ((_kr_cronjob.stdout | from_json).spec.jobTemplate.spec.template.spec.volumes | selectattr('name', 'eq', 'restoring')
          | map(attribute='configMap') | map(attribute='name') | first) | default('') }}

- name: The backup CronJob holds the lock's mount - else no restore (its dump would run beside it)
  ansible.builtin.assert:
    that: _kr_lock | length > 0
    fail_msg: "the backup CronJob mounts no restoring ConfigMap - its chart predates the restore's lock: not restored"
    quiet: true

- name: The restore Job
  vars:
    _ns: "{{ kafka_namespace | default('schnappy-production') }}"
    _pod: "{{ (_kr_cronjob.stdout | from_json).spec.jobTemplate.spec.template }}"
    _dump_c: "{{ _pod.spec.initContainers | selectattr('name', 'eq', 'dump') | first }}"
    _upload_c: "{{ _pod.spec.containers | selectattr('name', 'eq', 'upload') | first }}"
    _which: "{{ kafka_dump | mandatory }}"
  ansible.builtin.set_fact:
    _kr_name: "kafka-restore-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"
    _kr_job:
      apiVersion: batch/v1
      kind: Job
      metadata:
        namespace: "{{ _ns }}"
        labels: "{{ _pod.metadata.labels }}"
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 3600
        template:
          metadata:
            labels: "{{ _pod.metadata.labels }}"
            annotations: "{{ _pod.metadata.annotations | dict2items | rejectattr('key', 'match', '^checksum/') | items2dict }}"
          spec:
            restartPolicy: Never
            serviceAccountName: "{{ _pod.spec.serviceAccountName | default('default') }}"
            automountServiceAccountToken: false
            securityContext: "{{ _pod.spec.securityContext }}"
            # the CronJob's, its scratch as large as its dump (restore.sh stages a partition's messages there; the
            # CronJob's own is bounded for the upload)
            volumes: "{{ _pod.spec.volumes | rejectattr('name', 'eq', 'tmp') | list + [{'name': 'tmp', 'emptyDir': {'sizeLimit': '2Gi'}}] }}"
            initContainers:
              - name: fetch
                image: "{{ _upload_c.image }}"
                env: "{{ _upload_c.env }}"
                resources: "{{ _upload_c.resources }}"
                securityContext: "{{ _upload_c.securityContext }}"
                # the dump container's own mounts: its dump directory writable, its scratch, its scripts (unused here)
                volumeMounts: "{{ _dump_c.volumeMounts }}"
                command:
                  - sh
                  - -c
                  - |
                    set -eu
                    d={{ _which }}
                    empty={{ 'yes' if (kafka_allow_empty | default(false) | bool) else 'no' }}
                    # a store read that fails stops it - never read as "not complete" or "empty", which would pass over
                    # the newest dump for an older one
                    if [ "$d" = newest ]; then
                      d=""
                      dirs=$(rclone lsf --dirs-only "$STORE/") || { echo "listing $STORE failed"; exit 1; }
                      for n in $(printf '%s\n' "$dirs" | sed 's#/$##' | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort -r || true); do
                        files=$(rclone lsf --files-only --max-depth 1 "$STORE/$n/") || { echo "listing $STORE/$n failed"; exit 1; }
                        printf '%s\n' "$files" | grep -qxF DONE || continue
                        # the newest holding messages: a Kafka that lost them dumped 0 since
                        done_line=$(rclone cat "$STORE/$n/DONE") || { echo "reading $STORE/$n/DONE failed"; exit 1; }
                        m=$(printf '%s\n' "$done_line" | awk 'NR == 1 { print $4 }')
                        [ "$empty" = yes ] || [ "${m:-0}" -gt 0 ] || continue
                        d=$n; break
                      done
                      [ -n "$d" ] || { echo "no complete dump holding messages in $STORE"; exit 1; }
                    fi
                    echo "$d" | grep -qE '^[0-9]{8}T[0-9]{6}Z$' || { echo "not a dump's name: $d"; exit 1; }
                    rclone copy "$STORE/$d" "/dump/$d" || { echo "fetching $d failed"; exit 1; }
                    [ -f "/dump/$d/DONE" ] || { echo "the dump $d has no DONE: incomplete, not restored"; exit 1; }
                    m=$(awk 'NR == 1 { print $4 }' "/dump/$d/DONE")
                    [ "$empty" = yes ] || [ "${m:-0}" -gt 0 ] || { echo "the dump $d holds 0 messages: not restored (kafka_allow_empty=true restores it)"; exit 1; }
                    # its source pinned: the prune never removes it (the nights after a restore dump what it brought back) -
                    # until the operator unpins it, Kafka whole again: the marker says when, why and how
                    printf '%s\nwhy the source of a restore (ops tasks/kafka-restore.yml)\nunpin task deploy:kafka-backup-unpin -- -e kafka_dump=%s\n' \
                      "$(date -u +%Y%m%dT%H%M%SZ)" "$d" | rclone rcat "$STORE/$d/PINNED" || { echo "pinning $d failed"; exit 1; }
                    echo "fetched $d ($m messages), pinned"
            containers:
              - name: restore
                image: "{{ _dump_c.image }}"
                env: >-
                  {{ _dump_c.env + [{'name': 'TOPICS', 'value': kafka_topics | default('')},
                                    {'name': 'FORCE', 'value': '1' if (kafka_force | default(false) | bool) else ''},
                                    {'name': 'RESET_GROUPS', 'value': 'yes' if (kafka_reset_groups | default(true) | bool) else 'no'}] }}
                resources: "{{ _dump_c.resources }}"
                securityContext: "{{ _dump_c.securityContext }}"
                volumeMounts: "{{ _dump_c.volumeMounts }}"
                command: [bash, -c, 'bash /scripts/restore.sh "/dump/$(ls /dump)"']

# the nightly dump refused for the restore's span: the backup CronJob mounts the lock (optional) and its dump stops while
# the ConfigMap is there - a dump of a Kafka half restored would be pruned in as the newest complete one. Made before the
# Job by create (one already there is another restore's, or a stale one to look at - never removed by this run), not
# Velero's (a DR restore would bring it back unseen), a dump not yet finished refused, removed after - by the run that
# made it, and only when the restore succeeded or never started: a failed restore keeps it (KafkaBackupRestoreLockStale)
- name: The restore, the nightly dump held off for its span
  block:
    - name: The restoring ConfigMap made (not Velero's) - the nightly dump refuses while it is there
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          k="{{ kubectl }} -n {{ kafka_namespace | default('schnappy-production') }}"
          $k create configmap {{ _kr_lock }} --from-literal=since="$(date -u +%Y%m%dT%H%M%SZ)" --dry-run=client -o json \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); d["metadata"]["labels"] = {"velero.io/exclude-from-backup": "true"}; print(json.dumps(d))' \
            | $k create -f - > /dev/null
      register: _kr_locked
      changed_when: true

    - name: No dump unfinished (one started before the ConfigMap would read Kafka as the restore fills it)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          {{ kubectl }} -n {{ kafka_namespace | default('schnappy-production') }} get jobs -o json \
            | python3 -c 'import json, sys; print(" ".join(j["metadata"]["name"] for j in json.load(sys.stdin)["items"]
          if any(o.get("kind") == "CronJob" and o.get("name", "").endswith("-kafka-backup") for o in j["metadata"].get("ownerReferences", []))
          and not any(c.get("type") in ("Complete", "Failed") and c.get("status") == "True" for c in j.get("status", {}).get("conditions", []))))'
      register: _kr_dumping
      changed_when: false
      failed_when: _kr_dumping.rc != 0 or _kr_dumping.stdout | trim | length > 0

    - name: The restore Job run, waited for - what it restored in its log
      ansible.builtin.shell:
        executable: /bin/bash
        stdin: "{{ _kr_job | combine({'metadata': _kr_job.metadata | combine({'name': _kr_name})}) | to_json }}"
        cmd: |
          set -euo pipefail
          k="{{ kubectl }} -n {{ kafka_namespace | default('schnappy-production') }}"
          j={{ _kr_name }}
          $k apply -f - > /dev/null
          # by the clock, not the tries: /proc/uptime, which nothing sets back; 3700 s, past the Job's own hour
          end=$(( $(cut -d. -f1 /proc/uptime) + 3700 ))
          s=""
          for _ in $(seq 370); do
            s=$($k get "job/$j" -o jsonpath='{.status.succeeded}/{.status.failed}')
            case "$s" in
              1/*) break ;;
              */1) $k logs "job/$j" -c fetch --tail=20 || true; $k logs "job/$j" -c restore --tail=20 || true
                   echo "the restore Job $j failed"; exit 1 ;;
            esac
            [ "$(cut -d. -f1 /proc/uptime)" -lt "$end" ] || break
            sleep 10
          done
          case "$s" in 1/*) ;; *) echo "the restore Job $j not done 3700 s after its start"; exit 1 ;; esac
          $k logs "job/$j" -c fetch | tail -1
          $k logs "job/$j" -c restore | grep -E '^restored [0-9]+ messages from ' | tail -1
          $k delete job "$j" --wait=false > /dev/null
      register: _kr_run
      changed_when: true
      failed_when: _kr_run.rc != 0 or (_kr_run.stdout_lines | last | default('')) is not match('^restored [0-9]+ messages from [0-9]{8}T[0-9]{6}Z$')

    # the restored topics alone: every other topic's loss still refused by the next dump
    - name: The store's BASELINE now - the backup's guard compares the restored topics with dumps from here on
      ansible.builtin.include_tasks: kafka-baseline.yml
      vars:
        _kr_from: "{{ (_kr_run.stdout_lines | last).split() | last }}"
        kafka_baseline_why: "a restore from {{ _kr_from }}{{ (' of ' ~ kafka_topics) if (kafka_topics | default('') | trim) else '' }}"
        kafka_baseline_topics: "{{ kafka_topics | default('') | trim or 'all' }}"

  always:
    - name: The restoring ConfigMap removed - by the run that made it, the restore succeeded or never started
      ansible.builtin.command: >-
        {{ kubectl }} -n {{ kafka_namespace | default('schnappy-production') }} delete configmap {{ _kr_lock }} --ignore-not-found
      when: _kr_locked is defined and _kr_locked is succeeded and (_kr_run is not defined or _kr_run is succeeded)
      register: _kr_unlocked
      retries: 3
      delay: 5
      until: _kr_unlocked.rc == 0
      changed_when: true

- name: What was restored
  ansible.builtin.set_fact:
    kafka_restored: "{{ _kr_run.stdout_lines | last }}"
    kafka_restored_from: "{{ (_kr_run.stdout_lines | last).split() | last }}"
