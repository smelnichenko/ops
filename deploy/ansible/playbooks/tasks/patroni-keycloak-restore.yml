---
# The Keycloak dump a first install took on pi1 (setup-patroni.yml), waiting there - this run's, or one a run cut short
# before its restore left - restored from pi1 into the Patroni leader the including play runs on (pi2 wins the first
# election about half the time): straight to its Postgres, not through HAProxy, which marks a new leader up only after
# two checks 3 s apart (a restore sooner found no server behind :5000, a full run's build, 2026-10-06).
#
# Only into an empty database: beside one in use it refuses, naming the file - the realm exists nowhere else, and
# replayed over live rows it would write old ones over new ones. Keycloak is stopped on both Pis meanwhile (it would
# build its own schema in the empty database first), and the database counted again once it is: one running until then
# could have built its schema since the first count - the dump then failed on it, and every later run refused. The dump
# goes in as one transaction (all or nothing), and is then moved aside in its root-only directory, root-only itself.
#
# Expects: pg_password (Postgres' superuser); keycloak_restore_db (default keycloak). Tested:
# tests/ansible/test-patroni-keycloak-restore.yml, tests/ansible/unit/keycloak-restore-order (the order).
- name: The database to restore into
  ansible.builtin.set_fact:
    _restore_db: "{{ keycloak_restore_db | default('keycloak') }}"

- name: Tables in it now
  ansible.builtin.command: sudo -u postgres psql -d {{ _restore_db }} -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'"
  register: _restore_tables
  changed_when: false
  check_mode: false  # a read: a preview (--check) runs it, and what reads it

- name: Only into an empty database
  ansible.builtin.assert:
    that: _restore_tables.stdout | trim == '0'
    fail_msg: >-
      REFUSED: a first install's Keycloak dump waits on pi1 (/var/backups/patroni-first-install/keycloak.sql) and the
      {{ _restore_db }} database has {{ _restore_tables.stdout | trim }} tables - restore it by hand into an empty one,
      or move the file aside once its realm is known to be elsewhere. A restore can have gone through after its run
      was cut short (a Ctrl-C skips the start below), Keycloak then stopped on both Pis: the realm in the database,
      move the file aside and systemctl start keycloak on each
    quiet: true

- name: The restore, Keycloak stopped on both Pis meanwhile
  block:
    - name: Keycloak stopped (it would build its schema in the empty database first)
      ansible.builtin.systemd:
        name: keycloak
        state: stopped
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"

    - name: Tables in it, Keycloak stopped
      ansible.builtin.command: sudo -u postgres psql -d {{ _restore_db }} -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'"
      register: _restore_tables_stopped
      changed_when: false
      check_mode: false  # a read: a preview (--check) runs it, and what reads it

    - name: Still empty - no schema built before Keycloak stopped
      ansible.builtin.assert:
        that: _restore_tables_stopped.stdout | trim == '0'
        fail_msg: >-
          REFUSED: the {{ _restore_db }} database was empty and has {{ _restore_tables_stopped.stdout | trim }} tables
          now Keycloak is stopped - a Keycloak running until then built its schema in it. The dump waits on pi1
          (/var/backups/patroni-first-install/keycloak.sql): stop Keycloak on both Pis (it is started again here),
          drop and recreate the database empty, then run again
        quiet: true

    # the dict form: a free-form script is parsed by Ansible first, and a backslash in a comment joined the next line
    # into it (the .pgpass never written, psql waiting at a password prompt for good) - and -w: a password psql does
    # not get fails at once instead
    - name: Restore the waiting Keycloak dump
      ansible.builtin.shell:
        executable: /bin/bash
        stdin: "{{ pg_password }}"
        cmd: |
          set -euo pipefail
          f=/var/backups/patroni-first-install/keycloak.sql
          pass=$(mktemp); trap 'rm -f "$pass"' EXIT
          read -r pw
          # .pgpass escapes a backslash and a colon in a field
          pw=${pw//\\/\\\\}; pw=${pw//:/\\:}
          printf '%s:5432:*:postgres:%s\n' "$PGHOST" "$pw" > "$pass"
          PGPASSFILE=$pass psql -w -p 5432 -U postgres -d {{ _restore_db }} -1 -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null
          echo "restored $(wc -l < "$f") lines into $PGHOST"
          install -m 0600 "$f" "/var/backups/patroni-first-install/keycloak-restored-$(date -u +%Y%m%dT%H%M%SZ).sql"
          rm "$f"
      environment:
        PGHOST: "{{ hostvars[inventory_hostname].ansible_host }}"
      delegate_to: pi1
      run_once: true
      register: _restored
      changed_when: true
      failed_when: false
      no_log: true  # the password went in on stdin - its error below, without it

    - name: Restored (psql's own error otherwise)
      ansible.builtin.assert:
        that: _restored.rc == 0
        # psql's ERROR lines only - its DETAIL and CONTEXT quote the dump's rows (realm keys, secrets, credentials) -
        # and what an ERROR quotes masked from its first quote on: it can be a value (invalid input syntax for type
        # uuid: "..."), and a value can hold a quote
        fail_msg: >-
          the Keycloak restore failed: {{ _restored.stderr_lines | default([]) | select('search', 'ERROR:')
          | map('regex_replace', '".*', '"..."') | join(' / ')
          or 'no ERROR line (exit ' ~ _restored.rc | default('?') ~ ')' }}
        success_msg: "{{ _restored.stdout | default('') }}"
      run_once: true
      when: not ansible_check_mode  # the restore is a write: a preview (--check) skips it
  always:
    # not after a failed restore: one transaction, the database is still empty - Keycloak started on it would build its
    # schema there, and every re-run would refuse the database in use (the realm only in the dump). A re-run restores.
    # Not waited for: a first install's Keycloak uses its own Pi's Postgres, and the replica's cannot serve until the
    # reconfigure play points it at the primary and its restart (tasks/keycloak-restart.yml) loads that
    - name: Keycloak started again (unless the restore failed)
      ansible.builtin.systemd:
        name: keycloak
        state: started
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      when:  # a preview (--check) stopped nothing
        - not ansible_check_mode
        - _restored is not defined or _restored is skipped or _restored.rc | default(0) == 0

    - name: Keycloak left stopped
      ansible.builtin.debug:
        msg: >-
          KEYCLOAK LEFT STOPPED on both Pis: the restore failed and the {{ _restore_db }} database is still empty - run
          setup-patroni.yml again to restore the waiting dump (Keycloak started now would build its own schema there)
      when:
        - not ansible_check_mode
        - _restored is defined and _restored is not skipped and _restored.rc | default(0) != 0
