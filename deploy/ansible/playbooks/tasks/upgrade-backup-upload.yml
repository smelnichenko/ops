---
# One file of a Wave 0 backup into the Pi backup store: the object, its sha256 beside it (<key>.sha256), and the
# object read back whole - its sha256 must be the file's. Signed with curl's own S3 signing (ten has no S3 client),
# the credentials from the curl config store_curl (never on a command line or in the environment).
#
# Expects: upload_file (a path on this host), upload_key, upgrade_backup_endpoint, upgrade_backup_bucket, store_curl.
- name: "Upload - the sha256 of the file: {{ upload_key }}"
  ansible.builtin.command: sha256sum {{ upload_file }}
  register: _upload_sum
  changed_when: false

- name: "Upload - the object and its sha256: {{ upload_key }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      put() {
        curl -fsS -K {{ store_curl }} -T "$1" "{{ upgrade_backup_endpoint }}/{{ upgrade_backup_bucket }}/$2"
      }
      echo "{{ _upload_sum.stdout.split()[0] }}" > {{ upload_file }}.sha256
      put {{ upload_file }} {{ upload_key }}
      put {{ upload_file }}.sha256 {{ upload_key }}.sha256
  changed_when: true

- name: "Upload - read back, its sha256 the file's: {{ upload_key }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      curl -fsS -K {{ store_curl }} "{{ upgrade_backup_endpoint }}/{{ upgrade_backup_bucket }}/{{ upload_key }}" \
        | sha256sum | cut -d' ' -f1
  register: _upload_back
  changed_when: false
  failed_when: _upload_back.rc != 0 or _upload_back.stdout != _upload_sum.stdout.split()[0]
