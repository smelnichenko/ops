---
# Scylla Manager restores tables from one of its backups: `sctool restore --restore-tables` for the keyspaces given, from
# the snapshot given, into the cluster as it stands (the tables must exist - their schema the cluster's, or restored first
# with --restore-schema) - started, then read until DONE (or ERROR/ABORTED: failed, said). Used by
# playbooks/scylla-restore.yml (production, by hand) and the copy's rehearsal (tests/ansible/copy/scylla-restore-check.yml).
#
# Needs: restore_cluster (Scylla Manager's id or name), restore_location (s3:<bucket>), restore_snapshot (sm_<UTC>),
#        restore_keyspaces (sctool's glob list), manager (the sctool command prefix); restore_source_cluster (optional:
#        the Scylla Manager id whose backup holds the snapshot - the cluster a way back replaced, tasks/scylla-way-back.yml;
#        unset: the target's own backups, never another cluster's)
# Sets:  restore_task (restore/<id>)
- name: The snapshot is one Scylla Manager holds for the cluster (or for the source cluster named)
  ansible.builtin.command: >-
    {{ manager }} sctool backup list -c {{ restore_cluster }} -L {{ restore_location }}{{ ' --all-clusters'
    if restore_source_cluster | default('') | length > 0 else '' }}
  register: _restore_list
  changed_when: false
  check_mode: false

- name: The snapshot listed - under the source cluster's own heading when one is named
  ansible.builtin.assert:
    that: >-
      restore_snapshot in ((_restore_list.stdout.split('Cluster: ' ~ restore_source_cluster, 1) + [''])[1].split('Cluster: ')[0]
      if restore_source_cluster | default('') | length > 0 else _restore_list.stdout)
    fail_msg: "{{ restore_snapshot }} not among {{ restore_source_cluster | default(restore_cluster, true) }}'s backups in {{ restore_location }}"
    quiet: true

- name: The restore - what it would do (a dry run)
  ansible.builtin.command: >-
    {{ manager }} sctool restore -c {{ restore_cluster }} -L {{ restore_location }} -T {{ restore_snapshot }}
    -K {{ restore_keyspaces }} --restore-tables --dry-run
  register: _restore_dry
  changed_when: false
  check_mode: false

- name: The restore started
  ansible.builtin.command: >-
    {{ manager }} sctool restore -c {{ restore_cluster }} -L {{ restore_location }} -T {{ restore_snapshot }}
    -K {{ restore_keyspaces }} --restore-tables
  register: _restore_start
  changed_when: true
  failed_when: _restore_start.rc != 0 or _restore_start.stdout is not search('restore/[0-9a-f-]+')
  when: not ansible_check_mode

- name: Its task
  ansible.builtin.set_fact:
    restore_task: "{{ _restore_start.stdout | regex_search('restore/[0-9a-f-]+') }}"
  when: not ansible_check_mode

- name: The restore DONE
  ansible.builtin.command: "{{ manager }} sctool progress -c {{ restore_cluster }} {{ restore_task }}"
  register: _restore_progress
  changed_when: false
  retries: 90
  delay: 20
  until: _restore_progress.stdout is search('Status:\s+(DONE|ERROR|ABORTED)')
  failed_when: _restore_progress.stdout is not search('Status:\s+DONE')
  when: not ansible_check_mode
