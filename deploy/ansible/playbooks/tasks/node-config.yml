---
# Re-runnable node/host tuning for the kubeadm control-plane node.
#
# Included by setup-kubeadm.yml on a fresh install AND runnable standalone via
# configure-node.yml (`task deploy:node-config`) to re-apply on a LIVE node — without
# re-running the one-shot cluster bootstrap (setup-kubeadm.yml is not idempotent: its
# `kubeadm init` task has no guard, so a re-run fails at preflight).
#
# Idempotent: kubelet is restarted only when the config actually changes, so a re-run
# on an already-configured node is a clean no-op.

- name: Enable kubelet graceful node shutdown
  # 180s total - 30s critical = 150s for normal pods, enough for the stateful stores
  # (Kafka/ClickHouse/Postgres, 120s grace) to flush cleanly on a node reboot. The
  # regexp matches any prior value so a re-apply bumps an already-set node.
  ansible.builtin.replace:
    path: /var/lib/kubelet/config.yaml
    regexp: 'shutdownGracePeriod: [0-9]+s'
    replace: 'shutdownGracePeriod: 180s'
  register: _kubelet_grace

- name: Set critical pods shutdown grace period
  ansible.builtin.replace:
    path: /var/lib/kubelet/config.yaml
    regexp: 'shutdownGracePeriodCriticalPods: [0-9]+s'
    replace: 'shutdownGracePeriodCriticalPods: 30s'
  register: _kubelet_grace_critical

- name: Restart kubelet to apply shutdown grace (only when changed)
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
  when: _kubelet_grace is changed or _kubelet_grace_critical is changed

# kubeadm rewrites /var/lib/kubelet/config.yaml from the kube-system/kubelet-config ConfigMap on every `kubeadm
# upgrade`: edited only in the file, both settings went back to 0s - the next reboot then gave Kafka, ClickHouse and
# Postgres no time to flush (ten 2026-10-04: file 180s/30s, ConfigMap 0s/0s). So they go into the
# ConfigMap too. A switch, so the Vagrant copy's baseline can stay as ten is until the upgrade step that sets it.
- name: The kubelet-config ConfigMap's shutdown grace - the patch it needs, if any (read-only, so the preview shows it)
  check_mode: false
  ansible.builtin.shell: |
    set -euo pipefail
    k="kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system"
    patch=$(mktemp)
    trap 'rm -f "$patch"' EXIT
    $k get configmap kubelet-config -o json | python3 -c '
    import json, re, sys
    data = json.load(sys.stdin)["data"]["kubelet"]
    new = data
    # by value: kubeadm writes 180s back as 3m0s, which is the same
    secs = lambda d: sum(float(n) * {"h": 3600, "m": 60, "s": 1}[u] for n, u in re.findall(r"([0-9.]+)(h|m|s)", d))
    for key, value in (("shutdownGracePeriod", "180s"), ("shutdownGracePeriodCriticalPods", "30s")):
        held = re.search(r"(?m)^" + key + r":\s*(\S+)\s*$", new)
        if held and secs(held.group(1)) == secs(value):
            continue
        if held:
            new = re.sub(r"(?m)^" + key + r":.*$", key + ": " + value, new)
        else:
            new = new.rstrip("\n") + "\n" + key + ": " + value + "\n"
    if new != data:
        print(json.dumps({"data": {"kubelet": new}}))
    ' > "$patch"
    cat "$patch"
  args:
    executable: /bin/bash
  register: _kubelet_config_patch
  changed_when: false
  when: kubelet_grace_in_kubelet_config_map | default(true) | bool

- name: Keep the shutdown grace across kubeadm upgrades - in the kubelet-config ConfigMap
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, -n, kube-system, patch, configmap, kubelet-config,
           --type, merge, -p, "{{ _kubelet_config_patch.stdout }}"]
  changed_when: true
  when: kubelet_grace_in_kubelet_config_map | default(true) | bool and _kubelet_config_patch.stdout | length > 0

- name: The preview - what the ConfigMap would get
  ansible.builtin.debug:
    msg: >-
      PREVIEW: {{ ('kubelet-config would be patched: ' ~ _kubelet_config_patch.stdout)
      if _kubelet_config_patch.stdout | length > 0 else 'kubelet-config holds the shutdown grace already' }}
  when: ansible_check_mode and kubelet_grace_in_kubelet_config_map | default(true) | bool
