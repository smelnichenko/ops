---
# Before a first install clears this Pi's data directory (setup-patroni.yml): never on the node Consul names the
# cluster's leader, and Consul's answer read fail-closed. Expects: patroni_scope, _patroni_first_install.
# Tested: tests/ansible/unit/patroni-leader-guard.
# a first install clears the data directory (Debian's own cluster, Keycloak's dumped first; a replica copies the
# leader's) - never on the node Consul names as the cluster's leader, whatever this Pi's files say
# fails closed: only Consul's own answer that there is no such key counts as no leader - Consul unreachable (the
# incident a re-run comes in) refuses instead of clearing the data
- name: Patroni's leader in Consul
  ansible.builtin.command: consul kv get service/{{ patroni_scope }}/leader
  register: _patroni_leader_key
  check_mode: false  # a read: a preview (--check) runs it, and what reads it
  changed_when: false
  failed_when: >-
    _patroni_leader_key.rc != 0 and 'No key exists at' not in _patroni_leader_key.stderr
  when: _patroni_first_install | bool

- name: Never the leader's data
  ansible.builtin.fail:
    msg: >-
      REFUSED on {{ inventory_hostname }}: no Patroni unit or file here, but Consul names it the leader of
      {{ patroni_scope }} - its data directory would be cleared; repair it by hand
  when:
    - _patroni_first_install | bool
    - _patroni_leader_key.rc | default(1) == 0
    - _patroni_leader_key.stdout | trim == inventory_hostname
