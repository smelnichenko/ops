---
# Argo CD's repo-creds Secret (forgejo-repo-creds) given Forgejo's reader (reader_user, argocd-reader) and its token
# from Vault argocd/forgejo-readonly where it lacks a username or a password (either: a half-filled Secret clones
# nothing) - a first install, a rebuild: the repositories are private and Argo CD installs External Secrets itself, so
# it must clone infra before the ExternalSecret can merge them in (task deploy:argocd-reader puts them in Vault before
# setup-argocd). Credentials there in full are left alone. Vault is read on the Pi holding the VIP (its loopback, its
# root token - neither leaves the Pi but for the two values); the token is proven on Forgejo from ten first (infra read
# with it - a token Forgejo deleted since, a restored Vault's, is refused, never written), then reaches kubectl on its
# stdin. Needs argocd_namespace, keepalived_vip, the pis group; on ten (the play's host).
- name: Whether forgejo-repo-creds has a username and a password
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for k in username password; do
        v=$(kubectl --kubeconfig "$KC" -n "$NS" get secret forgejo-repo-creds -o "jsonpath={.data.$k}")
        echo "$k=$([ -n "$v" ] && echo yes || echo no)"
      done
    executable: /bin/bash
  environment:
    KC: "{{ argocd_kubeconfig | default('/etc/kubernetes/admin.conf') }}"
    NS: "{{ argocd_namespace }}"
  register: _repo_creds_has
  changed_when: false
  check_mode: false  # a read
  no_log: true  # a Secret's read (yes/no alone)

- name: The repo-creds Secret given the reader's credentials from Vault (it lacks one)
  # either one missing (a half-filled Secret), and any answer not both - never only when both are
  when: _repo_creds_has.stdout_lines != ['username=yes', 'password=yes']
  block:
    - name: The Pi holding the VIP (Vault's)
      ansible.builtin.include_tasks: pi-vip-holder.yml

    - name: Vault's root token, on that Pi
      ansible.builtin.slurp:
        src: "{{ argocd_vault_root_token_file | default('/etc/vault-unseal/root-token') }}"
      delegate_to: "{{ pi_vip_holder | default(inventory_hostname) }}"  # templated even when skipped (never a Pi by default)
      become: true
      register: _repo_creds_vault_token
      no_log: true  # the root token, base64

    - name: Vault's argocd/forgejo-readonly, on that Pi
      community.hashi_vault.vault_kv2_get:
        url: "{{ argocd_vault_addr | default('https://127.0.0.1:8200') }}"
        token: "{{ _repo_creds_vault_token.content | b64decode | trim }}"
        ca_cert: "{{ argocd_vault_ca_cert | default('/etc/vault.d/tls/ca-cert.pem') }}"
        path: argocd/forgejo-readonly
      delegate_to: "{{ pi_vip_holder | default(inventory_hostname) }}"  # templated even when skipped (never a Pi by default)
      register: _repo_creds_vault
      no_log: true

    - name: Vault holds the reader and its token
      ansible.builtin.assert:
        that:
          - (_repo_creds_vault.secret.username | default('')) == (reader_user | default('argocd-reader'))
          - (_repo_creds_vault.secret.token | default('')) | length >= 8
        fail_msg: >-
          REFUSED: Vault argocd/forgejo-readonly holds no {{ reader_user | default('argocd-reader') }} token - run task
          deploy:argocd-reader first (Argo CD cannot clone the private infra without it); forgejo-repo-creds left as it is
        quiet: true

    # the repository Argo CD clones first (its root Application's), read with the token as Argo CD will - from ten
    - name: Vault's token reads infra on Forgejo
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _repo_creds_api }}/repos/{{ argocd_root_repo | default('schnappy/infra') }}"
        headers:
          Authorization: "token {{ _repo_creds_vault.secret.token }}"
        validate_certs: "{{ validate_certs | default(true) }}"
        status_code: [200, 401, 403, 404]  # judged next, the answer said
      vars:
        _repo_creds_api: >-
          {{ argocd_forgejo_api | default((forgejo_scheme | default('https')) ~ '://'
             ~ (forgejo_host | default(argocd_forgejo_host | default('git.pmon.dev'))) ~ '/api/v1') }}
      register: _repo_creds_proof
      no_log: true  # the token in its header

    - name: Vault's token works
      ansible.builtin.assert:
        that: _repo_creds_proof.status == 200
        fail_msg: >-
          REFUSED: Vault argocd/forgejo-readonly's token does not read {{ argocd_root_repo | default('schnappy/infra') }}
          on Forgejo (HTTP {{ _repo_creds_proof.status | default('?') }}) - deleted, or a restored Vault's: run task
          deploy:argocd-reader; forgejo-repo-creds left as it is
        quiet: true

    - name: The credentials into forgejo-repo-creds (on kubectl's stdin)
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ argocd_kubeconfig | default('/etc/kubernetes/admin.conf') }}", -n,
               "{{ argocd_namespace }}", patch, secret, forgejo-repo-creds, --type, merge, --patch-file, /dev/stdin]
        stdin: >-
          {{ {'stringData': {'username': _repo_creds_vault.secret.username,
                             'password': _repo_creds_vault.secret.token}} | to_json }}
      changed_when: true
      no_log: true  # the token on its stdin
