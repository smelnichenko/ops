---
# One turn of upgrade-patroni.yml: the nodes whose role at the start (_leader) is _turn_leader - Patroni restarted
# (paused: Postgres is not touched), its REST API on the new version, and the primary answering through this Pi's
# HAProxy (:5000, which follows Patroni's /primary) before the turn ends.
- name: "Restarted ({{ 'the leader' if _turn_leader else 'the replicas' }})"
  ansible.builtin.systemd:
    name: patroni
    state: restarted
  when: (_leader | bool) == _turn_leader

- name: On the version
  ansible.builtin.uri:
    url: http://127.0.0.1:8008/patroni
    return_content: true
  register: _after_api
  retries: 30
  delay: 5
  until: _after_api.status | default(0) == 200 and _after_api.json.patroni.version == patroni_version
  when: (_leader | bool) == _turn_leader

- name: The primary answering through HAProxy, on every Pi
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      # the password on stdin, not in the environment Ansible puts on the command line
      read -r PGPASSWORD; export PGPASSWORD
      [ "$(psql -h 127.0.0.1 -p 5000 -U postgres -d postgres -Atc 'select not pg_is_in_recovery()')" = t ]
    stdin: "{{ postgres_admin_password }}"
  register: _primary
  retries: 12
  delay: 5
  until: _primary.rc == 0
  changed_when: false
