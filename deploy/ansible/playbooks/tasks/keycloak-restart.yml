---
# Keycloak restarted where its unit or secrets file differ from what it last loaded (a stamp, by content: a restart that
# failed or was refused stays pending and the next run makes it - a handler fired once, and a re-run left the old
# process running), one Pi at a time: a Pi where it does not serve first, then the Pi without the VIP, the VIP's last. setup-pi-services (its unit and secrets written)
# and setup-patroni (its database port moved) import these - in a play of both Pis: the order by the VIP needs both in
# it (a play one Pi at a time restarted the VIP's first). Not in a preview: it wrote neither file. Needs keepalived_vip;
# _keycloak_start (the start task's result) where the play has one.
- name: Keycloak's restart pending here - its unit and secrets against the ones it last loaded
  ansible.builtin.include_tasks:
    file: restart-pending.yml
    apply:
      tags: [keycloak-db-url]
  vars:
    loaded_service: keycloak
    loaded_files: [/etc/systemd/system/keycloak.service, /etc/keycloak/secrets.env]
    # its status as the start found it: not running, it started on these files just now
    loaded_started_now: >-
      {{ ((_keycloak_start | default({})).status | default({})).ActiveState | default('active')
         not in ['active', 'activating'] }}
  when: not ansible_check_mode

# only the VIP's Caddy serves logins (each Pi's proxies auth.pmon.dev to its own Keycloak): the other Pi's restart
# costs nothing and a unit that does not start is found there - the VIP's last, logins down while it starts
- name: Whether this Pi holds the VIP
  ansible.builtin.command:
    argv: [ip, -o, addr, show, to, "{{ keepalived_vip }}"]
  register: _keycloak_vip
  changed_when: false
  check_mode: false  # a read

# a Pi where Keycloak does not serve restarts first, the VIP's or not: its restart takes nothing down, and the other
# Pi's guard then finds it serving. Restarted after one that serves, it was read as down and that one refused - the VIP
# on neither, pi2's Keycloak on its own Postgres, a replica, until its restart loaded the primary's port (a full run's
# build, 2026-10-08)
- name: Whether Keycloak serves here
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/realms/master
    status_code: 200
    timeout: 10
    follow_redirects: none
  register: _keycloak_serves
  failed_when: false  # a read: not serving is an answer
  check_mode: false  # a read

- name: Keycloak restarted where pending - a Pi where it does not serve (nothing served there to lose)
  vars:
    peer_ip: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first]['ansible_host'] }}"
  throttle: 1
  ansible.builtin.shell:
    executable: /bin/bash
    # every file the unit loads its environment from there (one missing failed its start: "Failed to load
    # environment files" - production's Keycloak down); the other Pi serving while this one does
    cmd: &keycloak_restart |
      set -euo pipefail
      up() { curl -sf -o /dev/null --max-time 10 "http://$1:8080/realms/master"; }
      for f in $(sed -n 's/^EnvironmentFile=\([^-].*\)$/\1/p' /etc/systemd/system/keycloak.service); do
        [ -s "$f" ] || { echo "REFUSED on {{ inventory_hostname }}: $f (the unit's EnvironmentFile) is missing - Keycloak not restarted" >&2; exit 1; }
      done
      if up 127.0.0.1 && ! up {{ peer_ip }}; then
        echo "REFUSED on {{ inventory_hostname }}: Keycloak serves here but not on the other Pi ({{ peer_ip }})" >&2; exit 1
      fi
      systemctl daemon-reload
      systemctl restart keycloak
      for _ in $(seq 120); do up 127.0.0.1 && exit 0; sleep 2; done
      echo "Keycloak on {{ inventory_hostname }} not serving 240 s after its restart" >&2; exit 1
  changed_when: true
  when:
    - not ansible_check_mode
    - _restart_pending.stdout_lines[0] == 'pending'
    - _keycloak_serves.status | default(0) != 200

- name: Keycloak restarted where pending - the Pi without the VIP
  vars:
    peer_ip: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first]['ansible_host'] }}"
  # one Pi at a time: the VIP on neither (keepalived down) or on both (split) ran this task on both at once
  throttle: 1
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: *keycloak_restart
  changed_when: true
  when:
    - not ansible_check_mode
    - _restart_pending.stdout_lines[0] == 'pending'
    - _keycloak_serves.status | default(0) == 200
    - _keycloak_vip.stdout | length == 0

# the VIP's only with both Pis still in this play: one dropped by an earlier failure (a guard refusing, a write
# failing) left the VIP's first and alone - its peer guard passing on the old Keycloak still serving there
- name: Both Pis still in this run before the VIP's Keycloak restarts
  ansible.builtin.assert:
    that:
      - ansible_play_hosts | length == ansible_play_hosts_all | length
    fail_msg: >-
      REFUSED: {{ ansible_play_hosts_all | difference(ansible_play_hosts) | join(', ') }} left this run - the VIP's
      Keycloak not restarted first and alone
    quiet: true
  run_once: true
  when: not ansible_check_mode

- name: Keycloak restarted where pending - the Pi with the VIP (logins down while it starts)
  vars:
    peer_ip: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first]['ansible_host'] }}"
  throttle: 1
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: *keycloak_restart
  changed_when: true
  when:
    - not ansible_check_mode
    - _restart_pending.stdout_lines[0] == 'pending'
    - _keycloak_serves.status | default(0) == 200
    - _keycloak_vip.stdout | length > 0

# what the next run compares with: restarted (a failure ends this Pi's run before here), or current
- name: Keycloak's config as it runs it, recorded
  ansible.builtin.include_tasks:
    file: restart-recorded.yml
    apply:
      tags: [keycloak-db-url]
  vars:
    loaded_service: keycloak
    loaded_hash: "{{ _restart_pending.stdout_lines[1] }}"
  when: not ansible_check_mode
