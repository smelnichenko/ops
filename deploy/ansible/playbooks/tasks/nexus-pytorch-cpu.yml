---
# The hosted pytorch-cpu repository in pypi-public, converged idempotently through
# a running Nexus on localhost. Included by setup-nexus.yml twice: from the
# bootstrap play (fresh install, Nexus up on pi1 before Keepalived exists) and
# from the converge play (on whichever Pi holds the VIP).
# Expects: nexus_port, nexus_admin_password.
#
# PyTorch's CPU wheels are not on PyPI (its Linux torch is the CUDA build, ~3 GB
# with the nvidia wheels), and PyTorch's own index cannot be proxied: a Nexus
# PyPI proxy asks for <remote>/simple/<name>/, which download.pytorch.org
# answers with 403. So the wheels CI needs live in a hosted repository inside
# pypi-public, which merges both members' indexes. Keep this list in step with
# target-scorer's requirements/ci.txt.

- name: The PyTorch CPU wheels pytorch-cpu holds
  ansible.builtin.set_fact:
    pytorch_cpu_base_url: https://download-r2.pytorch.org/whl/cpu/
    pytorch_cpu_wheels:
      - file: torch-2.14.0+cpu-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 160e1bc46aeded3111d2801f8ae10dc9a1b946843a7e126b4dbf5e19c5706e95
      - file: torchvision-0.29.0+cpu-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 6ff3b816ec955f3ef9f32d1e698e1856549e2e03637c358ee067c6f5f17f74fa

- name: List repositories
  ansible.builtin.uri:
    follow_redirects: none
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/repositories"
    url_username: admin
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: _repos
  check_mode: false  # a read: a preview (--check) runs it, and what reads it

- name: Create pytorch-cpu hosted repository
  ansible.builtin.uri:
    follow_redirects: none
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/repositories/pypi/hosted"
    method: POST
    url_username: admin
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: pytorch-cpu
      online: true
      # ALLOW_ONCE: a wheel, once uploaded, is never replaced under the same name
      storage: { blobStoreName: default, strictContentTypeValidation: true, writePolicy: ALLOW_ONCE }
    status_code: [201]
  changed_when: true
  when: "'pytorch-cpu' not in (_repos.json | map(attribute='name') | list)"

- name: Read the pypi-public group
  ansible.builtin.uri:
    follow_redirects: none
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/repositories/pypi/group/pypi-public"
    url_username: admin
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: _pypi_public
  check_mode: false  # a read: a preview (--check) runs it, and what reads it

- name: Add pytorch-cpu to the pypi-public group
  ansible.builtin.uri:
    follow_redirects: none
    url: "http://localhost:{{ nexus_port }}/service/rest/v1/repositories/pypi/group/pypi-public"
    method: PUT
    url_username: admin
    url_password: "{{ nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: pypi-public
      online: "{{ _pypi_public.json.online }}"
      storage: "{{ _pypi_public.json.storage }}"
      group: { memberNames: "{{ _pypi_public.json.group.memberNames + ['pytorch-cpu'] }}" }
    status_code: [204]
  changed_when: true
  when: "'pytorch-cpu' not in _pypi_public.json.group.memberNames"

# one request per wheel at its package path (packages/<name>/<version>/<file>):
# no listing to page through, however many versions the repository gathers
- name: Look for each wheel in pytorch-cpu
  ansible.builtin.uri:
    url: >-
      http://localhost:{{ nexus_port }}/repository/pytorch-cpu/packages/{{ item.file.split('-')[0] }}/{{
      item.file.split('-')[1] | urlencode }}/{{ item.file | urlencode }}
    method: HEAD
    status_code: [200, 404]
  loop: "{{ pytorch_cpu_wheels }}"
  loop_control: { label: "{{ item.file }}" }
  register: _wheel_lookup
  check_mode: false  # a read: a preview (--check) runs it, and what reads it

- name: Work out which wheels are missing
  ansible.builtin.set_fact:
    _missing_wheels: "{{ _wheel_lookup.results | selectattr('status', 'eq', 404) | map(attribute='item') | list }}"

# a private directory: a wheel planted at a fixed /var/tmp name after its check was uploaded
- name: A private directory for the wheels
  ansible.builtin.tempfile:
    state: directory
    suffix: .wheels
  check_mode: false
  register: _wheels_tmp
  when: _missing_wheels | length > 0

- name: Download the missing wheels (checksummed)
  ansible.builtin.get_url:
    url: "{{ pytorch_cpu_base_url }}{{ item.file | urlencode }}"
    dest: "{{ _wheels_tmp.path }}/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
    timeout: 600
  loop: "{{ _missing_wheels }}"
  loop_control: { label: "{{ item.file }}" }

# curl, not uri: uri's form-multipart cannot carry a binary file intact (its
# 7or8bit encoding rewrites line endings inside the wheel, and Nexus does not
# decode base64), so Nexus answers "Unable to extract PyPI metadata". The
# credentials go in on stdin as curl config, never on the command line.
- name: Upload the missing wheels to pytorch-cpu
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --fail-with-body
      - --connect-timeout
      - "30"
      - --speed-limit
      - "10240"
      - --speed-time
      - "120"
      - --config
      - "-"
      - --form
      - "pypi.asset=@{{ _wheels_tmp.path }}/{{ item.file }}"
      - "http://localhost:{{ nexus_port }}/service/rest/v1/components?repository=pytorch-cpu"
    # curl config quoting: a backslash or double quote in the password is escaped
    stdin: >-
      user = "admin:{{ nexus_admin_password | replace('\\', '\\\\') | replace('"', '\\"') }}"
  loop: "{{ _missing_wheels }}"
  loop_control: { label: "{{ item.file }}" }
  no_log: true
  changed_when: true

- name: Remove the downloaded wheels
  ansible.builtin.file:
    path: "{{ _wheels_tmp.path }}"
    state: absent
  check_mode: false
  when: _missing_wheels | length > 0
