---
# Convert every Strimzi custom resource, and the CRDs' stored version, to the v1 API - before Strimzi 1.x, which serves
# v1 only (an object still stored as v1beta2 then becomes unreadable, and the API server refuses 1.x's CRDs while
# their status.storedVersions still lists v1beta2). Strimzi's own tool does it, from the running operator's image
# (/opt/v1-api-conversion), as two Jobs with the RBAC its README gives:
#   1. convert-resource --all-namespaces   rewrites every live Strimzi resource as v1 - git-managed or not (ten has
#                                          13 KafkaTopics that no repo creates);
#   2. crd-upgrade                         makes v1 the CRDs' storage version and storedVersions [v1].
#
# Argo CD must not be syncing Strimzi automatically meanwhile: its 0.51 chart CRDs store v1beta2, and a self-heal
# would put that back. The run refuses to start while the Strimzi Application has an automated sync policy; the
# infra change that removes it comes first, and the one that bumps the chart to 1.x restores it.
#
# Proof: every Strimzi CRD stores only v1; the Kafka clusters are Ready. A cluster already converted is left alone.
#
# Usage: ansible-playbook -i inventory/<env>.yml playbooks/strimzi-v1-conversion.yml
- name: Strimzi custom resources and CRDs to the v1 API
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    kubectl: "kubectl --kubeconfig {{ kubeconfig }}"
    operator_namespace: strimzi
    argo_app: strimzi
    crds:
      - kafkabridges.kafka.strimzi.io
      - kafkaconnectors.kafka.strimzi.io
      - kafkaconnects.kafka.strimzi.io
      - kafkamirrormaker2s.kafka.strimzi.io
      - kafkanodepools.kafka.strimzi.io
      - kafkarebalances.kafka.strimzi.io
      - kafkas.kafka.strimzi.io
      - kafkatopics.kafka.strimzi.io
      - kafkausers.kafka.strimzi.io
      - strimzipodsets.core.strimzi.io
  tasks:
    - name: The stored versions of the Strimzi CRDs
      check_mode: false
      ansible.builtin.shell: |
        set -euo pipefail
        for c in {{ crds | join(' ') }}; do
          echo "$c $({{ kubectl }} get crd $c -o jsonpath='{.status.storedVersions}')"
        done
      args:
        executable: /bin/bash
      register: _stored
      changed_when: false

    # a run cut short after crd-upgrade ended "already on v1" below and left the tool's cluster-wide RBAC
    - name: An earlier run's Jobs and RBAC removed
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} -n {{ operator_namespace }} delete job strimzi-v1-convertresource strimzi-v1-crdupgrade \
          --ignore-not-found --cascade=foreground --wait=true --timeout=300s
        {{ kubectl }} delete clusterrolebinding strimzi-v1-api-conversion --ignore-not-found
        {{ kubectl }} delete clusterrole strimzi-v1-api-conversion --ignore-not-found
        {{ kubectl }} -n {{ operator_namespace }} delete serviceaccount strimzi-v1-api-conversion --ignore-not-found
      args:
        executable: /bin/bash
      changed_when: true

    - name: Nothing to do when every Strimzi CRD already stores only v1
      when: _stored.stdout_lines | reject('match', '^\S+ \["v1"\]$') | list | length == 0
      block:
        - name: Already converted
          ansible.builtin.debug:
            msg: "STRIMZI ALREADY ON v1: {{ _stored.stdout_lines | length }} CRDs store only v1"
        - name: End here
          ansible.builtin.meta: end_host

    - name: Argo CD is not syncing Strimzi automatically (it would put the 0.51 CRDs back)
      check_mode: false
      ansible.builtin.command: >-
        {{ kubectl }} -n argocd get application {{ argo_app }} -o jsonpath={.spec.syncPolicy.automated}
      register: _automated
      changed_when: false
      # a failed lookup (no such app, the API down) is no proof that automation is off
      failed_when: _automated.rc != 0 or _automated.stdout | length > 0

    - name: The operator's image (the tool ships in it), and the operator before 1.0
      check_mode: false
      ansible.builtin.command: >-
        {{ kubectl }} -n {{ operator_namespace }} get deployment strimzi-cluster-operator
        -o jsonpath={.spec.template.spec.containers[0].image}
      register: _operator
      changed_when: false
      failed_when: >-
        _operator.stdout | length == 0
        or not (_operator.stdout.split(':')[-1] is version('0.49.0', '>=') and _operator.stdout.split(':')[-1] is version('1.0.0', '<'))

    # the RBAC grants cluster-wide patch/update on every Strimzi resource and on the CRDs: removed however the run ends
    - name: The conversion, its RBAC removed after it whatever happens
      block:
        - name: The tool's account and RBAC (Strimzi's README)
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            definition:
              - apiVersion: v1
                kind: ServiceAccount
                metadata: { name: strimzi-v1-api-conversion, namespace: "{{ operator_namespace }}" }
              - apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata: { name: strimzi-v1-api-conversion }
                rules:
                  - apiGroups: [kafka.strimzi.io]
                    resources: [kafkas, kafkanodepools, kafkaconnects, kafkaconnectors, kafkabridges, kafkamirrormaker2s,
                                kafkarebalances, kafkatopics, kafkausers]
                    verbs: [get, list, patch, update]
                  - apiGroups: [core.strimzi.io]
                    resources: [strimzipodsets]
                    verbs: [get, list, patch, update]
                  - apiGroups: [apiextensions.k8s.io]
                    resources: [customresourcedefinitions, customresourcedefinitions/status]
                    resourceNames: "{{ crds }}"
                    verbs: [get, list, patch, update]
                  - apiGroups: [""]
                    resources: [configmaps]
                    verbs: [get, list, create, patch, update]
              - apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata: { name: strimzi-v1-api-conversion }
                subjects:
                  - { kind: ServiceAccount, name: strimzi-v1-api-conversion, namespace: "{{ operator_namespace }}" }
                roleRef: { kind: ClusterRole, name: strimzi-v1-api-conversion, apiGroup: rbac.authorization.k8s.io }

        - name: Run the tool - convert-resource, then crd-upgrade (only after every resource is converted)
          ansible.builtin.shell: |
            set -euo pipefail
            K="{{ kubectl }} -n {{ operator_namespace }}"
            job=strimzi-v1-{{ item | replace('-', '') }}
            $K delete job $job --ignore-not-found --cascade=foreground --wait=true --timeout=300s > /dev/null
            cat <<EOF | $K apply -f - > /dev/null
            apiVersion: batch/v1
            kind: Job
            metadata: { name: $job }
            spec:
              backoffLimit: 0
              template:
                metadata:
                  labels: { sidecar.istio.io/inject: "false" }
                spec:
                  serviceAccountName: strimzi-v1-api-conversion
                  restartPolicy: Never
                  containers:
                    - name: tool
                      image: {{ _operator.stdout }}
                      command: [/opt/v1-api-conversion/bin/v1-api-conversion.sh, {{ item }}{{ ', --all-namespaces' if item == 'convert-resource' else '' }}]
            EOF
            $K wait job/$job --for=condition=Complete --timeout=600s > /dev/null & ok=$!
            $K wait job/$job --for=condition=Failed --timeout=600s > /dev/null & failed=$!
            # whichever wait ends first (a timeout ends both with an error); the status of the Job below decides
            first=0
            wait -n $ok $failed || first=$?
            # the other wait is still running - or ended already, which kill reports and nothing else needs
            kill $ok $failed 2> /dev/null || true
            $K logs job/$job --tail=40
            [ "$($K get job $job -o jsonpath='{.status.succeeded}')" = 1 ] \
              || { echo "$job did not succeed (the first wait ended with $first)"; exit 1; }
          args:
            executable: /bin/bash
          loop: [convert-resource, crd-upgrade]
          register: _tool
          changed_when: true

        - name: Every Strimzi CRD now stores only v1
          when: not ansible_check_mode
          ansible.builtin.shell: |
            set -euo pipefail
            for c in {{ crds | join(' ') }}; do
              echo "$c $({{ kubectl }} get crd $c -o jsonpath='{.status.storedVersions}')"
            done
          args:
            executable: /bin/bash
          register: _after
          changed_when: false
          failed_when: _after.stdout_lines | reject('match', '^\S+ \["v1"\]$') | list | length > 0

        # Ready for the resource as rewritten: the condition of the version before can stand a moment after the rewrite
        - name: The Kafka clusters are Ready, at their current generation
          when: not ansible_check_mode
          ansible.builtin.shell: |
            set -euo pipefail
            {{ kubectl }} wait kafkas.kafka.strimzi.io --all -A --for=condition=Ready --timeout=600s > /dev/null
            {{ kubectl }} get kafkas.kafka.strimzi.io -A \
              -o jsonpath='{range .items[*]}{.metadata.generation} {.status.observedGeneration}{"\n"}{end}' \
              | awk '$1 != $2 {bad = 1} END {exit bad}'
          args:
            executable: /bin/bash
          register: _kafka_ready
          retries: 30
          delay: 10
          until: _kafka_ready.rc == 0
          changed_when: false

      always:
        # every removal tried, whichever fails; the task fails if any did
        - name: Remove the tool's Jobs and RBAC
          ansible.builtin.shell: |
            rc=0
            {{ kubectl }} -n {{ operator_namespace }} delete job strimzi-v1-convertresource strimzi-v1-crdupgrade \
              --ignore-not-found || rc=1
            {{ kubectl }} delete clusterrolebinding strimzi-v1-api-conversion --ignore-not-found || rc=1
            {{ kubectl }} delete clusterrole strimzi-v1-api-conversion --ignore-not-found || rc=1
            {{ kubectl }} -n {{ operator_namespace }} delete serviceaccount strimzi-v1-api-conversion --ignore-not-found || rc=1
            exit $rc
          args:
            executable: /bin/bash
          changed_when: true

    # a preview (--check) ran the probes only: no tool, no proof to report
    - name: Would convert
      when: ansible_check_mode
      ansible.builtin.debug:
        msg: >-
          PREVIEW: would convert every Strimzi resource to v1 and store only v1 in
          {{ _stored.stdout_lines | reject('match', '^\S+ \["v1"\]$') | list | length }} CRDs, with the tool of
          {{ _operator.stdout }}

    - name: Converted
      when: not ansible_check_mode
      ansible.builtin.debug:
        msg: "STRIMZI ON v1: {{ _after.stdout_lines | length }} CRDs store only v1; Kafka clusters Ready"
