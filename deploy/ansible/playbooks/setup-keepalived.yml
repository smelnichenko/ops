---
# Setup Keepalived for floating VIP between pi1 and pi2
#
# Provides a single stable IP (192.168.11.5) that floats between Pis.
# Caddy's names (git, auth, nexus), the backup store (versitygw) and Vault are reached via the VIP - Postgres never
# (each Pi's PgBouncer -> HAProxy on 127.0.0.1 -> the primary). If the active Pi dies, the other grabs the VIP in
# about 4 s; a holder failing its checks is taken over about 30 s after they fail (preempt_delay).
#
# Prerequisites:
#   - Both Pis running with services installed
#
# Usage: task deploy:keepalived   (production; Vagrant: task test:dual-pi)

- name: Setup Keepalived
  hosts: pi1,pi2
  become: true
  gather_facts: true
  gather_subset: [network]  # the mounts' facts stat every Gluster mount: a hung client's held the play
  vars_files:
    - ../vars/production-lan.yml

  vars:
    vip: "{{ keepalived_vip }}"
    vip_cidr: 24
    vrrp_router_id: 51
    vrrp_password: "{{ keepalived_vrrp_password }}"
    # Both Pis equal, preempting allowed: the holder keeps the VIP while its checks pass (an equal priority never
    # preempts), a failing check (weight -50) drops it under the other's and the other takes it. With pi1 at 150 and
    # nopreempt the checks moved nothing: a BACKUP with nopreempt accepts any non-zero advert (the copy, 2026-11-16: the
    # holder's priority 100 -> 50 for a minute, the VIP stayed - keepalived's vrrp.c); operator, 2026-11-16: switch.
    # Two masters at once (a partition healed, both timers out together at a boot or reload) settle on the higher
    # address - pi2 - whoever held it before
    vrrp_priority: 100
    # Both start as BACKUP: the first up takes the VIP, the other never preempts it at an equal priority
    vrrp_state: BACKUP
    # Unicast VRRP: explicit source + peer on the private-network IPs.
    peer_src_ip: "{{ ansible_host }}"
    peer_other_ip: "{{ hostvars['pi2']['ansible_host'] if inventory_hostname == 'pi1' else hostvars['pi1']['ansible_host'] }}"

  tasks:
    # an empty one (a key missing from .env) wrote `auth_pass` empty
    - name: The VRRP password is there
      ansible.builtin.assert:
        that: vrrp_password | default('') | length > 0
        fail_msg: "REFUSED: no VRRP password (KEEPALIVED_VRRP_PASSWORD in .env)"
        quiet: true
      no_log: true

    - name: Discover VRRP interface (the one carrying ansible_host)
      ansible.builtin.shell: |
        set -eo pipefail
        ip -o -4 addr show | awk -v ip="{{ ansible_host }}" '$4 ~ "^"ip"/" {print $2; exit}'
      register: _vrrp_iface
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    - name: Set vrrp_interface fact
      ansible.builtin.set_fact:
        vrrp_interface: "{{ _vrrp_iface.stdout | trim }}"

    - name: Fail if we couldn't find the interface
      ansible.builtin.assert:
        that: vrrp_interface | length > 0
        fail_msg: "Could not find an interface with IP {{ ansible_host }}"

    # iputils-arping beside it: tasks/pi-vip-holder.yml probes for another host answering for the VIP with its -D (exit 1
    # on a reply) whenever a Pi is unreachable - missing, every VIP-holder play failed exactly then
    - name: Install Keepalived and iputils' arping
      ansible.builtin.apt:
        name: [keepalived, iputils-arping]
        state: present

    # Habets' arping (the "arping" package) reads -D otherwise and inverts its exits: the one on the PATH must be iputils'
    - name: The arping on the PATH is iputils'
      ansible.builtin.command: arping -V
      register: _arping_version
      changed_when: false
      check_mode: false  # a read
      failed_when: _arping_version.rc != 0 or 'iputils' not in (_arping_version.stdout ~ _arping_version.stderr)

    - name: Allow VRRP through UFW
      community.general.ufw:
        rule: allow
        proto: vrrp
        from_ip: "{{ production_lan }}"
        comment: "VRRP protocol"

    # Forgejo on the VIP's Pi down for more than a minute moves the VIP (a broken Forgejo there stays the other Pi's
    # Caddy's to serve otherwise); its restarts, 3-11 s measured (2026-11-14/15), never do
    - name: Create Forgejo's health check script
      ansible.builtin.copy:
        dest: /etc/keepalived/check_forgejo.sh
        mode: '0755'
        content: |
          #!/bin/bash
          curl -sf -o /dev/null --connect-timeout 1 -m 2 http://localhost:3000/api/healthz

    - name: Create health check script
      ansible.builtin.copy:
        dest: /etc/keepalived/check_services.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Check critical services — if any fails, reduce priority to trigger failover.
          # Nexus is intentionally excluded: it's active-passive, controlled by
          # notify_master / notify_backup below, so probing it on the BACKUP Pi
          # would always fail and pin the VIP. versitygw is the opposite — it
          # runs on BOTH Pis, so it IS checked to make the VIP follow a live
          # gateway. (MinIO, formerly active-passive here, was retired 2026-06-27.)
          # Forgejo has a check of its own (check_forgejo.sh, a minute's window): both Pis serve it and each Pi's Caddy
          # falls back to the other's (setup-caddy.yml) - in this one, a restart of the holder's Forgejo past 15 s moved
          # the VIP, Nexus failing over with it.

          # Patroni left out: nothing reaches Postgres through the VIP (each Pi's PgBouncer -> HAProxy on 127.0.0.1 -> the
          # primary), and its planned switchovers fail /health - live, they moved the VIP and Nexus mid-handover.
          # Each probe 2 s at most, all at once: keepalived counts a check still running at its timeout failed.
          probe() { curl -sf -o /dev/null --connect-timeout 1 -m 2 "$1"; }
          # Caddy - every name the VIP serves goes through it (its admin endpoint: Caddy itself, whatever is behind it)
          probe http://127.0.0.1:2019/config/ & caddy=$!
          # Keycloak (its restarts: 9.5-13 s measured, 2026-11-14/16 - they can reach the fall's 3 failures; the other
          # Pi's preempt_delay, 30 s, absorbs them)
          probe http://localhost:8080/realms/master & keycloak=$!
          # versitygw runs on both Pis; gate the VIP onto a Pi with a live gateway (the backup store)
          probe http://localhost:9000/health & versitygw=$!
          wait "$caddy" && wait "$keycloak" && wait "$versitygw"

    # Active-passive controller scripts (Nexus + MinIO). Same safety
    # model for both:
    #   1. VRRP election: exactly one Pi holds VIP in the common case
    #   2. <data-dir>/.active-on-<hostname> sentinel: informational +
    #      split-brain detector; notify_master logs a warning if another
    #      host's sentinel exists
    #   3. Service-level lock: Nexus's H2 (/mnt/data/nexus/db/nexus.lock.db)
    #      refuses concurrent starts. MinIO's xl-single doesn't have an
    #      equivalent fencing primitive — we rely on layers 1+2 plus the
    #      systemd unit's StartLimitBurst=3 cap as a backstop.
    #   4. Live-VIP gating + per-service flock: handlers converge to the
    #      LATEST VRRP state by re-reading kernel VIP ownership under the
    #      service lock (keepalived updates the address BEFORE invoking
    #      notify scripts). Kernel state cannot be written out of order,
    #      unlike a recorded state file racing concurrent notify writers.
    #      Without this, a master handler stuck in its readiness wait can
    #      outlive a MASTER->BACKUP flip and start its service on the
    #      now-passive Pi (dual-active MinIO, 2026-06-12). The ExecStopPost
    #      path passes --force: keepalived is gone there, so a lingering
    #      VIP no longer implies mastership.
    # Gluster replica-3-arbiter on ten provides write-quorum: during a true
    # pi1↔pi2 partition, the side that can still reach ten gets writes; the
    # other side gets EROFS and its services crash cleanly — no corruption.
    - name: Create notify protocol library
      ansible.builtin.copy:
        dest: /etc/keepalived/notify_lib.sh
        mode: '0644'
        content: |
          #!/bin/bash
          # Shared protocol for keepalived notify handlers (sourced, not run).
          # Mastership is read from live VIP ownership — kernel state that
          # keepalived updates BEFORE invoking notify scripts. A handler that
          # re-reads it under its service lock always converges to the latest
          # transition; kernel state cannot land out of order the way a
          # recorded state file racing concurrent notify writers can.
          vip_present() {
            [ -n "$(ip -o addr show to {{ vip }}/32)" ]
          }

          # Single source of truth for the active-passive service set:
          # <unit> <data-dir (sentinel home)> <health-url> <timeout-s> <probe-interval-s>
          SERVICES="
          nexus /mnt/data/nexus http://localhost:8081/service/rest/v1/status 180 10
          "

          # Run "$1 <svc args>" for every service in parallel; nonzero if any failed.
          for_each_service() {
            local cmd=$1 rc=0 pids=() svc dir url timeout interval
            while read -r svc dir url timeout interval; do
              [ -n "$svc" ] || continue
              "$cmd" "$svc" "$dir" "$url" "$timeout" "$interval" &
              pids+=($!)
            done <<< "$SERVICES"
            for p in "${pids[@]}"; do
              wait "$p" || rc=1
            done
            return "$rc"
          }

    - name: Create per-service takeover script
      ansible.builtin.copy:
        dest: /etc/keepalived/service_master.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Usage: service_master.sh <unit> <data-dir> <health-url> <timeout-s> <probe-interval-s>
          set +e
          . /etc/keepalived/notify_lib.sh
          SVC=$1; DATA_DIR=$2; HEALTH_URL=$3; TIMEOUT=$4; INTERVAL=$5
          TAG="${SVC}-keepalived"
          HOSTNAME=$(hostname)
          SENTINEL="${DATA_DIR}/.active-on-${HOSTNAME}"

          # Vagrant flows deploy keepalived without every service installed.
          systemctl cat "$SVC" >/dev/null 2>&1 || { logger -t "$TAG" "unit $SVC not installed — skipping"; exit 0; }

          # Serialize against the backup handler for this service; a queued
          # stale handler re-reads VIP ownership under the lock and yields.
          # Bounded so a Gluster-wedged peer handler can't park us forever.
          exec 9>"/run/lock/keepalived-${SVC}.lock"
          flock -w 300 9 || { logger -t "$TAG" "ERROR: lock timeout for $SVC"; exit 1; }

          if ! vip_present; then
            logger -t "$TAG" "skip takeover on $HOSTNAME: VIP not held"
            exit 0
          fi
          logger -t "$TAG" "notify_master: taking over $SVC on $HOSTNAME"

          # Refuse a missing data dir — mkdir here would shadow an unmounted
          # Gluster mountpoint with an empty rootfs dir and start the service
          # against it.
          [ -d "$DATA_DIR" ] || { logger -t "$TAG" "ERROR: data dir $DATA_DIR missing (unmounted?)"; exit 1; }

          # Stale sentinels from other hosts should have been removed by
          # their notify_backup; log and continue — service-level locks are
          # the backstop.
          for stale in "$DATA_DIR"/.active-on-*; do
            [ -e "$stale" ] || continue
            [ "$stale" = "$SENTINEL" ] || logger -t "$TAG" "WARN: stale sentinel $stale"
          done
          touch "$SENTINEL"

          # Clear a prior failed/start-limit state so the periodic converge
          # timer can re-arm a service that crashed past StartLimitBurst on
          # the stable master — where no VRRP transition re-fires notify.
          systemctl reset-failed "$SVC" 2>/dev/null || true

          # --no-block: a Gluster stall can wedge a forking start for up to
          # TimeoutStartSec while we hold the service lock; the loop below
          # gates readiness and stays abortable.
          systemctl start --no-block "$SVC"

          # Readiness wait: recheck VIP ownership every second (the wait must
          # not outlive a MASTER->BACKUP flip) and fail fast on a failed unit
          # (start-limit-hit is reported nowhere else with --no-block).
          elapsed=0
          while [ "$elapsed" -lt "$TIMEOUT" ]; do
            if ! vip_present; then
              logger -t "$TAG" "VIP lost during $SVC takeover on $HOSTNAME — yielding"
              exit 0
            fi
            if systemctl is-failed --quiet "$SVC"; then
              logger -t "$TAG" "ERROR: $SVC entered failed state during takeover"
              exit 1
            fi
            if [ $((elapsed % INTERVAL)) -eq 0 ] && curl -sf -o /dev/null -m 3 "$HEALTH_URL"; then
              logger -t "$TAG" "$SVC on $HOSTNAME is ready"
              exit 0
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          logger -t "$TAG" "ERROR: $SVC on $HOSTNAME not ready in ${TIMEOUT}s"
          exit 1

    - name: Create per-service release script
      ansible.builtin.copy:
        dest: /etc/keepalived/service_backup.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Usage: service_backup.sh <unit> <data-dir> [ignored extra args]
          # RELEASE_FORCE=--force (ExecStopPost path) skips the master-again
          # gate: keepalived is gone there, so a lingering VIP no longer
          # implies mastership.
          set +e
          . /etc/keepalived/notify_lib.sh
          SVC=$1; DATA_DIR=$2
          TAG="${SVC}-keepalived"
          HOSTNAME=$(hostname)

          systemctl cat "$SVC" >/dev/null 2>&1 || { logger -t "$TAG" "unit $SVC not installed — skipping"; exit 0; }

          exec 9>"/run/lock/keepalived-${SVC}.lock"
          flock -w 300 9 || { logger -t "$TAG" "ERROR: lock timeout for $SVC"; exit 1; }

          if [ "${RELEASE_FORCE:-}" != "--force" ] && vip_present; then
            logger -t "$TAG" "skip release on $HOSTNAME: VIP held (master again)"
            exit 0
          fi
          logger -t "$TAG" "notify_backup: releasing $SVC on $HOSTNAME"
          systemctl stop "$SVC"
          rm -f "${DATA_DIR}/.active-on-${HOSTNAME}"
          if systemctl is-active --quiet "$SVC"; then
            logger -t "$TAG" "ERROR: $SVC still active after stop on $HOSTNAME"
            exit 1
          fi
          # A deliberate stop of a consul-lock-fenced unit that was blocked
          # acquiring (non-holder) leaves the unit `failed` (consul lock exits
          # non-zero on SIGTERM before acquiring). Clear it so the non-holder
          # rests cleanly `inactive`, not `failed` — this is a deliberate
          # release, not a crash.
          systemctl reset-failed "$SVC" 2>/dev/null || true

    # Remove the old hand-duplicated per-service scripts (nexus_*/minio_*),
    # now superseded by the parameterized service_master.sh/service_backup.sh
    # driven from the SERVICES table in notify_lib.sh.
    - name: Remove superseded per-service notify scripts
      ansible.builtin.file:
        path: "/etc/keepalived/{{ item }}"
        state: absent
      loop:
        - nexus_master.sh
        - nexus_backup.sh
        - minio_master.sh
        - minio_backup.sh
        # Even older combined-script names, before active_services_*.sh.
        - notify_master.sh
        - notify_backup.sh

    # Combined master/backup helpers — keepalived's notify_* directives
    # take a single script path, but we coordinate multiple active-passive
    # services. Each combined script converges all services in PARALLEL:
    # a slow Nexus takeover must not delay MinIO by up to 180s, which is
    # how the 2026-06-12 stale-takeover happened.
    - name: Create combined notify_master script
      ansible.builtin.copy:
        dest: /etc/keepalived/active_services_master.sh
        mode: '0755'
        content: |
          #!/bin/bash
          . /etc/keepalived/notify_lib.sh
          for_each_service /etc/keepalived/service_master.sh

    - name: Create combined notify_backup script
      ansible.builtin.copy:
        dest: /etc/keepalived/active_services_backup.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # --force (ExecStopPost path): unconditional release — keepalived
          # is gone, a lingering VIP no longer implies mastership.
          RELEASE_FORCE="${1:-}"
          export RELEASE_FORCE
          . /etc/keepalived/notify_lib.sh
          for_each_service /etc/keepalived/service_backup.sh

    # Ensure Nexus + MinIO are stopped whenever Keepalived stops
    # (systemctl stop, daemon crash, OOM, etc.) — notify_backup only
    # fires on VRRP state transitions, not on daemon exit. Without
    # this, stopping keepalived on the active Pi leaves the active
    # services running while the other Pi takes VIP and starts its
    # own copies — both race on cluster locks.
    - name: Systemd drop-in dir for keepalived
      ansible.builtin.file:
        path: /etc/systemd/system/keepalived.service.d
        state: directory
        mode: '0755'

    - name: Drop-in to release active-passive services on keepalived stop
      ansible.builtin.copy:
        dest: /etc/systemd/system/keepalived.service.d/release-active-services.conf
        mode: '0644'
        content: |
          [Service]
          ExecStopPost=/etc/keepalived/active_services_backup.sh --force
      notify: Reload systemd

    # Remove the old Nexus-only drop-in if it's still around — replaced
    # by release-active-services.conf above.
    - name: Remove obsolete stop-nexus drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/keepalived.service.d/stop-nexus.conf
        state: absent
      notify: Reload systemd

    # a config keepalived refuses is never installed (its own --config-test on the new file): a reboot, an upgrade's
    # restart or a reload would load it - on one Pi a mixed pair, on both no VIP
    - name: Write Keepalived config
      register: _ka_conf
      ansible.builtin.copy:
        validate: keepalived --config-test -f %s
        dest: /etc/keepalived/keepalived.conf
        mode: '0600'  # the VRRP auth_pass is in it
        content: |
          global_defs {
            router_id {{ inventory_hostname }}
            script_user root
            enable_script_security
          }

          vrrp_script check_services {
            script "/etc/keepalived/check_services.sh"
            interval 5
            timeout 4
            weight -50
            fall 3
            rise 2
          }

          # a minute (12 failed checks 5 s apart): Forgejo's restarts take 3-11 s, Caddy serves git from the other
          # Pi's Forgejo meanwhile. Lighter than the services' 50: a Pi whose Forgejo alone is down (80) still takes
          # the VIP from a holder failing its services (50), and both Pis' Forgejo down together moves nothing
          vrrp_script check_forgejo {
            script "/etc/keepalived/check_forgejo.sh"
            interval 5
            timeout 4
            weight -20
            fall 12
            rise 2
          }

          vrrp_instance PI_VIP {
            state {{ vrrp_state }}
            interface {{ vrrp_interface }}
            virtual_router_id {{ vrrp_router_id }}
            priority {{ vrrp_priority }}
            advert_int 1
            # a holder whose priority fell is taken over 30 s later, not at once: a restart shorter than its checks' fall
            # and this (Keycloak's ~10 s, Forgejo's - both Pis' at an upgrade) moves nothing; a holder that stops or
            # dies is taken over at once (priority 0, or its adverts gone)
            preempt_delay 30

            # Unicast VRRP — multicast may not cross Vagrant/libvirt bridged
            # private networks; unicast explicitly targets the peer IP on the
            # same interface so elections work reliably in both Vagrant and
            # production (where multicast works but unicast is no-cost).
            unicast_src_ip {{ peer_src_ip }}
            unicast_peer {
              {{ peer_other_ip }}
            }

            authentication {
              auth_type PASS
              auth_pass {{ vrrp_password }}
            }

            virtual_ipaddress {
              {{ vip }}/{{ vip_cidr }}
            }

            track_script {
              check_services
              check_forgejo
            }

            notify_master "/etc/keepalived/active_services_master.sh"
            notify_backup "/etc/keepalived/active_services_backup.sh"
            notify_fault "/etc/keepalived/active_services_backup.sh"
          }
      diff: false  # the VRRP auth_pass - a --check --diff preview would print it

    - name: Enable and start Keepalived
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: started
        daemon_reload: true
      register: _keepalived_start

    # A config keepalived has not loaded is reloaded - re-read, the VRRP state kept (a restart would run the stop
    # drop-in, releasing Nexus) - one Pi at a time, the VIP's holder last: both at once moved the VIP 5 times in 8 (the
    # copy, 2026-11-16). Pending: the config written by this run (a hand edit or a rollback it restored), or its
    # checksum not the one recorded at the last reload (a run cut short between the write and the reload); a keepalived
    # this run started read the config as written - recorded, not reloaded. The config passed keepalived's own
    # --config-test before it was written. Before any reload: both Pis in the play, the VIP held by one. The holder's
    # reload - its one planned move at most - waits for the other Pi ready to take the VIP (keepalived running, the VIP
    # not on it, its own checks passing: a sick standby would take it and hand it back - two Nexus moves) and the
    # holder read again (moved meanwhile: refused).
    - name: Keepalived's config as written and as last loaded
      ansible.builtin.shell: |
        set -o pipefail
        sum=$(sha256sum /etc/keepalived/keepalived.conf) || exit 1
        echo "conf=${sum%% *}"
        echo "loaded=$(cat /etc/keepalived/.loaded.sha256 2> /dev/null)"
      register: _ka_sums
      changed_when: false
      check_mode: false  # a read: a preview says what it would reload

    - name: Keepalived started by this run, or its config pending a reload
      ansible.builtin.set_fact:
        _ka_conf_sum: "{{ _ka_sums.stdout_lines | select('match', '^conf=') | first | regex_replace('^conf=', '') }}"
        _ka_loaded_sum: "{{ _ka_sums.stdout_lines | select('match', '^loaded=') | first | regex_replace('^loaded=', '') }}"
        _ka_started_now: "{{ _keepalived_start.status.ActiveState | default('active') not in ['active', 'activating'] }}"

    - name: Its reload pending - the config written now, or not the one loaded last
      ansible.builtin.set_fact:
        _ka_pending: "{{ not _ka_started_now and (_ka_conf is changed or _ka_conf_sum != _ka_loaded_sum) }}"

    - name: Recorded as loaded where keepalived started now with it
      ansible.builtin.copy:
        dest: /etc/keepalived/.loaded.sha256
        content: "{{ _ka_conf_sum }}\n"
        mode: '0600'
      when: _ka_started_now

    # the Pis in the play: one out of it (dead, or a --limit) is reloaded by nothing here - a Pi left with nothing
    # pending goes on (converge, verify); one pending is refused below without both
    - name: Any Pi pending
      ansible.builtin.set_fact:
        _ka_any_pending: >-
          {{ ansible_play_hosts | map('extract', hostvars) | map(attribute='_ka_pending', default=false) | select | list | length > 0 }}

    - name: Both Pis in the play before any reload - the holder's needs the other ready to take the VIP
      ansible.builtin.assert:
        that: groups['pis'] | difference(ansible_play_hosts) | length == 0
        fail_msg: >-
          keepalived's config pending, {{ groups['pis'] | difference(ansible_play_hosts) | join(', ') }} not in the play -
          nothing reloaded (run again with both Pis)
        quiet: true
      when: _ka_any_pending

    - name: The Pi holding the VIP - its reload the last (an election just after a start takes ~4 s - read again once)
      when: _ka_any_pending
      block:
        - name: The Pi holding the VIP
          ansible.builtin.include_tasks: tasks/pi-vip-holder.yml
      rescue:
        - name: An election under way - read again in 10 s
          ansible.builtin.pause:
            seconds: 10

        - name: The Pi holding the VIP, read again
          ansible.builtin.include_tasks: tasks/pi-vip-holder.yml

    - name: The holder as read
      ansible.builtin.set_fact:
        _ka_holder: "{{ pi_vip_holder }}"
      when: _ka_any_pending

    - name: Reload Keepalived where pending - the Pi without the VIP first
      ansible.builtin.systemd:
        name: keepalived
        state: reloaded
      when: _ka_pending and inventory_hostname != _ka_holder

    - name: Its new config recorded as loaded there
      ansible.builtin.copy:
        dest: /etc/keepalived/.loaded.sha256
        content: "{{ _ka_conf_sum }}\n"
        mode: '0600'
      when: _ka_pending and inventory_hostname != _ka_holder

    # its reload a signal answered after systemd returns: a moment before it is judged
    - name: The other Pi's reload settling
      ansible.builtin.pause:
        seconds: 5
      when: _ka_any_pending

    - name: The other Pi's keepalived running - the holder's reload waits for it
      ansible.builtin.systemd:
        name: keepalived
      register: _ka_peer_unit
      retries: 12
      delay: 5
      until: _ka_peer_unit.status.ActiveState | default('') == 'active'
      when: _ka_any_pending and inventory_hostname != _ka_holder

    # ready to take the VIP: not holding it, and healthy by keepalived's own checks (a standby at 50 or 80 would take
    # the VIP at the holder's reload and hand it back - two Nexus moves)
    - name: The other Pi ready to take the VIP - not holding it, its checks passing
      ansible.builtin.shell: |
        set -o pipefail
        [ -z "$(ip -o -4 addr show to {{ keepalived_vip }}/32)" ] || { echo "holds the VIP"; exit 1; }
        /etc/keepalived/check_services.sh || { echo "its services' check fails"; exit 1; }
        /etc/keepalived/check_forgejo.sh || { echo "its Forgejo check fails"; exit 1; }
        echo READY
      register: _ka_peer
      changed_when: false
      retries: 12
      delay: 5
      until: _ka_peer.stdout == 'READY'
      # not in a preview: the check scripts it runs may be this run's own, not written yet (check_forgejo.sh's first
      # deploy: its preview failed on the script missing, 2026-11-16)
      when: _ka_any_pending and inventory_hostname != _ka_holder and not ansible_check_mode

    - name: Both Pis still in the play before the holder's reload
      ansible.builtin.assert:
        that: groups['pis'] | difference(ansible_play_hosts) | length == 0
        fail_msg: >-
          {{ groups['pis'] | difference(ansible_play_hosts) | join(', ') }} left the play (its reload or its BACKUP
          state failed) - the holder {{ _ka_holder }} not reloaded
        quiet: true
      when: _ka_any_pending

    - name: The Pi holding the VIP read again right before its reload
      ansible.builtin.include_tasks: tasks/pi-vip-holder.yml
      when: _ka_any_pending

    - name: Still the Pi read first - a VIP moved meanwhile refuses the reload
      ansible.builtin.assert:
        that: pi_vip_holder == _ka_holder
        fail_msg: "the VIP moved from {{ _ka_holder }} to {{ pi_vip_holder }} while the other Pi reloaded - the holder not reloaded"
        quiet: true
      when: _ka_any_pending

    - name: Reload Keepalived where pending - the VIP's holder last
      ansible.builtin.systemd:
        name: keepalived
        state: reloaded
      when: _ka_pending and inventory_hostname == _ka_holder

    - name: Its new config recorded as loaded there too
      ansible.builtin.copy:
        dest: /etc/keepalived/.loaded.sha256
        content: "{{ _ka_conf_sum }}\n"
        mode: '0600'
      when: _ka_pending and inventory_hostname == _ka_holder

    # Fire any pending handler (systemd's reload) NOW, not at end of play - the
    # converge + verify tasks below must assert the steady state after the
    # reloads above, not a snapshot a later change immediately invalidates.
    - name: Apply pending handlers before converging
      ansible.builtin.meta: flush_handlers

    # Converge script — reused by the deploy task below AND the periodic
    # keepalived-converge.timer. Runs both handlers per service: each
    # self-gates on live VIP ownership under its per-service flock, so on
    # the VIP holder the master pass acts (re-arming a service that crashed
    # out, since service_master resets a failed unit) and backup skips; on
    # the non-holder master skips and backup ensures stopped. Idempotent.
    - name: Create converge script
      ansible.builtin.copy:
        dest: /etc/keepalived/converge.sh
        mode: '0755'
        content: |
          #!/bin/bash
          . /etc/keepalived/notify_lib.sh
          converge_one() {
            /etc/keepalived/service_master.sh "$@" && /etc/keepalived/service_backup.sh "$@"
          }
          for_each_service converge_one

    # Notify handlers only fire on VRRP transitions, so redeploying the
    # scripts (or a past stale handler leaving a service running on the
    # passive Pi) leaves service state unconverged until the next failover.
    - name: Converge active-passive services to current VIP ownership
      ansible.builtin.command: /etc/keepalived/converge.sh
      changed_when: false

    # Don't trust the converge scripts' exit codes alone — assert the end
    # state: services active exactly on the VIP holder. Budget must cover a
    # cold async start: when converge runs during the post-restart VRRP
    # election (VIP momentarily on neither node), it skips starting, and
    # keepalived's own notify_master does the cold start afterwards — a JVM
    # Nexus can take the full takeover envelope (180s) to report active.
    - name: Verify active-passive services match VIP ownership
      ansible.builtin.shell: |
        set -eo pipefail
        . /etc/keepalived/notify_lib.sh
        if vip_present; then want=active; else want=inactive; fi
        while read -r svc _rest; do
          [ -n "$svc" ] || continue
          systemctl cat "$svc" >/dev/null 2>&1 || { echo "SKIP: $svc not installed"; continue; }
          if systemctl is-active --quiet "$svc"; then got=active; else got=inactive; fi
          if [ "$got" != "$want" ]; then
            echo "MISMATCH: $svc is $got, want $want"
            exit 1
          fi
        done <<< "$SERVICES"
        echo "OK: active-passive services match VIP ownership ($want)"
      register: _ap_state
      changed_when: false
      retries: 36
      delay: 5
      until: _ap_state.rc == 0

    # Periodic re-converge — closes the stable-master crash strand:
    # notify_master only fires on a VRRP transition, so a service that
    # crashes past its systemd start-limit on the stable VIP holder is
    # never re-armed. This timer re-runs the (idempotent) converge so the
    # holder re-arms it within one interval; harmless on a healthy node.
    - name: Install keepalived-converge oneshot service
      ansible.builtin.copy:
        dest: /etc/systemd/system/keepalived-converge.service
        mode: '0644'
        content: |
          [Unit]
          Description=Re-converge keepalived active-passive services to VIP ownership
          After=keepalived.service
          [Service]
          Type=oneshot
          ExecStart=/etc/keepalived/converge.sh
      notify: Reload systemd

    - name: Install keepalived-converge timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/keepalived-converge.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Periodic re-converge of keepalived active-passive services
          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=3min
          WantedBy=timers.target
      notify: Reload systemd

    - name: Enable and start keepalived-converge timer
      ansible.builtin.systemd:
        name: keepalived-converge.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

# ─── The drop-in loaded where it is pending: a daemon-reload, no restart ───────────────────────────────────────────
# The drop-in sets ExecStopPost alone, which systemd runs at keepalived's next stop from the unit as it holds it: a
# daemon-reload applies it (checked on a running unit, 2026-10-08: its PID kept, the new ExecStopPost run at its stop) -
# the restart it had moved the VIP for nothing. One that sets anything else needs keepalived restarted: refused here.
# Pending, not "changed by this run": a run cut short after writing the drop-in and before its reload left it
# unloaded, and the next run changed nothing.
- name: Keepalived's drop-in loaded where pending - a daemon-reload, no restart
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    # by content, against what systemd last loaded for keepalived (a stamp): by the clock it was wrong both ways on the
    # Pis, which have no RTC
    - name: A drop-in pending here - other than the one systemd holds for keepalived
      ansible.builtin.include_tasks: tasks/restart-pending.yml
      vars:
        loaded_service: keepalived
        loaded_files: [/etc/systemd/system/keepalived.service.d/release-active-services.conf]
        # its status as the start found it: not running, it started on this drop-in just now
        loaded_started_now: "{{ _keepalived_start.status.ActiveState | default('active') not in ['active', 'activating'] }}"

    # the drop-in (written above) sets ExecStopPost alone - anything else would need keepalived restarted, one Pi at a
    # time: tests/ansible/unit/keepalived-pending holds it to that
    # systemd's own word too: an upgraded package (apt) leaves the unit needing a reload while the drop-in's record
    # says current - read again then, as for a pending drop-in (it failed every run until a hand reloaded it)
    - name: Whether systemd needs keepalived's unit read again
      ansible.builtin.command:
        argv: [systemctl, show, keepalived, -p, NeedDaemonReload, --value]
      register: _keepalived_need_reload
      changed_when: false
      check_mode: false  # a read

    - name: The unit read again
      ansible.builtin.systemd:
        daemon_reload: true
      when: _restart_pending.stdout_lines[0] == 'pending' or _keepalived_need_reload.stdout == 'yes'

    # pending or not: a record that says current proves nothing of the unit systemd holds now
    - name: Systemd runs the drop-in's ExecStopPost at keepalived's next stop, its unit needing no reload
      ansible.builtin.command:
        argv: [systemctl, show, keepalived, -p, ExecStopPost, -p, NeedDaemonReload]
      register: _stop_post
      changed_when: false
      failed_when: >-
        _stop_post.rc != 0 or 'active_services_backup.sh --force' not in _stop_post.stdout
        or 'NeedDaemonReload=no' not in _stop_post.stdout_lines
      check_mode: false  # a read
      # a preview reloaded nothing
      when: >-
        not (ansible_check_mode and (_restart_pending.stdout_lines[0] == 'pending'
        or _keepalived_need_reload.stdout == 'yes'))

    # what the next run compares with: loaded (a failed reload or check ends this Pi's run before here), or current
    - name: Keepalived's drop-in as systemd runs it, recorded
      ansible.builtin.include_tasks: tasks/restart-recorded.yml
      vars:
        loaded_service: keepalived
        loaded_hash: "{{ _restart_pending.stdout_lines[1] }}"

# ─── Verify ─────────────────────────────────────────────────────────────────
- name: Verify Keepalived
  hosts: pi1,pi2
  become: true
  gather_facts: false

  vars:
    vip: "{{ keepalived_vip }}"

  tasks:
    - name: Check Keepalived status  # noqa: command-instead-of-module
      ansible.builtin.shell: |
        set -o pipefail
        systemctl is-active keepalived && ip addr show | grep {{ vip }} || echo "VIP not on this node"
      register: keepalived_status
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    - name: Print status
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }}: {{ keepalived_status.stdout }}

- name: Verify VIP reachable
  # each Pi checked (pinned to pi1, the check was skipped without a word while pi1 was down)
  hosts: pis
  become: true
  gather_facts: false

  vars:
    vip: "{{ keepalived_vip }}"

  tasks:
    - name: Wait for VRRP election
      ansible.builtin.pause:
        seconds: 5

    - name: Ping VIP
      ansible.builtin.shell: |
        ping -c 2 -W 2 {{ vip }}
      changed_when: false

    # VRRP election + notify_master Nexus bootstrap + Forgejo readiness can
    # all happen concurrently after keepalived restart. 2 min budget.
    - name: Check Forgejo via VIP
      ansible.builtin.uri:
        url: "http://{{ vip }}:3000/api/v1/version"
        status_code: 200
      register: forgejo_vip
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      retries: 24
      delay: 5
      until: forgejo_vip.status == 200

    - name: Check Keycloak via VIP
      ansible.builtin.uri:
        url: "http://{{ vip }}:8080/realms/master"
        status_code: 200
      register: keycloak_vip
      check_mode: false  # a read: a preview (--check) runs it, and what reads it

    - name: Print results
      ansible.builtin.debug:
        msg: |
          ============================================
          Keepalived Setup — Complete
          ============================================
          VIP {{ vip }} is active
          Forgejo:  {{ forgejo_vip.status }}
          Keycloak: {{ keycloak_vip.status }}
          ============================================
