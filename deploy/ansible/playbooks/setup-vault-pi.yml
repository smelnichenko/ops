---
# Setup Pi Vault — final-state, idempotent
#
# Produces the current production state in a single pass on BOTH Pis:
#   - vault + vault-unseal systemd units
#   - Consul storage backend
#   - Shamir unseal with keys persisted to /etc/vault-unseal/ (consumed by
#     vault-unseal.service on reboot)
#   - KV v2 + eso-reader policy + kubernetes auth (initialised once on pi1)
#
# Prerequisites:
#   - Consul cluster running on pi1 + pi2 (setup-consul.yml)
#   - Postgres/services present (setup-pi-services.yml) — not a hard dep,
#     but the tls cert host list assumes both Pis are reachable
#
# Usage:
#   task deploy:vault-pi
#   # or (vagrant)
#   venv/bin/ansible-playbook -i inventory/vagrant.yml \
#     playbooks/setup-vault-pi.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml

# ─── Install Vault on both Pis ──────────────────────────────────────────────
- name: Install Vault on pi1 + pi2
  hosts: pis
  become: true
  gather_facts: true
  vars_files:
    - ../vars/production-lan.yml

  vars:
    # the inventory's, not a fact the Pi reports: pi1's CA signs it into the other Pi's certificate
    node_ip: "{{ node_ip_override | default(ansible_host) }}"

  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

  tasks:
    # ── Packages + user ────────────────────────────────────────────────
    - name: Install required packages
      ansible.builtin.apt:
        name: [curl, unzip, jq, ufw, openssl, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create vault group
      ansible.builtin.group:
        name: vault
        system: true

    - name: Create vault user
      ansible.builtin.user:
        name: vault
        group: vault
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/vault
        create_home: false

    # Vault's own user owns its data only: its config and TLS files are root's, readable by its group (a compromised
    # Vault would otherwise swap the CA its unseal script trusts, or its own config)
    - name: Create vault directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: vault
        mode: '0750'
      loop:
        - { path: /etc/vault.d, owner: root }
        - { path: /etc/vault.d/tls, owner: root }
        - { path: /var/lib/vault, owner: vault }

    # the CA's key and serial in a root-only directory on pi1 (the CA's Pi), out of Vault's reach (they were in
    # /etc/vault.d/tls, Vault's) - delegated: a run limited to pi2 signs its certificate with them all the same
    - name: The CA's directory, root-only
      ansible.builtin.file:
        path: /etc/vault-ca
        state: directory
        owner: root
        group: root
        mode: '0700'
      delegate_to: pi1
      run_once: true

    # production's key and serial (the serial keeps the CA's numbering), each only where none is yet. A key in both
    # places: the same - the copy Vault can read removed; another - refused (which one signed the CA is the operator's
    # to say: `openssl x509 -noout -pubkey -in /etc/vault.d/tls/ca-cert.pem` against each key's `openssl pkey -pubout`)
    - name: The CA's key and serial moved out of Vault's TLS directory (production's, from before)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          for f in ca-key.pem ca-cert.srl; do
            if [ -e "/etc/vault.d/tls/$f" ] && [ ! -e "/etc/vault-ca/$f" ]; then
              mv -n "/etc/vault.d/tls/$f" "/etc/vault-ca/$f"
              echo "moved $f"
            elif [ "$f" = ca-key.pem ] && [ -e "/etc/vault.d/tls/$f" ]; then
              if cmp -s "/etc/vault.d/tls/$f" "/etc/vault-ca/$f"; then
                rm -f "/etc/vault.d/tls/$f"
                echo "removed $f from Vault's directory (the same as the root-only one)"
              else
                echo "REFUSED: two CA keys - /etc/vault.d/tls/ca-key.pem (Vault can read it) differs from" \
                  "/etc/vault-ca/ca-key.pem: keep the one that signed ca-cert.pem, remove the other by hand"
                exit 1
              fi
            fi
          done
      register: _ca_moved
      changed_when: "'moved' in _ca_moved.stdout or 'removed' in _ca_moved.stdout"
      delegate_to: pi1
      run_once: true

    # the CA's key lives on pi1 alone: one in another Pi's Vault directory is refused, left as it is
    - name: No CA key in Vault's directory on the other Pis
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          if [ -e /etc/vault.d/tls/ca-key.pem ]; then
            echo "REFUSED: a CA key in /etc/vault.d/tls on {{ inventory_hostname }} (Vault can read it; the CA is pi1's) -" \
              "remove it by hand once you know where it came from"
            exit 1
          fi
      changed_when: false
      check_mode: false  # a read
      when: inventory_hostname != 'pi1'

    - name: Create vault-unseal directory
      ansible.builtin.file:
        path: /etc/vault-unseal
        state: directory
        owner: root
        group: root
        mode: '0700'

    # ── UFW ────────────────────────────────────────────────────────────
    - name: UFW default deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: UFW allow SSH from LAN IPv4
      community.general.ufw:
        rule: allow
        from_ip: "{{ vault_pi_ssh_allow_ipv4 | default(production_lan) }}"
        port: "22"
        proto: tcp

    - name: UFW allow SSH from LAN IPv6
      community.general.ufw:
        rule: allow
        from_ip: "{{ vault_pi_ssh_allow_ipv6 | default(production_lan6) }}"
        port: "22"
        proto: tcp
      when: (vault_pi_ssh_allow_ipv6 | default(production_lan6)) | length > 0

    - name: UFW allow SSH from extra range (Vagrant NAT)
      community.general.ufw:
        rule: allow
        from_ip: "{{ vault_pi_ssh_allow_extra_ipv4 }}"
        port: "22"
        proto: tcp
      when: vault_pi_ssh_allow_extra_ipv4 is defined and vault_pi_ssh_allow_extra_ipv4 | length > 0

    - name: UFW allow Vault from kubeadm node IPv4
      community.general.ufw:
        rule: allow
        from_ip: "{{ vault_cluster_ip | default(production_ten_ip) }}"
        port: "8200"
        proto: tcp

    - name: UFW allow Vault from kubeadm node IPv6
      community.general.ufw:
        rule: allow
        from_ip: "{{ vault_cluster_ipv6 | default(production_ten_ipv6) }}"
        port: "8200"
        proto: tcp
      when: (vault_cluster_ipv6 | default(production_ten_ipv6)) | length > 0

    # the API between the Pis: setup-consul's step-down reads both Vaults from the Pi holding the root token
    - name: UFW allow Vault's API from the Pis
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        port: "8200"
        proto: tcp
      loop:
        - "{{ hostvars['pi1']['ansible_host'] }}"
        - "{{ hostvars['pi2']['ansible_host'] }}"

    - name: UFW allow Vault peer-to-peer (Pi↔Pi cluster port)
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        port: "8201"
        proto: tcp
      loop:
        - "{{ hostvars['pi1']['ansible_host'] }}"
        - "{{ hostvars['pi2']['ansible_host'] }}"

    # the rule that opened the cluster port to the whole LAN (an older playbook's; production's in both families, read
    # 2026-10-08) - removed after the narrow ones above, as setup-consul closes Consul's
    - name: Vault's cluster port no more open to the LAN
      community.general.ufw:
        rule: allow
        port: "8201"
        proto: tcp
        delete: true

    # ── Vault binary ───────────────────────────────────────────────────
    - name: Check current Vault version
      ansible.builtin.command: /usr/local/bin/vault version
      register: current_vault_version
      failed_when: false
      changed_when: false
      check_mode: false  # a read: skipped, it registered rc 0 and a preview showed Vault installed where it is not

    # only where Vault is missing: a running pair is moved by upgrade-vault.yml (standby first, restarted, unsealed) -
    # a swap here replaced the binary under the running server and restarted nothing
    - name: Install Vault binary
      when: current_vault_version.rc != 0
      block:
        - name: Download Vault, its sha256 checked
          ansible.builtin.get_url:
            url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_{{ vault_arch }}.zip"
            dest: /tmp/vault.zip
            checksum: "sha256:{{ vault_checksums[vault_arch] }}"
            mode: '0644'
        # a preview's download fetched nothing: what reads the zip skipped then (it failed there). A fresh Pi's preview
        # fails later all the same - on the CA and the CSR it would have made - no flow previews one
        - name: Unzip Vault
          ansible.builtin.unarchive:
            src: /tmp/vault.zip
            dest: /usr/local/bin/
            remote_src: true
          when: not ansible_check_mode
        - name: Vault binary mode
          ansible.builtin.file:
            path: /usr/local/bin/vault
            mode: '0755'
            owner: root
            group: root
          when: not ansible_check_mode
        - name: Remove Vault zip
          ansible.builtin.file:
            path: /tmp/vault.zip
            state: absent
          when: not ansible_check_mode

    # ── TLS: one CA, per-Pi certs signed by it (production's layout) ────
    # Production's Vault certs (2026-04-04) are signed by one CA and carry the node IP, the keepalived VIP and
    # 127.0.0.1, so ESO trusts one CA (the vault-pi-ca Secret) for both Pis and reaches Vault through the VIP. This
    # playbook used to self-sign each Pi without the VIP - a fresh deployment (the Vagrant upgrade test) could not
    # reach Vault through the VIP. Every step is guarded: a Pi that already has its CA / cert (production) is untouched.
    - name: Stat the Vault cert (already issued?)
      ansible.builtin.stat:
        path: /etc/vault.d/tls/vault-cert.pem
      register: _vault_cert

    # keyUsage as production's CA has it: Python 3.13 verifies X.509-strict by default (every uri check against Vault
    # on the Pis), and a CA certificate without it is refused
    - name: Create the Vault CA on pi1 (once; production already has its CA)
      ansible.builtin.command: >-
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-384 -days 3650 -nodes
        -keyout /etc/vault-ca/ca-key.pem -out /etc/vault.d/tls/ca-cert.pem -subj "/CN=Schnappy Vault CA"
        -addext "keyUsage=critical,keyCertSign,cRLSign"
      args:
        creates: /etc/vault.d/tls/ca-cert.pem
      delegate_to: pi1
      run_once: true

    # moved, production's kept Vault's user as its owner (vault:vault 0400): root's alone. Where it is (a preview,
    # --check, moved nothing)
    - name: The CA's key
      ansible.builtin.stat:
        path: /etc/vault-ca/ca-key.pem
      register: _ca_key
      delegate_to: pi1
      run_once: true

    - name: The CA's key root's alone
      ansible.builtin.file:
        path: /etc/vault-ca/ca-key.pem
        owner: root
        group: root
        mode: '0400'
      delegate_to: pi1
      run_once: true
      when: _ca_key.stat.exists

    - name: Read the Vault CA cert from pi1
      ansible.builtin.slurp:
        src: /etc/vault.d/tls/ca-cert.pem
      register: _vault_ca
      delegate_to: pi1
      run_once: true

    - name: Install the Vault CA cert (pi2 gets pi1's)
      ansible.builtin.copy:
        dest: /etc/vault.d/tls/ca-cert.pem
        content: "{{ _vault_ca.content | b64decode }}"
        force: false
        mode: '0644'

    # the names the certificate is for - the CSR asks for them, and the CA signs exactly these (below)
    - name: The Pi's certificate names (node IP, VIP, loopback)
      ansible.builtin.set_fact:
        _sans:
          - "DNS:{{ vault_pi_dns }}"
          - "DNS:{{ inventory_hostname }}.schnappy.io"
          - "IP:{{ node_ip }}"
          - "IP:{{ keepalived_vip }}"
          - "IP:127.0.0.1"

    - name: Generate the Pi's key and CSR
      ansible.builtin.command: >-
        openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-384 -nodes
        -keyout /etc/vault.d/tls/vault-key.pem -out /etc/vault.d/tls/vault.csr -subj "/CN={{ vault_pi_dns }}"
        -addext "subjectAltName={{ _sans | join(',') }}"
      args:
        creates: /etc/vault.d/tls/vault.csr
      when: not _vault_cert.stat.exists

    - name: Read the CSR
      ansible.builtin.slurp:
        src: /etc/vault.d/tls/vault.csr
      register: _vault_csr
      when: not _vault_cert.stat.exists

    # the CSR on stdin (it was templated into the CA host's root shell), and its extensions the playbook's, never the
    # request's: copied, a CSR asking CA:TRUE got a CA certificate from the CA External Secrets trusts
    - name: Sign the CSR with the CA on pi1 - a server certificate for the playbook's names only
      ansible.builtin.shell: |
        set -euo pipefail
        # the names through the environment, never templated into this root shell - one is a fact of the other Pi -
        # each a plain DNS name or IPv4 address; split on commas alone and written as checked: a check that split on
        # blanks too passed a tab or a newline between two names, which the extension file then read otherwise
        [[ $SANS != *[[:space:]]* ]] \
          || { echo "REFUSED: a blank or a newline in the names - not a name or an address"; exit 1; }
        IFS=, read -r -a names <<< "$SANS"
        for n in "${names[@]}"; do
          [[ $n =~ ^DNS:[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ || $n =~ ^IP:([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] \
            || { echo "REFUSED: $n is not a name or an address"; exit 1; }
        done
        ext=$(mktemp); trap 'rm -f "$ext"' EXIT
        printf '%s\n' "basicConstraints=critical,CA:FALSE" "keyUsage=critical,digitalSignature" \
          "extendedKeyUsage=serverAuth" "subjectAltName=$(IFS=,; echo "${names[*]}")" > "$ext"
        openssl x509 -req -in /dev/stdin -CA /etc/vault.d/tls/ca-cert.pem -CAkey /etc/vault-ca/ca-key.pem \
          -CAserial /etc/vault-ca/ca-cert.srl -CAcreateserial -extfile "$ext" -days 3650
      args:
        executable: /bin/bash
        stdin: "{{ _vault_csr.content | b64decode }}"
      environment:
        SANS: "{{ _sans | join(',') }}"
      register: _vault_signed
      delegate_to: pi1
      throttle: 1  # one serial file (-CAserial): two at once read the same serial
      changed_when: true
      when: not _vault_cert.stat.exists

    # a preview (--check) signed nothing: its certificate would read empty
    - name: Install the signed cert
      ansible.builtin.copy:
        dest: /etc/vault.d/tls/vault-cert.pem
        content: "{{ _vault_signed.stdout }}\n"
        mode: '0644'
      when:
        - not _vault_cert.stat.exists
        - not ansible_check_mode

    - name: Set TLS file ownership (root's, Vault reads them through its group)
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: vault
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/vault.d/tls/vault-cert.pem, mode: '0644' }
        - { path: /etc/vault.d/tls/vault-key.pem, mode: '0640' }

    # root's: the unseal script trusts it - Vault's own user must not be able to swap it
    - name: The CA certificate, root's
      ansible.builtin.file:
        path: /etc/vault.d/tls/ca-cert.pem
        owner: root
        group: vault
        mode: '0644'

    # ── vault.hcl ──────────────────────────────────────────────────────
    # a running Vault takes a changed config or unit by a restart - one Pi at a time, after this play (both at once
    # sealed both: Vault down until unsealed); a Vault starting now (a first install) just starts on it
    - name: Vault running before this run
      ansible.builtin.systemd:
        name: vault
      register: _vault_before
      failed_when: false

    - name: Write vault.hcl (Consul backend)
      ansible.builtin.copy:
        dest: /etc/vault.d/vault.hcl
        owner: root
        group: vault
        mode: '0640'
        content: |
          ui = false
          disable_mlock = true

          storage "consul" {
            address = "127.0.0.1:8500"
            path    = "vault/"
          }

          listener "tcp" {
            address            = "[::]:8200"
            tls_cert_file      = "/etc/vault.d/tls/vault-cert.pem"
            tls_key_file       = "/etc/vault.d/tls/vault-key.pem"
            tls_client_ca_file = "/etc/vault.d/tls/ca-cert.pem"
          }

          api_addr     = "https://{{ node_ip }}:8200"
          cluster_addr = "https://{{ node_ip }}:8201"

    # ── vault.service ──────────────────────────────────────────────────
    # Wants= (soft) not Requires= (hard): vault retries consul backend
    # internally. Hard dep caused boot-order coupling that broke reboots
    # when consul.service hadn't activated yet (commit aec9422).
    - name: Write vault.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vault.service
        mode: '0644'
        content: |
          [Unit]
          Description=Vault Server
          After=network-online.target consul.service
          Wants=network-online.target consul.service

          [Service]
          User=vault
          Group=vault
          ExecStart=/usr/local/bin/vault server -config=/etc/vault.d/vault.hcl
          ExecReload=/bin/kill --signal HUP $MAINPID
          KillMode=process
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target

    # ── unseal.sh + vault-unseal.service (shared with upgrade-vault.yml) ──
    - name: The Pi's own unseal
      ansible.builtin.include_tasks: tasks/vault-unseal.yml

    # ── Start vault ────────────────────────────────────────────────────
    - name: Enable + start vault.service
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Vault API (rc=0 unsealed, rc=2 sealed — both mean up)
      ansible.builtin.command: vault operator init -status
      environment:
        VAULT_ADDR: https://127.0.0.1:8200
        VAULT_CACERT: /etc/vault.d/tls/ca-cert.pem
      register: _api_wait
      retries: 12
      delay: 5
      until: _api_wait.rc in [0, 2]
      changed_when: false
      failed_when: _api_wait.rc not in [0, 1, 2]


# ─── A changed config or unit: restarted one Pi at a time ──────────────────
# The standby first (the active one's restart is then the only failover), each back unsealed - its unseal unit
# restarted with it explicitly: Requires= passes a restart on as try-restart, which leaves an inactive unseal unit be -
# or, not initialised yet, answering, before the next; and a restart only while the other Pi's Vault is unsealed
- name: The order - the standby Vault first
  hosts: pis
  become: true
  gather_facts: false
  tasks:
    - name: This Pi's Vault - active (200), standby (429), or neither
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        ca_path: /etc/vault.d/tls/ca-cert.pem
        status_code: [200, 429, 472, 473, 501, 503]
      register: _vault_role
      # a Vault not answering at all (stopped): no status - ordered with the standbys, before the active one; its
      # restart can only start it
      failed_when: false
      check_mode: false  # a read: a preview orders the Pis as a run would

    - name: The restart order
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: vault_restart_order
      loop: >-
        {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('_vault_role.status', 'equalto', 200)
           | map(attribute='inventory_hostname') | list
           + ansible_play_hosts | map('extract', hostvars) | selectattr('_vault_role.status', 'equalto', 200)
           | map(attribute='inventory_hostname') | list }}
      run_once: true
      changed_when: false

- name: Vault restarted where its config or unit changed - one Pi at a time
  hosts: vault_restart_order
  become: true
  gather_facts: false
  serial: 1
  tasks:
    # pending, not just changed by this run: a run that failed between writing and restarting left the new config on
    # disk and the old one running
    - name: A restart pending here - the config or unit other than the running Vault loaded
      ansible.builtin.include_tasks: tasks/restart-pending.yml
      vars:
        loaded_service: vault
        loaded_files: [/etc/vault.d/vault.hcl, /etc/systemd/system/vault.service]
        # not running before this run: started on these files just now (and recorded below - the next run's stamp)
        loaded_started_now: "{{ _vault_before.status.ActiveState | default('active') not in ['active', 'activating'] }}"

    - name: Its answer
      ansible.builtin.set_fact:
        _vault_pending: "{{ _restart_pending.stdout_lines }}"

    - name: Restarted, unsealed before the next
      when:
        - _vault_before.status.ActiveState | default('') == 'active'
        - _vault_pending[0] == 'pending'
      block:
        # this one sealed for its restart while the other is sealed too is Vault down: refused
        - name: The other Pi's Vault unsealed (or neither initialised yet)
          ansible.builtin.uri:
            url: https://127.0.0.1:8200/v1/sys/health
            ca_path: /etc/vault.d/tls/ca-cert.pem
            status_code: [200, 429, 501]
          delegate_to: "{{ groups['pis'] | difference([inventory_hostname]) | first }}"

        - name: Restarted
          ansible.builtin.systemd:
            name: vault
            state: restarted
            daemon_reload: true

        - name: Its unseal run again
          ansible.builtin.systemd:
            name: vault-unseal
            state: restarted

        - name: Unsealed again (or not initialised yet)
          ansible.builtin.uri:
            url: https://127.0.0.1:8200/v1/sys/health
            ca_path: /etc/vault.d/tls/ca-cert.pem
            status_code: [200, 429, 473, 501, 503]
          register: _vault_back
          retries: 36
          delay: 5
          until: _vault_back.status in [200, 429, 501]

    # what the next run compares with: restarted and unsealed again, or found running its config already
    - name: Vault's config as it runs it, recorded
      ansible.builtin.include_tasks: tasks/restart-recorded.yml
      vars:
        loaded_service: vault
        loaded_hash: "{{ _vault_pending[1] }}"
      when: >-
        _vault_pending[0] == 'current'
        or (_vault_back is defined and _vault_back is not skipped and _vault_back is succeeded)

# ─── Initialise Vault on pi1 (first run only) ───────────────────────────────
- name: Initialise Vault on pi1
  hosts: pi1
  become: true
  gather_facts: false

  environment:
    VAULT_ADDR: https://127.0.0.1:8200
    VAULT_CACERT: /etc/vault.d/tls/ca-cert.pem

  tasks:
    - name: Check init status
      ansible.builtin.command: vault operator init -status
      register: _init_status
      check_mode: false  # a read: a preview (--check) reads it, and what reads it
      changed_when: false
      failed_when: _init_status.rc not in [0, 2]

    # the key shares and root token written on the Pi by the init command itself: held only in Ansible's memory, an
    # ssh retry after init ran (ansible.cfg: retries) found it "already initialized" and the shares were gone. Kept,
    # root-only, until the first-init steps below are done - a run cut short after init resumes from it. Each
    # invocation writes its own file aside (an ssh retry overlapping a first one still running truncated the file that
    # one wrote: its shares), on disk before the move (an SD card after a power cut)
    - name: Initialise Vault - its keys written on the Pi as it returns them
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        install -d -m 0700 /etc/vault-unseal
        aside=$(mktemp /etc/vault-unseal/init.json.XXXXXX)
        if ! vault operator init -key-shares={{ vault_unseal_shares }} -key-threshold={{ vault_unseal_threshold }} \
            -format=json > "$aside"; then
          # not initialised: no share exists, its output is nothing; initialised (or unknown), it may hold the shares
          status=0; vault operator init -status > /dev/null 2>&1 || status=$?
          if [ "$status" = 2 ]; then rm -f "$aside"; echo "the init failed, Vault not initialised"; exit 1; fi
          echo "THE INIT FAILED WITH VAULT INITIALISED (or its state unknown) - its output kept at $aside: look by hand"
          exit 1
        fi
        sync "$aside"
        mv -n "$aside" /etc/vault-unseal/init.json
        sync /etc/vault-unseal
      args:
        executable: /bin/bash
        creates: /etc/vault-unseal/init.json
      when: _init_status.rc == 2
      changed_when: true
      no_log: true

    # a run cut short between the init and its move: Vault is initialised (the init above does not run again) and the
    # shares are only in the file aside - promoted, never left stranded; one not whole (cut short in its writing) stops
    # the run for a look by hand. An empty one beside a whole keys file is a run cut short before its init wrote - an
    # init that had initialised Vault would have made the one after fail: removed (it stopped every good run after)
    - name: A first init's output left aside promoted (a run cut short before its move)
      ansible.builtin.shell: |
        set -euo pipefail
        shopt -s nullglob
        for f in /etc/vault-unseal/init.json.*; do
          if [ ! -s "$f" ] && [ -s /etc/vault-unseal/init.json ]; then
            rm -f "$f"; echo "removed the empty $f"; continue
          fi
          if python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d["unseal_keys_b64"] and d["root_token"]' "$f" 2> /dev/null; then
            [ -e /etc/vault-unseal/init.json ] || { mv -n "$f" /etc/vault-unseal/init.json; echo "promoted $f"; }
          else
            echo "$f is not whole - an init cut short in its writing? Look at it by hand (Vault's state, the shares)"; exit 1
          fi
        done
      args:
        executable: /bin/bash
      register: _promoted
      changed_when: "'promoted' in _promoted.stdout or 'removed' in _promoted.stdout"
      no_log: true

    - name: A first init not finished (its keys file still here)
      ansible.builtin.stat:
        path: /etc/vault-unseal/init.json
      register: _init_pending

    # written here from the keys file - the shares never through the controller (read into a result, then a copy with
    # content: writes them to a file on the controller first); each written whole (aside, then moved), root's alone
    - name: The unseal keys and root token written from the first init's keys file, on the Pi (first init only)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          umask 077
          python3 - /etc/vault-unseal <<'PY'
          import json, os, sys
          d = sys.argv[1]
          init = json.load(open(os.path.join(d, "init.json")))
          for name, body in (("unseal-keys", "".join(k + "\n" for k in init["unseal_keys_b64"])),
                             ("root-token", init["root_token"])):
              part = os.path.join(d, name + ".part")
              with open(part, "w") as f:
                  f.write(body)
                  f.flush()
                  os.fsync(f.fileno())
              os.chmod(part, 0o400)
              os.replace(part, os.path.join(d, name))
          PY
      when: _init_pending.stat.exists
      changed_when: true
      no_log: true

    - name: Show root token (first init only)
      ansible.builtin.debug:
        msg: |
          ============================================================
          VAULT INITIALISED. Unseal keys + root token stored at:
            /etc/vault-unseal/unseal-keys
            /etc/vault-unseal/root-token

          BACK THESE UP OFFLINE (USB / safe / paper). They are the
          only way to recover the cluster if both Pis die.
          ============================================================
      when: _init_pending.stat.exists

    - name: Unseal pi1 if sealed (its own script - the key shares never on a command line)
      ansible.builtin.command: /etc/vault-unseal/unseal.sh
      register: _pi1_unseal
      changed_when: "'share' in _pi1_unseal.stdout"

    # ── First-time bootstrap: KV v2 + ESO policy + k8s auth ────────────
    - name: Bootstrap KV + ESO + k8s-auth (first init only - or the one a cut-short run left)
      # each task re-runnable (an enabled engine, a written policy), so a first init cut short resumes here
      when: _init_pending.stat.exists
      block:
        # unsealed is not active: a standby (Consul's lock not taken yet) refuses every write below
        - name: This Vault the active one
          ansible.builtin.uri:
            url: https://127.0.0.1:8200/v1/sys/health
            ca_path: /etc/vault.d/tls/ca-cert.pem
            status_code: [200, 429, 503]
          register: _vault_health
          retries: 30
          delay: 2
          until: _vault_health.status == 200

        # each one checked first, enabled only when missing - a failure fails (it read "already-enabled", the keys
        # file was then removed and the engine never enabled)
        - name: Enable KV v2
          ansible.builtin.shell: |
            set -euo pipefail
            export VAULT_TOKEN=$(cat /etc/vault-unseal/root-token)
            if vault secrets list -format=json | python3 -c 'import json, sys; sys.exit("secret/" not in json.load(sys.stdin))'; then
              echo already-enabled
            else
              vault secrets enable -path=secret kv-v2
            fi
          args:
            executable: /bin/bash
          register: _kv
          changed_when: "'already-enabled' not in _kv.stdout"

        - name: Write eso-reader policy
          ansible.builtin.shell: |
            export VAULT_TOKEN=$(cat /etc/vault-unseal/root-token)
            vault policy write eso-reader - <<'POLICY'
            path "secret/data/*"     { capabilities = ["read"] }
            path "secret/metadata/*" { capabilities = ["read", "list"] }
            POLICY
          changed_when: true

        - name: Enable Kubernetes auth
          ansible.builtin.shell: |
            set -euo pipefail
            export VAULT_TOKEN=$(cat /etc/vault-unseal/root-token)
            if vault auth list -format=json | python3 -c 'import json, sys; sys.exit("kubernetes/" not in json.load(sys.stdin))'; then
              echo already-enabled
            else
              vault auth enable kubernetes
            fi
          args:
            executable: /bin/bash
          register: _k8s_auth
          changed_when: "'already-enabled' not in _k8s_auth.stdout"

        # the shares' files on disk before their only other copy goes (an SD card after a power cut)
        - name: The shares synced to disk
          ansible.builtin.command: sync /etc/vault-unseal/unseal-keys /etc/vault-unseal/root-token
          changed_when: false

        - name: The first init done - its keys file removed (the shares are in unseal-keys and root-token)
          ansible.builtin.file:
            path: /etc/vault-unseal/init.json
            state: absent

# ─── Distribute keys + unseal pi2 ───────────────────────────────────────────
- name: Distribute unseal keys to pi2
  hosts: pi2
  become: true
  gather_facts: false

  environment:
    VAULT_ADDR: https://127.0.0.1:8200
    VAULT_CACERT: /etc/vault.d/tls/ca-cert.pem

  tasks:
    # read on pi1 by this play itself, into memory, never written on the controller (a fetch left every share in its
    # /tmp): a run limited to pi2 skips pi1's plays, and their results with them
    - name: The unseal keys, read on pi1
      ansible.builtin.slurp:
        src: /etc/vault-unseal/unseal-keys
      delegate_to: pi1
      register: _unseal_keys
      no_log: true

    # sent only when pi2's differ (pi1's compared by hash on the controller) - a re-run sends nothing. Not a guard
    # against a host answering in pi2's place: one without the file gets every share - its host key is that guard
    # (asserted below)
    - name: Hash of the unseal keys pi2 holds
      ansible.builtin.command: sha256sum /etc/vault-unseal/unseal-keys
      register: _pi2_keys_sum
      changed_when: false
      failed_when: _pi2_keys_sum.rc != 0 and 'No such file' not in _pi2_keys_sum.stderr
      check_mode: false

    # stdin is in memory only while modules are piped to the remote python: without pipelining Ansible writes the
    # module, its stdin included, to a temp file on the controller first. As this run has it (ansible.cfg, ANSIBLE_*,
    # a host var) - and Ansible pipelines only with no remote files kept and a become plugin that can (sudo; su
    # cannot): ConnectionBase.is_pipelining_enabled
    - name: Pipelining on - the shares never in a file on the controller
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.config', 'pipelining', plugin_type='connection', plugin_name='ssh') | bool
          - not lookup('ansible.builtin.config', 'DEFAULT_KEEP_REMOTE_FILES') | bool
          - (ansible_become_method | default(lookup('ansible.builtin.config', 'DEFAULT_BECOME_METHOD'))) == 'sudo'
        fail_msg: >-
          REFUSED: pipelining is off (pipelining, keep_remote_files or a become method other than sudo) - pi2's key
          shares would be written to a temp file here first
        quiet: true

    # the shares go to the host pi2 is: its host key checked - by Ansible (host_key_checking, as this run has it) and
    # by ssh (no argument of this run's turning it off, in any of ssh's spellings: no/off/false/accept-new after any
    # separator - =, spaces, a tab, quotes - a known-hosts file of /dev/null, a KnownHostsCommand, another config by -F
    # with or without a space; never -f, ssh's background flag). The Vagrant copy's VMs, rebuilt
    # each run with new keys, check none: said by its inventory (host_keys_unchecked_rebuilt_vms) and taken only for a
    # pi2 on the Vagrant network - a production inventory saying it would send the shares unchecked. No backslash in
    # the patterns: a conditional's string literals are read as Jinja reads escapes
    - name: Host keys checked - the shares only to pi2 itself
      vars:
        # ssh's ways to take a host's key unchecked, any one of them
        _unchecked_ssh:
          - 'StrictHostKeyChecking[^a-z0-9/]+(no|off|false|accept-new)'
          - '(User|Global)KnownHostsFile[^a-z0-9/~]+/dev/null'
          - KnownHostsCommand
          - '(^|[^a-z0-9-])(?-i:-F)'
      ansible.builtin.assert:
        that:
          - >-
            (host_keys_unchecked_rebuilt_vms | default(false) | bool
            and hostvars['pi2']['ansible_host'] is match('^192[.]168[.]56[.]'))
            or lookup('ansible.builtin.config', 'host_key_checking', plugin_type='connection', plugin_name='ssh') | bool
          - >-
            (host_keys_unchecked_rebuilt_vms | default(false) | bool
            and hostvars['pi2']['ansible_host'] is match('^192[.]168[.]56[.]'))
            or (lookup('ansible.builtin.config', 'ssh_args', plugin_type='connection', plugin_name='ssh') ~ ' '
            ~ lookup('ansible.builtin.config', 'ssh_common_args', plugin_type='connection', plugin_name='ssh') ~ ' '
            ~ lookup('ansible.builtin.config', 'ssh_extra_args', plugin_type='connection', plugin_name='ssh'))
            is not search(_unchecked_ssh | join('|'), ignorecase=True)
        fail_msg: "REFUSED: host keys not checked - a host answering as pi2 would get every key share"
        quiet: true

    # on stdin (pipelined: in memory, through ssh), never a file on the controller (a copy with content: writes one);
    # written whole, root's alone - only when it differs
    - name: The unseal keys on pi2 - on stdin, never in a file on the controller
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          umask 077
          part=$(mktemp /etc/vault-unseal/unseal-keys.XXXXXX)
          trap 'rm -f "$part"' EXIT
          cat > "$part"
          if cmp -s "$part" /etc/vault-unseal/unseal-keys; then exit 0; fi
          chmod 0400 "$part"
          mv "$part" /etc/vault-unseal/unseal-keys
          echo written
      args:
        stdin: "{{ _unseal_keys.content | b64decode }}"
        stdin_add_newline: false
      register: _pi2_keys
      changed_when: "'written' in _pi2_keys.stdout"
      when: >-
        (_pi2_keys_sum.stdout.split() | first | default(''))
        != (_unseal_keys.content | b64decode | hash('sha256'))
      no_log: true

    # root's alone, read-only - also where its content matched already and nothing was sent (where it was found, or
    # once sent: a first install's preview has none)
    - name: Pi2's unseal keys root's alone, read-only
      ansible.builtin.file:
        path: /etc/vault-unseal/unseal-keys
        owner: root
        group: root
        mode: '0400'
      when: _pi2_keys_sum.rc == 0 or not ansible_check_mode

    - name: Unseal pi2 if sealed (its own script - the key shares never on a command line)
      ansible.builtin.command: /etc/vault-unseal/unseal.sh
      register: _pi2_unseal
      changed_when: "'share' in _pi2_unseal.stdout"

# ─── Enable vault-unseal + ops infrastructure (both Pis) ────────────────────
- name: Enable vault-unseal and install ops infrastructure
  hosts: pis
  become: true
  gather_facts: false

  tasks:
    - name: Enable vault-unseal.service
      ansible.builtin.systemd:
        name: vault-unseal
        enabled: true
        daemon_reload: true

    # ── Health-check cron ──────────────────────────────────────────────
    - name: Write vault health-check script
      ansible.builtin.copy:
        dest: /usr/local/bin/vault-health-check.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # its own file: a fixed /tmp path a local user created first would have answered for Vault
          out=$(mktemp); trap 'rm -f "$out"' EXIT
          HEALTH=$(curl -s --max-time 10 --cacert /etc/vault.d/tls/ca-cert.pem \
            https://127.0.0.1:8200/v1/sys/health \
            -o "$out" -w "%{http_code}" 2>/dev/null)
          SEALED=$(jq -r '.sealed // true' "$out" 2>/dev/null)
          if [ "$SEALED" != "false" ]; then
            logger -t vault-unseal "ALERT: Vault sealed or unreachable, HTTP $HEALTH"
          fi

    - name: Vault health-check cron (every 5 min)
      ansible.builtin.copy:
        dest: /etc/cron.d/vault-health
        mode: '0644'
        content: |
          */5 * * * * root /usr/local/bin/vault-health-check.sh

    # ── Offsite backup dir (receives rsync from cluster) ───────────────
    - name: Create offsite backup dir
      ansible.builtin.file:
        path: /mnt/backups/velero
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0750'

    # ── Git-mirror bare repo ───────────────────────────────────────────
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Create git mirror dir
      ansible.builtin.file:
        path: /mnt/backups/git-mirror
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0750'

    - name: Initialise bare git mirror for monitor repo
      ansible.builtin.shell: |
        if [ ! -f /mnt/backups/git-mirror/monitor.git/HEAD ]; then
          git init --bare /mnt/backups/git-mirror/monitor.git
          chown -R {{ ansible_user }}:{{ ansible_user }} /mnt/backups/git-mirror/monitor.git
          echo created
        fi
      register: _git_init
      changed_when: "'created' in _git_init.stdout"

    # ── Daily vault data backup ────────────────────────────────────────
    - name: Write vault-backup script
      ansible.builtin.copy:
        dest: /usr/local/bin/vault-backup.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          TIMESTAMP=$(date +%Y%m%d)
          BACKUP_DIR="/var/backups/vault"
          mkdir -p "$BACKUP_DIR"
          # With Consul backend, /var/lib/vault is mostly empty, but the
          # snapshot captures anything written via vault's sys/raw too.
          tar czf "${BACKUP_DIR}/vault-${TIMESTAMP}.tar.gz" /var/lib/vault 2>/dev/null
          # Keep last 90 daily copies (2TB NVMe has space).
          ls -t "${BACKUP_DIR}"/vault-*.tar.gz 2>/dev/null | tail -n +91 | xargs -r rm

    - name: Vault backup cron (02:00 daily)
      ansible.builtin.copy:
        dest: /etc/cron.d/vault-backup
        mode: '0644'
        content: |
          0 2 * * * root /usr/local/bin/vault-backup.sh

# ─── Verify ─────────────────────────────────────────────────────────────────
- name: Verify Vault cluster
  hosts: pi1
  become: true
  gather_facts: false

  environment:
    VAULT_ADDR: https://127.0.0.1:8200
    VAULT_CACERT: /etc/vault.d/tls/ca-cert.pem

  tasks:
    - name: Vault status
      ansible.builtin.command: vault status
      register: _status
      changed_when: false
      failed_when: false
      check_mode: false  # a read: a preview (--check) shows it

    - name: Consul KV has vault/ keys
      ansible.builtin.shell: |
        set -o pipefail
        consul kv get -keys vault/ 2>/dev/null | head -5
      register: _consul_keys
      changed_when: false
      check_mode: false  # a read: a preview (--check) shows it

    - name: Summary
      ansible.builtin.debug:
        msg: |
          ============================================
          Vault on pi1 + pi2 — ready
          ============================================
          {{ _status.stdout }}
          ============================================
          Consul KV (vault/ top-level):
          {{ _consul_keys.stdout }}
          ============================================
