---
# Offsite backup of Vault recovery material (architecture review, item L4).
#
# The Shamir unseal keys + root token are written once at init to
# /etc/vault-unseal/ on the Pis and never rotate — but they live ONLY there, so
# losing both Pis makes a restored Vault unrecoverable. This pulls a current copy
# to the controller (off the Pis) with tight perms, into the same gitignored
# vars/ area as the sealed-secrets key backup. From there, move it to TRUE
# offsite custody (password manager / encrypted USB) — that step stays manual on
# purpose, since only the operator should choose the final resting place.
#
# Read-only on the Pi (just a fetch); safe to run any time. Re-run only after a
# Vault re-initialisation, since the keys change nowhere else.
- name: Back up Vault recovery material off the Pis
  hosts: pis
  become: true
  gather_facts: false
  vars:
    vault_recovery_dir: "{{ playbook_dir }}/../vars/vault-recovery"
  tasks:
    # on the Pi holding the VIP, whichever serves now (pinned to pi1, the play failed while pi1 was down; the root
    # token is on both Pis - setup-vault-pi)
    - name: Only the Pi holding the VIP goes on
      ansible.builtin.import_tasks: tasks/vip-holder-only.yml

    - name: Pull unseal keys + root token to the controller (off the Pis)
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ vault_recovery_dir }}/"
        flat: true
        fail_on_missing: false
      loop:
        - /etc/vault-unseal/unseal-keys
        - /etc/vault-unseal/root-token
      no_log: true

    # the root token is optional (it may have been purged after setup): locked down when the fetch brought it, and
    # nothing else excused - a failed chmod on the unseal keys would leave them readable. In check mode the fetch brings
    # nothing: what is there is locked down, and the unseal keys' absence is said, not failed
    - name: The local backup's files
      ansible.builtin.stat:
        path: "{{ vault_recovery_dir }}/{{ item }}"
      delegate_to: localhost
      become: false
      loop: [unseal-keys, root-token]
      register: _backup_files

    - name: The unseal keys are in the local backup
      ansible.builtin.assert:
        that: _backup_files.results[0].stat.exists or ansible_check_mode
        fail_msg: "no {{ vault_recovery_dir }}/unseal-keys after the fetch - nothing to keep"
        quiet: true

    - name: Lock down the local backup's directory (0700)
      ansible.builtin.file:
        path: "{{ vault_recovery_dir }}"
        mode: '0700'
        state: directory
      delegate_to: localhost
      become: false

    - name: Lock down the local backup's files (0600) - each one there
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        mode: '0600'
        state: file
      delegate_to: localhost
      become: false
      loop: "{{ _backup_files.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Confirm what landed (filenames only, never contents)
      ansible.builtin.find:
        paths: "{{ vault_recovery_dir }}"
      delegate_to: localhost
      become: false
      register: _backed_up

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Vault recovery material is now at {{ vault_recovery_dir }}
          ({{ _backed_up.files | map(attribute='path') | map('basename') | list | join(', ') }}),
          off the Pis. NEXT: move it to true-offsite custody (password manager /
          encrypted USB). These keys are the only way to recover Vault if both Pis die.
