---
# After a PostgreSQL major upgrade: fresh planner statistics on every database, on the primary of every CNPG cluster, or
# of those in -e pg_namespaces (each environment's step). From 18 on pg_upgrade carries most statistics over, but not
# the extended ones (CREATE STATISTICS) nor the cumulative ones that trigger autovacuum; PostgreSQL 18's pg_upgrade docs
# then ask for `vacuumdb --all --analyze-in-stages --missing-stats-only` (minimal statistics where there are none,
# fast) and `vacuumdb --all --analyze-only` (every relation analysed), in that order. A major below 18 is refused: its
# vacuumdb has no --missing-stats-only. Waits first until each cluster is healthy with every instance on the major
# asked for; read-mostly (ANALYZE writes statistics only).
#
# With -e pg_namespaces=<ns>[,<ns>] only the clusters in those namespaces - the test environment's step, before
# production's. None of them having a cluster fails, unless the inventory sets postgres_analyze_allow_none (the Vagrant
# copy, which has no test environment): then it says so and does nothing.
#
# Usage: task deploy:upgrade:playbooks STEP=<a PostgreSQL 18 step>   (its playbook line)
- name: Planner statistics after a PostgreSQL major upgrade
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    kubectl: "kubectl --kubeconfig {{ kubeconfig }}"
  tasks:
    - name: The major is given (-e pg_major=18), 18 or later
      ansible.builtin.assert:
        that: pg_major | default('') | string is match('^[0-9]+$') and pg_major | int >= 18
        fail_msg: "-e pg_major=<major>, 18 or later (before 18 vacuumdb has no --missing-stats-only), e.g. 18"

    - name: The CNPG clusters (in the namespaces given, if any)
      check_mode: false
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ kubectl }} get clusters.postgresql.cnpg.io -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' \
            | awk -v ns='{{ pg_namespaces | default('') }}' 'BEGIN {n = split(ns, a, ","); for (i = 1; i <= n; i++) want[a[i]] = 1}
                                                            NF == 2 && (n == 0 || $1 in want)'
      register: _clusters
      changed_when: false
      failed_when: >-
        _clusters.rc != 0 or (_clusters.stdout_lines | length == 0
        and not (pg_namespaces | default('') | length > 0 and postgres_analyze_allow_none | default(false) | bool))

    - name: Nothing to analyse - no CNPG cluster here in the namespaces given (the inventory allows none)
      ansible.builtin.meta: end_play
      when: _clusters.stdout_lines | length == 0

    - name: Each cluster healthy, every instance ready, on that major
      check_mode: false
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          K="{{ kubectl }} -n {{ item.split()[0] }}"
          $K get clusters.postgresql.cnpg.io {{ item.split()[1] }} -o json | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          s, n = c.get("status", {}), c["spec"]["instances"]
          print(s.get("phase") == "Cluster in healthy state" and s.get("readyInstances") == n, s.get("currentPrimary", ""))'
          p=$($K get clusters.postgresql.cnpg.io {{ item.split()[1] }} -o jsonpath='{.status.currentPrimary}')
          $K exec "$p" -c postgres -- psql -qAt -c 'show server_version_num'
      loop: "{{ _clusters.stdout_lines }}"
      register: _pg
      changed_when: false
      retries: 60
      delay: 15
      until: >-
        _pg.rc == 0 and _pg.stdout_lines | length == 2 and _pg.stdout_lines[0].startswith('True ')
        and (_pg.stdout_lines[1] | int) // 10000 == pg_major | int

    - name: Every database of each cluster - the missing statistics in stages, then every relation analysed
      ansible.builtin.command: >-
        {{ kubectl }} -n {{ r[0].item.split()[0] }} exec {{ r[0].stdout_lines[0].split()[1] }} -c postgres --
        vacuumdb --all {{ r[1] }}
      loop: "{{ _pg.results | product(['--analyze-in-stages --missing-stats-only', '--analyze-only']) | list }}"
      loop_control:
        loop_var: r
        label: "{{ r[0].item }}: {{ r[1] }}"
      register: _analyze
      changed_when: true

    - name: Analysed
      ansible.builtin.debug:
        msg: >-
          {{ 'PREVIEW: would analyse' if ansible_check_mode else 'POSTGRES ANALYSED:' }}
          {{ _pg.results | map(attribute='item') | map('replace', ' ', '/') | join(', ') }} on
          {{ _pg.results | map(attribute='stdout_lines') | map('last') | unique | join(', ') }}
