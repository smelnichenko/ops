---
# Setup Velero + Backup MinIO for k8s cluster backups - the install from before Argo CD owned Velero (infra's velero
# app; the backup store is the Pis'). Where that Application exists the first play ends at once: its pinned chart and
# in-cluster MinIO would roll Velero back under Argo and bring back a retired store. The second play, the offsite git
# mirror of the Forgejo organisation's repositories to the Pis (a daily timer on ten), runs either way.
#
# Prerequisites:
#   - kubeadm cluster running (setup-kubeadm.yml)
#   - /mnt/backups mounted (backup partition)
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-velero.yml
#
- name: Setup Velero + Backup MinIO
  hosts: target
  become: true
  gather_facts: false

  vars:
    velero_namespace: velero
    velero_chart_version: "11.4.0"
    velero_backup_path: "/mnt/backups/minio"
    velero_minio_storage_size: "100Gi"
    minio_image: "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"

  tasks:
    - name: Does Argo CD own Velero (its Application)
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get application velero --ignore-not-found -o name
      register: _velero_by_argo
      changed_when: false
      check_mode: false

    - name: Argo CD owns Velero - nothing here to install
      when: _velero_by_argo.stdout | length > 0
      block:
        - name: Skipped
          ansible.builtin.debug:
            msg: "VELERO IS ARGO CD'S (infra's velero app): its install and the in-cluster MinIO skipped"
        - name: End this play
          ansible.builtin.meta: end_play

    # ================================================================
    # Phase 1: Create namespace and backup directory
    # ================================================================

    - name: Create velero namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ velero_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged

    - name: Create backup directory on host
      ansible.builtin.file:
        path: "{{ velero_backup_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    # ================================================================
    # Phase 2: Deploy Backup MinIO (HostPath for predictable location)
    # ================================================================

    - name: Deploy backup MinIO PersistentVolume
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: minio-backup-pv
            labels:
              app: minio-backup
          spec:
            capacity:
              storage: "{{ velero_minio_storage_size }}"
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            hostPath:
              path: "{{ velero_backup_path }}"
              type: DirectoryOrCreate
            persistentVolumeReclaimPolicy: Retain

    - name: Deploy backup MinIO PersistentVolumeClaim
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: minio-backup-pvc
            namespace: "{{ velero_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            resources:
              requests:
                storage: "{{ velero_minio_storage_size }}"
            selector:
              matchLabels:
                app: minio-backup

    # minio-backup-secret managed by ExternalSecret (Vault)
    - name: Deploy backup MinIO Deployment
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio-backup
            namespace: "{{ velero_namespace }}"
            labels:
              app: minio-backup
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: minio-backup
            template:
              metadata:
                labels:
                  app: minio-backup
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: minio
                    image: "{{ minio_image }}"
                    command: ["minio", "server", "/data", "--console-address", ":9001"]
                    envFrom:
                      - secretRef:
                          name: minio-backup-secret
                    ports:
                      - containerPort: 9000
                        name: api
                      - containerPort: 9001
                        name: console
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 50m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 1Gi
                    volumeMounts:
                      - name: data
                        mountPath: /data
                    livenessProbe:
                      httpGet:
                        path: /minio/health/live
                        port: 9000
                      initialDelaySeconds: 10
                      periodSeconds: 30
                    readinessProbe:
                      httpGet:
                        path: /minio/health/ready
                        port: 9000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: minio-backup-pvc

    - name: Deploy backup MinIO Service
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: minio-backup
            namespace: "{{ velero_namespace }}"
          spec:
            selector:
              app: minio-backup
            ports:
              - name: api
                port: 9000
                targetPort: 9000
              - name: console
                port: 9001
                targetPort: 9001

    - name: Wait for backup MinIO to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: minio-backup
        namespace: "{{ velero_namespace }}"
      register: minio_backup_deploy
      retries: 24
      delay: 5
      until:
        - minio_backup_deploy.resources | length > 0
        - minio_backup_deploy.resources[0].status.readyReplicas | default(0) == minio_backup_deploy.resources[0].spec.replicas
        - minio_backup_deploy.resources[0].status.updatedReplicas | default(0) == minio_backup_deploy.resources[0].spec.replicas

    - name: Create velero bucket in MinIO
      vars:
        # AWS's own CLI, as platform's s3gw bucket Job: MinIO withdrew its mc images on 2026-09-24 (quay.io 401,
        # docker.io gone)
        s3_image: "amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8"
        minio_url: "http://minio-backup.{{ velero_namespace }}.svc:9000"
        # the server's own keys, from its Secret into the pod's environment - never on a command line (templated in,
        # they were on kubectl's on ten; as mc's arguments, on the node's /proc)
        s3_cmd: >-
          set -e; s3() { aws --endpoint-url {{ minio_url }} s3api "$@"; };
          if s3 head-bucket --bucket velero > /dev/null 2>&1; then echo "BUCKET EXISTS";
          else s3 create-bucket --bucket velero > /dev/null; echo "BUCKET CREATED"; fi
        pod_overrides:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: minio-setup
                image: "{{ s3_image }}"
                command: ["sh", "-c", "{{ s3_cmd }}"]
                env:
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: {secretKeyRef: {name: minio-backup-secret, key: MINIO_ROOT_USER}}
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: {secretKeyRef: {name: minio-backup-secret, key: MINIO_ROOT_PASSWORD}}
                  - name: AWS_DEFAULT_REGION
                    value: us-east-1
                  - name: HOME  # the CLI's cache, writable as uid 1000
                    value: /tmp
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
      # its result judged: a failure (the image, the store, the keys) fails the step - `|| true` hid every one
      ansible.builtin.shell: |
        set -o pipefail
        kubectl run minio-setup --rm -i \
          --restart=Never \
          -n {{ velero_namespace }} \
          --image={{ s3_image }} \
          --overrides='{{ pod_overrides | to_json }}' 2>&1
      args:
        executable: /bin/bash
      register: _bucket
      changed_when: "'BUCKET CREATED' in _bucket.stdout"

    # ================================================================
    # Phase 3: Deploy Velero
    # ================================================================

    - name: Add vmware-tanzu Helm repo
      kubernetes.core.helm_repository:
        name: vmware-tanzu
        repo_url: https://vmware-tanzu.github.io/helm-charts
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # velero-credentials managed by ExternalSecret (Vault)
    - name: Wait for Velero credentials secret
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Secret
        name: velero-credentials
        namespace: "{{ velero_namespace }}"
      register: velero_secret
      retries: 12
      delay: 10
      until: velero_secret.resources | length > 0
      no_log: true

    - name: Install Velero CRDs
      ansible.builtin.shell: |
        kubectl apply --server-side -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backups.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backupstoragelocations.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/deletebackuprequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/downloadrequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/podvolumebackups.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/podvolumerestores.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/restores.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/schedules.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/serverstatusrequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/volumesnapshotlocations.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/datadownloads.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/datauploads.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backuprepositories.yaml
      changed_when: false

    - name: Deploy Velero via Helm
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: velero
        chart_ref: vmware-tanzu/velero
        chart_version: "{{ velero_chart_version }}"
        release_namespace: "{{ velero_namespace }}"
        skip_crds: true
        disable_hook: true
        values:
          initContainers:
            - name: velero-plugin-for-aws
              image: velero/velero-plugin-for-aws:v1.11.1
              volumeMounts:
                - name: plugins
                  mountPath: /target
          credentials:
            useSecret: true
            existingSecret: velero-credentials
          configuration:
            backupStorageLocation:
              - name: default
                provider: aws
                bucket: velero
                config:
                  region: us-east-1
                  s3ForcePathStyle: "true"
                  s3Url: "http://minio-backup.{{ velero_namespace }}.svc:9000"
            volumeSnapshotLocation: []
            defaultVolumesToFsBackup: true
            features: ""
          deployNodeAgent: true
          snapshotsEnabled: false
          schedules:
            schnappy-daily:
              disabled: false
              schedule: "0 2 * * *"
              useOwnerReferencesInBackup: false
              template:
                ttl: 168h
                includedNamespaces:
                  - schnappy
                defaultVolumesToFsBackup: true
            full-weekly:
              disabled: false
              schedule: "0 3 * * 0"
              useOwnerReferencesInBackup: false
              template:
                ttl: 720h
                includedNamespaces:
                  - "*"
                defaultVolumesToFsBackup: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Wait for Velero deployment to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: velero
        namespace: "{{ velero_namespace }}"
      register: velero_deploy
      retries: 24
      delay: 5
      until:
        - velero_deploy.resources | length > 0
        - velero_deploy.resources[0].status.readyReplicas | default(0) == velero_deploy.resources[0].spec.replicas
        - velero_deploy.resources[0].status.updatedReplicas | default(0) == velero_deploy.resources[0].spec.replicas

    # ================================================================
    # Phase 4: Network policies
    # ================================================================

    # Argo CD-managed via infra repo
    - name: Apply velero-default-deny NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero-default-deny
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector: {}
            policyTypes:
              - Ingress

    - name: Apply velero-to-minio NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero-to-minio
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app: minio-backup
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - podSelector: {}
                ports:
                  - protocol: TCP
                    port: 9000

# Every repository of the schnappy organisation mirrored from Forgejo and pushed to the Pis daily (offsite-backup.timer),
# an extra copy of the code
- name: Offsite git mirror to the Pis
  hosts: target
  become: true
  gather_facts: false

  vars:
    git_mirror_enabled: true
    git_mirror_host: "git.pmon.dev"
    # every repository of this Forgejo organisation, listed at each run (a new one mirrored the day it appears) - the
    # code lives there; forgejo_admin/monitor, mirrored until 2026-10, was no repository production has
    git_mirror_org: schnappy
    git_mirror_user: "{{ forgejo_admin_user | default('forgejo_admin') }}"
    git_mirror_dir: /var/lib/git-mirror
    git_mirror_host_alias: pi-vip
    git_mirror_known_hosts: "/var/lib/git-mirror/known_hosts"
    # Forgejo read with a token of read:repository and read:organization alone, never the admin's password - that sat
    # in the old mirror's origin URL, on git-remote-https's argv at each fetch (any local user reads those in /proc).
    # The token in a file of the mirror's user's alone: a credential helper of the sync's own hands it to git (the
    # credential protocol: no command line) - one that answers "get" alone: git's store helper erases what it holds
    # on any 401 (a blip), and every sync after failed; the sync's API call takes it on curl's config
    git_mirror_token_file: "/var/lib/git-mirror/token"
    # each repository pushed to a bare one of its own on the Pi at the VIP; the run's last-success beside them
    git_mirror_pi_dir: /mnt/backups/git-mirror
    _git_mirror_owner: "{{ offsite_backup_user | default('sm') }}"
    _git_mirror_pi: "{{ offsite_backup_user | default('sm') }}@{{ offsite_backup_host | default(keepalived_vip) }}"
    _git_mirror_api: "https://{{ git_mirror_host }}/api/v1/orgs/{{ git_mirror_org }}/repos"
    # whether the token in the file reads the organisation's repositories: HTTP 200 it does; 401 or 403 (or no
    # token) it does not - a new one is made; anything else (Forgejo or the network down) proves nothing either way:
    # the play fails, no token made
    _git_mirror_probe: |
      set -uo pipefail
      token=$(cat "$TOKEN_FILE" 2> /dev/null) || token=""
      [ -n "$token" ] || { echo "NO TOKEN"; exit 0; }
      code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
        -K <(printf 'header = "Authorization: token %s"\n' "$token") "$API?limit=1")
      echo "HTTP $code"

  tasks:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
      when: git_mirror_enabled | default(true) | bool

    - name: Create local git mirror directory
      ansible.builtin.file:
        path: "{{ git_mirror_dir }}"
        state: directory
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: '0750'
      when: git_mirror_enabled | default(true) | bool

    # the token kept while it still reads the organisation's repositories
    - name: The mirror's token reads the organisation's repositories
      ansible.builtin.shell:
        cmd: "{{ _git_mirror_probe }}"
        executable: /bin/bash
      environment:
        TOKEN_FILE: "{{ git_mirror_token_file }}"
        API: "{{ _git_mirror_api }}"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      check_mode: false  # a read: a preview judges the token too
      register: _git_mirror_read
      changed_when: false
      failed_when: _git_mirror_read.stdout not in ['HTTP 200', 'HTTP 401', 'HTTP 403', 'NO TOKEN']
      when: git_mirror_enabled | default(true) | bool

    - name: Whether the kept token reads
      ansible.builtin.set_fact:
        _git_mirror_token_works: "{{ _git_mirror_read.stdout | default('') == 'HTTP 200' }}"
      when: git_mirror_enabled | default(true) | bool

    # page by page (Forgejo pages its answers: 30 a page by default, 50 at most) - an older mirror token on a later page
    # was never deleted; ten pages of 50, the last one not full (the check below)
    - name: Forgejo's tokens of the admin, page by page
      check_mode: false
      loop: "{{ range(1, 11) | list }}"
      ansible.builtin.uri:
        follow_redirects: none
        url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens?limit=50&page={{ item }}"
        method: GET
        user: "{{ git_mirror_user }}"
        password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _git_mirror_tokens
      changed_when: false
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: Every one of the admin's tokens read (the last page not full)
      ansible.builtin.assert:
        that: (_git_mirror_tokens.results | last).json | length < 50
        fail_msg: "REFUSED: forgejo_admin has more than 500 tokens - not all read; delete the stale ones by hand"
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: A new token for the mirror - its two reads alone, under a new name (the old ones stay until it reads)
      ansible.builtin.uri:
        follow_redirects: none
        url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens"
        method: POST
        user: "{{ git_mirror_user }}"
        password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "git-mirror-{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%S') }}"
          scopes:
            - "read:repository"
            - "read:organization"
        status_code: 201
      register: _git_mirror_token
      changed_when: true
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    # a new token that does not read is deleted again (one more left behind at every run otherwise), the play failed
    - name: The new token in place, proven
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode
      block:
        # written on ten from the task's stdin (copy's content passes a temp file on the controller first)
        - name: The token where the sync's credential helper reads it
          ansible.builtin.command:
            argv: [install, -m, "0600", -o, "{{ _git_mirror_owner }}", -g, "{{ _git_mirror_owner }}", /dev/stdin,
                   "{{ git_mirror_token_file }}"]
            stdin: "{{ _git_mirror_token.json.sha1 }}"
            stdin_add_newline: false
          changed_when: true
          no_log: true

        - name: The new token reads the organisation's repositories
          ansible.builtin.shell:
            cmd: "{{ _git_mirror_probe }}"
            executable: /bin/bash
          environment:
            TOKEN_FILE: "{{ git_mirror_token_file }}"
            API: "{{ _git_mirror_api }}"
          become: true
          become_user: "{{ _git_mirror_owner }}"
          register: _git_mirror_new_read
          changed_when: false
          failed_when: _git_mirror_new_read.stdout != 'HTTP 200'
      rescue:
        - name: The new token deleted - it does not read
          ansible.builtin.uri:
            follow_redirects: none
            url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens/{{ _git_mirror_token.json.id }}"
            method: DELETE
            user: "{{ git_mirror_user }}"
            password: "{{ forgejo_admin_password }}"
            force_basic_auth: true
            status_code: [204, 404]  # gone already (deleted meanwhile) is what it wants
          no_log: true

        - name: The mirror's token - none reads
          ansible.builtin.fail:
            msg: >-
              REFUSED: a new token for the mirror does not read {{ _git_mirror_api }}
              ({{ _git_mirror_new_read.stdout | default('not read') }}) - deleted again

    - name: The mirror's older tokens deleted (the new one reads)
      ansible.builtin.uri:
        follow_redirects: none
        url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens/{{ item.id }}"
        method: DELETE
        user: "{{ git_mirror_user }}"
        password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: [204, 404]  # gone already (deleted meanwhile) is what it wants
      loop: >-
        {{ _git_mirror_tokens.results | default([]) | map(attribute='json', default=[]) | flatten
           | selectattr('name', 'match', '^git-mirror-') | list }}
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    # the push goes to the VIP - pi1's or pi2's address, as keepalived has it: both Pis' own host keys (read from them
    # over Ansible's checked connections) known under one alias, and checked - never "no" (a host answering at the VIP
    # got the code)
    - name: Each Pi's own host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      register: _pi_host_keys
      when: git_mirror_enabled | default(true) | bool

    - name: The VIP's known hosts - both Pis' keys
      ansible.builtin.copy:
        dest: "{{ git_mirror_known_hosts }}"
        content: |
          {% for k in _pi_host_keys.results %}
          {{ git_mirror_host_alias }} {{ (k.content | b64decode).split()[:2] | join(' ') }}
          {% endfor %}
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: '0644'
      when: git_mirror_enabled | default(true) | bool

    - name: Write offsite backup sync script
      ansible.builtin.copy:
        dest: /usr/local/bin/offsite-backup-sync.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # offsite-backup-sync.sh - every repository of the Forgejo organisation {{ git_mirror_org }} mirrored to the
          # Pis daily (offsite-backup.timer): a copy of the code off the Gluster pair that serves it. The repositories
          # listed from Forgejo's API at each run (a new one mirrored the day it appears); each cloned bare when new,
          # fetched, and pushed whole to a bare repository of its own on the Pi at the VIP (made when new). Forgejo read
          # with the mirror's token - git's credential helper, curl's config: never a command line; the Pi's host keys
          # checked. A repository that fails is named and the rest still go; any failure fails the unit. A good run
          # writes last-success (its time) on the Pi, last.
          set -uo pipefail
          dir={{ git_mirror_dir }}
          tokenf={{ git_mirror_token_file }}
          api={{ _git_mirror_api }}
          pi={{ _git_mirror_pi }}
          pidir={{ git_mirror_pi_dir }}
          say() { logger -t git-mirror "$*"; echo "$*"; }
          export GIT_TERMINAL_PROMPT=0
          ssh_opts=(-o BatchMode=yes -o HostKeyAlias={{ git_mirror_host_alias }} -o UserKnownHostsFile={{ git_mirror_known_hosts }}
                    -o StrictHostKeyChecking=yes -i {{ offsite_backup_ssh_key | default('/home/sm/.ssh/id_ed25519') }})
          export GIT_SSH_COMMAND="ssh ${ssh_opts[*]}"
          # git's other helpers reset; this one answers "get" alone - storing or erasing (after a 401) changes nothing -
          # and for Forgejo's URL alone (credential.<url>.helper), no redirect followed: a redirect off the host (a
          # misconfigured proxy) asked it for the new host, and it answered any with the token
          mirror_user={{ git_mirror_user }}
          forgejo_helper="credential.https://{{ git_mirror_host }}.helper"
          helper=(-c http.followRedirects=false -c credential.helper=
                  -c "$forgejo_helper=!f() { [ \"\$1\" = get ] || return 0; echo username=$mirror_user; echo \"password=\$(cat $tokenf)\"; }; f")
          token=$(cat "$tokenf" 2> /dev/null) || token=""
          [ -n "$token" ] || { say "FAILED: no token in $tokenf"; exit 1; }
          repos="" page=1
          while :; do
            out=$(curl -sf --max-time 60 -K <(printf 'header = "Authorization: token %s"\n' "$token") \
              "$api?limit=50&page=$page") || { say "FAILED: the organisation's repositories not listed"; exit 1; }
            names=$(python3 -c 'import json, sys
          print("\n".join(r["name"] for r in json.load(sys.stdin)))' <<< "$out") || { say "FAILED: its listing not read"; exit 1; }
            [ -n "$names" ] || break
            repos+="$names"$'\n'
            page=$((page + 1))
          done
          [ -n "$repos" ] || { say "FAILED: no repository listed"; exit 1; }
          failed=""
          for r in $repos; do
            [[ $r =~ ^[A-Za-z0-9._-]+$ ]] || { failed+=" $r(its name)"; continue; }
            d=$dir/$r.git
            url=https://{{ git_mirror_host }}/{{ git_mirror_org }}/$r.git
            if [ ! -f "$d/HEAD" ]; then
              git "${helper[@]}" clone -q --mirror "$url" "$d" 2>&1 | logger -t git-mirror || { failed+=" $r(clone)"; continue; }
            fi
            # its origin the organisation's, bare (a mirror made before pointed elsewhere, a password in its URL)
            git -C "$d" remote set-url origin "$url" || { failed+=" $r(origin)"; continue; }
            # the old mirror's own settings gone (monitor.git's on ten): an ssh with no host-key check, a remote of the Pi
            if git -C "$d" config --get core.sshCommand > /dev/null; then
              git -C "$d" config --unset-all core.sshCommand || { failed+=" $r(its old ssh setting)"; continue; }
            fi
            if git -C "$d" remote | grep -qx pi; then
              git -C "$d" remote remove pi || { failed+=" $r(its old remote)"; continue; }
            fi
            git "${helper[@]}" -C "$d" fetch -q --prune origin 2>&1 | logger -t git-mirror || failed+=" $r(fetch)"
            # only where the volume is mounted: a bare mount point is the Pi's own disk (what is pushed there is lost
            # with the next mount)
            ssh "${ssh_opts[@]}" "$pi" "mountpoint -q $pidir && { test -f $pidir/$r.git/HEAD || git init -q --bare $pidir/$r.git; }" \
              2>&1 | logger -t git-mirror || { failed+=" $r(its repository on the Pi)"; continue; }
            git -C "$d" push -q --mirror "$pi:$pidir/$r.git" 2>&1 | logger -t git-mirror || failed+=" $r(push)"
          done
          if [ -n "$failed" ]; then
            say "FAILED:$failed"
            exit 1
          fi
          ssh "${ssh_opts[@]}" "$pi" "mountpoint -q $pidir && date -u +%Y%m%dT%H%M%SZ > $pidir/last-success" \
            || { say "FAILED: its last-success not written on the Pi"; exit 1; }
          say "mirrored:" $repos
      when: git_mirror_enabled | default(true) | bool

    - name: Create offsite backup systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/offsite-backup.service
        mode: '0644'
        content: |
          [Unit]
          Description=Mirror the Forgejo organisation's repositories to the Pis (offsite copy)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ _git_mirror_owner }}
          ExecStart=/usr/local/bin/offsite-backup-sync.sh
          TimeoutStartSec=1800
      when: offsite_backup_enabled | default(true) | bool

    - name: Create offsite backup systemd timer (4 AM daily)
      ansible.builtin.copy:
        dest: /etc/systemd/system/offsite-backup.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Daily offsite backup sync

          [Timer]
          OnCalendar=*-*-* 04:00:00
          Persistent=true
          RandomizedDelaySec=300

          [Install]
          WantedBy=timers.target
      when: offsite_backup_enabled | default(true) | bool

    - name: Enable and start offsite backup timer
      ansible.builtin.systemd:
        name: offsite-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when: offsite_backup_enabled | default(true) | bool

    # the Pi-side root the sync writes as the mirror's user: the backup-git-mirror volume's root - root:root 0755 as
    # Gluster made it on production (read 2026-10-08: every repository's init and last-success refused there) - the
    # mirror user's on each Pi where it is mounted; a bare mount point refused (the Pi's own disk). Bounded: a hung
    # client holds no play
    - name: The mirror's root on the Pis - mounted, the mirror user's
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      become: true
      timeout: 60
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          mountpoint -q {{ git_mirror_pi_dir }} || { echo "REFUSED: {{ git_mirror_pi_dir }} is not mounted here"; exit 1; }
          now=$(stat -c '%U:%G %a' {{ git_mirror_pi_dir }})
          [ "$now" != "{{ _git_mirror_owner }}:{{ _git_mirror_owner }} 750" ] || exit 0
          chown {{ _git_mirror_owner }}:{{ _git_mirror_owner }} {{ git_mirror_pi_dir }}
          chmod 0750 {{ git_mirror_pi_dir }}
          echo "changed from $now"
      register: _git_mirror_pi_root
      changed_when: "'changed from' in _git_mirror_pi_root.stdout"
      when: git_mirror_enabled | default(true) | bool

    # proven now, not at 4 AM: the sync run once (a oneshot: the start waits for its end, a failure fails the play)
    - name: The mirror synced now
      ansible.builtin.systemd:
        name: offsite-backup.service
        state: started
        daemon_reload: true
      when:
        - git_mirror_enabled | default(true) | bool
        - offsite_backup_enabled | default(true) | bool
        - not ansible_check_mode

    - name: The mirror
      ansible.builtin.debug:
        msg: >-
          Every repository of {{ git_mirror_org }} mirrored in {{ git_mirror_dir }}, pushed daily at 4 AM
          (offsite-backup.timer) to {{ _git_mirror_pi }}:{{ git_mirror_pi_dir }}
