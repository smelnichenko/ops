---
# Setup Velero + Backup MinIO for k8s cluster backups - the install from before Argo CD owned Velero (infra's velero
# app; the backup store is the Pis'). Where that Application exists the first play ends at once: its pinned chart and
# in-cluster MinIO would roll Velero back under Argo and bring back a retired store. The second play, the offsite git
# mirror of the monitor repo to the Pis (a daily timer on ten), runs either way.
#
# Prerequisites:
#   - kubeadm cluster running (setup-kubeadm.yml)
#   - /mnt/backups mounted (backup partition)
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-velero.yml
#
- name: Setup Velero + Backup MinIO
  hosts: target
  become: true
  gather_facts: false

  vars:
    velero_namespace: velero
    velero_chart_version: "11.4.0"
    velero_backup_path: "/mnt/backups/minio"
    velero_minio_storage_size: "100Gi"
    minio_image: "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"

  tasks:
    - name: Does Argo CD own Velero (its Application)
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get application velero --ignore-not-found -o name
      register: _velero_by_argo
      changed_when: false
      check_mode: false

    - name: Argo CD owns Velero - nothing here to install
      when: _velero_by_argo.stdout | length > 0
      block:
        - name: Skipped
          ansible.builtin.debug:
            msg: "VELERO IS ARGO CD'S (infra's velero app): its install and the in-cluster MinIO skipped"
        - name: End this play
          ansible.builtin.meta: end_play

    # ================================================================
    # Phase 1: Create namespace and backup directory
    # ================================================================

    - name: Create velero namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ velero_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged

    - name: Create backup directory on host
      ansible.builtin.file:
        path: "{{ velero_backup_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    # ================================================================
    # Phase 2: Deploy Backup MinIO (HostPath for predictable location)
    # ================================================================

    - name: Deploy backup MinIO PersistentVolume
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: minio-backup-pv
            labels:
              app: minio-backup
          spec:
            capacity:
              storage: "{{ velero_minio_storage_size }}"
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            hostPath:
              path: "{{ velero_backup_path }}"
              type: DirectoryOrCreate
            persistentVolumeReclaimPolicy: Retain

    - name: Deploy backup MinIO PersistentVolumeClaim
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: minio-backup-pvc
            namespace: "{{ velero_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            resources:
              requests:
                storage: "{{ velero_minio_storage_size }}"
            selector:
              matchLabels:
                app: minio-backup

    # minio-backup-secret managed by ExternalSecret (Vault)
    - name: Deploy backup MinIO Deployment
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio-backup
            namespace: "{{ velero_namespace }}"
            labels:
              app: minio-backup
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: minio-backup
            template:
              metadata:
                labels:
                  app: minio-backup
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: minio
                    image: "{{ minio_image }}"
                    command: ["minio", "server", "/data", "--console-address", ":9001"]
                    envFrom:
                      - secretRef:
                          name: minio-backup-secret
                    ports:
                      - containerPort: 9000
                        name: api
                      - containerPort: 9001
                        name: console
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 50m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 1Gi
                    volumeMounts:
                      - name: data
                        mountPath: /data
                    livenessProbe:
                      httpGet:
                        path: /minio/health/live
                        port: 9000
                      initialDelaySeconds: 10
                      periodSeconds: 30
                    readinessProbe:
                      httpGet:
                        path: /minio/health/ready
                        port: 9000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: minio-backup-pvc

    - name: Deploy backup MinIO Service
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: minio-backup
            namespace: "{{ velero_namespace }}"
          spec:
            selector:
              app: minio-backup
            ports:
              - name: api
                port: 9000
                targetPort: 9000
              - name: console
                port: 9001
                targetPort: 9001

    - name: Wait for backup MinIO to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: minio-backup
        namespace: "{{ velero_namespace }}"
      register: minio_backup_deploy
      retries: 24
      delay: 5
      until:
        - minio_backup_deploy.resources | length > 0
        - minio_backup_deploy.resources[0].status.readyReplicas | default(0) == minio_backup_deploy.resources[0].spec.replicas
        - minio_backup_deploy.resources[0].status.updatedReplicas | default(0) == minio_backup_deploy.resources[0].spec.replicas

    - name: Create velero bucket in MinIO
      vars:
        # AWS's own CLI, as platform's s3gw bucket Job: MinIO withdrew its mc images on 2026-09-24 (quay.io 401,
        # docker.io gone)
        s3_image: "amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8"
        minio_url: "http://minio-backup.{{ velero_namespace }}.svc:9000"
        # the server's own keys, from its Secret into the pod's environment - never on a command line (templated in,
        # they were on kubectl's on ten; as mc's arguments, on the node's /proc)
        s3_cmd: >-
          set -e; s3() { aws --endpoint-url {{ minio_url }} s3api "$@"; };
          if s3 head-bucket --bucket velero > /dev/null 2>&1; then echo "BUCKET EXISTS";
          else s3 create-bucket --bucket velero > /dev/null; echo "BUCKET CREATED"; fi
        pod_overrides:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: minio-setup
                image: "{{ s3_image }}"
                command: ["sh", "-c", "{{ s3_cmd }}"]
                env:
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: {secretKeyRef: {name: minio-backup-secret, key: MINIO_ROOT_USER}}
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: {secretKeyRef: {name: minio-backup-secret, key: MINIO_ROOT_PASSWORD}}
                  - name: AWS_DEFAULT_REGION
                    value: us-east-1
                  - name: HOME  # the CLI's cache, writable as uid 1000
                    value: /tmp
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
      # its result judged: a failure (the image, the store, the keys) fails the step - `|| true` hid every one
      ansible.builtin.shell: |
        set -o pipefail
        kubectl run minio-setup --rm -i \
          --restart=Never \
          -n {{ velero_namespace }} \
          --image={{ s3_image }} \
          --overrides='{{ pod_overrides | to_json }}' 2>&1
      args:
        executable: /bin/bash
      register: _bucket
      changed_when: "'BUCKET CREATED' in _bucket.stdout"

    # ================================================================
    # Phase 3: Deploy Velero
    # ================================================================

    - name: Add vmware-tanzu Helm repo
      kubernetes.core.helm_repository:
        name: vmware-tanzu
        repo_url: https://vmware-tanzu.github.io/helm-charts
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # velero-credentials managed by ExternalSecret (Vault)
    - name: Wait for Velero credentials secret
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Secret
        name: velero-credentials
        namespace: "{{ velero_namespace }}"
      register: velero_secret
      retries: 12
      delay: 10
      until: velero_secret.resources | length > 0

    - name: Install Velero CRDs
      ansible.builtin.shell: |
        kubectl apply --server-side -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backups.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backupstoragelocations.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/deletebackuprequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/downloadrequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/podvolumebackups.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/podvolumerestores.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/restores.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/schedules.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/serverstatusrequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/volumesnapshotlocations.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/datadownloads.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/datauploads.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backuprepositories.yaml
      changed_when: false

    - name: Deploy Velero via Helm
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: velero
        chart_ref: vmware-tanzu/velero
        chart_version: "{{ velero_chart_version }}"
        release_namespace: "{{ velero_namespace }}"
        skip_crds: true
        disable_hook: true
        values:
          initContainers:
            - name: velero-plugin-for-aws
              image: velero/velero-plugin-for-aws:v1.11.1
              volumeMounts:
                - name: plugins
                  mountPath: /target
          credentials:
            useSecret: true
            existingSecret: velero-credentials
          configuration:
            backupStorageLocation:
              - name: default
                provider: aws
                bucket: velero
                config:
                  region: us-east-1
                  s3ForcePathStyle: "true"
                  s3Url: "http://minio-backup.{{ velero_namespace }}.svc:9000"
            volumeSnapshotLocation: []
            defaultVolumesToFsBackup: true
            features: ""
          deployNodeAgent: true
          snapshotsEnabled: false
          schedules:
            schnappy-daily:
              disabled: false
              schedule: "0 2 * * *"
              useOwnerReferencesInBackup: false
              template:
                ttl: 168h
                includedNamespaces:
                  - schnappy
                defaultVolumesToFsBackup: true
            full-weekly:
              disabled: false
              schedule: "0 3 * * 0"
              useOwnerReferencesInBackup: false
              template:
                ttl: 720h
                includedNamespaces:
                  - "*"
                defaultVolumesToFsBackup: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Wait for Velero deployment to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: velero
        namespace: "{{ velero_namespace }}"
      register: velero_deploy
      retries: 24
      delay: 5
      until:
        - velero_deploy.resources | length > 0
        - velero_deploy.resources[0].status.readyReplicas | default(0) == velero_deploy.resources[0].spec.replicas
        - velero_deploy.resources[0].status.updatedReplicas | default(0) == velero_deploy.resources[0].spec.replicas

    # ================================================================
    # Phase 4: Network policies
    # ================================================================

    # Argo CD-managed via infra repo
    - name: Apply velero-default-deny NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero-default-deny
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector: {}
            policyTypes:
              - Ingress

    - name: Apply velero-to-minio NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero-to-minio
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app: minio-backup
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - podSelector: {}
                ports:
                  - protocol: TCP
                    port: 9000

# The monitor repo mirrored from Forgejo and pushed to the Pis daily (offsite-backup.timer), an extra copy of the code
- name: Offsite git mirror to the Pis
  hosts: target
  become: true
  gather_facts: false

  vars:
    git_mirror_enabled: true
    git_mirror_host: "git.pmon.dev"
    git_mirror_repo: "{{ forgejo_admin_user | default('forgejo_admin') }}/monitor"
    git_mirror_user: "{{ forgejo_admin_user | default('forgejo_admin') }}"
    git_mirror_local_path: "/var/lib/git-mirror/monitor.git"
    git_mirror_host_alias: pi-vip
    git_mirror_known_hosts: "/var/lib/git-mirror/known_hosts"
    # Forgejo read with a token of read:repository alone, never the admin's password - that sat in the origin's URL,
    # on git-remote-https's argv at each fetch (any local user reads those in /proc). The token in a file of the
    # mirror's user's alone, git's credential helper reading it (the credential protocol: its stdin), the URL bare
    git_mirror_url: "https://{{ git_mirror_host }}/{{ git_mirror_repo }}.git"
    git_mirror_credentials_file: "/var/lib/git-mirror/credentials"
    _git_mirror_helper: "store --file={{ git_mirror_credentials_file }}"
    _git_mirror_owner: "{{ offsite_backup_user | default('sm') }}"

  tasks:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
      when: git_mirror_enabled | default(true) | bool

    - name: Create local git mirror directory
      ansible.builtin.file:
        path: "{{ git_mirror_local_path | dirname }}"
        state: directory
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: '0750'
      when: git_mirror_enabled | default(true) | bool

    # the token kept while it still reads the repository: a read with no prompt (none: it fails), as the mirror's user
    - name: The mirror's token reads the repository
      ansible.builtin.command:
        argv: [git, -c, "credential.helper={{ _git_mirror_helper }}", ls-remote, "{{ git_mirror_url }}", HEAD]
      become: true
      become_user: "{{ _git_mirror_owner }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      check_mode: false  # a read: a preview judges the token too
      register: _git_mirror_read
      changed_when: false
      failed_when: false  # judged: a token that does not read is replaced below
      when: git_mirror_enabled | default(true) | bool

    - name: Whether the kept token reads
      ansible.builtin.set_fact:
        _git_mirror_token_works: "{{ _git_mirror_read.rc | default(1) == 0 }}"
      when: git_mirror_enabled | default(true) | bool

    - name: Forgejo's tokens of the admin
      check_mode: false
      ansible.builtin.uri:
        url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens"
        method: GET
        user: "{{ git_mirror_user }}"
        password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _git_mirror_tokens
      changed_when: false
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: A new token for the mirror - read:repository alone, under a new name (the old ones stay until it reads)
      ansible.builtin.uri:
        url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens"
        method: POST
        user: "{{ git_mirror_user }}"
        password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "git-mirror-{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%S') }}"
          scopes:
            - "read:repository"
        status_code: 201
      register: _git_mirror_token
      changed_when: true
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The token where git's credential helper reads it
      ansible.builtin.copy:
        dest: "{{ git_mirror_credentials_file }}"
        content: "https://{{ git_mirror_user }}:{{ _git_mirror_token.json.sha1 }}@{{ git_mirror_host }}\n"
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: "0600"
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The new token reads the repository
      ansible.builtin.command:
        argv: [git, -c, "credential.helper={{ _git_mirror_helper }}", ls-remote, "{{ git_mirror_url }}", HEAD]
      become: true
      become_user: "{{ _git_mirror_owner }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      check_mode: false
      changed_when: false
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The mirror's older tokens deleted (the new one reads)
      ansible.builtin.uri:
        url: "https://{{ git_mirror_host }}/api/v1/users/{{ git_mirror_user }}/tokens/{{ item.id }}"
        method: DELETE
        user: "{{ git_mirror_user }}"
        password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 204
      loop: "{{ _git_mirror_tokens.json | default([]) | selectattr('name', 'match', '^git-mirror-') | list }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The mirror there (a first run has none yet)
      ansible.builtin.stat:
        path: "{{ git_mirror_local_path }}/HEAD"
      register: _git_mirror_head
      when: git_mirror_enabled | default(true) | bool

    - name: Initialize local bare mirror from Forgejo
      ansible.builtin.shell: |
        set -euo pipefail
        if [ ! -f "{{ git_mirror_local_path }}/HEAD" ]; then
          git -c credential.helper='{{ _git_mirror_helper }}' clone --mirror "{{ git_mirror_url }}" "{{ git_mirror_local_path }}"
          # Add Pi as push target
          git -C "{{ git_mirror_local_path }}" remote add pi \
            "{{ _git_mirror_owner }}@{{ offsite_backup_host | default(keepalived_vip) }}:/mnt/backups/git-mirror/monitor.git"
          echo "CLONED"
        fi
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ _git_mirror_owner }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
      register: git_mirror_init
      changed_when: "'CLONED' in git_mirror_init.stdout"
      when: git_mirror_enabled | default(true) | bool

    # each set only where it differs - an older mirror's origin URL (the admin's password in it) rewritten
    - name: The mirror's settings - the origin's URL bare, the credential helper
      community.general.git_config:
        repo: "{{ git_mirror_local_path }}"
        scope: local
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: remote.origin.url, value: "{{ git_mirror_url }}" }
        - { name: credential.helper, value: "{{ _git_mirror_helper }}" }
      loop_control:
        label: "{{ item.name }}"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      when:  # a preview of a first run: no mirror to set yet
        - git_mirror_enabled | default(true) | bool
        - _git_mirror_head.stat.exists or not ansible_check_mode

    # the push goes to the VIP - pi1's or pi2's address, as keepalived has it: both Pis' own host keys (read from them
    # over Ansible's checked connections) known under one alias, and checked - never "no" (a host answering at the VIP
    # got the code)
    - name: Each Pi's own host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      register: _pi_host_keys
      when: git_mirror_enabled | default(true) | bool

    - name: The VIP's known hosts - both Pis' keys
      ansible.builtin.copy:
        dest: "{{ git_mirror_known_hosts }}"
        content: |
          {% for k in _pi_host_keys.results %}
          {{ git_mirror_host_alias }} {{ (k.content | b64decode).split()[:2] | join(' ') }}
          {% endfor %}
        owner: "{{ offsite_backup_user | default('sm') }}"
        group: "{{ offsite_backup_user | default('sm') }}"
        mode: '0644'
      when: git_mirror_enabled | default(true) | bool

    # set where it differs, not only at the first clone: a mirror made before kept its old command
    - name: The push's ssh - its key, the VIP's host keys checked
      community.general.git_config:
        repo: "{{ git_mirror_local_path }}"
        scope: local
        name: core.sshCommand
        value: >-
          ssh -o HostKeyAlias={{ git_mirror_host_alias }} -o UserKnownHostsFile={{ git_mirror_known_hosts }}
          -o StrictHostKeyChecking=yes -i {{ offsite_backup_ssh_key | default('/home/sm/.ssh/id_ed25519') }}
      become: true
      become_user: "{{ _git_mirror_owner }}"
      when:  # a preview of a first run: no mirror to set yet
        - git_mirror_enabled | default(true) | bool
        - _git_mirror_head.stat.exists or not ansible_check_mode

    - name: Write offsite backup rsync script
      ansible.builtin.copy:
        dest: /usr/local/bin/offsite-backup-sync.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Push git mirror to Pi for offsite code backup.
          # Velero backs up to the in-cluster minio-backup; this rsync
          # is the separate offsite copy.
          set -euo pipefail

          # A failed fetch or push fails the unit (each was a warning in the journal, the unit green); the push is
          # tried after a failed fetch all the same - the copy it has is still a copy
          MIRROR="{{ git_mirror_local_path }}"
          [ -d "$MIRROR" ] || { logger -t git-mirror "FAILED: no mirror at $MIRROR"; exit 1; }
          logger -t git-mirror "Starting git mirror sync"
          failed=""
          GIT_TERMINAL_PROMPT=0 sudo -u {{ _git_mirror_owner }} git -C "$MIRROR" fetch --prune origin 2>&1 \
            | logger -t git-mirror || failed+=" fetch-from-Forgejo"
          sudo -u {{ _git_mirror_owner }} git -C "$MIRROR" push --mirror pi 2>&1 | logger -t git-mirror \
            || failed+=" push-to-the-Pis"
          if [ -n "$failed" ]; then
            logger -t git-mirror "FAILED:$failed"
            exit 1
          fi
          logger -t git-mirror "Git mirror sync complete"
      when: git_mirror_enabled | default(true) | bool

    - name: Create offsite backup systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/offsite-backup.service
        mode: '0644'
        content: |
          [Unit]
          Description=Rsync backups to Vault Pi (offsite copy)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/offsite-backup-sync.sh
          TimeoutStartSec=1800
      when: offsite_backup_enabled | default(true) | bool

    - name: Create offsite backup systemd timer (4 AM daily)
      ansible.builtin.copy:
        dest: /etc/systemd/system/offsite-backup.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Daily offsite backup sync

          [Timer]
          OnCalendar=*-*-* 04:00:00
          Persistent=true
          RandomizedDelaySec=300

          [Install]
          WantedBy=timers.target
      when: offsite_backup_enabled | default(true) | bool

    - name: Enable and start offsite backup timer
      ansible.builtin.systemd:
        name: offsite-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when: offsite_backup_enabled | default(true) | bool

    - name: The mirror
      ansible.builtin.debug:
        msg: >-
          Git mirror of {{ git_mirror_repo }}: {{ git_mirror_local_path }}, pushed daily at 4 AM (offsite-backup.timer)
          to {{ offsite_backup_host | default(keepalived_vip) }}:/mnt/backups/git-mirror/monitor.git
