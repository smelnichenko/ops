---
# Setup Velero + Backup MinIO for k8s cluster backups - the install from before Argo CD owned Velero (infra's velero
# app; the backup store is the Pis'). Where that Application exists the first play ends at once: its pinned chart and
# in-cluster MinIO would roll Velero back under Argo and bring back a retired store. The second play, the offsite git
# mirror of the Forgejo organisation's repositories to the Pis (a daily timer on ten), runs either way.
#
# Prerequisites:
#   - kubeadm cluster running (setup-kubeadm.yml)
#   - /mnt/backups mounted (backup partition)
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-velero.yml
#
- name: Setup Velero + Backup MinIO
  hosts: target
  become: true
  gather_facts: false

  vars:
    velero_namespace: velero
    velero_chart_version: "11.4.0"
    velero_backup_path: "/mnt/backups/minio"
    velero_minio_storage_size: "100Gi"
    minio_image: "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"

  tasks:
    - name: Does Argo CD own Velero (its Application)
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get application velero --ignore-not-found -o name
      register: _velero_by_argo
      changed_when: false
      check_mode: false

    - name: Argo CD owns Velero - nothing here to install
      when: _velero_by_argo.stdout | length > 0
      block:
        - name: Skipped
          ansible.builtin.debug:
            msg: "VELERO IS ARGO CD'S (infra's velero app): its install and the in-cluster MinIO skipped"
        - name: End this play
          ansible.builtin.meta: end_play

    # ================================================================
    # Phase 1: Create namespace and backup directory
    # ================================================================

    - name: Create velero namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ velero_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged

    - name: Create backup directory on host
      ansible.builtin.file:
        path: "{{ velero_backup_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    # ================================================================
    # Phase 2: Deploy Backup MinIO (HostPath for predictable location)
    # ================================================================

    - name: Deploy backup MinIO PersistentVolume
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: minio-backup-pv
            labels:
              app: minio-backup
          spec:
            capacity:
              storage: "{{ velero_minio_storage_size }}"
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            hostPath:
              path: "{{ velero_backup_path }}"
              type: DirectoryOrCreate
            persistentVolumeReclaimPolicy: Retain

    - name: Deploy backup MinIO PersistentVolumeClaim
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: minio-backup-pvc
            namespace: "{{ velero_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: manual
            resources:
              requests:
                storage: "{{ velero_minio_storage_size }}"
            selector:
              matchLabels:
                app: minio-backup

    # minio-backup-secret managed by ExternalSecret (Vault)
    - name: Deploy backup MinIO Deployment
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio-backup
            namespace: "{{ velero_namespace }}"
            labels:
              app: minio-backup
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: minio-backup
            template:
              metadata:
                labels:
                  app: minio-backup
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: minio
                    image: "{{ minio_image }}"
                    command: ["minio", "server", "/data", "--console-address", ":9001"]
                    envFrom:
                      - secretRef:
                          name: minio-backup-secret
                    ports:
                      - containerPort: 9000
                        name: api
                      - containerPort: 9001
                        name: console
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 50m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 1Gi
                    volumeMounts:
                      - name: data
                        mountPath: /data
                    livenessProbe:
                      httpGet:
                        path: /minio/health/live
                        port: 9000
                      initialDelaySeconds: 10
                      periodSeconds: 30
                    readinessProbe:
                      httpGet:
                        path: /minio/health/ready
                        port: 9000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: minio-backup-pvc

    - name: Deploy backup MinIO Service
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: minio-backup
            namespace: "{{ velero_namespace }}"
          spec:
            selector:
              app: minio-backup
            ports:
              - name: api
                port: 9000
                targetPort: 9000
              - name: console
                port: 9001
                targetPort: 9001

    - name: Wait for backup MinIO to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: minio-backup
        namespace: "{{ velero_namespace }}"
      register: minio_backup_deploy
      retries: 24
      delay: 5
      until:
        - minio_backup_deploy.resources | length > 0
        - minio_backup_deploy.resources[0].status.readyReplicas | default(0) == minio_backup_deploy.resources[0].spec.replicas
        - minio_backup_deploy.resources[0].status.updatedReplicas | default(0) == minio_backup_deploy.resources[0].spec.replicas

    - name: Create velero bucket in MinIO
      vars:
        # AWS's own CLI, as platform's s3gw bucket Job: MinIO withdrew its mc images on 2026-09-24 (quay.io 401,
        # docker.io gone)
        s3_image: "amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8"
        minio_url: "http://minio-backup.{{ velero_namespace }}.svc:9000"
        # the server's own keys, from its Secret into the pod's environment - never on a command line (templated in,
        # they were on kubectl's on ten; as mc's arguments, on the node's /proc)
        s3_cmd: >-
          set -e; s3() { aws --endpoint-url {{ minio_url }} s3api "$@"; };
          if s3 head-bucket --bucket velero > /dev/null 2>&1; then echo "BUCKET EXISTS";
          else s3 create-bucket --bucket velero > /dev/null; echo "BUCKET CREATED"; fi
        pod_overrides:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: minio-setup
                image: "{{ s3_image }}"
                command: ["sh", "-c", "{{ s3_cmd }}"]
                env:
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: {secretKeyRef: {name: minio-backup-secret, key: MINIO_ROOT_USER}}
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: {secretKeyRef: {name: minio-backup-secret, key: MINIO_ROOT_PASSWORD}}
                  - name: AWS_DEFAULT_REGION
                    value: us-east-1
                  - name: HOME  # the CLI's cache, writable as uid 1000
                    value: /tmp
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
      # its result judged: a failure (the image, the store, the keys) fails the step - `|| true` hid every one
      ansible.builtin.shell: |
        set -o pipefail
        kubectl run minio-setup --rm -i \
          --restart=Never \
          -n {{ velero_namespace }} \
          --image={{ s3_image }} \
          --overrides='{{ pod_overrides | to_json }}' 2>&1
      args:
        executable: /bin/bash
      register: _bucket
      changed_when: "'BUCKET CREATED' in _bucket.stdout"

    # ================================================================
    # Phase 3: Deploy Velero
    # ================================================================

    - name: Add vmware-tanzu Helm repo
      check_mode: false  # the node's chart index only: a preview then installs against a current one
      kubernetes.core.helm_repository:
        name: vmware-tanzu
        repo_url: https://vmware-tanzu.github.io/helm-charts
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # velero-credentials managed by ExternalSecret (Vault)
    - name: Wait for Velero credentials secret
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Secret
        name: velero-credentials
        namespace: "{{ velero_namespace }}"
      register: velero_secret
      retries: 12
      delay: 10
      until: velero_secret.resources | length > 0
      no_log: true

    - name: Install Velero CRDs
      ansible.builtin.shell: |
        kubectl apply --server-side -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backups.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backupstoragelocations.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/deletebackuprequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/downloadrequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/podvolumebackups.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/podvolumerestores.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/restores.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/schedules.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/serverstatusrequests.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/volumesnapshotlocations.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/datadownloads.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/datauploads.yaml \
          -f https://raw.githubusercontent.com/vmware-tanzu/helm-charts/main/charts/velero/crds/backuprepositories.yaml
      changed_when: false

    - name: Deploy Velero via Helm
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: velero
        chart_ref: vmware-tanzu/velero
        chart_version: "{{ velero_chart_version }}"
        release_namespace: "{{ velero_namespace }}"
        skip_crds: true
        disable_hook: true
        values:
          initContainers:
            - name: velero-plugin-for-aws
              image: velero/velero-plugin-for-aws:v1.11.1
              volumeMounts:
                - name: plugins
                  mountPath: /target
          credentials:
            useSecret: true
            existingSecret: velero-credentials
          configuration:
            backupStorageLocation:
              - name: default
                provider: aws
                bucket: velero
                config:
                  region: us-east-1
                  s3ForcePathStyle: "true"
                  s3Url: "http://minio-backup.{{ velero_namespace }}.svc:9000"
            volumeSnapshotLocation: []
            defaultVolumesToFsBackup: true
            features: ""
          deployNodeAgent: true
          snapshotsEnabled: false
          schedules:
            schnappy-daily:
              disabled: false
              schedule: "0 2 * * *"
              useOwnerReferencesInBackup: false
              template:
                ttl: 168h
                includedNamespaces:
                  - schnappy
                defaultVolumesToFsBackup: true
            full-weekly:
              disabled: false
              schedule: "0 3 * * 0"
              useOwnerReferencesInBackup: false
              template:
                ttl: 720h
                includedNamespaces:
                  - "*"
                defaultVolumesToFsBackup: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Wait for Velero deployment to be ready
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: velero
        namespace: "{{ velero_namespace }}"
      register: velero_deploy
      retries: 24
      delay: 5
      until:
        - velero_deploy.resources | length > 0
        - velero_deploy.resources[0].status.readyReplicas | default(0) == velero_deploy.resources[0].spec.replicas
        - velero_deploy.resources[0].status.updatedReplicas | default(0) == velero_deploy.resources[0].spec.replicas

    # ================================================================
    # Phase 4: Network policies
    # ================================================================

    # Argo CD-managed via infra repo
    - name: Apply velero-default-deny NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero-default-deny
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector: {}
            policyTypes:
              - Ingress

    - name: Apply velero-to-minio NetworkPolicy
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: velero-to-minio
            namespace: "{{ velero_namespace }}"
          spec:
            podSelector:
              matchLabels:
                app: minio-backup
            policyTypes:
              - Ingress
            ingress:
              - from:
                  - podSelector: {}
                ports:
                  - protocol: TCP
                    port: 9000

# Every repository of the schnappy organisation mirrored from Forgejo and pushed to the Pis daily (offsite-backup.timer),
# an extra copy of the code that KEEPS what it held: nothing Forgejo deletes or rewrites is deleted from it (pushed
# without deletions, every ref update logged and never expired, no gc there) - a repository wiped or rolled back in
# Forgejo fails the run by name instead of wiping its backup
- name: Offsite git mirror to the Pis
  hosts: target
  become: true
  gather_facts: false

  vars:
    git_mirror_enabled: true
    # Forgejo as this environment serves it (setup-pi-services' forgejo_root_url): https://git.pmon.dev/ in production;
    # the Vagrant copy's own Forgejo at its VIP (the copy's node resolves git.pmon.dev to production, which its guard
    # drops - a mirror run there must read the copy's Forgejo, never production's)
    git_mirror_base: "{{ (forgejo_root_url | default('https://git.pmon.dev/')) | regex_replace('/+$', '') }}"
    # every repository of this Forgejo organisation, listed at each run (a new one mirrored the day it appears) - the
    # code lives there; forgejo_admin/monitor, mirrored until 2026-10, was no repository production has
    git_mirror_org: schnappy
    # the mirror's own Forgejo account - no admin (operator 2026-10-20: no admin account in any automation): a team of
    # the organisation's gives it code read on every repository, new ones too; nothing else. The admin's credentials
    # make the account (anew at each new token: an account of that name made by anyone else - Forgejo's sign-up is open
    # - is never adopted with its own tokens and keys) and its team here; the sync holds the reader's token alone
    git_mirror_user: git-mirror
    git_mirror_email: git-mirror@pmon.dev
    git_mirror_team: git-mirror-read
    git_mirror_dir: /var/lib/git-mirror
    git_mirror_host_alias: pi-vip
    git_mirror_known_hosts: "/var/lib/git-mirror/known_hosts"
    # Forgejo read with a token of read:repository, read:organization and read:user alone, never the admin's password -
    # that sat in the old mirror's origin URL, on git-remote-https's argv at each fetch (any local user reads those in
    # /proc). The token in a file of the mirror's user's alone: a credential helper of the sync's own hands it to git
    # (the credential protocol: no command line) - one that answers "get" alone: git's store helper erases what it holds
    # on any 401 (a blip), and every sync after failed; the sync's API call takes it on curl's config
    git_mirror_token_file: "/var/lib/git-mirror/token"
    # each repository pushed to a bare one of its own on the Pi at the VIP; the run's last-success beside them
    git_mirror_pi_dir: /mnt/backups/git-mirror
    # the only thing the mirror's key may run on a Pi (its forced command): check, init, refs, git-receive-pack,
    # last-success, keep-unmarked - their arguments checked, each bounded, the volume's mount checked at each
    git_mirror_gate: /usr/local/bin/git-mirror-gate
    # the address the Pis see the push come from (the mirror's key is accepted from it alone)
    git_mirror_from: "{{ ansible_host }}"
    _git_mirror_owner: "{{ offsite_backup_user | default('sm') }}"
    _git_mirror_pi: "{{ offsite_backup_user | default('sm') }}@{{ offsite_backup_host | default(keepalived_vip) }}"
    _git_mirror_forgejo: "{{ git_mirror_base }}/api/v1"
    _git_mirror_api: "{{ _git_mirror_forgejo }}/orgs/{{ git_mirror_org }}/repos"
    # the key the sync pushes with: the mirror's own (made where none, in its directory - not its user's own key, which
    # logs in to a Pi with a shell), authorized on both Pis - the VIP's either - for the gate alone, from ten alone
    _git_mirror_key: "{{ offsite_backup_ssh_key | default(git_mirror_dir ~ '/id_ed25519') }}"
    # the sync's result for Prometheus (node_exporter's textfile collector, setup-host-hardening.yml): its last good
    # run's time and how many repositories it mirrored - OffsiteGitMirrorMissing fires when none is recent,
    # OffsiteGitMirrorShrank when it mirrors fewer than it did (the old job failed every night unnoticed from 2026-07,
    # its successor never deployed; seen again 2026-11-15)
    _git_mirror_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}"
    _git_mirror_prom: "{{ _git_mirror_textfile_dir }}/offsite_git_mirror.prom"
    _git_mirror_ssh_opts: >-
      -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
      -o HostKeyAlias={{ git_mirror_host_alias }} -o UserKnownHostsFile={{ git_mirror_known_hosts }}
      -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i {{ _git_mirror_key }}
    # whether the token in a file reads the organisation's repositories, and whose it is: "HTTP 200 <login> <admin>"
    # (kept only as the reader's, no admin's); 401/403 (or no token): "HTTP <code>"/"NO TOKEN" - a new one is made; the
    # user API refusing a token that reads (401/403: one without read:user, the admin's of before) "HTTP 200 UNSCOPED"
    # - a new one; anything else (Forgejo or the network down, a 5xx, no answer) proves nothing either way: printed as
    # it is, the play fails, no token made
    _git_mirror_probe: |
      set -uo pipefail
      token=$(cat "$TOKEN_FILE" 2> /dev/null) || token=""
      [ -n "$token" ] || { echo "NO TOKEN"; exit 0; }
      code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
        -K <(printf 'header = "Authorization: token %s"\n' "$token") "$API?limit=1")
      [ "$code" = 200 ] || { echo "HTTP $code"; exit 0; }
      me=$(mktemp -p "$(dirname "$TOKEN_FILE")" .probe.XXXXXX) || { echo "NO TEMP FILE"; exit 0; }
      trap 'rm -f "$me"' EXIT
      ucode=$(curl -s --max-time 30 -o "$me" -w '%{http_code}' \
        -K <(printf 'header = "Authorization: token %s"\n' "$token") "$USER_API")
      case "$ucode" in
        200) python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("HTTP 200", d["login"], str(d["is_admin"]).lower())' "$me" \
               || echo "USER API NOT READ" ;;
        401|403) echo "HTTP 200 UNSCOPED" ;;
        *) echo "USER API HTTP $ucode" ;;
      esac
    # every repository the token's account reads, and what it may do there: "PUSHES NONE <n>" - none pushed to or
    # administered - or "PUSHES <repo> ..."; "NOT READ" when the listing is not, or a repository's permissions are
    # missing (an answer without them proves nothing: fail closed)
    _git_mirror_reach: |
      set -uo pipefail
      token=$(cat "$TOKEN_FILE") || { echo "NOT READ"; exit 0; }
      page=1 all=""
      while [ "$page" -le 20 ]; do
        out=$(curl -sf --max-time 60 -K <(printf 'header = "Authorization: token %s"\n' "$token") \
          "$API?limit=50&page=$page") || { echo "NOT READ"; exit 0; }
        n=$(python3 -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "$out") || { echo "NOT READ"; exit 0; }
        [ "$n" != 0 ] || break
        all+="$out"$'\n'
        page=$((page + 1))
      done
      [ "$page" -le 20 ] || { echo "NOT READ"; exit 0; }
      python3 -c 'import json, sys
      repos = [r for line in sys.stdin if line.strip() for r in json.loads(line)]
      if any(not isinstance(r.get("permissions"), dict) or "push" not in r["permissions"] or "admin" not in r["permissions"]
             for r in repos):
          print("NOT READ")
          sys.exit(0)
      bad = [r["name"] for r in repos if r["permissions"]["push"] or r["permissions"]["admin"]]
      print("PUSHES " + " ".join(bad) if bad else f"PUSHES NONE {len(repos)}")' <<< "$all"
    # the gate on each Pi - the mirror's key's forced command (sshd hands it the command asked for in
    # SSH_ORIGINAL_COMMAND; it runs that alone, as the mirror user). GIT_MIRROR_GATE_DIR: the harness's
    _git_mirror_gate_script: |
      #!/bin/bash
      # git-mirror-gate - the only thing the offsite git mirror's key may run here (ops setup-velero.yml): its forced
      # command (authorized_keys: restrict, from ten alone). Every verb checks its arguments and the volume's mount, and
      # is bounded - a hung Gluster client holds no run. A repository it did not make is never written.
      #   check                  the volume mounted and writable: OK
      #   init <name> <branch>   the bare repository made where none (marked as the mirror's), kept as a backup: every
      #                          ref update logged and never expired, no gc, no deletion; HEAD that branch
      #   refs <name>            how many refs it holds (0: none, or no repository)
      #   git-receive-pack '<dir>/<name>.git'   a push into one the mirror made
      #   last-success <time>    the run's time (YYYYMMDDTHHMMSSZ) written whole
      #   keep-unmarked          a repository the mirror did not make kept under <name>.pre-mirror-<time>.git - never
      #                          pushed over
      set -uo pipefail
      dir=${GIT_MIRROR_GATE_DIR:-{{ git_mirror_pi_dir }}}
      {% raw %}
      say() { echo "git-mirror-gate on $(hostname): $*" >&2; }
      read -r -a a <<< "${SSH_ORIGINAL_COMMAND:-}"
      mounted() { timeout 60 mountpoint -q "$dir" || { say "$dir not mounted"; exit 3; }; }
      plain() { [[ $1 =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] || { say "no repository name: $1"; exit 2; }; }
      g() { timeout --kill-after=10 120 git "$@"; }
      marked() { [ "$(g -C "$1" config --get mirror.made-by 2> /dev/null)" = offsite-git-mirror ]; }
      case "${a[0]:-}" in
        check)
          [ "${#a[@]}" -eq 1 ] || { say "check takes nothing"; exit 2; }
          mounted
          [ -w "$dir" ] || { say "$dir not writable"; exit 3; }
          echo OK ;;
        init)
          [ "${#a[@]}" -eq 3 ] || { say "init <name> <branch>"; exit 2; }
          plain "${a[1]}"
          [[ ${a[2]} =~ ^[A-Za-z0-9._/-]+$ && ${a[2]} != *..* ]] || { say "no branch name: ${a[2]}"; exit 2; }
          mounted
          r=$dir/${a[1]}.git
          if [ ! -e "$r" ]; then
            g init -q --bare "$r" && g -C "$r" config mirror.made-by offsite-git-mirror || { say "${a[1]}: not made"; exit 4; }
          fi
          marked "$r" || { say "${a[1]}.git was not made by this mirror - left as it is (keep-unmarked keeps it aside)"; exit 5; }
          for kv in core.logAllRefUpdates=always gc.reflogExpire=never gc.reflogExpireUnreachable=never gc.pruneExpire=never \
                    gc.auto=0 receive.autogc=false receive.denyDeletes=true receive.denyNonFastForwards=false; do
            g -C "$r" config "${kv%%=*}" "${kv#*=}" || { say "${a[1]}: $kv not set"; exit 4; }
          done
          g -C "$r" symbolic-ref HEAD "refs/heads/${a[2]}" || { say "${a[1]}: its HEAD not set"; exit 4; } ;;
        refs)
          [ "${#a[@]}" -eq 2 ] || { say "refs <name>"; exit 2; }
          plain "${a[1]}"
          mounted
          r=$dir/${a[1]}.git
          if [ -e "$r" ]; then g -C "$r" for-each-ref --format=x | wc -l; else echo 0; fi ;;
        git-receive-pack)
          [ "${#a[@]}" -eq 2 ] || { say "git-receive-pack '<repository>'"; exit 2; }
          p=${a[1]#\'}; p=${p%\'}
          [[ $p == "$dir"/*.git ]] || { say "not a repository of $dir: $p"; exit 2; }
          n=${p#"$dir"/}; n=${n%.git}
          plain "$n"
          mounted
          marked "$p" || { say "$n.git was not made by this mirror - nothing received"; exit 5; }
          exec timeout --kill-after=30 600 git-receive-pack "$p" ;;
        last-success)
          [ "${#a[@]}" -eq 2 ] && [[ ${a[1]} =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { say "last-success <YYYYMMDDTHHMMSSZ>"; exit 2; }
          mounted
          timeout 60 sh -c 'printf "%s\n" "$1" > "$2/last-success.new" && mv -f "$2/last-success.new" "$2/last-success"' \
            - "${a[1]}" "$dir" || { say "last-success not written"; exit 4; } ;;
        keep-unmarked)
          [ "${#a[@]}" -eq 1 ] || { say "keep-unmarked takes nothing"; exit 2; }
          mounted
          now=$(date -u +%Y%m%dT%H%M%SZ)
          for r in "$dir"/*.git; do
            [ -d "$r" ] || continue
            case "$r" in *.pre-mirror-*.git) continue ;; esac
            marked "$r" && continue
            k=${r%.git}.pre-mirror-$now.git
            timeout 60 mv "$r" "$k" || { say "$r not kept aside"; exit 4; }
            echo "kept $(basename "$r") as $(basename "$k")"
          done ;;
        *)
          say "refused: ${SSH_ORIGINAL_COMMAND:-(no command)}"
          exit 2 ;;
      esac
      {% endraw %}

  tasks:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
      when: git_mirror_enabled | default(true) | bool

    - name: Create local git mirror directory
      ansible.builtin.file:
        path: "{{ git_mirror_dir }}"
        state: directory
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: '0750'
      when: git_mirror_enabled | default(true) | bool

    # the token kept while it still reads the organisation's repositories, as the reader's
    - name: The mirror's token reads the organisation's repositories
      ansible.builtin.shell:
        cmd: "{{ _git_mirror_probe }}"
        executable: /bin/bash
      environment:
        TOKEN_FILE: "{{ git_mirror_token_file }}"
        API: "{{ _git_mirror_api }}"
        USER_API: "{{ _git_mirror_forgejo }}/user"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      check_mode: false  # a read: a preview judges the token too
      register: _git_mirror_read
      changed_when: false
      failed_when: _git_mirror_read.stdout is not match('^(HTTP 200 .+ (true|false)|HTTP 200 UNSCOPED|HTTP 401|HTTP 403|NO TOKEN)$')
      when: git_mirror_enabled | default(true) | bool

    - name: Whether the kept token reads
      ansible.builtin.set_fact:
        # the reader's alone, no admin's: a token of anyone else's (the admin's, as this play minted before) replaced
        _git_mirror_token_works: "{{ _git_mirror_read.stdout | default('') == 'HTTP 200 ' ~ git_mirror_user ~ ' false' }}"
      when: git_mirror_enabled | default(true) | bool

    # a new token wanted: the reader made anew - an account of that name deleted first (one made by anyone else, its
    # tokens, keys and grants with it), then made, its team's code read on every repository of the organisation alone
    # - by the admin's credentials; the token minted BY the reader (its own basic auth, a random password kept nowhere)
    - name: The admin's credentials, and a reader that is not the admin
      ansible.builtin.assert:
        that:
          - forgejo_admin_user is defined and forgejo_admin_user | length > 0
          - forgejo_admin_password is defined and forgejo_admin_password | length > 0
          - git_mirror_user != forgejo_admin_user
        fail_msg: "REFUSED: the admin's credentials make the mirror's reader - and the reader is never the admin"
        quiet: true
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: The mirror's reader, if Forgejo has one
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/users/{{ git_mirror_user }}"
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      check_mode: false  # a read
      register: _git_mirror_account
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: The reader of before deleted - its tokens, keys and grants with it (never adopted)
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/admin/users/{{ git_mirror_user }}?purge=true"
        method: DELETE
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: [204, 404]  # gone already (deleted meanwhile) is what it wants
      changed_when: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - _git_mirror_account.status == 200
        - not ansible_check_mode

    - name: A fresh random password for the reader (this run's alone)
      ansible.builtin.set_fact:
        _git_mirror_password: "{{ lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_letters,digits') }}"
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: The reader made
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/admin/users"
        method: POST
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          username: "{{ git_mirror_user }}"
          login_name: "{{ git_mirror_user }}"
          source_id: 0
          email: "{{ git_mirror_email }}"
          password: "{{ _git_mirror_password }}"
          must_change_password: false
          send_notify: false
          visibility: private
        status_code: 201
      changed_when: true
      no_log: true  # the password in its body
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The reader, as it sees itself
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/user"
        url_username: "{{ git_mirror_user }}"
        url_password: "{{ _git_mirror_password }}"
        force_basic_auth: true
        status_code: 200
      register: _git_mirror_self
      no_log: true  # its password
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The reader is no admin
      ansible.builtin.assert:
        that:
          - _git_mirror_self.json.login == git_mirror_user
          - not (_git_mirror_self.json.is_admin | bool)
        fail_msg: >-
          REFUSED: {{ git_mirror_user }} signs in as {{ (_git_mirror_self.json | default({})).login | default('?') }},
          admin {{ (_git_mirror_self.json | default({})).is_admin | default('?') }} - the mirror holds no admin
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The organisation's teams
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/orgs/{{ git_mirror_org }}/teams?limit=50"
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 200
      check_mode: false  # a read
      register: _git_mirror_teams
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    - name: Every team read (one page, not full)
      ansible.builtin.assert:
        that: _git_mirror_teams.json | length < 50
        fail_msg: "REFUSED: {{ git_mirror_org }} has 50 teams or more - not all read"
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool

    # code read on every repository of the organisation, new ones too (includes_all_repositories) - nothing else: no
    # write, no other unit, no repository made
    - name: The reader's team made, where missing
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/orgs/{{ git_mirror_org }}/teams"
        method: POST
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        body_format: json
        body: &git_mirror_team_body
          name: "{{ git_mirror_team }}"
          description: "The offsite git mirror's reader (ops setup-velero.yml): code read on every repository"
          permission: read
          units_map: {repo.code: read}
          includes_all_repositories: true
          can_create_org_repo: false
        status_code: 201
      register: _git_mirror_team_made
      changed_when: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - git_mirror_team not in (_git_mirror_teams.json | map(attribute='name') | list)
        - not ansible_check_mode

    - name: The reader's team, found
      ansible.builtin.set_fact:
        _git_mirror_team_id: >-
          {{ _git_mirror_team_made.json.id if (_git_mirror_team_made.json is defined)
             else (_git_mirror_teams.json | selectattr('name', 'equalto', git_mirror_team) | map(attribute='id') | first) }}
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: Who is in the reader's team
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/teams/{{ _git_mirror_team_id }}/members?limit=50"
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _git_mirror_members
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The reader's team holds no one else
      ansible.builtin.assert:
        that: _git_mirror_members.json | map(attribute='login') | reject('equalto', git_mirror_user) | list | length == 0
        fail_msg: >-
          REFUSED: team {{ git_mirror_org }}/{{ git_mirror_team }} holds
          {{ _git_mirror_members.json | default([]) | map(attribute='login') | reject('equalto', git_mirror_user) | join(', ') }}
          - not the reader's alone; nothing changed on it
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The reader's team's scope - code read on every repository, nothing more
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/teams/{{ _git_mirror_team_id }}"
        method: PATCH
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        body_format: json
        body: *git_mirror_team_body
        status_code: 200
      changed_when: false  # the same settings written again
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The reader in its team
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/teams/{{ _git_mirror_team_id }}/members/{{ git_mirror_user }}"
        method: PUT
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 204
      changed_when: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode
        - git_mirror_user not in (_git_mirror_members.json | map(attribute='login') | list)

    # the admin's own git-mirror-* tokens - this play minted the mirror's token on the admin before (2026-10) - revoked:
    # no admin's token made for automation is left live. Page by page, ten of 50, the last one not full
    - name: The admin's tokens, page by page
      loop: "{{ range(1, 11) | list }}"
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/users/{{ forgejo_admin_user }}/tokens?limit=50&page={{ item }}"
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _git_mirror_admin_tokens
      changed_when: false
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: Every one of the admin's tokens read (the last page not full)
      ansible.builtin.assert:
        that: (_git_mirror_admin_tokens.results | last).json | length < 50
        fail_msg: "REFUSED: the admin has more than 500 tokens - not all read; delete the stale ones by hand"
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: The admin's mirror tokens of before revoked
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/users/{{ forgejo_admin_user }}/tokens/{{ item.id }}"
        method: DELETE
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: [204, 404]  # gone already (deleted meanwhile) is what it wants
      loop: >-
        {{ _git_mirror_admin_tokens.results | default([]) | map(attribute='json', default=[]) | flatten
           | selectattr('name', 'match', '^git-mirror-') | list }}
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    - name: A new token for the mirror - its reads alone
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_forgejo }}/users/{{ git_mirror_user }}/tokens"
        method: POST
        user: "{{ git_mirror_user }}"
        password: "{{ _git_mirror_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "git-mirror-{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%S') }}"
          scopes:
            - "read:repository"
            - "read:organization"
            - "read:user"  # its probe asks whose it is (the user API)
        status_code: 201
      register: _git_mirror_token
      changed_when: true
      no_log: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode

    # the new token proven from a file of its own, and only then put where the sync reads it: a token that does not
    # read is deleted again, the one the sync had left as it was (a blip during a rotation left none that reads)
    - name: The new token in place, proven
      when:
        - git_mirror_enabled | default(true) | bool
        - not _git_mirror_token_works | bool
        - not ansible_check_mode
      block:
        # written on ten from the task's stdin (copy's content passes a temp file on the controller first)
        - name: The new token beside the sync's
          ansible.builtin.command:
            argv: [install, -m, "0600", -o, "{{ _git_mirror_owner }}", -g, "{{ _git_mirror_owner }}", /dev/stdin,
                   "{{ git_mirror_token_file }}.new"]
            stdin: "{{ _git_mirror_token.json.sha1 }}"
            stdin_add_newline: false
          changed_when: true
          no_log: true

        - name: The new token reads the organisation's repositories - and is the reader's, no admin's
          ansible.builtin.shell:
            cmd: "{{ _git_mirror_probe }}"
            executable: /bin/bash
          environment:
            TOKEN_FILE: "{{ git_mirror_token_file }}.new"
            API: "{{ _git_mirror_api }}"
            USER_API: "{{ _git_mirror_forgejo }}/user"
          become: true
          become_user: "{{ _git_mirror_owner }}"
          register: _git_mirror_new_read
          changed_when: false
          failed_when: _git_mirror_new_read.stdout != 'HTTP 200 ' ~ git_mirror_user ~ ' false'

        - name: The new token where the sync's credential helper reads it
          ansible.builtin.command:
            argv: [mv, -f, "{{ git_mirror_token_file }}.new", "{{ git_mirror_token_file }}"]
          become: true
          become_user: "{{ _git_mirror_owner }}"
          changed_when: true
      rescue:
        - name: The new token deleted - it does not read
          ansible.builtin.uri:
            follow_redirects: none
            url: "{{ _git_mirror_forgejo }}/users/{{ git_mirror_user }}/tokens/{{ _git_mirror_token.json.id }}"
            method: DELETE
            user: "{{ git_mirror_user }}"
            password: "{{ _git_mirror_password }}"
            force_basic_auth: true
            status_code: [204, 404]  # gone already (deleted meanwhile) is what it wants
          no_log: true

        - name: The new token's file removed
          ansible.builtin.file:
            path: "{{ git_mirror_token_file }}.new"
            state: absent

        - name: The mirror's token - none reads
          ansible.builtin.fail:
            msg: >-
              REFUSED: a new token for the mirror does not read {{ _git_mirror_api }} as {{ git_mirror_user }}
              ({{ _git_mirror_new_read.stdout | default('not read') }}) - deleted again, the sync's file as it was

    # read back as the mirror sees it, every run: every repository it reads, none it may push to or administer - and
    # every repository the organisation has (the admin's count): a team grant lost or wrong (the org is private, 17 of
    # its 20 repositories private, read 2026-11-15) lists the public ones alone, and the mirror would "succeed" on them
    - name: What the mirror's token reaches - read, never pushed to
      ansible.builtin.shell:
        cmd: "{{ _git_mirror_reach }}"
        executable: /bin/bash
      environment:
        TOKEN_FILE: "{{ git_mirror_token_file }}"
        API: "{{ _git_mirror_api }}"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      check_mode: false  # a read
      register: _git_mirror_reach_read
      changed_when: false
      failed_when: _git_mirror_reach_read.stdout is not match('^PUSHES NONE [1-9][0-9]*$')
      when:
        - git_mirror_enabled | default(true) | bool
        - not ansible_check_mode or _git_mirror_token_works | bool

    - name: The organisation's repositories, as the admin lists them - page by page, twenty of 50
      loop: "{{ range(1, 21) | list }}"
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ _git_mirror_api }}?limit=50&page={{ item }}"
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        status_code: 200
      check_mode: false  # a read
      register: _git_mirror_org_pages
      changed_when: false
      when:
        - git_mirror_enabled | default(true) | bool
        - not ansible_check_mode or _git_mirror_token_works | bool

    - name: The mirror reads every repository the organisation has
      vars:
        _org_count: "{{ _git_mirror_org_pages.results | map(attribute='json') | map('length') | sum }}"
      ansible.builtin.assert:
        that:
          - (_git_mirror_org_pages.results | last).json | length == 0
          - (_git_mirror_reach_read.stdout.split() | last | int) == (_org_count | int)
        fail_msg: >-
          REFUSED: the mirror reads {{ _git_mirror_reach_read.stdout.split() | last }} of the organisation's
          {{ _org_count }} repositories (or over 950 - not all listed) - its team's grant
          ({{ git_mirror_org }}/{{ git_mirror_team }}) is not what it must be
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - not ansible_check_mode or _git_mirror_token_works | bool

    # the gate on each Pi: the only thing the mirror's key may run there
    - name: The mirror's gate on each Pi
      ansible.builtin.copy:
        dest: "{{ git_mirror_gate }}"
        content: "{{ _git_mirror_gate_script }}"
        owner: root
        group: root
        mode: '0755'
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      become: true
      when: git_mirror_enabled | default(true) | bool

    # the key the sync pushes with: the mirror's own (made where none - no passphrase: the sync runs unattended), its
    # public half derived from it (a missing .pub file skipped the authorization, silently), authorized for the mirror
    # user on each Pi - the push goes to whichever holds the VIP - for the gate alone, from ten alone
    - name: The mirror's push key, made where it has none
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "offsite-git-mirror@{{ inventory_hostname }}", -f, "{{ _git_mirror_key }}"]
        creates: "{{ _git_mirror_key }}"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      when: git_mirror_enabled | default(true) | bool

    - name: The mirror's push key, if there is one (a preview before its first run has none yet)
      ansible.builtin.stat:
        path: "{{ _git_mirror_key }}"
      check_mode: false  # a read
      register: _git_mirror_key_file
      when: git_mirror_enabled | default(true) | bool

    - name: The mirror's push key's public half - derived from the key (a passphrase on it fails here)
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -P, "", -f, "{{ _git_mirror_key }}"]
      become: true
      become_user: "{{ _git_mirror_owner }}"
      check_mode: false  # a read
      register: _git_mirror_pubkey
      changed_when: false
      when:
        - git_mirror_enabled | default(true) | bool
        - _git_mirror_key_file.stat.exists

    - name: The mirror's push key authorized on each Pi - for the gate alone, from ten alone
      ansible.posix.authorized_key:
        user: "{{ _git_mirror_owner }}"
        key: "{{ (_git_mirror_pubkey.stdout.split()[:2] | join(' ')) ~ ' offsite-git-mirror@' ~ inventory_hostname }}"
        key_options: 'restrict,from="{{ git_mirror_from }}",command="{{ git_mirror_gate }}"'
        state: present
        exclusive: false  # the user's other keys stay
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      become: true
      when:
        - git_mirror_enabled | default(true) | bool
        - _git_mirror_pubkey.stdout is defined

    # the push goes to the VIP - pi1's or pi2's address, as keepalived has it: both Pis' own host keys (read from them
    # over Ansible's checked connections) known under one alias, and checked - never "no" (a host answering at the VIP
    # got the code)
    - name: Each Pi's own host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      register: _pi_host_keys
      when: git_mirror_enabled | default(true) | bool

    - name: The VIP's known hosts - both Pis' keys
      ansible.builtin.copy:
        dest: "{{ git_mirror_known_hosts }}"
        content: |
          {% for k in _pi_host_keys.results %}
          {{ git_mirror_host_alias }} {{ (k.content | b64decode).split()[:2] | join(' ') }}
          {% endfor %}
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: '0644'
      when: git_mirror_enabled | default(true) | bool

    # node_exporter's textfile collector reads it (setup-host-hardening.yml makes the directory, root's - made here the
    # same where it runs first); the file is the mirror user's, written whole by the sync after a good run - made empty
    # here once, its owner and mode put right every run, its content and times never touched
    - name: The node_exporter textfile directory
      ansible.builtin.file:
        path: "{{ _git_mirror_textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: git_mirror_enabled | default(true) | bool

    - name: The mirror's metrics file, the mirror user's
      ansible.builtin.file:
        path: "{{ _git_mirror_prom }}"
        state: touch
        owner: "{{ _git_mirror_owner }}"
        group: "{{ _git_mirror_owner }}"
        mode: '0644'
        modification_time: preserve
        access_time: preserve
      when: git_mirror_enabled | default(true) | bool

    # the Pi-side root the sync writes as the mirror's user: the backup-git-mirror volume's root - root:root 0755 as
    # Gluster made it on production (read 2026-10-08: every repository's init and last-success refused there) - the
    # mirror user's on each Pi where it is mounted; a bare mount point refused (the Pi's own disk). Bounded: a hung
    # client holds no play
    - name: The mirror's root on the Pis - mounted, the mirror user's
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      become: true
      timeout: 60
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          mountpoint -q {{ git_mirror_pi_dir }} || { echo "REFUSED: {{ git_mirror_pi_dir }} is not mounted here"; exit 1; }
          now=$(stat -c '%U:%G %a' {{ git_mirror_pi_dir }})
          [ "$now" != "{{ _git_mirror_owner }}:{{ _git_mirror_owner }} 750" ] || exit 0
          chown {{ _git_mirror_owner }}:{{ _git_mirror_owner }} {{ git_mirror_pi_dir }}
          chmod 0750 {{ git_mirror_pi_dir }}
          echo "changed from $now"
      register: _git_mirror_pi_root
      changed_when: "'changed from' in _git_mirror_pi_root.stdout"
      when: git_mirror_enabled | default(true) | bool

    # proven through each Pi, not only the one holding the VIP now: the key and the gate as the sync uses them, to each
    # Pi's own address (its host key under the alias) - a Pi refusing it otherwise showed the night the VIP moved
    - name: The push accepted on each Pi - its gate, the volume mounted and writable
      ansible.builtin.command:
        argv: "{{ ['ssh'] + (_git_mirror_ssh_opts | split) + [_git_mirror_owner ~ '@' ~ hostvars[item].ansible_host, 'check'] }}"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      loop: "{{ groups['pis'] }}"
      register: _git_mirror_pi_check
      changed_when: false
      failed_when: _git_mirror_pi_check.rc != 0 or _git_mirror_pi_check.stdout != 'OK'
      when:
        - git_mirror_enabled | default(true) | bool
        - not ansible_check_mode

    # a repository on the volume the mirror did not make (the old mirror's monitor.git, of forgejo_admin/monitor) is
    # kept aside under its own name, never pushed over - the mirror makes its own
    - name: A repository on the volume the mirror did not make, kept aside
      ansible.builtin.command:
        argv: "{{ ['ssh'] + (_git_mirror_ssh_opts | split) + [_git_mirror_pi, 'keep-unmarked'] }}"
      become: true
      become_user: "{{ _git_mirror_owner }}"
      register: _git_mirror_kept
      changed_when: _git_mirror_kept.stdout | length > 0
      when:
        - git_mirror_enabled | default(true) | bool
        - not ansible_check_mode

    # the unit before the script: a run stopped between them left production's old unit (no User=) to run the new script
    # as root, its objects root's and every run after refused
    - name: Create offsite backup systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/offsite-backup.service
        mode: '0644'
        content: |
          [Unit]
          Description=Mirror the Forgejo organisation's repositories to the Pis (offsite copy)
          After=network-online.target
          Wants=network-online.target
          # no start limit: systemd's counts every start, a deliberate one too - StartLimitBurst=3 in 6 h (meant to cap
          # the retries) refused the Vagrant copy's fourth sync within the hour (2026-11-15), as it would have refused
          # a deploy's or an operator's run after a failed night. The retries' backoff bounds them instead
          StartLimitIntervalSec=0

          [Service]
          Type=oneshot
          User={{ _git_mirror_owner }}
          ExecStart=/usr/local/bin/offsite-backup-sync.sh
          # a backstop: a push that times out (10 min) ends the run itself, every repository after it named; a stalled
          # fetch is 10 min each. Equal to the push's bound (1800 both), the first stall was systemd's kill, nothing named
          TimeoutStartSec=7200
          # a failed run tried again by itself until one succeeds (a Forgejo restart, a VIP move, a blip, a fix made
          # later): 45 min after, then 1.5 h, 3 h, and every 6 h from then on. A start meanwhile (the timer's, a
          # deploy's, an operator's) runs at once - systemd 257: "Scheduled restart job immediately on client request"
          Restart=on-failure
          RestartSec=45min
          RestartSteps=3
          RestartMaxDelaySec=6h
      register: _git_mirror_unit
      when: offsite_backup_enabled | default(true) | bool

    - name: Write offsite backup sync script
      ansible.builtin.copy:
        dest: /usr/local/bin/offsite-backup-sync.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # offsite-backup-sync.sh - every repository of the Forgejo organisation {{ git_mirror_org }} mirrored to the
          # Pis daily (offsite-backup.timer): a copy of the code off the Gluster pair that serves it, that keeps what it
          # held. The repositories listed from Forgejo's API at each run (a new one mirrored the day it appears); each
          # cloned bare when new, fetched, and pushed to a repository of its own on the Pi at the VIP - every ref, forced,
          # none deleted (the Pi's side logs every update and never expires them: a force-push or a deletion in Forgejo
          # loses nothing there). A repository Forgejo serves empty while its backup holds refs fails by name, its
          # backup kept. Forgejo read with the mirror's token - git's credential helper, curl's config: never a command
          # line; the Pi's host keys checked, the Pi's gate the only thing the key runs. A repository that fails is named
          # and the rest still go; any failure fails the unit. A good run writes last-success (its time) on the Pi,
          # then its time and count for Prometheus, last.
          set -uo pipefail
          [ "$(id -un)" = {{ _git_mirror_owner }} ] || { echo "REFUSED: run as {{ _git_mirror_owner }}, not $(id -un)"; exit 1; }
          dir={{ git_mirror_dir }}
          tokenf={{ git_mirror_token_file }}
          api={{ _git_mirror_api }}
          pi={{ _git_mirror_pi }}
          pidir={{ git_mirror_pi_dir }}
          say() { logger -t git-mirror "$*"; echo "$*"; }
          export GIT_TERMINAL_PROMPT=0
          # the mirror user's own git settings never apply to the mirror's git
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          # a dead connection ends (keep-alives); the Pi's gate bounds each of its steps
          ssh_opts=({{ _git_mirror_ssh_opts }})
          export GIT_SSH_COMMAND="ssh ${ssh_opts[*]}"
          # git's other helpers reset; this one answers "get" alone - storing or erasing (after a 401) changes nothing -
          # and for Forgejo's URL alone (credential.<url>.helper), no redirect followed: a redirect off the host (a
          # misconfigured proxy) asked it for the new host, and it answered any with the token. A large repository's
          # first clone prepares its pack with nothing sent for minutes: 10 minutes of under 1 kB/s before it aborts
          mirror_user={{ git_mirror_user }}
          forgejo_helper="credential.{{ git_mirror_base }}.helper"
          helper=(-c http.followRedirects=false -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=600 -c credential.helper=
                  -c "$forgejo_helper=!f() { [ \"\$1\" = get ] || return 0; echo username=$mirror_user; echo \"password=\$(cat $tokenf)\"; }; f")
          token=$(cat "$tokenf" 2> /dev/null) || token=""
          [ -n "$token" ] || { say "FAILED: no token in $tokenf"; exit 1; }
          repos="" page=1
          while :; do
            # 20 pages of 50 at most: past them, part of the organisation would go unmirrored, unsaid
            [ "$page" -le 20 ] || { say "FAILED: over 20 pages of repositories - not all listed"; exit 1; }
            out=$(curl -sf --max-time 60 -K <(printf 'header = "Authorization: token %s"\n' "$token") \
              "$api?limit=50&page=$page") || { say "FAILED: the organisation's repositories not listed"; exit 1; }
            # each "<name> <default branch>" - the backup's HEAD is set to that branch (a plain clone of it checks out
            # what Forgejo's does; init --bare left HEAD at master, and a restore found nothing to check out)
            names=$(python3 -c 'import json, sys
          print("\n".join(r["name"] + " " + (r.get("default_branch") or "main") for r in json.load(sys.stdin)))' <<< "$out") \
              || { say "FAILED: its listing not read"; exit 1; }
            [ -n "$names" ] || break
            repos+="$names"$'\n'
            page=$((page + 1))
          done
          [ -n "$repos" ] || { say "FAILED: no repository listed"; exit 1; }
          failed="" mirrored="" hung=""
          # the list on a descriptor of its own: ssh reads its standard input, and on the loop's it swallowed every
          # repository after the first (the copy's check, 2026-11-15: the run clean, one repository of two mirrored)
          while read -r r head <&3; do
            [ -n "$r" ] || continue
            [ -z "$hung" ] || { failed+=" $r(not tried - $hung)"; continue; }
            [[ $r =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] || { failed+=" $r(its name)"; continue; }
            [[ $head =~ ^[A-Za-z0-9._/-]+$ && $head != *..* ]] || { failed+=" $r(its default branch)"; continue; }
            d=$dir/$r.git
            url={{ git_mirror_base }}/{{ git_mirror_org }}/$r.git
            if [ ! -f "$d/HEAD" ]; then
              git "${helper[@]}" clone -q --mirror "$url" "$d" 2>&1 | logger -t git-mirror || { failed+=" $r(clone)"; continue; }
            fi
            # its origin the organisation's, bare (a mirror made before pointed elsewhere, a password in its URL)
            git -C "$d" remote set-url origin "$url" || { failed+=" $r(origin)"; continue; }
            # the old mirror's own settings gone (monitor.git's on ten): an ssh with no host-key check, a remote of the Pi
            # (the repository's own config alone: one in git's user or system config is no mirror's, and its unset here
            # failed every run)
            if git -C "$d" config --local --get core.sshCommand > /dev/null; then
              git -C "$d" config --unset-all core.sshCommand || { failed+=" $r(its old ssh setting)"; continue; }
            fi
            if git -C "$d" config --local --get-regexp '^remote\.pi\.' > /dev/null; then
              git -C "$d" remote remove pi || { failed+=" $r(its old remote)"; continue; }
            fi
            # a failed fetch pushes nothing: the stale copy would land as if it were today's
            git "${helper[@]}" -C "$d" fetch -q --prune origin 2>&1 | logger -t git-mirror || { failed+=" $r(fetch)"; continue; }
            here=$(git -C "$d" for-each-ref --format=x | wc -l)
            if [ "$here" = 0 ]; then
              # Forgejo serves it empty: an empty repository (its backup empty too) is mirrored as it is; one whose
              # backup holds refs was wiped or replaced in Forgejo - named, its backup kept
              there=$(ssh "${ssh_opts[@]}" "$pi" refs "$r" 2> >(logger -t git-mirror)) || { failed+=" $r(its backup not read)"; continue; }
              if [ "$there" != 0 ]; then failed+=" $r(emptied in Forgejo - its backup of $there refs kept)"; continue; fi
              ssh "${ssh_opts[@]}" "$pi" init "$r" "$head" 2>&1 | logger -t git-mirror || { failed+=" $r(its repository on the Pi)"; continue; }
              mirrored+=" $r"
              continue
            fi
            # its repository on the Pi made when new, its HEAD the default branch - the gate's
            ssh "${ssh_opts[@]}" "$pi" init "$r" "$head" 2>&1 | logger -t git-mirror || { failed+=" $r(its repository on the Pi)"; continue; }
            # every ref, forced, none deleted - each update said (the Pi logs and keeps the ones it replaces); bounded.
            # A push that timed out: the Pi's volume hung, most likely - every push after it to the same volume would
            # hang too (and leave its git-receive-pack stuck on the Pi): none tried, each named
            timeout --kill-after=30 600 git -C "$d" push --force --porcelain --receive-pack=git-receive-pack "$pi:$pidir/$r.git" 'refs/*:refs/*' \
              2>&1 | logger -t git-mirror
            pushed=${PIPESTATUS[0]}
            if [ "$pushed" = 124 ] || [ "$pushed" = 137 ]; then hung="$r's push timed out"; failed+=" $r(push timed out)"; continue; fi
            [ "$pushed" = 0 ] || { failed+=" $r(push)"; continue; }
            mirrored+=" $r"
          done 3<<< "$repos"
          if [ -n "$failed" ]; then
            say "FAILED:$failed"
            exit 1
          fi
          ssh "${ssh_opts[@]}" "$pi" last-success "$(date -u +%Y%m%dT%H%M%SZ)" 2>&1 | logger -t git-mirror \
            || { say "FAILED: its last-success not written on the Pi"; exit 1; }
          # the good run for Prometheus (node_exporter's textfile collector): one write of the whole file - a failed run
          # leaves the last good one's time, and OffsiteGitMirrorMissing fires when it grows old
          count=$(wc -w <<< "$mirrored")
          printf '%s\n' \
            "# HELP offsite_git_mirror_last_success_timestamp_seconds The offsite git mirror's last good run (offsite-backup-sync.sh)." \
            "# TYPE offsite_git_mirror_last_success_timestamp_seconds gauge" \
            "offsite_git_mirror_last_success_timestamp_seconds $(date +%s)" \
            "# HELP offsite_git_mirror_repositories The repositories its last good run mirrored." \
            "# TYPE offsite_git_mirror_repositories gauge" \
            "offsite_git_mirror_repositories $count" > {{ _git_mirror_prom }} \
            || { say "FAILED: its result not written for Prometheus ({{ _git_mirror_prom }})"; exit 1; }
          say "mirrored:$mirrored"
      when: git_mirror_enabled | default(true) | bool

    - name: Create offsite backup systemd timer (4 AM daily)
      ansible.builtin.copy:
        dest: /etc/systemd/system/offsite-backup.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Daily offsite backup sync

          [Timer]
          OnCalendar=*-*-* 04:00:00
          Persistent=true
          RandomizedDelaySec=300

          [Install]
          WantedBy=timers.target
      when: offsite_backup_enabled | default(true) | bool

    - name: Enable and start offsite backup timer
      ansible.builtin.systemd:
        name: offsite-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when: offsite_backup_enabled | default(true) | bool

    # proven now, not at 4 AM: the sync run once (a run going waited out - it runs the script this play replaced); a
    # failure fails the play, its result for Prometheus then this run's
    - name: The mirror run now
      ansible.builtin.include_tasks: tasks/offsite-mirror-run.yml
      when:
        - git_mirror_enabled | default(true) | bool
        - offsite_backup_enabled | default(true) | bool
        - not ansible_check_mode

    - name: Its result for Prometheus
      ansible.builtin.slurp:
        src: "{{ _git_mirror_prom }}"
      register: _git_mirror_result
      when:
        - git_mirror_enabled | default(true) | bool
        - offsite_backup_enabled | default(true) | bool
        - not ansible_check_mode

    - name: Its result is this run's, every repository of the organisation counted
      vars:
        _lines: "{{ (_git_mirror_result.content | b64decode).splitlines() | reject('match', '^#') | list }}"
        _ts: "{{ _lines | select('match', '^offsite_git_mirror_last_success_timestamp_seconds ') | map('split') | map('last') | first | default('0') }}"
        _count: "{{ _lines | select('match', '^offsite_git_mirror_repositories ') | map('split') | map('last') | first | default('-1') }}"
      ansible.builtin.assert:
        that:
          - _ts | int >= _mirror_started.stdout.split() | first | int
          - _count | int == _git_mirror_reach_read.stdout.split() | last | int
        fail_msg: >-
          the sync's result: last success {{ _ts }} (it started {{ (_mirror_started.stdout | default('?')).split() | last }}),
          {{ _count }} repositories of the {{ (_git_mirror_reach_read.stdout | default('?')).split() | last }} it reads
        quiet: true
      when:
        - git_mirror_enabled | default(true) | bool
        - offsite_backup_enabled | default(true) | bool
        - not ansible_check_mode

    - name: The mirror
      ansible.builtin.debug:
        msg: >-
          Every repository of {{ git_mirror_org }} mirrored in {{ git_mirror_dir }}, pushed daily at 4 AM
          (offsite-backup.timer) to {{ _git_mirror_pi }}:{{ git_mirror_pi_dir }}{{ _kept_said }}
      vars:
        _kept_said: >-
          {{ ' - kept aside: ' ~ (_git_mirror_kept.stdout_lines | join('; ')) if (_git_mirror_kept.stdout_lines | default([])) else '' }}
