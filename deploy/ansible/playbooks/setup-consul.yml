---
# Install Consul cluster (3 nodes: pi1, pi2, ten)
#
# Provides distributed consensus for Patroni Postgres failover.
# All 3 nodes are servers — any 2 form quorum.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-consul.yml

- name: Install Consul
  hosts: pi1,pi2,target
  become: true
  gather_facts: true

  vars:
    consul_version: "1.20.6"
    consul_datacenter: "schnappy"
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    ten_ip: "{{ hostvars['target']['ansible_host'] | default('192.168.11.2') }}"
    node_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"

  tasks:
    - name: Determine architecture
      ansible.builtin.set_fact:
        consul_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Download Consul
      ansible.builtin.unarchive:
        src: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_{{ consul_arch }}.zip"
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/consul

    - name: Create Consul user
      ansible.builtin.user:
        name: consul
        system: true
        shell: /bin/false
        home: /var/lib/consul
        create_home: true

    - name: Create Consul directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: consul
        group: consul
        mode: '0755'
      loop:
        - /etc/consul.d
        - /var/lib/consul/data

    # The gossip key the servers already share, kept: a new one each run changed every config, and the restart that
    # followed took all three servers down at once (Vault and Patroni with their quorum). Generated only where none
    # has one - a first install; two different keys refuse.
    - name: The gossip key this server has
      ansible.builtin.shell: |
        set -o pipefail
        sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl 2>/dev/null || true
      args:
        executable: /bin/bash
      register: _consul_key_here
      changed_when: false

    - name: One key among the servers that have one
      ansible.builtin.assert:
        that: ansible_play_hosts | map('extract', hostvars, ['_consul_key_here', 'stdout']) | select | unique | list | length <= 1
        fail_msg: "REFUSED: the Consul servers have different gossip keys - fix that by hand first"
        quiet: true
      run_once: true

    - name: A key generated - only on a first install, where no server has one
      ansible.builtin.command: consul keygen
      register: consul_key_gen
      when:
        - inventory_hostname == 'pi1'
        - ansible_play_hosts | map('extract', hostvars, ['_consul_key_here', 'stdout']) | select | list | length == 0
      changed_when: true

    - name: Set encryption key fact
      ansible.builtin.set_fact:
        consul_encrypt_key: >-
          {{ (ansible_play_hosts | map('extract', hostvars, ['_consul_key_here', 'stdout']) | select | list
              + [hostvars['pi1']['consul_key_gen']['stdout'] | default('')]) | first }}

    - name: Consul running here before this run (a restart then waits for the others)
      ansible.builtin.systemd_service:
        name: consul
      register: _consul_before

    - name: Allow Consul ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.name }}"
      loop:
        - { port: "8300", proto: "tcp", name: "Consul RPC" }
        - { port: "8301", proto: "tcp", name: "Consul Serf LAN" }
        - { port: "8301", proto: "udp", name: "Consul Serf LAN UDP" }
        - { port: "8302", proto: "tcp", name: "Consul Serf WAN" }
        - { port: "8302", proto: "udp", name: "Consul Serf WAN UDP" }
        - { port: "8500", proto: "tcp", name: "Consul HTTP" }
      failed_when: false  # ten may not have UFW

    - name: Write Consul config
      ansible.builtin.copy:
        dest: /etc/consul.d/consul.hcl
        owner: consul
        group: consul
        mode: '0640'
        content: |
          datacenter = "{{ consul_datacenter }}"
          data_dir = "/var/lib/consul/data"
          node_name = "{{ inventory_hostname }}"

          server = true
          bootstrap_expect = 3

          bind_addr = "{{ node_ip }}"
          client_addr = "0.0.0.0"

          retry_join = ["{{ pi1_ip }}", "{{ pi2_ip }}", "{{ ten_ip }}"]

          encrypt = "{{ consul_encrypt_key }}"

          ui_config {
            enabled = false
          }

          performance {
            raft_multiplier = 1
          }

          connect {
            enabled = false
          }
      register: _consul_config

    - name: Install Consul systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/consul.service
        mode: '0644'
        content: |
          [Unit]
          Description=Consul Agent
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=exec
          User=consul
          Group=consul
          ExecStart=/usr/local/bin/consul agent -config-dir=/etc/consul.d/
          ExecReload=/bin/kill --signal HUP $MAINPID
          KillMode=process
          KillSignal=SIGTERM
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536
          TimeoutStartSec=120
          [Install]
          WantedBy=multi-user.target
      register: _consul_unit

    - name: Enable and start Consul
      ansible.builtin.systemd_service:
        name: consul
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Consul to be ready
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 30); do
          consul members 2>/dev/null | grep -q alive && exit 0
          sleep 2
        done
        exit 1
      changed_when: false
      retries: 3
      delay: 5

# ─── Changed servers restarted one at a time ─────────────────────────────────
# each back in the cluster, with a leader and all three voters, before the next: two down at once is a lost quorum
- name: Restart the Consul servers whose config or unit changed, one at a time
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Restarted
      ansible.builtin.systemd_service:
        name: consul
        state: restarted
        daemon_reload: true
      when:
        - _consul_config.changed or _consul_unit.changed
        - _consul_before.status.ActiveState | default('') == 'active'

    - name: Back, with a leader and three voters
      ansible.builtin.shell: |
        set -o pipefail
        consul operator raft list-peers | awk 'NR > 1 && $5 == "true" {v++} NR > 1 && $4 == "leader" {l++} END {print v + 0, l + 0}'
      args:
        executable: /bin/bash
      register: _consul_peers
      retries: 30
      delay: 5
      until: _consul_peers.rc == 0 and _consul_peers.stdout == '3 1'
      changed_when: false
      when:
        - _consul_config.changed or _consul_unit.changed
        - _consul_before.status.ActiveState | default('') == 'active'

# ─── Verify cluster ──────────────────────────────────────────────────────────
- name: Verify Consul cluster
  hosts: pi1
  become: true
  gather_facts: false

  tasks:
    - name: Wait for all members
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 30); do
          COUNT=$(consul members 2>/dev/null | grep -c alive)
          [ "$COUNT" -ge 3 ] && echo "3 members alive" && exit 0
          echo "waiting... ($COUNT/3)"
          sleep 5
        done
        consul members
        exit 1
      register: consul_members
      changed_when: false

    - name: Show cluster status
      ansible.builtin.shell: |
        consul members
      register: consul_status
      changed_when: false

    - name: Print results
      ansible.builtin.debug:
        msg: |
          ============================================
          Consul Cluster — Ready
          ============================================
          {{ consul_status.stdout }}
          ============================================
