---
# Install Consul cluster (3 nodes: pi1, pi2, ten)
#
# Provides distributed consensus for Patroni Postgres failover.
# All 3 nodes are servers — any 2 form quorum.
#
# Usage: task deploy:consul   (production; Vagrant: task test:dual-pi)

- name: Install Consul
  hosts: pi1,pi2,target
  become: true
  gather_facts: true

  vars:
    consul_version: "1.20.6"
    consul_datacenter: "schnappy"
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    ten_ip: "{{ hostvars['target']['ansible_host'] | default('192.168.11.2') }}"
    node_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"
    # the three servers (bootstrap_expect 3), whatever hosts a run is limited to
    consul_servers: [pi1, pi2, target]

  tasks:
    - name: Determine architecture
      ansible.builtin.set_fact:
        consul_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: Download Consul
      ansible.builtin.unarchive:
        src: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_{{ consul_arch }}.zip"
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/consul

    - name: Create Consul user
      ansible.builtin.user:
        name: consul
        system: true
        shell: /bin/false
        home: /var/lib/consul
        create_home: true

    - name: Create Consul directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: consul
        group: consul
        mode: '0755'
      loop:
        - /etc/consul.d
        - /var/lib/consul/data

    # The gossip key, kept - the one the running servers use: their keyring's primary key (Consul reads `encrypt` only
    # on its first start; its keyring in the data directory wins after, so a config key it never loaded is a dead key,
    # and a server rebuilt from an empty data directory with it could not join). Where none runs (a first install),
    # the key the configs share; generated only where neither exists. A new key each run changed every config, and the
    # restart that followed took all three servers down at once. Running servers on different keys - or, none
    # running, configs with different keys - refuse.
    # read on every server, whatever the run's --limit: a server rebuilt alone (--limit pi2) found no key among the
    # play's hosts and wrote `encrypt = ""` - gossip unencrypted, never joining - and still passed
    - name: The key each server's running Consul uses, and the one its config has
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          live=
          if ring=$(curl -sf --max-time 5 http://127.0.0.1:8500/v1/operator/keyring); then
            live=$(python3 -c '
          import json, sys
          lan = [p for p in json.load(sys.stdin) if not p["WAN"]]
          print(" ".join(sorted({k for p in lan for k in p["PrimaryKeys"]})))' <<< "$ring")
          fi
          echo "live=$live"
          echo "conf=$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl 2>/dev/null || true)"
      register: _consul_keys_all
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false
      delegate_to: "{{ item }}"
      loop: "{{ consul_servers }}"
      run_once: true
      ignore_unreachable: true
      no_log: true  # the gossip key

    - name: Their keys (the servers that answered)
      ansible.builtin.set_fact:
        _consul_live_keys: "{{ _answered | map('regex_search', '(?m)^live=(.*)$', '\\1') | map('first') | select | list }}"
        _consul_conf_keys: "{{ _answered | map('regex_search', '(?m)^conf=(.*)$', '\\1') | map('first') | select | list }}"
      vars:
        _answered: "{{ _consul_keys_all.results | rejectattr('unreachable', 'defined') | map(attribute='stdout') | list }}"
      run_once: true
      no_log: true

    - name: One key among the running servers (or, none running, among the configs)
      ansible.builtin.assert:
        that:
          - _consul_live_keys | select('search', ' ') | list | length == 0
          - _consul_live_keys | unique | list | length <= 1
          - _consul_live_keys | length > 0 or _consul_conf_keys | unique | list | length <= 1
        fail_msg: >-
          REFUSED: the Consul servers have different gossip keys (running: {{ _consul_live_keys | length }} servers on
          {{ _consul_live_keys | unique | list | length }} keys; configs: {{ _consul_conf_keys | unique | list | length }}
          keys) - fix that by hand first
        quiet: true
      run_once: true

    - name: A key generated - only on a first install with every server in the run, none running or having one
      ansible.builtin.command: consul keygen
      register: consul_key_gen
      no_log: true
      check_mode: false  # it prints a random key, nothing more: skipped, a first install's preview had no key to write
      when:
        - inventory_hostname == 'pi1'
        - consul_servers | difference(ansible_play_hosts) | length == 0
        - _consul_live_keys | length == 0
        - _consul_conf_keys | length == 0
      changed_when: true

    - name: Set encryption key fact
      ansible.builtin.set_fact:
        consul_encrypt_key: >-
          {{ (_consul_live_keys + _consul_conf_keys + [hostvars['pi1']['consul_key_gen']['stdout'] | default('')])
             | select | first | default('') }}
      no_log: true

    - name: A key to write (none found and none generated - a server alone in the run, the others unreachable)
      ansible.builtin.assert:
        that: consul_encrypt_key | length > 0
        fail_msg: >-
          REFUSED: no gossip key - no server runs or has one, and a new one is made only with every server in the run
          ({{ consul_servers | join(', ') }})
        quiet: true

    - name: Consul running here before this run (a restart then waits for the others)
      ansible.builtin.systemd_service:
        name: consul
      register: _consul_before

    - name: UFW on this node (ten has none)
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: _ufw

    # the rules below are a Pi's: one without UFW skipped them, RPC and Serf left open to the LAN
    - name: UFW on every Pi
      ansible.builtin.assert:
        that: inventory_hostname not in groups['pis'] or _ufw.stat.exists
        fail_msg: "REFUSED: no UFW on {{ inventory_hostname }} - Consul's RPC and Serf would stay open to the LAN"
        quiet: true

    # RPC and Serf LAN from the three servers only: the RPC port serves what the HTTP API does - the keyring, KV,
    # sessions (the backups' lock), snapshots of Vault's storage - and no ACLs guard it. The narrow rules first, then
    # the open ones removed: Serf never loses its peers in between
    - name: Consul's RPC and Serf LAN open to the servers only
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.0 }}"
        to_port: "{{ item.1.port }}"
        proto: "{{ item.1.proto }}"
        comment: "Consul {{ item.1.name }} from {{ item.0 }}"
      loop: "{{ [pi1_ip, pi2_ip, ten_ip] | product(_ports) | list }}"
      vars:
        _ports:
          - { port: "8300", proto: "tcp", name: "RPC" }
          - { port: "8301", proto: "tcp", name: "Serf LAN" }
          - { port: "8301", proto: "udp", name: "Serf LAN UDP" }
      when: inventory_hostname in groups['pis']

    # the rules that opened RPC and Serf to the whole LAN, the WAN ports (one datacenter - nothing joins over WAN) and
    # the HTTP API (on the node itself only, client_addr below: Vault, Patroni, HAProxy's resolver and the backups'
    # lock all call their own agent)
    - name: Consul's ports no more open to the LAN
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        delete: true
      loop:
        - { port: "8300", proto: "tcp" }
        - { port: "8301", proto: "tcp" }
        - { port: "8301", proto: "udp" }
        - { port: "8302", proto: "tcp" }
        - { port: "8302", proto: "udp" }
        - { port: "8500", proto: "tcp" }
      when: inventory_hostname in groups['pis']

    - name: Write Consul config
      ansible.builtin.copy:
        dest: /etc/consul.d/consul.hcl
        owner: consul
        group: consul
        mode: '0640'
        content: |
          datacenter = "{{ consul_datacenter }}"
          data_dir = "/var/lib/consul/data"
          node_name = "{{ inventory_hostname }}"

          server = true
          bootstrap_expect = 3

          bind_addr = "{{ node_ip }}"
          # its HTTP API and DNS for this node only - every caller is local (Vault, Patroni, HAProxy, the backups'
          # lock); open to the LAN, anyone there read the gossip keyring, wrote KV and took the backups' lock
          client_addr = "127.0.0.1"
          # one datacenter: no WAN serf (its port is closed above - left on, every server logged its WAN peers failed)
          ports {
            serf_wan = -1
          }

          retry_join = ["{{ pi1_ip }}", "{{ pi2_ip }}", "{{ ten_ip }}"]

          encrypt = "{{ consul_encrypt_key }}"

          ui_config {
            enabled = false
          }

          performance {
            raft_multiplier = 1
          }

          connect {
            enabled = false
          }
      diff: false  # it carries the gossip key - a --check --diff preview would print it
      register: _consul_config

    - name: Install Consul systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/consul.service
        mode: '0644'
        content: |
          [Unit]
          Description=Consul Agent
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=exec
          User=consul
          Group=consul
          ExecStart=/usr/local/bin/consul agent -config-dir=/etc/consul.d/
          ExecReload=/bin/kill --signal HUP $MAINPID
          KillMode=process
          KillSignal=SIGTERM
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536
          TimeoutStartSec=120
          [Install]
          WantedBy=multi-user.target
      register: _consul_unit

    - name: Enable and start Consul
      ansible.builtin.systemd_service:
        name: consul
        enabled: true
        state: started
        daemon_reload: true
      register: _consul_start

    - name: Wait for Consul to be ready
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 30); do
          consul members 2>/dev/null | grep -q alive && exit 0
          sleep 2
        done
        exit 1
      changed_when: false
      retries: 3
      delay: 5

    # pending, not just changed by this run: a run that failed after writing them and before the restart left the new
    # config on disk and the old one running - the next run changed nothing and restarted nothing
    - name: A restart pending here - the config or unit other than the running agent loaded
      ansible.builtin.include_tasks: tasks/restart-pending.yml
      vars:
        loaded_service: consul
        loaded_files: [/etc/consul.d/consul.hcl, /etc/systemd/system/consul.service]
        # its status as the start found it: not running, it started on these files just now
        loaded_started_now: "{{ _consul_start.status.ActiveState | default('active') not in ['active', 'activating'] }}"

    - name: Kept for the restart play
      ansible.builtin.set_fact:
        _consul_pending: "{{ _restart_pending }}"

# ─── Changed servers restarted one at a time ─────────────────────────────────
# Each back and caught up - autopilot: every server healthy (in contact, its log caught up), one loss tolerated -
# before the next: two down at once is a lost quorum. Patroni is paused around each restart (from a Pi not being
# restarted): its leader talks to its own Pi's Consul agent and, unpaused, demotes Postgres when that agent is gone
# longer than its retry_timeout (10 s).
- name: Restart the Consul servers whose config or unit changed, one at a time
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  serial: 1
  vars:
    patronictl: patronictl -c /etc/patroni/patroni.yml
    _other_pi: "{{ 'pi2' if inventory_hostname == 'pi1' else 'pi1' }}"
  tasks:
    - name: A restart here, and Patroni running to pause around it
      when:
        - _consul_pending.stdout_lines[0] == 'pending'
        - _consul_before.status.ActiveState | default('') == 'active'
      block:
        # the others must carry the quorum while this one is away: with one already down, this restart loses it -
        # and with it Vault's storage and Patroni's DCS
        - name: Before - every server healthy, one loss tolerated
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              curl -sf --max-time 5 http://127.0.0.1:8500/v1/operator/autopilot/health | python3 -c '
              import json, sys
              h = json.load(sys.stdin)
              s = h["Servers"]
              ok = h["Healthy"] and h["FailureTolerance"] >= 1 and len(s) == 3 and all(x["Healthy"] and x["Voter"] for x in s)
              print(("QUORUM HOLDS " if ok else "REFUSED: no restart without a server to spare - ") + ", ".join(
                  "%s %s" % (x["Name"], "healthy" if x["Healthy"] else "unhealthy") for x in s))
              sys.exit(0 if ok else 1)'
          register: _consul_spare
          retries: 6
          delay: 5
          until: _consul_spare.rc == 0
          changed_when: false

        # by whether Patroni is installed on the other Pi, not whether it runs there: with that one stopped, the
        # leader on this Pi still demotes when its own agent is gone (patronictl reaches the cluster through Consul)
        - name: Patroni on the other Pi (a first install has none yet)
          ansible.builtin.systemd:
            name: patroni
          register: _patroni_unit
          delegate_to: "{{ _other_pi }}"

        - name: Whether to pause it
          ansible.builtin.set_fact:
            _patroni_active: "{{ _patroni_unit.status.LoadState | default('') == 'loaded' }}"

        # someone's maintenance (or another run) has it paused: this run's resume would end it - refused
        - name: Patroni not paused already
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              out=$({{ patronictl }} list)
              if grep 'Maintenance mode' <<< "$out" > /dev/null; then
                by=$(consul kv get ansible/patroni-paused-by 2> /dev/null || true)
                # named only in the shape a run writes it (Consul has no ACLs: anything else is not echoed)
                if [[ $by =~ ^(setup-consul|setup-patroni|upgrade-patroni)\ [0-9TZ:-]+$ ]]; then
                  by=" - paused by $by: if that run is no longer running (a Ctrl-C skips its resume), check patronictl"
                  by+=" list, then patronictl resume and consul kv delete ansible/patroni-paused-by"
                elif [ -n "$by" ]; then
                  by=" - a pause marker of another shape is there (consul kv get ansible/patroni-paused-by)"
                fi
                echo "REFUSED: Patroni is paused - finish that first (patronictl resume)$by"
                exit 1
              fi
          changed_when: false
          delegate_to: "{{ _other_pi }}"
          when: _patroni_active | bool

        - name: Restarted, Patroni paused meanwhile
          block:
            - name: Patroni paused - no demotion while this server's agent is away
              # a marker first, naming this run: a Ctrl-C skips the always: below and leaves the cluster paused - the
              # next run's not-paused check names it
              ansible.builtin.shell:
                executable: /bin/bash
                cmd: |
                  set -uo pipefail
                  key=ansible/patroni-paused-by
                  # check-and-set: put only where none is - another run holding the cluster paused, or one cut short,
                  # refuses this one before any pause; its ModifyIndex kept, for this run to delete its own marker only
                  if ! consul kv put -cas -modify-index=0 "$key" "setup-consul $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /dev/null; then
                    echo "REFUSED: a Patroni pause marker is there already (consul kv get $key) - another run pausing, or one" \
                      "cut short: patronictl list; if no run is running, patronictl resume and consul kv delete $key"
                    exit 1
                  fi
                  idx=$(consul kv get -detailed "$key" | sed -n 's/^ModifyIndex[[:space:]]*//p')
                  if ! {{ patronictl }} pause --wait; then
                    consul kv delete -cas -modify-index="$idx" "$key" > /dev/null || true
                    exit 1
                  fi
                  echo "MARKER $idx"
              register: _patroni_paused
              changed_when: true
              delegate_to: "{{ _other_pi }}"
              when: _patroni_active | bool

            - name: Restarted
              ansible.builtin.systemd_service:
                name: consul
                state: restarted
                daemon_reload: true

            - name: Back and caught up - every server healthy, one loss tolerated
              ansible.builtin.shell:
                executable: /bin/bash
                cmd: |
                  set -euo pipefail
                  curl -sf --max-time 5 http://127.0.0.1:8500/v1/operator/autopilot/health | python3 -c '
                  import json, sys
                  h = json.load(sys.stdin)
                  s = h["Servers"]
                  ok = h["Healthy"] and h["FailureTolerance"] >= 1 and len(s) == 3 and all(x["Healthy"] and x["Voter"] for x in s)
                  print(("CAUGHT UP " if ok else "NOT YET ") + ", ".join("%s %s" % (x["Name"], "healthy" if x["Healthy"] else "unhealthy") for x in s))
                  sys.exit(0 if ok else 1)'
              register: _consul_health
              retries: 30
              delay: 5
              until: _consul_health.rc == 0
              changed_when: false
          always:
            # only what this run paused
            - name: Patroni resumed
              ansible.builtin.shell:
                executable: /bin/bash
                cmd: |
                  set -euo pipefail
                  {{ patronictl }} resume --wait
                  idx=$(sed -n 's/^MARKER //p' <<< "$PAUSED_OUT")
                  consul kv delete -cas -modify-index="$idx" ansible/patroni-paused-by > /dev/null 2>&1 \
                    || echo "the pause marker is not the one this run put - left as it is"
              changed_when: true
              environment:
                PAUSED_OUT: "{{ _patroni_paused.stdout | default('') }}"
              delegate_to: "{{ _other_pi }}"
              when:  # a preview (--check) paused nothing
                - _patroni_paused is defined and _patroni_paused is succeeded and _patroni_paused is not skipped
                - not ansible_check_mode

    # what the next run compares with: the agent restarted and caught up, or found running its config already
    - name: Consul's config as it runs it, recorded
      ansible.builtin.include_tasks: tasks/restart-recorded.yml
      vars:
        loaded_service: consul
        loaded_hash: "{{ _consul_pending.stdout_lines[1] }}"
      when: >-
        _consul_pending.stdout_lines[0] == 'current'
        or (_consul_health is defined and _consul_health is not skipped and _consul_health is succeeded)

# ─── Verify cluster ──────────────────────────────────────────────────────────
- name: Verify Consul cluster
  hosts: pi1
  become: true
  gather_facts: false

  tasks:
    - name: Wait for all members
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 30); do
          COUNT=$(consul members 2>/dev/null | grep -c alive)
          [ "$COUNT" -ge 3 ] && echo "3 members alive" && exit 0
          echo "waiting... ($COUNT/3)"
          sleep 5
        done
        consul members
        exit 1
      register: consul_members
      changed_when: false

    - name: Show cluster status
      ansible.builtin.shell: |
        consul members
      register: consul_status
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    - name: Print results
      ansible.builtin.debug:
        msg: |
          ============================================
          Consul Cluster — Ready
          ============================================
          {{ consul_status.stdout }}
          ============================================
