---
# Restore ScyllaDB tables from Scylla Manager's backup - production, by hand: the keyspaces given, from the snapshot given,
# into the cluster as it stands (tasks/scylla-restore.yml - its rehearsal on the copy: tests/ansible/copy/
# scylla-restore-check.yml). A table's rows are added back, nothing dropped: truncate first what must hold the backup's
# alone. The way back from a ScyllaDB release line (a version cannot be downgraded) is playbooks/scylla-way-back.yml
# (task deploy:scylla:way-back - the cluster rebuilt, then these tasks restore it; rehearsed: test:copy:scylla-way-back).
#
# Usage: task deploy:scylla:restore -- -e snapshot=sm_<UTC> -e keyspaces=chat [-e cluster=<name>] [-e location=s3:<bucket>]
#        (--check: the snapshot found and the restore's dry run, nothing started)
- name: Restore ScyllaDB tables from Scylla Manager's backup
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    manager: "kubectl --kubeconfig {{ kubeconfig }} -n scylla-manager exec deploy/scylla-manager -c scylla-manager --"
    restore_cluster: "{{ cluster | default('schnappy-production/schnappy-production-scylla') }}"
    restore_location: "{{ location | default('s3:scylla-backups') }}"
    restore_snapshot: "{{ snapshot }}"
    restore_keyspaces: "{{ keyspaces }}"
  tasks:
    - name: A snapshot and its keyspaces named (never all of a cluster by default)
      ansible.builtin.assert:
        that:
          - snapshot is defined and snapshot is match('^sm_[0-9]{14}UTC$')
          - keyspaces is defined and keyspaces | length > 0 and not keyspaces is match('^system')
        fail_msg: "-e snapshot=sm_<14 digits>UTC -e keyspaces=<keyspace[,...]> (no system keyspace)"
        quiet: true

    - name: The restore
      ansible.builtin.import_tasks: tasks/scylla-restore.yml

    - name: Restored
      ansible.builtin.debug:
        msg: >-
          {{ 'PREVIEW: would restore' if ansible_check_mode else 'RESTORED' }} {{ restore_keyspaces }} on
          {{ restore_cluster }} from {{ restore_snapshot }} ({{ restore_location }}){{ '' if ansible_check_mode else ' - ' ~ restore_task }}
