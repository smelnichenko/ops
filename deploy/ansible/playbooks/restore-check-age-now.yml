---
# The restore check's age check run now: a Job from production's restore-check-age CronJob (infra's
# cluster-config/restore-check-age.yaml, kube-system - the Pis' last restore checks no older than the limit), waited for
# until it completes, its verdict said. After a change to the image it runs in (rclone: a unit moving it), its first run
# on the new image is the change's, judged at once - the CronJob runs every third hour, so the upgrade cycle's hour of
# holding saw a run a third of the time. The Job removed once it completed (a failed
# one stays for its logs - KubeJobFailed then says so). A preview changes nothing.
#
# Usage: task check:production:restore-check-age   (production; the copy leaves the Pis' restore checks out)
- name: The restore check's age check run now
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    kubectl: "kubectl --kubeconfig {{ kubeconfig }} -n kube-system"
    # past the Job's own deadline (activeDeadlineSeconds 300)
    age_wait_s: 330
  tasks:
    - name: A Job from the restore-check-age CronJob, waited for until it succeeds or fails (no retry - backoffLimit 0)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          j=restore-check-age-now-$(date -u +%Y%m%d%H%M%S)
          {{ kubectl }} create job --from=cronjob/restore-check-age "$j" > /dev/null
          # succeeded or failed, whichever comes first - by the clock since boot (each kubectl can hang): a failed Job
          # said at once, never waited out
          end=$(( $(cut -d. -f1 /proc/uptime) + {{ age_wait_s }} ))
          s=""
          while :; do
            s=$({{ kubectl }} get "job/$j" -o jsonpath='{.status.succeeded}/{.status.failed}' 2> /dev/null || true)  # a read failing: read again
            case "$s" in 1/* | */[1-9]*) break ;; esac
            [ "$(cut -d. -f1 /proc/uptime)" -lt "$end" ] || break
            sleep 5
          done
          case "$s" in
            1/*) ;;
            */[1-9]*) {{ kubectl }} logs "job/$j" --tail=40 || true; echo "the restore check's age check $j failed"; exit 1 ;;
            *) {{ kubectl }} logs "job/$j" --tail=40 || true; echo "the restore check's age check $j not done in {{ age_wait_s }} s"; exit 1 ;;
          esac
          {{ kubectl }} logs "job/$j" | tail -3
          {{ kubectl }} delete job "$j" --wait=false > /dev/null || echo "the Job $j left (its delete failed) - its TTL removes it"
      register: _age
      changed_when: true
      when: not ansible_check_mode

    - name: Its verdict
      ansible.builtin.debug:
        msg: "RESTORE CHECK AGE OK: {{ (_age.stdout_lines | default(['(a preview - none run)'])) | join(' | ') }}"
