---
# Seed Vault secrets — generatable creds auto-provision on first run.
#
# Two classes of secret:
#
#   GENERATABLE (per-env, no human input): postgres user passwords,
#     valkey, clickhouse, centrifugo, the Woodpecker agent secret. Pattern:
#     read existing from Vault; if absent, generate a 32-char password and
#     write it create-only (cas=0). Subsequent runs reuse what's there. The
#     .env file does NOT carry these values. To ROTATE one, purge the path's
#     metadata (`vault kv metadata delete secret/<prefix>/<path>`) and
#     re-run: a plain `vault kv delete` leaves a soft-deleted version behind,
#     which reads as "missing" but refuses the create-only write.
#
#   ENV-SOURCED (external API keys + credentials provisioned elsewhere):
#     mail, ai, porkbun, keycloak/forgejo client secrets, etc. Pattern:
#     direct lookup('env', '...') and write — `.env` is the source of
#     truth for these.
#
# Talks directly to Pi Vault via HTTPS (loopback on pi1).
#
# Usage:
#   task deploy:seed-secrets                                         # seeds secret/{{ vault_prefix }}/*
#   task deploy:seed-secrets -- -e vault_prefix=schnappy-test        # seeds secret/schnappy-test/*

- name: Seed Vault secrets
  hosts: pi1
  become: true
  gather_facts: false

  vars:
    vault_prefix: schnappy
    vault_addr: "https://127.0.0.1:8200"
    # masi's own Anthropic key — optional; read ONCE here so the write, the
    # notice and the summary cannot disagree on the variable name.
    masi_api_key: "{{ lookup('env', 'MASI_ANTHROPIC_API_KEY') | trim }}"

    # Generatable per-env secrets. Each entry:
    #   path:    KV path under {{ vault_prefix }}/
    #   static:  fields written verbatim every run (e.g. database name)
    #   secrets: list of field names to generate as 32-char passwords
    #            on first run; reused from existing Vault data thereafter
    generatable_secrets:
      - path: postgres
        static: { database: monitor, username: monitor }
        secrets: [password]
      - path: postgres-monitor
        static: { database: monitor, username: monitor }
        secrets: [password]
      - path: postgres-admin
        static: { database: admin, username: admin }
        secrets: [password]
      - path: postgres-chat
        static: { database: chat, username: chat }
        secrets: [password]
      - path: postgres-chess
        static: { database: chess, username: chess }
        secrets: [password]
      - path: postgres-masi
        static: { database: masi, username: masi }
        secrets: [password]
      - path: valkey
        static: {}
        secrets: [password]
      - path: clickhouse
        static: {}
        secrets: [password]
      - path: centrifugo
        static: {}
        secrets: [admin_password, admin_secret, api_key, sub_token_secret]
      # Shared by the Woodpecker server and agents: generated once, reused forever.
      # It used to be re-generated on EVERY run (no .env value, lookup fallback),
      # so a seed followed by any restart split server and agents (Unauthenticated).
      - path: woodpecker
        static: {}
        secrets: [agent-secret]

  tasks:
    - name: Ensure python3-hvac is installed (required by community.hashi_vault.*)
      ansible.builtin.apt:
        name: python3-hvac
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Read Vault root token
      ansible.builtin.slurp:
        src: /etc/vault-unseal/root-token
      register: vault_token_raw

    - name: Set token fact
      ansible.builtin.set_fact:
        vault_token_value: "{{ vault_token_raw.content | b64decode | trim }}"
      no_log: true

    # ── Generatable secrets: read-existing, generate-missing ───────────
    - name: Existing generatable secrets, read with tolerance for a missing path only
      block:
        - name: Read existing generatable secrets (404 OK on first run)
          community.hashi_vault.vault_kv2_get:
            url: "{{ vault_addr }}"
            token: "{{ vault_token_value }}"
            validate_certs: false
            path: "{{ vault_prefix }}/{{ item.path }}"
          register: _existing_secrets
          loop: "{{ generatable_secrets }}"
          loop_control:
            label: "{{ item.path }}"
          # Tolerate ONLY a missing path (first run). Any other read failure —
          # sealed Vault, 503, forbidden — must abort, because the resolve step
          # below treats "no existing value" as "generate a fresh password": a
          # swallowed outage would silently ROTATE every database password.
          failed_when: >-
            (_existing_secrets.failed | default(false))
            and 'Invalid or missing path' not in (_existing_secrets.msg | default(''))
          no_log: true

      rescue:
        # no_log censors the loop output; failed items carry no secret data, so
        # their messages can be shown — the operator must know WHY the seed stopped.
        - name: Abort, an existing-secret read failed for a reason other than a missing path
          ansible.builtin.fail:
            msg: >-
              Refusing to seed: reading existing secrets failed and generating fresh
              passwords in that state would rotate live credentials.
              {{ _existing_secrets.results | selectattr('failed', 'defined')
                 | selectattr('failed') | map(attribute='msg', default='(no message)') | list }}

    - name: Index existing generatable secrets by path
      ansible.builtin.set_fact:
        existing_by_path: >-
          {{ dict(generatable_secrets | map(attribute='path')
                  | zip(_existing_secrets.results | map(attribute='secret', default={}))) }}
      no_log: true

    # One lookup('password') PER FIELD: a single lookup per set_fact call handed the
    # same generated value to every missing field of an entry (centrifugo's four
    # secrets came out identical). Existing values are reused field by field.
    - name: Resolve generatable secret values (existing or fresh, one lookup per field)
      ansible.builtin.set_fact:
        resolved_secrets: >-
          {{
            (resolved_secrets | default({}))
            | combine({
                item.0.path: ((resolved_secrets | default({}))[item.0.path] | default(item.0.static))
                  | combine({
                      item.1: (existing_by_path[item.0.path] | default({}))[item.1]
                              | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true)
                    })
              })
          }}
      loop: "{{ generatable_secrets | subelements('secrets') }}"
      loop_control:
        label: "{{ item.0.path }}/{{ item.1 }}"
      no_log: true

    # A freshly generated entry is written with cas=0 (create-only): if two seeds
    # race on a first run, the second write fails instead of silently rotating.
    # read_before_write keeps an unchanged entry from gaining a KV version per run.
    - name: Generatable secrets, written create-only when fresh
      block:
        - name: Write generatable secrets
          community.hashi_vault.vault_kv2_write:
            url: "{{ vault_addr }}"
            token: "{{ vault_token_value }}"
            validate_certs: false
            path: "{{ vault_prefix }}/{{ item.0.path }}"
            data: "{{ resolved_secrets[item.0.path] }}"
            cas: "{{ omit if (item.1.secret is defined) else 0 }}"
            read_before_write: true
          register: _written_secrets
          loop: "{{ generatable_secrets | zip(_existing_secrets.results) | list }}"
          loop_control:
            label: "{{ item.0.path }}"
          no_log: true
      rescue:
        # no_log censors the loop; the module's failure message names only the path.
        - name: Abort, a generatable secret could not be written
          ansible.builtin.fail:
            msg: >-
              Writing generatable secrets failed (a soft-deleted path refuses the
              create-only write — purge its metadata to rotate, see the header):
              {{ _written_secrets.results | selectattr('failed', 'defined')
                 | selectattr('failed') | map(attribute='msg', default='(no message)') | list }}

    # Drop secrets for stores no longer in the stack (Redis → Valkey,
    # Elasticsearch → ClickHouse). Idempotent: 404 on already-removed.
    - name: Delete retired vault path
      community.hashi_vault.vault_kv2_delete:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/{{ item }}"
      loop:
        - redis
        - elasticsearch
        - auth          # JWT_SECRET: no consumer since Keycloak took over authentication
      failed_when: false

    # ── Env-sourced secrets validation ─────────────────────────────────
    # Three credential drift incidents in one day (Sonar, k6-smoke,
    # Grafana OAuth) all traced to the same root cause: a referenced
    # env var was missing from .env, lookup('env',...) returned '',
    # the seed silently wrote an empty string into Vault, the
    # downstream consumer failed auth at runtime hours later.
    # Fail loud at seed time instead.
    - name: Validate required env-sourced secrets are non-empty
      ansible.builtin.assert:
        that: "lookup('env', item) | length > 0"
        fail_msg: >-
          Required env var '{{ item }}' is missing or empty in .env.
          Add it before re-running task deploy:seed-secrets, otherwise
          the corresponding Vault path will be written with an empty
          value and the consumer will fail auth at runtime.
      loop:
        - MAIL_PASSWORD
        - ANTHROPIC_API_KEY
        - MINIO_ROOT_USER
        - MINIO_ROOT_PASSWORD
        - BACKUP_ACCESS_KEY
        - BACKUP_SECRET_KEY
        - GRAFANA_ADMIN_PASSWORD
        - GRAFANA_OAUTH_CLIENT_SECRET
        - KAFKA_CLUSTER_ID
        - FORGEJO_ADMIN_USER
        - FORGEJO_ADMIN_PASSWORD
        - FORGEJO_ADMIN_EMAIL
        - KEYCLOAK_ADMIN_PASSWORD
        - KEYCLOAK_DB_PASSWORD
        - KEYCLOAK_FORGEJO_CLIENT_SECRET
        - KEYCLOAK_ARGOCD_CLIENT_SECRET
        - KEYCLOAK_ADMIN_SERVICE_CLIENT_SECRET
        - KEYCLOAK_K6_SMOKE_CLIENT_SECRET
        - SONARQUBE_ADMIN_PASSWORD
        - SONARQUBE_POSTGRES_PASSWORD
        - SONARQUBE_TOKEN
        - WOODPECKER_FORGEJO_CLIENT
        - WOODPECKER_FORGEJO_SECRET
        - WOODPECKER_INFRA_REPO_TOKEN
        - NVD_API_KEY
        - PROMETHEUS_AUTH_TOKEN
        - WOODPECKER_CLONE_TOKEN
        - PORKBUN_API_KEY
        - PORKBUN_SECRET_KEY
        - FORGEJO_READONLY_TOKEN
        - KEYCLOAK_KAGENT_UI_CLIENT_SECRET
        - KAGENT_OAUTH_COOKIE_SECRET
        - KAGENT_GRAFANA_TOKEN
      run_once: true

    # ── Env-sourced secrets (external API keys, etc.) ──────────────────
    - name: Seed mail secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/mail"
        data:
          password: "{{ lookup('env', 'MAIL_PASSWORD') }}"

    - name: Seed AI secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/ai"
        data:
          api_key: "{{ lookup('env', 'ANTHROPIC_API_KEY') }}"

    # masi has its OWN Anthropic key (console spend limit, revocable without
    # touching admin's registration approval, separable in the usage report).
    # One key serves prod and test (lookup('env') reads the controller's .env
    # for both prefixes, like ANTHROPIC_API_KEY). Optional: the chart renders
    # masi's AI ExternalSecret only when masiService.ai.existingSecret is set,
    # so an absent key means AI off, not a broken sync. Skipped visibly when
    # unset rather than written empty — the empty-string drift class above.
    # Once masi's AI is enabled, move MASI_ANTHROPIC_API_KEY into the
    # required-env assert list so a misspelled name cannot hide in the skip.
    - name: Seed masi AI secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/ai-masi"
        data:
          api_key: "{{ masi_api_key }}"
      when: masi_api_key | length > 0

    - name: Report masi AI secret not seeded (MASI_ANTHROPIC_API_KEY unset)
      ansible.builtin.debug:
        msg: >-
          SKIPPED {{ vault_prefix }}/ai-masi: MASI_ANTHROPIC_API_KEY is unset.
          Nothing was written; any earlier value at that path is still served.
          To disable masi's AI, revoke the key in the Anthropic console and
          unset masiService.ai.existingSecret in the chart values.
      when: masi_api_key | length == 0

    # kagent oauth2-proxy: client_id is the Keycloak kagent-ui confidential client;
    # client_secret is that client's secret; cookie_secret is a 32-byte session key.
    - name: Seed kagent oauth2-proxy secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/kagent-oauth"
        data:
          client_id: kagent-ui
          client_secret: "{{ lookup('env', 'KEYCLOAK_KAGENT_UI_CLIENT_SECRET') }}"
          cookie_secret: "{{ lookup('env', 'KAGENT_OAUTH_COOKIE_SECRET') }}"

    # kagent grafana-mcp: a read-only Grafana Viewer service-account token.
    - name: Seed kagent grafana-mcp secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/kagent-grafana"
        data:
          token: "{{ lookup('env', 'KAGENT_GRAFANA_TOKEN') }}"

    - name: Seed webhook secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/webhook"
        data:
          signing_secret: "{{ lookup('env', 'RESEND_WEBHOOK_SECRET') | default('', true) }}"
          api_key: "{{ lookup('env', 'RESEND_API_KEY') | default('', true) }}"

    - name: Seed s3gw secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/s3gw"
        data:
          access_key: "{{ lookup('env', 'MINIO_ROOT_USER') }}"
          secret_key: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') }}"

    - name: Seed backup-store secret (Pi backup store for CNPG + scylla off-site backups)
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/backup-store"
        data:
          access_key: "{{ lookup('env', 'BACKUP_ACCESS_KEY') }}"
          secret_key: "{{ lookup('env', 'BACKUP_SECRET_KEY') }}"

    - name: Seed grafana secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/grafana"
        data:
          admin_user: admin
          admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
          oauth_client_id: "{{ lookup('env', 'GRAFANA_OAUTH_CLIENT_ID') | default('grafana', true) }}"
          oauth_client_secret: "{{ lookup('env', 'GRAFANA_OAUTH_CLIENT_SECRET') }}"

    - name: Seed kafka secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/kafka"
        data:
          cluster_id: "{{ lookup('env', 'KAFKA_CLUSTER_ID') }}"

    - name: Seed forgejo secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/forgejo"
        data:
          admin_username: "{{ lookup('env', 'FORGEJO_ADMIN_USER') }}"
          admin_password: "{{ lookup('env', 'FORGEJO_ADMIN_PASSWORD') }}"
          admin_email: "{{ lookup('env', 'FORGEJO_ADMIN_EMAIL') }}"

    - name: Seed keycloak secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/keycloak"
        data:
          admin_password: "{{ lookup('env', 'KEYCLOAK_ADMIN_PASSWORD') }}"
          db_password: "{{ lookup('env', 'KEYCLOAK_DB_PASSWORD') }}"
          forgejo_client_secret: "{{ lookup('env', 'KEYCLOAK_FORGEJO_CLIENT_SECRET') }}"
          argocd_client_secret: "{{ lookup('env', 'KEYCLOAK_ARGOCD_CLIENT_SECRET') }}"
          admin_service_client_secret: "{{ lookup('env', 'KEYCLOAK_ADMIN_SERVICE_CLIENT_SECRET') }}"
          k6_smoke_client_secret: "{{ lookup('env', 'KEYCLOAK_K6_SMOKE_CLIENT_SECRET') }}"

    - name: Seed alertmanager secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/alertmanager"
        data:
          webhook_secret: "{{ lookup('env', 'ALERTMANAGER_WEBHOOK_SECRET') | default('unused', true) }}"

    - name: Seed velero secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/velero"
        data:
          access_key: "{{ lookup('env', 'BACKUP_ACCESS_KEY') }}"
          secret_key: "{{ lookup('env', 'BACKUP_SECRET_KEY') }}"

    - name: Seed sonarqube secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/sonarqube"
        data:
          admin_password: "{{ lookup('env', 'SONARQUBE_ADMIN_PASSWORD') }}"
          postgres_password: "{{ lookup('env', 'SONARQUBE_POSTGRES_PASSWORD') }}"
          token: "{{ lookup('env', 'SONARQUBE_TOKEN') }}"

    - name: Seed woodpecker-forgejo secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/woodpecker-forgejo"
        data:
          client_id: "{{ lookup('env', 'WOODPECKER_FORGEJO_CLIENT') }}"
          client_secret: "{{ lookup('env', 'WOODPECKER_FORGEJO_SECRET') }}"

    - name: Seed woodpecker-ci secrets
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/woodpecker-ci"
        data:
          sonar_token: "{{ lookup('env', 'SONARQUBE_TOKEN') }}"
          sonar_host_url: "https://sonar.pmon.dev"
          infra_repo_token: "{{ lookup('env', 'WOODPECKER_INFRA_REPO_TOKEN') }}"
          nexus_url: "http://192.168.11.5:8081"
          nexus_npm_registry: "http://192.168.11.5:8081/repository/npm-public/"
          nvd_api_key: "{{ lookup('env', 'NVD_API_KEY') }}"
          prometheus_auth_token: "{{ lookup('env', 'PROMETHEUS_AUTH_TOKEN') }}"
          clone_token: "{{ lookup('env', 'WOODPECKER_CLONE_TOKEN') }}"
          renovate_token: "{{ lookup('env', 'RENOVATE_TOKEN') }}"
          renovate_github_token: "{{ lookup('env', 'RENOVATE_GITHUB_TOKEN') | default('', true) }}"

    - name: Seed porkbun secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/porkbun"
        data:
          api_key: "{{ lookup('env', 'PORKBUN_API_KEY') }}"
          secret_api_key: "{{ lookup('env', 'PORKBUN_SECRET_KEY') }}"

    - name: Seed k6-smoke secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "{{ vault_prefix }}/k6-smoke"
        data:
          keycloak_url: "https://auth.pmon.dev"
          keycloak_realm: "schnappy"
          client_id: "k6-smoke"
          client_secret: "{{ lookup('env', 'KEYCLOAK_K6_SMOKE_CLIENT_SECRET') }}"
          app_url: "https://pmon.dev"

    # Read-only Forgejo PAT consumed by the schnappy-pr-envs ApplicationSet's
    # PullRequest generator. Lives at a non-prefixed path (secret/argocd/...)
    # because it's argocd infra, not a schnappy workload secret.
    - name: Seed argocd/forgejo-readonly token
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token_value }}"
        validate_certs: false
        path: "argocd/forgejo-readonly"
        data:
          token: "{{ lookup('env', 'FORGEJO_READONLY_TOKEN') }}"
      run_once: true   # path is not vault_prefix-scoped; only seed once

    - name: Secrets seeded
      ansible.builtin.debug:
        msg: >-
          Secrets seeded into Pi Vault (generatable: existing reused or freshly generated).
          {{ 'OPTIONAL ai-masi SKIPPED (MASI_ANTHROPIC_API_KEY unset).'
             if masi_api_key | length == 0 else 'ai-masi seeded.' }}
