---
# Destroy a schnappy environment
#
# Usage:
#   task env:destroy ENV_NAME=staging
#
# Removes: ApplicationSet entries, cluster-config, values files,
# Keycloak redirect URI, gateway ReferenceGrant entry.
# Commits and pushes. ArgoCD deletes the Applications.
# Namespace deletion is manual (safety).

- name: Destroy schnappy environment  # env_name passed via -e
  hosts: pi1
  become: true
  gather_facts: false

  vars_files:
    - ../vars/environment-paths.yml

  vars:
    env_ns: "schnappy-{{ env_name }}"
    infra_dir: "{{ infra_dir_override | default(playbook_dir + '/../../../../infra') }}"
    cluster_dir: "{{ infra_dir }}/clusters/production"
    vault_addr: "https://127.0.0.1:8200"
    keycloak_url: "http://localhost:8080"
    infra_git_url: "{{ infra_git_url_override | default('') }}"
    # Same prelude as create-environment.yml: the root token is read on the target and
    # never crosses the controller.
    vault_cli_env: |
      export VAULT_ADDR="{{ vault_addr }}" VAULT_CACERT=/etc/vault.d/tls/ca-cert.pem
      VAULT_TOKEN="$(cat /etc/vault-unseal/root-token)" || { echo "vault_cli_env: cannot read /etc/vault-unseal/root-token (needs become)" >&2; exit 1; }
      [ -n "$VAULT_TOKEN" ] || { echo "vault_cli_env: root-token file is empty" >&2; exit 1; }
      export VAULT_TOKEN

  pre_tasks:
    - name: Validate env_name
      ansible.builtin.assert:
        that:
          - env_name is defined
          - env_name | length > 0
          - env_name != "production"
          - env_name is match("^[a-z0-9-]+$")
        fail_msg: >-
          env_name must be lowercase alphanumeric, never production (got: '{{ env_name | default('undefined') }}')

    # before the infra checkout is read or written: on main, nothing uncommitted or untracked (pushed with this
    # environment's change otherwise), up to date - the check below reads it, the tasks after write it
    - name: The infra checkout ready
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/git-commit-push.sh ready '{{ infra_dir }}' '{{ infra_git_url }}'"
      delegate_to: localhost
      become: false
      changed_when: "'UPDATED' in _infra_ready.stdout"
      register: _infra_ready
      environment:
        GIT_AUTHOR_NAME: "env-automation"
        GIT_AUTHOR_EMAIL: "automation@pmon.dev"
        GIT_COMMITTER_NAME: "env-automation"
        GIT_COMMITTER_EMAIL: "automation@pmon.dev"

    # an environment create-environment made: its directories exactly -apps, -data, -mesh - production's infra has
    # -data and -mesh (their removal deleted its Argo application, its finalizer its resources), production's own a
    # -realtime besides
    - name: The environment's directories
      ansible.builtin.find:
        paths: "{{ cluster_dir }}"
        patterns: ["{{ env_ns }}", "{{ env_ns }}-*"]
        file_type: directory
      register: env_dirs
      delegate_to: localhost
      become: false

    - name: The environment's directories exactly the three create-environment makes
      ansible.builtin.fail:
        msg: >-
          REFUSED: {{ env_ns }} is no environment create-environment made - its directories
          {{ env_dirs.files | map(attribute='path') | map('basename') | sort | list }}, not exactly -apps, -data, -mesh
      when: >-
        (env_dirs.files | map(attribute='path') | map('basename') | sort | list)
        != [env_ns ~ '-apps', env_ns ~ '-data', env_ns ~ '-mesh']

  tasks:
    # ================================================================
    # Phase 1: Remove Keycloak redirect URI
    # ================================================================

    - name: Check if Keycloak schnappy realm exists
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/realms/schnappy/.well-known/openid-configuration"
        status_code: [200, 404]
      register: kc_realm_check
      failed_when: false

    - name: Get Keycloak admin password
      ansible.builtin.shell: |
        {{ vault_cli_env }}
        vault kv get -field=admin_password secret/schnappy/keycloak
      register: kc_password
      changed_when: false
      no_log: true   # stdout IS the admin password
      when: kc_realm_check.status == 200

    - name: Get Keycloak admin token
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          username: admin
          password: "{{ kc_password.stdout }}"
          grant_type: password
      register: kc_token
      no_log: true   # the request body carries the admin password, the result the token
      when: kc_realm_check.status == 200

    - name: Get app client config
      no_log: true  # a token in its headers: the module logs its arguments on its host
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ keycloak_url }}/admin/realms/schnappy/clients?clientId=app&first=0&max=1"
        headers:
          Authorization: "Bearer {{ kc_token.json.access_token }}"
      register: kc_app_client
      when: kc_realm_check.status == 200

    - name: Remove redirect URI
      no_log: true  # a token in its headers: the module logs its arguments on its host
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ keycloak_url }}/admin/realms/schnappy/clients/{{ kc_app_client.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ kc_token.json.access_token }}"
          Content-Type: application/json
        body_format: json
        body:
          clientId: app
          redirectUris: "{{ kc_app_client.json[0].redirectUris | reject('search', env_name + '.pmon.dev') | list }}"
          webOrigins: "{{ kc_app_client.json[0].webOrigins }}"
        status_code: 204
      when: kc_realm_check.status == 200

    - name: "PHASE 1: Keycloak redirect URI removed"
      ansible.builtin.debug:
        msg: "{{ 'Removed redirect URI' if kc_realm_check.status == 200 else 'Skipped (no schnappy realm)' }}"

    # ================================================================
    # Phase 2: Remove from ApplicationSets + gateway
    # ================================================================

    - name: Remove env from ApplicationSets
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import yaml

        appsets = {
            'data': '{{ cluster_dir }}/argocd/apps/schnappy-data-envs.yaml',
            'apps': '{{ cluster_dir }}/argocd/apps/schnappy-apps-envs.yaml',
            'mesh': '{{ cluster_dir }}/argocd/apps/schnappy-mesh-envs.yaml',
        }
        import fnmatch, sys
        for chart, path in appsets.items():
            with open(path) as f:
                doc = yaml.safe_load(f)
            first = (doc['spec'].get('generators') or [{}])[0]
            dirs = [d.get('path', '') for d in (first.get('git') or {}).get('directories') or []]
            # listed by its own directories (as production is since 2026-04-10): their removal unlists it
            if any(fnmatch.fnmatch('clusters/production/{{ env_ns }}-' + chart, d) for d in dirs):
                continue
            if 'list' not in first:
                sys.exit(f"REFUSED: {path}: its generator neither lists elements nor generates the environment's directory")
            first['list']['elements'] = [e for e in first['list']['elements'] if e.get('env') != '{{ env_name }}']
            with open(path, 'w') as f:
                yaml.dump(doc, f, default_flow_style=False, sort_keys=False)
        PYEOF
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Remove namespace from gateway allowedNamespaces
      ansible.builtin.lineinfile:
        path: "{{ cluster_dir }}/schnappy-mesh/values.yaml"
        line: "    - {{ env_ns }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: "PHASE 2: ApplicationSets and gateway updated"
      ansible.builtin.debug:
        msg: "Removed {{ env_name }} from ApplicationSets"

    # ================================================================
    # Phase 3: Remove infra files
    # ================================================================

    - name: Remove values directories
      ansible.builtin.file:
        path: "{{ cluster_dir }}/{{ env_ns }}-{{ item }}"
        state: absent
      loop: [data, apps, mesh]
      delegate_to: localhost
      become: false

    - name: Remove namespace manifest
      ansible.builtin.file:
        path: "{{ cluster_dir }}/cluster-config/{{ env_ns }}-namespace.yaml"
        state: absent
      delegate_to: localhost
      become: false

    - name: Remove default-deny + quota
      ansible.builtin.file:
        path: "{{ cluster_dir }}/cluster-config/{{ env_ns }}-default-deny.yaml"
        state: absent
      delegate_to: localhost
      become: false

    - name: Remove forgejo-registry block
      ansible.builtin.blockinfile:
        path: "{{ cluster_dir }}/cluster-config/forgejo-registry-secret.yaml"
        marker: "# {mark} {{ env_ns }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: "PHASE 3: Infra files removed"
      ansible.builtin.debug:
        msg: "Removed all {{ env_ns }} files"

    # ================================================================
    # Phase 4: Commit and push
    # ================================================================

    - name: Commit and push infra changes
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/scripts/git-commit-push.sh '{{ infra_dir }}' 'env: destroy {{ env_ns }}' '{{ infra_git_url }}'
          -- {{ _infra_env_paths | map('quote') | join(' ') }}
      delegate_to: localhost
      become: false
      register: _infra_pushed
      changed_when: "'PUSHED' in _infra_pushed.stdout"
      environment:
        GIT_AUTHOR_NAME: "env-automation"
        GIT_AUTHOR_EMAIL: "automation@pmon.dev"
        GIT_COMMITTER_NAME: "env-automation"
        GIT_COMMITTER_EMAIL: "automation@pmon.dev"

    - name: "DONE"
      ansible.builtin.debug:
        msg: |
          Environment {{ env_ns }} removed from ArgoCD.
          To delete the namespace: kubectl delete namespace {{ env_ns }}
