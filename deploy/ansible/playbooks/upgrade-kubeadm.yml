---
# Upgrade the single-node kubeadm cluster by ONE step: a newer patch of the running minor, or the next minor
# (kubeadm supports N -> N+1 only; run it once per minor). The kubeadm procedure for a control-plane node, without
# the drain: ten is the only node, so a drain would evict everything to nowhere; the static control-plane pods restart
# one at a time, workloads keep running.
#
#   1. checks: a version string, at most one minor up, the node Ready; a cluster already at the target or past it is
#      left alone (so the step runner may replay every earlier step, and nothing can downgrade);
#   2. the apt repository of the target minor (pkgs.k8s.io has one per minor);
#   3. kubeadm to the target, `kubeadm upgrade plan`, then `kubeadm upgrade apply` - without the kube-proxy addon
#      (Cilium replaces kube-proxy; ten has none, and the upgrade must not install one);
#   4. kubelet and kubectl to the target, kubernetes-cni and cri-tools to the minor's pinned ones, kubelet restarted;
#   5. proof: node Ready on the new kubelet, every control-plane pod Ready on the new version.
#
# The packages stay held; setup-kubeadm.yml's k8s_version / k8s_package_version must follow (a rebuild installs what
# they say) - at the production rollout, in the same change.
#
# Usage: ansible-playbook -i inventory/<env>.yml playbooks/upgrade-kubeadm.yml -e k8s_upgrade_to=1.34.12
- name: Upgrade the kubeadm cluster by one version
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    kubectl: "kubectl --kubeconfig {{ kubeconfig }}"
    target: "{{ k8s_upgrade_to | default('') }}"
    target_minor: "{{ target.split('.')[:2] | join('.') }}"
    control_plane: [kube-apiserver, kube-controller-manager, kube-scheduler]
    # the CNI plugins and crictl each minor gets: its repository's newest when the upgrade was proven (pkgs.k8s.io,
    # read 2026-10-05) - a newer one published later would install what no run tested
    minor_packages:
      "1.34": [kubernetes-cni=1.7.1-1.1, cri-tools=1.34.0-1.1]
      "1.35": [kubernetes-cni=1.8.0-1.1, cri-tools=1.35.0-1.1]
      "1.36": [kubernetes-cni=1.9.1-1.1, cri-tools=1.36.0-1.1]
    # kubeadm preflight checks to pass over - none on ten. The Vagrant copy's CoreDNS carries `template` blocks (its
    # isolation from production), which kubeadm's Corefile migration does not know and refuses on a CoreDNS bump;
    # kubeadm then migrates the rest and leaves those blocks as they are.
    ignore_preflight: "{{ k8s_upgrade_ignore_preflight_errors_override | default('') }}"
    ignore_preflight_flag: "{{ ('--ignore-preflight-errors=' ~ ignore_preflight) if ignore_preflight | length > 0 else '' }}"

  tasks:
    # ── 1. checks ────────────────────────────────────────────────────
    - name: The target is a version (-e k8s_upgrade_to=X.Y.Z)
      ansible.builtin.assert:
        that: target is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: "-e k8s_upgrade_to=X.Y.Z, e.g. 1.34.12"

    - name: The version the cluster runs
      check_mode: false
      ansible.builtin.command: "{{ kubectl }} get node -o jsonpath={.items[0].status.nodeInfo.kubeletVersion}"
      register: _running
      changed_when: false

    - name: Nothing to do when the cluster already runs the target or a newer version (a re-run, or a later step's)
      when: _running.stdout | regex_replace('^v', '') is version(target, '>=')
      block:
        - name: Already there
          ansible.builtin.debug:
            msg: "KUBERNETES ALREADY AT {{ _running.stdout }} (target v{{ target }}): nothing to do"
        - name: End here
          ansible.builtin.meta: end_host

    - name: The target is at most one minor up (kubeadm upgrades N -> N+1 only)
      vars:
        running: "{{ _running.stdout | regex_replace('^v', '') }}"
        running_minor: "{{ running.split('.')[1] | int }}"
        to_minor: "{{ target.split('.')[1] | int }}"
      ansible.builtin.assert:
        that:
          - target.split('.')[0] == running.split('.')[0]
          - (to_minor | int) - (running_minor | int) in [0, 1]
        fail_msg: "running {{ running }}: {{ target }} is more than one minor up"

    - name: The node is Ready
      check_mode: false
      ansible.builtin.command: "{{ kubectl }} wait node --all --for=condition=Ready --timeout=120s"
      changed_when: false

    # a new minor only on a container runtime it supports: the step order puts containerd.io 2.3 before 1.35, and this
    # refuses a run that skipped it
    - name: The container runtime the node runs
      check_mode: false
      ansible.builtin.command: "{{ kubectl }} get node -o jsonpath={.items[0].status.nodeInfo.containerRuntimeVersion}"
      register: _runtime
      changed_when: false

    - name: The target minor supports that runtime
      ansible.builtin.include_tasks: tasks/runtime-supported.yml
      vars:
        runtime_version: "{{ _runtime.stdout }}"

    # kubeadm upgrade rewrites the kubelet's config.yaml from this ConfigMap: without them there, the upgrade turns the
    # graceful node shutdown off - configure-node.yml puts them there first
    - name: The kubelet-config ConfigMap keeps the shutdown grace (180s / 30s)
      check_mode: false
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} -n kube-system get configmap kubelet-config -o jsonpath='{.data.kubelet}' \
          | grep -E '^shutdownGracePeriod(CriticalPods)?:' | sort \
          | python3 -c 'import re, sys
        for line in sys.stdin:  # a duration in seconds: kubeadm writes 180s back as 3m0s
            key, value = line.split(":", 1)
            print("%s: %gs" % (key, sum(float(n) * {"h": 3600, "m": 60, "s": 1}[u] for n, u in re.findall(r"([0-9.]+)(h|m|s)", value))))'
      args:
        executable: /bin/bash
      register: _grace_in_map
      changed_when: false
      failed_when: >-
        _grace_in_map.rc != 0
        or _grace_in_map.stdout_lines != ['shutdownGracePeriod: 180s', 'shutdownGracePeriodCriticalPods: 30s']

    # ── 2. the target minor's apt repository ─────────────────────────
    - name: Kubernetes apt key for the target minor  # noqa: command-instead-of-module risky-shell-pipe
      ansible.builtin.shell: |
        set -euo pipefail
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ target_minor }}/deb/Release.key -o "$tmp/Release.key"
        gpg --batch --dearmor -o "$tmp/keyring.gpg" "$tmp/Release.key"
        install -m 0644 "$tmp/keyring.gpg" /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        executable: /bin/bash
      changed_when: true

    - name: Kubernetes apt repository for the target minor
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ target_minor }}/deb/ /
        mode: '0644'

    # read from the repository's own index, not apt's lists: a preview (--check) switches no repository to a new minor
    # and refreshes no lists, and finds the revision all the same
    - name: The target's package revision in that repository
      check_mode: false
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ target_minor }}/deb/Packages \
          | awk '/^Package: /{p=$2} /^Version: /{if (p=="kubeadm") print $2}' \
          | grep -E '^{{ target | regex_escape }}-' | sort -V | tail -1
      args:
        executable: /bin/bash
      register: _package
      changed_when: false
      failed_when: _package.stdout | length == 0

    # a preview (--check) ends here: the checks above ran for real, and everything below acts on the installed kubeadm
    - name: Preview - what the run would do
      when: ansible_check_mode
      block:
        - name: Would upgrade
          ansible.builtin.debug:
            msg: "PREVIEW: would upgrade Kubernetes {{ _running.stdout }} -> v{{ target }} (packages {{ _package.stdout }})"
        - name: End the preview here
          ansible.builtin.meta: end_host

    # ── 3. kubeadm, then the control plane ───────────────────────────
    - name: Install the target kubeadm (held packages may change here only)
      ansible.builtin.apt:
        name: "kubeadm={{ _package.stdout }}"
        update_cache: true
        allow_change_held_packages: true
        allow_downgrade: false

    - name: Kubeadm is the target version
      ansible.builtin.command: kubeadm version -o short
      register: _kubeadm
      changed_when: false
      failed_when: _kubeadm.stdout != 'v' ~ target

    - name: Kubeadm upgrade plan (the cluster can go to the target)
      ansible.builtin.command: "kubeadm upgrade plan v{{ target }} {{ ignore_preflight_flag }}"
      register: _plan
      changed_when: false

    - name: Kubeadm upgrade apply - without the kube-proxy addon (Cilium replaces it)
      ansible.builtin.command: >-
        kubeadm upgrade apply v{{ target }} --yes --skip-phases=addon/kube-proxy {{ ignore_preflight_flag }}
      register: _apply
      changed_when: true
      timeout: 1800

    # ── 4. kubelet and kubectl ───────────────────────────────────────
    - name: Install the target kubelet and kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ _package.stdout }}"
          - "kubectl={{ _package.stdout }}"
        allow_change_held_packages: true
        allow_downgrade: false

    # the rest of the minor's own packages, as a fresh build gets them: kubeadm 1.36 no longer pulls cri-tools in, and
    # an upgrade left kubernetes-cni and crictl at the first minor's (a build at the targets showed 1.9.1 against 1.7.1)
    - name: The CNI plugins and crictl of the target minor - pinned
      ansible.builtin.assert:
        that: target_minor in minor_packages
        fail_msg: "no kubernetes-cni / cri-tools pinned for {{ target_minor }} (minor_packages)"
        quiet: true

    - name: Install them
      ansible.builtin.apt:
        name: "{{ minor_packages[target_minor] }}"
        allow_downgrade: false

    - name: Keep the packages held
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubeadm, kubelet, kubectl]

    - name: Restart the kubelet on the new version
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
        daemon_reload: true

    # ── 5. proof ─────────────────────────────────────────────────────
    - name: The node is Ready on the new kubelet
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} wait node --all --for=condition=Ready --timeout=60s > /dev/null
        {{ kubectl }} get node -o jsonpath='{.items[0].status.nodeInfo.kubeletVersion}'
      args:
        executable: /bin/bash
      register: _node
      changed_when: false
      retries: 30
      delay: 10
      until: _node.rc == 0 and _node.stdout == 'v' ~ target

    - name: The kubelet runs with the shutdown grace after the upgrade (180s / 30s)
      ansible.builtin.shell: |
        set -euo pipefail
        grep -E '^shutdownGracePeriod(CriticalPods)?:' /var/lib/kubelet/config.yaml | sort \
        | python3 -c 'import re, sys
        for line in sys.stdin:  # a duration in seconds: kubeadm writes 180s back as 3m0s
            key, value = line.split(":", 1)
            print("%s: %gs" % (key, sum(float(n) * {"h": 3600, "m": 60, "s": 1}[u] for n, u in re.findall(r"([0-9.]+)(h|m|s)", value))))'
      args:
        executable: /bin/bash
      register: _grace_in_file
      changed_when: false
      failed_when: >-
        _grace_in_file.rc != 0
        or _grace_in_file.stdout_lines != ['shutdownGracePeriod: 180s', 'shutdownGracePeriodCriticalPods: 30s']

    - name: Every control-plane pod is Ready on the new version
      ansible.builtin.shell: |
        set -euo pipefail
        for c in {{ control_plane | join(' ') }}; do
          {{ kubectl }} -n kube-system wait pod -l component=$c --for=condition=Ready --timeout=60s > /dev/null
          echo "$c $({{ kubectl }} -n kube-system get pod -l component=$c -o jsonpath='{.items[0].spec.containers[0].image}')"
        done
      args:
        executable: /bin/bash
      register: _cp
      changed_when: false
      retries: 30
      delay: 10
      until: >-
        _cp.rc == 0
        and (_cp.stdout_lines | reject('match', '^\S+ \S+:v' ~ (target | regex_escape) ~ '$') | list | length) == 0

    # The new kubelet can restart the static control-plane pods a few seconds after its own restart (their spec hash
    # changes with its version): the checks above can pass on the pods' previous status while the API server is
    # going down, and the next caller then meets an API server whose RBAC caches are still empty - "clusterrole
    # cluster-admin not found" (Vagrant full run, 1.35.9, 2026-10-04). Done only once the kubelet has been up for a
    # minute, the API server has been running for 30 s and answers ready on every check, RBAC included.
    - name: The control plane has settled after the kubelet's restart
      ansible.builtin.shell: |
        set -euo pipefail
        now=$(date +%s)
        kubelet_up=$(( now - $(date -d "$(systemctl show kubelet -p ActiveEnterTimestamp --value)" +%s) ))
        started=$({{ kubectl }} -n kube-system get pod -l component=kube-apiserver \
          -o jsonpath='{.items[0].status.containerStatuses[0].state.running.startedAt}')
        # not running (no startedAt) is not up: an empty date reads as midnight
        [ -n "$started" ]
        apiserver_up=$(( now - $(date -d "$started" +%s) ))
        readyz=$({{ kubectl }} get --raw /readyz)
        admin=$({{ kubectl }} auth can-i '*' '*')
        echo "kubelet up ${kubelet_up}s, API server up ${apiserver_up}s, readyz $readyz, cluster admin $admin"
        [ "$kubelet_up" -ge 60 ] && [ "$apiserver_up" -ge 30 ] && [ "$readyz" = ok ] && [ "$admin" = yes ]
      args:
        executable: /bin/bash
      register: _settled
      changed_when: false
      retries: 30
      delay: 10
      until: _settled.rc == 0

    - name: Upgraded
      ansible.builtin.debug:
        msg: "KUBERNETES UPGRADED: {{ _running.stdout }} -> v{{ target }} ({{ _cp.stdout_lines | join(', ') }})"
