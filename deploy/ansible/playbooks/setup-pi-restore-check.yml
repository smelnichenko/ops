---
# The backups restored for real, on the Pis, every day - by the two Pis in turn (UTC days: pi1 the even ones, pi2 the
# odd ones; Consul's lock keeps two runs from ever overlapping). files/pi-restore-check.sh restores:
#   postgres  production's CNPG cluster: the newest restorable base backup, then every WAL archived after it, in
#             production's own Postgres image (podman) - replayed to the end, the newest WAL archived when the run began
#             reached, every database of pi_restore_check_databases there and read back whole
#   etcd      ten's newest hourly snapshot: restored (its hash checked), an etcd started on it, kube-system there
#   tier0     the Pis' own newest backup (setup-pi-backups.yml): Consul's snapshot into a throwaway agent, every
#             Patroni database dump into a scratch Postgres
# Everything is read through the VIP (the store both Pis serve); the run writes only restore-checks/<this Pi>/ -
# last-report each run, last-success when every part restored. infra's restore-check-age (kube-system) fails, and
# KubeJobFailed fires, when either Pi's last-success is older than two of its turns. Nothing here holds the cluster's
# credentials: the check cannot touch production.
#
# Usage: task deploy:pi-restore-check   (production; after deploy:pi-backups - tier0 restores its backup)
#        task test:pi-restore-check     (the Vagrant rehearsal)
# A run by hand, today whatever the day (as the unit runs it - systemd reads the settings, never a shell):
#   sudo systemd-run --wait --pipe --collect -p RuntimeMaxSec=3h -p EnvironmentFile=/etc/pi-restore-check/env \
#     /usr/bin/env PI_RESTORE_ANY_DAY=1 /usr/local/sbin/pi-restore-check.sh
- name: The Pis' restore check
  hosts: pis
  become: true
  gather_facts: false
  vars:
    # after every backup window - CNPG's base backups, Velero (02:00, Sunday 03:00), the Pis' (02:40), Scylla's
    # (03:00, its repair Sunday 04:00) - all UTC
    pi_restore_check_on_calendar: "*-*-* 05:30:00 UTC"
    # the Pi's kernel command line (Raspberry Pi OS's): where the memory cgroup is turned on; the controllers the kernel
    # runs (cgroup v2's list - /proc/cgroups lists memory even when it is off) and the command line it booted with
    pi_cmdline_path: /boot/firmware/cmdline.txt
    pi_cgroup_controllers: /sys/fs/cgroup/cgroup.controllers
    pi_booted_cmdline: /proc/cmdline
    # the flags that turn it on, each added where missing
    pi_cmdline_memory_flags: [cgroup_enable=memory, cgroup_memory=1]
    # a command line written only when still one line naming its root - root= a word of its own, not nfsroot='s tail
    # (%s: the file the edit would write)
    pi_cmdline_valid: >-
      sh -c 'test "$(grep -c "" "$0")" -eq 1 && grep -Eq "(^|[[:space:]])root=[^[:space:]]" "$0"' %s
    # production's CNPG databases (infra's schnappy-production-data values, postgres.databases)
    pi_restore_check_databases: [monitor, admin, chat, chess, masi]
    # production's Postgres image per major: the 17 its chart ran (by its tag alone, never a digest), the 18 its step 47
    # moved to, by the digest platform's schnappy-data runs
    pi_restore_check_pg_images:
      "17": "ghcr.io/cloudnative-pg/postgresql:17"
      "18": "ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533"
    # the etcd production runs after the upgrade (its etcdutl reads the snapshot), by the digest ten's kubelet pulled
    pi_restore_check_etcd_image: "registry.k8s.io/etcd:3.6.8-0@sha256:397189418d1a00e500c0605ad18d1baf3b541a1004d768448c367e48071622e5"
    # how old each backup may be: CNPG's base backup daily at 01:30 (platform schnappy-data, "0 30 1 * * *"), this
    # check at 05:30 - an idle database can leave that day's backup's end segment unarchived, and the newest restorable
    # one is then the day before's, ~28 h old: 30 h; etcd's snapshots hourly; the Pis' own daily at 02:40
    pi_restore_check_pg_base_max_age_h: 30
    # the base backups looked at for the newest restorable one: the store's 30 days of daily ones (retentionPolicy)
    pi_restore_check_pg_backups_looked_at: 30
    pi_restore_check_etcd_max_age_h: 3
    pi_restore_check_tier0_max_age_h: 30
    # the recovery's wait, 5 s a poll: an hour; etcd's on the restored snapshot, 2 s a poll: 3 minutes
    pi_restore_check_pg_wait_polls: 720
    pi_restore_check_etcd_wait_polls: 90
    # room a run needs before it starts: production's Postgres volume (20Gi) and the etcd and tier-0 copies, with margin
    # (each part's data is removed when it ends)
    pi_restore_check_min_free_gb: 30
    # each container's memory (podman runs them outside the unit's cgroup) and the unit's own (the throwaway Consul,
    # the scratch Postgres): the Pi's 8 GB serves Vault, Consul and Patroni first
    pi_restore_check_container_memory: 1536m
    pi_restore_check_unit_memory: 1G
    pi_restore_check_work: /var/lib/pi-restore-check
  tasks:
    # podman for production's own images (host network or none: it never adds a network or a firewall rule); rclone
    # for the store
    - name: Podman and rclone, Debian's
      ansible.builtin.apt:
        name: [podman, rclone]
        state: present

    - name: The check's settings directory, root only
      ansible.builtin.file:
        path: /etc/pi-restore-check
        state: directory
        mode: '0700'

    # passed through, not listed, by the restores' own users (the Pi's postgres, the Postgres image's uid 26): each run's
    # directory under it is made by the run
    - name: The check's work directory
      ansible.builtin.file:
        path: "{{ pi_restore_check_work }}"
        state: directory
        mode: '0711'

    # an empty one would leave the check failing with nothing but the unit to say why
    - name: Its credentials are all there
      ansible.builtin.assert:
        that:
          - backup_root_user | length > 0
          - backup_root_password | length > 0
        fail_msg: "REFUSED: an empty credential (BACKUP_ACCESS_KEY or BACKUP_SECRET_KEY in .env)"
        quiet: true
      no_log: true

    - name: Its settings and the store's credentials, root only
      ansible.builtin.copy:
        dest: /etc/pi-restore-check/env
        mode: '0600'
        content: |
          STORE_ENDPOINT=http://{{ keepalived_vip }}:9000
          RCLONE_CONFIG=
          RCLONE_CONFIG_STORE_TYPE=s3
          RCLONE_CONFIG_STORE_PROVIDER=Other
          RCLONE_CONFIG_STORE_ENDPOINT=http://{{ keepalived_vip }}:9000
          RCLONE_CONFIG_STORE_ACCESS_KEY_ID={{ backup_root_user }}
          RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY={{ backup_root_password }}
          AWS_ACCESS_KEY_ID={{ backup_root_user }}
          AWS_SECRET_ACCESS_KEY={{ backup_root_password }}
          PI_RESTORE_NAME={{ inventory_hostname }}
          PI_RESTORE_PARITY={{ groups['pis'].index(inventory_hostname) % 2 }}
          PI_RESTORE_PG_DATABASES={{ pi_restore_check_databases | join(' ') }}
          {% for major, image in pi_restore_check_pg_images.items() %}
          PI_RESTORE_PG_IMAGE_{{ major }}={{ image }}
          {% endfor %}
          PI_RESTORE_ETCD_IMAGE={{ pi_restore_check_etcd_image }}
          PI_RESTORE_PG_BASE_MAX_AGE_H={{ pi_restore_check_pg_base_max_age_h }}
          PI_RESTORE_PG_BACKUPS_LOOKED_AT={{ pi_restore_check_pg_backups_looked_at }}
          PI_RESTORE_ETCD_MAX_AGE_H={{ pi_restore_check_etcd_max_age_h }}
          PI_RESTORE_TIER0_MAX_AGE_H={{ pi_restore_check_tier0_max_age_h }}
          PI_RESTORE_PG_WAIT_POLLS={{ pi_restore_check_pg_wait_polls }}
          PI_RESTORE_ETCD_WAIT_POLLS={{ pi_restore_check_etcd_wait_polls }}
          PI_RESTORE_WORK={{ pi_restore_check_work }}
          PI_RESTORE_MIN_FREE_GB={{ pi_restore_check_min_free_gb }}
          PI_RESTORE_CONTAINER_MEMORY={{ pi_restore_check_container_memory }}
          PI_RESTORE_CGROUP_CONTROLLERS={{ pi_cgroup_controllers }}
      no_log: true

    - name: The check's script
      ansible.builtin.copy:
        src: files/pi-restore-check.sh
        dest: /usr/local/sbin/pi-restore-check.sh
        mode: '0700'

    - name: The service and its daily timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: '0644'
        content: "{{ item.content }}"
      loop:
        - name: pi-restore-check.service
          content: |
            [Unit]
            Description=The backups restored on this Pi (every other day; the other Pi takes the rest)
            After=network-online.target consul.service versitygw.service
            # a failed run tried twice more, 20 minutes apart: a blip (the VIP moving, a registry, a Consul election)
            # is no failed turn - and a failed turn is two days of KubeJobFailed until this Pi's next one. The window
            # holds three runs hung to their 3 h timeout, 20 min apart (a 6 h one never did, and the unit restarted for
            # ever), and ends before the timer's next day (24 h held yesterday's start and cost today a retry)
            StartLimitIntervalSec=12h
            StartLimitBurst=3
            [Service]
            Type=oneshot
            # its files root's alone (the script sets it too): production's backups and the restored servers' sockets
            UMask=0077
            EnvironmentFile=/etc/pi-restore-check/env
            ExecStart=/usr/local/sbin/pi-restore-check.sh
            # a killed run's containers (outside this cgroup: SIGKILL leaves them, memory held) gone now, not at this
            # Pi's next turn - '-': a run by hand holding the lock owns its own, and a skipped sweep fails nothing
            ExecStopPost=-/usr/local/sbin/pi-restore-check.sh --sweep
            # the Pi's own services come first
            Nice=10
            MemoryMax={{ pi_restore_check_unit_memory }}
            # a hung run must not block the next turn
            TimeoutStartSec=3h
            Restart=on-failure
            RestartSec=20min
        - name: pi-restore-check.timer
          content: |
            [Unit]
            Description=The restore check, daily (each Pi acts on its own days)
            [Timer]
            OnCalendar={{ pi_restore_check_on_calendar }}
            RandomizedDelaySec=300
            Persistent=true
            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"

    - name: The timer on
      ansible.builtin.systemd:
        name: pi-restore-check.timer
        enabled: true
        state: started
        daemon_reload: true

    # the containers' memory bound (podman --memory) and the unit's MemoryMax need the kernel's memory cgroup controller:
    # Raspberry Pi OS boots with it off (cgroup_disable=memory) - pi1's cmdline turned it on by hand (2026-03), pi2 was
    # reimaged without it (2026-04) and its restore containers did not start ("crun: opening file `memory.max`",
    # 2026-10-16). Turned on at boot where the Pi's cmdline is (a VM has none), the file kept one line
    - name: The Pi's kernel command line
      ansible.builtin.stat:
        path: "{{ pi_cmdline_path }}"
      register: _cmdline

    # the firmware reads the command line named there unless its config.txt points elsewhere (cmdline=, os_prefix=):
    # an edit there would never boot, and every run would say "reboot it"
    - name: The firmware's settings beside it
      ansible.builtin.slurp:
        src: "{{ pi_cmdline_path | dirname }}/config.txt"
      register: _firmware_config
      failed_when: false  # none: the firmware's defaults
      when: _cmdline.stat.exists

    - name: The firmware reads this command line
      ansible.builtin.assert:
        that: not ((_firmware_config.content | default('') | b64decode) is regex('(?m)^[ \t]*(cmdline|os_prefix)[ \t]*='))
        fail_msg: >-
          {{ inventory_hostname }}'s {{ pi_cmdline_path | dirname }}/config.txt sets cmdline= or os_prefix=: its
          firmware reads another command line than {{ pi_cmdline_path }} - set pi_cmdline_path to it
        quiet: true
      when: _cmdline.stat.exists

    - name: The Pi's command line now, and the one kept
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: ["{{ pi_cmdline_path }}", "{{ pi_cmdline_path }}.before-memory-cgroup"]
      register: _cmdline_text
      failed_when: _cmdline_text.content is not defined and item == pi_cmdline_path
      when: _cmdline.stat.exists

    # kept as it was before this play changed it, for a hand's undo (the firmware reads cmdline.txt alone; FAT writes a
    # cp over it in place - copy it to cmdline.txt.new, sync, then mv it over): a name of its own - the boot partition
    # is FAT, where Ansible's own backup names (a time with ':') cannot be written (pi2, 2026-10-16: the edit refused
    # before it wrote anything). Only where a change is due; one kept from a run cut short (its line the same but for
    # these flags) stays, one older than the line now (a new root=, a clone) is replaced - an undo to it would not boot
    - name: The Pi's command line kept as it was (before the memory cgroup's flags)
      ansible.builtin.copy:
        src: "{{ pi_cmdline_path }}"
        dest: "{{ pi_cmdline_path }}.before-memory-cgroup"
        remote_src: true
        force: "{{ _kept | reject('in', _ours) | list != _words | reject('in', _ours) | list }}"
        mode: preserve  # FAT's mode is its mount's: the original's kept, none set
      vars:
        _ours: "{{ pi_cmdline_memory_flags + ['cgroup_disable=memory'] }}"
        _words: "{{ (_cmdline_text.results[0].content | b64decode).split() }}"
        _kept: "{{ (_cmdline_text.results[1].content | default('') | b64decode).split() }}"
      register: _cmdline_kept
      when:
        - _cmdline.stat.exists
        - pi_cmdline_memory_flags | difference(_words) | length > 0 or 'cgroup_disable=memory' in _words

    # an explicit cgroup_disable=memory on the line itself taken off (a later one would win over the flags below); each
    # edit checked before it is written: still one line, still naming root= - a broken line leaves a Pi 5 unbootable
    # until its disk is pulled
    - name: No cgroup_disable=memory on the Pi's command line
      ansible.builtin.replace:
        path: "{{ pi_cmdline_path }}"
        regexp: '[ \t]*(?<!\S)cgroup_disable=memory(?!\S)'
        replace: ''
        validate: "{{ pi_cmdline_valid }}"
      register: _cmdline_cleared
      when: _cmdline.stat.exists

    # each flag added where missing (the line's end - leading blanks and a CRLF's carriage return allowed - its one line
    # kept), none twice
    - name: The memory cgroup on at boot (the Pi's command line)
      ansible.builtin.replace:
        path: "{{ pi_cmdline_path }}"
        regexp: '^(?!.*(?<!\S){{ item | regex_escape }}(?!\S))([ \t]*\S.*?)[ \t\r]*$'
        replace: '\1 {{ item }}'
        validate: "{{ pi_cmdline_valid }}"
      loop: "{{ pi_cmdline_memory_flags }}"
      register: _cmdline_set
      when: _cmdline.stat.exists

    # on the card before the play goes on: FAT keeps no journal, and an edit still in the page cache when the power goes
    # can leave the line's entry without its data - a Pi 5 that does not boot until its disk is pulled (a clean reboot
    # syncs first; a cut does not)
    - name: The Pi's command line on the card
      ansible.builtin.command: sync -f {{ pi_cmdline_path }}
      changed_when: false
      when: _cmdline_kept is changed or _cmdline_cleared is changed or _cmdline_set is changed

    - name: The kernel's cgroup controllers now, and the command line it booted with
      ansible.builtin.command: "cat {{ item }}"
      loop: ["{{ pi_cgroup_controllers }}", "{{ pi_booted_cmdline }}"]
      register: _cgroups
      changed_when: false
      failed_when: false  # no cgroup v2 file: no controller - the assert says so
      check_mode: false  # a read

    # the cause said, never guessed: a cmdline changed takes effect at the next boot; one booted with the flags and
    # still without the controller is the kernel's or the firmware's doing - no reboot helps
    - name: The memory controller live
      ansible.builtin.assert:
        that: "'memory' in _cgroups.results[0].stdout.split()"
        fail_msg: >-
          {{ inventory_hostname }} has no memory cgroup controller - {% if not _cmdline.stat.exists %}no
          {{ pi_cmdline_path }}: its command line is elsewhere, the controller cannot be turned on here (set
          pi_cmdline_path){% elif ansible_check_mode and (_cmdline_set is changed or _cmdline_cleared is changed)
          %}a run (not --check) turns it on, then a reboot{% elif 'cgroup_enable=memory' in
          _cgroups.results[1].stdout.split() and 'cgroup_memory=1' in _cgroups.results[1].stdout.split() %}it booted
          with cgroup_enable=memory cgroup_memory=1 and still has none: its kernel or firmware disables it, a reboot
          will not help{% else %}its command line turns it on{{ ' now' if _cmdline_set is changed else '' }}: reboot it,
          one Pi at a time and the other healthy first (its Vault unsealed, Patroni's replica streaming, keepalived
          ready to hold the VIP){% endif %}; the restore check's containers cannot start until then
        quiet: true
