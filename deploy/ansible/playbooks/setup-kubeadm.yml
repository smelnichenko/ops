---
# Install vanilla Kubernetes via kubeadm on ten
#
# Components:
# - kubeadm + kubelet + kubectl
# - containerd (standalone) + nerdctl-full (buildkit for image builds)
# - Cilium CNI (eBPF) + Istio sidecar mesh
# - HAProxy (host-level, forwards 80/443 to Istio gateway NodePorts)
# - Operators: cert-manager, ESO, Prometheus CRDs, CNPG, Strimzi, ScyllaDB
#
# Prerequisites:
#   - PVC data backed up at /mnt/backups/
#   - Vault running on Pi (transit unseal)
#
# Usage:
#   task deploy:kubeadm

- name: Install kubeadm on ten
  hosts: target
  become: true
  gather_facts: true

  vars:
    k8s_version: "1.34"
    # the exact package version: an unpinned install takes the repo's newest patch, not what ten runs
    k8s_package_version: "1.34.6-1.1"
    # the minor's CNI plugins and crictl, as upgrade-kubeadm.yml's minor_packages pins them: unpinned, a rebuild took
    # the repository's newest, which no run tested
    k8s_cni_version: "1.7.1-1.1"
    k8s_cri_tools_version: "1.34.0-1.1"
    # nerdctl-full (CLI + buildkit) only where images are built on the node (Vagrant tests); ten has none.
    # Play vars outrank inventory vars, so an inventory sets the *_override names (as with node_ip).
    install_nerdctl: "{{ install_nerdctl_override | default(false) }}"
    # the CRI registry config_path; empty on ten, set by the Vagrant inventory for its plain-HTTP test registry
    containerd_registry_config_path: "{{ containerd_registry_config_path_override | default('') }}"
    # the container runtime: Debian's containerd (empty, as ten was built) or containerd.io at this version from
    # Docker's apt repository - what ten runs after the containerd step (upgrade-containerd.yml); a rebuild after the
    # rollout sets it, and the no-downgrade check refuses a full run on a containerd.io node without it
    containerd_io_version: ""
    # On ten, Argo CD (infra clusters/production/argocd/apps) owns Istio, cert-manager, metrics-server, the Prometheus
    # stack and the data operators; this playbook installs them only where no Argo will (most Vagrant tests).
    platform_by_argo: "{{ platform_by_argo_override | default(false) }}"
    # the infra checkout next to ops: Argo CD's own values for what this installs before Argo does (Istio)
    infra_dir: "{{ infra_dir_override | default(playbook_dir + '/../../../../infra') }}"
    # the values read from infra's main, not from whatever branch the checkout has (a feature branch's values went to
    # production through it); a branch under test: -e infra_values_ref_override=<ref>
    infra_values_ref: "{{ infra_values_ref_override | default('main') }}"
    # External Secrets by Helm: only where no Argo owns it - on ten Argo does, and a re-run would roll Argo's ESO back to
    # this chart. The Vagrant upgrade copy sets the override: its baseline has the CRDs from this install, as ten has
    # them from 2026-04-05, until the step that moves them under Argo.
    external_secrets_by_helm: "{{ external_secrets_by_helm_override | default(not (platform_by_argo | bool)) }}"
    # the versions ten runs (2026-10-02), so a rebuild and every Vagrant test start from production
    cert_manager_version: "v1.20.0"
    external_secrets_chart_version: "2.2.0"
    metrics_server_chart_version: "3.14.0"
    prometheus_operator_crds_chart_version: "27.0.1"  # operator v0.89.0
    gateway_api_version: "v1.2.1"
    local_path_provisioner_version: "v0.0.35"
    # the provisioner's node paths - upstream's default, as ten runs (/opt/local-path-provisioner, on the NVMe root)
    local_path_node_paths: [{node: DEFAULT_PATH_FOR_NON_LISTED_NODES, paths: [/opt/local-path-provisioner]}]
    # ten's local-path StorageClass is not the default (its PVCs name it); Vagrant tests rely on a default
    local_path_default_class: "{{ local_path_default_class_override | default(false) }}"
    pod_cidr: "10.42.0.0/16"
    service_cidr: "10.43.0.0/16"
    node_ip: "{{ node_ip_override | default('192.168.11.2') }}"
    cilium_version: "1.19.1"
    # the Scylla Manager chart's values where Argo does not install it: its and its agents' image tags (production's
    # pins from the step that needs them; empty: the chart's) - tags apart, so a step's default line stays one short line
    scylla_manager_tag: ""
    scylla_manager_agent_tag: ""
    scylla_manager_values: >-
      {{ {'scylla': {'developerMode': true}}
         | combine({'image': {'tag': scylla_manager_tag}} if scylla_manager_tag else {})
         | combine({'scylla': {'agentImage': {'tag': scylla_manager_agent_tag}}} if scylla_manager_agent_tag else {},
                   recursive=true) }}
    # Cilium's Helm values. An upgrade renders cilium-config from these alone, so they must render what runs: the
    # 'Cilium's live config' check refuses otherwise.
    cilium_values:
      cluster:
        name: kubernetes
      ipam:
        operator:
          clusterPoolIPv4PodCIDRList: "{{ pod_cidr }}"
      k8sServiceHost: "{{ node_ip }}"
      k8sServicePort: 6443
      kubeProxyReplacement: true
      routingMode: tunnel
      tunnelProtocol: vxlan
      operator:
        replicas: 1
      hubble:
        enabled: true
        relay:
          enabled: true
        ui:
          enabled: true
      cni:
        exclusive: false
      # Socket-level load balancing only in the host namespace: in a pod it rewrote a Service IP to a pod IP at
      # connect(), before Istio's redirect, so the sidecar found no listener, passed the traffic through in plain
      # text and STRICT mTLS reset it (Vagrant 2026-10-02: CNPG's replica join and every app -> Postgres). ten has
      # had it since bootstrap.sh patched cilium-config by hand; a helm upgrade without it would drop it there.
      socketLB:
        hostNamespaceOnly: true
      # the defaults of the minor first installed (1.19, 2026-04-05) kept across upgrades, as Cilium's upgrade guide
      # asks: 1.20's own would switch envoy-xds-mode to ads - the one change it makes to ten's config besides keys of
      # its new features (rendered 2026-10-04)
      upgradeCompatibility: "1.19"
    istio_version: "1.25.2"
    data_dir: "/mnt/storage"

  tasks:
    # never backwards: refuses before a run would downgrade what the node or the cluster runs (tasks/no-downgrade.yml)
    - name: No downgrade
      ansible.builtin.include_tasks:
        file: tasks/no-downgrade.yml
        apply:
          tags: [always]
      tags: [always]

    # ================================================================
    # Phase 1: Install containerd
    # ================================================================

    - name: Install the dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          # Python libs required by kubernetes.core.* Ansible modules
          # (k8s / k8s_info / helm). Used throughout setup-kubeadm,
          # setup-argocd, setup-velero, setup-woodpecker.
          - python3-yaml
          - python3-kubernetes
        state: present
        update_cache: true

    - name: Install Debian's containerd (containerd_io_version empty)
      ansible.builtin.apt:
        name: containerd
        state: present
      when: containerd_io_version | length == 0

    - name: Install containerd.io from Docker's apt repository (containerd_io_version set)
      when: containerd_io_version | length > 0
      block:
        - name: Docker's apt key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/debian/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

        - name: Docker's apt repository (as on ten - its docker.list)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.list
            content: |
              deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts.distribution_release }} stable
            mode: '0644'

        - name: The version's package revision there
          ansible.builtin.shell: |
            set -o pipefail
            apt-get update -qq
            apt-cache madison containerd.io | awk '{print $3}' | grep -E '^{{ containerd_io_version | regex_escape }}-' | sort -V | tail -1
          args:
            executable: /bin/bash
          register: _ctd_io_package
          changed_when: false
          failed_when: _ctd_io_package.stdout | length == 0

        - name: Install containerd.io (it bundles runc; replaces Debian's containerd where present)
          ansible.builtin.apt:
            name: "containerd.io={{ _ctd_io_package.stdout }}"
            state: present

        - name: Hold containerd.io (an apt upgrade would restart the runtime under every pod)
          ansible.builtin.dpkg_selections:
            name: containerd.io
            selection: hold

    - name: Check if nerdctl is installed
      ansible.builtin.stat:
        path: /usr/local/bin/nerdctl
      register: _nerdctl_stat

    - name: Install nerdctl-full (CLI + buildkit + buildctl — used by test:cicd image build/push)
      # nerdctl-full bundles buildkitd + buildctl (separate from the containerd
      # apt package, which doesn't ship them). `nerdctl build` needs buildkitd;
      # without it the build fails with "no buildkit host is available".
      ansible.builtin.shell: |
        set -e
        ARCH=$(dpkg --print-architecture)
        VERSION=2.0.3
        # a private directory: an archive planted under a fixed name in the shared temp directory was unpacked into
        # /usr/local as root
        d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
        curl -fsSL --connect-timeout 30 --speed-limit 10240 --speed-time 120 -o "$d/nerdctl-full.tar.gz" \
          "https://github.com/containerd/nerdctl/releases/download/v${VERSION}/nerdctl-full-${VERSION}-linux-${ARCH}.tar.gz"
        tar -C /usr/local -xzf "$d/nerdctl-full.tar.gz"
        # its bundled containerd must never start and its runc never run: the node runs the apt ones, as production
        # does (see below)
        rm -f /usr/local/lib/systemd/system/containerd.service /usr/local/bin/containerd \
          /usr/local/bin/containerd-shim-runc-v2 /usr/local/bin/containerd-stress /usr/local/bin/ctr /usr/local/bin/runc
        systemctl daemon-reload
        systemctl enable --now buildkit
      when: install_nerdctl | bool and not _nerdctl_stat.stat.exists
      changed_when: true

    - name: Keep the node's containerd and runc the apt ones (drop nerdctl-full's bundled ones)
      # nerdctl-full also ships containerd (2.x) with a unit in /usr/local/lib/systemd/system that outranks the apt
      # package's, and runc 1.2.4 in /usr/local/bin, first on containerd's PATH - the node would run a different
      # containerd and runc than production (Debian's runc 1.1.15, then containerd.io's). Only its CLI and buildkit
      # are wanted (buildkit's worker finds the apt runc). The install above removes them before anything starts;
      # this covers a node installed before that.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/lib/systemd/system/containerd.service
        - /usr/local/bin/containerd
        - /usr/local/bin/containerd-shim-runc-v2
        - /usr/local/bin/containerd-stress
        - /usr/local/bin/ctr
        - /usr/local/bin/runc
      when: install_nerdctl | bool
      notify: Reload systemd units

    - name: Apply the systemd reload now (before containerd is configured and restarted)
      ansible.builtin.meta: flush_handlers

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Stat containerd config before regen (change detection for the restart)
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
        checksum_algorithm: sha1
      register: _ctd_before

    - name: Generate default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      changed_when: true

    - name: Enable SystemdCgroup in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Set containerd CRI registry config_path
      # The default config already has an empty registry config_path - 1.7 (ten) writes
      #   [plugins."io.containerd.grpc.v1.cri".registry] config_path = ""
      # and 2.x writes [plugins.'io.containerd.cri.v1.images'.registry] config_path = ''.
      # Edit it in place (don't append - a duplicate table is a TOML error). Set, it makes the CRI read
      # /etc/containerd/certs.d/<host>/hosts.toml, which the Vagrant tests need for their plain-HTTP registry.
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: "^(\\s*)config_path = (''|\"\")$"
        replace: "\\1config_path = \"{{ containerd_registry_config_path }}\""
      when: containerd_registry_config_path | length > 0

    - name: Create /opt/cni/bin (the link's target, filled later by kubernetes-cni and Cilium)
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Point Debian containerd's CNI plugin dir at /opt/cni/bin
      # Debian's containerd default config looks for CNI plugins in /usr/lib/cni (bin_dir), while the CNI installers
      # (Cilium's cilium-cni, the kubernetes-cni package) put them in /opt/cni/bin: without this link no pod gets a
      # network ("failed to find plugin cilium-cni in path [/usr/lib/cni]"). ten has had exactly this link since the
      # kubeadm migration (2026-03-30), made by hand and never in this playbook until a Vagrant rebuild hit it.
      ansible.builtin.file:
        src: /opt/cni/bin
        dest: /usr/lib/cni
        state: link

    - name: Create /etc/containerd/certs.d
      ansible.builtin.file:
        path: /etc/containerd/certs.d
        state: directory
        mode: '0755'

    - name: Stat containerd config after regen
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
        checksum_algorithm: sha1
      register: _ctd_after

    - name: Restart containerd (only when the config actually changed)
      # Avoids restarting containerd — and thus every container on the node — on a
      # re-run where the regenerated config is byte-identical to the live one.
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true
      when: (not _ctd_before.stat.exists) or (_ctd_before.stat.checksum != _ctd_after.stat.checksum)

    # Pre-pull the heaviest CNI/mesh/storage images into containerd's k8s.io
    # namespace, with ansible-native retries, BEFORE their deadline-gated Helm
    # installs later in this play. A slow or transient cold pull then can't trip
    # a Deployment progress deadline (the observed DR-drill flake mode). Best
    # effort (failed_when:false): a miss just falls back to the lazy pull at
    # pod-schedule time, i.e. today's behaviour.
    - name: Pre-pull heavy provisioning images (retried, decoupled from helm waits)
      ansible.builtin.command: "ctr -n k8s.io images pull {{ item }}"
      loop:
        - "quay.io/cilium/cilium:v{{ cilium_version }}"
        - "quay.io/cilium/operator-generic:v{{ cilium_version }}"
        - "docker.io/istio/pilot:{{ istio_version }}"
        - "docker.io/istio/proxyv2:{{ istio_version }}"
        - "docker.io/rancher/local-path-provisioner:{{ local_path_provisioner_version }}"
      loop_control: { label: "{{ item }}" }
      register: _prepull
      retries: 6
      delay: 15
      until: _prepull is succeeded
      changed_when: true
      failed_when: false
      tags: [cilium, local-path]  # an upgrade of either pre-pulls its new images too

    # ================================================================
    # Phase 2: Install kubeadm, kubelet, kubectl
    # ================================================================

    - name: Add Kubernetes apt key  # noqa: command-instead-of-module risky-shell-pipe
      ansible.builtin.shell: |
        set -euo pipefail
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL --max-time 120 https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key -o "$tmp/Release.key"
        gpg --batch --dearmor -o "$tmp/keyring.gpg" "$tmp/Release.key"
        install -m 0644 "$tmp/keyring.gpg" /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        executable: /bin/bash
      changed_when: true

    - name: Add Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /
        mode: '0644'

    - name: Install kubeadm, kubelet, kubectl, kubernetes-cni, cri-tools
      ansible.builtin.apt:
        name:
          - "kubeadm={{ k8s_package_version }}"
          - "kubelet={{ k8s_package_version }}"
          - "kubectl={{ k8s_package_version }}"
          - "kubernetes-cni={{ k8s_cni_version }}"
          # crictl: kubeadm pulled it in up to 1.35, not from 1.36 (the minor's, as upgrade-kubeadm.yml leaves a node)
          - "cri-tools={{ k8s_cri_tools_version }}"
        state: present
        update_cache: true
        allow_change_held_packages: true

    - name: Kubelet node IP (the cluster address, as kubeadm init advertises it)
      # Without --node-ip the kubelet takes the default-route interface: ten has only one, but a Vagrant VM's is
      # libvirt NAT, so the node's InternalIP was 192.168.121.x and node-addressed traffic (hubble-peer -> the Cilium
      # agent) timed out. Explicit, it is the same address on ten and the right one everywhere.
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
        mode: '0644'
      notify: Restart kubelet

    # all five: an apt upgrade on the node moved the CNI plugins and crictl past the minor's pins otherwise
    - name: Hold kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl
        - kubernetes-cni
        - cri-tools

    # ================================================================
    # Phase 3: Kernel prerequisites
    # ================================================================

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        persistent: present
      loop:
        - br_netfilter
        - overlay

    - name: Set sysctl for kubernetes
      ansible.builtin.shell: |
        params="net.bridge.bridge-nf-call-iptables=1 net.bridge.bridge-nf-call-ip6tables=1"
        params="$params net.ipv4.ip_forward=1 fs.aio-max-nr=1048576 vm.max_map_count=524288"
        for param in $params; do
          sysctl -w "$param"
        done
        cat > /etc/sysctl.d/99-kubernetes.conf <<'EOF'
        net.bridge.bridge-nf-call-iptables = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward = 1
        fs.aio-max-nr = 1048576
        vm.max_map_count = 524288
        EOF
        sysctl --system
      changed_when: true

    # ================================================================
    # Phase 3b: Base firewall rules (survives CNI removal/crash)
    # ================================================================

    - name: Write base nftables config
      ansible.builtin.copy:
        dest: /etc/nftables.conf
        mode: '0644'
        content: |
          #!/usr/sbin/nft -f
          # Base firewall rules — survives CNI removal/crash
          # CNI (Calico/Cilium) adds its own tables on top

          table ip base-filter {
            chain input {
              type filter hook input priority -10; policy accept;
              ct state established,related accept
              iif lo accept
              tcp dport 22 accept
              tcp dport 6443 accept
              icmp type echo-request accept
            }
            chain forward {
              type filter hook forward priority -10; policy accept;
            }
            chain output {
              type filter hook output priority -10; policy accept;
            }
          }

    - name: Enable and start nftables
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started

    # ================================================================
    # Phase 4: Initialize cluster
    # ================================================================

    - name: Check whether the cluster is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: _admin_conf

    - name: Initialize kubeadm cluster
      # Guarded so this one-shot bootstrap is re-runnable: a re-run on an already
      # initialized cluster would otherwise fail at preflight (Port 6443 in use,
      # manifests/etcd dir exist) and abort the whole play.
      ansible.builtin.shell: |
        kubeadm init \
          --kubernetes-version=v{{ k8s_package_version | regex_replace('-.*$', '') }} \
          --pod-network-cidr={{ pod_cidr }} \
          --service-cidr={{ service_cidr }} \
          --apiserver-advertise-address={{ node_ip }} \
          --skip-phases=addon/kube-proxy
      register: kubeadm_init
      changed_when: true
      when: not _admin_conf.stat.exists

    - name: Create .kube directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0700'

    - name: Copy kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: '0600'

    - name: Copy kubeconfig for non-root user
      ansible.builtin.shell: |
        set -o pipefail
        USER_HOME=$(getent passwd {{ ansible_user }} | cut -d: -f6)
        mkdir -p "$USER_HOME/.kube"
        cp /etc/kubernetes/admin.conf "$USER_HOME/.kube/config"
        chown {{ ansible_user }}:{{ ansible_user }} "$USER_HOME/.kube/config"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Remove control-plane taint (single node)
      ansible.builtin.shell: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true
      changed_when: true

    - name: Configure node tuning (kubelet graceful shutdown)
      # Shared, idempotent, re-runnable node config (single source of truth in
      # tasks/node-config.yml) — also runnable standalone on a live node via
      # configure-node.yml (`task deploy:node-config`), without re-running this
      # one-shot bootstrap.
      ansible.builtin.include_tasks: tasks/node-config.yml

    # ================================================================
    # Phase 4b: Lower terminated-pod-gc-threshold (default 12500 means
    # Failed pods accumulate forever and poison Argo's resource health
    # walk; 100 is enough breathing room without letting them pile up
    # for hours after a node reboot)
    # ================================================================

    - name: Ensure --terminated-pod-gc-threshold=100 in controller-manager manifest
      ansible.builtin.lineinfile:
        path: /etc/kubernetes/manifests/kube-controller-manager.yaml
        insertafter: '    - --use-service-account-credentials=true'
        line: '    - --terminated-pod-gc-threshold=100'
        state: present

    - name: Persist --terminated-pod-gc-threshold in kubeadm-config so upgrades preserve it
      ansible.builtin.shell: |
        set -o pipefail
        # Idempotent: only patch if not already set
        if kubectl -n kube-system get cm kubeadm-config -o yaml \
            | grep -q 'terminated-pod-gc-threshold'; then
          echo unchanged
          exit 0
        fi
        kubectl -n kube-system get cm kubeadm-config -o json | \
          python3 -c '
        import json, sys, yaml
        cm = json.loads(sys.stdin.read())
        cluster_cfg = yaml.safe_load(cm["data"]["ClusterConfiguration"])
        cm_args = cluster_cfg.setdefault("controllerManager", {}).setdefault("extraArgs", [])
        # extraArgs in v1beta4 is a list of {name, value}; pre-v1beta4 was a dict
        if isinstance(cm_args, dict):
            cm_args["terminated-pod-gc-threshold"] = "100"
        else:
            cm_args.append({"name": "terminated-pod-gc-threshold", "value": "100"})
        cm["data"]["ClusterConfiguration"] = yaml.safe_dump(cluster_cfg, default_flow_style=False)
        print(json.dumps(cm))
        ' | kubectl apply -f -
        echo patched
      args:
        executable: /bin/bash
      register: _gc_patch
      changed_when: "'patched' in _gc_patch.stdout"

    # ================================================================
    # Phase 5: kube-proxy (OFF by default — Cilium runs kubeProxyReplacement)
    # ================================================================
    # Cilium installs with kubeProxyReplacement: true (eBPF), so kube-proxy is
    # redundant and NOT installed — prod runs with none and routes fine. Set
    # install_kube_proxy=true only for an environment that genuinely needs it.

    - name: Install kube-proxy via kubeadm
      ansible.builtin.shell: |
        kubeadm init phase addon kube-proxy --apiserver-advertise-address={{ node_ip }}
      changed_when: true
      when: install_kube_proxy | default(false) | bool

    - name: Set kube-proxy to nftables mode  # noqa: risky-shell-pipe
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get configmap kube-proxy -n kube-system -o json | \
          python3 -c "import json,sys; cm=json.loads(sys.stdin.read()); \
            cc=cm['data']['config.conf']; \
            cm['data']['config.conf']=cc.replace('mode: \"\"','mode: \"nftables\"'); \
            print(json.dumps(cm))" | \
          kubectl apply -f -
        kubectl rollout restart daemonset kube-proxy -n kube-system
        kubectl rollout status daemonset kube-proxy -n kube-system --timeout=300s
      args:
        executable: /bin/bash
      changed_when: true
      when: install_kube_proxy | default(false) | bool

    # ================================================================
    # Phase 5b: Install Helm
    # ================================================================

    # a pinned release - ten's own (its binary's sha256 read on ten 2026-10-08, equal to this release's) - its sum
    # checked before anything is installed: get-helm-3 from main piped to bash gave the copy's kubeadm VM, made at each
    # full run, whatever Helm it installed, unchecked
    - name: Install Helm
      vars:
        helm_version: v3.20.0
        helm_sha256: dbb4c8fc8e19d159d1a63dda8db655f9ffa4aac1b9a6b188b34a40957119b286
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "REFUSED: Helm's pinned release is amd64's - this host is $(uname -m)"; exit 1; }
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          curl -fsSL --max-time 120 -o "$d/helm.tgz" "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
          echo "{{ helm_sha256 }}  $d/helm.tgz" | sha256sum -c --quiet
          tar -xzf "$d/helm.tgz" -C "$d" linux-amd64/helm
          install -m 0755 "$d/linux-amd64/helm" /usr/local/bin/helm
        creates: /usr/local/bin/helm

    # ================================================================
    # Phase 6: Install Cilium CNI
    # ================================================================

    # force_update refreshes the repo's index: an existing repo is otherwise never refreshed, and ten's index (April)
    # lists neither 1.19.8 nor 1.20.2 (2026-10-04)
    - name: Add Cilium Helm repo
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/
        force_update: true
      tags: [cilium]  # an upgrade runs just the Cilium tasks: --tags cilium -e cilium_version=...

    - name: The running Cilium release
      check_mode: false
      ansible.builtin.command: helm --kubeconfig /etc/kubernetes/admin.conf -n kube-system list --filter '^cilium$' -o json
      register: _cilium_release
      changed_when: false
      tags: [cilium]

    # A setting made in cilium-config by hand is dropped by the next upgrade, silently (ten's socketLB one was, until
    # these values carried it). Before an upgrade the values render the running chart's cilium-config on the node's
    # Helm, and it must be the live one, key for key.
    - name: Cilium's live config is what these values render for the running chart (nothing set by hand)
      when: _cilium_release.stdout | from_json | length > 0
      vars:
        _running_chart: "{{ (_cilium_release.stdout | from_json | first).chart | regex_replace('^cilium-', '') }}"
      tags: [cilium]
      block:
        - name: The running chart's cilium-config, rendered from these values
          check_mode: false
          ansible.builtin.command:
            argv: [helm, template, cilium, cilium/cilium, --version, "{{ _running_chart }}", --namespace, kube-system,
                   --values, '-', --show-only, templates/cilium-configmap.yaml]
            stdin: "{{ cilium_values | to_nice_yaml }}"
          register: _cilium_rendered
          changed_when: false

        - name: The live cilium-config
          kubernetes.core.k8s_info:
            kubeconfig: /etc/kubernetes/admin.conf
            kind: ConfigMap
            namespace: kube-system
            name: cilium-config
          register: _cilium_live

        - name: The same, key for key
          vars:
            _rendered: "{{ (_cilium_rendered.stdout | from_yaml).data }}"
            _live: "{{ _cilium_live.resources[0].data | default({}) }}"
            _differ: >-
              {{ (_rendered | dict2items) | symmetric_difference(_live | dict2items) | map(attribute='key') | unique
                 | list }}
          ansible.builtin.assert:
            that: _differ | length == 0
            fail_msg: >-
              REFUSED: cilium-config differs from what cilium_values render for chart {{ _running_chart }} in
              {{ _differ | join(', ') }} - set by hand? An upgrade would drop it: carry it in cilium_values first
            quiet: true

    - name: Install Cilium via Helm
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: cilium
        chart_ref: cilium/cilium
        chart_version: "{{ cilium_version }}"
        release_namespace: kube-system
        values: "{{ cilium_values }}"
        wait: true
        wait_timeout: 180s
      tags: [cilium]

    - name: Wait for Cilium pods
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        kind: Pod
        namespace: kube-system
        label_selectors:
          - k8s-app=cilium
      register: cilium_wait
      retries: 12
      delay: 10
      until:
        - cilium_wait.resources | length > 0
        - >-
          cilium_wait.resources
          | map(attribute='status.conditions', default=[])
          | map('selectattr', 'type', 'equalto', 'Ready')
          | map('selectattr', 'status', 'equalto', 'True')
          | map('list') | map('length') | min > 0
      tags: [cilium]

    # ================================================================
    # Phase 6b: Install Istio service mesh
    # ================================================================

    - name: Add Istio Helm repo
      kubernetes.core.helm_repository:
        name: istio
        repo_url: https://blob.istio.io/istio-release/charts  # GCP-hosted repo retired (Istio 1.31); same charts
        force_update: true  # a host that registered the old URL under this name gets the new one

      when: not platform_by_argo | bool
    - name: Install Istio base (CRDs)
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: istio-base
        chart_ref: istio/base
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        create_namespace: true
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    # the Istio values from production's main: a local main behind origin's (CD pushed meanwhile) or with commits never
    # pushed installed other values than production runs - refused; a ref given on purpose is read as given
    - name: Infra's local main is origin's (the Istio values read from it)
      ansible.builtin.shell: |
        set -euo pipefail
        git -C {{ infra_dir | quote }} fetch -q origin main
        [ "$(git -C {{ infra_dir | quote }} rev-parse main)" = "$(git -C {{ infra_dir | quote }} rev-parse origin/main)" ] \
          || { echo "REFUSED: the main of {{ infra_dir }} is not origin/main - pull it first"; exit 1; }
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      check_mode: false
      when: infra_values_ref == 'main' and not platform_by_argo | bool

    - name: Install Istiod (control plane)
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: istiod
        chart_ref: istio/istiod
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        # Argo CD's own values (infra's main, next to ops), so Argo's later sync of them changes nothing
        values: >-
          {{ lookup('ansible.builtin.pipe', 'git -C ' ~ (infra_dir | quote) ~ ' show ' ~ (infra_values_ref
                    ~ ':clusters/production/istio/istiod-values.yaml') | quote) | from_yaml }}
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    - name: Install Istio CNI
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: istio-cni
        chart_ref: istio/cni
        chart_version: "{{ istio_version }}"
        release_namespace: istio-system
        values: >-
          {{ lookup('ansible.builtin.pipe', 'git -C ' ~ (infra_dir | quote) ~ ' show ' ~ (infra_values_ref
                    ~ ':clusters/production/istio/cni-values.yaml') | quote) | from_yaml }}
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    - name: Wait for Istiod
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        kind: Pod
        namespace: istio-system
        label_selectors:
          - app=istiod
      register: istiod_wait
      retries: 12
      delay: 10
      until:
        - istiod_wait.resources | length > 0
        - >-
          istiod_wait.resources
          | map(attribute='status.conditions', default=[])
          | map('selectattr', 'type', 'equalto', 'Ready')
          | map('selectattr', 'status', 'equalto', 'True')
          | map('list') | map('length') | min > 0

      when: not platform_by_argo | bool
    # ================================================================
    # Phase 7: Install local-path-provisioner
    # ================================================================

    # The manifest replaces local-path-config: a node path set there by hand would be dropped, and new volumes would
    # land elsewhere. So the live paths must be the ones this playbook knows (ten 2026-10-04: upstream's default), and
    # the manifest's own too - read from the file before it is applied (once applied, the provisioner takes the new
    # paths at once) - and the same file is what gets applied.
    - name: The live local-path node paths are the expected ones (the manifest replaces them)
      check_mode: false
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n local-path-storage get configmap local-path-config \
            --ignore-not-found -o jsonpath='{.data.config\.json}' \
            | python3 -c 'import json, sys; t = sys.stdin.read().strip(); print(json.dumps(json.loads(t)["nodePathMap"], sort_keys=True) if t else "none")'
      register: _lpp_paths_before
      changed_when: false
      failed_when: >-
        _lpp_paths_before.rc != 0
        or _lpp_paths_before.stdout not in ['none', local_path_node_paths | to_json(sort_keys=True)]
      tags: [local-path]

    - name: The local-path-provisioner manifest of the version, downloaded
      # in a preview (--check) too: the checks below and the dry-run apply read it (a file under /root, nothing else)
      check_mode: false
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_provisioner_version }}/deploy/local-path-storage.yaml
        dest: /root/local-path-storage-{{ local_path_provisioner_version }}.yaml
        mode: '0600'
      tags: [local-path]

    - name: The manifest's node paths are the expected ones (before anything is applied)
      check_mode: false
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig /etc/kubernetes/admin.conf create --dry-run=client -o json \
            -f /root/local-path-storage-{{ local_path_provisioner_version }}.yaml | python3 -c '
          import json, sys
          # one JSON document per object, one after the other (not a List)
          text, dec, i, items = sys.stdin.read(), json.JSONDecoder(), 0, []
          while i < len(text.rstrip()):
              doc, i = dec.raw_decode(text, i)
              items.append(doc)
              while i < len(text) and text[i].isspace():
                  i += 1
          cm = [i for i in items if i["kind"] == "ConfigMap" and i["metadata"]["name"] == "local-path-config"]
          print(json.dumps(json.loads(cm[0]["data"]["config.json"])["nodePathMap"], sort_keys=True) if cm else "none")'
      register: _lpp_paths_manifest
      changed_when: false
      failed_when: >-
        _lpp_paths_manifest.rc != 0 or _lpp_paths_manifest.stdout != local_path_node_paths | to_json(sort_keys=True)
      tags: [local-path]

    - name: Install local-path-provisioner (Rancher's manifest, as on ten - the file just checked)
      # ten runs the upstream manifest applied with kubectl (namespace local-path-storage, StorageClass local-path,
      # not the default class), not a Helm release. The downstream wait polls the deployment, so a cold image pull
      # does not have to fit a timeout here.
      # a preview (--check) applies it as a server-side dry run (admitted or refused, nothing written)
      check_mode: false
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply {{ '--dry-run=server' if ansible_check_mode else '' }}
        -f /root/local-path-storage-{{ local_path_provisioner_version }}.yaml
      register: _lpp_apply
      changed_when: "'created' in _lpp_apply.stdout or 'configured' in _lpp_apply.stdout"
      tags: [local-path]  # an upgrade runs the local-path tasks: --tags local-path -e local_path_provisioner_version=...

    - name: The node paths after the apply are the expected ones still
      when: not ansible_check_mode
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig /etc/kubernetes/admin.conf -n local-path-storage get configmap local-path-config \
            -o jsonpath='{.data.config\.json}' \
            | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin)["nodePathMap"], sort_keys=True))'
      register: _lpp_paths_after
      changed_when: false
      failed_when: _lpp_paths_after.rc != 0 or _lpp_paths_after.stdout != local_path_node_paths | to_json(sort_keys=True)
      tags: [local-path]

    - name: Make local-path the default StorageClass (Vagrant tests; not on ten)
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf patch storageclass local-path -p
        '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      register: _lpp_default
      changed_when: "'no change' not in _lpp_default.stdout"
      when: local_path_default_class | bool
      tags: [local-path]

    - name: Wait for local-path-provisioner deployment to be Ready (up to 15 min)
      # rolled out, not just ready: on an upgrade the old pod stays ready until the new one replaces it
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        name: local-path-provisioner
        namespace: local-path-storage
      register: _lpp
      retries: 180
      delay: 10
      until:
        - _lpp.resources | default([]) | length > 0
        - (_lpp.resources[0].status.observedGeneration | default(0)) == _lpp.resources[0].metadata.generation
        - (_lpp.resources[0].status.updatedReplicas | default(0)) == _lpp.resources[0].spec.replicas
        - (_lpp.resources[0].status.readyReplicas | default(0)) == _lpp.resources[0].spec.replicas
        - (_lpp.resources[0].status.unavailableReplicas | default(0)) == 0
      tags: [local-path]

    # ================================================================
    # Phase 7b: PriorityClasses (production-aligned; tests reference them)
    # ================================================================

    - name: Create PriorityClass infra-critical
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        definition:
          apiVersion: scheduling.k8s.io/v1
          kind: PriorityClass
          metadata:
            name: infra-critical
          value: 1000000
          preemptionPolicy: PreemptLowerPriority
          description: "Infrastructure: cert-manager, external-secrets, operators"

    - name: Create PriorityClass data-critical
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        definition:
          apiVersion: scheduling.k8s.io/v1
          kind: PriorityClass
          metadata:
            name: data-critical
          value: 500000
          preemptionPolicy: PreemptLowerPriority
          description: "Data stores: PostgreSQL, Kafka, Valkey, ScyllaDB, MinIO"

    - name: Create PriorityClass app-default
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        definition:
          apiVersion: scheduling.k8s.io/v1
          kind: PriorityClass
          metadata:
            name: app-default
          value: 100000
          globalDefault: true
          preemptionPolicy: PreemptLowerPriority
          description: "Application workloads"

    # ================================================================
    # Phase 8: Install metrics-server
    # ================================================================

    - name: Add metrics-server Helm repo
      kubernetes.core.helm_repository:
        name: metrics-server
        repo_url: https://kubernetes-sigs.github.io/metrics-server/

      when: not platform_by_argo | bool
    - name: Install metrics-server
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: metrics-server
        chart_ref: metrics-server/metrics-server
        chart_version: "{{ metrics_server_chart_version }}"
        release_namespace: kube-system
        values:
          args:
            - --kubelet-insecure-tls
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    # ================================================================
    # Phase 9: Install cert-manager
    # ================================================================

    - name: Add Jetstack Helm repo
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

      when: not platform_by_argo | bool
    - name: Install cert-manager
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ cert_manager_version }}"
        release_namespace: cert-manager
        create_namespace: true
        values:
          crds:
            enabled: true
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    # ================================================================
    # Phase 10: Install Gateway API CRDs
    # ================================================================

    - name: Install Gateway API CRDs
      # Server-side, as Gateway API's own upgrade instructions say: a client-side apply keeps the whole CRD in an
      # annotation, which the larger CRDs of later releases overflow. --force-conflicts takes over the fields an
      # earlier client-side apply owns (ten's v1.2.1 was applied that way).
      # A preview (--check) applies it as a server-side dry run: the API server admits or refuses the bundle (the
      # safe-upgrades policy, field conflicts) and writes nothing.
      check_mode: false
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side --force-conflicts
        {{ '--dry-run=server' if ansible_check_mode else '' }}
        -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
      changed_when: not ansible_check_mode
      tags: [gateway-api]  # an upgrade runs just this: --tags gateway-api -e gateway_api_version=...

    # ================================================================
    # Phase 11: Install ESO
    # ================================================================

    - name: Add External Secrets Helm repo
      kubernetes.core.helm_repository:
        name: external-secrets
        repo_url: https://charts.external-secrets.io
      when: external_secrets_by_helm | bool

    - name: Install External Secrets Operator
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: external-secrets
        chart_ref: external-secrets/external-secrets
        chart_version: "{{ external_secrets_chart_version }}"
        release_namespace: external-secrets
        create_namespace: true
        wait: true
        wait_timeout: 300s
      when: external_secrets_by_helm | bool

    - name: Add Prometheus Operator CRDs Helm repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    # Install only the CRDs (PodMonitor, ServiceMonitor, Probe, etc.)
    # so schnappy-observability's monitoring resources can be applied
    # in tests. Production installs the full kube-prometheus-stack via
    # ArgoCD; Vagrant tests just need the CRDs.
      when: not platform_by_argo | bool
    - name: Install Prometheus Operator CRDs
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: prometheus-operator-crds
        chart_ref: prometheus-community/prometheus-operator-crds
        chart_version: "{{ prometheus_operator_crds_chart_version }}"
        release_namespace: monitoring
        create_namespace: true
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    # ================================================================
    # Phase 13: Install database/streaming operators
    # ================================================================

    - name: Add CNPG Helm repo
      kubernetes.core.helm_repository:
        name: cnpg
        repo_url: https://cloudnative-pg.github.io/charts

      when: not platform_by_argo | bool
    - name: Install CNPG operator
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: cnpg
        chart_ref: cnpg/cloudnative-pg
        chart_version: "0.28.0"
        release_namespace: cnpg-system
        create_namespace: true
        values:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    - name: Add Strimzi Helm repo
      kubernetes.core.helm_repository:
        name: strimzi
        repo_url: https://strimzi.io/charts/

      when: not platform_by_argo | bool
    - name: Install Strimzi operator
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: strimzi
        chart_ref: strimzi/strimzi-kafka-operator
        chart_version: "0.51.0"
        release_namespace: strimzi
        create_namespace: true
        values:
          # Watch all namespaces — by default the operator watches only
          # its own install namespace, which breaks any chart that
          # deploys a Kafka CR outside `strimzi` (e.g. `schnappy` in
          # the vagrant tests and in production).
          watchAnyNamespace: true
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    - name: Add ScyllaDB operator Helm repo
      kubernetes.core.helm_repository:
        name: scylla-operator
        repo_url: https://scylla-operator-charts.storage.googleapis.com/stable

      when: not platform_by_argo | bool
    - name: Install ScyllaDB operator
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: scylla-operator
        chart_ref: scylla-operator/scylla-operator
        chart_version: "1.20.2"
        release_namespace: scylla-operator
        create_namespace: true
        wait: true
        wait_timeout: 300s

      when: not platform_by_argo | bool
    - name: Install ScyllaDB Manager
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: scylla-manager
        chart_ref: scylla-operator/scylla-manager
        chart_version: "1.20.2"
        release_namespace: scylla-manager
        create_namespace: true
        values: "{{ scylla_manager_values }}"
        wait: true
        wait_timeout: 15m
      when: not platform_by_argo | bool and install_scylla_manager | default(true) | bool

    # Valkey operator (replaces the hand-rolled redis Deployment).
    # The chart still renders a hand-rolled Deployment when
    # valkey.operator.enabled=false, so installing the operator here is
    # safe even if no Valkey CR is applied yet.
    #
    # The chart ships only as an OCI artifact on ghcr.io (the old
    # gh-pages Helm repo at hyperspike.github.io/valkey-operator is gone).
    # The chart tag carries a `-chart` suffix; the bare semver tag is the
    # operator container image, not the chart.
    - name: Install valkey-operator
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        name: valkey-operator
        chart_ref: oci://ghcr.io/hyperspike/valkey-operator
        chart_version: "v0.0.61-chart"
        release_namespace: valkey-operator-system
        create_namespace: true
        wait: true
        wait_timeout: 300s
      when: not platform_by_argo | bool and install_valkey_operator | default(true) | bool

    # ================================================================
    # Phase 14: Configure HAProxy
    # ================================================================

    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present

    - name: HAProxy will be configured after Istio gateway is deployed
      ansible.builtin.debug:
        msg: "HAProxy config will be updated once Istio gateway NodePorts are known"

    - name: "KUBEADM CLUSTER READY"
      ansible.builtin.debug:
        msg: |
          Kubernetes cluster initialized:
            - API server: https://{{ node_ip }}:6443
            - CNI: Cilium {{ cilium_version }}
            - Mesh: Istio {{ istio_version }}
            - Operators: CNPG, Strimzi, ScyllaDB
            - StorageClass: local-path
          Next steps:
            1. Install Pi Vault (setup-vault-pi.yml) — Consul backend on both Pis
            2. Install ArgoCD (setup-argocd.yml)
            3. Seed secrets (deploy:seed-secrets)

  handlers:
    - name: Reload systemd units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted
