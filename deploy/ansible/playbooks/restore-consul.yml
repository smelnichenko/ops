---
# The way back from upgrade-consul.yml: Consul's whole state (Vault's storage, Patroni's keys, the locks) back from the
# snapshot upgrade-consul.yml took on pi1 before it touched a server, on the binary it kept (/usr/local/bin/consul-<version>)
# on all three servers (pi1, pi2, ten). An old binary may not read a raft directory the new one wrote, and `consul snapshot
# restore` needs a cluster on the snapshot's version, so the servers start again as a new cluster on the old binary and the
# snapshot goes into it. Around that: the tier-0 backup and the restore check kept off (both hold Consul locks); Patroni
# paused, then stopped on both Pis - paused, it leaves Postgres running and serving (unmanaged: no failover, and HAProxy's
# check marks the primary down without Patroni's REST - the database away through it until Patroni is back); Vault stopped
# and off at a boot. Each server's data directory is set aside, never deleted (its node-id and gossip keyring kept: the
# catalog names each node by its id, and the keyring is the one the servers use). After the restore, Patroni's leader and
# member keys from the snapshot are deleted - their sessions died with the old cluster, and a leader key naming the other Pi
# would demote the running primary - then Patroni starts on the primary's Pi first, the replica after; Vault started and
# unsealed. Everything written to Consul since the snapshot is lost - Vault's secrets too: the end says what to run again.
# First revert the unit (setup-consul.yml's consul_version back to the old pin): refused until it is the snapshot's
# version. Confirmed by naming the snapshot. From the stop on, a failure says where everything was left and what to run.
# A run again after a failure takes up where it stopped (Patroni already stopped: no pause wanted; the data set aside again).
#
# Usage: task deploy:consul:way-back -- -e confirm=<the snapshot's file name>   (the copy rehearses it:
#        task test:copy:consul-way-back)
- name: Consul's way back - its whole state from the pre-upgrade snapshot, its old binary back
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    _setup: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/setup-consul.yml') | from_yaml)[0].vars }}"
    consul_version: "{{ _setup.consul_version }}"
    patroni_scope: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/setup-patroni.yml') | from_yaml)[0].vars.patroni_scope }}"
    consul_servers: [pi1, pi2, target]
    upgrade_dir: /var/backups/consul-upgrade
    consul_http: http://127.0.0.1:8500
    consul_data: /var/lib/consul/data
    vault_api: https://127.0.0.1:8200
    patronictl: patronictl -c /etc/patroni/patroni.yml
    # Consul locks the Pis' own jobs take (setup-pi-backups, setup-pi-restore-check): kept off while Consul is replaced
    consul_lock_jobs: [pi-tier0-backup, pi-restore-check]
    # a leader running, every other member streaming with no lag left (upgrade-patroni.yml's)
    healthy_py: |
      import json, sys
      m = json.load(sys.stdin)
      leaders = [x for x in m if x["Role"] == "Leader" and x["State"] == "running"]
      others = [x for x in m if x["Role"] != "Leader"]
      ok = len(leaders) == 1 and others and all(x["State"] == "streaming" and x.get("Replay Lag", 1) == 0 for x in others)
      print(("HEALTHY " if ok else "NOT HEALTHY ") + ", ".join("%s %s %s" % (x["Member"], x["Role"], x["State"]) for x in m))
      sys.exit(0 if ok else 1)
  tasks:
    - name: Every server in the run (one left out would keep the new binary beside the restored state)
      ansible.builtin.assert:
        that: consul_servers | difference(ansible_play_hosts) | length == 0
        fail_msg: "REFUSED: Consul's servers {{ consul_servers }}, the run has {{ ansible_play_hosts }} - nothing stopped"
        quiet: true
      run_once: true

    # by name, which leads with its UTC time - never by a file's mtime
    - name: The newest snapshot on pi1
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          shopt -s nullglob
          snaps=({{ upgrade_dir }}/consul-*.snap)
          [ -z "${snaps[0]-}" ] || printf '%s\n' "${snaps[@]}" | LC_ALL=C sort | tail -n 1
      register: _newest
      changed_when: false
      check_mode: false
      delegate_to: pi1
      run_once: true
      when: consul_restore_snapshot is not defined

    - name: The snapshot restored - the one given (on pi1), or the newest - and the version it ran
      ansible.builtin.set_fact:
        _snap: "{{ _snap_path }}"
        _snap_version: >-
          {{ _snap_path | basename | regex_search('^consul-[0-9]{8}T[0-9]{6}Z-(.+)[.]snap$', '\1') | default([''], true) | first }}
      vars:
        _snap_path: "{{ consul_restore_snapshot | default(_newest.stdout | default('')) }}"
      run_once: true

    - name: A snapshot and its version known - else nothing stopped
      ansible.builtin.assert:
        that:
          - _snap | length > 0
          - _snap_version is match('^[0-9][0-9A-Za-z.+-]*$')
        fail_msg: "REFUSED: no Consul snapshot to restore (path '{{ _snap }}' on pi1, version '{{ _snap_version }}') - nothing stopped"
        success_msg: "restoring {{ _snap }} (pi1), Consul {{ _snap_version }}"
      run_once: true

    - name: The unit reverted first - setup-consul.yml pins the snapshot's version
      ansible.builtin.assert:
        that: consul_version == _snap_version
        fail_msg: >-
          REFUSED: setup-consul.yml pins {{ consul_version }}, the snapshot ran {{ _snap_version }} - revert the unit first
          (setup-consul and upgrade-consul would move it again): nothing stopped
        quiet: true
      run_once: true

    - name: Confirmed by naming the snapshot (-e confirm=<its file name>)
      ansible.builtin.assert:
        that: (confirm | default('')) == (_snap | basename)
        fail_msg: >-
          REFUSED: restoring {{ _snap }} loses everything written to Consul since it was taken - Vault's secrets and
          Patroni's settings among it - confirm with -e confirm={{ _snap | basename }}: nothing stopped
        quiet: true
      run_once: true

    # the binary upgrade-consul.yml kept, and that it is the snapshot's version (the restore needs a cluster on it); a
    # rebuilt server has none - the refusal names the step
    - name: The snapshot's version's binary kept here, its version
      ansible.builtin.command:
        argv: ["/usr/local/bin/consul-{{ _snap_version }}", version]
      register: _kept
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Every server has it - else nothing stopped
      ansible.builtin.assert:
        that: >-
          _kept.rc | default(1) == 0
          and ((_kept.stdout_lines + [''])[0].split() + ['', ''])[1] | regex_replace('^v', '') == _snap_version
        fail_msg: >-
          REFUSED: /usr/local/bin/consul-{{ _snap_version }} on {{ inventory_hostname }} is gone or not that version
          ({{ _kept.stdout | default('') }}{{ _kept.stderr | default('') }}) - copy it from another server, or put Consul
          {{ _snap_version }}'s release there checked against setup-consul.yml's checksums: nothing stopped
        quiet: true

    # read by the binary that will restore it - a cut or foreign file refuses here, never after the servers stop
    - name: The snapshot there and readable by that binary - else nothing stopped
      ansible.builtin.command:
        argv: ["/usr/local/bin/consul-{{ _snap_version }}", snapshot, inspect, "{{ _snap }}"]
      changed_when: false
      check_mode: false
      delegate_to: pi1
      run_once: true

    # the primary named by Postgres itself (Patroni may be stopped by an earlier run of this play): exactly one Pi's
    # Postgres out of recovery - none, or two, is a look first
    - name: Postgres running here, and whether it is the primary
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          runuser -u postgres -- psql -w -h /var/run/postgresql -d postgres -Atc 'select not pg_is_in_recovery()'
      register: _pg_role
      changed_when: false
      failed_when: false
      check_mode: false
      when: inventory_hostname in groups['pis']

    - name: Exactly one primary, both Postgres running - else nothing stopped
      ansible.builtin.assert:
        that:
          - groups['pis'] | map('extract', hostvars, ['_pg_role', 'rc']) | list == [0] * (groups['pis'] | length)
          - groups['pis'] | map('extract', hostvars, ['_pg_role', 'stdout']) | select('equalto', 't') | list | length == 1
        fail_msg: >-
          REFUSED: Postgres on the Pis is not one primary and running replicas - {{ groups['pis'] | zip(groups['pis']
          | map('extract', hostvars, ['_pg_role', 'stdout'])) | list }} ({{ groups['pis'] | map('extract', hostvars,
          ['_pg_role', 'stderr']) | select | join('; ') }}) - look first: nothing stopped
        quiet: true
      run_once: true

    - name: The primary's Pi
      ansible.builtin.set_fact:
        _pg_primary: >-
          {{ groups['pis'] | zip(groups['pis'] | map('extract', hostvars, ['_pg_role', 'stdout'])) | selectattr('1', 'equalto', 't')
             | map(attribute='0') | first }}
      run_once: true

    - name: Patroni running here (an earlier run of this play may have stopped it)
      ansible.builtin.command:
        argv: [systemctl, is-active, patroni]
      register: _patroni_active
      changed_when: false
      failed_when: false
      check_mode: false
      when: inventory_hostname in groups['pis']

    - name: Whether any Patroni runs
      ansible.builtin.set_fact:
        _patroni_runs: "{{ groups['pis'] | map('extract', hostvars, ['_patroni_active', 'stdout']) | select('equalto', 'active') | list | length > 0 }}"
      run_once: true

    # someone's maintenance (or another run) has it paused: this run would end it with the restore - refused
    - name: Patroni not paused already, where it runs
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/scripts/patroni-pause.py check"
        executable: python3
      changed_when: false
      check_mode: false
      delegate_to: "{{ _pg_primary }}"
      run_once: true
      when: _patroni_runs | bool

    # a backup or a restore check holding its Consul lock would die with the servers mid-way - wait for it, run again
    - name: No job holding a Consul lock here now
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}.service"]
      register: _lock_jobs
      changed_when: false
      failed_when: _lock_jobs.stdout in ['active', 'activating', 'deactivating']
      check_mode: false
      loop: "{{ consul_lock_jobs }}"
      when: inventory_hostname in groups['pis']

    # from the first stop on, nothing is undone by this play: a failure lands in the rescue below, which says where
    # everything was left and what to run
    - name: The restore - from the first stop to everything serving
      block:
        - name: The Consul-locked jobs' timers here, before they are stopped
          ansible.builtin.command:
            argv: [systemctl, is-active, "{{ item }}.timer"]
          register: _lock_timers
          changed_when: false
          failed_when: false
          loop: "{{ consul_lock_jobs }}"
          when: inventory_hostname in groups['pis']

        - name: Their timers stopped (started again at the end where they ran)
          ansible.builtin.systemd:
            name: "{{ item.item }}.timer"
            state: stopped
          loop: "{{ _lock_timers.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stdout | default('') == 'active'

        - name: Patroni paused - stopped next, it leaves Postgres running
          # the marker names this run; the restore replaces it with the snapshot's state (no marker there), so nothing
          # resumes it after: Patroni starts again on the restored state
          ansible.builtin.script:
            cmd: "{{ playbook_dir }}/scripts/patroni-pause.py pause consul-way-back"
            executable: python3
          register: _paused
          changed_when: true
          delegate_to: "{{ _pg_primary }}"
          run_once: true
          when: _patroni_runs | bool

        - name: Patroni stopped on both Pis (paused - Postgres is not touched)
          ansible.builtin.systemd:
            name: patroni
            state: stopped
          when: inventory_hostname in groups['pis']

        - name: Postgres still running on both, the primary still the primary
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              [ "$(runuser -u postgres -- psql -w -h /var/run/postgresql -d postgres -Atc 'select not pg_is_in_recovery()')" \
                = "{{ 't' if inventory_hostname == _pg_primary else 'f' }}" ]
          changed_when: false
          when: inventory_hostname in groups['pis']

        - name: Vault stopped on both Pis (its unseal with it - Requires=)
          ansible.builtin.systemd:
            name: vault
            state: stopped
          when: inventory_hostname in groups['pis']

        # its unseal too - it would pull vault in at a boot (Requires=); both enabled again once Consul is restored
        - name: Neither started at a boot meanwhile (a Vault on a half-restored Consul never starts by itself)
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: false
          loop: [vault-unseal, vault]
          when: inventory_hostname in groups['pis']

        - name: Consul stopped on every server
          ansible.builtin.systemd:
            name: consul
            state: stopped

        - name: The time the data directories are set aside under
          ansible.builtin.set_fact:
            _aside: "{{ consul_data }}.pre-restore-{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
          run_once: true

        # never deleted - the way forward again; the node-id (the catalog's name for the node) and the gossip keyring (the
        # key the servers use - consul.hcl's is read only by an empty keyring) carried into the new directory
        - name: Its data directory set aside, a new one with the node's id and keyring
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              mv {{ consul_data }} {{ _aside }}
              install -d -o consul -g consul -m 0755 {{ consul_data }} {{ consul_data }}/serf
              [ ! -f {{ _aside }}/node-id ] || install -o consul -g consul -m 0600 {{ _aside }}/node-id {{ consul_data }}/node-id
              for k in local.keyring remote.keyring; do
                [ ! -f {{ _aside }}/serf/$k ] || install -o consul -g consul -m 0600 {{ _aside }}/serf/$k {{ consul_data }}/serf/$k
              done
          changed_when: true

        - name: The kept binary back
          ansible.builtin.copy:
            src: "/usr/local/bin/consul-{{ _snap_version }}"
            dest: /usr/local/bin/consul
            remote_src: true
            mode: '0755'

        - name: Started - a new cluster of three (bootstrap_expect)
          ansible.builtin.systemd:
            name: consul
            state: started

        - name: The new cluster - three voters, one leader
          ansible.builtin.uri:
            url: "{{ consul_http }}/v1/operator/autopilot/health"
            return_content: true
            status_code: [200, 429]
          register: _fresh
          retries: 30
          delay: 5
          until: >-
            _fresh.status in [200, 429]
            and _fresh.json.Servers | selectattr('Voter') | list | length == 3
            and _fresh.json.Servers | selectattr('Leader') | list | length == 1
          delegate_to: pi1
          run_once: true

        - name: The snapshot restored
          ansible.builtin.command:
            argv: [consul, snapshot, restore, "{{ _snap }}"]
          register: _restored
          changed_when: true
          delegate_to: pi1
          run_once: true

        - name: After it - three voters, one leader, autopilot healthy
          ansible.builtin.uri:
            url: "{{ consul_http }}/v1/operator/autopilot/health"
            return_content: true
            status_code: [200, 429]
          register: _after
          retries: 30
          delay: 5
          until: >-
            _after.status == 200 and _after.json.Healthy
            and _after.json.Servers | selectattr('Voter') | list | length == 3
            and _after.json.Servers | selectattr('Leader') | list | length == 1
          delegate_to: pi1
          run_once: true

        - name: Each agent on the snapshot's version
          ansible.builtin.uri:
            url: "{{ consul_http }}/v1/agent/self"
            return_content: true
          register: _self_after
          failed_when: _self_after.json.Config.Version != _snap_version

        # their sessions died with the old cluster; a leader key naming the other Pi would demote the running primary
        - name: Patroni's leader and member keys from the snapshot deleted
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              consul kv delete service/{{ patroni_scope }}/leader > /dev/null
              consul kv delete -recurse service/{{ patroni_scope }}/members/ > /dev/null
          changed_when: true
          delegate_to: pi1
          run_once: true

        - name: Patroni started on the primary's Pi first
          ansible.builtin.systemd:
            name: patroni
            state: started
          when: inventory_hostname == _pg_primary

        - name: It holds the leader key, Postgres still the primary
          ansible.builtin.uri:
            url: "{{ consul_http }}/v1/kv/service/{{ patroni_scope }}/leader?raw"
            return_content: true
            status_code: [200, 404]
          register: _leader_key
          retries: 30
          delay: 5
          until: _leader_key.status == 200 and _leader_key.content | trim == _pg_primary
          when: inventory_hostname == _pg_primary

        - name: Then on the replica
          ansible.builtin.systemd:
            name: patroni
            state: started
          when: inventory_hostname in groups['pis'] and inventory_hostname != _pg_primary

        - name: The cluster healthy - a leader running, the replica streaming
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              {{ patronictl }} list -f json | python3 -c '{{ healthy_py }}'
          register: _healthy
          retries: 24
          delay: 5
          until: _healthy.rc == 0
          changed_when: false
          delegate_to: "{{ _pg_primary }}"
          run_once: true

        # through HAProxy (:5000) and, where it runs, PgBouncer (:6432) - the port Forgejo and Keycloak use
        - name: The primary answering through HAProxy and PgBouncer, on every Pi
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              # the password on stdin, not in the environment Ansible puts on the command line
              read -r PGPASSWORD; export PGPASSWORD
              ports=5000
              [ "$(systemctl is-active pgbouncer 2>/dev/null || true)" = active ] && ports="5000 6432"
              for p in $ports; do
                [ "$(psql -w -h 127.0.0.1 -p "$p" -U postgres -d postgres -Atc 'select not pg_is_in_recovery()')" = t ]
              done
            stdin: "{{ postgres_admin_password }}"
          register: _primary
          retries: 12
          delay: 5
          until: _primary.rc == 0
          changed_when: false
          no_log: true  # the password went in on stdin
          when: inventory_hostname in groups['pis']

        - name: Vault and its unseal enabled again, as setup-vault-pi leaves them
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
          loop: [vault, vault-unseal]
          when: inventory_hostname in groups['pis']

        - name: Vault started
          ansible.builtin.systemd:
            name: vault
            state: started
          when: inventory_hostname in groups['pis']

        - name: Unsealed by the Pi's own script (bounded - its start timeout is 360 s)
          ansible.builtin.systemd:
            name: vault-unseal
            state: restarted
          timeout: 420
          when: inventory_hostname in groups['pis']

        - name: Vault unsealed - active or standby
          ansible.builtin.uri:
            url: "{{ vault_api }}/v1/sys/health"
            ca_path: /etc/vault.d/tls/ca-cert.pem  # its certificate names 127.0.0.1
            status_code: [200, 429]
          register: _vault
          retries: 24
          delay: 5
          until: _vault.status in [200, 429]
          when: inventory_hostname in groups['pis']

        - name: Each Vault sees a leader
          ansible.builtin.uri:
            url: "{{ vault_api }}/v1/sys/leader"
            ca_path: /etc/vault.d/tls/ca-cert.pem  # its certificate names 127.0.0.1
            return_content: true
          register: _vault_leader
          retries: 24
          delay: 5
          until: _vault_leader.status == 200 and _vault_leader.json.leader_address | length > 0
          when: inventory_hostname in groups['pis']

        - name: Exactly one Vault active, the same leader seen by both
          ansible.builtin.assert:
            that:
              - groups['pis'] | map('extract', hostvars, ['_vault_leader', 'json', 'is_self']) | select | list | length == 1
              - groups['pis'] | map('extract', hostvars, ['_vault_leader', 'json', 'leader_address']) | unique | list | length == 1
            fail_msg: "{{ groups['pis'] | map('extract', hostvars, ['_vault_leader', 'json']) | list | to_json }}"
            quiet: true
          run_once: true

        - name: The Consul-locked jobs' timers started again where they ran
          ansible.builtin.systemd:
            name: "{{ item.item }}.timer"
            state: started
          loop: "{{ _lock_timers.results | default([]) }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stdout | default('') == 'active'
      rescue:
        - name: Where the restore stopped, and what to run
          ansible.builtin.fail:
            msg: >-
              FAILED after the first stop, at "{{ ansible_failed_task.name | default('?') }}"
              ({{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('')) }}) - nothing is undone by
              this play. Patroni may be stopped on both Pis, Postgres running unmanaged on them ({{ _pg_primary }} the primary;
              no failover, the database away through HAProxy); Vault may be stopped and off at a boot; the backup and
              restore-check timers may be stopped; Consul's data as it stood is set aside in {{ _aside | default('(not yet -
              the failure came before it)') }} on each server; the snapshot {{ _snap }} (pi1) is untouched. Run task
              deploy:consul:way-back again with the same confirm (it takes up where this stopped). Forward again instead: stop
              Consul on all three, put each set-aside directory back as {{ consul_data }} and the new binary back as
              /usr/local/bin/consul, start Consul, then Patroni (on {{ _pg_primary }} first), Vault and its unseal

    - name: Restored - and what to run again (what changed since the snapshot is gone, or stale)
      ansible.builtin.debug:
        msg: >-
          CONSUL {{ _snap_version }} back on {{ ansible_play_hosts | join(', ') }} from {{ _snap }} (its data before set aside
          in {{ _aside }} on each server); Patroni's leader {{ _pg_primary }}, Vault unsealed (active
          {{ hostvars[groups['pis'] | first]._vault_leader.json.leader_address }}). Next: task deploy:ci-bot and task
          deploy:argocd-reader again (the Forgejo tokens they rotated since the snapshot are back in Vault, deleted in
          Forgejo), the preview environments made since it recreated, External Secrets force-synced (each ExternalSecret
          annotated force-sync) so the cluster reads the restored values, and any change made with patronictl edit-config
          since the snapshot made again (Patroni's dynamic settings are the snapshot's)
      run_once: true
