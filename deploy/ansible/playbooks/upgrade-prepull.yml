---
# The public images an upgrade step moves to, pulled into containerd on the node before each of the step's merges
# (scripts/upgrade-production.py merge) - by the digest the step pins where it pins one: a tag missing upstream stops
# the step while nothing more of it is live, and the rollout does not wait on the pull while the old pod is gone (a
# Recreate deployment, a single replica). Nothing that runs changes - only the node's image store grows.
#
# Usage: only through task deploy:upgrade:merge - it passes -e images=<name:tag[@digest]>,...
- name: Pull an upgrade step's images on the node
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    image_store: /var/lib/containerd
  tasks:
    # each an image reference, nothing else: the list comes in on the command line, and a flag or a second word would
    # reach crictl as one of its own. A name in lower case (a registry's port in it), a tag as the registries allow
    # (upper case and underscores too - refused before), a digest
    - name: The images to pull, each an image reference
      ansible.builtin.assert:
        that:
          - images | default('') | length > 0
          - images.split(',') | select | reject('match', _reference) | list | length == 0
        fail_msg: "-e images=<name:tag[@sha256:digest]>,... - got {{ images | default('') }}"
        quiet: true
      vars:
        # to the end of the value (\Z: $ matches before a trailing newline)
        _reference: '^[a-z0-9][a-z0-9._-]*(:[0-9]+)?(/[a-z0-9._-]+)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(@sha256:[0-9a-f]{64})?\Z'

    # what the node has already (a two-repo step's second merge, the Vagrant copy's preload): only the rest is pulled,
    # and room is needed only for that - a store at 80-85% refused a merge that pulled nothing
    - name: The images on the node already
      ansible.builtin.command:
        argv: [crictl, --runtime-endpoint, "unix:///run/containerd/containerd.sock", --image-endpoint,
               "unix:///run/containerd/containerd.sock", inspecti, "{{ item }}"]
      loop: "{{ images.split(',') | select | list }}"
      register: _present
      changed_when: false
      # missing is crictl's own answer; any other failure (the runtime's socket) is no image missing
      failed_when: _present.rc != 0 and 'no such image' not in _present.stderr
      check_mode: false  # a read: a preview (--check) runs it

    - name: The ones to pull
      ansible.builtin.set_fact:
        _missing: "{{ _present.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list }}"

    - name: Room for them
      ansible.builtin.include_tasks: tasks/image-store-room.yml
      vars:
        room_when: before the pulls
        room_needed: "{{ _missing | length > 0 }}"

    # through containerd's socket by name (ten has no /etc/crictl.yaml: crictl would try its deprecated default
    # endpoints in turn), a registry's passing failure retried
    - name: Each image missing pulled (containerd's k8s.io namespace, where the kubelet looks)
      ansible.builtin.command:
        argv: [crictl, --runtime-endpoint, "unix:///run/containerd/containerd.sock", --image-endpoint,
               "unix:///run/containerd/containerd.sock", pull, "{{ item }}"]
      loop: "{{ _missing }}"
      register: _pulled
      retries: 3
      delay: 10
      until: _pulled.rc == 0
      changed_when: true

    # an image by its digest (the step's pin, or the build the full run's copy ran): containerd keeps no tag for that
    # reference, and a pod naming the tag (IfNotPresent) pulled whatever build the registry's tag named by then - the
    # tag pointed at the digest pulled, whether pulled now or there already
    - name: Each image by digest - its tag pointed at the digest pulled
      ansible.builtin.command:
        argv: [ctr, -n, k8s.io, images, tag, --force,
               "{{ item.split('@')[0] | regex_replace(':[^:/]+$', '') }}@{{ item.split('@')[1] }}",
               "{{ item.split('@')[0] }}"]
      loop: "{{ images.split(',') | select('search', '@sha256:') | list }}"
      changed_when: true

    - name: Room left after them
      ansible.builtin.include_tasks: tasks/image-store-room.yml
      vars:
        room_when: after the pulls
        room_needed: "{{ _missing | length > 0 }}"
