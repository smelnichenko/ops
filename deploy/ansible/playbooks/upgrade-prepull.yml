---
# The public images an upgrade step moves to, pulled into containerd on the node before the step's first merge
# (scripts/upgrade-production.py merge): a tag missing upstream stops the step while nothing of it is live, and the
# rollout does not wait on the pull while the old pod is gone (a Recreate deployment, a single replica). Nothing that
# runs changes - only the node's image store grows.
#
# Usage: only through task deploy:upgrade:merge (the step's first merge) - it passes -e images=<name:tag>,...
- name: Pull an upgrade step's images on the node
  hosts: target
  become: true
  gather_facts: false
  tasks:
    - name: The images to pull
      ansible.builtin.assert:
        that: images | default('') | length > 0
        fail_msg: "-e images=<name:tag>,..."
        quiet: true

    - name: Each image pulled (containerd's k8s.io namespace, where the kubelet looks)
      ansible.builtin.command: crictl pull {{ item }}
      loop: "{{ images.split(',') | select | list }}"
      changed_when: true
