---
# Install Patroni for automatic Postgres failover
#
# Uses Consul as DCS. Manages Postgres on pi1 and pi2.
# Replaces the manual streaming replication setup.
#
# Prerequisites:
#   - Consul cluster running (setup-consul.yml)
#   - Postgres installed on both Pis (setup-pi-services.yml)
#
# Usage: task deploy:patroni   (production; Vagrant: task test:dual-pi)

- name: Install Patroni
  hosts: pi1,pi2
  become: true
  gather_facts: true
  vars_files:
    - ../vars/patroni.yml

  vars:
    patroni_scope: "schnappy-postgres"
    node_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"
    # Credentials come from inventory all.vars (postgres_admin_password +
    # postgres_replication_password). No per-play default — missing values
    # are an inventory-configuration bug, not something to paper over.
    pg_password: "{{ postgres_admin_password }}"
    pg_repl_password: "{{ postgres_replication_password }}"

  tasks:
    # an empty one (a key missing from .env - POSTGRES_REPLICATION_PASSWORD was) would be written into patroni.yml and
    # reloaded: replication, or every login, broken
    - name: The credentials are all there
      ansible.builtin.assert:
        that:
          - pg_password | length > 0
          - pg_repl_password | length > 0
        fail_msg: "REFUSED: an empty credential (KEYCLOAK_DB_PASSWORD or POSTGRES_REPLICATION_PASSWORD in .env)"
        quiet: true
      no_log: true

    - name: Install Patroni via pip
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-psycopg2
          - python3-consul
        state: present

    # vars/patroni.yml's version, only where Patroni is missing: a running cluster is moved by upgrade-patroni.yml,
    # paused meanwhile (unpinned, a fresh install took pip's newest - the Vagrant copy ran 4.1.5 beside ten's 4.1.0)
    - name: Is Patroni installed
      ansible.builtin.command: /usr/local/bin/patroni --version
      register: _patroni_installed
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false
      failed_when: false

    - name: Install Patroni + Consul support
      ansible.builtin.pip:
        name:
          - "patroni[consul]=={{ patroni_version }}"
        state: present
        break_system_packages: true
      when: _patroni_installed.rc != 0

    - name: Find Postgres version
      ansible.builtin.shell: |
        set -o pipefail
        ls -d /usr/lib/postgresql/*/bin | head -1 | grep -oP '\d+'
      register: pg_version
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    # Compute from pg_version rather than glob the main/ dir — Patroni may
    # have wiped /var/lib/postgresql/{ver}/main during a failed bootstrap
    # loop, which would make the glob fail on re-runs.
    - name: Set Postgres data directory path
      ansible.builtin.set_fact:
        pg_data_dir:
          stdout: "/var/lib/postgresql/{{ pg_version.stdout }}/main"

    - name: Disable system Postgres (Patroni will manage it)
      ansible.builtin.systemd:
        name: postgresql
        enabled: false

    - name: Create Patroni config directory
      ansible.builtin.file:
        path: /etc/patroni
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    - name: Write Patroni config
      ansible.builtin.copy:
        dest: /etc/patroni/patroni.yml
        owner: postgres
        group: postgres
        mode: '0640'
        content: |
          scope: {{ patroni_scope }}
          name: {{ inventory_hostname }}

          consul:
            host: 127.0.0.1:8500
            register_service: true

          restapi:
            listen: 0.0.0.0:8008
            connect_address: {{ node_ip }}:8008

          bootstrap:
            dcs:
              ttl: 30
              loop_wait: 10
              retry_timeout: 10
              maximum_lag_on_failover: 1048576
              postgresql:
                use_pg_rewind: true
                parameters:
                  wal_level: replica
                  max_wal_senders: 5
                  max_replication_slots: 5
                  hot_standby: "on"
                  listen_addresses: '*'

            initdb:
              - encoding: UTF8
              - data-checksums

            pg_hba:
              - host replication replicator 0.0.0.0/0 scram-sha-256
              - host all all 0.0.0.0/0 scram-sha-256

            users:
              postgres:
                password: {{ pg_password }}
                options:
                  - superuser
              replicator:
                password: {{ pg_repl_password }}
                options:
                  - replication

          postgresql:
            listen: 0.0.0.0:5432
            connect_address: {{ node_ip }}:5432
            data_dir: {{ pg_data_dir.stdout }}
            config_dir: {{ pg_data_dir.stdout }}
            bin_dir: /usr/lib/postgresql/{{ pg_version.stdout }}/bin
            pgpass: /tmp/pgpass
            use_unix_socket: true
            authentication:
              superuser:
                username: postgres
                password: {{ pg_password }}
              replication:
                username: replicator
                password: {{ pg_repl_password }}
            parameters:
              unix_socket_directories: '/var/run/postgresql'
      diff: false  # the superuser's and the replication passwords - a --check --diff preview would print them
      register: _patroni_config_written

    - name: Check if Patroni is already managing Postgres (idempotency gate)
      ansible.builtin.systemd:
        name: patroni
      register: patroni_unit_state

    # A first install is only a node Patroni never had: no unit file yet, and no patroni.dynamic.json (Patroni's own
    # file) in the data directory. Only then is the data cleared for Patroni's bootstrap (or a replica's clone). The
    # gate was "the unit is not active": a re-run while Patroni was stopped - during an incident, exactly when it is
    # run - cleared that Pi's databases (Forgejo's, Keycloak's).
    - name: Patroni's unit installed here before
      ansible.builtin.stat:
        path: /etc/systemd/system/patroni.service
      register: _patroni_unit_file

    - name: Patroni's own file in the data directory
      ansible.builtin.stat:
        path: "{{ pg_data_dir.stdout }}/patroni.dynamic.json"
      register: _patroni_data_mark

    - name: A first install - nothing of Patroni's here yet
      ansible.builtin.set_fact:
        _patroni_first_install: "{{ not _patroni_unit_file.stat.exists and not _patroni_data_mark.stat.exists }}"

    - name: Never the leader's data (a first install clears the data directory)
      ansible.builtin.include_tasks: tasks/patroni-leader-guard.yml
      when: _patroni_first_install | bool

    - name: Patroni had this node but is not running - this playbook never clears its data
      ansible.builtin.fail:
        msg: >-
          REFUSED on {{ inventory_hostname }}: Patroni is installed here (unit {{ _patroni_unit_file.stat.exists }},
          its file in {{ pg_data_dir.stdout }} {{ _patroni_data_mark.stat.exists }}) but not active
          ({{ patroni_unit_state.status.ActiveState | default('?') }}) - start it or repair it by hand; a re-run
          would have cleared its data
      when:
        - not _patroni_first_install | bool
        - patroni_unit_state.status.ActiveState | default('') != 'active'

    # on disk, not in /tmp (tmpfs: a reboot before the restore lost it); written aside and kept only when complete;
    # root's alone (the realm's keys and secrets, every credential hash). Data there without a Postgres answering is
    # never cleared undumped: the run refuses
    - name: Dump Keycloak DB before Patroni takes over (pi1)
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        if sudo -u postgres psql -qAtc "SELECT 1" > /dev/null 2>&1; then
          d=/var/backups/patroni-first-install
          install -d -m 0700 "$d"
          sudo -u postgres pg_dump keycloak > "$d/keycloak.sql.part"
          tail -n 5 "$d/keycloak.sql.part" | grep -q 'PostgreSQL database dump complete'
          mv "$d/keycloak.sql.part" "$d/keycloak.sql"
          echo "dumped $(wc -l < "$d/keycloak.sql") lines"
        elif [ -e {{ pg_data_dir.stdout }}/PG_VERSION ]; then
          echo "REFUSED: Postgres does not answer, and its data is in {{ pg_data_dir.stdout }} -" \
            "start it (its Keycloak is dumped first) or clear it by hand" >&2
          exit 1
        else
          echo "no Postgres data here - nothing to dump"
        fi
      args:
        executable: /bin/bash
      when:
        - inventory_hostname == 'pi1'
        - _patroni_first_install | bool
      register: pg_dump_result
      changed_when: true

    - name: Stop system Postgres if still running (only on first install)
      ansible.builtin.systemd:
        name: postgresql
        state: stopped
      when: _patroni_first_install | bool

    - name: Clear Postgres data for Patroni init (only on first install)
      ansible.builtin.shell: |
        rm -rf {{ pg_data_dir.stdout }}/*
      changed_when: true
      when: _patroni_first_install | bool

    - name: Install Patroni systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/patroni.service
        mode: '0644'
        content: |
          [Unit]
          Description=Patroni Postgres HA
          After=network.target consul.service
          Wants=consul.service
          [Service]
          Type=simple
          User=postgres
          Group=postgres
          ExecStart=/usr/local/bin/patroni /etc/patroni/patroni.yml
          ExecReload=/bin/kill -s HUP $MAINPID
          KillMode=process
          TimeoutSec=30
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target

    - name: Allow Patroni REST API through UFW
      community.general.ufw:
        rule: allow
        port: "8008"
        proto: tcp
        comment: "Patroni REST API"

    - name: Enable and start Patroni
      ansible.builtin.systemd:
        name: patroni
        enabled: true
        state: started
        daemon_reload: true
      register: _patroni_start

    - name: Wait for Patroni to be ready
      ansible.builtin.uri:
        url: http://localhost:8008/health
        status_code: [200, 503]
      retries: 15
      delay: 10

    # Replicator role is created by Patroni itself via bootstrap.users above.
    # An explicit `CREATE ROLE` task would run before Patroni has finished
    # pg_basebackup on the non-leader Pi (socket not yet present) and fail.


# A re-run that changed Patroni's config or unit (a password from .env, a hand edit) applies it without both Postgres
# going down: it restarted Patroni on both Pis at once, unpaused - Patroni stops Postgres when it stops, both went down
# together and raced for leader. A config change is reloaded (HUP: Patroni re-reads it); a unit change restarts one node
# at a time, the cluster paused (Postgres untouched), the replicas first, each gated on the primary answering through
# HAProxy. A first install starts Patroni on what it wrote: nothing to apply.
- name: A changed config reloaded, a changed unit restarted one node at a time - the cluster paused
  hosts: pi1,pi2
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../vars/patroni.yml
  vars:
    patronictl: patronictl -c /etc/patroni/patroni.yml
  tasks:
    # the unit's restart pending, not just changed by this run: a run that failed before it left the new unit on disk
    - name: The unit other than the running Patroni loaded
      ansible.builtin.include_tasks: tasks/restart-pending.yml
      vars:
        loaded_service: patroni
        loaded_files: [/etc/systemd/system/patroni.service]
        # its status as the start found it: not running, it started on this unit just now
        loaded_started_now: "{{ _patroni_start.status.ActiveState | default('active') not in ['active', 'activating'] }}"

    # on every node, a first install too: the record below reads it before its first-install term
    - name: Its answer
      ansible.builtin.set_fact:
        _patroni_unit_pending: "{{ _restart_pending.stdout_lines }}"

    - name: What this run changed here
      ansible.builtin.set_fact:
        # whenever not a first install: a run cut short after writing the config left it unloaded, and the next one
        # changed nothing (Patroni's reload of an unchanged file does nothing)
        _patroni_reload: "{{ not _patroni_first_install | bool }}"
        _patroni_restart: "{{ not _patroni_first_install | bool and _patroni_unit_pending[0] == 'pending' }}"

    - name: Reloaded - a config change (unless a restart follows)
      ansible.builtin.systemd:
        name: patroni
        state: reloaded
      when: _patroni_reload | bool and not _patroni_restart | bool

    - name: A unit change - restarted, paused
      when: ansible_play_hosts | map('extract', hostvars, '_patroni_restart') | map('bool') | select | list | length > 0
      block:
        - name: Every node in the run
          ansible.builtin.assert:
            that: ansible_play_hosts | sort == ['pi1', 'pi2']
            fail_msg: "REFUSED: the run has {{ ansible_play_hosts | sort }} - a paused restart needs pi1 and pi2"
            quiet: true
          run_once: true

        - name: The unit read again
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Each node's version and role
          ansible.builtin.uri:
            url: http://127.0.0.1:8008/patroni
            return_content: true
          register: _patroni_api
          check_mode: false  # a read: a preview (--check) runs it, and what reads it

        - name: Its version and role, kept for the restart
          ansible.builtin.set_fact:
            restart_version: "{{ _patroni_api.json.patroni.version }}"
            _leader: "{{ _patroni_api.json.role in ['primary', 'master'] }}"

        - name: Not paused already (someone's maintenance - this run would end it)
          ansible.builtin.script:
            cmd: "{{ playbook_dir }}/scripts/patroni-pause.py check"
            executable: python3
          changed_when: false
          run_once: true

        - name: Paused, the replicas then the leader restarted, resumed
          block:
            - name: Paused - Postgres keeps running, no failover meanwhile
              # a marker first, naming this run: a Ctrl-C skips the always: below and leaves the cluster paused - the
              # next run's not-paused check names it (scripts/patroni-pause.py: the pause proven by every member's state)
              ansible.builtin.script:
                cmd: "{{ playbook_dir }}/scripts/patroni-pause.py pause setup-patroni"
                executable: python3
              register: _restart_paused
              changed_when: true
              run_once: true

            - name: The replicas first, then the leader - each restarted, the primary answering
              ansible.builtin.include_tasks: tasks/patroni-restart-node.yml
              loop: "{{ [false, true] }}"
              loop_control:
                loop_var: _turn_leader
                label: "{{ 'the leader' if _turn_leader else 'the replicas' }}"
          always:
            # only what this run paused (a failed pause left someone else's state alone)
            - name: Resumed
              ansible.builtin.script:
                cmd: "{{ playbook_dir }}/scripts/patroni-pause.py resume setup-patroni"
                executable: python3
              changed_when: true
              # a failed read (a Consul blip - likely, when the block failed of Consul's trouble) is no paused cluster
              # for good: the marker is kept until the resume is proven - a try again is safe
              register: _patroni_resumed
              retries: 6
              delay: 10
              until: _patroni_resumed.rc == 0
              environment:
                PAUSED_OUT: "{{ _restart_paused.stdout | default('') }}"
              run_once: true
              when:  # a preview (--check) paused nothing
                - _restart_paused is defined and _restart_paused is succeeded
                - not ansible_check_mode

    # what the next run compares with: every node restarted (any_errors_fatal - a failed restart ends the play before
    # this), started with this unit by a first install, or found running it already
    - name: Patroni's unit as it runs it, recorded
      ansible.builtin.include_tasks: tasks/restart-recorded.yml
      vars:
        loaded_service: patroni
        loaded_hash: "{{ _patroni_unit_pending[1] }}"
      when: >-
        _patroni_unit_pending[0] == 'current' or _patroni_first_install | bool
        or ansible_play_hosts | map('extract', hostvars, '_patroni_restart') | map('bool') | select | list | length > 0

# ─── Restore Keycloak DB ─────────────────────────────────────────────────────
# Must run against the Patroni primary, which is non-deterministic on a
# fresh cluster — either pi1 or pi2 can win the first election. Discover
# the leader first, then delegate_to it.
- name: Discover Patroni primary
  hosts: pi1,pi2
  become: true
  gather_facts: false

  tasks:
    - name: Wait for a Patroni leader to exist (from any node)
      ansible.builtin.shell: |
        set -eo pipefail
        PYEXTRACT='import sys,json
        d=json.load(sys.stdin)
        roles=("leader","master","primary")
        print(next((m["name"] for m in d.get("members",[]) if m.get("role") in roles), ""))'
        for i in $(seq 1 60); do
          LEADER=$(curl -sf http://localhost:8008/cluster 2>/dev/null \
            | python3 -c "$PYEXTRACT" 2>/dev/null) || true
          [ -n "$LEADER" ] && echo "$LEADER" && exit 0
          sleep 5
        done
        exit 1
      register: _leader
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false
      run_once: true

    - name: Set patroni_primary fact
      ansible.builtin.set_fact:
        patroni_primary: "{{ _leader.stdout | trim }}"
      run_once: true

    # add_host registers the leader into an in-memory group so the
    # next play can target it with a static `hosts:` pattern (lint
    # can statically resolve the group name; it can't resolve a
    # `hostvars[...][...]` lookup at parse time).
    - name: Register Patroni primary as a dynamic group
      ansible.builtin.add_host:
        name: "{{ patroni_primary }}"
        groups: patroni_primary
      run_once: true
      changed_when: false

- name: Bootstrap users + keycloak DB on the Patroni primary
  hosts: patroni_primary
  become: true
  gather_facts: false

  vars:
    pg_password: "{{ postgres_admin_password }}"
    pg_repl_password: "{{ postgres_replication_password }}"

  tasks:
    # Patroni's bootstrap.users section does NOT reliably create the
    # replicator role on current versions — the non-leader Pi fails
    # pg_basebackup with 'Role "replicator" does not exist'. Create it
    # explicitly on the leader; the replica will then succeed on its
    # next pg_basebackup retry (~5s).
    # the SQL (and the password in it) on psql's stdin, not its command line
    - name: Create replicator role on leader
      ansible.builtin.command:
        cmd: sudo -u postgres psql -v ON_ERROR_STOP=1 -q
        stdin: |
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='replicator') THEN
              CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '{{ pg_repl_password }}';
            END IF;
          END $$;
      changed_when: true
      no_log: true

    # a first install's dump waiting on pi1 - this run's, or one a run cut short before its restore left - goes into an
    # empty keycloak database (straight to this leader's Postgres, not through HAProxy); beside a database in use it is
    # refused, naming the file: the realm exists nowhere else
    - name: A Keycloak dump waiting on pi1
      ansible.builtin.stat:
        path: /var/backups/patroni-first-install/keycloak.sql
      register: _keycloak_dump
      delegate_to: pi1
      run_once: true

    # the leader's own socket: a read
    - name: Whether the keycloak database is there already
      ansible.builtin.command: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='keycloak'"
      register: _keycloak_db
      changed_when: false
      check_mode: false  # a read: a preview (--check) judges the stop below as a run would
      when: _keycloak_dump.stat.exists

    - name: Its database created - Keycloak stopped first when a dump waits for it
      block:
        # before its empty database is created: a Keycloak running reconnects to it, builds its own schema there, and
        # the restore then refuses the database in use (the run stopped for a hand fix). Only then - beside a database
        # there (in use: the restore refuses; empty: it stops Keycloak and counts again) Keycloak keeps serving. The
        # restore starts it again
        - name: Keycloak stopped on both Pis before its empty database exists (a dump waits)
          ansible.builtin.systemd:
            name: keycloak
            state: stopped
          delegate_to: "{{ item }}"
          loop: "{{ groups['pis'] }}"
          run_once: true
          register: _keycloak_stopped_first
          when:
            - _keycloak_dump.stat.exists
            - _keycloak_db.stdout | default('') | trim != '1'

        # the leader's own socket: no password needed, none on a command line
        - name: Create forgejo + keycloak databases
          ansible.builtin.shell: |
            set -euo pipefail
            if [ "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ item }}'")" != 1 ]; then
              sudo -u postgres psql -v ON_ERROR_STOP=1 -qc "CREATE DATABASE {{ item }}"
            fi
          args:
            executable: /bin/bash
          loop: [forgejo, keycloak]
          changed_when: true
      rescue:
        - name: Keycloak left stopped
          ansible.builtin.debug:
            msg: >-
              KEYCLOAK LEFT STOPPED on both Pis: it was stopped for the waiting dump's restore and its database was
              not created (above) - run setup-patroni.yml again (it creates the database, restores the dump and starts
              Keycloak)
          when: _keycloak_stopped_first is defined and _keycloak_stopped_first is not skipped

        - name: The databases not created
          ansible.builtin.fail:
            msg: "creating the forgejo and keycloak databases failed (above)"

    - name: Restore the waiting Keycloak dump
      ansible.builtin.include_tasks: tasks/patroni-keycloak-restore.yml
      when: _keycloak_dump.stat.exists

# Wait for the replica to finish its pg_basebackup + join the cluster.
# Without this, downstream playbooks (vault, gluster, keepalived) race
# against a half-bootstrapped replica and Forgejo on the replica can't
# reach localhost:5432.
- name: Wait for replica to reach 'streaming' state
  hosts: pi1,pi2
  become: true
  gather_facts: false

  tasks:
    # 5-min budget — pg_basebackup on a fresh Pi can take 2-3 min to
    # copy the whole cluster; earlier 150s budget timed out right before
    # the replica reached streaming.
    - name: Poll cluster until all members are running
      ansible.builtin.shell: |
        set -eo pipefail
        PYCHECK='import sys,json
        d=json.load(sys.stdin)
        states=[m.get("state") for m in d.get("members",[])]
        ok=all(s in ("running","streaming") for s in states) and len(states) >= 2
        sys.exit(0 if ok else 1)'
        curl -sf http://localhost:8008/cluster 2>/dev/null | python3 -c "$PYCHECK"
      register: _cluster_ready
      retries: 60
      delay: 5
      until: _cluster_ready.rc == 0
      changed_when: false
      run_once: true

# ─── Reconfigure Forgejo + Keycloak to use HAProxy → leader ─────────────────
# During setup-pi-services (which runs before Patroni), these services were
# pointed at raw postgres on localhost:5432. With Patroni owning the data
# plane now, they need to go through HAProxy on localhost:5000 to survive
# leader elections / reach whichever Pi is currently primary.
#
# serial: 1 — serialise the restart so the first Pi's Forgejo finishes its
# fresh-DB migrations before the second Pi's Forgejo boots and races on the
# same shared Postgres. Without this, both instances concurrently CREATE
# TABLE on the fresh DB and hit duplicate-key / already-exists errors in an
# Xorm migration loop that doesn't recover cleanly.
- name: Reconfigure Forgejo + Keycloak to the database port (PgBouncer, else HAProxy)
  hosts: pi1,pi2
  serial: 1
  become: true
  gather_facts: false

  tasks:
    # the port setup-pi-services.yml picks too - PgBouncer (:6432) where it runs, else HAProxy (:5000): this play set
    # :5000 always, so each re-run moved Forgejo and Keycloak off PgBouncer and the next setup-pi-services moved them
    # back, a restart each time (production runs PgBouncer - read 2026-10-05)
    - name: Is PgBouncer running here
      ansible.builtin.systemd:
        name: pgbouncer
      register: _pgbouncer_state

    - name: PgBouncer installed here is running (else a re-run would move Forgejo and Keycloak to :5000 and restart them)
      ansible.builtin.fail:
        msg: "REFUSED on {{ inventory_hostname }}: PgBouncer is installed but {{ _pgbouncer_state.status.ActiveState }} - start it first"
      when:
        - _pgbouncer_state.status.LoadState | default('not-found') == 'loaded'
        - _pgbouncer_state.status.ActiveState | default('') != 'active'

    - name: The database port Forgejo and Keycloak use
      ansible.builtin.set_fact:
        _db_port: "{{ '6432' if _pgbouncer_state.status.ActiveState | default('') == 'active' else '5000' }}"

    - name: Update Forgejo HOST directive
      ansible.builtin.lineinfile:
        path: /var/lib/forgejo/custom/conf/app.ini
        regexp: '^HOST = '
        line: "HOST = 127.0.0.1:{{ _db_port }}"
      register: _forgejo_cfg
      notify: [Database port changed, Restart Forgejo]

    - name: Update Keycloak KC_DB_URL
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/keycloak.service
        regexp: 'Environment=KC_DB_URL='
        line: "Environment=KC_DB_URL=jdbc:postgresql://127.0.0.1:{{ _db_port }}/keycloak"
      register: _keycloak_cfg
      notify: [Database port changed, Restart Keycloak]

    # the restarts now, on this Pi, before its waits below (and before the next Pi: serial)
    - name: The reconfigured services restarted
      ansible.builtin.meta: flush_handlers

    # Forgejo can crash-loop on DB reconnect until systemd's Restart=on-failure
    # + HAProxy backend becomes stable — give it a generous budget on fresh
    # installs (up to 10 min).
    - name: Wait for Forgejo to come back up
      ansible.builtin.uri:
        url: "http://localhost:3000/api/v1/version"
        status_code: 200
      retries: 60
      delay: 10
      register: _forgejo_check
      until: _forgejo_check.status == 200

    # When Patroni rebuilds Postgres from scratch, the old `forgejo` DB
    # contents (including the admin user we created during setup-pi-services)
    # are wiped. Forgejo migrates the schema on first connect, but no admin
    # user is recreated automatically. Re-create it here on the primary if
    # missing so downstream tests / GUI access works.
    - name: List Forgejo users (post-Patroni)
      ansible.builtin.shell: |
        set -eo pipefail
        su - forgejo -c "forgejo admin user list \
          --config /var/lib/forgejo/custom/conf/app.ini" 2>&1 \
          | awk 'NR>1 { print $2 }'
      register: _forgejo_users_post
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false
      run_once: true
      delegate_to: pi1

    - name: Recreate Forgejo admin user post-Patroni (if missing)
      # Forgejo's CLI takes a password only as an argument (any local user reads those in /proc): the admin made with a
      # random one Forgejo makes itself (forgejo's own shell given the user and the e-mail on stdin), then its password
      # set through Forgejo's API - the random one on curl's config descriptor, the real one in the request's body on
      # stdin. A retry after the create (the user there, its random one unknown): a write:admin token from Forgejo's
      # CLI (on its stdout - no password on any argument, a throwaway's either) sets it, then every such token deleted
      # with the real password. All three on the task's stdin: templated into the script, root's shell ran $( ) and `
      # in them. Proven against Forgejo 15.0.9 (2026-10-08), the retry's token made, used and deleted
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          IFS= read -r user && IFS= read -r email && IFS= read -r pw
          conf=/var/lib/forgejo/custom/conf/app.ini
          esc() { sed 's/[\\"]/\\&/g' <<< "$1"; }
          api=http://localhost:3000/api/v1
          if out=$(printf '%s\n%s\n' "$user" "$email" | su - forgejo -c 'IFS= read -r user && IFS= read -r email &&
              exec forgejo admin user create --admin --username "$user" --email "$email" --random-password \
              --must-change-password=false --config '"$conf" 2>&1); then
            random=$(sed -n "s/^generated random password is '\(.*\)'$/\1/p" <<< "$out")
            [ -n "$random" ] || { echo "no random password in Forgejo's answer"; exit 1; }
            auth=$(printf 'user = "%s:%s"' "$(esc "$user")" "$(esc "$random")")
          elif grep -q 'already exists' <<< "$out"; then
            name="password-reset-$(python3 -c 'import secrets; print(secrets.token_hex(4))')"
            token=$(printf '%s\n%s\n' "$user" "$name" | su - forgejo -c 'IFS= read -r user && IFS= read -r name &&
              exec forgejo admin user generate-access-token --username "$user" --token-name "$name" \
              --scopes write:admin --raw --config '"$conf")
            [[ $token =~ ^[0-9a-f]{40}$ ]] || { echo "no token in Forgejo's answer"; exit 1; }
            auth=$(printf 'header = "Authorization: token %s"' "$token")
          else
            sed "s/is '.*'/is '***'/" <<< "$out"
            exit 1
          fi
          printf '%s' "$pw" | python3 -c 'import json, sys
          print(json.dumps({"login_name": sys.argv[1], "source_id": 0, "password": sys.stdin.read(),
                            "must_change_password": False}))' "$user" \
            | curl -sf --max-time 30 -o /dev/null -X PATCH -H 'Content-Type: application/json' \
                -K <(printf '%s\n' "$auth") --data @- "$api/admin/users/$user"
          # the reset tokens (this retry's, any an earlier one left) deleted with the password now set
          real=$(printf 'user = "%s:%s"' "$(esc "$user")" "$(esc "$pw")")
          ids=$(curl -sf --max-time 30 -K <(printf '%s\n' "$real") "$api/users/$user/tokens" | python3 -c '
          import json, sys
          print(" ".join(str(t["id"]) for t in json.load(sys.stdin) if t["name"].startswith("password-reset-")))')
          for id in $ids; do
            curl -sf --max-time 30 -o /dev/null -X DELETE -K <(printf '%s\n' "$real") "$api/users/$user/tokens/$id"
          done
        stdin: "{{ forgejo_admin_user }}\n{{ forgejo_admin_email }}\n{{ forgejo_admin_password }}"
      register: _forgejo_admin_recreate
      retries: 5
      delay: 5
      until: _forgejo_admin_recreate.rc == 0
      when: forgejo_admin_user not in (_forgejo_users_post.stdout_lines | default([]))
      run_once: true
      delegate_to: pi1
      changed_when: true
      no_log: true  # the password on stdin: a module's arguments are logged on its host

  # one Pi at a time (serial), each service answering again before the next Pi's restart
  handlers:
    # Wait for HAProxy to have a healthy Patroni leader backend BEFORE restarting Forgejo/Keycloak. HAProxy takes
    # ~60-90s after first boot to resolve Consul DNS + complete the L7 /primary check. Restarting Forgejo before the
    # backend is ready causes Forgejo's init to crash-loop.
    - name: Database port changed
      ansible.builtin.shell: |
        set -o pipefail
        # the password on stdin, not in the environment Ansible puts on the command line
        read -r PGPASSWORD; export PGPASSWORD
        psql -w postgresql://postgres@127.0.0.1:{{ _db_port }}/postgres -c 'SELECT 1' 2>/dev/null
      args:
        executable: /bin/bash
        stdin: "{{ postgres_admin_password }}"
      register: _haproxy_check
      retries: 30
      delay: 5
      until: _haproxy_check.rc == 0
      changed_when: false
      no_log: true

    - name: Restart Forgejo
      ansible.builtin.systemd:
        name: forgejo
        state: restarted

    - name: Restart Keycloak
      ansible.builtin.systemd:
        name: keycloak
        state: restarted
        daemon_reload: true
      notify: Keycloak serving again

    - name: Keycloak serving again
      ansible.builtin.uri:
        url: http://localhost:8080/realms/master
        status_code: 200
      register: _keycloak_back
      retries: 60
      delay: 5
      until: _keycloak_back.status == 200

# ─── Verify cluster ──────────────────────────────────────────────────────────
- name: Verify Patroni cluster
  hosts: pi1
  become: true
  gather_facts: false

  tasks:
    - name: Check Patroni cluster status
      ansible.builtin.shell: |
        patronictl -c /etc/patroni/patroni.yml list
      register: patroni_status
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false
      retries: 6
      delay: 10

    - name: Print results
      ansible.builtin.debug:
        msg: |
          ============================================
          Patroni Cluster — Ready
          ============================================
          {{ patroni_status.stdout }}
          ============================================
