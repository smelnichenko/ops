---
# Setup GlusterFS for Forgejo repo replication between pi1 and pi2
#
# Creates a replicated GlusterFS volume for /var/lib/forgejo/repos
# Both nodes serve the same data — FUSE-based, no kernel module dependency
#
# Prerequisites:
#   - Both Pis running with Forgejo installed
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-gluster.yml

# ─── Install GlusterFS on pi1, pi2, ten ────────────────────────────────────
# ten joins as a replica-3 arbiter node: it stores only metadata (filenames,
# timestamps, permissions), no file content. Provides quorum to prevent
# split-brain during pi1↔pi2 network partitions. Same tie-breaker role ten
# already plays for Consul / Patroni / Vault.
- name: Install GlusterFS
  hosts: pi1,pi2,target
  become: true
  gather_facts: true
  # the network's facts alone (node_ip): the hardware's stat every mount - a hung client's in a thread no signal ends
  gather_subset: [network]

  vars:
    gluster_brick: /var/lib/gluster/forgejo-brick
    gluster_arbiter_brick: /var/lib/gluster/forgejo-arbiter-brick
    forgejo_uid: 900
    forgejo_gid: 900

  tasks:
    - name: Install GlusterFS
      ansible.builtin.apt:
        name: glusterfs-server
        state: present

    - name: Is UFW installed (the Pis have it; ten has none, 2026-10-04)
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: _ufw

    - name: Allow GlusterFS ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.name }}"
      loop:
        - { port: "24007", proto: "tcp", name: "GlusterFS daemon" }
        - { port: "24008", proto: "tcp", name: "GlusterFS management" }
        - { port: "49152:61000", proto: "tcp", name: "GlusterFS bricks" }
      when: _ufw.stat.exists

    - name: Enable and start GlusterFS
      ansible.builtin.systemd:
        name: glusterd
        enabled: true
        state: started

    # Forgejo UID alignment only on the data nodes — ten doesn't run Forgejo
    # and doesn't need the local user. Its two Gluster volumes under it (repos,
    # data) pruned, never walked: a hung client held the find for good, and a
    # volume's ownership is its own plays' (data's: "Fix Forgejo data ownership")
    - name: Align Forgejo UID/GID across nodes
      ansible.builtin.shell: |
        CURRENT_UID=$(id -u forgejo)
        if [ "$CURRENT_UID" != "{{ forgejo_uid }}" ]; then
          systemctl stop forgejo 2>/dev/null || true
          groupmod -g {{ forgejo_gid }} forgejo
          usermod -u {{ forgejo_uid }} -g {{ forgejo_gid }} forgejo
          find /var/lib/forgejo \( -path /var/lib/forgejo/repos -o -path /var/lib/forgejo/data \) -prune \
            -o -exec chown -h {{ forgejo_uid }}:{{ forgejo_gid }} {} +
          echo "changed"
        else
          echo "ok"
        fi
      register: uid_result
      changed_when: "'changed' in uid_result.stdout"
      when: inventory_hostname in ['pi1', 'pi2']

    # A brick is created when missing and never touched after: its root is the volume's root, owned by Gluster (the
    # mount's owner, storage.owner-uid). These set root:root 0755 on every run, behind Gluster's back on all three
    # bricks - the repos, Forgejo's data and Nexus's store then belonged to root until something chowned them through
    # the mount (production's are their services', 2026-10-04).
    - name: Create brick directory (data on pi1+pi2)
      ansible.builtin.command:
        cmd: mkdir -p -m 0755 {{ gluster_brick }}
        creates: "{{ gluster_brick }}"
      when: inventory_hostname in ['pi1', 'pi2']

    - name: Create arbiter brick directory (metadata-only, on ten)
      ansible.builtin.command:
        cmd: mkdir -p -m 0755 {{ gluster_arbiter_brick }}
        creates: "{{ gluster_arbiter_brick }}"
      when: inventory_hostname == 'target'

# ─── Probe peers and create/migrate forgejo-repos volume ──────────────────
- name: Create GlusterFS forgejo-repos volume (replica 3 arbiter 1)
  hosts: pi1
  become: true
  gather_facts: false

  vars:
    gluster_brick: /var/lib/gluster/forgejo-brick
    gluster_arbiter_brick: /var/lib/gluster/forgejo-arbiter-brick
    gluster_mount: /var/lib/forgejo/repos
    # a new volume's mark (pi1): set before its first write, cleared once replicated in full
    forgejo_repos_mark: /var/lib/gluster/forgejo-repos.seeding
    # the bricks a new forgejo-repos volume is made of - each must be empty, but pi1's may hold this playbook's own copy
    forgejo_repos_bricks:
      - {host: pi1, brick: "{{ gluster_brick }}", may_hold_copy: true}
      - {host: pi2, brick: "{{ gluster_brick }}", may_hold_copy: false}
      - {host: target, brick: "{{ gluster_arbiter_brick }}", may_hold_copy: false}
    forgejo_uid: 900
    forgejo_gid: 900
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] }}"
    ten_ip: "{{ hostvars['target']['ansible_host'] }}"

    # Three peers: pi2 (data) and ten (arbiter). Probed from pi1.
    gluster_peers:
      - "{{ pi2_ip }}"
      - "{{ ten_ip }}"

  tasks:
    # Use the gluster CLI directly: the gluster.gluster.gluster_peer
    # Ansible module imports `distutils`, which Python 3.12+ removed
    # from the stdlib (Trixie ships Python 3.13). `gluster peer probe`
    # is idempotent — re-probing an already-known peer reports
    # "Host ... already in peer list" and returns 0; a new one "success".
    - name: Probe peers (pi2 + ten)
      ansible.builtin.shell: |
        set -eu
        for node in {{ gluster_peers | join(' ') }}; do
          gluster peer probe "$node"
        done
      register: peer_probe
      changed_when: "'peer probe: success' in peer_probe.stdout"

    - name: Wait for 2 peers connected (pi2 + ten)
      check_mode: false
      ansible.builtin.shell: |
        set -o pipefail
        gluster peer status | grep -c 'State: Peer in Cluster (Connected)'
      register: peer_status
      until: peer_status.stdout | trim | int >= 2
      retries: 12
      delay: 5
      changed_when: false

    # A volume absent from glusterd's own list is new; any CLI error fails here. Read as "no volume" (`|| echo 0`), an
    # error took the new-install path on a live cluster: Forgejo stopped, data copied into the live brick behind
    # Gluster's back.
    - name: Count existing forgejo-repos bricks
      check_mode: false
      ansible.builtin.shell: |
        set -euo pipefail
        volumes=$(gluster volume list)
        if grep -qx forgejo-repos <<< "$volumes"; then
          gluster volume info forgejo-repos | grep -c '^Brick[0-9]'
        else
          echo 0
        fi
      args:
        executable: /bin/bash
      register: brick_count
      changed_when: false
      failed_when: brick_count.rc != 0 or brick_count.stdout | trim not in ['0', '2', '3']

    # Forgejo is not installed yet on a bare Pi: only that is no failure
    - name: Stop Forgejo on pi1 (new install — need to migrate existing data)
      ansible.builtin.systemd:
        name: forgejo
        state: stopped
      register: _stop_forgejo
      when: brick_count.stdout | trim | int == 0
      failed_when: >-
        _stop_forgejo is failed and 'Could not find the requested service' not in (_stop_forgejo.msg | default(''))

    - name: Stop Forgejo on pi2 (new install)
      ansible.builtin.systemd:
        name: forgejo
        state: stopped
      delegate_to: pi2
      register: _stop_forgejo
      when: brick_count.stdout | trim | int == 0
      failed_when: >-
        _stop_forgejo is failed and 'Could not find the requested service' not in (_stop_forgejo.msg | default(''))

    # A new volume is marked before its first write and unmarked once it is replicated in full ('Verify backup
    # volumes'): a run that fails half-way finds the mark and carries on - copy again, look up, compare, heal - where
    # it would otherwise take the half-done volume for an existing one
    # as the backup volumes' bricks below: a new volume never goes over a brick with anything in it - Forgejo's copy and
    # its chown would land on whatever is there (glusterd having lost its volume list, a brick left from another
    # volume). pi1's may hold this playbook's own copy (marked: a run that failed half-way); nothing writes pi2's or
    # ten's before the volume exists.
    - name: The forgejo-repos bricks empty, or pi1's holding this playbook's own copy (new install)
      ansible.builtin.include_tasks: tasks/forgejo-repos-bricks-empty.yml
      when: brick_count.stdout | trim | int == 0

    - name: Mark forgejo-repos as new (new install)
      ansible.builtin.file:
        path: "{{ forgejo_repos_mark }}"
        state: touch
        mode: '0600'
        modification_time: preserve
        access_time: preserve
      when: brick_count.stdout | trim | int == 0

    - name: Copy existing repos to data brick on pi1 (new install)
      ansible.builtin.shell: |
        set -eu
        if [ -d {{ gluster_mount }}/schnappy ]; then
          cp -a {{ gluster_mount }}/schnappy {{ gluster_brick }}/
          chown -R {{ forgejo_uid }}:{{ forgejo_gid }} {{ gluster_brick }}/
        fi
      when: brick_count.stdout | trim | int == 0
      changed_when: true

    - name: Create replica-3-arbiter volume (new install)
      ansible.builtin.shell: |
        gluster volume create forgejo-repos replica 3 arbiter 1 \
          {{ pi1_ip }}:{{ gluster_brick }} \
          {{ pi2_ip }}:{{ gluster_brick }} \
          {{ ten_ip }}:{{ gluster_arbiter_brick }} \
          force 2>&1
      when: brick_count.stdout | trim | int == 0
      changed_when: true

    - name: Migrate replica-2 → replica-3-arbiter (production migration)
      ansible.builtin.shell: |
        gluster volume add-brick forgejo-repos replica 3 arbiter 1 \
          {{ ten_ip }}:{{ gluster_arbiter_brick }} \
          force 2>&1
      when: brick_count.stdout | trim | int == 2
      changed_when: true

    # each set only when it differs: a set sends every client a new volfile - Forgejo's mounts on a live cluster
    - name: Set volume options
      ansible.builtin.shell: |
        set -euo pipefail
        while read -r option value; do
          now=$(gluster volume get forgejo-repos "$option" | awk -v o="$option" '$1 == o {print $2}')
          if [ "$now" != "$value" ]; then
            gluster volume set forgejo-repos "$option" "$value" > /dev/null
            echo "$option $value (was $now)"
          fi
        done <<EOF
        auth.allow {{ pi1_ip }},{{ pi2_ip }},{{ ten_ip }},127.0.0.1
        performance.cache-size 256MB
        server.allow-insecure on
        EOF
      args:
        executable: /bin/bash
      register: _repos_options
      changed_when: _repos_options.stdout | length > 0

    - name: Ensure volume is started (idempotent)
      ansible.builtin.shell: |
        set -euo pipefail
        STATE=$(gluster volume info forgejo-repos | awk '/^Status:/ {print $2}')
        if [ "$STATE" != "Started" ]; then
          gluster volume start forgejo-repos
          echo "started"
        else
          echo "already-started"
        fi
      args:
        executable: /bin/bash
      register: vol_start
      changed_when: "'started' in vol_start.stdout and 'already' not in vol_start.stdout"

# ─── Mounts at boot: after the volumes' bricks are up ──────────────────────
# At a cold boot the three nodes start together. systemd mounted each volume before any of its bricks had started:
# the client got the volfile, found every brick down ("first lookup on root failed"), exited - and nothing tried
# again; Forgejo and versitygw failed on their missing mounts and stayed down (Vagrant,
# 2026-10-04). gluster-volumes-ready returns once every volume in fstab mounts (a trial mount); the volumes' mount
# units are ordered after it (x-systemd.after in their fstab options, the plays below), the services after their
# mounts (RequiresMountsFor). Bounded: each trial mount 30 s, the whole wait 15 minutes - remote-fs.target waits on it,
# and logins wait on remote-fs.target (pam_nologin until systemd-user-sessions starts), so a volume that never mounts
# (glusterd down, a volume removed but still in fstab) must not lock everyone out of the Pi. After the wait gives up,
# the mounts are tried anyway (they are only ordered after it), each failing on its own as before the wait existed.
- name: Mounts at boot wait for the volumes' bricks
  hosts: pi1,pi2
  become: true
  gather_facts: false

  tasks:
    - name: The wait - every GlusterFS volume in fstab mountable
      ansible.builtin.copy:
        dest: /usr/local/sbin/gluster-volumes-ready
        mode: '0755'
        content: |
          #!/bin/bash
          # Installed by setup-gluster.yml: returns once every GlusterFS volume in /etc/fstab can be mounted - a trial
          # mount of each succeeds. A volume mounted before any of its bricks is up fails, and is not tried again.
          # Each trial is cut after 30 s (a hung mount), the unit after 15 minutes (TimeoutStartSec).
          set -uo pipefail
          trial=/run/gluster-volumes-ready
          mkdir -p "$trial"
          awk '$1 !~ /^#/ && $3 == "glusterfs" {print $1, $4}' /etc/fstab | while read -r source options; do
            until timeout 30 mount -t glusterfs -o "$options" "$source" "$trial"; do
              umount -l "$trial" 2> /dev/null  # a trial cut short may have left its mount behind
              echo "$source: not mountable yet (its bricks are not up), again in 5 s"
              sleep 5
            done
            umount "$trial" || exit 1
            echo "$source: mountable"
          done

    - name: Its unit - the volumes' mount units start after it
      ansible.builtin.copy:
        dest: /etc/systemd/system/gluster-volumes-ready.service
        mode: '0644'
        content: |
          [Unit]
          Description=Wait until the GlusterFS volumes in fstab can be mounted (their bricks are up)
          Wants=network-online.target glusterd.service
          After=network-online.target glusterd.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/gluster-volumes-ready
          TimeoutStartSec=15min

          [Install]
          WantedBy=remote-fs.target

    # not started: it is for the next boot - the volumes are mounted now
    - name: Enabled for the next boot
      ansible.builtin.systemd_service:
        name: gluster-volumes-ready
        enabled: true
        daemon_reload: true

# ─── Mount GlusterFS on both Pis ────────────────────────────────────────────
- name: Mount GlusterFS volume
  hosts: pi1,pi2
  become: true
  gather_facts: true
  # the network's facts alone (node_ip): the hardware's stat every mount - a hung client's in a thread no signal ends
  gather_subset: [network]

  vars:
    gluster_mount: /var/lib/forgejo/repos
    # how long a mounted volume has to answer a stat before its client is said hung
    mount_answer_seconds: 10
    # a mount point's answer to a stat, bounded without waiting on it: a stat a hung client holds waits in the kernel,
    # deaf to every signal, and `timeout` waits for its child all the same. Prints why it did not answer, nothing when
    # it did (the plays mounting the backup volumes use it too)
    answers_fn: &answers_fn |
      answers() {  # answers <mount point> <file for its error>
        stat -f "$1" < /dev/null > /dev/null 2> "$2" &
        local sp=$! i
        for ((i = 0; i < {{ mount_answer_seconds }} * 10; i++)); do kill -0 "$sp" 2> /dev/null || break; sleep 0.1; done
        if kill -0 "$sp" 2> /dev/null; then
          echo "mounted, no answer in {{ mount_answer_seconds }} s - its client hung"
        elif ! wait "$sp"; then
          echo "mounted, not answering: $(< "$2")"
        fi
      }
    # every volume mounted at its mount point answering - none touched before (made, unmounted, mounted, its owner set:
    # each a stat a hung client holds for good); one that does not refused at its deadline, named
    answer_check: &answer_check |
      set -uo pipefail
      {{ answers_fn }}
      bad=""
      d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
      while read -r name mnt; do
        findmnt -rn -M "$mnt" > /dev/null || continue
        why=$(answers "$mnt" "$d/$name")
        [ -z "$why" ] || bad+=" $name ($mnt: $why)"
      done <<< "$VOLUMES"
      [ -z "$bad" ] || { echo "HUNG:$bad - unmount it (umount -l), then run again"; exit 1; }
    node_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    gluster_mount_options: >-
      defaults,_netdev,backup-volfile-servers={{ pi2_ip if inventory_hostname == 'pi1' else pi1_ip }},x-systemd.after=gluster-volumes-ready.service

  tasks:
    - name: No service to start yet (the services stopped for a mount start in the last plays)
      ansible.builtin.set_fact:
        gluster_services_to_start: []

    - name: The repos' volume answers where it is mounted (nothing touches it before)
      check_mode: false  # a read: a preview judges it too
      timeout: 60
      ansible.builtin.shell:
        cmd: "{{ answer_check }}"
        executable: /bin/bash
      environment:
        VOLUMES: "forgejo-repos {{ gluster_mount }}"
      changed_when: false

    # the entry alone where the repos are mounted already: the mount module remounts a mounted volume when its entry
    # changes
    - name: The repos' fstab entry
      ansible.posix.mount:
        path: "{{ gluster_mount }}"
        src: "{{ node_ip }}:/forgejo-repos"
        fstype: glusterfs
        opts: "{{ gluster_mount_options }}"
        state: present
      register: _fstab_repos

    # Forgejo is stopped and the repos remounted only when they are not mounted from the volume already - this used to
    # happen on every run, each re-run an outage of Forgejo.
    - name: Current source of the repos mount
      check_mode: false
      ansible.builtin.command: findmnt -rn -o SOURCE --mountpoint {{ gluster_mount }}
      register: _repos_mount
      changed_when: false
      failed_when: _repos_mount.rc not in [0, 1]

    - name: Remount the repos from the volume
      when: _repos_mount.stdout | trim != node_ip ~ ':/forgejo-repos'
      block:
        - name: Stop Forgejo
          ansible.builtin.systemd:
            name: forgejo
            state: stopped

        - name: Unmount what is mounted there now
          timeout: 120
          ansible.posix.mount:
            path: "{{ gluster_mount }}"
            state: unmounted
          when: _repos_mount.stdout | trim | length > 0

        - name: Mount GlusterFS volume
          timeout: 300
          ansible.posix.mount:
            path: "{{ gluster_mount }}"
            src: "{{ node_ip }}:/forgejo-repos"
            fstype: glusterfs
            opts: "{{ gluster_mount_options }}"
            state: mounted

        - name: Fix ownership
          timeout: 60
          ansible.builtin.file:
            path: "{{ gluster_mount }}"
            owner: forgejo
            group: forgejo
            mode: '0700'

        # not here: on a new volume pi2's brick is still empty until the 'New volumes' plays have run
        - name: Forgejo starts in the last plays
          ansible.builtin.set_fact:
            gluster_services_to_start: "{{ gluster_services_to_start + ['forgejo'] }}"

# ─── Verify ─────────────────────────────────────────────────────────────────
- name: Verify GlusterFS
  hosts: pi1
  become: true
  gather_facts: false

  tasks:
    - name: Check volume status
      check_mode: false
      ansible.builtin.shell: |
        gluster volume status forgejo-repos
      register: vol_status
      changed_when: false

    - name: Check replication
      check_mode: false
      ansible.builtin.shell: |
        gluster volume heal forgejo-repos info
      register: heal_info
      changed_when: false

    - name: Check mount on both nodes
      check_mode: false
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep forgejo-repos
      register: mount_check
      changed_when: false
      delegate_to: "{{ item }}"
      loop:
        - pi1
        - pi2

    - name: Print results
      ansible.builtin.debug:
        msg: |
          ============================================
          GlusterFS Setup — forgejo-repos Complete
          ============================================
          {{ vol_status.stdout }}
          ============================================
          Heal status:
          {{ heal_info.stdout }}
          ============================================

# ─── Remove old monolithic backups volume if present ───────────────────────
- name: Remove old backups volume
  hosts: pi1,pi2
  become: true
  gather_facts: false

  tasks:
    # Only what the old volumes mount, by exact mountpoint and source. This matched "$mnt.*glusterfs" in `mount`, which
    # /mnt/backups/git-mirror (backup-git-mirror, live) matches for /mnt/backups: every run deleted the git-mirror line
    # from fstab (and `umount /mnt/backups || true` failed unseen), the mount play below put it back - a run failing in
    # between left the Pi without it (production pi1 matches, 2026-10-04).
    - name: Unmount old GlusterFS backup mounts
      ansible.builtin.shell: |
        set -euo pipefail
        old=':/(backups|backup-scylla|backup-postgres|backup-velero)$'
        for mnt in /mnt/backups /mnt/backups/scylla /mnt/backups/postgres /mnt/backups/velero; do
          if src=$(findmnt -rn -t fuse.glusterfs -o SOURCE --mountpoint "$mnt") && echo "$src" | grep -qE "$old"; then
            umount "$mnt"
            echo "unmounted $mnt"
          fi
        done
        entries='^[^[:space:]]+:/(backups|backup-scylla|backup-postgres|backup-velero)[[:space:]]'
        if grep -qE "$entries" /etc/fstab; then
          sed -i -E "\,$entries,d" /etc/fstab
          echo "fstab: the old volumes' entries removed"
        fi
      args:
        executable: /bin/bash
      register: unmount_old
      changed_when: unmount_old.stdout | length > 0

    # Empty stub directories left behind after the old monolithic
    # backups volume was retired. Only remove if truly empty — never
    # rmdir something that still has content.
    - name: Remove empty leftover mountpoint dirs
      ansible.builtin.shell: |
        removed=""
        for d in /mnt/backups/scylla /mnt/backups/postgres /mnt/backups/velero; do
          if [ -d "$d" ] && [ -z "$(ls -A "$d" 2>/dev/null)" ] && ! mountpoint -q "$d"; then
            rmdir "$d" && removed="$removed $d"
          fi
        done
        [ -n "$removed" ] && echo "removed:$removed" || echo "noop"
      register: rmdir_leftovers
      changed_when: "'removed:' in rmdir_leftovers.stdout"

    # (the old volumes' symlinks under /var/lib/minio/data, 0682f66's migration, are gone from both Pis - read
    # 2026-10-08; their cleanup looked inside the backup-minio mount before any answer check, held by a hung client)

- name: Stop old backups volume
  hosts: pi1
  become: true
  gather_facts: false

  tasks:
    - name: Stop and delete old backup volumes
      ansible.builtin.shell: |
        set -euo pipefail
        volumes=$(gluster volume list)
        for vol in backups backup-scylla backup-postgres backup-velero; do
          if grep -qx "$vol" <<< "$volumes"; then
            if [ "$(gluster volume info "$vol" | awk '/^Status:/ {print $2}')" = Started ]; then
              gluster volume stop "$vol" force --mode=script
            fi
            gluster volume delete "$vol" --mode=script
            echo "deleted $vol"
          fi
        done
      args:
        executable: /bin/bash
      register: delete_old
      changed_when: "'deleted' in delete_old.stdout"

# ─── Backup GlusterFS volumes (scylla, postgres, velero) ───────────────────
- name: Create backup GlusterFS volumes
  hosts: pi1
  become: true
  gather_facts: false

  vars:
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    ten_ip: "{{ hostvars['target']['ansible_host'] | default('192.168.11.2') }}"
    backup_volumes:
      - name: backup-minio
        brick: /var/lib/gluster/backup-minio-brick
        arbiter_brick: /var/lib/gluster/backup-minio-arbiter-brick
        mount: /var/lib/minio/data
        # versitygw owns its mount via RequiresMountsFor; never stop it for a
        # fresh-install brick migration (would stop it on both active-active Pis).
        stop_service: ''
      - name: backup-git-mirror
        brick: /var/lib/gluster/backup-git-mirror-brick
        arbiter_brick: /var/lib/gluster/backup-git-mirror-arbiter-brick
        mount: /mnt/backups/git-mirror
        stop_service: ''
      - name: nexus-data
        brick: /var/lib/gluster/nexus-brick
        arbiter_brick: /var/lib/gluster/nexus-arbiter-brick
        mount: /mnt/data/nexus
        stop_service: ''
      # Forgejo APP_DATA_PATH (packages, attachments, avatars,
      # actions_artifacts, etc.). Without this, only the git repo dir
      # is replicated — a VIP failover to whichever Pi doesn't have
      # the local 31 GB packages dir would make the container registry
      # return MANIFEST_UNKNOWN. Forgejo finds the row in PG but the
      # blob file isn't on that Pi's disk. Replicating the whole data
      # dir keeps state consistent regardless of which Pi serves.
      - name: forgejo-data
        brick: /var/lib/gluster/forgejo-data-brick
        arbiter_brick: /var/lib/gluster/forgejo-data-arbiter-brick
        mount: /var/lib/forgejo/data
        stop_service: ''

  tasks:
    # created when missing, never touched after (see 'Create brick directory' in the first play)
    - name: Create data brick directories on pi1 + pi2
      ansible.builtin.command:
        cmd: mkdir -p -m 0755 {{ item.1.brick }}
        creates: "{{ item.1.brick }}"
      delegate_to: "{{ item.0 }}"
      loop: "{{ ['pi1', 'pi2'] | product(backup_volumes) | list }}"
      loop_control:
        label: "{{ item.1.name }} on {{ item.0 }}"

    - name: Create arbiter brick directories on ten
      ansible.builtin.command:
        cmd: mkdir -p -m 0755 {{ item.arbiter_brick }}
        creates: "{{ item.arbiter_brick }}"
      delegate_to: target
      loop: "{{ backup_volumes }}"
      loop_control:
        label: "{{ item.name }}"

    # as for forgejo-repos above: glusterd's own list says which volumes exist, a CLI error fails
    - name: Count existing bricks per volume
      check_mode: false
      ansible.builtin.shell: |
        set -euo pipefail
        volumes=$(gluster volume list)
        if grep -qx {{ item.name }} <<< "$volumes"; then
          gluster volume info {{ item.name }} | grep -c '^Brick[0-9]'
        else
          echo 0
        fi
      args:
        executable: /bin/bash
      register: backup_brick_count
      changed_when: false
      failed_when: backup_brick_count.rc != 0 or backup_brick_count.stdout | trim not in ['0', '2', '3']
      loop: "{{ backup_volumes }}"

    # === Fresh-install ordering: stop service → migrate-to-brick → create volume ===
    # The migration MUST run before `gluster volume create` because once
    # the volume is created, gluster writes its own .glusterfs metadata
    # into the brick directory, which both confuses the "is brick empty"
    # check and means subsequent direct-to-brick writes bypass GFID
    # tracking (files become invisible through the mount until a full
    # heal). Same pattern the forgejo-repos migration above uses (see
    # 'Copy existing repos to data brick on pi1' / 'Create replica-3-arbiter
    # volume' ordering).
    - name: Build list of services to stop before fresh-install migration
      ansible.builtin.set_fact:
        fresh_install_services: >-
          {{
            backup_brick_count.results
            | selectattr('stdout', 'match', '^\s*0\s*$')
            | map(attribute='item')
            | rejectattr('stop_service', 'equalto', '')
            | rejectattr('stop_service', 'equalto', None)
            | list
          }}

    - name: Stop owning services before fresh-install migration
      ansible.builtin.systemd:
        name: "{{ item.0.stop_service }}"
        state: stopped
      delegate_to: "{{ item.1 }}"
      loop: "{{ fresh_install_services | product(['pi1', 'pi2']) | list }}"
      loop_control:
        label: "{{ item.0.name }} on {{ item.1 }}"
      register: _stop_owner
      failed_when: >-
        _stop_owner is failed and 'Could not find the requested service' not in (_stop_owner.msg | default(''))

    # A new volume is marked before its first write, as forgejo-repos above. The brick must be empty - no data, no
    # .glusterfs metadata - unless the mark says this playbook's own copy is in it (a run that failed half-way: copied
    # again, completing it). A brick with anything else in it is refused: a volume is never created over it. A copy
    # error fails the run (it was `2>/dev/null || true`: a half copy went on to become the volume).
    - name: Migrate existing data to bricks (new volumes only)
      ansible.builtin.shell: |
        set -eu
        marker=/var/lib/gluster/{{ item.item.name }}.seeding
        if [ -n "$(ls -A {{ item.item.brick }}/)" ] && [ ! -e "$marker" ]; then
          echo "REFUSED: {{ item.item.brick }} is not empty, and not marked new by this playbook" >&2
          exit 1
        fi
        touch "$marker"
        if [ -d "{{ item.item.mount }}" ] && [ ! -L "{{ item.item.mount }}" ]; then
          cp -a "{{ item.item.mount }}"/. "{{ item.item.brick }}/"
          echo "migrated"
        fi
      register: migrate
      when: item.stdout | trim | int == 0
      changed_when: true
      loop: "{{ backup_brick_count.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Create replica-3-arbiter volume (new install)
      ansible.builtin.shell: |
        set -eu
        gluster volume create {{ item.item.name }} replica 3 arbiter 1 \
          {{ pi1_ip }}:{{ item.item.brick }} \
          {{ pi2_ip }}:{{ item.item.brick }} \
          {{ ten_ip }}:{{ item.item.arbiter_brick }} \
          force
        gluster volume set {{ item.item.name }} auth.allow {{ pi1_ip }},{{ pi2_ip }},{{ ten_ip }},127.0.0.1
        gluster volume set {{ item.item.name }} server.allow-insecure on
        echo "created"
      register: vol_create
      when: item.stdout | trim | int == 0
      changed_when: "'created' in vol_create.stdout | default('')"
      loop: "{{ backup_brick_count.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # the new volumes - marked, by this run or by one that failed half-way: replicated in full before anything relies
    # on them (the plays up to 'Verify backup volumes', which unmarks them)
    - name: The volumes marked new
      ansible.builtin.find:
        paths: /var/lib/gluster
        patterns: '*.seeding'
      register: _seeding

    - name: The new volumes
      ansible.builtin.set_fact:
        gluster_new_volumes: >-
          {{ _seeding.files | map(attribute='path') | map('basename') | map('regex_replace', '[.]seeding$', '') | list }}

    # Gluster re-asserts brick ownership from arbiter metadata on every
    # mount / peer-reconnect / self-heal. Setting `storage.owner-*` options
    # makes Gluster itself enforce the ownership, so client-side chown stays
    # durable. nexus runs as uid/gid 901/901 (see setup-nexus.yml), forgejo
    # as 900/900 (set by 'Align Forgejo UID/GID' in the first play of this
    # file). Both volumes exist here - created above on a new install (this
    # said "the next play creates it", and swallowed every error).
    # the git mirror's volume is its user's (the daily sync from ten writes there as it - root:root 0755 on production,
    # read 2026-10-08: every repository refused): that user's ids on each Pi, the same on both (another user's uid on
    # one Pi would own the mirror there)
    - name: The git mirror user's ids on each Pi
      ansible.builtin.shell:
        cmd: "id -u {{ offsite_backup_user | default('sm') }} && id -g {{ offsite_backup_user | default('sm') }}"
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      register: _mirror_user_ids
      changed_when: false
      check_mode: false  # a read

    - name: The git mirror user's ids the same on both Pis
      ansible.builtin.assert:
        that:
          - _mirror_user_ids.results | map(attribute='stdout_lines') | unique | length == 1
        fail_msg: >-
          REFUSED: {{ offsite_backup_user | default('sm') }} has other ids on the Pis
          ({{ _mirror_user_ids.results | map(attribute='stdout_lines') | list }}) - the mirror's volume not given it
        quiet: true

    - name: Volume ownership enforced by Gluster (durable across heals)
      ansible.builtin.shell: |
        set -euo pipefail
        for pair in "storage.owner-uid {{ item.uid }}" "storage.owner-gid {{ item.gid }}"; do
          opt=${pair% *} id=${pair#* }
          now=$(gluster volume get {{ item.name }} "$opt" | awk -v o="$opt" '$1 == o {print $2}')
          if [ "$now" != "$id" ]; then
            gluster volume set {{ item.name }} "$opt" "$id" > /dev/null
            echo "$opt $id (was $now)"
          fi
        done
      args:
        executable: /bin/bash
      loop:
        - { name: nexus-data, uid: 901, gid: 901 }
        - { name: forgejo-data, uid: 900, gid: 900 }
        # the repositories: their root reverted to root:root without it (a re-run after a full run found it changed)
        - { name: forgejo-repos, uid: 900, gid: 900 }
        - name: backup-git-mirror
          uid: "{{ (_mirror_user_ids.results | first).stdout_lines[0] }}"
          gid: "{{ (_mirror_user_ids.results | first).stdout_lines[1] }}"
      register: _owner
      changed_when: _owner.stdout | length > 0

    - name: Migrate existing replica-2 → replica-3-arbiter
      ansible.builtin.shell: |
        set -eu
        gluster volume add-brick {{ item.item.name }} replica 3 arbiter 1 \
          {{ ten_ip }}:{{ item.item.arbiter_brick }} \
          force
        gluster volume set {{ item.item.name }} auth.allow {{ pi1_ip }},{{ pi2_ip }},{{ ten_ip }},127.0.0.1
        echo "migrated"
      register: vol_migrate
      when: item.stdout | trim | int == 2
      changed_when: "'migrated' in vol_migrate.stdout | default('')"
      loop: "{{ backup_brick_count.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # Idempotent start: gluster's 'start' refuses if already running.
    # Check status first so reruns don't error and stopped volumes recover.
    - name: Ensure volumes are started
      ansible.builtin.shell: |
        set -euo pipefail
        STATE=$(gluster volume info {{ item.name }} | awk '/^Status:/ {print $2}')
        if [ "$STATE" != "Started" ]; then
          gluster volume start {{ item.name }}
          echo "started"
        else
          echo "already-started"
        fi
      args:
        executable: /bin/bash
      register: vol_start
      changed_when: "'started' in vol_start.stdout and 'already' not in vol_start.stdout"
      loop: "{{ backup_volumes }}"

- name: Mount backup GlusterFS volumes
  hosts: pi1,pi2
  become: true
  gather_facts: true
  # the network's facts alone (node_ip): the hardware's stat every mount - a hung client's in a thread no signal ends
  gather_subset: [network]

  vars:
    # how long a mounted volume has to answer a stat before its client is said hung
    mount_answer_seconds: 10
    answers_fn: *answers_fn
    answer_check: *answer_check
    node_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    gluster_mount_options: >-
      defaults,_netdev,backup-volfile-servers={{ pi2_ip if inventory_hostname == 'pi1' else pi1_ip }},x-systemd.after=gluster-volumes-ready.service
    # autostart: false → service is stopped before mounting but NOT
    # auto-started after. Used by services whose keepalived notify
    # scripts own start/stop (exactly one instance at a time across
    # the cluster — see setup-keepalived.yml). An unconditional
    # auto-start here would race the keepalived notify script and
    # risk starting the service on the non-VIP Pi, where xl-single
    # MinIO / H2 in Nexus would refuse the second start in a loop.
    #
    # Forgejo can run active-active (autostart: true) because
    # Postgres provides locking for shared filesystem access.
    backup_volumes:
      # the store's gateway (versitygw since 2026-06-27; this said minio, which no longer exists - the gateway kept
      # serving while its data dir was unmounted, and writes then would land on the local disk under the mount)
      - { name: backup-minio, mount: /var/lib/minio/data, stop_service: versitygw, autostart: true }
      - { name: backup-git-mirror, mount: /mnt/backups/git-mirror, stop_service: "", autostart: true }
      - { name: nexus-data, mount: /mnt/data/nexus, stop_service: nexus, autostart: false }
      - { name: forgejo-data, mount: /var/lib/forgejo/data, stop_service: forgejo, autostart: true }

  tasks:
    # Only a volume not mounted from itself is (re)mounted, and only its service stopped around it. This play stopped
    # every service and unmounted every volume on every run ("Unmount if already mounted with different source" had
    # no condition): each re-run took Forgejo and Nexus down, and the backup store's gateway - listed as minio, gone
    # since versitygw - kept serving the local disk under the unmounted store.
    - name: Current source of each mount
      check_mode: false
      ansible.builtin.command: findmnt -rn -o SOURCE --mountpoint {{ item.mount }}
      loop: "{{ backup_volumes }}"
      loop_control:
        label: "{{ item.mount }}"
      register: _current_mounts
      changed_when: false
      failed_when: _current_mounts.rc not in [0, 1]

    - name: The backup volumes answer where they are mounted (nothing touches them before)
      check_mode: false  # a read: a preview judges it too
      timeout: 120
      ansible.builtin.shell:
        cmd: "{{ answer_check }}"
        executable: /bin/bash
      environment:
        VOLUMES: "{{ backup_volumes | map(attribute='name') | zip(backup_volumes | map(attribute='mount')) | map('join', ' ') | join('\n') }}"
      changed_when: false

    - name: None to (re)mount yet
      ansible.builtin.set_fact:
        backup_remount: []

    - name: The volumes to (re)mount here - not mounted, or from another source
      ansible.builtin.set_fact:
        backup_remount: "{{ backup_remount + [item.item] }}"
      loop: "{{ _current_mounts.results }}"
      loop_control:
        label: "{{ item.item.mount }}"
      when: item.stdout | trim != node_ip ~ ':/' ~ item.item.name

    # started in the last plays: those of the volumes (re)mounted here, and of the new volumes - on a run that failed
    # half-way they were stopped by the run before, and nothing is remounted now
    - name: The services to start in the last plays
      vars:
        _new: "{{ hostvars['pi1']['gluster_new_volumes'] | default([]) }}"
        _volumes: "{{ backup_remount + (backup_volumes | selectattr('name', 'in', _new) | list) }}"
      ansible.builtin.set_fact:
        gluster_services_to_start: >-
          {{ (gluster_services_to_start | default([]))
             + (['forgejo'] if 'forgejo-repos' in _new else [])
             + (_volumes | selectattr('autostart') | map(attribute='stop_service') | select | list) }}

    - name: The services on this Pi
      ansible.builtin.service_facts:

    # the volumes' own services (keepalived's - autostart false - aside): the last play starts any of them left stopped
    - name: The services of the volumes mounted here
      ansible.builtin.set_fact:
        gluster_autostart_services: >-
          {{ (['forgejo'] + (backup_volumes | selectattr('autostart') | map(attribute='stop_service') | select | list)) | unique }}

    - name: Stop their services before mounting (those installed - Nexus comes later, with setup-nexus.yml)
      ansible.builtin.systemd:
        name: "{{ item.stop_service }}"
        state: stopped
      loop: "{{ backup_remount }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.stop_service | length > 0 and (item.stop_service ~ '.service') in ansible_facts.services

    - name: Unmount what another source has mounted there
      timeout: 120
      ansible.posix.mount:
        path: "{{ item.item.mount }}"
        state: unmounted
      loop: "{{ _current_mounts.results }}"
      loop_control:
        label: "{{ item.item.mount }}"
      when: item.stdout | trim | length > 0 and item.stdout | trim != node_ip ~ ':/' ~ item.item.name

    # only for the volumes about to be mounted here, after what another source mounted there is gone: a mounted volume's
    # root is its own plays' (every run set the git mirror's, setup-vault-pi's 0750, to 0755 - and setup-vault-pi set it
    # back); the mount module makes a missing mount point itself
    - name: Create mount points
      timeout: 60
      ansible.builtin.file:
        path: "{{ item.mount }}"
        state: directory
        mode: '0755'
      loop: "{{ backup_remount }}"
      loop_control:
        label: "{{ item.mount }}"

    # mounted where not mounted from the volume yet; elsewhere the entry alone - the mount module remounts a mounted
    # volume when its entry changes
    - name: Mount backup volumes
      timeout: 300
      ansible.posix.mount:
        path: "{{ item.mount }}"
        src: "{{ node_ip }}:/{{ item.name }}"
        fstype: glusterfs
        opts: "{{ gluster_mount_options }}"
        state: "{{ 'mounted' if item.name in (backup_remount | map(attribute='name')) else 'present' }}"
      loop: "{{ backup_volumes }}"
      loop_control:
        label: "{{ item.name }}"
      register: _fstab_backup

    - name: Systemd's mount units follow fstab
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: _fstab_repos is changed or _fstab_backup is changed

    - name: Fix MinIO data ownership
      timeout: 60
      ansible.builtin.file:
        path: /var/lib/minio/data
        owner: minio
        group: minio
        mode: '0755'

    # forgejo-data carries Forgejo's whole APP_DATA_PATH (jwt key, packages,
    # attachments, ...). On a freshly-created volume Gluster's
    # storage.owner-uid=900 hasn't settled before Forgejo starts (pending
    # self-heal re-asserts brick ownership from arbiter metadata), so
    # jwt/private.pem reads as EACCES for uid 900 and Forgejo crash-loops.
    # A chown through the mount normalizes it. This used to happen as a side
    # effect of the uid-migration chown in the first play, which no longer
    # runs now that Forgejo is created with a fixed uid 900 (setup-pi-services).
    # Only where the volume was (re)mounted here or is new, and only what is
    # not Forgejo's: a `chown -R` of all of it on every run wrote every file's
    # metadata on three bricks, the packages included, and said "ok".
    - name: Fix Forgejo data ownership (heal/ownership can lag on a new volume)
      timeout: 1800
      ansible.builtin.shell: |
        set -euo pipefail
        find /var/lib/forgejo/data \( ! -user forgejo -o ! -group forgejo \) -print \
          -exec chown -h forgejo:forgejo {} + | wc -l
      args:
        executable: /bin/bash
      register: _forgejo_owner
      changed_when: _forgejo_owner.stdout | trim != '0'
      # also where Forgejo's UID was just aligned (the alignment prunes the mounted volumes: their content was left the
      # old UID's)
      when: >-
        'forgejo-data' in (backup_remount | map(attribute='name'))
        or 'forgejo-data' in (hostvars['pi1']['gluster_new_volumes'] | default([]))
        or (uid_result | default({})) is changed

    # Nexus ownership is handled by setup-nexus.yml (which runs after and
    # creates the nexus user with a fixed UID first).

    # their services start after the new volumes are replicated (the play after 'New volumes - pi2's brick ...'):
    # started here, the store's gateway met pi2's copy still unhealed and crash-looped until the heal landed

    # each volume mounted at its own mount point, from itself (one line matching any of them passed: two of three
    # unmounted passed), and answering - a dead FUSE client stays listed in mountinfo. Each answer bounded without
    # waiting on it: a stat a hung client holds waits in the kernel, deaf to every signal, and `timeout` waits for its
    # child all the same - held, the play with it. Polled until its deadline, then left, said; the task's own timeout
    # the outer bound. What the play did: skipped in a preview, which mounts nothing
    - name: Each backup volume mounted here from itself
      when: not ansible_check_mode
      timeout: 120
      ansible.builtin.shell: |
        set -uo pipefail
        bad=""
        {{ answers_fn }}
        d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
        while read -r name mnt; do
          src=$(findmnt -rn -t fuse.glusterfs -o SOURCE -M "$mnt" || true)
          echo "$mnt ${src:-not mounted}"
          if [[ $src != *":/$name" ]]; then
            bad+=" $name ($mnt: ${src:-not mounted})"
            continue
          fi
          why=$(answers "$mnt" "$d/$name")
          [ -z "$why" ] || bad+=" $name ($mnt: $why)"
        done <<< "$VOLUMES"
        [ -z "$bad" ] || { echo "NOT MOUNTED:$bad"; exit 1; }
      args:
        executable: /bin/bash
      environment:
        VOLUMES: "{{ backup_volumes | map(attribute='name') | zip(backup_volumes | map(attribute='mount')) | map('join', ' ') | join('\n') }}"
      changed_when: false

# ─── New volumes: replicated in full before anything uses them ─────────────
# A fresh install copies the existing data straight into pi1's brick before creating the volume; pi2's brick starts
# empty. Gluster knows nothing of files written behind its back: neither index heal nor `heal full` copied them
# (Vagrant, 2026-10-04: pi1's mount listed the store's 5 buckets, pi2's 2, still after 5 min of a full heal). A
# lookup of every entry through pi1's mount does - it gives each file its GFID and heals it onto pi2 (29 of 29 at
# once). Then pi2's brick must hold every entry pi1's does, by path. Volumes that existed before this run are left
# alone (ten: none is created).
- name: New volumes - every entry looked up through pi1's mount, pi1's entries listed
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Look every entry of each new volume up through pi1's mount (assigns the GFIDs, heals onto pi2)
      ansible.builtin.shell: |
        set -euo pipefail
        mount=$(findmnt -rn -t fuse.glusterfs -o TARGET,SOURCE | awk -v src=":/{{ item }}" '$2 ~ src "$" {print $1; exit}')
        [ -n "$mount" ]
        find "$mount" -noleaf -print0 | xargs -0 -r stat > /dev/null
      args:
        executable: /bin/bash
      loop: "{{ gluster_new_volumes | default([]) }}"
      changed_when: true

    - name: The entries on pi1's brick of each new volume, by path
      when: not ansible_check_mode
      ansible.builtin.shell: |
        set -euo pipefail
        brick=$(gluster volume info {{ item }} | awk -v ip={{ ansible_host }} -F'[ :]+' '$1 ~ /^Brick[0-9]+$/ && $2 == ip {print $3}')
        [ -n "$brick" ]
        find "$brick" -path "$brick/.glusterfs" -prune -o -printf '%P\n' | sort
      args:
        executable: /bin/bash
      loop: "{{ gluster_new_volumes | default([]) }}"
      register: _source_entries
      changed_when: false

- name: New volumes - pi2's brick holds every entry pi1's does
  hosts: pi2
  become: true
  gather_facts: false
  tasks:
    # a private directory: a list planted at a fixed /var/tmp name decided the comparison
    - name: A private directory for pi1's entry lists
      when: not ansible_check_mode  # as pi1's listing: a preview's new volumes do not exist yet
      ansible.builtin.tempfile:
        state: directory
        suffix: .gluster-entries
      register: _entries_tmp

    - name: Pi1's entry list of each new volume, for the comparison
      when: not ansible_check_mode  # as pi1's listing: a preview's new volumes do not exist yet
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "{{ _entries_tmp.path }}/{{ item.item }}.pi1-entries"
        mode: '0600'
      loop: "{{ hostvars['pi1']['_source_entries'].results | default([]) }}"
      loop_control:
        label: "{{ item.item }} ({{ item.stdout_lines | length }} entries on pi1)"

    - name: Wait until pi2's brick of each new volume has every entry pi1's has
      when: not ansible_check_mode
      ansible.builtin.shell: |
        set -euo pipefail
        brick=$(gluster volume info {{ item.item }} | awk -v ip={{ ansible_host }} -F'[ :]+' '$1 ~ /^Brick[0-9]+$/ && $2 == ip {print $3}')
        [ -n "$brick" ]
        comm -23 {{ _entries_tmp.path }}/{{ item.item }}.pi1-entries \
          <(find "$brick" -path "$brick/.glusterfs" -prune -o -printf '%P\n' | sort) | head -5
      args:
        executable: /bin/bash
      loop: "{{ hostvars['pi1']['_source_entries'].results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      register: _missing_on_pi2
      changed_when: false
      retries: 60
      delay: 10
      until: _missing_on_pi2.rc == 0 and _missing_on_pi2.stdout | length == 0

    - name: Remove the lists
      when: not ansible_check_mode
      ansible.builtin.file:
        path: "{{ _entries_tmp.path }}"
        state: absent

- name: Start the services of the remounted volumes
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: The services on this Pi
      ansible.builtin.service_facts:

    # a remount a run before did not finish (its task's timeout) left its service stopped: the re-run sees the source
    # right, stops nothing and started nothing - the volumes' own services enabled here and not running, started too
    - name: The volumes' services left stopped here (enabled, not running)
      ansible.builtin.set_fact:
        _left_stopped: >-
          {%- set out = [] -%}
          {%- for s in gluster_autostart_services | default([]) -%}
          {%- set f = ansible_facts.services.get(s ~ '.service', {}) -%}
          {%- if f.get('status') == 'enabled' and f.get('state') != 'running' -%}{%- set _ = out.append(s) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}

    # autostart: false ones are started by keepalived's notify on the VIP's Pi only (see the mount play's vars)
    - name: Start them (those installed, and not keepalived's)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop: "{{ (gluster_services_to_start | default([]) + _left_stopped) | unique }}"
      when: (item ~ '.service') in ansible_facts.services

- name: Verify backup volumes
  hosts: pi1
  become: true
  gather_facts: false

  tasks:
    # A new volume's heals - the entries the lookups created on pi2, then their data and metadata - done before the run
    # ends: until then pi2's copy can hold a directory as root (Vagrant, 2026-10-04: versitygw, running as minio, was
    # refused its buckets dir there). Only the volumes this run created: an existing one lists every file with a write
    # in flight as pending, which a busy Forgejo or a running backup always has.
    # Every brick must answer with a count: one that does not lists "Number of entries: -", which read as 0 here.
    - name: The new volumes are healed - every brick answering, nothing pending on any
      when: not ansible_check_mode
      ansible.builtin.shell: |
        set -euo pipefail
        healed=yes
        for vol in {{ gluster_new_volumes | default([]) | join(' ') }}; do
          gluster volume heal "$vol" > /dev/null
          info=$(gluster volume heal "$vol" info)
          read -r bricks counted pending <<< "$(awk -F': ' '
            /^Brick / {b++}
            /^Number of entries/ {if ($2 ~ /^[0-9]+$/) {c++; p += $2}}
            END {print b+0, c+0, p+0}' <<< "$info")"
          echo "$vol: $counted of $bricks bricks answering, $pending pending"
          if [ "$bricks" -eq 0 ] || [ "$counted" -ne "$bricks" ] || [ "$pending" -ne 0 ]; then
            healed=no
          fi
        done
        [ "$healed" = yes ]
      args:
        executable: /bin/bash
      register: _healed
      changed_when: false
      retries: 60
      delay: 10
      until: _healed.rc == 0

    - name: The new volumes are replicated in full - unmark them
      ansible.builtin.file:
        path: "/var/lib/gluster/{{ item }}.seeding"
        state: absent
      loop: "{{ gluster_new_volumes | default([]) }}"

    # printed, never failing (as before): a volume's status read whole (head closing the pipe early would end gluster
    # on SIGPIPE), its first lines shown, a failed read said
    - name: Check all backup volume statuses
      check_mode: false
      ansible.builtin.shell: |
        set -uo pipefail
        for vol in backup-minio backup-git-mirror nexus-data; do
          echo "=== $vol ==="
          out=$(gluster volume status "$vol" 2>&1) || out="(no status: $out)"
          printf '%s\n' "$out" | sed -n 1,8p
        done
      args:
        executable: /bin/bash
      register: backup_status
      changed_when: false

    - name: Print results
      ansible.builtin.debug:
        msg: |
          ============================================
          GlusterFS Backup Volumes — Complete
          ============================================
          {{ backup_status.stdout }}
          ============================================
