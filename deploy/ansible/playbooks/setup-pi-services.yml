---
# Setup Pi Services (Forgejo, versitygw, Keycloak, Postgres)
#
# Installs the shared service stack on a Pi. Run on pi1 or pi2.
# Vault and Nexus are set up separately (existing playbooks).
#
# Usage: task deploy:pi-services   (production, both Pis; Vagrant: task test:dual-pi)

- name: Setup Pi Services
  hosts: pis
  become: true
  gather_facts: true
  strategy: linear
  # a restart notified before a later task failed still happens: a re-run would find nothing changed and leave the new
  # config unloaded
  force_handlers: true
  # Forgejo's version and checksums (shared with upgrade-forgejo.yml, which moves a running Forgejo)
  vars_files:
    - ../vars/forgejo.yml

  vars:
    keycloak_version: "26.5.7"
    pi_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    # Credentials come from inventory (vagrant.yml: test fixtures;
    # production.yml: lookup('env', ...)). Names map 1:1 with the
    # inventory vars — no per-play defaults.
    forgejo_db_password: "{{ postgres_admin_password }}"
    keycloak_db_password: "{{ postgres_admin_password }}"
    # the other Pi of the pair: a restart here never takes the last serving copy of a service down (the handlers)
    peer_ip: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first]['ansible_host'] }}"

  tasks:
    # a key missing from .env wrote empty passwords and secrets (Forgejo's PASSWD, KC_DB_PASSWORD, SECRET_KEY, the
    # gateway's root key) and restarted the services on them
    - name: Its credentials are all there
      ansible.builtin.assert:
        that:
          - postgres_admin_password | default('') | length > 0
          - keycloak_admin_password | default('') | length > 0
          - forgejo_secret_key | default('') | length > 0
          - forgejo_internal_token | default('') | length > 0
          - forgejo_admin_user | default('') | length > 0
          - forgejo_admin_password | default('') | length > 0
          - backup_root_user | default('') | length > 0
          - backup_root_password | default('') | length > 0
        fail_msg: "REFUSED: an empty credential in the inventory (.env) - nothing written"
        quiet: true
      no_log: true

    # ================================================================
    # Phase 1: System dependencies
    # ================================================================

    - name: Install system packages
      ansible.builtin.apt:
        name:
          - curl
          - unzip
          - jq
          - git
          - ufw
          - openssl
          - python3
          - postgresql
          - postgresql-client
          - default-jre-headless
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure UFW rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.name }}"
      loop:
        - { port: "22", name: "SSH" }
        - { port: "3000", name: "Forgejo" }
        - { port: "8080", name: "Keycloak" }
        - { port: "9000", name: "versitygw (S3)" }
        - { port: "5432", name: "Postgres" }
        - { port: "8200", name: "Vault" }

    # ================================================================
    # Phase 2: Postgres (idempotency-aware)
    # ================================================================
    # On first install: Patroni isn't running yet → raw postgres on
    # localhost:5432 is the writable single-master. We set the password
    # and pre-create Forgejo + Keycloak DBs directly.
    # On re-run: Patroni is already running → this Pi's localhost:5432
    # may be a read-only replica, and createdb/ALTER USER on a replica
    # fails. Skip those DB-side ops (setup-patroni will re-create the
    # databases on the leader) and bind Forgejo/Keycloak to PgBouncer
    # (:6432) which proxies to HAProxy (:5000) → Patroni leader.
    # PgBouncer optional: if not installed, fall back to HAProxy direct.

    # (the module reports a unit that does not exist as not-found - it fails only on a real error, which must show)
    - name: Detect Patroni state (drives Forgejo DB-host resolution below)
      ansible.builtin.systemd:
        name: patroni
      register: _patroni_state

    - name: Detect PgBouncer state
      ansible.builtin.systemd:
        name: pgbouncer
      register: _pgbouncer_state

    # a first install is a Pi without Patroni - not one whose Patroni is stopped for a moment: Debian's own cluster is
    # set up only then, and never restarted under Patroni
    - name: Is Patroni installed here
      ansible.builtin.set_fact:
        _patroni_installed: "{{ _patroni_state.status.LoadState | default('') == 'loaded' }}"

    - name: PgBouncer installed here is running (else Forgejo and Keycloak would be moved to :5000 and restarted)
      ansible.builtin.fail:
        msg: "REFUSED on {{ inventory_hostname }}: PgBouncer is installed but {{ _pgbouncer_state.status.ActiveState }} - start it first"
      when:
        - _pgbouncer_state.status.LoadState | default('not-found') == 'loaded'
        - _pgbouncer_state.status.ActiveState | default('') != 'active'

    - name: Pick effective DB port (pgbouncer if up, else haproxy direct)
      ansible.builtin.set_fact:
        _db_port: "{{ '6432' if _pgbouncer_state.status.ActiveState | default('') == 'active' else '5000' }}"

    - name: Set effective DB host for Forgejo/Keycloak
      ansible.builtin.set_fact:
        forgejo_db_host_effective: >-
          {{ ('127.0.0.1:' ~ _db_port)
             if _patroni_installed | bool
             else (forgejo_db_host | default('127.0.0.1:' ~ _db_port)) }}
        keycloak_db_host_effective: >-
          {{ ('127.0.0.1:' ~ _db_port)
             if _patroni_installed | bool
             else (keycloak_db_host | default('127.0.0.1:' ~ _db_port)) }}

    # the SQL (and the password in it) on psql's stdin, not its command line
    - name: Set Postgres password (first install only — Patroni owns the DB afterwards)
      ansible.builtin.command:
        cmd: sudo -u postgres psql -v ON_ERROR_STOP=1 -q
        stdin: "ALTER USER postgres PASSWORD '{{ postgres_admin_password }}';"
      changed_when: true
      no_log: true
      when: not _patroni_installed | bool

    # each only where it is missing - any other failure shows
    - name: Create Forgejo and Keycloak databases (first install only)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          for db in forgejo keycloak; do
            if [ "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")" != 1 ]; then
              sudo -u postgres createdb "$db"
            fi
          done
      changed_when: true
      when: not _patroni_installed | bool

    - name: Find Postgres config directory
      ansible.builtin.shell: |
        set -o pipefail
        ls -d /etc/postgresql/*/main | head -1
      register: pg_conf_dir
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    - name: Configure Postgres for network access + replication
      ansible.builtin.blockinfile:
        path: "{{ pg_conf_dir.stdout }}/pg_hba.conf"
        block: |
          host all all 0.0.0.0/0 scram-sha-256
          host replication all 0.0.0.0/0 scram-sha-256
        marker: "# {mark} ANSIBLE MANAGED - network access"
      notify: Restart Postgres

    - name: Configure Postgres listen addresses and WAL
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir.stdout }}/postgresql.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: "^#?listen_addresses"
          line: "listen_addresses = '*'"
        - regexp: "^#?wal_level"
          line: "wal_level = replica"
        - regexp: "^#?max_wal_senders"
          line: "max_wal_senders = 3"
      notify: Restart Postgres

    # ================================================================
    # Phase 2.5: HAProxy → Patroni primary
    # ================================================================
    # Each Pi runs HAProxy on localhost:5000. It health-checks Patroni's
    # REST /primary endpoint on both nodes and forwards TCP to whichever
    # returns 200 (the current leader). Forgejo and anything else that
    # needs read-write connects to localhost:5000; failover is transparent.

    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present

    - name: Write HAProxy config
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
        content: |
          global
            maxconn 200
            log 127.0.0.1 local0

          defaults
            log global
            mode tcp
            retries 2
            timeout connect 3s
            timeout client 30m
            timeout server 30m
            timeout check 5s

          # Runtime DNS resolution via local Consul agent. Nodes are
          # registered as pi1.node.consul / pi2.node.consul; if a Pi IP
          # ever changes, Consul updates and HAProxy re-resolves in
          # ~hold valid without redeploy.
          resolvers consul
            nameserver consul1 127.0.0.1:8600
            hold valid 10s
            resolve_retries 3
            timeout resolve 1s
            timeout retry 1s

          listen postgres_primary
            bind 127.0.0.1:5000
            option httpchk GET /primary
            http-check expect status 200
            default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers consul resolve-prefer ipv4 init-addr last,libc,none
            server pi1 pi1.node.consul:5432 maxconn 100 check port 8008
            server pi2 pi2.node.consul:5432 maxconn 100 check port 8008
      notify: Restart HAProxy

    - name: Enable and start HAProxy
      ansible.builtin.systemd:
        name: haproxy
        enabled: true
        state: started
        daemon_reload: true

    # ================================================================
    # Phase 3: Forgejo
    # ================================================================

    - name: Determine architecture
      ansible.builtin.set_fact:
        forgejo_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    # Only where Forgejo is missing: a running one is moved by upgrade-forgejo.yml, which stops both Pis' before a
    # binary changes (a newer Forgejo may migrate the database; an older one then does not start on it)
    - name: Is Forgejo installed
      ansible.builtin.stat:
        path: /usr/local/bin/forgejo
      register: _forgejo_bin

    - name: Download Forgejo (a fresh install), its sha256 checked
      ansible.builtin.get_url:
        url: "https://code.forgejo.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-{{ forgejo_arch }}"
        dest: /usr/local/bin/forgejo
        checksum: "sha256:{{ forgejo_checksums[forgejo_arch] }}"
        mode: '0755'
      when: not _forgejo_bin.stat.exists

    # Fixed UID/GID 900: setup-gluster later usermods forgejo to 900 for
    # Gluster-neutral ownership. If we let this auto-allocate, the usermod
    # orphans node-local /var/local/forgejo (queues/indexers/sessions) to the
    # old auto-uid and Forgejo can't write its LevelDB queue LOCK. Pin it here
    # so both playbooks agree and the usermod is a no-op.
    - name: Create Forgejo group (fixed GID, matches setup-gluster)
      ansible.builtin.group:
        name: forgejo
        gid: 900
        system: true

    - name: Create Forgejo user
      ansible.builtin.user:
        name: forgejo
        uid: 900
        group: forgejo
        system: true
        shell: /bin/bash
        home: /var/lib/forgejo
        create_home: true

    - name: Create Forgejo directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: forgejo
        group: forgejo
        mode: '0755'
      loop:
        - /var/lib/forgejo/data
        - /var/lib/forgejo/repos
        - /var/lib/forgejo/log
        - /var/lib/forgejo/custom/conf
        # Node-local dirs for queues / indexers / sessions — see
        # commentary in app.ini below for why these can't live on
        # the shared Gluster mount under APP_DATA_PATH.
        - /var/local/forgejo
        - /var/local/forgejo/queues
        - /var/local/forgejo/indexers
        - /var/local/forgejo/sessions

    - name: Write Forgejo config
      ansible.builtin.copy:
        dest: /var/lib/forgejo/custom/conf/app.ini
        owner: forgejo
        group: forgejo
        # forgejo's alone: it holds the database password, SECRET_KEY, INTERNAL_TOKEN and JWT_SECRET (it was 0644)
        mode: '0600'
        content: |
          APP_NAME = Forgejo
          RUN_USER = forgejo
          # Forgejo writes WORK_PATH into app.ini on first run; set it here so
          # the rendered file matches and the deploy stays idempotent.
          WORK_PATH = /usr/local/bin

          [server]
          HTTP_PORT = 3000
          HTTP_ADDR = 0.0.0.0
          DOMAIN = {{ forgejo_domain | default('git.pmon.dev') }}
          ROOT_URL = {{ forgejo_root_url | default('https://git.pmon.dev/') }}
          APP_DATA_PATH = /var/lib/forgejo/data
          LFS_START_SERVER = false

          [database]
          DB_TYPE = postgres
          # HAProxy on localhost:5000 routes to whichever Pi is the current
          # Patroni leader (checked via REST /primary). Transparent failover
          # without forgejo needing to know which host is primary.
          HOST = {{ forgejo_db_host_effective }}
          NAME = forgejo
          USER = postgres
          PASSWD = {{ forgejo_db_password }}
          SSL_MODE = disable
          # Force connections to be recycled hourly. Default 0 = forever,
          # which kept Forgejo glued to PgBouncer's stale-cached failure
          # state for ~16 h after the 2026-05-08 switch flap. Hourly
          # recycle bounds worst-case recovery from this kind of cascade.
          CONN_MAX_LIFETIME = 1h

          [repository]
          ROOT = /var/lib/forgejo/repos

          [log]
          ROOT_PATH = /var/lib/forgejo/log
          # Info, to console (journald) and a rotating file: at Warn nothing was
          # written at all, and the 2026-09-09 main-ref rewind on infra (a
          # merged PR undone one second later by an internal push) left no
          # trace. Router log included so API merges and hook calls have
          # timestamps on both Pis.
          LEVEL = Info
          MODE = console, file
          LOGGER_ROUTER_MODE = console, file

          [security]
          INSTALL_LOCK = true
          # Pinned (inventory, from .env) so the active-active Pis share one set
          # and the deploy stops stripping them — Forgejo falls back to a public
          # default SECRET_KEY and regenerates a missing INTERNAL_TOKEN (which
          # differed per Pi and broke OAuth on failover).
          {% if forgejo_secret_key | default('') %}
          SECRET_KEY = {{ forgejo_secret_key }}
          {% endif %}
          {% if forgejo_internal_token | default('') %}
          INTERNAL_TOKEN = {{ forgejo_internal_token }}
          {% endif %}

          # Queues + indexers + sessions are LevelDB / Bleve backed and
          # use file locks, which collide if two Forgejo instances try
          # to open them through the same shared mount. The packages /
          # attachments / avatars / actions_artifacts / jwt subdirs of
          # APP_DATA_PATH are safe to share via Gluster (immutable blobs
          # + Postgres-coordinated metadata), but these three need to
          # stay node-local. Per-Pi paths under /var/local/forgejo
          # avoid the shared mount entirely; loss of in-flight queue
          # state on failover is acceptable for a homelab.
          [queue]
          DATADIR = /var/local/forgejo/queues

          [indexer]
          ISSUE_INDEXER_PATH = /var/local/forgejo/indexers/issues.bleve
          REPO_INDEXER_PATH = /var/local/forgejo/indexers/repos.bleve

          [session]
          PROVIDER = file
          PROVIDER_CONFIG = /var/local/forgejo/sessions

          [webhook]
          # Forgejo's outbound-webhook deliverer rejects private-IP
          # targets by default to block SSRF. Both Woodpecker
          # (ci.pmon.dev) and Argo CD (cd.pmon.dev) live on the same
          # LAN and resolve to 192.168.11.2, so they have to be
          # whitelisted explicitly. List domains, not CIDRs, so a new
          # service on this LAN doesn't accidentally inherit access.
          ALLOWED_HOST_LIST = ci.pmon.dev,cd.pmon.dev,git.pmon.dev,external
          [oauth2]
          # Woodpecker builds a pipeline's clone credential from the repo
          # owner's OAuth access token when the webhook arrives and only then
          # queues the pipeline; with the 1 h default a queued pipeline could
          # outlive its token and die in the clone step ("could not read
          # Username", chat and admin CD on 2026-09-18, infra/radar before).
          ACCESS_TOKEN_EXPIRATION_TIME = 86400
          {% if forgejo_jwt_secret | default('') %}
          # Pinned (inventory) — signs OAuth2 access tokens; must be identical
          # on both Pis or tokens issued by one are rejected after a failover.
          JWT_SECRET = {{ forgejo_jwt_secret }}
          {% endif %}
      diff: false  # the database password and Forgejo's secrets - a --check --diff preview would print them
      notify: Restart Forgejo

    - name: Install Forgejo systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/forgejo.service
        mode: '0644'
        content: |
          [Unit]
          Description=Forgejo Git Forge
          After=network-online.target var-lib-forgejo-repos.mount patroni.service haproxy.service
          Wants=network-online.target
          Requires=haproxy.service
          RequiresMountsFor=/var/lib/forgejo/repos
          [Service]
          Type=simple
          User=forgejo
          Group=forgejo
          WorkingDirectory=/var/lib/forgejo
          ExecStart=/usr/local/bin/forgejo web --config /var/lib/forgejo/custom/conf/app.ini
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart Forgejo

    - name: Enable and start Forgejo
      ansible.builtin.systemd:
        name: forgejo
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Forgejo
      ansible.builtin.uri:
        url: http://localhost:3000/
        status_code: 200
      retries: 30
      delay: 5
      until: forgejo_wait.status | default(0) == 200
      register: forgejo_wait

    - name: Check if Forgejo admin user exists
      ansible.builtin.shell: |
        set -eo pipefail
        su - forgejo -c "forgejo admin user list \
          --config /var/lib/forgejo/custom/conf/app.ini" 2>&1 \
          | awk 'NR>1 { print $2 }'
      register: _forgejo_users
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    - name: Create Forgejo admin user (with retries — Forgejo can be slow to settle after first start)
      # Forgejo's CLI takes the password only as an argument: the user, the e-mail and the password on stdin, read by
      # forgejo's own shell into its arguments - templated into the script, root's shell ran $( ) and ` in them
      ansible.builtin.shell:
        cmd: >-
          su - forgejo -c 'IFS= read -r user && IFS= read -r email && IFS= read -r pw
          && exec forgejo admin user create --admin --username "$user" --email "$email" --password "$pw"
          --config /var/lib/forgejo/custom/conf/app.ini'
        stdin: "{{ forgejo_admin_user }}\n{{ forgejo_admin_email }}\n{{ forgejo_admin_password }}"
      register: _forgejo_admin_create
      retries: 5
      delay: 5
      until: _forgejo_admin_create.rc == 0
      when: forgejo_admin_user not in (_forgejo_users.stdout_lines | default([]))
      changed_when: true
      no_log: true  # the password on stdin: a module's arguments are logged on its host

    # ================================================================
    # Phase 4: Backup object store — versitygw (MinIO retired 2026-06-27)
    # ================================================================

    # rclone + the storage user/group are tagged versitygw so a targeted
    # `task deploy:versitygw` is self-contained on a fresh Pi.
    # rclone (Debian's package) replaced MinIO's mc on 2026-09-24: MinIO retired
    # dl.min.io (410 Gone) and its mc images, and RELEASE.2025-08-13 was the last
    # mc it published — an abandoned client for a store that is versitygw anyway.
    - name: Install rclone (S3 client; used by the versitygw bucket bootstrap)
      ansible.builtin.apt:
        name: rclone
        state: present
      tags: [versitygw]

    - name: Remove the retired mc binary
      ansible.builtin.file:
        path: /usr/local/bin/mc
        state: absent
      tags: [versitygw]

    - name: Create storage group (fixed GID for Gluster-neutral ownership)
      ansible.builtin.group:
        name: minio
        gid: 9000
        system: true
      tags: [versitygw]

    - name: Create storage user (fixed UID; versitygw runs as this user)
      ansible.builtin.user:
        name: minio
        uid: 9000
        group: minio
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/minio
        create_home: true
      tags: [versitygw]

    # Retire the MinIO service + binary — versitygw is the backup store now.
    # Tagged so `task deploy:versitygw` applies the full backup-store state.
    - name: Retire MinIO leftovers
      tags: [versitygw]
      block:
        - name: Check whether the retired MinIO unit is present
          ansible.builtin.stat:
            path: /etc/systemd/system/minio.service
          register: _minio_unit

        - name: Stop + disable retired MinIO service
          ansible.builtin.systemd:
            name: minio
            state: stopped
            enabled: false
          when: _minio_unit.stat.exists

        - name: Remove retired MinIO artifacts (unit, binary, env dir)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/minio.service
            - /usr/local/bin/minio
            - /etc/minio
          notify: Reload systemd daemon

    # versitygw — stateless S3 gateway, the Pi backup store (replaced MinIO
    # 2026-06-27). Object=file on the Gluster backend means both Pis run a
    # gateway with no dual-writer hazard, so there is no consul lock; keepalived
    # just routes the VIP. See tasks/versitygw.yml.
    - name: Deploy versitygw S3 gateway (Pi backup store)
      ansible.builtin.include_tasks:
        file: tasks/versitygw.yml
        apply:
          tags: [versitygw]
      tags: [versitygw]

    # ================================================================
    # Phase 5: Keycloak
    # ================================================================

    - name: Download Keycloak tarball (retry — github.com is flaky from vagrant NAT)
      ansible.builtin.get_url:
        url: "https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz"
        dest: "/opt/keycloak-{{ keycloak_version }}.tar.gz"
        mode: '0644'
        timeout: 60
      register: _kc_dl
      retries: 5
      delay: 15
      until: _kc_dl is succeeded

    - name: Extract Keycloak
      ansible.builtin.unarchive:
        src: "/opt/keycloak-{{ keycloak_version }}.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/keycloak-{{ keycloak_version }}"

    - name: Symlink Keycloak
      ansible.builtin.file:
        src: "/opt/keycloak-{{ keycloak_version }}"
        dest: /opt/keycloak
        state: link

    - name: Create Keycloak user
      ansible.builtin.user:
        name: keycloak
        system: true
        shell: /bin/false
        home: /opt/keycloak

    - name: Set Keycloak ownership
      ansible.builtin.file:
        path: "/opt/keycloak-{{ keycloak_version }}"
        owner: keycloak
        group: keycloak
        recurse: true

    # the passwords in a root-only file systemd reads before it drops to the keycloak user - a unit file is
    # world-readable (and `systemctl show` prints its Environment= lines to anyone)
    - name: Keycloak's secrets directory, root only
      ansible.builtin.file:
        path: /etc/keycloak
        state: directory
        mode: '0700'

    - name: Keycloak's secrets, root only
      ansible.builtin.copy:
        dest: /etc/keycloak/secrets.env
        mode: '0600'
        content: |
          KC_DB_PASSWORD={{ keycloak_db_password }}
          KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_admin_password }}
      notify: Restart Keycloak
      no_log: true

    - name: Install Keycloak systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/keycloak.service
        mode: '0644'
        content: |
          [Unit]
          Description=Keycloak SSO
          After=network-online.target patroni.service haproxy.service
          # Wants (soft) rather than Requires (hard): orders start AFTER
          # patroni+haproxy when they exist, but doesn't block keycloak
          # from starting if those units aren't installed yet (fresh
          # vagrant run where playbook order matters). Keycloak retries
          # its DB connection internally so eventual-consistency is fine.
          Wants=network-online.target patroni.service haproxy.service
          [Service]
          Type=exec
          User=keycloak
          Group=keycloak
          Environment=KC_DB=postgres
          Environment=KC_DB_URL=jdbc:postgresql://{{ keycloak_db_host_effective }}/keycloak
          Environment=KC_DB_USERNAME=postgres
          EnvironmentFile=/etc/keycloak/secrets.env
          Environment=KC_HOSTNAME=auth.pmon.dev
          Environment=KC_PROXY_HEADERS=xforwarded
          Environment=KC_HTTP_ENABLED=true
          Environment=KC_HTTP_PORT=8080
          Environment=KC_BOOTSTRAP_ADMIN_USERNAME=admin
          ExecStart=/opt/keycloak/bin/kc.sh start-dev
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart Keycloak
      no_log: true

    - name: Enable and start Keycloak
      ansible.builtin.systemd:
        name: keycloak
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Keycloak
      ansible.builtin.uri:
        url: http://localhost:8080/realms/master
        status_code: 200
      retries: 30
      delay: 10

    # ================================================================
    # Verification
    # ================================================================

    - name: Verify all services
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }} setup complete:
            Forgejo:   http://{{ pi_ip }}:3000/
            versitygw: http://{{ pi_ip }}:9000/
            Keycloak:  http://{{ pi_ip }}:8080/
            Postgres: {{ pi_ip }}:5432

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    # Each restart one Pi at a time (throttle), the service answering again before the next Pi's: both at once took
    # Forgejo, or Keycloak (every login, Istio's key fetch), down on both Pis together. Bounded waits. throttle does not
    # stop the second Pi when the first one's restart failed - a change that breaks one breaks both - so each restart
    # first refuses to take down the last serving copy: it runs only while the other Pi serves, or this one does not
    # (a first install, a service down already).
    # Debian's own cluster, before Patroni takes over - never under Patroni (it would start a second Postgres)
    - name: Restart Postgres
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl restart postgresql
        for _ in $(seq 60); do pg_isready -q -h 127.0.0.1 -p 5432 && exit 0; sleep 2; done
        echo "Postgres on {{ inventory_hostname }} not ready 120 s after its restart" >&2; exit 1
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true
      when: not _patroni_installed | bool

    - name: Restart Forgejo
      ansible.builtin.shell: |
        set -euo pipefail
        up() { curl -sf -o /dev/null --max-time 10 "http://$1:3000/api/v1/version"; }
        if up 127.0.0.1 && ! up {{ peer_ip }}; then
          echo "REFUSED on {{ inventory_hostname }}: Forgejo serves here but not on the other Pi ({{ peer_ip }})" >&2; exit 1
        fi
        systemctl restart forgejo
        for _ in $(seq 90); do curl -sf -o /dev/null http://127.0.0.1:3000/api/v1/version && exit 0; sleep 2; done
        echo "Forgejo on {{ inventory_hostname }} not serving 180 s after its restart" >&2; exit 1
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true

    - name: Restart Keycloak
      ansible.builtin.shell: |
        set -euo pipefail
        up() { curl -sf -o /dev/null --max-time 10 "http://$1:8080/realms/master"; }
        if up 127.0.0.1 && ! up {{ peer_ip }}; then
          echo "REFUSED on {{ inventory_hostname }}: Keycloak serves here but not on the other Pi ({{ peer_ip }})" >&2; exit 1
        fi
        systemctl daemon-reload
        systemctl restart keycloak
        for _ in $(seq 120); do curl -sf -o /dev/null http://127.0.0.1:8080/realms/master && exit 0; sleep 2; done
        echo "Keycloak on {{ inventory_hostname }} not serving 240 s after its restart" >&2; exit 1
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true

    # Forgejo restarts with it (its unit Requires= haproxy): both answering again before the next Pi
    - name: Restart HAProxy
      ansible.builtin.shell: |
        set -euo pipefail
        up() { curl -sf -o /dev/null --max-time 10 "http://$1:3000/api/v1/version"; }
        if up 127.0.0.1 && ! up {{ peer_ip }}; then
          echo "REFUSED on {{ inventory_hostname }}: Forgejo (restarted with HAProxy) serves here but not on the other Pi ({{ peer_ip }})" >&2
          exit 1
        fi
        systemctl restart haproxy
        for _ in $(seq 90); do
          systemctl is-active --quiet haproxy \
            && { ! systemctl is-enabled --quiet forgejo || curl -sf -o /dev/null http://127.0.0.1:3000/api/v1/version; } \
            && exit 0
          sleep 2
        done
        echo "HAProxy (or Forgejo behind it) on {{ inventory_hostname }} not back 180 s after its restart" >&2; exit 1
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true
