---
# Setup Pi Services (Forgejo, versitygw, Keycloak, Postgres)
#
# Installs the shared service stack on a Pi. Run on pi1 or pi2.
# Vault and Nexus are set up separately (existing playbooks).
#
# Usage: task deploy:pi-services   (production, both Pis; Vagrant: task test:dual-pi)

- name: Setup Pi Services
  hosts: pis
  become: true
  gather_facts: true
  gather_subset: [network]  # the mounts' facts stat every Gluster mount: a hung client's held the play
  strategy: linear
  # a restart notified before a later task failed still happens: a re-run would find nothing changed and leave the new
  # config unloaded
  force_handlers: true
  # Forgejo's and Keycloak's versions and checksums (shared with upgrade-forgejo.yml and upgrade-keycloak.yml, which move
  # a running one)
  vars_files:
    - ../vars/forgejo.yml
    - ../vars/keycloak.yml

  vars:
    pi_ip: "{{ node_ip_override | default(ansible_default_ipv4.address) }}"
    pi1_ip: "{{ hostvars['pi1']['ansible_host'] | default('192.168.11.4') }}"
    pi2_ip: "{{ hostvars['pi2']['ansible_host'] | default('192.168.11.6') }}"
    # Credentials come from inventory (vagrant.yml: test fixtures; production.yml: lookup('env', ...)) - Forgejo's and
    # Keycloak's database passwords their own roles' (forgejo_db_password, keycloak_db_password), never the superuser's.
    # Their logins: a way back is a run with -e forgejo_db_user=postgres -e forgejo_db_password=<the superuser's> (and
    # Keycloak's alike), judged by the same guards - never a revert into the old ones
    forgejo_db_user: forgejo
    keycloak_db_user: keycloak
    # the other Pi of the pair: a restart here never takes the last serving copy of a service down (the handlers)
    peer_ip: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first]['ansible_host'] }}"

  tasks:
    # a key missing from .env wrote empty passwords and secrets (Forgejo's PASSWD, KC_DB_PASSWORD, SECRET_KEY, the
    # gateway's root key) and restarted the services on them
    - name: Its credentials are all there
      tags: [always]  # every run - another tag's (step 25's --tags versitygw) wrote an empty secret
      ansible.builtin.assert:
        that:
          - postgres_admin_password | default('') | length > 0
          - forgejo_db_password | default('') | length > 0
          - keycloak_db_password | default('') | length > 0
          - keycloak_admin_password | default('') | length > 0
          - forgejo_secret_key | default('') | length > 0
          - forgejo_internal_token | default('') | length > 0
          # signs Forgejo's OAuth2 tokens (Woodpecker's): missing, each Pi makes its own - a failover rejects them all
          - forgejo_jwt_secret | default('') | length > 0
          - forgejo_admin_user | default('') | length > 0
          - forgejo_admin_password | default('') | length > 0
          - backup_root_user | default('') | length > 0
          - backup_root_password | default('') | length > 0
        fail_msg: "REFUSED: an empty credential in the inventory (.env) - nothing written"
        quiet: true
      no_log: true

    # app.ini (go-ini) and the secrets file (systemd) each read quotes, a '#' or a backslash their own way: the roles'
    # passwords letters and digits alone (openssl rand -hex 32), whatever reads them
    - name: The roles' passwords are letters and digits
      tags: [always]
      ansible.builtin.assert:
        that:
          - forgejo_db_user != 'forgejo' or forgejo_db_password is match('^[A-Za-z0-9]+$')
          - keycloak_db_user != 'keycloak' or keycloak_db_password is match('^[A-Za-z0-9]+$')
        fail_msg: "REFUSED: FORGEJO_DB_ROLE_PASSWORD or KEYCLOAK_DB_ROLE_PASSWORD not letters and digits alone (openssl rand -hex 32)"
        quiet: true
      no_log: true

    # ================================================================
    # Phase 1: System dependencies
    # ================================================================

    # every restart of a service both Pis run (Forgejo, HAProxy, Keycloak) holds Consul's lock pi-restart - one at a
    # time across both Pis and every Ansible run (files/pi-restart-locked.sh)
    - name: The Pi restart lock's helper
      tags: [always]
      ansible.builtin.import_tasks: tasks/pi-restart-lock.yml

    # a Pi's journal kept across reboots, 30 days or 1 GB at most, whichever comes first (each boot began a new one: two
    # days of Forgejo's restarts were all there was to measure, 2026-11-15)
    - name: The journal's settings directory
      tags: [journal]
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'

    - name: The journal kept on disk - 30 days, 1 GB at most
      tags: [journal]
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/retention.conf
        mode: '0644'
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse=1G
          MaxRetentionSec=30day
      notify: Restart journald

    - name: Install system packages
      ansible.builtin.apt:
        name:
          - curl
          - unzip
          - jq
          - git
          - ufw
          - openssl
          - python3
          - postgresql
          - postgresql-client
          - default-jre-headless
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure UFW rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.name }}"
      loop:
        - { port: "22", name: "SSH" }
        - { port: "3000", name: "Forgejo" }
        - { port: "8080", name: "Keycloak" }
        - { port: "9000", name: "versitygw (S3)" }
        - { port: "5432", name: "Postgres" }
        - { port: "8200", name: "Vault" }

    # ================================================================
    # Phase 2: Postgres (idempotency-aware)
    # ================================================================
    # On first install: Patroni isn't running yet → raw postgres on
    # localhost:5432 is the writable single-master. We set the password
    # and pre-create Forgejo + Keycloak DBs directly.
    # On re-run: Patroni is already running → this Pi's localhost:5432
    # may be a read-only replica, and createdb/ALTER USER on a replica
    # fails. Skip those DB-side ops (setup-patroni will re-create the
    # databases on the leader) and bind Forgejo/Keycloak to PgBouncer
    # (:6432) which proxies to HAProxy (:5000) → Patroni leader.
    # PgBouncer optional: if not installed, fall back to HAProxy direct.

    # (the module reports a unit that does not exist as not-found - it fails only on a real error, which must show)
    - name: Detect Patroni state (drives Forgejo DB-host resolution below)
      tags: [keycloak-db-url, forgejo-config]  # forgejo-config: the database host Forgejo's config names
      ansible.builtin.systemd:
        name: patroni
      register: _patroni_state

    - name: Detect PgBouncer state
      tags: [keycloak-db-url, forgejo-config]  # forgejo-config: the database host Forgejo's config names
      ansible.builtin.systemd:
        name: pgbouncer
      register: _pgbouncer_state

    # a first install is a Pi without Patroni - not one whose Patroni is stopped for a moment: Debian's own cluster is
    # set up only then, and never restarted under Patroni
    - name: Is Patroni installed here
      tags: [keycloak-db-url, forgejo-config]  # forgejo-config: the database host Forgejo's config names
      ansible.builtin.set_fact:
        _patroni_installed: "{{ _patroni_state.status.LoadState | default('') == 'loaded' }}"

    - name: PgBouncer installed here is running (else Forgejo and Keycloak would be moved to :5000 and restarted)
      tags: [keycloak-db-url, forgejo-config]  # forgejo-config: the database host Forgejo's config names
      ansible.builtin.fail:
        msg: "REFUSED on {{ inventory_hostname }}: PgBouncer is installed but {{ _pgbouncer_state.status.ActiveState }} - start it first"
      when:
        - _pgbouncer_state.status.LoadState | default('not-found') == 'loaded'
        - _pgbouncer_state.status.ActiveState | default('') != 'active'

    - name: Pick effective DB port (pgbouncer if up, else haproxy direct)
      tags: [keycloak-db-url, forgejo-config]  # forgejo-config: the database host Forgejo's config names
      ansible.builtin.set_fact:
        _db_port: "{{ '6432' if _pgbouncer_state.status.ActiveState | default('') == 'active' else '5000' }}"

    - name: Set effective DB host for Forgejo/Keycloak
      tags: [keycloak-db-url, forgejo-config]  # forgejo-config: the database host Forgejo's config names
      ansible.builtin.set_fact:
        forgejo_db_host_effective: >-
          {{ ('127.0.0.1:' ~ _db_port)
             if _patroni_installed | bool
             else (forgejo_db_host | default('127.0.0.1:' ~ _db_port)) }}
        keycloak_db_host_effective: >-
          {{ ('127.0.0.1:' ~ _db_port)
             if _patroni_installed | bool
             else (keycloak_db_host | default('127.0.0.1:' ~ _db_port)) }}

    # the SQL (and the password in it) on psql's stdin, not its command line
    - name: Set Postgres password (first install only — Patroni owns the DB afterwards)
      ansible.builtin.command:
        cmd: sudo -u postgres psql -v ON_ERROR_STOP=1 -q
        stdin: "ALTER USER postgres PASSWORD '{{ postgres_admin_password }}';"
      changed_when: true
      no_log: true
      when: not _patroni_installed | bool

    # each only where it is missing - any other failure shows
    - name: Create Forgejo and Keycloak databases (first install only)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          for db in forgejo keycloak; do
            if [ "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")" != 1 ]; then
              sudo -u postgres createdb "$db"
            fi
          done
      changed_when: true
      when: not _patroni_installed | bool

    # their own roles owning them, before anything logs in (under Patroni setup-patroni.yml does it on the leader)
    - name: Forgejo's and Keycloak's own roles (first install only)
      ansible.builtin.include_tasks: tasks/app-db-owner.yml
      when: not _patroni_installed | bool

    - name: Find Postgres config directory
      ansible.builtin.shell: |
        set -o pipefail
        ls -d /etc/postgresql/*/main | head -1
      register: pg_conf_dir
      check_mode: false  # a read: a preview (--check) runs it, and what reads it
      changed_when: false

    - name: Configure Postgres for network access + replication
      ansible.builtin.blockinfile:
        path: "{{ pg_conf_dir.stdout }}/pg_hba.conf"
        block: |
          host all all 0.0.0.0/0 scram-sha-256
          host replication all 0.0.0.0/0 scram-sha-256
        marker: "# {mark} ANSIBLE MANAGED - network access"
      notify: Restart Postgres

    - name: Configure Postgres listen addresses and WAL
      ansible.builtin.lineinfile:
        path: "{{ pg_conf_dir.stdout }}/postgresql.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: "^#?listen_addresses"
          line: "listen_addresses = '*'"
        - regexp: "^#?wal_level"
          line: "wal_level = replica"
        - regexp: "^#?max_wal_senders"
          line: "max_wal_senders = 3"
      notify: Restart Postgres

    # ================================================================
    # Phase 2.5: HAProxy → Patroni primary
    # ================================================================
    # Each Pi runs HAProxy on localhost:5000. It health-checks Patroni's
    # REST /primary endpoint on both nodes and forwards TCP to whichever
    # returns 200 (the current leader). Forgejo and anything else that
    # needs read-write connects to localhost:5000; failover is transparent.

    - name: Install HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present

    - name: Write HAProxy config
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
        content: |
          global
            maxconn 200
            log 127.0.0.1 local0

          defaults
            log global
            mode tcp
            retries 2
            timeout connect 3s
            timeout client 30m
            timeout server 30m
            timeout check 5s

          # Runtime DNS resolution via local Consul agent. Nodes are
          # registered as pi1.node.consul / pi2.node.consul; if a Pi IP
          # ever changes, Consul updates and HAProxy re-resolves in
          # ~hold valid without redeploy.
          resolvers consul
            nameserver consul1 127.0.0.1:8600
            hold valid 10s
            resolve_retries 3
            timeout resolve 1s
            timeout retry 1s

          listen postgres_primary
            bind 127.0.0.1:5000
            option httpchk GET /primary
            http-check expect status 200
            default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers consul resolve-prefer ipv4 init-addr last,libc,none
            server pi1 pi1.node.consul:5432 maxconn 100 check port 8008
            server pi2 pi2.node.consul:5432 maxconn 100 check port 8008
      notify: Restart HAProxy

    - name: Enable and start HAProxy
      ansible.builtin.systemd:
        name: haproxy
        enabled: true
        state: started
        daemon_reload: true

    # ================================================================
    # Phase 3: Forgejo
    # ================================================================

    - name: Determine architecture
      ansible.builtin.set_fact:
        forgejo_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    # Only where Forgejo is missing: a running one is moved by upgrade-forgejo.yml, which stops both Pis' before a
    # binary changes (a newer Forgejo may migrate the database; an older one then does not start on it)
    - name: Is Forgejo installed
      ansible.builtin.stat:
        path: /usr/local/bin/forgejo
      register: _forgejo_bin

    # a fresh install beside the other Pi's: never another version on their one database (a rebuilt Pi while the pin is
    # ahead of production - its first start would migrate the database under the other's older Forgejo)
    - name: The other Pi's Forgejo (a fresh install here starts only beside the same version, or none)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          if [ -x /usr/local/bin/forgejo ]; then
            /usr/local/bin/forgejo --version | grep -o '[0-9][0-9]*[.][0-9][0-9]*[.][0-9][0-9]*' | head -n 1
          else echo missing; fi
      register: _forgejo_peer
      delegate_to: "{{ groups['pis'] | difference([inventory_hostname]) | first }}"
      changed_when: false
      check_mode: false
      when: not _forgejo_bin.stat.exists and groups['pis'] | length > 1

    - name: A fresh Forgejo only beside the same version (or none) - another moves through task deploy:forgejo:upgrade
      ansible.builtin.assert:
        that: _forgejo_bin.stat.exists or groups['pis'] | length < 2 or _forgejo_peer.stdout in ['missing', forgejo_version]
        fail_msg: >-
          REFUSED: the other Pi runs Forgejo {{ _forgejo_peer.stdout | default('?') }}, vars/forgejo.yml pins {{ forgejo_version }}
          - a fresh install here would put two versions on one database: task deploy:forgejo:upgrade first
        quiet: true

    - name: Download Forgejo (a fresh install), its sha256 checked
      ansible.builtin.get_url:
        url: "https://code.forgejo.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-{{ forgejo_arch }}"
        dest: /usr/local/bin/forgejo
        checksum: "sha256:{{ forgejo_checksums[forgejo_arch] }}"
        mode: '0755'
      when: not _forgejo_bin.stat.exists

    # Fixed UID/GID 900: setup-gluster later usermods forgejo to 900 for
    # Gluster-neutral ownership. If we let this auto-allocate, the usermod
    # orphans node-local /var/local/forgejo (queues/indexers/sessions) to the
    # old auto-uid and Forgejo can't write its LevelDB queue LOCK. Pin it here
    # so both playbooks agree and the usermod is a no-op.
    - name: Create Forgejo group (fixed GID, matches setup-gluster)
      ansible.builtin.group:
        name: forgejo
        gid: 900
        system: true

    - name: Create Forgejo user
      ansible.builtin.user:
        name: forgejo
        uid: 900
        group: forgejo
        system: true
        shell: /bin/bash
        home: /var/lib/forgejo
        create_home: true

    - name: Create Forgejo directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: forgejo
        group: forgejo
        mode: '0755'
      loop:
        - /var/lib/forgejo/data
        - /var/lib/forgejo/repos
        - /var/lib/forgejo/log
        - /var/lib/forgejo/custom/conf
        # Node-local dirs for queues / indexers / sessions — see
        # commentary in app.ini below for why these can't live on
        # the shared Gluster mount under APP_DATA_PATH.
        - /var/local/forgejo
        - /var/local/forgejo/queues
        - /var/local/forgejo/indexers
        - /var/local/forgejo/sessions

    # a login that does not work is never written: Forgejo restarted on it serves nothing (setup-patroni.yml makes the
    # role and gives it its database on the leader - deploy:patroni first). The host and port its config names; under
    # Patroni (a first install's database host may not answer yet - its roles were made just above)
    - name: Forgejo's database login - its role, its password, its database
      tags: [forgejo-config]
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          read -r PGPASSWORD; export PGPASSWORD
          host='{{ forgejo_db_host_effective | trim | split(':') | first }}'
          port='{{ forgejo_db_host_effective | trim | split(':') | last }}'
          # what it needs there: every relation its own (or a role it has - the superuser has all), the schema its
          # migrations create in - a login alone passed with tables still another's (a run of the roles cut short)
          q="select (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace"
          q+=" where n.nspname not in ('pg_catalog', 'information_schema') and n.nspname !~ '^pg_toast'"
          q+=" and not pg_has_role(current_user, c.relowner, 'USAGE')) || ' ' || has_schema_privilege('public', 'CREATE')"
          psql -X -At -w -h "$host" -p "$port" -U '{{ forgejo_db_user }}' -d forgejo -c "$q"
        stdin: "{{ forgejo_db_password }}"
      register: _forgejo_login
      changed_when: false
      failed_when: false
      check_mode: false  # a read: a preview shows the refusal a run would meet
      no_log: true  # the password went in on stdin - psql's own error below, without it
      when: _patroni_installed | bool

    - name: Forgejo's login works - or its config is not written
      tags: [forgejo-config]
      ansible.builtin.assert:
        that: _forgejo_login.rc == 0 and _forgejo_login.stdout | trim == '0 true'
        fail_msg: >-
          REFUSED: Forgejo's role cannot log into its database, or does not own what is in it ({{ _forgejo_login.stdout
          | default('') | trim }} {{ _forgejo_login.stderr | default('') | trim }}: relations not its own, CREATE on
          public) - its config not written; deploy:patroni makes the role (FORGEJO_DB_ROLE_PASSWORD in .env)
        quiet: true
      when: _patroni_installed | bool

    # tag forgejo-config: its config alone (with the database host it names) - deploy:pi-services -- --tags forgejo-config
    - name: Write Forgejo config
      tags: [forgejo-config]
      ansible.builtin.copy:
        dest: /var/lib/forgejo/custom/conf/app.ini
        owner: forgejo
        group: forgejo
        # forgejo's alone: it holds the database password, SECRET_KEY, INTERNAL_TOKEN and JWT_SECRET (it was 0644)
        mode: '0600'
        content: |
          APP_NAME = Forgejo
          RUN_USER = forgejo
          # Forgejo writes WORK_PATH into app.ini on first run; set it here so
          # the rendered file matches and the deploy stays idempotent.
          WORK_PATH = /usr/local/bin

          [server]
          HTTP_PORT = 3000
          HTTP_ADDR = 0.0.0.0
          DOMAIN = {{ forgejo_domain | default('git.pmon.dev') }}
          ROOT_URL = {{ forgejo_root_url | default('https://git.pmon.dev/') }}
          APP_DATA_PATH = /var/lib/forgejo/data
          LFS_START_SERVER = false
          # no git over SSH: every remote and Argo CD's sources are HTTPS (its one user, ten's target-scorer checkout,
          # pulls nothing since 2026-11-15) - its keys file removed below
          DISABLE_SSH = true
          # and no keys file for the Pis' sshd: DISABLE_SSH alone leaves Forgejo writing it (a key added, the admin's
          # resync) and its doctor's default checks failing on it missing (upgrade-forgejo.yml's) - Forgejo 15's source
          SSH_CREATE_AUTHORIZED_KEYS_FILE = false
          SSH_CREATE_AUTHORIZED_PRINCIPALS_FILE = false

          [service]
          # no sign-up: accounts are made by the admin (the offsite mirror's reader by setup-velero) - it was open,
          # anyone could register an account on git.pmon.dev (found 2026-11-15)
          DISABLE_REGISTRATION = true

          [database]
          DB_TYPE = postgres
          # HAProxy on localhost:5000 routes to whichever Pi is the current
          # Patroni leader (checked via REST /primary). Transparent failover
          # without forgejo needing to know which host is primary.
          HOST = {{ forgejo_db_host_effective }}
          NAME = forgejo
          # its own role, owning its database (setup-patroni.yml) - never the superuser
          USER = {{ forgejo_db_user }}
          PASSWD = {{ forgejo_db_password }}
          SSL_MODE = disable
          # Force connections to be recycled hourly. Default 0 = forever,
          # which kept Forgejo glued to PgBouncer's stale-cached failure
          # state for ~16 h after the 2026-05-08 switch flap. Hourly
          # recycle bounds worst-case recovery from this kind of cascade.
          CONN_MAX_LIFETIME = 1h

          [repository]
          ROOT = /var/lib/forgejo/repos

          [log]
          ROOT_PATH = /var/lib/forgejo/log
          # Info, to console (journald) and a rotating file: at Warn nothing was
          # written at all, and the 2026-09-09 main-ref rewind on infra (a
          # merged PR undone one second later by an internal push) left no
          # trace. Router log included so API merges and hook calls have
          # timestamps on both Pis.
          LEVEL = Info
          MODE = console, file
          LOGGER_ROUTER_MODE = console, file

          [security]
          INSTALL_LOCK = true
          # Pinned (inventory, from .env) so the active-active Pis share one set
          # and the deploy stops stripping them — Forgejo falls back to a public
          # default SECRET_KEY and regenerates a missing INTERNAL_TOKEN (which
          # differed per Pi and broke OAuth on failover).
          {% if forgejo_secret_key | default('') %}
          SECRET_KEY = {{ forgejo_secret_key }}
          {% endif %}
          {% if forgejo_internal_token | default('') %}
          INTERNAL_TOKEN = {{ forgejo_internal_token }}
          {% endif %}

          # Queues + indexers + sessions are LevelDB / Bleve backed and
          # use file locks, which collide if two Forgejo instances try
          # to open them through the same shared mount. The packages /
          # attachments / avatars / actions_artifacts / jwt subdirs of
          # APP_DATA_PATH are safe to share via Gluster (immutable blobs
          # + Postgres-coordinated metadata), but these three need to
          # stay node-local. Per-Pi paths under /var/local/forgejo
          # avoid the shared mount entirely; loss of in-flight queue
          # state on failover is acceptable for a homelab.
          [queue]
          DATADIR = /var/local/forgejo/queues

          [indexer]
          ISSUE_INDEXER_PATH = /var/local/forgejo/indexers/issues.bleve
          REPO_INDEXER_PATH = /var/local/forgejo/indexers/repos.bleve

          [session]
          PROVIDER = file
          PROVIDER_CONFIG = /var/local/forgejo/sessions

          [webhook]
          # Forgejo's outbound-webhook deliverer rejects private-IP
          # targets by default to block SSRF. Both Woodpecker
          # (ci.pmon.dev) and Argo CD (cd.pmon.dev) live on the same
          # LAN and resolve to 192.168.11.2, so they have to be
          # whitelisted explicitly. List domains, not CIDRs, so a new
          # service on this LAN doesn't accidentally inherit access.
          ALLOWED_HOST_LIST = ci.pmon.dev,cd.pmon.dev,git.pmon.dev,external
          [oauth2]
          # Woodpecker builds a pipeline's clone credential from the repo
          # owner's OAuth access token when the webhook arrives and only then
          # queues the pipeline; with the 1 h default a queued pipeline could
          # outlive its token and die in the clone step ("could not read
          # Username", chat and admin CD on 2026-09-18, infra/radar before).
          ACCESS_TOKEN_EXPIRATION_TIME = 86400
          {% if forgejo_jwt_secret | default('') %}
          # Pinned (inventory) — signs OAuth2 access tokens; must be identical
          # on both Pis or tokens issued by one are rejected after a failover.
          JWT_SECRET = {{ forgejo_jwt_secret }}
          {% endif %}
      diff: false  # the database password and Forgejo's secrets - a --check --diff preview would print them
      notify: Restart Forgejo

    # no git over SSH (DISABLE_SSH): the keys Forgejo wrote for the Pis' sshd go - pi1's held ten's key, pi2's none
    # (written on the Pi that took the request); left, sshd would still let that key in as the forgejo user
    - name: Forgejo's SSH keys file gone
      tags: [forgejo-config]
      ansible.builtin.file:
        path: /var/lib/forgejo/.ssh/authorized_keys
        state: absent

    - name: Install Forgejo systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/forgejo.service
        mode: '0644'
        content: |
          [Unit]
          Description=Forgejo Git Forge
          After=network-online.target var-lib-forgejo-repos.mount patroni.service haproxy.service
          Wants=network-online.target
          Requires=haproxy.service
          RequiresMountsFor=/var/lib/forgejo/repos
          [Service]
          Type=simple
          User=forgejo
          Group=forgejo
          WorkingDirectory=/var/lib/forgejo
          ExecStart=/usr/local/bin/forgejo web --config /var/lib/forgejo/custom/conf/app.ini
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart Forgejo

    - name: Enable and start Forgejo
      ansible.builtin.systemd:
        name: forgejo
        enabled: true
        state: started
        daemon_reload: true
      register: _forgejo_start

    # a restart that failed or was refused (the other Pi not serving, Forgejo not back in 180 s) left its files written
    # and Forgejo running on the ones before; a re-run, the files unchanged, notified nothing. Pending by content
    # (tasks/restart-pending.yml) against the record the handler leaves once Forgejo restarted (tasks/forgejo-recorded):
    # the next run makes it. Not in a preview: it wrote neither file
    - name: Forgejo's restart pending here - its unit and config against the ones it last loaded
      tags: [forgejo-config]
      ansible.builtin.include_tasks:
        file: tasks/restart-pending.yml
        apply:
          tags: [forgejo-config]
      vars:
        loaded_service: forgejo
        loaded_files: [/etc/systemd/system/forgejo.service, /var/lib/forgejo/custom/conf/app.ini]
        # its status as the start found it: not running, it started on these files just now
        loaded_started_now: >-
          {{ ((_forgejo_start | default({})).status | default({})).ActiveState | default('active')
             not in ['active', 'activating'] }}
      when: not ansible_check_mode

    - name: Forgejo restarted where pending
      tags: [forgejo-config]
      ansible.builtin.debug:
        msg: "Forgejo on {{ inventory_hostname }} runs a unit or config other than its own files - restarted"
      changed_when: true
      notify: Restart Forgejo
      when:
        - not ansible_check_mode
        - _restart_pending.stdout_lines[0] == 'pending'

    # current: recorded now (a Pi read by the clock, without a record yet, compared by content from here on)
    - name: Forgejo's unit and config recorded as loaded - found current
      tags: [forgejo-config]
      ansible.builtin.include_tasks:
        file: tasks/restart-recorded.yml
        apply:
          tags: [forgejo-config]
      vars:
        loaded_service: forgejo
        loaded_hash: "{{ _restart_pending.stdout_lines[1] }}"
      when:
        - not ansible_check_mode
        - _restart_pending.stdout_lines[0] == 'current'

    - name: Wait for Forgejo
      ansible.builtin.uri:
        url: http://localhost:3000/
        status_code: 200
      retries: 30
      delay: 5
      until: forgejo_wait.status | default(0) == 200
      register: forgejo_wait

    - name: Forgejo's admin, where it is missing
      ansible.builtin.import_tasks: tasks/forgejo-admin.yml

    # ================================================================
    # Phase 4: Backup object store — versitygw (MinIO retired 2026-06-27)
    # ================================================================

    # rclone + the storage user/group are tagged versitygw so a targeted
    # `task deploy:versitygw` is self-contained on a fresh Pi.
    # rclone (Debian's package) replaced MinIO's mc on 2026-09-24: MinIO retired
    # dl.min.io (410 Gone) and its mc images, and RELEASE.2025-08-13 was the last
    # mc it published — an abandoned client for a store that is versitygw anyway.
    - name: Install rclone (S3 client; used by the versitygw bucket bootstrap)
      ansible.builtin.apt:
        name: rclone
        state: present
      tags: [versitygw]

    - name: Remove the retired mc binary
      ansible.builtin.file:
        path: /usr/local/bin/mc
        state: absent
      tags: [versitygw]

    - name: Create storage group (fixed GID for Gluster-neutral ownership)
      ansible.builtin.group:
        name: minio
        gid: 9000
        system: true
      tags: [versitygw]

    - name: Create storage user (fixed UID; versitygw runs as this user)
      ansible.builtin.user:
        name: minio
        uid: 9000
        group: minio
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/minio
        create_home: true
      tags: [versitygw]

    # Retire the MinIO service + binary — versitygw is the backup store now.
    # Tagged so `task deploy:versitygw` applies the full backup-store state.
    - name: Retire MinIO leftovers
      tags: [versitygw]
      block:
        - name: Check whether the retired MinIO unit is present
          ansible.builtin.stat:
            path: /etc/systemd/system/minio.service
          register: _minio_unit

        - name: Stop + disable retired MinIO service
          ansible.builtin.systemd:
            name: minio
            state: stopped
            enabled: false
          when: _minio_unit.stat.exists

        - name: Remove retired MinIO artifacts (unit, binary, env dir)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/minio.service
            - /usr/local/bin/minio
            - /etc/minio
          notify: Reload systemd daemon

    # versitygw — stateless S3 gateway, the Pi backup store (replaced MinIO
    # 2026-06-27). Object=file on the Gluster backend means both Pis run a
    # gateway with no dual-writer hazard, so there is no consul lock; keepalived
    # just routes the VIP. See tasks/versitygw.yml.
    - name: Deploy versitygw S3 gateway (Pi backup store)
      ansible.builtin.include_tasks:
        file: tasks/versitygw.yml
        apply:
          tags: [versitygw]
      tags: [versitygw]

    # ================================================================
    # Phase 5: Keycloak
    # ================================================================

    # a Keycloak already installed moves to a new version only through upgrade-keycloak.yml (its database dumped
    # first, both Pis stopped, the VIP's started first - plan 122): installed here where missing (a fresh Pi, the
    # copy's build), the same version left as it is, another one - or one this cannot read - refused
    - name: Keycloak's install here (the version /opt/keycloak names)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          if [ ! -e /opt/keycloak ]; then echo missing; exit 0; fi
          v=$(readlink -f /opt/keycloak | sed -n 's|^/opt/keycloak-\([^/]*\)/*$|\1|p')
          echo "${v:-unknown}"
      register: _keycloak_installed
      changed_when: false
      check_mode: false  # a read

    - name: The other Pi's Keycloak install (a fresh one here starts only beside the same version, or none)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          if [ ! -e /opt/keycloak ]; then echo missing; exit 0; fi
          v=$(readlink -f /opt/keycloak | sed -n 's|^/opt/keycloak-\([^/]*\)/*$|\1|p')
          echo "${v:-unknown}"
      register: _keycloak_peer_installed
      delegate_to: "{{ groups['pis'] | difference([inventory_hostname]) | first }}"
      changed_when: false
      check_mode: false
      when: _keycloak_installed.stdout == 'missing' and groups['pis'] | length > 1

    - name: Keycloak installed where missing - another version moves through task deploy:keycloak:upgrade
      ansible.builtin.assert:
        that: >-
          _keycloak_installed.stdout == keycloak_version
          or (_keycloak_installed.stdout == 'missing'
              and (groups['pis'] | length < 2 or _keycloak_peer_installed.stdout in ['missing', keycloak_version]))
        fail_msg: >-
          REFUSED: Keycloak {{ _keycloak_installed.stdout }} is installed on {{ inventory_hostname }} (the other Pi
          {{ (_keycloak_peer_installed | default({})).stdout | default('not read') }}), vars/keycloak.yml pins
          {{ keycloak_version }} - task deploy:keycloak:upgrade moves it (its dump first, both Pis stopped)
        quiet: true

    - name: Download Keycloak tarball (retry — github.com is flaky from vagrant NAT)
      ansible.builtin.get_url:
        url: "https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz"
        dest: "/opt/keycloak-{{ keycloak_version }}.tar.gz"
        checksum: "sha256:{{ keycloak_sha256 }}"
        mode: '0644'
        timeout: 60
      register: _kc_dl
      retries: 5
      delay: 15
      until: _kc_dl is succeeded

    - name: Extract Keycloak
      ansible.builtin.unarchive:
        src: "/opt/keycloak-{{ keycloak_version }}.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/keycloak-{{ keycloak_version }}"

    - name: Symlink Keycloak
      ansible.builtin.file:
        src: "/opt/keycloak-{{ keycloak_version }}"
        dest: /opt/keycloak
        state: link

    - name: Create Keycloak user
      ansible.builtin.user:
        name: keycloak
        system: true
        shell: /bin/false
        home: /opt/keycloak

    - name: Set Keycloak ownership
      ansible.builtin.file:
        path: "/opt/keycloak-{{ keycloak_version }}"
        owner: keycloak
        group: keycloak
        recurse: true

    # the passwords in a root-only file systemd reads before it drops to the keycloak user - a unit file is
    # world-readable (and `systemctl show` prints its Environment= lines to anyone)
    - name: Keycloak's secrets directory, root only
      tags: [keycloak-db-url]
      ansible.builtin.file:
        path: /etc/keycloak
        state: directory
        mode: '0700'

    - name: Keycloak's secrets, root only - written aside, put in place once their login works
      tags: [keycloak-db-url]
      ansible.builtin.copy:
        dest: /etc/keycloak/secrets.env.new
        mode: '0600'
        content: |
          KC_DB_PASSWORD={{ keycloak_db_password }}
          KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_admin_password }}
      no_log: true

    # before the unit names it: the file's login - as systemd reads an EnvironmentFile (quotes, backslashes: not as an
    # inline Environment=) - logs Keycloak's own role into its database through the host its URL names, never said, on
    # no command line; the file written aside, put in place only then. One that does not: refused, neither the secrets
    # Keycloak runs on nor its unit touched (pi2's Keycloak crash-looped on a password it could not use, both units on
    # disk naming it). Under Patroni (a first install's database host may not answer yet)
    - name: The secrets file's login works for Keycloak's role and database
      tags: [keycloak-db-url]
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          # what it needs there, as Forgejo's guard asks it: every relation its own (or a role it has), CREATE on public
          q="select (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace"
          q+=" where n.nspname not in ('pg_catalog', 'information_schema') and n.nspname !~ '^pg_toast'"
          q+=" and not pg_has_role(current_user, c.relowner, 'USAGE')) || ' ' || has_schema_privilege('public', 'CREATE')"
          systemd-run --quiet --pipe --wait --collect -p EnvironmentFile=/etc/keycloak/secrets.env.new \
            /bin/sh -c 'PGPASSWORD="$KC_DB_PASSWORD" exec psql -X -At -w -h "$1" -p "$2" -U "$3" -d keycloak -c "$4"' \
            sh '{{ keycloak_db_host_effective | trim | split(':') | first }}' '{{ keycloak_db_host_effective | trim | split(':') | last }}' \
            '{{ keycloak_db_user }}' "$q"
      register: _keycloak_login
      changed_when: false
      failed_when: _keycloak_login.rc != 0 or _keycloak_login.stdout | trim != '0 true'
      # a preview wrote no secrets file: nothing to judge
      when: _patroni_installed | bool and not ansible_check_mode

    - name: Keycloak's secrets in place - the ones just judged
      tags: [keycloak-db-url]
      ansible.builtin.copy:
        src: /etc/keycloak/secrets.env.new
        dest: /etc/keycloak/secrets.env
        remote_src: true
        mode: '0600'
      diff: false  # its content is the passwords
      no_log: true
      when: not ansible_check_mode  # a preview wrote nothing aside: nothing to put in place

    # targetServerType=any: PgBouncer hands every client the startup parameters of its first server connection, never
    # read again - one made to the replica (HAProxy's servers start up, before their first check) says in_hot_standby=on
    # for good, and Keycloak's default (primary) then refused every connection until PgBouncer restarted. HAProxy's
    # /primary check picks the primary. setup-patroni.yml writes the same URL when the port changes. --tags
    # keycloak-db-url: this unit and all it needs - the facts its URL is made of, the secrets file it names, its restart
    - name: Install Keycloak systemd service
      tags: [keycloak-db-url]
      ansible.builtin.copy:
        dest: /etc/systemd/system/keycloak.service
        mode: '0644'
        content: |
          [Unit]
          Description=Keycloak SSO
          After=network-online.target patroni.service haproxy.service pgbouncer.service
          # After PgBouncer too: its database URL goes through it (6432)
          # where it runs - at a boot it met none yet.
          # Wants (soft) rather than Requires (hard): orders start AFTER
          # patroni+haproxy when they exist, but doesn't block keycloak
          # from starting if those units aren't installed yet (fresh
          # vagrant run where playbook order matters). Keycloak retries
          # its DB connection internally so eventual-consistency is fine.
          Wants=network-online.target patroni.service haproxy.service
          [Service]
          Type=exec
          User=keycloak
          Group=keycloak
          Environment=KC_DB=postgres
          Environment=KC_DB_URL=jdbc:postgresql://{{ keycloak_db_host_effective }}/keycloak?targetServerType=any
          Environment=KC_DB_USERNAME={{ keycloak_db_user }}
          EnvironmentFile=/etc/keycloak/secrets.env
          Environment=KC_HOSTNAME=auth.pmon.dev
          Environment=KC_PROXY_HEADERS=xforwarded
          Environment=KC_HTTP_ENABLED=true
          Environment=KC_HTTP_PORT=8080
          Environment=KC_BOOTSTRAP_ADMIN_USERNAME=admin
          ExecStart=/opt/keycloak/bin/kc.sh start-dev
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      no_log: true

    - name: Enable and start Keycloak
      tags: [keycloak-db-url]
      ansible.builtin.systemd:
        name: keycloak
        enabled: true
        state: started
        daemon_reload: true
      register: _keycloak_start

    # one this run started (down before) serving before any restart: the other Pi's restart guard reads one still
    # starting as down, and refuses
    - name: Keycloak serving where this run started it
      tags: [keycloak-db-url]
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/realms/master
        status_code: 200
        timeout: 10
        follow_redirects: none
      register: _keycloak_started_serving
      until: _keycloak_started_serving.status | default(0) == 200
      retries: 120
      delay: 2
      when:
        - not ansible_check_mode
        - _keycloak_start is changed

    # Keycloak restarted where its unit or secrets file differ from what it last loaded - the Pi without the VIP first,
    # one Pi at a time (tasks/keycloak-restart.yml, setup-patroni's too)
    - name: Keycloak restarted where pending
      tags: [keycloak-db-url]
      ansible.builtin.import_tasks: tasks/keycloak-restart.yml

    - name: Wait for Keycloak
      tags: [keycloak-db-url]
      ansible.builtin.uri:
        url: http://localhost:8080/realms/master
        status_code: 200
      retries: 30
      delay: 10

    # ================================================================
    # Verification
    # ================================================================

    - name: Verify all services
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }} setup complete:
            Forgejo:   http://{{ pi_ip }}:3000/
            versitygw: http://{{ pi_ip }}:9000/
            Keycloak:  http://{{ pi_ip }}:8080/
            Postgres: {{ pi_ip }}:5432

  handlers:
    # restarted onto its settings, what it held in memory (/run, lost at a reboot) written to disk
    - name: Restart journald
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl restart systemd-journald
        journalctl --flush
      changed_when: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    # Each restart one Pi at a time (throttle), the service answering again before the next Pi's: both at once took
    # Forgejo, or Keycloak (every login, Istio's key fetch), down on both Pis together. Bounded waits. throttle does not
    # stop the second Pi when the first one's restart failed - a change that breaks one breaks both - so each restart
    # first refuses to take down the last serving copy: it runs only while the other Pi serves, or this one does not
    # (a first install, a service down already).
    # Debian's own cluster, before Patroni takes over - never under Patroni (it would start a second Postgres)
    - name: Restart Postgres
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl restart postgresql
        end=$(( $(cut -d. -f1 /proc/uptime) + 120 ))
        for _ in $(seq 60); do pg_isready -q -h 127.0.0.1 -p 5432 && exit 0; [ "$(cut -d. -f1 /proc/uptime)" -lt "$end" ] || break; sleep 2; done
        echo "Postgres on {{ inventory_hostname }} not ready 120 s after its restart" >&2; exit 1
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true
      when: not _patroni_installed | bool

    - name: Restart Forgejo
      ansible.builtin.shell: |
        /usr/local/bin/pi-restart-locked forgejo <<'RESTART'
        set -euo pipefail
        up() { curl -sf -o /dev/null --max-time 10 "http://$1:3000/api/v1/version"; }
        if up 127.0.0.1 && ! up {{ peer_ip }}; then
          echo "REFUSED on {{ inventory_hostname }}: Forgejo serves here but not on the other Pi ({{ peer_ip }})" >&2; exit 1
        fi
        systemctl restart forgejo
        end=$(( $(cut -d. -f1 /proc/uptime) + 180 ))
        for _ in $(seq 90); do
          curl -sf --max-time 10 -o /dev/null http://127.0.0.1:3000/api/v1/version && exit 0
          [ "$(cut -d. -f1 /proc/uptime)" -lt "$end" ] || break
          sleep 2
        done
        echo "Forgejo on {{ inventory_hostname }} not serving 180 s after its restart" >&2; exit 1
        RESTART
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true

    # after its restart, recorded (tasks/forgejo-recorded.yml): a restart that failed leaves the Pi out of the run and
    # the record as it was - pending at the next run. Any tag's run: a handler fires whatever the run's tags
    - name: Forgejo's unit and config recorded as it runs them
      listen: Restart Forgejo
      ansible.builtin.include_tasks:
        file: tasks/forgejo-recorded.yml
        apply:
          tags: [always]
      when: not ansible_check_mode  # a preview restarted nothing: nothing to record

    # Forgejo restarts with it (its unit Requires= haproxy): both answering again before the next Pi
    - name: Restart HAProxy
      ansible.builtin.shell: |
        /usr/local/bin/pi-restart-locked haproxy <<'RESTART'
        set -euo pipefail
        up() { curl -sf -o /dev/null --max-time 10 "http://$1:3000/api/v1/version"; }
        if up 127.0.0.1 && ! up {{ peer_ip }}; then
          echo "REFUSED on {{ inventory_hostname }}: Forgejo (restarted with HAProxy) serves here but not on the other Pi ({{ peer_ip }})" >&2
          exit 1
        fi
        systemctl restart haproxy
        end=$(( $(cut -d. -f1 /proc/uptime) + 180 ))
        for _ in $(seq 90); do
          systemctl is-active --quiet haproxy \
            && { ! systemctl is-enabled --quiet forgejo || curl -sf --max-time 10 -o /dev/null http://127.0.0.1:3000/api/v1/version; } \
            && exit 0
          [ "$(cut -d. -f1 /proc/uptime)" -lt "$end" ] || break
          sleep 2
        done
        echo "HAProxy (or Forgejo behind it) on {{ inventory_hostname }} not back 180 s after its restart" >&2; exit 1
        RESTART
      args:
        executable: /bin/bash
      throttle: 1
      changed_when: true
