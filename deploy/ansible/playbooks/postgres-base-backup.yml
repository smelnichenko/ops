---
# CNPG backs Postgres up after a change to CNPG, PostgreSQL or their store: the cluster's WAL archiving works (its
# ContinuousArchiving condition) and a fresh base backup to its object store completes. This is the backup the data
# depends on - Velero holds no data volume (local-path hostPath PVs). After a PostgreSQL major upgrade it is also the
# first base backup the new major has: the old major's WAL cannot restore it, and the daily ScheduledBackup may be up
# to a day away. The Backup object is removed afterwards; its data stays in the store.
#
# Production's done phase runs it after a step with a barman-check line - its merge phase already, once the merge that
# makes the new major live settled, for a barman-after-merge step (scripts/upgrade-production.py); the Vagrant runner
# runs the same playbook once the step's merges settled (tests/ansible/upgrade/barman-check.yml).
#
# Usage: task deploy:upgrade:done STEP=<a barman-check step>   (its first check runs it, asked first; its merge phase for a
#        barman-after-merge step) - its variables: -e pg_namespace, -e cluster, -e pg_major (the step's)
- name: CNPG backs Postgres up to its object store
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    pg_namespace: schnappy-production
    cluster: schnappy-production-postgres
    kubectl: "kubectl --kubeconfig {{ kubeconfig }} -n {{ pg_namespace }}"
  tasks:
    - name: The backup's name (fixed once - a lookup in vars is re-run on every use)
      ansible.builtin.set_fact:
        cnpg_backup: "upgrade-base-backup-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"

    # shell, not command: the command module strips the filter's double quotes
    - name: WAL archiving works (the cluster's ContinuousArchiving condition)
      ansible.builtin.shell: >-
        {{ kubectl }} get clusters.postgresql.cnpg.io {{ cluster }}
        -o jsonpath='{.status.conditions[?(@.type=="ContinuousArchiving")].status}'
      register: _archiving
      changed_when: false
      retries: 30
      delay: 10
      until: _archiving.stdout == 'True'

    # the condition can still read the old major's True right after a major upgrade: archiving proven on the server
    # running now - a WAL file switched on the primary reaches the store
    - name: The cluster's primary
      ansible.builtin.command: "{{ kubectl }} get clusters.postgresql.cnpg.io {{ cluster }} -o jsonpath={.status.currentPrimary}"
      register: _primary
      changed_when: false
      failed_when: _primary.rc != 0 or _primary.stdout | length == 0

    # a major upgrade's base backup on the new major: one taken while the old still ran is no recovery point for the new
    # (its WAL does not replay into it) - given the step's major (pg_major), the primary must run it
    - name: The primary runs the step's PostgreSQL major (pg_major, when given)
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ _primary.stdout }} -c postgres --
        psql -U postgres -Atc "show server_version_num"
      register: _server_version
      changed_when: false
      failed_when: >-
        _server_version.rc != 0
        or (pg_major | default('') | length > 0 and (_server_version.stdout | int) // 10000 != (pg_major | int))

    - name: A WAL file switched on it now
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ _primary.stdout }} -c postgres --
        psql -U postgres -Atc "select pg_walfile_name(pg_switch_wal())"
      register: _switched
      changed_when: true
      failed_when: _switched.rc != 0 or _switched.stdout | length != 24

    - name: That WAL file archived to the store (pg_stat_archiver)
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ _primary.stdout }} -c postgres --
        psql -U postgres -Atc "select coalesce(last_archived_wal, '') from pg_stat_archiver"
      register: _archived
      changed_when: false
      retries: 30
      delay: 10
      until: _archived.rc == 0 and _archived.stdout >= _switched.stdout

    # a backup of this cluster still running (a run that timed out waiting left its Backup going): another beside it
    # would stack two base backups on the store - refused until it ends
    - name: No backup of the cluster running already
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          {{ kubectl }} get backups.postgresql.cnpg.io -o json | python3 -c 'import json, sys;
          print(" ".join(b["metadata"]["name"] for b in json.load(sys.stdin)["items"]
          if b["spec"]["cluster"]["name"] == sys.argv[1]
          and (b.get("status") or {}).get("phase") not in ("completed", "failed")))' {{ cluster }}
      register: _backups_running
      changed_when: false
      failed_when: _backups_running.rc != 0 or _backups_running.stdout | length > 0

    - name: A fresh base backup
      ansible.builtin.include_tasks: tasks/cnpg-backup.yml

    - name: Remove the backup object (its data stays in the store)
      ansible.builtin.command: "{{ kubectl }} delete backups.postgresql.cnpg.io {{ cnpg_backup }}"
      changed_when: true

    - name: CNPG backs up
      ansible.builtin.debug:
        msg: "BASE BACKUP OK: WAL archiving True, {{ _switched.stdout }} archived, base backup {{ cnpg_backup }} completed"
