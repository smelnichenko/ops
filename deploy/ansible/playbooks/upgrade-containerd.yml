---
# Replace the node's container runtime: Debian's containerd 1.7 (below Kubernetes 1.34's floor and end of life) with
# containerd.io from Docker's apt repository (the 2.x line), as one install. Running containers stay up: the unit's
# KillMode=process leaves their shims running while containerd is swapped, and the new containerd reattaches to them.
#
#   1. checks: a version; the node done already (containerd.io at the target or newer, a containerd 2 config - schema
#      3 or newer; 2.3 writes 4 - the CRI answering on that version, the kubelet running) ends here; the same with the
#      kubelet stopped (a run that failed or was cut short after the swap) checks the containers the first run kept
#      against the runtime and starts the kubelet - anything less carries on;
#      while still on Debian's containerd, its live config must be 1.7's default plus exactly the settings carried
#      over (SystemdCgroup, the CRI registry config_path where an inventory sets one), or the run refuses: the new
#      config is built from containerd 2's defaults, so any other setting would be lost (ten 2026-10-04: default
#      plus SystemdCgroup only);
#   2. Docker's apt repository (ten has it since docker-ce was installed, 2026-02);
#   3. the package downloaded (apt's lists refreshed while the kubelet still runs), the live config kept as
#      config.toml.pre-containerd-io, the kubelet stopped (it must not act on the runtime during the swap), the
#      containers running then kept on the node (the first run's list - kept while the kubelet stays stopped, removed
#      once it runs again), then containerd.io installed from the download - keeping that config
#      (force-confold): the package's own default disables the CRI, the kubelet's runtime. containerd.io conflicts
#      with and replaces Debian's containerd and runc (it bundles runc). It is held: an `apt upgrade` would otherwise
#      move it, and restart the runtime under every pod;
#   4. a new config from containerd 2's own defaults (schema 4 from 2.3) with those settings;
#   5. containerd restarted on it; if the CRI does not answer, the kept config is put back and containerd restarted
#      on it (containerd 2 reads the 1.7 schema), and the run fails - the node keeps a working runtime; either way the
#      kubelet starts again only when the runtime knows every container that ran before (else it stays stopped); a
#      failure anywhere between the kubelet's stop and here (apt, the config) does the same, then fails;
#   6. proof: the server's version is the target, every container running before still runs (or finished: a Job),
#      the node Ready on that runtime.
#
# Back to Debian's containerd, by hand: apt-mark unhold containerd.io; apt-get install containerd=<the version the
# run printed> runc=<its version>; cp config.toml.pre-containerd-io config.toml; systemctl restart containerd kubelet.
#
# setup-kubeadm.yml installs Debian's containerd: it must install containerd.io at this version for a rebuild to match
# - at the production rollout, in the same change (until then its no-downgrade check refuses a full run here).
#
# Usage: only through the upgrade step whose playbook line names it - task deploy:upgrade:playbooks STEP=<step> in
# production (after its preview), task test:upgrade:step STEP=<step> on the Vagrant copy
- name: Replace containerd with containerd.io
  hosts: target
  become: true
  gather_facts: true
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    target: "{{ containerd_upgrade_to | default('') }}"
    crictl: crictl --runtime-endpoint unix:///run/containerd/containerd.sock
    # the CRI registry config_path; empty on ten, set by the Vagrant inventory for its plain-HTTP test registry
    registry_config_path: "{{ containerd_registry_config_path_override | default('') }}"
    # the containers running when the kubelet stopped, kept by the first run while the kubelet stays stopped (a re-run
    # checks against them); removed once it runs again - a later run judges the containers running then
    before_file: /etc/containerd/containers-before-containerd-io

  tasks:
    # ── 1. checks ────────────────────────────────────────────────────
    - name: The target is a version (-e containerd_upgrade_to=X.Y.Z)
      ansible.builtin.assert:
        that: target is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: "-e containerd_upgrade_to=X.Y.Z, e.g. 2.3.6"

    - name: The containerd package now installed
      check_mode: false
      ansible.builtin.shell: |
        set -o pipefail
        dpkg-query -W -f='${db:Status-Abbrev} ${Package} ${Version}\n' containerd containerd.io runc 2>/dev/null \
          | awk '$1 ~ /^[ih]i/ {print $2, $3}'
      args:
        executable: /bin/bash
      register: _installed
      changed_when: false
      failed_when: >-
        _installed.stdout_lines | select('match', '^containerd(\.io)? ') | list | length != 1

    - name: Facts - the runtime package and its version
      ansible.builtin.set_fact:
        _runtime_line: "{{ _installed.stdout_lines | select('match', '^containerd(\\.io)? ') | first }}"

    - name: The node's runtime now - config schema, CRI, runtime version
      check_mode: false
      ansible.builtin.shell: |
        set -o pipefail
        echo "schema $(awk -F' *= *' '/^version *=/ {print $2; exit}' /etc/containerd/config.toml)"
        echo "runtime $({{ crictl }} version 2>/dev/null | awk '/^RuntimeVersion/ {print $2}')"
      args:
        executable: /bin/bash
      register: _now
      changed_when: false

    - name: Is the kubelet running
      check_mode: false
      ansible.builtin.systemd_service:
        name: kubelet
      register: _kubelet_now

    - name: Facts - is the swap done (containerd.io at the target or newer, a containerd 2 config, the CRI on it)
      vars:
        _state: "{{ dict(_now.stdout_lines | map('split', ' ', 1) | map('list') | list) }}"
        _runtime: "{{ _state.runtime | default('') | regex_replace('^v', '') }}"
      ansible.builtin.set_fact:
        _swapped: >-
          {{ _runtime_line.split()[0] == 'containerd.io'
             and (_runtime_line.split()[1] | regex_replace('-.*$', '')) is version(target, '>=')
             and (_state.schema | default('0') | int) >= 3
             and _runtime | length > 0 and _runtime is version(target, '>=') }}

    - name: Nothing to do when the node is done - the swap, and the kubelet running
      when: _swapped | bool and _kubelet_now.status.ActiveState == 'active'
      block:
        - name: Already there
          ansible.builtin.debug:
            msg: "CONTAINERD ALREADY {{ _runtime_line }}, runtime {{ _now.stdout_lines | join(', ') }} (target {{ target }})"
        - name: End here
          ansible.builtin.meta: end_host

    # a run that failed (containers lost) or was cut short after the swap left the kubelet stopped: the first run's
    # list against the runtime, then the kubelet - never started on a guess
    - name: The swap done, the kubelet stopped - taken up where the run stopped
      when: _swapped | bool and _kubelet_now.status.ActiveState != 'active' and not ansible_check_mode
      block:
        - name: The first run's list of the containers running then
          ansible.builtin.stat:
            path: "{{ before_file }}"
          register: _before_list

        # the list goes when the kubelet starts on the new runtime: without it the kubelet ran on the swap since, and
        # is down now for another reason - not this playbook's to start on a guess
        - name: No list - the kubelet ran on the swap since
          ansible.builtin.fail:
            msg: >-
              containerd is swapped ({{ _runtime_line }}) and the kubelet ran on it since (its container list is gone),
              but the kubelet is {{ _kubelet_now.status.ActiveState }} now - for another reason: find it
              (journalctl -u kubelet) and start it; this playbook does not
          when: not _before_list.stat.exists

        - name: The containers the first run found running
          ansible.builtin.command: cat {{ before_file }}
          register: _before
          changed_when: false

        - name: Every one of them known to the runtime
          ansible.builtin.include_tasks: tasks/containerd-known-containers.yml

        - name: Start the kubelet
          ansible.builtin.systemd_service:
            name: kubelet
            state: started

        - name: The list removed - the kubelet runs again (a later run takes the containers running then)
          ansible.builtin.file:
            path: "{{ before_file }}"
            state: absent

        - name: Taken up
          ansible.builtin.debug:
            msg: "CONTAINERD SWAPPED BEFORE ({{ _runtime_line }}) - the kubelet was stopped; every container known, started"

        - name: End here
          ansible.builtin.meta: end_host

    - name: Still on Debian's containerd - its live config is 1.7's default plus only the settings carried over
      check_mode: false
      when: _runtime_line.split()[0] == 'containerd'
      ansible.builtin.shell: |
        set -euo pipefail
        expected=$(mktemp)
        trap 'rm -f "$expected"' EXIT
        containerd config default > "$expected"
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' "$expected"
        {% if registry_config_path | length > 0 %}
        sed -i -E "s#^(\s*)config_path = (''|\"\")\$#\1config_path = \"{{ registry_config_path }}\"#" "$expected"
        {% endif %}
        normal() { grep -v '^\s*#' "$1" | sed 's/\s*$//' | grep -v '^$'; }
        diff <(normal "$expected") <(normal /etc/containerd/config.toml)
      args:
        executable: /bin/bash
      register: _config_diff
      changed_when: false
      failed_when: _config_diff.rc != 0

    # ── 2. Docker's apt repository ───────────────────────────────────
    - name: Docker's apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Docker's apt repository (as on ten - its docker.list, checked 2026-10-04)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts.distribution_release }} stable
        mode: '0644'

    # read from the repository's own index, not apt's lists: a preview (--check) adds no repository and refreshes no
    # lists, and finds the revision all the same
    - name: The target's package revision there
      check_mode: false
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL --max-time 120 https://download.docker.com/linux/debian/dists/{{ ansible_facts.distribution_release }}/stable/binary-amd64/Packages \
          | awk '/^Package: /{p=$2} /^Version: /{if (p=="containerd.io") print $2}' \
          | grep -E '^{{ target | regex_escape }}-' | sort -V | tail -1
      args:
        executable: /bin/bash
      register: _package
      changed_when: false
      failed_when: _package.rc != 0 or _package.stdout | length == 0

    - name: The containers running now (the preview's count)
      check_mode: false
      ansible.builtin.shell: "set -o pipefail; {{ crictl }} ps -q --state running | sort"
      args:
        executable: /bin/bash
      register: _running_now
      changed_when: false

    # a preview (--check) ends here: the checks above ran for real, and everything below acts on the installed package
    - name: Preview - what the run would do
      when: ansible_check_mode
      block:
        - name: Would replace
          ansible.builtin.debug:
            msg: >-
              PREVIEW: would replace {{ _runtime_line }} with containerd.io {{ _package.stdout }} under
              {{ _running_now.stdout_lines | length }} running containers
        - name: End the preview here
          ansible.builtin.meta: end_host

    # ── 3. the package ───────────────────────────────────────────────
    # with the kubelet still running: apt's lists and the download on the network take as long as they take - past
    # some 50 s without the kubelet the node is NotReady and every Service loses its endpoints
    - name: Apt's lists current (the download below and the install after it read them)
      ansible.builtin.apt:
        update_cache: true

    # apt-get's own download-only (the apt module has none): the package and what it replaces resolved now, every .deb
    # in apt's cache for the install once the kubelet is stopped
    - name: Download containerd.io (installed from the download once the kubelet is stopped)
      ansible.builtin.command:
        argv: [apt-get, install, --download-only, --yes, --allow-change-held-packages, -o, "DPkg::Lock::Timeout=120",
               "containerd.io={{ _package.stdout }}"]
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: _downloaded
      changed_when: "'Download complete' in _downloaded.stdout"

    - name: Keep the live config (the first run's - never overwritten by a re-run)
      ansible.builtin.copy:
        src: /etc/containerd/config.toml
        dest: /etc/containerd/config.toml.pre-containerd-io
        remote_src: true
        mode: '0644'
        force: false

    # the kubelet stays out of the swap: a container the new containerd lost track of would otherwise be started again
    # next to the one still running (two Postgres writers on one data directory - its interlocks do not cross pod
    # namespaces). It starts again only once the runtime knows every container that ran before (step 5). Down a minute
    # or two: the node goes NotReady and every Service loses its endpoints; nothing is evicted (one node: the node
    # lifecycle controller is in full disruption and evicts no pod).
    - name: Stop the kubelet for the swap
      ansible.builtin.systemd_service:
        name: kubelet
        state: stopped

    # with the kubelet stopped the set only shrinks (a Job finishing, which the check below accepts): taken before the
    # stop, a CI pod deleted meanwhile counted as lost, one started meanwhile went unguarded. The first run's list is
    # kept while the kubelet stays stopped - a re-run of a cut-short swap checks against it - and removed once the
    # kubelet runs again (an hours-old list read the CI pods deleted since as lost)
    - name: The containers running now, kept on the node (the first run's)
      ansible.builtin.shell: |
        set -o pipefail
        [ -e {{ before_file }} ] || {{ crictl }} ps -q --state running | sort > {{ before_file }}
        cat {{ before_file }}
      args:
        executable: /bin/bash
      register: _before
      changed_when: true

    - name: The package and containerd 2's config - on any failure the kubelet comes back once the runtime knows its
        containers, and the run fails
      block:
        - name: Install containerd.io (replaces Debian's containerd and runc; keeps the live config while it starts)
          ansible.builtin.apt:
            name: "containerd.io={{ _package.stdout }}"
            dpkg_options: force-confold,force-confdef
            allow_downgrade: false
            allow_change_held_packages: true

        - name: Hold containerd.io (an apt upgrade would restart the runtime under every pod)
          ansible.builtin.dpkg_selections:
            name: containerd.io
            selection: hold

        # ── 4. containerd 2's config ─────────────────────────────────
        - name: Containerd 2's default config, with the node's settings
          ansible.builtin.shell: |
            set -euo pipefail
            containerd config default > /etc/containerd/config.toml.new
            grep -q "SystemdCgroup = false" /etc/containerd/config.toml.new
            sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml.new
            {% if registry_config_path | length > 0 %}
            grep -q "^\s*config_path = ''$" /etc/containerd/config.toml.new
            sed -i "s|^\(\s*\)config_path = ''$|\1config_path = \"{{ registry_config_path }}\"|" /etc/containerd/config.toml.new
            {% endif %}
            containerd --config /etc/containerd/config.toml.new config dump > /dev/null
            mv /etc/containerd/config.toml.new /etc/containerd/config.toml
          args:
            executable: /bin/bash
          changed_when: true
      rescue:
        - name: The runtime answers (whichever containerd is installed now)
          ansible.builtin.command: "{{ crictl }} info"
          register: _cri_after_failure
          changed_when: false
          retries: 30
          delay: 2
          until: _cri_after_failure.rc == 0

        - name: Every container that ran before known to the runtime, before the kubelet starts again
          ansible.builtin.include_tasks: tasks/containerd-known-containers.yml

        - name: Start the kubelet
          ansible.builtin.systemd_service:
            name: kubelet
            state: started

        - name: The list removed - the kubelet runs again (a later run takes the containers running then)
          ansible.builtin.file:
            path: "{{ before_file }}"
            state: absent

        - name: Failed before the restart - the kubelet is back
          ansible.builtin.fail:
            msg: >-
              {{ ansible_failed_task.name }} failed: {{ ansible_failed_result.msg | default('') }} - the runtime
              answers, every container that ran before is known to it, the kubelet started. Fix it and run again.

    # ── 5. restart; back to the kept config if the CRI does not come up ──
    - name: Containerd on the new config, its CRI answering
      block:
        - name: Restart containerd on it
          ansible.builtin.systemd_service:
            name: containerd
            state: restarted
            enabled: true
            daemon_reload: true

        - name: The CRI answers
          ansible.builtin.command: "{{ crictl }} info"
          register: _cri
          changed_when: false
          retries: 30
          delay: 2
          until: _cri.rc == 0
      rescue:
        - name: Put the kept config back
          ansible.builtin.copy:
            src: /etc/containerd/config.toml.pre-containerd-io
            dest: /etc/containerd/config.toml
            remote_src: true
            mode: '0644'

        - name: Restart containerd on the kept config
          ansible.builtin.systemd_service:
            name: containerd
            state: restarted

        - name: The CRI answers on the kept config
          ansible.builtin.command: "{{ crictl }} info"
          register: _cri_back
          changed_when: false
          retries: 30
          delay: 2
          until: _cri_back.rc == 0

        - name: On the kept config (failed after the kubelet is back)
          ansible.builtin.set_fact:
            _on_kept_config: true

    - name: Every container that ran before known to the runtime, before the kubelet starts again
      ansible.builtin.include_tasks: tasks/containerd-known-containers.yml

    - name: Start the kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: started

    - name: The list removed - the kubelet runs again (a later run takes the containers running then)
      ansible.builtin.file:
        path: "{{ before_file }}"
        state: absent

    - name: Failed - the runtime runs on the kept config
      ansible.builtin.fail:
        msg: >-
          containerd.io {{ _package.stdout }} did not serve the CRI on containerd 2's config; the kept 1.7 config is
          back and the CRI answers on it, every container still running, the kubelet started. Fix the config and run
          again - or go back to Debian's containerd (the playbook's header says how; it was {{ _runtime_line }}).
      when: _on_kept_config | default(false)

    # ── 6. proof ─────────────────────────────────────────────────────
    - name: The runtime is the target
      ansible.builtin.shell: |
        set -o pipefail
        {{ crictl }} version | awk '/^RuntimeVersion/ {print $2}'
      args:
        executable: /bin/bash
      register: _version
      changed_when: false
      failed_when: (_version.stdout | regex_replace('^v', '')) != target

    # Ready on the new runtime: a swap quicker than the node monitor's grace leaves the old Ready condition standing
    - name: The node is Ready, on the target's runtime
      ansible.builtin.shell: |
        set -o pipefail
        {{ kubectl_node }} wait node --all --for=condition=Ready --timeout=300s > /dev/null
        {{ kubectl_node }} get node -o jsonpath='{.items[*].status.nodeInfo.containerRuntimeVersion}'
      args:
        executable: /bin/bash
      vars:
        kubectl_node: kubectl --kubeconfig {{ kubeconfig }}
      register: _node_runtime
      changed_when: false
      retries: 30
      delay: 10
      until: _node_runtime.rc == 0 and _node_runtime.stdout == 'containerd://' ~ target

    # no second look at the containers once the kubelet runs: it removes the containers of pods deleted while it was
    # stopped (a CronJob's, a CI pod's), which then read as lost after a good swap - and it cannot show a container
    # started twice either. The guard before its start (every container known) is the proof that counts.

    - name: Replaced
      ansible.builtin.debug:
        msg: >-
          CONTAINERD REPLACED: {{ _runtime_line }} -> containerd.io {{ _package.stdout }} (runtime
          {{ _version.stdout }}, held); {{ _before.stdout_lines | length }} containers kept
