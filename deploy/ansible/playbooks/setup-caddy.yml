---
# Setup Caddy reverse proxy on both Pis.
#
# Provides HTTPS termination for Pi-hosted services using the cluster's
# *.pmon.dev wildcard cert (issued + auto-renewed by cert-manager via the
# Porkbun webhook), installed here from the pmon-dev-wildcard-tls secret.
# Caddy serves the file cert directly and obtains no per-host certs via ACME
# (that was a Porkbun DNS plugin's, retired 2026-06-21: it read the zone of a
# .dev name as "dev" and every renewal failed). A per-Pi systemd timer
# (caddy-wildcard-sync) re-pulls the wildcard from the cluster daily and restarts
# Caddy if it changed, so the on-Pi copy tracks cert-manager renewals on its own
# (re-running this playbook also refreshes it immediately). It pulls with a
# least-privilege SA token that can GET only the wildcard Secret.
# Caddy runs on both Pis — only the VIP holder serves traffic.
#
# Proxied services:
#   git.pmon.dev     → localhost:3000  (Forgejo), the other Pi's Forgejo while this one's does not answer - both serve
#                      (one database, the shared data): a restart of the VIP holder's Forgejo is no outage, and the VIP
#                      follows Forgejo only after a minute down (keepalived's check_forgejo); keepalived checks Caddy
#   auth.pmon.dev    → localhost:8080  (Keycloak)
#   nexus.pmon.dev   → localhost:8081  (Nexus)
#   s3.pmon.dev      → localhost:9000  (MinIO)
#
# Cluster reads and writes (the wildcard Secret, the cert-reader RBAC) run on the inventory's `target` host with its
# admin kubeconfig, never with the controller's kubectl: the controller's kubeconfig points at production, so a run
# against another inventory (the Vagrant copy) would otherwise read and write production's cluster.
#
# Caddy itself: Caddy's own release from its apt repository (Cloudsmith; its signing key pinned), the version pinned
# (caddy_version - Renovate moves it from Cloudsmith's own index, the upgrade cycle proves it), held, the source there
# for an install alone. Built before with xcaddy for the Porkbun plugin - nothing has used it since 2026-06-21 (operator,
# 2026-11-16: the official package). A restart is pending when the files Caddy runs (its Caddyfile, the wildcard pair,
# its unit) are not the ones it last loaded (a content stamp: tasks/restart-pending.yml), the pin is not installed, or
# the process running is not the pinned /usr/bin/caddy (its running image read) - so a run cut short leaves it
# pending, never forgotten. Then one Pi at a time, the VIP's holder last (tasks/caddy-turn.yml): the package installed
# on that Pi alone, its config validated by that binary, restarted under the Pi restart lock, serving again checked.
# A Caddyfile the running Caddy refuses is never written.
#
# Rollback: move caddy_version back (the pin installs either way). Never apt remove/purge caddy: its prerm stops this
# unit, and purge deletes /etc/caddy (the wildcard key, the cert-sync token and CA, the Caddyfile) and /var/lib/caddy.
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/setup-caddy.yml

- name: Setup Caddy
  hosts: pi1,pi2
  become: true
  gather_facts: true
  gather_subset: [network]  # the mounts' facts stat every Gluster mount: a hung client's held the play

  vars:
    # renovate: datasource=deb depName=caddy
    caddy_version: "2.10.0"
    peer_ip: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first]['ansible_host'] }}"

  tasks:
    # every restart of a service both Pis run (Caddy, Forgejo, HAProxy, Keycloak) holds Consul's lock pi-restart - one at a
    # time across both Pis and every Ansible run (files/pi-restart-locked.sh)
    - name: The Pi restart lock's helper
      tags: [always]
      ansible.builtin.import_tasks: tasks/pi-restart-lock.yml

    # the Caddy running: its binary and the version its image runs (/proc/<pid>/exe - the binary it started from,
    # replaced or not); the package installed
    - name: The Caddy running - its binary and the version it runs
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(systemctl show -p MainPID --value caddy)
        [ "${pid:-0}" -gt 0 ] || { echo "none none"; exit 0; }
        exe=$(readlink "/proc/$pid/exe")
        echo "${exe%% *} $("/proc/$pid/exe" version | awk '{print $1}') $pid"
      register: _caddy_running
      changed_when: false
      check_mode: false  # a read: a preview says what it would restart

    # its state too: a package removed with its config kept reads 'rc' with a version - not installed
    - name: The caddy package - its state and version
      ansible.builtin.command: dpkg-query -W -f=${db:Status-Abbrev}|${Version} caddy
      register: _caddy_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: The package absent, or installed at another version
      ansible.builtin.set_fact:
        _caddy_absent: "{{ _caddy_installed.rc != 0 or not _caddy_installed.stdout.startswith('ii') }}"
        _caddy_install: "{{ _caddy_installed.rc == 0 and _caddy_installed.stdout.startswith('ii')
                            and _caddy_installed.stdout.split('|') | last != caddy_version }}"

    # absent (a fresh Pi, the move from the xcaddy build): installed now, before the unit names /usr/bin/caddy - a new
    # path, nothing running touched (its start held back); its binary takes the config as it stands at once. An
    # installed one is moved to a new pin in its Pi's turn below, one Pi at a time
    - name: Caddy installed where absent - before its unit names the binary
      ansible.builtin.include_tasks: tasks/caddy-install.yml
      when: _caddy_absent and not ansible_check_mode

    - name: The binary just installed takes the config as it stands
      ansible.builtin.command: /usr/bin/caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      environment:
        XDG_DATA_HOME: /var/lib/caddy
        XDG_CONFIG_HOME: /etc/caddy
      changed_when: false
      when: _caddy_absent and not ansible_check_mode

    # the pin a fact too: the Verify play below (a play of its own, without this play's vars) checks it is running
    - name: The pin, for the Verify play
      ansible.builtin.set_fact:
        caddy_pinned: "{{ caddy_version }}"

    - name: Allow HTTP and HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "{{ item.name }}"
      loop:
        - { port: "80", name: "Caddy HTTP" }
        - { port: "443", name: "Caddy HTTPS" }

    - name: Create Caddy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/caddy
        - /etc/caddy/certs
        - /var/lib/caddy
        - /var/log/caddy

    # argv form (not cmd:) so ansible does NOT shlex-split and eat the jsonpath
    # backslash — kubectl needs {.data.tls\.crt} (escaped dot, literal key name).
    - name: Read the *.pmon.dev wildcard cert from the cluster (cluster host)
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - get
          - secret
          - pmon-dev-wildcard-tls
          - -n
          - schnappy-infra
          - -o
          - 'jsonpath={.data.tls\.crt}'
      delegate_to: target
      run_once: true
      register: _wildcard_crt
      changed_when: false
      failed_when: _wildcard_crt.stdout | length == 0
      check_mode: false  # a read: a preview needs it (its wait and the copies after it)

    - name: Read the *.pmon.dev wildcard key from the cluster (cluster host)
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - get
          - secret
          - pmon-dev-wildcard-tls
          - -n
          - schnappy-infra
          - -o
          - 'jsonpath={.data.tls\.key}'
      delegate_to: target
      run_once: true
      register: _wildcard_key
      changed_when: false
      no_log: true
      failed_when: _wildcard_key.stdout | length == 0
      check_mode: false  # a read: a preview needs it (its wait and the copies after it)

    - name: Install wildcard cert on the Pi
      ansible.builtin.copy:
        dest: /etc/caddy/certs/wildcard.crt
        content: "{{ _wildcard_crt.stdout | b64decode }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install wildcard key on the Pi
      ansible.builtin.copy:
        dest: /etc/caddy/certs/wildcard.key
        content: "{{ _wildcard_key.stdout | b64decode }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    # a Caddyfile the Caddy running refuses never written (its own image validates it; none running - nothing to break)
    - name: Write Caddyfile
      ansible.builtin.copy:
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0640'
        validate: >-
          {{ ('/proc/' ~ _caddy_running.stdout.split()[2] ~ '/exe') if _caddy_running.stdout.split() | length == 3 else 'true' }}
          validate --adapter caddyfile --config %s
        content: |
          {
            email admin@pmon.dev
          }

          (wildcard_tls) {
            tls /etc/caddy/certs/wildcard.crt /etc/caddy/certs/wildcard.key
          }

          # this Pi's Forgejo first; the other Pi's while this one's refuses a connection (the request tried there
          # at once) or fails its health check. Nexus has no such peer: it runs on the VIP's Pi alone
          git.pmon.dev {
            import wildcard_tls
            reverse_proxy localhost:3000 {{ peer_ip }}:3000 {
              lb_policy first
              lb_try_duration 15s
              lb_try_interval 250ms
              fail_duration 30s
              health_uri /api/healthz
              health_interval 10s
              health_timeout 5s
            }
          }

          nexus.pmon.dev {
            import wildcard_tls
            reverse_proxy localhost:8081
          }

          nexus-docker.pmon.dev {
            import wildcard_tls
            reverse_proxy localhost:8082
          }

          auth.pmon.dev {
            import wildcard_tls
            reverse_proxy localhost:8080
          }
      environment:
        XDG_DATA_HOME: /var/lib/caddy
        XDG_CONFIG_HOME: /etc/caddy

    - name: Create Caddy systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy.service
        mode: '0644'
        content: |
          [Unit]
          Description=Caddy reverse proxy
          After=network-online.target keepalived.service
          Wants=network-online.target

          [Service]
          Type=notify
          ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          TimeoutStopSec=5s
          LimitNOFILE=1048576
          LimitNPROC=512
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Environment=XDG_DATA_HOME=/var/lib/caddy
          Environment=XDG_CONFIG_HOME=/etc/caddy
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    # enabled, started by its turn below (a fresh Pi: the package installed there first)
    - name: Enable Caddy
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        daemon_reload: true

    # ── Auto-refresh: pull the renewed wildcard from the cluster on a timer ──
    # cert-manager renews the wildcard in-cluster; without this the on-Pi copy
    # goes stale and HTTPS breaks (it did once). A least-privilege SA that can
    # GET only this one Secret backs a daily per-Pi systemd timer. Applied with
    # kubectl on the cluster host (like the cert reads above).
    # The SA token is legacy/non-expiring: an off-cluster Pi can't refresh a
    # bound token, and the SA can GET only the one Secret - the wildcard's
    # certificate AND its private key: the token is as secret as the key.
    # on stdin: a file at a fixed /tmp name a local user created first (a directory: kubectl applies every file in it)
    # was applied as cluster-admin
    - name: Apply the cert-sync RBAC (cluster host)
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, apply, -f, '-']
        stdin: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: caddy-cert-reader
              namespace: schnappy-infra
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: caddy-cert-reader
              namespace: schnappy-infra
            rules:
              - apiGroups: [""]
                resources: [secrets]
                resourceNames: [pmon-dev-wildcard-tls]
                verbs: [get]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: caddy-cert-reader
              namespace: schnappy-infra
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: caddy-cert-reader
            subjects:
              - kind: ServiceAccount
                name: caddy-cert-reader
                namespace: schnappy-infra
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: caddy-cert-reader-token
              namespace: schnappy-infra
              annotations:
                kubernetes.io/service-account.name: caddy-cert-reader
            type: kubernetes.io/service-account-token
      delegate_to: target
      run_once: true
      register: _rbac
      changed_when: "'created' in _rbac.stdout or 'configured' in _rbac.stdout"

    # argv form preserves the jsonpath backslash (see the cert reads above).
    - name: Wait for + read the cert-reader token (cluster host)
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - get
          - secret
          - caddy-cert-reader-token
          - -n
          - schnappy-infra
          - -o
          - 'jsonpath={.data.token}'
      delegate_to: target
      run_once: true
      register: _cert_reader_token
      changed_when: false
      until: _cert_reader_token.stdout | length > 0
      retries: 15
      delay: 2
      no_log: true
      check_mode: false  # a read: a preview needs it (its wait and the copies after it)

    - name: Read the cert-reader CA (cluster host)
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - get
          - secret
          - caddy-cert-reader-token
          - -n
          - schnappy-infra
          - -o
          - 'jsonpath={.data.ca\.crt}'
      delegate_to: target
      run_once: true
      register: _cert_reader_ca
      changed_when: false
      check_mode: false  # a read: a preview needs it (its wait and the copies after it)

    - name: Read the cluster API endpoint for the Pi client (cluster host)
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - config
          - view
          - --minify
          - -o
          - 'jsonpath={.clusters[0].cluster.server}'
      delegate_to: target
      run_once: true
      register: _cluster_api
      changed_when: false
      check_mode: false  # a read: a preview needs it (its wait and the copies after it)

    - name: Install cluster CA for the cert-sync client
      ansible.builtin.copy:
        dest: /etc/caddy/cluster-ca.crt
        content: "{{ _cert_reader_ca.stdout | b64decode }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install cluster token for the cert-sync client
      ansible.builtin.copy:
        dest: /etc/caddy/cluster-token
        content: "{{ _cert_reader_token.stdout | b64decode }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Install the wildcard cert-sync script
      ansible.builtin.copy:
        dest: /usr/local/bin/caddy-wildcard-sync.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          # Pull the *.pmon.dev wildcard cert from the cluster and restart Caddy
          # if it changed. cert-manager auto-renews the wildcard in-cluster; this
          # keeps the on-Pi file copy fresh without re-running the deploy by hand.
          # The apiserver endpoint is captured at deploy time — a control-plane
          # re-IP needs re-running this playbook. A stalled sync is caught by the
          # CaddyWildcardSyncStalled alert (issued-vs-served cert mismatch).
          set -euo pipefail
          api="{{ _cluster_api.stdout }}"
          ca=/etc/caddy/cluster-ca.crt
          dest=/etc/caddy/certs
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          # the token on curl's descriptor, never its command line (any local user reads those in /proc - and the
          # token reads the wildcard's private key); read whole - the file has no newline at its end, so `read`
          # returns 1 on it and set -e ended the script there
          token=$(< /etc/caddy/cluster-token)
          curl -sf --max-time 60 --cacert "$ca" \
            -K <(printf 'header = "Authorization: Bearer %s"\n' "$token") \
            "$api/api/v1/namespaces/schnappy-infra/secrets/pmon-dev-wildcard-tls" \
            -o "$tmp/secret.json"
          python3 - "$tmp" <<'PY'
          import base64, json, sys
          t = sys.argv[1]
          d = json.load(open(t + "/secret.json"))["data"]
          assert "tls.crt" in d and "tls.key" in d, "secret missing tls.crt/tls.key"
          open(t + "/tls.crt", "wb").write(base64.b64decode(d["tls.crt"]))
          open(t + "/tls.key", "wb").write(base64.b64decode(d["tls.key"]))
          PY
          # restart if EITHER half changed (a re-key may leave the leaf equal)
          if ! cmp -s "$tmp/tls.crt" "$dest/wildcard.crt" \
             || ! cmp -s "$tmp/tls.key" "$dest/wildcard.key"; then
            install -o root -g root -m 0644 "$tmp/tls.crt" "$dest/wildcard.crt"
            install -o root -g root -m 0600 "$tmp/tls.key" "$dest/wildcard.key"
            systemctl restart caddy
            logger -t caddy-wildcard-sync "wildcard cert refreshed from cluster; caddy restarted"
          fi

    - name: Install the cert-sync systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy-wildcard-sync.service
        mode: '0644'
        content: |
          [Unit]
          Description=Sync *.pmon.dev wildcard cert from the cluster to Caddy
          After=network-online.target caddy.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/caddy-wildcard-sync.sh
      notify: Reload systemd

    - name: Install the cert-sync systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy-wildcard-sync.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Daily *.pmon.dev wildcard cert sync for Caddy

          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Reload systemd

    - name: Enable the cert-sync timer
      ansible.builtin.systemd_service:
        name: caddy-wildcard-sync.timer
        enabled: true
        state: started
        daemon_reload: true

    # a run killed inside the install left Cloudsmith's source (its always skipped): gone on every run
    - name: Caddy's apt repository never left behind
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/caddy-stable.list
        state: absent

    # ── one Pi at a time, the VIP's holder last: the pin installed, restarted where pending ──
    - name: Caddy's files against the ones it last loaded
      ansible.builtin.include_tasks: tasks/restart-pending.yml
      vars:
        loaded_service: caddy
        loaded_files: [/etc/caddy/Caddyfile, /etc/caddy/certs/wildcard.crt, /etc/caddy/certs/wildcard.key,
                       /etc/systemd/system/caddy.service]
      when: not ansible_check_mode

    - name: Its restart pending - other files, the pin not installed, or not the pinned /usr/bin/caddy running
      ansible.builtin.set_fact:
        _caddy_pending: >-
          {{ _caddy_install or ((_restart_pending | default({})).stdout_lines | default(['pending']) | first) == 'pending'
             or (_caddy_running.stdout.split()[:2] | join(' ')) != '/usr/bin/caddy v' ~ caddy_version }}

    - name: Any Pi pending
      ansible.builtin.set_fact:
        _caddy_any_pending: >-
          {{ ansible_play_hosts | map('extract', hostvars) | map(attribute='_caddy_pending', default=false) | select | list | length > 0 }}

    - name: The Pi holding the VIP - its Caddy the last
      ansible.builtin.include_tasks: tasks/pi-vip-holder.yml
      when: _caddy_any_pending

    - name: Both Pis in the play before any turn - the holder's needs the other serving
      ansible.builtin.assert:
        that: groups['pis'] | difference(ansible_play_hosts) | length == 0
        fail_msg: "{{ groups['pis'] | difference(ansible_play_hosts) | join(', ') }} not in the play - no Caddy restarted"
        quiet: true
      when: _caddy_any_pending

    - name: The Pi without the VIP first
      ansible.builtin.include_tasks: tasks/caddy-turn.yml
      when: _caddy_any_pending and inventory_hostname != pi_vip_holder

    - name: Both Pis still in the play before the holder's turn
      ansible.builtin.assert:
        that: groups['pis'] | difference(ansible_play_hosts) | length == 0
        fail_msg: >-
          {{ groups['pis'] | difference(ansible_play_hosts) | join(', ') }} left the play (its install, validate, restart
          or serving failed) - the holder {{ pi_vip_holder }}'s Caddy untouched
        quiet: true
      when: _caddy_any_pending

    - name: The VIP's holder last
      ansible.builtin.include_tasks: tasks/caddy-turn.yml
      when: _caddy_any_pending and inventory_hostname == pi_vip_holder

    - name: Nothing pending - its files recorded current
      ansible.builtin.include_tasks: tasks/restart-recorded.yml
      vars:
        loaded_service: caddy
        loaded_hash: "{{ _restart_pending.stdout_lines[1] }}"
      when: not _caddy_any_pending and not ansible_check_mode and _restart_pending.stdout_lines[0] == 'current'

    # the xcaddy build it replaced: gone once the pinned /usr/bin/caddy runs (removed before, a crash meanwhile restarted
    # the old unit's missing binary); nothing on PATH runs an old binary after
    - name: The Caddy running now - the pinned /usr/bin/caddy
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(systemctl show -p MainPID --value caddy)
        echo "$(readlink "/proc/$pid/exe" | cut -d' ' -f1) $("/proc/$pid/exe" version | awk '{print $1}')"
      register: _caddy_now
      changed_when: false
      failed_when: _caddy_now.stdout != '/usr/bin/caddy v' ~ caddy_version
      when: not ansible_check_mode

    - name: The xcaddy-built Caddy and xcaddy removed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/usr/local/bin/caddy, /usr/local/bin/xcaddy]
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

# ─── Verify ─────────────────────────────────────────────────────────────────
- name: Verify Caddy
  # each Pi checked (pinned to pi1, the check was skipped without a word while pi1 was down); each Pi's own Caddy
  hosts: pis
  become: true
  gather_facts: false

  tasks:
    - name: Wait for cert provisioning
      ansible.builtin.pause:
        seconds: 15

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check Caddy status
      ansible.builtin.set_fact:
        caddy_status:
          stdout: "{{ ansible_facts.services['caddy.service'].state | default('unknown') }}"

    # this Pi's own Caddy running: git.pmon.dev below reaches the VIP's Pi only - the other Pi's Caddy is first used
    # when the VIP moves to it
    - name: This Pi's Caddy running
      ansible.builtin.assert:
        that: caddy_status.stdout == 'running'
        fail_msg: "{{ inventory_hostname }}'s Caddy is {{ caddy_status.stdout }} - the VIP moving here would serve nothing"
        quiet: true
      # a preview (--check) of a first install has no Caddy yet: it shows the state, a run judges it
      when: not ansible_check_mode

    # the version pinned is the version running: the process's own image (/proc/<pid>/exe), not the file on disk
    - name: This Pi's Caddy the pinned version
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(systemctl show -p MainPID --value caddy)
        "/proc/$pid/exe" version | awk '{print $1}'
      register: caddy_running_version
      changed_when: false
      failed_when: caddy_running_version.stdout != 'v' ~ (caddy_pinned | default('not set by the play above'))
      when: not ansible_check_mode

    # a run's verdicts: a preview (--check) skips the uri module, and its result then has no status - the print below
    # failed every preview (2026-11-16)
    - name: Test HTTPS Forgejo
      ansible.builtin.uri:
        url: https://git.pmon.dev/api/v1/version
        status_code: 200
        validate_certs: true
      register: forgejo_https
      retries: 12
      delay: 10
      until: forgejo_https.status == 200
      when: not ansible_check_mode

    - name: Print results
      when: not ansible_check_mode
      ansible.builtin.debug:
        msg: |
          ============================================
          Caddy Setup — Complete
          ============================================
          Status: {{ caddy_status.stdout }}
          Forgejo HTTPS: {{ forgejo_https.status }}
          ============================================
