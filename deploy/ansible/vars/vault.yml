---
# Vault shared variables — used by setup-vault-pi.yml.
#
# Per-environment overrides (see also vars/vault-vagrant.yml):
#   -e vault_arch=amd64          (Vagrant x86_64)

# ── Vault binary ────────────────────────────────────────────────────────────
# setup-vault-pi.yml installs it where Vault is missing; upgrade-vault.yml moves a running pair to it. 1.21.4 is the
# 1.21 line's last Community build (HashiCorp ships Community fixes on the newest line only; 2.x comes later)
# renovate: datasource=docker depName=hashicorp/vault versioning=semver
vault_version: "2.2.2"
vault_arch: "arm64"            # arm64 for Pi, amd64 for Vagrant/x86_64
# the zips' lines of HashiCorp's signed SHA256SUMS (scripts/renovate-checksums.py - moved with the version, never by
# hand)
vault_checksums:
  arm64: 78634c8672601ad1ca9b27f24e76c54224d12521c59ece957ab8d23976ddca12
  amd64: 5700edf139113609962fe371af7d2a53de8ecb720d545dc39b43de204515d3c4

# ── Shared DNS (SAN + api_addr) ─────────────────────────────────────────────
vault_pi_dns: "vault.schnappy.io"

# ── Shamir seal params ──────────────────────────────────────────────────────
vault_unseal_shares: 3
vault_unseal_threshold: 2
