[defaults]
inventory = inventory/localhost.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
deprecation_warnings = False
executable = /bin/bash
# vagrant-libvirt SSH connections drop intermittently when 3 VMs boot
# concurrently. Stop ssh from giving up at the first dropped read.
timeout = 60

[inventory]
enable_plugins = yaml, ini

[ssh_connection]
# modules piped to the remote python, no terminal allocated (-tt): a command that would ask for a password (a client
# with none) fails instead of waiting on a prompt for good, and each task saves ssh round trips. sudo on ten and the
# Pis has no requiretty (read 2026-10-07).
pipelining = True
retries = 5
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=30
