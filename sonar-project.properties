sonar.projectKey=schnappy-ops
sonar.projectName=Schnappy Ops
sonar.sources=deploy/ansible,tests/ansible,scripts
sonar.exclusions=**/*.md,**/vars/vault-*.yml,**/venv/**
sonar.sourceEncoding=UTF-8

# Ansible playbooks, shell scripts and test fixtures carry no executable unit
# coverage, so coverage is not a meaningful gate here. Excluding everything from
# coverage makes new_coverage N/A (the gate skips it) while still enforcing the
# violations, duplication and security-hotspot conditions, which do apply.
sonar.coverage.exclusions=**/*

# The unit harnesses' fixtures carry fake credentials by design - a stand-in Vault's answers (fakevault.py), the values
# a template is rendered with (the two gen.py): S2068 (a hard-coded credential) does not apply to those three files -
# every other file, the harnesses' shared modules among them, stays under it.
sonar.issue.ignore.multicriteria=fakevault,seedgen,envgen
sonar.issue.ignore.multicriteria.fakevault.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.fakevault.resourceKey=tests/ansible/unit/seed-vault-gate/fakevault.py
sonar.issue.ignore.multicriteria.seedgen.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.seedgen.resourceKey=tests/ansible/unit/seed-vault-gate/gen.py
sonar.issue.ignore.multicriteria.envgen.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.envgen.resourceKey=tests/ansible/unit/create-environment-values/gen.py
