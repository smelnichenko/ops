sonar.projectKey=schnappy-ops
sonar.projectName=Schnappy Ops
sonar.sources=deploy/ansible,tests/ansible,scripts
sonar.exclusions=**/*.md,**/vars/vault-*.yml,**/venv/**
sonar.sourceEncoding=UTF-8

# Ansible playbooks, shell scripts and test fixtures carry no executable unit
# coverage, so coverage is not a meaningful gate here. Excluding everything from
# coverage makes new_coverage N/A (the gate skips it) while still enforcing the
# violations, duplication and security-hotspot conditions, which do apply.
sonar.coverage.exclusions=**/*

# The unit harnesses' fixtures carry fake credentials by design (a stand-in Vault's answers, the values a template is
# rendered with): S2068 (a hard-coded credential) does not apply to them - everything else stays under it.
sonar.issue.ignore.multicriteria=fixturecreds
sonar.issue.ignore.multicriteria.fixturecreds.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.fixturecreds.resourceKey=tests/ansible/unit/**
