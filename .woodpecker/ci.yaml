# CI: Lint and analyze on push

# ONE run per change: the pull request's. With `push` listed too, every push to a branch that has an
# open PR fired BOTH pipelines - two identical runs of the same sha, racing for the same agent.
# Nothing lands here without a PR, so the PR run is the gate; deployment stays on cd.yaml's push.
when:
  - event: pull_request
  # AND the merge commit on main. Not a duplicate: the pull_request run tests the PR's own head, and two
  # PRs that were each green apart can still break main together. This repo has no other gate - Argo
  # applies main to the live cluster - so the tree that actually lands is checked here.
  - event: push
    branch: main

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 100

steps:
  - name: ansible-lint
    image: git.pmon.dev/schnappy/ansible-lint:latest
    commands:
      - ansible-lint deploy/ansible/playbooks/*.yml --exclude deploy/ansible/roles/
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 1000m, memory: 512Mi }

  - name: ansible-unit
    image: git.pmon.dev/schnappy/ansible-lint:latest
    commands:
      - bash tests/ansible/unit/run.sh
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 1000m, memory: 512Mi }

  - name: skills
    image: git.pmon.dev/schnappy/ansible-lint:latest
    commands:
      - python3 .claude/skills/check-skills.py
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 256Mi }

  - name: sonar
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    commands:
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "Skipping SonarQube (no token or URL)"; exit 0; }'
      - sonar-scanner -Dsonar.qualitygate.wait=false
    depends_on: [ansible-lint, ansible-unit, skills]
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
