version: '3'

dotenv: ['.env']

vars:
  TARGET_HOST: '{{.TARGET_HOST | default "192.168.11.2"}}'
  TARGET_USER: '{{.TARGET_USER | default "sm"}}'
  SRC_DIR: '{{.SRC_DIR | default "../"}}'
  # the Vagrant copy's deciding settles (after its build and after a change): a 120 s quiet window, green held 2 polls 5 s
  # apart - a slower crash loop settles once and the restart history fails it at the next settle
  COPY_SETTLE: -e restart_quiet=120 -e stable_polls=2 -e poll_seconds=5

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============== BUILD ==============
  build:backend:
    desc: Build backend JAR
    dir: '{{.SRC_DIR}}/monitor'
    cmds:
      - ./gradlew bootJar -x test

  # ============== LOCAL DEV ==============
  dev:
    desc: Start local development environment
    vars:
      GIT_HASH:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BUILD_TIME:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - GIT_HASH={{.GIT_HASH}} BUILD_TIME={{.BUILD_TIME}} docker compose up -d --build
      - echo ""
      - echo "=== Development Environment Started ==="
      - echo "Frontend http://localhost:3000"
      - echo "Backend API http://localhost:8080/api"

  dev:infra:
    desc: Start only infrastructure (postgres, valkey, kafka, scylla, minio) for IDE debugging
    cmds:
      - docker compose up -d postgres valkey kafka scylla minio
      - docker compose up scylla-init
      - echo ""
      - echo "=== Infrastructure Started ==="
      - echo "PostgreSQL localhost:5432"
      - echo "Valkey     localhost:6379"
      - echo "Kafka      localhost:9092"
      - echo "ScyllaDB   localhost:9042"
      - echo "MinIO      localhost:9000"
      - echo ""
      - echo "Run backend from IDE with ./gradlew bootRun"

  dev:monitoring:
    desc: Start with Prometheus and Grafana
    vars:
      GIT_HASH:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BUILD_TIME:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - GIT_HASH={{.GIT_HASH}} BUILD_TIME={{.BUILD_TIME}} docker compose --profile monitoring up -d --build
      - echo ""
      - echo "=== Development Environment with Monitoring ==="
      - echo "Frontend http://localhost:3000"
      - echo "Backend API http://localhost:8080/api"
      - echo "Prometheus http://localhost:9090"
      - echo "Grafana http://localhost:3001 (admin/admin)"

  dev:logs:
    desc: Tail logs from all containers
    cmds:
      - docker compose logs -f

  dev:stop:
    desc: Stop local development environment
    cmds:
      - docker compose down

  dev:clean:
    desc: Stop and remove all data
    cmds:
      - docker compose down -v

  # ============== TEST ==============
  test:
    desc: Run all tests
    cmds:
      - task: test:backend

  test:backend:
    desc: Run backend tests
    dir: '{{.SRC_DIR}}/monitor'
    cmds:
      - ./gradlew test

  test:e2e:install:
    desc: Install Playwright browsers (run once after npm install or Playwright version bump)
    dir: '{{.SRC_DIR}}/site'
    cmds:
      - npx playwright install chromium

  test:e2e:
    desc: Run E2E tests with Playwright (requires running app)
    dir: '{{.SRC_DIR}}/site'
    deps: [test:e2e:install]
    cmds:
      - npx playwright test

  test:e2e:ui:
    desc: Run E2E tests with Playwright UI
    dir: '{{.SRC_DIR}}/site'
    deps: [test:e2e:install]
    cmds:
      - npx playwright test --ui

  # ============== HYPERFOIL (production load/stress tests) ==============
  # k6 is no longer used for load testing — only the smoke test (the Argo
  # PostSync hook in platform helm/schnappy; the schnappy-test chart carries
  # the CronJob variant the DR drill runs). All load/stress/spike/soak
  # work runs through Hyperfoil, which reports to s3gw + reports.pmon.dev.
  test:hyperfoil:load:
    desc: Run Hyperfoil load test in production (5min, reports to s3gw)
    cmds:
      - ssh ten 'kubectl delete job hf-load -n schnappy-production 2>/dev/null; kubectl create job hf-load --from=cronjob/schnappy-production-hyperfoil-load -n schnappy-production'
      - echo "Waiting for completion (~5min)..."
      - ssh ten 'kubectl wait --for=condition=complete job/hf-load -n schnappy-production --timeout=600s'
      - ssh ten 'kubectl logs job/hf-load -n schnappy-production 2>/dev/null | tail -10'

  # The stress / spike / soak tasks share one chart-templated Job spec
  # (cm/schnappy-production-hyperfoil-jobspec) so all the in-cluster
  # values — image, hostnames, secrets — stay under GitOps. The task
  # seds the scenario filename + report prefix into the spec, then
  # `kubectl create -f`s it. CronJobs aren't used: stress and spike
  # are operator-driven, soak is too long for a regular schedule.
  test:hyperfoil:_run:
    internal: true
    requires: { vars: [BENCHMARK_FILE, REPORT_PREFIX, TIMEOUT] }
    cmds:
      - |
        ssh ten "kubectl -n schnappy-production get cm schnappy-production-hyperfoil-jobspec \
          -o jsonpath='{.data.job\.yaml}' \
          | sed -e 's|__BENCHMARK_FILE__|{{.BENCHMARK_FILE}}|g' \
                -e 's|__REPORT_PREFIX__|{{.REPORT_PREFIX}}|g' \
          | kubectl create -f -"
      - echo "Started, waiting (timeout {{.TIMEOUT}})..."
      - |
        ssh ten "kubectl -n schnappy-production wait --for=condition=complete \
          --timeout={{.TIMEOUT}} \
          job -l app.kubernetes.io/component=hyperfoil-stress \
          --field-selector=status.successful=0 || true; \
          kubectl -n schnappy-production logs --tail=10 \
          job -l app.kubernetes.io/component=hyperfoil-stress \
          --max-log-requests=10 2>/dev/null | tail -15"

  test:hyperfoil:stress:
    desc: Hyperfoil stress test (10min ramp 100→1000 users/sec)
    cmds:
      - task: test:hyperfoil:_run
        vars: { BENCHMARK_FILE: stress-test.hf.yaml, REPORT_PREFIX: stress, TIMEOUT: 900s }

  test:hyperfoil:spike:
    desc: Hyperfoil spike test (60s baseline → 30s burst @ 1000/s → 90s recovery)
    cmds:
      - task: test:hyperfoil:_run
        vars: { BENCHMARK_FILE: spike-test.hf.yaml, REPORT_PREFIX: spike, TIMEOUT: 300s }

  test:hyperfoil:soak:
    desc: Hyperfoil soak test (30min sustained @ 200 users/sec — surfaces leaks)
    cmds:
      - task: test:hyperfoil:_run
        vars: { BENCHMARK_FILE: soak-test.hf.yaml, REPORT_PREFIX: soak, TIMEOUT: 2400s }

  # ============== JOOQ ==============
  jooq:generate:
    desc: Generate jOOQ classes from database (requires running postgres)
    dir: '{{.SRC_DIR}}/monitor'
    cmds:
      - ./gradlew jooqCodegen

  # ============== DEPLOY ==============
  deploy:install:
    desc: Create project-local Ansible venv and install dependencies
    dir: deploy/ansible
    status:
      - test -f venv/bin/ansible-playbook
      # installed again on any difference from the pins (a proof records them, production's phases compare)
      - ../../scripts/ansible-versions.py --check
    cmds:
      - python3 -m venv venv
      - venv/bin/pip install -q -r requirements.txt
      # --force: galaxy skips a collection the ansible package bundles ("already installed"), and the project's path -
      # what ansible.cfg loads first, what the check reads - then lacks it
      - venv/bin/ansible-galaxy collection install -r requirements.yml -p collections --force

  # bootstrap's vault-eso alone: Vault's Kubernetes auth written for the kube context's cluster (refused unless it is
  # the one the Pi Vault serves), External Secrets' login on it proven, then the old reviewer token deleted
  deploy:vault-eso:
    desc: "PRODUCTION: External Secrets' login to the Pi Vault - written, proven (else put back), the old token deleted"
    prompt: "Switch External Secrets' login to PRODUCTION's Pi Vault (every ExternalSecret logs in anew)?"
    cmds:
      - ./bootstrap.sh vault-eso

  deploy:full:
    desc: Full deployment - kubeadm + consul + pi services + patroni + vault + argocd
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-nexus.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-kubeadm.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-consul.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-pi-services.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-patroni.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/seed-vault-secrets.yml -e @vars/vault.yml
      # External Secrets' login to the Pi Vault, once Vault serves (setup-kubeadm installed External Secrets)
      - cd ../.. && ./bootstrap.sh vault-eso
      # Argo CD's Forgejo account and its token in Vault, before setup-argocd gives the repo-creds Secret that token
      # (Argo CD clones the private infra before it installs External Secrets). It derives what Argo CD reads from
      # infra's main on Forgejo: the repositories pushed there first (docs/DR-PROCEDURE.md) - without them it fails
      # here, nothing installed
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-argocd-reader.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-argocd.yml -e @vars/vault.yml

  deploy:vault-pi:
    desc: "Deploy Pi Vault (Consul backend + Shamir + vault-unseal.service on both Pis); task deploy:vault-pi -- --check --diff previews it"
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml {{.CLI_ARGS}}

  deploy:vault-keys-backup:
    desc: Back up Vault unseal keys + root token off the Pis to the controller (review L4)
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/backup-vault-keys.yml

  deploy:keycloak-clients:
    desc: Ensure app realm roles exist (incl. JOBS), the Admins composite, and k6-smoke SA roles — fails on a missing role
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-keycloak-clients.yml

  deploy:gluster:
    desc: Setup GlusterFS replication for Forgejo repos between pi1 and pi2
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-gluster.yml

  deploy:caddy:
    desc: Setup Caddy TLS reverse proxy for Pi-hosted services (git, auth, nexus)
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-caddy.yml

  deploy:keepalived:
    desc: Setup Keepalived VIP (192.168.11.5) between pi1 and pi2
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-keepalived.yml {{.CLI_ARGS}}

  deploy:consul:
    desc: "PRODUCTION: Consul on both Pis and ten (setup-consul.yml) - a server restarted only with one to spare"
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    prompt: "Run setup-consul.yml on PRODUCTION (both Pis and ten)?"
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-consul.yml {{.CLI_ARGS}}

  deploy:patroni:
    desc: "PRODUCTION: Patroni on both Pis (setup-patroni.yml) - reloads or restarts paused, one node at a time"
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    prompt: "Run setup-patroni.yml on PRODUCTION's Pis?"
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-patroni.yml {{.CLI_ARGS}}

  promote:prod:
    desc: 'Promote test image tags -> prod. DRY-RUN by default; CONFIRM=1 commits+pushes. SERVICES="site monitor" limits scope (default all 7).'
    cmds:
      - |
        cd {{.SRC_DIR}}/infra
        # CD writes a tag commit to this repo on every merge: read the tags from what is on the remote NOW, not from a
        # checkout that may be hours old (a stale one promotes yesterday's image)
        [ -z "$(git status --porcelain)" ] || { echo "infra has uncommitted changes: commit or discard them first"; exit 1; }
        git pull -q --rebase
        TEST=clusters/production/schnappy-test-apps/values.yaml
        PROD=clusters/production/schnappy-production-apps/values.yaml
        SERVICES="${SERVICES:-monitor admin chat chess masi site game-scp}"
        PLAN=""; SVCS=""
        for svc in $SERVICES; do
          TAG=$(grep -E "#[[:space:]]*${svc}[[:space:]]*$" "$TEST" | grep -oP 'tag: "\K[^"]+' | head -1)
          if [ -z "$TAG" ]; then echo "  ! ${svc}: not found in test values — skipping"; continue; fi
          CUR=$(grep -E "#[[:space:]]*${svc}[[:space:]]*$" "$PROD" | grep -oP 'tag: "\K[^"]+' | head -1)
          if [ "$TAG" = "$CUR" ]; then
            echo "  = ${svc}: ${CUR} (up to date)"
          else
            echo "  + ${svc}: ${CUR:-<none>} -> ${TAG}"
            PLAN="${PLAN} ${svc}=${TAG}"; SVCS="${SVCS} ${svc}"
          fi
        done
        if [ -z "$PLAN" ]; then echo "Nothing to promote."; exit 0; fi
        if [ "${CONFIRM:-0}" != "1" ]; then
          echo; echo "DRY-RUN — re-run with CONFIRM=1 to commit + push (Argo then syncs prod)."
          exit 0
        fi
        for entry in $PLAN; do
          svc="${entry%=*}"; tag="${entry#*=}"
          sed -i -E "s|(tag: \")[^\"]*(\"[[:space:]]*#[[:space:]]*${svc}[[:space:]]*)$|\1${tag}\2|" "$PROD"
        done
        git add "$PROD"
        git commit -m "promote(prod):${SVCS} from test"
        # a CD run may have pushed in the seconds since the pull above: the commit is made, so rebase it and push
        # (2026-09-21: the push was rejected and the promotion sat unpushed until somebody noticed)
        git pull -q --rebase
        git push
        echo "Promoted:${SVCS}. Argo will sync prod."

  # ============== ONBOARDING ==============
  onboard:dev:
    desc: "Onboard a developer (Keycloak user + personal <username>-team org). Usage: task onboard:dev USER=jane EMAIL=jane@example.com [NAME=\"Jane Doe\"] [DRY_RUN=1]"
    cmds:
      - ONBOARD_USER='{{.USER}}' ONBOARD_EMAIL='{{.EMAIL}}' ONBOARD_NAME='{{.NAME}}' python3 scripts/onboard-dev.py

  deploy:seed-test-secrets:
    # Same .env as production (test shares the external keys). The playbook reads
    # every env-sourced value with lookup('env'); nothing is passed as an extra var
    # except the prefix. Precedence: a variable exported in the shell outranks .env.
    desc: Seed test-environment Vault secrets from .env (prefix schnappy-test)
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/seed-vault-secrets.yml -e vault_prefix=schnappy-test

  # ============== VAGRANT DEPLOY HELPERS (internal) ==============
  # Shared deploy chain used by every k8s-cluster Vagrant test. Assumes
  # VMs are already up (pi1 + pi2 + kubeadm); brings up the Pi data plane
  # (consul → pi-services → patroni → vault-pi) and then the kubeadm
  # cluster. Each test:FOO just re-uses this and adds its own assertion
  # playbook on top — same two-phase shape as test:dual-pi-clean.
  _vagrant:pi-stack:
    internal: true
    deps: [deploy:install]
    vars:
      # extra arguments for the Pi service playbooks (the Vagrant copy pins the Pis' versions to production's)
      PI_ARGS: '{{.PI_ARGS | default ""}}'
    cmds:
      # before anything is installed: the Pi VMs would otherwise resolve *.pmon.dev to production and route to its LAN
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/isolate-pis.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml {{.PI_ARGS}}
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml {{.PI_ARGS}}
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml {{.PI_ARGS}}
      # PgBouncer in front of Patroni as on the Pis, and Forgejo and Keycloak moved onto it (setup-pi-services picks
      # PgBouncer's port where it runs) - production's database path, :6432
      - task: _vagrant:pi-pgbouncer
        vars:
          PI_ARGS: '{{.PI_ARGS}}'
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml {{.PI_ARGS}}

  _vagrant:pi-pgbouncer:
    internal: true
    deps: [deploy:install]
    vars:
      PI_ARGS: '{{.PI_ARGS | default ""}}'
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pgbouncer.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml {{.PI_ARGS}}

  _vagrant:k8s-stack:
    internal: true
    deps: [_vagrant:pi-stack]
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-kubeadm.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-host-hardening.yml

  # ============== THE VAGRANT COPY OF PRODUCTION ==============
  # Production as it runs now: the Pis and the node at production's versions (read from production), Argo CD on
  # infra/platform main - production's git state. A change (branches of ../infra and/or ../platform) is applied to a
  # built copy as production receives it - mirrored to the copy's Forgejo, Argo syncs it - and then every check runs:
  # none is chosen per change. The checks live in tests/ansible/copy/, the run's working files in .copy/.

  test:copy:inventory:
    desc: "Read-only: production's version inventory now (ten and both Pis) into tests/ansible/copy/prod-inventory.txt, and the Pis' service versions the copy installs into tests/ansible/copy/pi-versions.yml"
    cmds:
      - cmd: scripts/production-inventory.sh

  _copy:base:
    internal: true
    deps: [deploy:install]
    cmds:
      # from nothing: every VM destroyed, and proven gone, before the build
      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      # the Pis at production's versions (pi-versions.yml: what the Pis run, where the playbooks pin another)
      - task: _vagrant:pi-stack
        vars:
          PI_ARGS: -e @../../tests/ansible/copy/pi-versions.yml
      # the Pis' shared Gluster volumes, as in production - the backup store's data dir among them: without it each
      # Pi kept its own store, and a VIP on pi2 found no velero bucket (2026-10-04)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-gluster.yml
      # the store answers on the Gluster volume, on both Pis, with every bucket (its tasks again, idempotent)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml --tags versitygw -e @../../tests/ansible/copy/pi-versions.yml
      # the Pi VIP, as in production (Vault, Git and the backup store are reached through it)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-keepalived.yml
      # Debian's packages on the Pis at production's versions (pi-versions.yml's pi_apt_versions): the archive serves
      # only its newest, production runs the security level it last took. After every package is installed, before the
      # cold boot that restarts the services on them
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/pi-apt-versions.yml -e @../../tests/ansible/copy/pi-versions.yml
      # as on ten: Argo CD owns Istio, cert-manager, metrics-server, the Prometheus stack and the data operators
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-kubeadm.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml -e platform_by_argo_override=true
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-host-hardening.yml

  test:copy:build:
    desc: Build the Vagrant copy of production from nothing - production's inventory read first, the Pis and the node at its versions, every VM booted cold once, then the Argo layer on infra/platform main; ends with the copy's inventory against production's (VMs stay up)
    cmds:
      # one copy run at a time (scripts/copy-lock.sh): another session's run refused, named
      - cmd: scripts/copy-lock.sh
      # the mirror clones the LOCAL repos: their main must be origin's (production's) - refused otherwise
      - cmd: scripts/copy-main-current.sh ../infra ../platform
      # a copy from nothing: what the last one carried (a change, a playbook) is gone with it
      - cmd: scripts/copy-refs.sh reset
      - task: test:copy:inventory
      # the record is tracked: what production moved since the last read shows here, to commit with the build's result
      - cmd: git status --short -- tests/ansible/copy/prod-inventory.txt tests/ansible/copy/pi-versions.yml
      - task: _copy:base
      # every VM shut down and booted cold once, as a node and the Pis come back after an outage: the boot order of the
      # Pi stack (Gluster mounts, Consul, Patroni, Vault's unseal) is part of what the build proves
      - cmd: vagrant halt
      - cmd: vagrant up --no-provision
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/vms-ready.yml
      - task: test:copy:argo

  test:copy:argo:
    desc: On the built VMs, add the Argo layer as on ten - seed Vault, mirror infra/platform main, preload app images, install Argo CD - and wait until every app is green; seed the data the checks read, record the scrape pools; the copy's inventory against production's
    deps: [deploy:install]
    vars:
      ALLOWED_MISSING: tests/ansible/copy/vagrant-allowed-missing.txt
    cmds:
      # one copy run at a time (scripts/copy-lock.sh): another session's run refused, named
      - cmd: scripts/copy-lock.sh
      # the host guard watching the VMs while the run works on them - the radar station shares the workstation
      # (scripts/copy-host-guard.sh: one watcher at a time; every vagrant up starts it too, the Vagrantfile's hook)
      - cmd: scripts/copy-host-guard.sh watch
      # run on its own too: the mirror clones the LOCAL repos, whose main must be origin's
      - cmd: scripts/copy-main-current.sh ../infra ../platform
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/vms-ready.yml
      # production's own seeding playbook, with test-only values (tests/ansible/copy/vagrant-secrets.env), in an
      # EMPTY environment: this Taskfile loads ops/.env (production's secrets) into every task, and a variable the
      # Vagrant file lacked would otherwise reach the Vagrant Vault with production's value
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'set -a && . tests/ansible/copy/vagrant-secrets.env && set +a && cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/seed-vault-secrets.yml'
      # production's scoped Vault token for the stale-PR-env sweeper (argocd/vault-cleanup-token), as on ten
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-cleanup-policy.yml
      - cmd: env -i HOME="$HOME" PATH="$PATH" scripts/vagrant-gitops-mirror.py --infra-ref main --platform-ref main
      # the refs the copy runs, for a later test:copy:check run on its own
      - cmd: scripts/copy-refs.sh set main main
      # the mains the copy is built from: a change after production's main moved is warned (copy-main-current.sh)
      - cmd: for r in infra platform; do echo "$r $(git -C ../$r rev-parse main)"; done > .copy/copy-built
      # Argo CD's Forgejo account on the copy, as production's (its token in the Vagrant Vault, from which setup-argocd
      # gives the repo-creds their credentials and the copy's ExternalSecret merges them): after the mirror (its repos),
      # before setup-argocd. Its infra the mirrored copy (no PR-env generator - the copy's committed list)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-argocd-reader.yml -e reader_repos_file=../../../tests/ansible/copy/vagrant-argocd-reader-repos.yml
      - cmd: scripts/vagrant-preload-images.sh ../infra ../platform main main
      # production's floating tags (postgresql:17, ...) as ten runs them, not today's builds of those tags
      - cmd: scripts/vagrant-preload-floating.sh
      # isolate the cluster from production (DNS, network - proven by a probe) and connect ESO to the Vagrant Vault
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/isolate-cluster.yml
      # objects ten has that no git repo creates (each documented in the playbook), production's wildcard certificate too
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/production-state.yml
      # as on the Pis: Caddy serves git/auth/nexus.pmon.dev on 443 with that wildcard
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-caddy.yml -e @../../tests/ansible/copy/pi-versions.yml'
      # the schnappy realm, which production keeps only in its Keycloak database: from the auth chart's import + Vault.
      # Before Argo: istiod fetches the realm's keys when it starts
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/keycloak-realm.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-argocd.yml
      # the Applications' names recorded: a change's waits want exactly these (unless it adds or removes apps). The
      # deciding settle's quiet (120 s, 2 polls 5 s apart): a fresh boot's pods restart while what they need comes up
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/argo-settled.yml -e expect_mirror=true -e record_apps=true -e restart_stage=build-$(date +%Y%m%d%H%M%S) {{.COPY_SETTLE}}
      # data every change must keep (verified by test:copy:check)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/data-check.yml -e mode=seed
      # the observability data a change must keep (ClickHouse rows, Grafana dashboards, a Tempo trace, Mimir's past);
      # ClickHouse's compatibility setting and users as platform main sets them - its seed judges them as the verify
      # does (scripts/clickhouse-expected.sh both; without them the seed expected none and production's 25.8 failed it)
      - cmd: |
          set -euo pipefail
          ch=$(scripts/clickhouse-expected.sh main)  # its own assignment: inside the here-string a failure went unseen
          read -r compat users <<< "$ch"
          [ "$compat" != - ] || compat=""
          cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/survival-check.yml -e mode=seed -e "clickhouse_compat=$compat" -e "clickhouse_users=$users"
      # the scrape pools and their target counts, the record the metrics check compares with
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/metrics-check.yml -e record_scrape_pools=true
      # production's k6 smoke once more, on demand (the chart's PostSync hook ran it already, as in production)
      - cmd: scripts/vagrant-smoke.sh main main
      # every version the Vagrant copy runs is production's (minus the documented left-outs)
      - cmd: scripts/vagrant-inventory.sh
      - cmd: scripts/inventory-diff.sh tests/ansible/copy/prod-inventory.txt .copy/vagrant-inventory.txt {{.ALLOWED_MISSING}}
      # production's, judged: the baseline a change's inventory is judged from
      - cmd: cp .copy/vagrant-inventory.txt .copy/vagrant-inventory-build.txt

  test:copy:change:
    desc: "Apply a change to the built copy as production receives it - INFRA_REF and/or PLATFORM_REF (branches of ../infra, ../platform; main where not given) mirrored to the copy's Forgejo, Argo settled on them - then every check (test:copy:check). APPS_CHANGED=true when the change adds or removes Argo apps; SCRAPE_POOLS_GONE=<pool>,<pool> for scrape pools it removes on purpose"
    deps: [deploy:install]
    vars:
      INFRA_REF: '{{.INFRA_REF | default "main"}}'
      PLATFORM_REF: '{{.PLATFORM_REF | default "main"}}'
      APPS_CHANGED: '{{.APPS_CHANGED | default "false"}}'
      SCRAPE_POOLS_GONE: '{{.SCRAPE_POOLS_GONE | default ""}}'
    cmds:
      # one copy run at a time (scripts/copy-lock.sh): another session's run refused, named
      - cmd: scripts/copy-lock.sh
      # the host guard watching the VMs while the run works on them - the radar station shares the workstation
      # (scripts/copy-host-guard.sh: one watcher at a time; every vagrant up starts it too, the Vagrantfile's hook)
      - cmd: scripts/copy-host-guard.sh watch
      # each ref holds production's main (origin/main), and the local main the mirror clones is it
      - cmd: scripts/copy-main-current.sh ../infra:{{.INFRA_REF}} ../platform:{{.PLATFORM_REF}}
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/vms-ready.yml
      # the change's images on the node before Argo sees it - a pull after the push raced Argo's own poll
      - cmd: scripts/vagrant-preload-images.sh ../infra ../platform {{.INFRA_REF}} {{.PLATFORM_REF}}
      # the refs the copy is to run, recorded first (their commits now): one that fails half-way is still a change's copy
      - cmd: scripts/copy-refs.sh set '{{.INFRA_REF}}' '{{.PLATFORM_REF}}'
      - cmd: env -i HOME="$HOME" PATH="$PATH" scripts/vagrant-gitops-mirror.py --infra-ref {{.INFRA_REF}} --platform-ref {{.PLATFORM_REF}}
      # Argo on the pushed commits, every app green and every pod ready; the apps the build recorded - or, for a change
      # that adds or removes apps, recorded anew (their names printed)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/argo-settled.yml -e expect_mirror=true {{if eq .APPS_CHANGED "true"}}-e record_apps=true{{else}}-e expect_apps=true{{end}} -e restart_stage=change-$(date +%Y%m%d%H%M%S) {{.COPY_SETTLE}}
      # the copy as the change left it, before any check: the change's own differences from it, a check's leftovers after
      - cmd: scripts/vagrant-inventory.sh && cp .copy/vagrant-inventory.txt .copy/vagrant-inventory-after-change.txt
      - task: test:copy:check
        vars:
          INFRA_REF: '{{.INFRA_REF}}'
          PLATFORM_REF: '{{.PLATFORM_REF}}'
          CHANGE: 'yes'
          SCRAPE_POOLS_GONE: '{{.SCRAPE_POOLS_GONE}}'

  test:copy:playbook:
    desc: "Apply an ops change - one playbook as production would run it (PLAYBOOK=<file in deploy/ansible/playbooks>, ARGS='-e k=v') - to the built copy behind the Vagrant guard, the isolation of the Pis and the cluster put back (a playbook on a host may rewrite what isolates it), Argo settled, then every check (test:copy:check, the change's inventory judged)"
    deps: [deploy:install]
    requires:
      vars: [PLAYBOOK]
    vars:
      ARGS: '{{.ARGS | default ""}}'
      # true for a playbook that restarts the control plane on purpose (upgrade-kubeadm, upgrade-containerd): its
      # restarts are recorded, not judged; the check after it judges against them
      RESTARTS_EXPECTED: '{{.RESTARTS_EXPECTED | default "false"}}'
    cmds:
      # one copy run at a time (scripts/copy-lock.sh): another session's run refused, named
      - cmd: scripts/copy-lock.sh
      # the host guard watching the VMs while the run works on them - the radar station shares the workstation
      # (scripts/copy-host-guard.sh: one watcher at a time; every vagrant up starts it too, the Vagrantfile's hook)
      - cmd: scripts/copy-host-guard.sh watch
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/vms-ready.yml
      # the guard first in the same run: a host that is no Vagrant VM is dropped from the playbook's plays
      # marked first, before it runs (one that fails half-way still left a change on the copy): a later test:copy:check
      # run on its own judges the copy's inventory as a change's
      - cmd: scripts/copy-refs.sh playbook '{{.PLAYBOOK}}'
      # production's secrets (ops/.env, loaded by the Taskfile) never reach it: a playbook that reads its environment
      # (seed-vault-secrets) would put them in the copy's Vault
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/vagrant-only-play.yml playbooks/{{.PLAYBOOK}} {{.ARGS}}'
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/isolate-pis.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/isolate-cluster.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/argo-settled.yml -e expect_apps=true -e restart_stage=playbook-$(date +%Y%m%d%H%M%S) -e restarts_expected={{.RESTARTS_EXPECTED}} {{.COPY_SETTLE}}
      # the copy as the change left it, before any check: the change's own differences from it, a check's leftovers after
      - cmd: scripts/vagrant-inventory.sh && cp .copy/vagrant-inventory.txt .copy/vagrant-inventory-after-change.txt
      - task: test:copy:check
        vars:
          CHANGE: 'yes'

  test:copy:check:
    desc: "Every check on the built copy: Argo settled; data, survival, storage, metrics, k6 smoke, production's data paths and isolation at once (scripts/copy-checks.sh); a barman base backup; every certificate renewed; Postgres recovered and a Velero volume restored (restore-check); a Velero backup from production's daily schedule; a Scylla Manager backup; the PR-env sweeper; the inventory against production's (after a change: its own differences printed, any it did not make judged). Run on its own it checks the refs the copy runs (.copy/copy-refs)"
    deps: [deploy:install]
    vars:
      # the refs the copy runs (test:copy:argo or test:copy:change wrote them), unless given
      COPY_INFRA_REF:
        sh: scripts/copy-refs.sh infra
      COPY_PLATFORM_REF:
        sh: scripts/copy-refs.sh platform
      COPY_CHANGE:
        sh: scripts/copy-refs.sh change
      INFRA_REF: '{{.INFRA_REF | default .COPY_INFRA_REF}}'
      PLATFORM_REF: '{{.PLATFORM_REF | default .COPY_PLATFORM_REF}}'
      CHANGE: '{{.CHANGE | default .COPY_CHANGE}}'
      SCRAPE_POOLS_GONE: '{{.SCRAPE_POOLS_GONE | default ""}}'
      ALLOWED_MISSING: tests/ansible/copy/vagrant-allowed-missing.txt
    cmds:
      # one copy run at a time (scripts/copy-lock.sh): another session's run refused, named
      - cmd: scripts/copy-lock.sh
      # the host guard watching the VMs while the run works on them - the radar station shares the workstation
      # (scripts/copy-host-guard.sh: one watcher at a time; every vagrant up starts it too, the Vagrantfile's hook)
      - cmd: scripts/copy-host-guard.sh watch
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/argo-settled.yml -e expect_mirror=true -e expect_apps=true -e restart_stage=check-$(date +%Y%m%d%H%M%S) -e stable_polls=1 -e poll_seconds=3
      # the independent checks at the same time (scripts/copy-checks.sh says what each proves): the slowest, not the sum
      - cmd: COPY_SCRAPE_POOLS_GONE='{{.SCRAPE_POOLS_GONE}}' scripts/copy-checks.sh '{{.INFRA_REF}}' '{{.PLATFORM_REF}}'
      # CNPG's WAL archiving and a fresh barman base backup: the backup production's data depends on
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/barman-check.yml
      # every Certificate renewed and Ready again at a higher revision
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/cert-check.yml
      # Postgres recovered from a fresh backup and its WAL (a marker written after it must come back) into a side
      # cluster, and a Velero file-system backup of a test namespace restored with its volume's data
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/restore-check.yml
      # a Velero backup from production's daily schedule into the Pi backup store, its volumes as the schedule decides
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/backup-check.yml
      # and from the weekly one (cluster-wide, its manifests): its template proven before its Sunday run
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/backup-check.yml -e schedule=velero-full-weekly
      # a Scylla Manager backup of each production cluster, DONE with a fresh snapshot, no failed backup or repair task
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/scylla-backup-check.yml
      # the stale PR env sweeper against the copy's Vault: a dead token fails it, the replaced one is renewed and purges
      # a preview prefix, a wrong CA fails it
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/sweeper-check.yml
      # the inventory last, after every check (a check's leftovers show): production's, minus the documented left-outs;
      # after a change: its own differences printed for review, any the build had too failing (production moved), and
      # what the checks changed since the change settled failing (a check's leftovers)
      - cmd: scripts/vagrant-inventory.sh
      - cmd: |
          if [ "{{.CHANGE}}" = yes ]; then
            scripts/copy-change-inventory.sh tests/ansible/copy/prod-inventory.txt .copy/vagrant-inventory-build.txt \
              .copy/vagrant-inventory-after-change.txt .copy/vagrant-inventory.txt {{.ALLOWED_MISSING}}
          else
            scripts/inventory-diff.sh tests/ansible/copy/prod-inventory.txt .copy/vagrant-inventory.txt {{.ALLOWED_MISSING}}
          fi

  test:eso:
    desc: Test ESO ↔ Pi Vault secret sync (ClusterSecretStore + ExternalSecret)
    deps: [deploy:install]
    cmds:
      # from nothing: every VM destroyed, and proven gone, before the build
      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      - defer: vagrant halt
      - task: _vagrant:k8s-stack
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-eso.yml

