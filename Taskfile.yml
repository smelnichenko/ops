  deploy:argocd:
    desc: Install/update Argo CD
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-argocd.yml -e @vars/vault.yml
    dotenv: ['.env']


  deploy:velero:
    desc: "The offsite git mirror of the monitor repo to the Pis (daily timer on ten); Velero and its in-cluster MinIO only where Argo CD does not own Velero (production: it does)"
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-velero.yml

  deploy:backup:
    desc: Trigger a manual Velero backup of schnappy namespace
    cmds:
      - ssh {{.TARGET_USER}}@{{.TARGET_HOST}} "kubectl exec deploy/velero -n velero -- velero backup create manual-$(date +%Y%m%d-%H%M) --include-namespaces schnappy --default-volumes-to-fs-backup --kubeconfig /etc/kubernetes/admin.conf"

