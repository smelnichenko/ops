      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/seed-vault-secrets.yml

  deploy:delete-environment:
    desc: 'Purge a Vault prefix (e.g. CLI_ARGS="-e vault_prefix=schnappy-pr-42")'
    dir: deploy/ansible
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/delete-environment.yml {{.CLI_ARGS}}

  deploy:setup-vault-cleanup-policy:
    desc: 'Provision the scoped Vault token used by the PR-env GC CronJob'
    dir: deploy/ansible
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-vault-cleanup-policy.yml

  deploy:pgbouncer:
    desc: 'PgBouncer in front of Patroni on each Pi (port 6432)'
    dir: deploy/ansible
    dotenv: ['../../.env']
    cmds:
      # its password the inventory's, from the environment (.env) - an extra variable put it on the command line
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-pgbouncer.yml

  deploy:istio:
    desc: Install Istio ambient mesh + HAProxy
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-istio.yml

  deploy:argocd:
    desc: Install/update Argo CD
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-argocd.yml -e @vars/vault.yml
    dotenv: ['.env']


  deploy:velero:
    desc: "The offsite git mirror of the schnappy organisation's repositories to the Pis (daily timer on ten); Velero and its in-cluster MinIO only where Argo CD does not own Velero (production: it does)"
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-velero.yml

  deploy:backup:
    desc: "PRODUCTION: a manual Velero backup from the daily schedule (schnappy-production, pods left out: manifests only) - in the running server pod (exec deploy/velero picked a node-agent pod); waited for, failing unless Completed"
    prompt: "Start a Velero backup on PRODUCTION?"
    cmds:
      # waited for, and judged: anything but Completed fails the task (its phase said)
      - |
        ssh {{.TARGET_USER}}@{{.TARGET_HOST}} 'set -e; n=manual-$(date +%Y%m%d-%H%M); kubectl -n velero exec "$(kubectl -n velero get pod -l name=velero --field-selector=status.phase=Running -o name | head -1)" -c velero -- /velero backup create "$n" --from-schedule velero-schnappy-daily --wait > /dev/null; p=$(kubectl -n velero get backups.velero.io "$n" -o jsonpath="{.status.phase} errors={.status.errors} warnings={.status.warnings}"); echo "$n: $p"; [ "${p%% *}" = Completed ]'

  deploy:restore:verify:
    desc: Run k6 smoke tests to validate a Velero restore
    deps: [deploy:install]
    cmds:
      - cd deploy/ansible && venv/bin/ansible-playbook -i inventory/production.yml playbooks/verify-restore.yml

  deploy:backup:status:
    desc: Check Velero backup status
    cmds:
      - ssh {{.TARGET_USER}}@{{.TARGET_HOST}} 'kubectl -n velero exec "$(kubectl -n velero get pod -l name=velero --field-selector=status.phase=Running -o name | head -1)" -c velero -- /velero backup get'

  deploy:undeploy:
    desc: Uninstall schnappy from target (keeps PVCs)
    cmds:
      - ssh {{.TARGET_USER}}@{{.TARGET_HOST}} "sudo helm uninstall schnappy -n schnappy --kubeconfig /etc/kubernetes/admin.conf"

  deploy:status:
    desc: Check deployment status on target
    cmds:
      - ssh {{.TARGET_USER}}@{{.TARGET_HOST}} "kubectl get pods,svc,ingress -n schnappy"

  deploy:ping:
    desc: Test connectivity to target host
    cmds:
      - ssh -o ConnectTimeout=5 {{.TARGET_USER}}@{{.TARGET_HOST}} "hostname && uname -a"

  # ============== ENVIRONMENTS ==============
  env:create:
    desc: "Create a new schnappy environment (usage: task env:create ENV_NAME=staging)"
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    requires:
      vars: [ENV_NAME]
    cmds:
      - >-
        venv/bin/ansible-playbook -i inventory/production.yml playbooks/create-environment.yml
        -e "env_name={{.ENV_NAME}}"

  env:destroy:
    desc: "Destroy a schnappy environment (usage: task env:destroy ENV_NAME=staging)"
    dir: deploy/ansible
    deps: [deploy:install]
    requires:
      vars: [ENV_NAME]
    cmds:
      - >-
        venv/bin/ansible-playbook -i inventory/production.yml playbooks/destroy-environment.yml
        -e "env_name={{.ENV_NAME}}"

  test:ephemeral-env:
    desc: Test ephemeral environment create/destroy lifecycle in Vagrant (assumes stack is up)
    deps: [deploy:install]
    cmds:
      # an empty environment with the copy's test values: ops/.env (loaded into every task) holds production's API and
      # mail keys, which create-environment.yml would otherwise write into the Vagrant Vault
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'set -a && . tests/ansible/copy/vagrant-secrets.env && set +a && cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-ephemeral-env.yml'

  test:ephemeral-env-clean:
    desc: Full clean ephemeral env test (destroy + up + full stack + test)
    deps: [deploy:install]
    cmds:
      # from nothing: every VM destroyed, and proven gone, before the build
      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      - defer: vagrant halt
      - task: _vagrant:k8s-stack
      - cmd: ssh -o StrictHostKeyChecking=no -i .vagrant/machines/kubeadm/libvirt/private_key vagrant@192.168.56.10 'for i in $(seq 1 30); do curl -sf http://192.168.56.50:3000/ > /dev/null && echo "Forgejo reachable" && exit 0; echo "Waiting for Forgejo ($i/30)..."; sleep 5; done; echo "FAIL"; exit 1'
      # as test:copy:argo builds the copy: infra and platform mirrored to the Vagrant Forgejo, then Argo CD's Forgejo
      # account (its token in the Vagrant Vault, from which setup-argocd gives the repo-creds their credentials), judged
      # by the copy's committed list (no PR-env generator there) - setup-argocd on a fresh cluster needs both
      - cmd: env -i HOME="$HOME" PATH="$PATH" scripts/vagrant-gitops-mirror.py
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-argocd-reader.yml -e reader_repos_file=../../../tests/ansible/copy/vagrant-argocd-reader-repos.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-argocd.yml -e @vars/vault-vagrant.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-multi-env.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'set -a && . tests/ansible/copy/vagrant-secrets.env && set +a && cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-ephemeral-env.yml -e @vars/vault-vagrant.yml'

  # ============== DUAL-PI HA TEST ==============
  # Clean two-phase chain: deploy each service (idempotent, final-state) then
  # assert. The test playbooks are pure verification — no imports, no deploys.
  test:dual-pi:
    desc: Dual-Pi HA — deploy + assert (no destroy; fast iteration)
    deps: [deploy:install]
    cmds:
      - cmd: vagrant up
      # deploy
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-gluster.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-keepalived.yml
      # assert
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-dual-pi.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-vault-unseal.yml

  test:vault-unseal:
    desc: Test Vault auto-unseal after cold start (regressions from 2026-04-20)
    deps: [deploy:install]
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-vault-unseal.yml

  test:dual-pi-clean:
    desc: Full clean dual-Pi test (destroy + up + deploy + assert)
    deps: [deploy:install]
    cmds:
      - cmd: vagrant destroy -f
        ignore_error: true
      - cmd: vagrant up
      # deploy (each idempotent, final-state)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-gluster.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-keepalived.yml
      # assert
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-dual-pi.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-vault-unseal.yml

  # ============== VAGRANT TESTS (ALL) ==============
  test:vagrant-all:
    desc: Run all Vagrant integration tests sequentially
    deps: [deploy:install]
    cmds:
      - echo "=== [1/12] test:dual-pi-clean ==="
      - task: test:dual-pi-clean
      - echo "=== [2/12] test:logs ==="
      - task: test:logs
      - echo "=== [3/12] test:grafana ==="
      - task: test:grafana
      - echo "=== [4/12] test:kafka-scylla ==="
      - task: test:kafka-scylla
      - echo "=== [5/12] test:sonarqube ==="
      - task: test:sonarqube
      - echo "=== [6/12] test:dr ==="
      - task: test:dr
      - echo "=== [7/12] test:cicd ==="
      - task: test:cicd
      - echo "=== [8/12] test:nexus ==="
      - task: test:nexus
      - echo "=== [9/12] test:woodpecker ==="
      - task: test:woodpecker
      - echo "=== [10/12] test:microservices ==="
      - task: test:microservices
      - echo "=== [11/12] test:argocd ==="
      - task: test:argocd
      - echo "=== [12/12] test:keycloak ==="
      - task: test:keycloak
      - echo ""
      - echo "=== All Vagrant tests complete ==="

  # ============== DEPLOY ==============
  vagrant:up:
    desc: Start Vagrant VMs
    cmds:
      - vagrant up

  vagrant:halt:
    desc: Stop Vagrant VMs
    cmds:
      - vagrant halt

  vagrant:destroy:
    desc: Destroy Vagrant VMs
    cmds:
      - vagrant destroy -f

  # ============== CLEAN ==============
  clean:
    desc: Clean all build artifacts
    cmds:
      - docker compose down -v --remove-orphans 2>/dev/null || true
