  test:nexus:
    desc: Test Nexus HA (active-passive on pi1+pi2, Gluster-shared, Keepalived-controlled, ten arbiter)
    deps: [deploy:install]
    cmds:
      # from nothing: every VM destroyed, and proven gone, before the build
      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      - defer: vagrant halt
      # Full Pi data-plane stack (consul → pi-services → patroni → vault-pi)
      # needed because setup-gluster runs after consul, and keepalived's
      # check_services.sh probes Forgejo/Keycloak/Patroni.
      - task: _vagrant:pi-stack
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-gluster.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-nexus.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-keepalived.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-nexus.yml

  test:dr:
    desc: Test pod recovery + disaster recovery in Vagrant - Postgres on the image production's Cluster runs (scripts/production-cnpg-image.py), or TEST_PG_IMAGE
    deps: [deploy:install]
    cmds:
      # from nothing: every VM destroyed, and proven gone, before the build
      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      - defer: vagrant halt
      - task: _vagrant:k8s-stack
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-dr.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml{{if .TEST_PG_IMAGE}} -e test_pg_image={{.TEST_PG_IMAGE}}{{end}}

  dr:drill:
    desc: Run the full DR drill (test:dr) and, only on a passing run, record restore_verify_success to the prod pushgateway (resets the RestoreVerificationFailing alert)
    vars:
      # Repo-local, not /tmp: a generic /tmp name invites another process to
      # tee over a live drill's log (it happened).
      DR_DRILL_LOG: '{{.DR_DRILL_LOG | default (printf "%s/.dr/dr-drill.log" .ROOT_DIR)}}'
    cmds:
      # pipefail keeps test:dr's own status (a failing playbook stops here,
      # before dr:record); dr:record re-checks the log's success marker so it
      # is also safe to re-run alone after a green drill.
      - cmd: mkdir -p "$(dirname "{{.DR_DRILL_LOG}}")"; set -o pipefail; task test:dr 2>&1 | tee "{{.DR_DRILL_LOG}}"
      - task: dr:record
        vars: { DR_DRILL_LOG: '{{.DR_DRILL_LOG}}' }

  dr:record:
    desc: Record the last drill's result — pushes restore_verify_success only if the drill log (DR_DRILL_LOG, default .dr/dr-drill.log) shows a fresh passing run
    vars:
      DR_DRILL_LOG: '{{.DR_DRILL_LOG | default (printf "%s/.dr/dr-drill.log" .ROOT_DIR)}}'
    env:
      DR_DRILL_LOG: '{{.DR_DRILL_LOG}}'
    cmds:
      - cmd: scripts/dr-record.sh

