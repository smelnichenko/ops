version: '3'

dotenv: ['.env']

vars:
  TARGET_HOST: '{{.TARGET_HOST | default "192.168.11.2"}}'
  TARGET_USER: '{{.TARGET_USER | default "sm"}}'
  SRC_DIR: '{{.SRC_DIR | default "../"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============== BUILD ==============
  build:backend:
    desc: Build backend JAR
    dir: '{{.SRC_DIR}}/monitor'
    cmds:
      - ./gradlew bootJar -x test

  # ============== LOCAL DEV ==============
  dev:
    desc: Start local development environment
    vars:
      GIT_HASH:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BUILD_TIME:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - GIT_HASH={{.GIT_HASH}} BUILD_TIME={{.BUILD_TIME}} docker compose up -d --build
      - echo ""
      - echo "=== Development Environment Started ==="
      - echo "Frontend http://localhost:3000"
      - echo "Backend API http://localhost:8080/api"

  dev:infra:
    desc: Start only infrastructure (postgres, valkey, kafka, scylla, minio) for IDE debugging
    cmds:
      - docker compose up -d postgres valkey kafka scylla minio
      - docker compose up scylla-init
      - echo ""
      - echo "=== Infrastructure Started ==="
      - echo "PostgreSQL localhost:5432"
      - echo "Valkey     localhost:6379"
      - echo "Kafka      localhost:9092"
      - echo "ScyllaDB   localhost:9042"
      - echo "MinIO      localhost:9000"
      - echo ""
      - echo "Run backend from IDE with ./gradlew bootRun"

  dev:monitoring:
    desc: Start with Prometheus and Grafana
    vars:
      GIT_HASH:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BUILD_TIME:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - GIT_HASH={{.GIT_HASH}} BUILD_TIME={{.BUILD_TIME}} docker compose --profile monitoring up -d --build
      - echo ""
      - echo "=== Development Environment with Monitoring ==="
      - echo "Frontend http://localhost:3000"
      - echo "Backend API http://localhost:8080/api"
      - echo "Prometheus http://localhost:9090"
      - echo "Grafana http://localhost:3001 (admin/admin)"

  dev:logs:
    desc: Tail logs from all containers
    cmds:
      - docker compose logs -f

  dev:stop:
    desc: Stop local development environment
    cmds:
      - docker compose down

  dev:clean:
    desc: Stop and remove all data
    cmds:
      - docker compose down -v

  # ============== TEST ==============
  test:
    desc: Run all tests
    cmds:
      - task: test:backend

  test:backend:
    desc: Run backend tests
    dir: '{{.SRC_DIR}}/monitor'
    cmds:
      - ./gradlew test

  test:e2e:install:
    desc: Install Playwright browsers (run once after npm install or Playwright version bump)
    dir: '{{.SRC_DIR}}/site'
    cmds:
      - npx playwright install chromium

  test:e2e:
    desc: Run E2E tests with Playwright (requires running app)
    dir: '{{.SRC_DIR}}/site'
    deps: [test:e2e:install]
    cmds:
      - npx playwright test

  test:e2e:ui:
    desc: Run E2E tests with Playwright UI
    dir: '{{.SRC_DIR}}/site'
    deps: [test:e2e:install]
    cmds:
      - npx playwright test --ui

  # ============== HYPERFOIL (production load/stress tests) ==============
  # k6 is no longer used for load testing — only the smoke test (the Argo
  # PostSync hook in platform helm/schnappy; the schnappy-test chart carries
  # the CronJob variant the DR drill runs). All load/stress/spike/soak
  # work runs through Hyperfoil, which reports to s3gw + reports.pmon.dev.
  test:hyperfoil:load:
    desc: Run Hyperfoil load test in production (5min, reports to s3gw)
    cmds:
      - ssh ten 'kubectl delete job hf-load -n schnappy-production 2>/dev/null; kubectl create job hf-load --from=cronjob/schnappy-production-hyperfoil-load -n schnappy-production'
      - echo "Waiting for completion (~5min)..."
      - ssh ten 'kubectl wait --for=condition=complete job/hf-load -n schnappy-production --timeout=600s'
      - ssh ten 'kubectl logs job/hf-load -n schnappy-production 2>/dev/null | tail -10'

  # The stress / spike / soak tasks share one chart-templated Job spec
  # (cm/schnappy-production-hyperfoil-jobspec) so all the in-cluster
  # values — image, hostnames, secrets — stay under GitOps. The task
  # seds the scenario filename + report prefix into the spec, then
  # `kubectl create -f`s it. CronJobs aren't used: stress and spike
  # are operator-driven, soak is too long for a regular schedule.
  test:hyperfoil:_run:
    internal: true
    requires: { vars: [BENCHMARK_FILE, REPORT_PREFIX, TIMEOUT] }
    cmds:
      - |
        ssh ten "kubectl -n schnappy-production get cm schnappy-production-hyperfoil-jobspec \
          -o jsonpath='{.data.job\.yaml}' \
          | sed -e 's|__BENCHMARK_FILE__|{{.BENCHMARK_FILE}}|g' \
                -e 's|__REPORT_PREFIX__|{{.REPORT_PREFIX}}|g' \
          | kubectl create -f -"
      - echo "Started, waiting (timeout {{.TIMEOUT}})..."
      - |
        ssh ten "kubectl -n schnappy-production wait --for=condition=complete \
          --timeout={{.TIMEOUT}} \
          job -l app.kubernetes.io/component=hyperfoil-stress \
          --field-selector=status.successful=0 || true; \
          kubectl -n schnappy-production logs --tail=10 \
          job -l app.kubernetes.io/component=hyperfoil-stress \
          --max-log-requests=10 2>/dev/null | tail -15"

  test:hyperfoil:stress:
    desc: Hyperfoil stress test (10min ramp 100→1000 users/sec)
    cmds:
      - task: test:hyperfoil:_run
        vars: { BENCHMARK_FILE: stress-test.hf.yaml, REPORT_PREFIX: stress, TIMEOUT: 900s }

  test:hyperfoil:spike:
    desc: Hyperfoil spike test (60s baseline → 30s burst @ 1000/s → 90s recovery)
    cmds:
      - task: test:hyperfoil:_run
        vars: { BENCHMARK_FILE: spike-test.hf.yaml, REPORT_PREFIX: spike, TIMEOUT: 300s }

  test:hyperfoil:soak:
    desc: Hyperfoil soak test (30min sustained @ 200 users/sec — surfaces leaks)
    cmds:
      - task: test:hyperfoil:_run
        vars: { BENCHMARK_FILE: soak-test.hf.yaml, REPORT_PREFIX: soak, TIMEOUT: 2400s }

  # ============== JOOQ ==============
  jooq:generate:
    desc: Generate jOOQ classes from database (requires running postgres)
    dir: '{{.SRC_DIR}}/monitor'
    cmds:
      - ./gradlew jooqCodegen

  # ============== DEPLOY ==============
  deploy:install:
    desc: Create project-local Ansible venv and install dependencies
    dir: deploy/ansible
    status:
      - test -f venv/bin/ansible-playbook
    cmds:
      - python3 -m venv venv
      - venv/bin/pip install -q -r requirements.txt
      - venv/bin/ansible-galaxy collection install -r requirements.yml

  deploy:bootstrap:
    desc: "Tier 0: Install pre-GitOps infrastructure (cert-manager, ESO, Istio, Velero)"
    cmds:
      - ./bootstrap.sh all

  deploy:full:
    desc: Full deployment - kubeadm + consul + pi services + patroni + vault + argocd
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-nexus.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-kubeadm.yml
      - cd ../.. && ./bootstrap.sh all
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-consul.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-pi-services.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-patroni.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/seed-vault-secrets.yml -e @vars/vault.yml
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-argocd.yml -e @vars/vault.yml

  deploy:vault-pi:
    desc: Deploy Pi Vault (Consul backend + Shamir + vault-unseal.service on both Pis)
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml

  deploy:vault-keys-backup:
    desc: Back up Vault unseal keys + root token off the Pis to the controller (review L4)
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/backup-vault-keys.yml

  deploy:keycloak-clients:
    desc: Ensure app realm roles exist (incl. JOBS), the Admins composite, and k6-smoke SA roles — fails on a missing role
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-keycloak-clients.yml

  deploy:gluster:
    desc: Setup GlusterFS replication for Forgejo repos between pi1 and pi2
    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-gluster.yml

  deploy:caddy:
    desc: Setup Caddy TLS reverse proxy for Pi-hosted services (git, auth, nexus)
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-caddy.yml

  deploy:keepalived:
    desc: Setup Keepalived VIP (192.168.11.5) between pi1 and pi2
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-keepalived.yml {{.CLI_ARGS}}

  promote:prod:
    desc: 'Promote test image tags -> prod. DRY-RUN by default; CONFIRM=1 commits+pushes. SERVICES="site monitor" limits scope (default all 7).'
    cmds:
      - |
        cd {{.SRC_DIR}}/infra
        # CD writes a tag commit to this repo on every merge: read the tags from what is on the remote NOW, not from a
        # checkout that may be hours old (a stale one promotes yesterday's image)
        [ -z "$(git status --porcelain)" ] || { echo "infra has uncommitted changes: commit or discard them first"; exit 1; }
        git pull -q --rebase
        TEST=clusters/production/schnappy-test-apps/values.yaml
        PROD=clusters/production/schnappy-production-apps/values.yaml
        SERVICES="${SERVICES:-monitor admin chat chess masi site game-scp}"
        PLAN=""; SVCS=""
        for svc in $SERVICES; do
          TAG=$(grep -E "#[[:space:]]*${svc}[[:space:]]*$" "$TEST" | grep -oP 'tag: "\K[^"]+' | head -1)
          if [ -z "$TAG" ]; then echo "  ! ${svc}: not found in test values — skipping"; continue; fi
          CUR=$(grep -E "#[[:space:]]*${svc}[[:space:]]*$" "$PROD" | grep -oP 'tag: "\K[^"]+' | head -1)
          if [ "$TAG" = "$CUR" ]; then
            echo "  = ${svc}: ${CUR} (up to date)"
          else
            echo "  + ${svc}: ${CUR:-<none>} -> ${TAG}"
            PLAN="${PLAN} ${svc}=${TAG}"; SVCS="${SVCS} ${svc}"
          fi
        done
        if [ -z "$PLAN" ]; then echo "Nothing to promote."; exit 0; fi
        if [ "${CONFIRM:-0}" != "1" ]; then
          echo; echo "DRY-RUN — re-run with CONFIRM=1 to commit + push (Argo then syncs prod)."
          exit 0
        fi
        for entry in $PLAN; do
          svc="${entry%=*}"; tag="${entry#*=}"
          sed -i -E "s|(tag: \")[^\"]*(\"[[:space:]]*#[[:space:]]*${svc}[[:space:]]*)$|\1${tag}\2|" "$PROD"
        done
        git add "$PROD"
        git commit -m "promote(prod):${SVCS} from test"
        # a CD run may have pushed in the seconds since the pull above: the commit is made, so rebase it and push
        # (2026-09-21: the push was rejected and the promotion sat unpushed until somebody noticed)
        git pull -q --rebase
        git push
        echo "Promoted:${SVCS}. Argo will sync prod."

  # ============== ONBOARDING ==============
  onboard:dev:
    desc: "Onboard a developer (Keycloak user + personal <username>-team org). Usage: task onboard:dev USER=jane EMAIL=jane@example.com [NAME=\"Jane Doe\"] [DRY_RUN=1]"
    cmds:
      - ONBOARD_USER='{{.USER}}' ONBOARD_EMAIL='{{.EMAIL}}' ONBOARD_NAME='{{.NAME}}' python3 scripts/onboard-dev.py

  deploy:seed-test-secrets:
    # Same .env as production (test shares the external keys). The playbook reads
    # every env-sourced value with lookup('env'); nothing is passed as an extra var
    # except the prefix. Precedence: a variable exported in the shell outranks .env.
    desc: Seed test-environment Vault secrets from .env (prefix schnappy-test)
    dir: deploy/ansible
    deps: [deploy:install]
    dotenv: ['../../.env']
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/seed-vault-secrets.yml -e vault_prefix=schnappy-test

  # ============== VAGRANT DEPLOY HELPERS (internal) ==============
  # Shared deploy chain used by every k8s-cluster Vagrant test. Assumes
  # VMs are already up (pi1 + pi2 + kubeadm); brings up the Pi data plane
  # (consul → pi-services → patroni → vault-pi) and then the kubeadm
  # cluster. Each test:FOO just re-uses this and adds its own assertion
  # playbook on top — same two-phase shape as test:dual-pi-clean.
  _vagrant:pi-stack:
    internal: true
    deps: [deploy:install]
    vars:
      # extra arguments for the Pi service playbooks (the upgrade copy pins the Pis' versions to production's)
      PI_ARGS: '{{.PI_ARGS | default ""}}'
    cmds:
      # before anything is installed: the Pi VMs would otherwise resolve *.pmon.dev to production and route to its LAN
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/isolate-pis.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml {{.PI_ARGS}}
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml {{.PI_ARGS}}
      # PgBouncer in front of Patroni as on the Pis, and Forgejo and Keycloak moved onto it (setup-pi-services picks
      # PgBouncer's port where it runs) - production's database path, :6432
      - task: _vagrant:pi-pgbouncer
        vars:
          PI_ARGS: '{{.PI_ARGS}}'
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-pi.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml {{.PI_ARGS}}

  _vagrant:pi-pgbouncer:
    internal: true
    deps: [deploy:install]
    vars:
      PI_ARGS: '{{.PI_ARGS | default ""}}'
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pgbouncer.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml {{.PI_ARGS}}

  _vagrant:k8s-stack:
    internal: true
    deps: [_vagrant:pi-stack]
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-kubeadm.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-host-hardening.yml

  # ============== UPGRADE TEST (the Vagrant copy of production) ==============
  _upgrade:base:
    internal: true
    deps: [deploy:install]
    vars:
      # setup-kubeadm's extra arguments (a build at the targets: its target state, not ten's history)
      BASE_ARGS: '{{.BASE_ARGS | default ""}}'
    cmds:
      # from nothing: every VM destroyed, and proven gone, before the build
      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      # the Pis at production's versions (the setup playbooks install their patch targets where a service is missing)
      - task: _vagrant:pi-stack
        vars:
          PI_ARGS: -e @../../tests/ansible/upgrade/pi-baseline.yml
      # the Pis' shared Gluster volumes, as in production - the backup store's data dir among them: without it each
      # Pi kept its own store, and a VIP on pi2 found no velero bucket (full run 4, 2026-10-04)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-gluster.yml
      # the store answers on the Gluster volume, on both Pis, with every bucket (its tasks again, idempotent)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-pi-services.yml --tags versitygw
      # the Pi VIP, as in production (Vault, Git and the backup store are reached through it)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-keepalived.yml
      # as on ten: Argo CD owns Istio, cert-manager, metrics-server, the Prometheus stack and the data operators
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-kubeadm.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml -e platform_by_argo_override=true {{.BASE_ARGS}}
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-host-hardening.yml

  test:upgrade:baseline:
    desc: Build the Vagrant stack at production's versions and diff its version inventory against production's (VMs stay up)
    cmds:
      - task: _upgrade:base
      - cmd: scripts/vagrant-inventory.sh
      - cmd: scripts/inventory-diff.sh tests/ansible/upgrade/prod-inventory.txt .upgrade/vagrant-inventory.txt

  test:upgrade:baseline:resume:
    desc: Re-run the kubeadm stack on the existing Vagrant VMs and diff the inventory again (after a fix; no rebuild)
    deps: [deploy:install]
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-kubeadm.yml -e @vars/vault.yml -e @vars/vault-vagrant.yml -e platform_by_argo_override=true
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-host-hardening.yml
      - cmd: scripts/vagrant-inventory.sh
      - cmd: scripts/inventory-diff.sh tests/ansible/upgrade/prod-inventory.txt .upgrade/vagrant-inventory.txt

  test:upgrade:argo:
    desc: On the baseline VMs, add the Argo layer as on ten - seed Vault, mirror infra/platform (main, or INFRA_REF/PLATFORM_REF), preload app images, install Argo CD - and wait until every app is green
    deps: [deploy:install]
    vars:
      INFRA_REF: '{{.INFRA_REF | default "main"}}'
      PLATFORM_REF: '{{.PLATFORM_REF | default "main"}}'
      # the inventory the copy must show: production's (the baseline), or the one the last step leads to
      EXPECTED: '{{.EXPECTED | default "tests/ansible/upgrade/prod-inventory.txt"}}'
      ALLOWED_MISSING: '{{.ALLOWED_MISSING | default "tests/ansible/upgrade/vagrant-allowed-missing.txt"}}'
      # ClickHouse's compatibility setting and users at that state (survival-check's defaults: the baseline's)
      CLICKHOUSE_COMPAT: '{{.CLICKHOUSE_COMPAT | default ""}}'
      CLICKHOUSE_USERS: '{{.CLICKHOUSE_USERS | default ""}}'
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/vms-ready.yml
      # production's own seeding playbook, with test-only values (tests/ansible/upgrade/vagrant-secrets.env), in an
      # EMPTY environment: this Taskfile loads ops/.env (production's secrets) into every task, and a variable the
      # Vagrant file lacked would otherwise reach the Vagrant Vault with production's value
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'set -a && . tests/ansible/upgrade/vagrant-secrets.env && set +a && cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/seed-vault-secrets.yml'
      # production's scoped Vault token for the stale-PR-env sweeper (argocd/vault-cleanup-token), as on ten
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-cleanup-policy.yml
      - cmd: env -i HOME="$HOME" PATH="$PATH" scripts/vagrant-gitops-mirror.py --infra-ref {{.INFRA_REF}} --platform-ref {{.PLATFORM_REF}}
      - cmd: scripts/vagrant-preload-images.sh ../infra ../platform {{.INFRA_REF}} {{.PLATFORM_REF}}
      # production's floating tags (postgresql:17, ...) as ten runs them, not today's builds of those tags
      - cmd: scripts/vagrant-preload-floating.sh
      # isolate the cluster from production (DNS, network - proven by a probe) and connect ESO to the Vagrant Vault
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/isolate-cluster.yml
      # objects ten has that no git repo creates (each documented in the playbook), production's wildcard certificate too
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/production-state.yml
      # as on the Pis: Caddy serves git/auth/nexus.pmon.dev on 443 with that wildcard
      - cmd: env -i HOME="$HOME" PATH="$PATH" bash -c 'cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-caddy.yml'
      # the schnappy realm, which production keeps only in its Keycloak database: from the auth chart's import + Vault.
      # Before Argo: istiod fetches the realm's keys when it starts
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/keycloak-realm.yml
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml playbooks/setup-argocd.yml
      # the Applications' names recorded: every step's waits want exactly these
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/argo-settled.yml -e record_apps=true
      # data every upgrade step must keep (verified after each: test:upgrade:step)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/data-check.yml -e mode=seed
      # data of the one-way observability steps (ClickHouse rows, Grafana dashboards, a Tempo trace, Mimir's past)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/survival-check.yml -e mode=seed{{if .CLICKHOUSE_COMPAT}} -e clickhouse_compat='{{.CLICKHOUSE_COMPAT}}'{{end}}{{if .CLICKHOUSE_USERS}} -e clickhouse_users='{{.CLICKHOUSE_USERS}}'{{end}}
      # the scrape pools and their target counts, the record every step's metrics check compares with
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/metrics-check.yml -e record_scrape_pools=true
      # production's k6 smoke once more, on demand (the chart's PostSync hook ran it already, as in production) - the
      # Job of the refs mirrored (the targets build's are the last step's, not main's)
      - cmd: scripts/vagrant-smoke.sh {{.INFRA_REF}} {{.PLATFORM_REF}}
      # every version the Vagrant copy runs is production's (minus the documented left-outs)
      - cmd: scripts/vagrant-inventory.sh
      - cmd: scripts/inventory-diff.sh {{.EXPECTED}} .upgrade/vagrant-inventory.txt {{.ALLOWED_MISSING}}

  test:upgrade:step:
    desc: Apply one upgrade step (tests/ansible/upgrade/steps/<STEP>.txt, its upgrade/NN-* branches in ../infra and ../platform, its playbooks) to the running Vagrant copy and prove it - Argo synced to it, every pod ready, the seeded data, a Velero backup, a new volume, every scrape target up, production's k6 smoke, the step's expected inventory
    deps: [deploy:install]
    requires:
      vars: [STEP]
    vars:
      # each repo's highest upgrade/NN-* branch up to this step (else main), checked to stack on the previous one
      INFRA_REF:
        sh: set -o pipefail; scripts/upgrade-expected-inventory.py --refs {{.STEP}} | cut -d' ' -f1
      PLATFORM_REF:
        sh: set -o pipefail; scripts/upgrade-expected-inventory.py --refs {{.STEP}} | cut -d' ' -f2
      # apps the step leaves OutOfSync on purpose (its argo-out-of-sync lines), allowed only after its playbooks
      OUT_OF_SYNC:
        sh: scripts/upgrade-expected-inventory.py --out-of-sync {{.STEP}}
      BACKUP_CHECK:
        sh: scripts/upgrade-expected-inventory.py --backup-check {{.STEP}}
      BARMAN_CHECK:
        sh: scripts/upgrade-expected-inventory.py --barman-check {{.STEP}}
      RESTORE_CHECK:
        sh: scripts/upgrade-expected-inventory.py --restore-check {{.STEP}}
      CLICKHOUSE_COMPAT:
        sh: scripts/upgrade-expected-inventory.py --clickhouse-compat {{.STEP}}
      CLICKHOUSE_USERS:
        sh: scripts/upgrade-expected-inventory.py --clickhouse-users {{.STEP}}
      CERT_RENEW:
        sh: scripts/upgrade-expected-inventory.py --cert-renew {{.STEP}}
      RESTORE_UNDO:
        sh: scripts/upgrade-expected-inventory.py --restore-undo {{.STEP}}
      WAVE0:
        sh: scripts/upgrade-expected-inventory.py --wave0 {{.STEP}}
      # host-side changes (playbook lines): only then a settle before them is needed - without, the deciding settle
      # below waits for the same sync on its own
      HAS_PLAYBOOKS:
        sh: p=$(scripts/upgrade-expected-inventory.py --playbooks {{.STEP}}) || exit 1; if [ -n "$p" ]; then echo yes; else echo no; fi
    cmds:
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/vms-ready.yml
      # Wave 0 first, as production takes it before a one-way step changes anything: each of the step's wave0 stores
      # backed up into the Pi store and its restore rehearsed - at the versions the step starts from, not only at the
      # baseline
      - cmd: |
          set -euo pipefail
          for store in {{.WAVE0}}; do
            echo "=== WAVE 0 $store"
            task test:upgrade:wave0 STORES="$store"
          done
      - cmd: env -i HOME="$HOME" PATH="$PATH" scripts/vagrant-gitops-mirror.py --infra-ref {{.INFRA_REF}} --platform-ref {{.PLATFORM_REF}}
      - cmd: scripts/vagrant-preload-images.sh ../infra ../platform {{.INFRA_REF}} {{.PLATFORM_REF}}
      # Argo fetches the pushed commits within its 3-minute poll; the wait holds until every app is synced to them -
      # before a step's playbooks only (the cluster side first); a step without them is waited for once, below
      - cmd: |
          if [ "{{.HAS_PLAYBOOKS}}" = yes ] || [ -n "{{.OUT_OF_SYNC}}" ]; then
            cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/argo-settled.yml -e expect_mirror=true -e stable_polls=1 -e poll_seconds=3 -e expect_apps=true
          else
            echo "SETTLE BEFORE PLAYBOOKS: none (no playbook or out-of-sync lines)"
          fi
      # the step's preview, as production takes it after the merge: its playbook lines in check mode (each probe reads the
      # real state, nothing changes) - so the production preview is proven to pass
      - cmd: |
          if [ "{{.HAS_PLAYBOOKS}}" = yes ]; then scripts/upgrade-step-playbooks.sh --check {{.STEP}}; fi
      # host-side changes (this step's playbook lines), after the cluster side
      - cmd: scripts/upgrade-step-playbooks.sh {{.STEP}}
      # still isolated from production: a Kubernetes upgrade rewrites CoreDNS (re-applied and proven by the probe)
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/isolate-cluster.yml
      # settled again after the host-side changes: an Argo CD upgrade left the root app stuck (2026-10-03, Argo CD 3.3.14),
      # which only the next step's first wait saw
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/argo-settled.yml -e expect_mirror=true -e allow_out_of_sync={{.OUT_OF_SYNC}} -e expect_apps=true -e restart_step={{.STEP}}
      # the step's independent checks at the same time - data, survival, storage, metrics, the k6 smoke
      # (scripts/upgrade-step-checks.sh says what each proves): a step pays the slowest, not their sum
      - cmd: scripts/upgrade-step-checks.sh '{{.INFRA_REF}}' '{{.PLATFORM_REF}}' '{{.CLICKHOUSE_COMPAT}}' '{{.CLICKHOUSE_USERS}}'
      # CNPG's WAL archiving and a fresh barman base backup - only after a step that changes CNPG or Postgres (the step
      # file's barman-check line): the backup production's data depends on
      - cmd: |
          if [ "{{.BARMAN_CHECK}}" = yes ]; then
            cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/barman-check.yml
          else
            echo "BARMAN CHECK: not after this step (no barman-check line)"
          fi
      # every Certificate renewed and Ready again - only after a step that changes cert-manager (cert-renew line)
      - cmd: |
          if [ "{{.CERT_RENEW}}" = yes ]; then
            cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/cert-check.yml
          else
            echo "CERT RENEW: not after this step (no cert-renew line)"
          fi
      # a copy of Postgres recovered from a fresh backup and its WAL (a marker written after the backup must come
      # back) - only after a step that changes CNPG, Postgres or their store (the step file's restore-check line)
      - cmd: |
          if [ "{{.RESTORE_CHECK}}" = yes ]; then
            cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/restore-check.yml --tags postgres
          else
            echo "RESTORE CHECK: not after this step (no restore-check line)"
          fi
      # the step's undo: the previous major's backup recovered with its image (restore-undo line)
      - cmd: |
          if [ -n "{{.RESTORE_UNDO}}" ]; then
            set -- {{.RESTORE_UNDO}}
            cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/restore-check.yml --tags postgres -e restore_server="$1" -e restore_image="$2"
          else
            echo "RESTORE UNDO: none for this step (no restore-undo line)"
          fi
      # a Velero backup from production's daily schedule, volumes included, into the Pi backup store - only after a
      # step that changes Velero or its store (the step file's backup-check line): ~8 min, and it holds no data
      - cmd: |
          if [ "{{.BACKUP_CHECK}}" = yes ]; then
            cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/backup-check.yml
          else
            echo "BACKUP CHECK: not after this step (no backup-check line)"
          fi
      # the inventory last, after every check of the step (a check's leftovers show in its own step)
      - cmd: scripts/vagrant-inventory.sh
      - cmd: scripts/upgrade-expected-inventory.py {{.STEP}} > .upgrade/expected-inventory.txt
      - cmd: scripts/inventory-diff.sh .upgrade/expected-inventory.txt .upgrade/vagrant-inventory.txt tests/ansible/upgrade/vagrant-allowed-missing.txt

  # A rebuild after the rollout lands at the targets in one go: run with ops checked out on the branch whose playbook
  # defaults are the targets (the change the rollout makes, step by step) - setup-kubeadm, setup-argocd and the Pis'
  # services install those, Argo syncs infra and platform at the last step's branches - and its inventory must be the
  # one the steps lead to.
  test:upgrade:build-targets:
    desc: Build the Vagrant copy straight at the upgrade's targets (ops on its defaults-at-targets branch; infra and platform at the last step's branches) and compare its inventory with the one the steps lead to
    vars:
      LAST_STEP:
        sh: ls tests/ansible/upgrade/steps | sed -n 's/\.txt$//p' | sort -V | tail -1
      INFRA_REF:
        sh: set -o pipefail; scripts/upgrade-expected-inventory.py --refs {{.LAST_STEP}} | cut -d' ' -f1
      PLATFORM_REF:
        sh: set -o pipefail; scripts/upgrade-expected-inventory.py --refs {{.LAST_STEP}} | cut -d' ' -f2
      CLICKHOUSE_COMPAT:
        sh: scripts/upgrade-expected-inventory.py --clickhouse-compat {{.LAST_STEP}}
      CLICKHOUSE_USERS:
        sh: scripts/upgrade-expected-inventory.py --clickhouse-users {{.LAST_STEP}}
    cmds:
      - cmd: mkdir -p .upgrade && scripts/upgrade-expected-inventory.py {{.LAST_STEP}} > .upgrade/expected-targets.txt
      # the Vagrant inventory reproduces ten's history (External Secrets by Helm, the kubelet's grace only in its file);
      # at the targets Argo owns External Secrets and the grace is in the kubelet-config ConfigMap
      - task: _upgrade:base
        vars:
          BASE_ARGS: -e external_secrets_by_helm_override=false -e kubelet_grace_in_kubelet_config_map=true
      # the Argo stage's own inventory check, against the targets' expected inventory instead of production's
      - task: test:upgrade:argo
        vars:
          INFRA_REF: '{{.INFRA_REF}}'
          PLATFORM_REF: '{{.PLATFORM_REF}}'
          EXPECTED: .upgrade/expected-targets.txt
          ALLOWED_MISSING: tests/ansible/upgrade/targets-allowed-missing.txt
          CLICKHOUSE_COMPAT: '{{.CLICKHOUSE_COMPAT}}'
          CLICKHOUSE_USERS: '{{.CLICKHOUSE_USERS}}'

  test:upgrade:build:
    desc: Build the whole Vagrant copy of production from scratch - the baseline, a cold boot of every VM, then the Argo layer (VMs stay up)
    cmds:
      - task: _upgrade:base
      # every VM shut down and booted cold once, as a node and the Pis come back after an outage: the boot order of the
      # Pi stack (Gluster mounts, Consul, Patroni, Vault's unseal) is part of what the run proves (defect 22 was found
      # this way)
      - cmd: vagrant halt
      - cmd: vagrant up --no-provision
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/vms-ready.yml
      - task: test:upgrade:argo

  # The gate before the production rollout (operator, 2026-10-03): steps fixed and re-run one at a time prove each
  # step, not the chain; this proves the chain, unattended, from nothing.
  test:upgrade:full:
    desc: The whole upgrade from scratch, unattended - build the Vagrant copy of production, then every step in tests/ansible/upgrade/steps in order (stops at the first that fails); each green step's proof recorded for production's merge (.upgrade/proven)
    cmds:
      # before anything boots: the ops tree committed (the run proves a commit - production's phases compare with it),
      # every step's state between its two merges one the run proves, and an Argo CD upgrade's new Helm rendering every
      # application as its old one did (helm-diff lines)
      - cmd: scripts/upgrade-production.py proof-start
      - cmd: scripts/upgrade-merge-order.py --all
      - cmd: scripts/argo-helm-diff.py --all
      - task: test:upgrade:build
      # an empty step list is a failure, not a green run (the loop just did nothing)
      - cmd: |
          set -euo pipefail
          steps=$(ls tests/ansible/upgrade/steps | sed -n 's/\.txt$//p' | sort -V)
          [ -n "$steps" ] || { echo "no upgrade steps in tests/ansible/upgrade/steps"; exit 1; }
          echo "=== $(echo "$steps" | wc -l) steps"
          for step in $steps; do
            echo "=== STEP $step $(date +%T)"
            # the commits the step mirrors, before it: the proof refuses them if a branch moved meanwhile
            refs=$(scripts/upgrade-expected-inventory.py --refs "$step")
            infra_sha=$(git -C ../infra rev-parse "${refs% *}")
            platform_sha=$(git -C ../platform rev-parse "${refs#* }")
            # every line of the step stamped with its time: where a step's minutes go stays measurable
            task test:upgrade:step STEP="$step" 2>&1 \
              | python3 -u -c 'import sys, time
          for line in sys.stdin.buffer: sys.stdout.buffer.write(time.strftime("%H:%M:%S ").encode() + line); sys.stdout.flush()'
            scripts/upgrade-production.py record-proof "$step" "$infra_sha" "$platform_sha"
            echo "=== STEP $step GREEN $(date +%T)"
          done
      # the backups restore on the upgraded copy: Postgres from its barman backup, Velero a volume's data
      - task: test:upgrade:restore-check

  test:clickhouse-pin:
    desc: "The ClickHouse rollback pin with the real images, in docker here: steps 59 and 61's newer image pinned to the older version writes and merges parts, the older reads every row back; unpinned it must not"
    cmds:
