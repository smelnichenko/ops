      - cmd: vagrant destroy -f
      - cmd: |
          set -euo pipefail
          left=$(vagrant status --machine-readable | awk -F, '$3 == "state" && $4 != "not_created" {print $2 "=" $4}')
          [ -z "$left" ] || { echo "VMs not destroyed: $left"; exit 1; }
      - cmd: vagrant up
      - defer: vagrant halt
      - task: _vagrant:k8s-stack
      - cmd: cd deploy/ansible && venv/bin/ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/test-failure-modes.yml

  test:microservices:
