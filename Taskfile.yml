    dir: deploy/ansible
    deps: [deploy:install]
    cmds:
      - venv/bin/ansible-playbook -i inventory/production.yml playbooks/setup-kubeadm.yml

  # ── the upgrade steps in production: one at a time, in order, each phase after the ones it needs - the ledger on ten
  # (scripts/upgrade-production.py) refuses anything else; deploy:upgrade:status names the next phase. A step's phases:
  # begin, backup (its wave0 lines), merge (its branch lines, in the file's order), preview and playbooks (its playbook
  # lines), defaults (its default lines), done (twice: the soak between).
  deploy:upgrade:ledger-init:
    desc: "PRODUCTION: the upgrade ledger on ten (ConfigMap kube-system/upgrade-ledger), once - step 02 recorded done (in production since 2026-10-03)"
    prompt: "Create the upgrade ledger on PRODUCTION (ten, kube-system/upgrade-ledger)?"
    cmds:
      - cmd: scripts/upgrade-production.py init

  deploy:upgrade:status:
    desc: "Read-only: the upgrade ledger's events and the next phase of the next step, with what stands before it"
    cmds:
      - cmd: scripts/upgrade-production.py status

  deploy:upgrade:check:
    desc: "Read-only: ten's and the Pis' version inventory against what the done steps and STEP leave (the test environment listed apart), and Argo CD settled on main's commits, judged on ten - nothing recorded"
    requires:
      vars: [STEP]
    cmds:
      - cmd: scripts/upgrade-production.py check {{.STEP}}

  deploy:upgrade:begin:
    desc: "Upgrade step STEP's first phase (records it in the ledger; read-only otherwise): every earlier step done, the full run's proof for it, production as the done steps leave it"
    requires:
      vars: [STEP]
    cmds:
      - cmd: scripts/upgrade-production.py begin {{.STEP}}

  deploy:upgrade:backup:
    desc: "PRODUCTION: Wave 0 - store STORE (one of step STEP's wave0 lines) backed up into the Pi store right before the step's one-way change (kafka stops the broker for the copy)"
    deps: [deploy:install]
    requires:
      vars: [STEP, STORE]
    prompt: "Back up {{.STORE}} on PRODUCTION into the Pi store for step {{.STEP}}{{if eq .STORE \"kafka\"}} (Kafka is down while its volume is copied){{end}}?"
    cmds:
      - cmd: scripts/upgrade-production.py backup {{.STEP}} {{.STORE}}

  deploy:upgrade:preview:
    desc: "Read-only (records it in the ledger): what step STEP's playbook lines would change on ten and the Pis, after the step's merges settled - ansible's check mode with diffs (read-only probes run; waits on changes the preview does not make are skipped; proven by the full run at every step)"
    deps: [deploy:install]
    requires:
      vars: [STEP]
    cmds:
      - cmd: scripts/upgrade-production.py preview {{.STEP}}

  deploy:upgrade:merge:
    desc: "PRODUCTION: the GitOps half of step STEP in REPO (infra or platform) - its branch, the change the full run proved, fast-forwarded onto main and pushed; then Argo settled on the pushed commits"
    requires:
      vars: [STEP, REPO]
    prompt: "Merge and push {{.REPO}} branch upgrade/{{.STEP}} to main - into PRODUCTION?"
    cmds:
      - cmd: scripts/upgrade-production.py merge {{.STEP}} {{.REPO}}

  deploy:upgrade:playbooks:
    desc: "PRODUCTION: the host-side half of step STEP - its playbook lines against ten and the Pis"
    deps: [deploy:install]
    requires:
      vars: [STEP]
    prompt: "Run the playbook lines of upgrade step {{.STEP}} against PRODUCTION (ten, the Pis)?"
    cmds:
      - cmd: scripts/upgrade-production.py playbooks {{.STEP}}

  deploy:upgrade:defaults:
    desc: "PRODUCTION (ops main): step STEP's default lines committed and pushed - from now on a playbook run without the step's -e installs what production runs"
    requires:
      vars: [STEP]
    prompt: "Commit and push step {{.STEP}}'s playbook defaults to ops main?"
    cmds:
      - cmd: scripts/upgrade-production.py defaults {{.STEP}}

  deploy:upgrade:done:
    desc: "Step STEP's last phase (records it in the ledger): production as the step leaves it - the first green call starts the soak, a green call after it with no container restarted since ends the step. Read-only, but a cert-renew or barman-check step's first call issues a throwaway certificate / takes a Postgres base backup: it asks first"
    requires:
      vars: [STEP]
    cmds:
      - cmd: scripts/upgrade-production.py done {{.STEP}}

  deploy:node-config:
