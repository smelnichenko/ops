---
# The Pis' restore check (setup-pi-restore-check.yml) on the Vagrant copy, against what its store really holds: the
# copy's CNPG base backups and WAL, the etcd snapshots of its CronJob, and the Pis' own backup (setup-pi-backups.yml,
# one taken here first).
#   pi1, its day forced    every part restored (production's Postgres image under podman, replayed to the end; etcd
#                          started on the snapshot; Consul's snapshot and every Patroni dump), last-success this run's;
#                          the lock taken; nothing left behind (containers, work directory, the throwaway Consul); no
#                          WAL timeline written into the archive (the restored Postgres archives nothing)
#   pi2, faults            the etcd snapshot too old for its limit: that part red alone; a database the backup lacks:
#                          Postgres red alone; last-success never written
#   both                   the timer on, pi1 the even UTC days, pi2 the odd ones
# Vagrant only (the guard play first). Usage: task test:pi-restore-check
- name: Vagrant VMs only
  ansible.builtin.import_playbook: vagrant-only-play.yml

- name: The Pis' own backup playbook
  ansible.builtin.import_playbook: ../../deploy/ansible/playbooks/setup-pi-backups.yml

- name: One backup of the Pis' own data now
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: The tier-0 backup taken
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          PI_BACKUP_LOCKED=1 PI_BACKUP_EVEN_TODAY=1 /usr/local/sbin/pi-tier0-backup.sh
      register: _tier0
      changed_when: true

- name: Production's restore check playbook
  ansible.builtin.import_playbook: ../../deploy/ansible/playbooks/setup-pi-restore-check.yml

- name: Pi1 - every part restored
  hosts: pi1
  become: true
  gather_facts: false
  vars:
    # the check as pi-restore-check.service runs it: systemd reads the settings file (a value with spaces, a secret's $
    # as written - never sourced by a shell); env after it sets a test's overrides (EnvironmentFile wins over -E)
    as_unit: systemd-run --quiet --wait --pipe --collect -p EnvironmentFile=/etc/pi-restore-check/env /usr/bin/env
    # the store's settings for the test's own reads, each line exported as written
    store_env: >-
      while IFS= read -r l; do export "$l"; done < <(grep -E '^(RCLONE_|PI_RESTORE_WORK=)' /etc/pi-restore-check/env)
    # every WAL history file in the archive: a restored Postgres that archived would add its new timeline's
    history: >-
      {{ store_env }};
      rclone lsf -R --files-only store:postgres-backups | { grep -E '\.history(\.[a-z0-9]+)?$' || true; } | sort
  tasks:
    - name: The archive's timelines before
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "set -euo pipefail; {{ history }}"
      register: _hist_before
      changed_when: false

    - name: The check, its day forced (the lock, then every part) - run as its unit runs it
      ansible.builtin.command: "{{ as_unit }} PI_RESTORE_ANY_DAY=1 /usr/local/sbin/pi-restore-check.sh"
      register: _run
      changed_when: true
      failed_when: false  # its rc asserted below, with what it left

    - name: The run's output
      ansible.builtin.debug:
        msg: "{{ _run.stdout_lines + _run.stderr_lines }}"

    - name: What it left behind and wrote
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ store_env }}
          echo "containers=$(podman ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -c '^pi-restore-' || true)"
          echo "work=$(find "$PI_RESTORE_WORK" -mindepth 1 -maxdepth 1 | wc -l)"
          # (by the process's own name: a pattern on the whole command line also counts this shell, which holds it)
          echo "agents=$(ps -eo comm=,args= | awk '$1 == "consul" && /-node=restore-check/' | wc -l)"
          echo "scratch-postgres=$(ps -eo comm=,args= | awk '$1 == "postgres" && /pi-restore-check\/run\./' | wc -l)"
          echo "success=$(rclone cat store:restore-checks/pi1/last-success)"
          echo "report=$(rclone cat store:restore-checks/pi1/last-report | grep -cE '^(POSTGRES|ETCD|TIER0) OK')"
          echo "timelines-same=$([ "$({{ history }})" = '{{ _hist_before.stdout }}' ] && echo yes || echo no)"
      register: _after
      changed_when: false

    - name: Green, every part restored, nothing left, no timeline archived
      ansible.builtin.assert:
        that:
          - _run.rc == 0
          - "_run.stdout is search('PI RESTORE CHECK [0-9TZ]+: every part restored')"
          - "_run.stdout is search('POSTGRES OK: schnappy-production-postgres')"
          - _run.stdout is search('ETCD OK:')
          - _run.stdout is search('TIER0 OK:')
          - "'containers=0' in _after.stdout_lines"
          - "'work=0' in _after.stdout_lines"
          - "'agents=0' in _after.stdout_lines"
          - "'scratch-postgres=0' in _after.stdout_lines"
          - "'report=3' in _after.stdout_lines"
          - "'timelines-same=yes' in _after.stdout_lines"
          - (_after.stdout | regex_search('success=([0-9TZ]+)', '\\1') | first) == (_run.stdout | regex_search('PI RESTORE CHECK ([0-9TZ]+):', '\\1') | first)
        fail_msg: "{{ _run.stdout_lines + _after.stdout_lines }}"

- name: Pi2 - each fault red alone, last-success never written
  hosts: pi2
  become: true
  gather_facts: false
  vars:
    # the check as pi-restore-check.service runs it: systemd reads the settings file (a value with spaces, a secret's $
    # as written - never sourced by a shell); env after it sets a test's overrides (EnvironmentFile wins over -E)
    as_unit: systemd-run --quiet --wait --pipe --collect -p EnvironmentFile=/etc/pi-restore-check/env /usr/bin/env
    # the store's settings for the test's own reads, each line exported as written
    store_env: >-
      while IFS= read -r l; do export "$l"; done < <(grep -E '^(RCLONE_|PI_RESTORE_WORK=)' /etc/pi-restore-check/env)
  tasks:
    - name: No last-success of pi2's from an earlier run
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {{ store_env }}
          rclone deletefile store:restore-checks/pi2/last-success 2> /dev/null || true
      changed_when: true

    - name: Each fault (the etcd snapshot older than a limit of -1 h; a database the backup lacks), run as its unit runs
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{{ as_unit }} {{ item.env }} PI_RESTORE_ANY_DAY=1 /usr/local/sbin/pi-restore-check.sh"
      loop:
        - { name: etcd, env: "PI_RESTORE_ETCD_MAX_AGE_H=-1", red: ETCD }
        - { name: postgres, env: "PI_RESTORE_PG_DATABASES='monitor no_such_database'", red: POSTGRES }
      loop_control:
        label: "{{ item.name }}"
      register: _faults
      changed_when: true
      failed_when: false  # each rc asserted below

    - name: Pi2's last-success after them
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {{ store_env }}
          # (the store answers a missing object with nothing, and success)
          s=$(rclone cat store:restore-checks/pi2/last-success 2> /dev/null || true)
          echo "${s:-none}"
      register: _pi2_success
      changed_when: false

    - name: Each red alone, the other parts restored, no last-success
      ansible.builtin.assert:
        that:
          # consul lock -child-exit-code: 2 when the run under it failed
          - item.rc != 0
          - item.stdout is search(item.item.red ~ ' FAILED:')
          - (item.stdout | regex_findall('^[A-Z0-9]+ OK:', multiline=True) | length) == 2
          - "item.stdout is search('PI RESTORE CHECK [0-9TZ]+ FAILED: ' ~ item.item.red)"
        fail_msg: "{{ item.item.name }}: {{ item.stdout_lines }}"
      loop: "{{ _faults.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: No last-success written by a failed run
      ansible.builtin.assert:
        that: "_pi2_success.stdout == 'none'"
        fail_msg: "pi2's last-success: {{ _pi2_success.stdout }}"

- name: Pi2 - a run killed mid-restore, its leftovers cleared by the next
  hosts: pi2
  become: true
  gather_facts: false
  vars:
    containers: "podman ps -a --format '{{ '{{' }}.Names{{ '}}' }}' | grep -c '^pi-restore-' || true"
  tasks:
    - name: A run started, killed (SIGKILL - its EXIT trap never runs) once its restored Postgres is up
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          systemd-run --quiet --unit=pi-restore-killed --collect -p EnvironmentFile=/etc/pi-restore-check/env \
            /usr/bin/env PI_RESTORE_ANY_DAY=1 /usr/local/sbin/pi-restore-check.sh
          for i in $(seq 150); do
            podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q '^pi-restore-pg-' && break
            [ "$i" != 150 ] || { echo "no restored Postgres within 5 minutes"; exit 1; }
            sleep 2
          done
          systemctl kill -s KILL pi-restore-killed.service
          for i in $(seq 30); do systemctl is-active -q pi-restore-killed.service || break; sleep 1; done
          echo "left=$(find /var/lib/pi-restore-check -mindepth 1 -maxdepth 1 | wc -l) $(( $({{ containers }}) ))"
      register: _killed
      changed_when: true

    - name: The kill left its directory and its container
      ansible.builtin.assert:
        that: _killed.stdout_lines[-1] is match('left=[1-9][0-9]* [1-9]')
        fail_msg: "{{ _killed.stdout_lines }}"

    - name: The next run, as its unit runs it (the lock waits out the killed run's session)
      ansible.builtin.command: "{{ as_unit }} PI_RESTORE_ANY_DAY=1 /usr/local/sbin/pi-restore-check.sh"
      vars:
        as_unit: systemd-run --quiet --wait --pipe --collect -p EnvironmentFile=/etc/pi-restore-check/env /usr/bin/env
      register: _next
      changed_when: true
      failed_when: false  # its rc and what it left asserted below

    - name: What is left after it
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "echo \"$(find /var/lib/pi-restore-check -mindepth 1 -maxdepth 1 | wc -l) $(( $({{ containers }}) ))\""
      register: _left
      changed_when: false

    - name: Green, the killed run's directory and containers gone
      ansible.builtin.assert:
        that:
          - _next.rc == 0
          - _left.stdout == '0 0'
        fail_msg: "{{ _next.stdout_lines + _next.stderr_lines + [_left.stdout] }}"

- name: Pi1 - the installed unit itself, a fault injected - tried three times, its memory capped
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: The unit's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/pi-restore-check.service.d
        state: directory
        mode: '0755'

    # a second settings file after the first (the later one wins): its day forced, an etcd limit no snapshot meets;
    # the retries 5 s apart instead of 20 min
    - name: The test's settings and retry pace
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        mode: '0600'
        content: "{{ item.content }}"
      loop:
        - dest: /etc/pi-restore-check/test.env
          content: |
            PI_RESTORE_ANY_DAY=1
            PI_RESTORE_ETCD_MAX_AGE_H=-1
        - dest: /etc/systemd/system/pi-restore-check.service.d/test.conf
          content: |
            [Service]
            EnvironmentFile=/etc/pi-restore-check/test.env
            RestartSec=5s
      loop_control:
        label: "{{ item.dest }}"

    - name: The unit started as the timer starts it - and, failing, restarted by systemd until its start limit
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          systemctl daemon-reload
          systemctl reset-failed pi-restore-check.service 2> /dev/null || true
          systemctl start pi-restore-check.service || true
          # three runs of a minute or two each, 5 s apart: until systemd gives up on it
          for i in $(seq 120); do
            [ "$(systemctl show -p ActiveState --value pi-restore-check.service)" = failed ] && break
            sleep 5
          done
          echo "$(systemctl show -p ActiveState --value pi-restore-check.service)" \
            "$(systemctl show -p NRestarts --value pi-restore-check.service)" \
            "$(systemctl show -p MemoryMax --value pi-restore-check.service)"
      register: _unit
      changed_when: true

    - name: The settings and pace taken out again
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pi-restore-check.service.d
        - /etc/pi-restore-check/test.env

    - name: The unit as installed again
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: systemctl daemon-reload && systemctl reset-failed pi-restore-check.service
      changed_when: true

    - name: Failed after three tries (two restarts), its memory capped at 1 GiB
      ansible.builtin.assert:
        that: _unit.stdout_lines[-1] == 'failed 2 1073741824'
        fail_msg: "ActiveState NRestarts MemoryMax: {{ _unit.stdout_lines }}"

- name: Both Pis - the timer on, opposite days
  hosts: pis
  become: true
  gather_facts: false
  tasks:
    - name: The timer and the Pi's parity
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          echo "$(systemctl is-enabled pi-restore-check.timer) $(systemctl is-active pi-restore-check.timer)" \
            "$(sed -n 's/^PI_RESTORE_PARITY=//p' /etc/pi-restore-check/env)"
      register: _timer
      changed_when: false

    - name: Enabled and waiting, pi1 even (0), pi2 odd (1)
      ansible.builtin.assert:
        that: "_timer.stdout == 'enabled active ' ~ ({'pi1': '0', 'pi2': '1'}[inventory_hostname])"
        fail_msg: "{{ inventory_hostname }}: {{ _timer.stdout }}"

- name: Done
  hosts: pi1
  gather_facts: false
  tasks:
    - name: The restore check works
      ansible.builtin.debug:
        msg: "PI RESTORE CHECK TEST PASSED"
