---
# Isolate the Vagrant Pi VMs from production - the first step of every Vagrant flow, before anything is installed on
# them (Taskfile _vagrant:pi-stack).
#
# Why: libvirt's DNS forwards to the host's LAN resolver, so the Pi VMs resolved git/auth/vault.pmon.dev to
# production's Pi VIP, and their traffic to the production LAN was routed (found 2026-10-02, when Caddy came to the
# upgrade-test copy; nothing had used those names yet: no webhooks, no connections, no log lines). Now:
#   1. DNS     - the names the Pis serve (pi_served_names, inventory) resolve to the Vagrant VIP (/etc/hosts);
#                every other pmon.dev name still resolves to production, and 2. drops it;
#   2. network - nftables drops all traffic to the production LAN, and to production's public address (pmon.dev, read
#                from a public resolver: through the VMs' NAT and the router it reaches production too) - an own
#                table, re-applied at boot;
#   3. proof   - each Pi must resolve its names to the Vagrant VIP and FAIL to reach production's VIP and its public
#                address (no connect made: a connect that stalled is no proof), or the run aborts.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/isolate-pis.yml
- name: Isolate the Vagrant Pis from production
  hosts: pi1:pi2
  become: true
  gather_facts: false
  vars:
    production_lan: 192.168.11.0/24
    production_vip: 192.168.11.5
    # the positive control's target: the other Pi (its ssh port)
    peer: "{{ hostvars[groups['pis'] | difference([inventory_hostname]) | first].ansible_host }}"
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: vagrant-only.yml

    # read once, from a public resolver (the LAN's resolves pmon.dev to production's LAN address): every A record,
    # each a public address - else refused (public-addresses.py): an empty lookup dropped nothing, a
    # DNS-intercepting router's LAN answer made the proof probe an address dropped already
    - name: Production's public addresses
      ansible.builtin.set_fact:
        production_public: "{{ lookup('ansible.builtin.pipe', 'python3 ' ~ playbook_dir ~ '/public-addresses.py pmon.dev') | split }}"

    - name: The names the Pis serve resolve to the Vagrant VIP (any other pmon.dev name goes to production and is dropped)
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} vagrant: pmon.dev names served by the Vagrant Pis"
        block: "{{ keepalived_vip }} {{ pi_served_names | map('regex_replace', '$', '.pmon.dev') | join(' ') }}"

    - name: Pi guard - drop all traffic to the production LAN (nftables, re-applied at boot)
      ansible.builtin.copy:
        dest: /etc/systemd/system/vagrant-isolate-production.service
        mode: '0644'
        content: |
          [Unit]
          Description=Vagrant test: no traffic to the production LAN
          After=network-pre.target
          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/usr/sbin/nft -f /etc/vagrant-isolate-production.nft
          [Install]
          WantedBy=multi-user.target
    - name: Pi guard rules (an own table; UFW's tables are not touched)
      ansible.builtin.copy:
        dest: /etc/vagrant-isolate-production.nft
        mode: '0644'
        content: |
          table inet vagrant_isolation
          delete table inet vagrant_isolation
          table inet vagrant_isolation {
            chain output { type filter hook output priority 0; ip daddr { {{ ([production_lan] + production_public) | join(', ') }} } drop; }
          }
    - name: Apply the Pi guard now and at boot
      ansible.builtin.systemd_service:
        name: vagrant-isolate-production
        enabled: true
        state: restarted
        daemon_reload: true
      changed_when: false

    # the guard drops production's LAN by IPv4 only, and that LAN carries an IPv6 prefix too (ten's ULA,
    # fd0a:94e6:20b4:9f6b::/64): no IPv6 beyond link-local here - failing closed the day a box or a libvirt network
    # gives the VM one
    - name: No IPv6 beyond link-local (the guard drops IPv4 only)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          routes=$(ip -6 route show | grep -vE '^(fe80::/64 |multicast ff00::/8 )' || true)
          addrs=$(ip -6 addr show scope global | grep inet6 || true)
          if [ -n "$routes$addrs" ]; then echo "IPv6 BEYOND LINK-LOCAL: $routes $addrs"; exit 1; fi
          echo "no IPv6 beyond link-local"
      changed_when: false
      check_mode: false  # a read

    - name: Prove it - the Pi resolves its names to the Vagrant VIP and cannot reach production's VIP
      ansible.builtin.shell: |
        set -uo pipefail
        for n in {{ pi_served_names | map('regex_replace', '$', '.pmon.dev') | join(' ') }}; do
          echo "$n $(getent hosts "$n" | awk '{print $1}')"
        done
        # blocked = no connect made and timed out (a dropped SYN); a connect that stalled, a refusal, an answer - no proof
        blocked() {
          n=$(curl -sk -o /dev/null -w '%{num_connects}' --connect-timeout 1 -m 5 "$1"); r=$?
          if [ "$r" = 28 ] && [ "$n" = 0 ]; then echo "$2-blocked"; else echo "$2-REACHABLE (curl exit $r, $n connects)"; fi
        }
        blocked https://{{ production_vip }}:8200/v1/sys/health production
        {% for a in production_public %}
        blocked https://{{ a }}:443/ public
        {% endfor %}
        # the positive control: the other Pi reached (a connect made to its ssh port) - a Pi with no network at all
        # reads "blocked" everywhere
        n=$(curl -s -o /dev/null -w '%{num_connects}' --connect-timeout 3 -m 3 telnet://{{ peer }}:22 < /dev/null)
        if [ "${n:-0}" -ge 1 ]; then echo peer-reachable; else echo "PEER-UNREACHABLE ($n connects)"; fi
      args:
        executable: /bin/bash
      register: _pi_probe
      changed_when: false
      failed_when: >-
        _pi_probe.rc != 0 or 'production-blocked' not in _pi_probe.stdout_lines
        or 'peer-reachable' not in _pi_probe.stdout_lines
        or _pi_probe.stdout_lines | select('eq', 'public-blocked') | list | length != production_public | length
        or (_pi_probe.stdout_lines | select('match', '^[^ ]+\\.pmon\\.dev ')
            | reject('match', '^[^ ]+ ' ~ (keepalived_vip | regex_escape) ~ '$') | list | length) > 0
