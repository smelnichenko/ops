---
# The Vagrant guard as a play of its own, imported first by a test that runs a production playbook on the Vagrant
# copy (test-vault-upgrade.yml, test-containerd-takeup.yml, ...): every host of the inventory must be a Vagrant VM, or
# it is dropped from every later play of the run.
- name: Vagrant VMs only - every host the next playbook may touch
  hosts: all
  gather_facts: false
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: vagrant-only.yml
