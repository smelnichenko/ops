---
# Backups restore on the upgraded copy - the end of the upgrade test (`task test:upgrade:full` runs it after the last
# step; `task test:upgrade:restore-check` on its own). Nothing of production's namespace is replaced:
#
#   1. Postgres, the production way: an on-demand CNPG barman backup of schnappy-production-postgres to the Vagrant
#      store, then a marker row written after it and its WAL segment archived, then a side cluster
#      (upgrade-restore-check) recovered from that object store - base backup and WAL, as a real recovery would - must
#      hold exactly the seeded rows (count and md5, computed here) and the marker: a recovery that replayed no WAL
#      would lack it. The recovery starts from that base backup by its ID (recoveryTarget.backupID), not from
#      whichever is newest. After the PostgreSQL 18 step this is also the fresh base backup that step needs.
#      With -e restore_backup=wave0 it recovers the newest Wave 0 base backup (upgrade-backup.yml's
#      upgrade-wave0-<time>) by its ID instead, as it is (no fresh backup, no marker).
#      With -e restore_server=<serverName> -e restore_image=<image> it recovers that server's latest backup instead,
#      as it is (no fresh backup, no marker): the undo of the PostgreSQL 18 step, Postgres 17's backup.
#   2. Velero with data: a namespace whose pod writes a random token to an emptyDir once, a file-system backup of it,
#      the namespace deleted, the backup restored - the pod must come back with the same token. Without the
#      restored volume it would write a new one. (Velero holds no data volume of production's - its data volumes are local-path hostPath PVs - so
#      this is what its restore can be held to.)
#
# Each part removes what it created, the backups' data in the store excepted.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/restore-check.yml [--tags postgres]
#        [-e restore_backup=wave0 | -e restore_server=<serverName> -e restore_image=<image>]
- name: Postgres recovers from its barman backup
  hosts: target
  become: true
  gather_facts: false
  tags: [postgres]
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    pg_namespace: schnappy-production
    cluster: schnappy-production-postgres
    recovered: upgrade-restore-check
    rows: 10000
    # as data-check.yml: md5 of the rows' payloads (md5 of each id), comma-joined in id order
    expected_md5: "{{ range(1, rows + 1) | map('string') | map('hash', 'md5') | join(',') | hash('md5') }}"
    kubectl: "kubectl --kubeconfig {{ kubeconfig }} -n {{ pg_namespace }}"
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: The cluster's spec
      ansible.builtin.command: "{{ kubectl }} get clusters.postgresql.cnpg.io {{ cluster }} -o json"
      register: _cluster
      changed_when: false

    - name: Facts (the backup's name fixed once - a lookup in vars is re-run on every use)
      ansible.builtin.set_fact:
        _spec: "{{ (_cluster.stdout | from_json).spec }}"
        _backup: "{{ recovered }}-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"
        _fresh: "{{ restore_server is not defined and restore_backup is not defined }}"

    - name: What is recovered - the cluster's own server (a fresh backup) or the one asked for, with its image
      ansible.builtin.set_fact:
        _server: "{{ restore_server | default(_spec.backup.barmanObjectStore.serverName | default(cluster)) }}"
        _image: "{{ restore_image | default(_spec.imageName) }}"
        _marker: "restore-{{ _backup }}"

    - name: Its names are the fixed ones - what it deletes cannot be redirected with -e
      ansible.builtin.assert:
        that:
          - recovered == 'upgrade-restore-check'
          - _backup is match('^upgrade-restore-check-[0-9]+$')
          - recovered != cluster
          - restore_backup | default('wave0') == 'wave0'
        fail_msg: "REFUSED: recovered={{ recovered }} backup={{ _backup }} cluster={{ cluster }} restore_backup={{ restore_backup | default('-') }}"
        quiet: true

    - name: The cluster backs up to an object store
      ansible.builtin.assert:
        that: _spec.backup.barmanObjectStore is defined
        fail_msg: "{{ cluster }} has no spec.backup.barmanObjectStore"

    - name: No side cluster left from an earlier run
      ansible.builtin.command: >-
        {{ kubectl }} delete clusters.postgresql.cnpg.io {{ recovered }} --ignore-not-found --wait=true
        --cascade=foreground --timeout=600s
      changed_when: false

    - name: A fresh base backup
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/tasks/cnpg-backup.yml"
      vars:
        cnpg_backup: "{{ _backup }}"
      when: _fresh | bool

    - name: The base backup recovered from - the fresh one, or the newest completed Wave 0 one (its barman ID)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ kubectl }} get backups.postgresql.cnpg.io -o json | python3 -c '
          import json, sys
          name, wave0 = sys.argv[1], sys.argv[2] == "wave0"
          ok = [b for b in json.load(sys.stdin)["items"] if b.get("status", {}).get("phase") == "completed"
                and b["spec"]["cluster"]["name"] == sys.argv[3]
                and (b["metadata"]["name"].startswith("upgrade-wave0-") if wave0 else b["metadata"]["name"] == name)]
          ok.sort(key=lambda b: b["status"].get("stoppedAt", ""))
          print(ok[-1]["metadata"]["name"], ok[-1]["status"]["backupId"]) if ok else sys.exit("no such completed backup")
          ' {{ _backup }} {{ restore_backup | default('-') }} {{ cluster }}
      register: _base
      changed_when: false
      when: restore_server is not defined

    # two commands, not one: psql -c runs several statements as one transaction, and a switch inside it puts the
    # insert's commit in the next segment - which is not archived, and the marker never comes back
    - name: After it, a marker row committed, then its WAL segment switched out (only WAL replay can bring it back)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          P="{{ kubectl }} exec {{ _primary }} -c postgres -- psql -v ON_ERROR_STOP=1 -qAt -d {{ _spec.bootstrap.initdb.database }}"
          $P -c "create table if not exists upgrade_check.heartbeat (run text primary key, at timestamptz not null default now())"
          $P -c "insert into upgrade_check.heartbeat (run) values ('{{ _marker }}')"
          $P -c "select pg_walfile_name(pg_switch_wal())"
      vars:
        _primary: "{{ (_cluster.stdout | from_json).status.currentPrimary }}"
      register: _marker_wal
      changed_when: true
      when: _fresh | bool

    - name: That segment is archived
      ansible.builtin.command: >-
        {{ kubectl }} exec {{ (_cluster.stdout | from_json).status.currentPrimary }} -c postgres -- psql -qAt
        -c "select coalesce(last_archived_wal, '-') from pg_stat_archiver"
      register: _marker_archived
      changed_when: false
      retries: 30
      delay: 5
      until: _marker_archived.rc == 0 and _marker_archived.stdout | trim >= _marker_wal.stdout_lines[-1] | trim
      when: _fresh | bool

    - name: The side cluster, recovered and checked - removed with its policies whatever happens
      block:
        - name: The side cluster's policies (the production cluster's, cloned)
          ansible.builtin.include_tasks: tasks/side-cluster-policies.yml
          vars:
            pg_cluster: "{{ cluster }}"
            side_cluster: "{{ recovered }}"
            side_state: present

        - name: A side cluster recovered from the object store (base backup and WAL)
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            definition:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata: { name: "{{ recovered }}", namespace: "{{ pg_namespace }}" }
              spec:
                instances: 1
                imageName: "{{ _image }}"
                # the mesh exclusion of the object store's port, as the cluster has it
                inheritedMetadata: "{{ _spec.inheritedMetadata | default({}) }}"
                storage: { size: 2Gi, storageClass: "{{ _spec.storage.storageClass }}" }
                resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
                bootstrap:
                  recovery: "{{ {'source': 'origin'} | combine({'recoveryTarget': {'backupID': _base.stdout.split()[1]}}
                                if _base.stdout is defined else {}) }}"
                externalClusters:
                  - name: origin
                    barmanObjectStore: "{{ _spec.backup.barmanObjectStore | combine({'serverName': _server}) }}"

        - name: The side cluster is healthy
          ansible.builtin.command: >-
            {{ kubectl }} get clusters.postgresql.cnpg.io {{ recovered }}
            -o jsonpath={.status.phase}/{.status.readyInstances}
          register: _recovered
          changed_when: false
          retries: 60
          delay: 10
          until: _recovered.stdout == 'Cluster in healthy state/1'

        - name: It holds exactly the seeded rows
          ansible.builtin.shell: |
            {{ kubectl }} exec {{ recovered }}-1 -c postgres -- psql -v ON_ERROR_STOP=1 -qAt \
              -d {{ _spec.bootstrap.initdb.database }} -c "
              select count(*) || ' ' || md5(string_agg(payload, ',' order by id)) from upgrade_check.canary"
          register: _rows
          changed_when: false
          failed_when: _rows.stdout | trim != rows ~ ' ' ~ expected_md5

        - name: And the marker written after the base backup (WAL replayed)
          ansible.builtin.command: >-
            {{ kubectl }} exec {{ recovered }}-1 -c postgres -- psql -v ON_ERROR_STOP=1 -qAt -d {{ _spec.bootstrap.initdb.database }}
            -c "select count(*) from upgrade_check.heartbeat where run = '{{ _marker }}'"
          register: _replayed
          changed_when: false
          failed_when: _replayed.rc != 0 or _replayed.stdout | trim != '1'
          when: _fresh | bool
      # what the side cluster was doing, before the always removes it: a recovery that hung once (Vagrant 2026-10-05,
      # "Setting up primary" for 10 minutes, not reproduced) left nothing to read
      rescue:
        - name: The side cluster's state, its recovery job's log and events (it failed)
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              {{ kubectl }} get clusters.postgresql.cnpg.io {{ recovered }} -o jsonpath='{.status.phase}: {.status.phaseReason}{"\n"}'
              {{ kubectl }} get pods,pvc,jobs -o wide | grep -E '^(NAME|.*{{ recovered }})'
              {{ kubectl }} get events --sort-by=.lastTimestamp | grep {{ recovered }} | tail -20
              for p in $({{ kubectl }} get pods -o name | grep {{ recovered }}); do
                echo "== $p"; {{ kubectl }} logs "$p" --all-containers --tail=30 2>&1 | cut -c1-400
              done
          register: _diag
          changed_when: false
          failed_when: false

        - name: That state
          ansible.builtin.debug:
            var: _diag.stdout_lines

        - name: It failed
          ansible.builtin.fail:
            msg: "the side cluster did not recover - its state above"
      always:
        - name: Remove the side cluster (its volume goes with it) and the backup object (its data stays in the store)
          ansible.builtin.shell: |
            set -eu
            {{ kubectl }} delete clusters.postgresql.cnpg.io {{ recovered }} --ignore-not-found --wait=true \
              --cascade=foreground --timeout=600s
            {{ kubectl }} delete backups.postgresql.cnpg.io {{ _backup }} --ignore-not-found
          changed_when: true

        - name: Remove the side cluster's policies
          ansible.builtin.include_tasks: tasks/side-cluster-policies.yml
          vars:
            pg_cluster: "{{ cluster }}"
            side_cluster: "{{ recovered }}"
            side_state: absent

    - name: Postgres restores
      ansible.builtin.debug:
        msg: >-
          POSTGRES RESTORE OK: {{ (_base.stdout | replace(' ', ' (barman ') ~ ')') if _base.stdout is defined
          else 'the latest backup of ' ~ _server }} recovered into
          {{ recovered }} ({{ _image }}), {{ rows }} rows, md5 {{ expected_md5 }}{{ ', the marker written after the
          base backup (WAL replayed)' if _fresh | bool else '' }}

- name: Velero restores a volume's data
  hosts: target
  become: true
  gather_facts: false
  tags: [velero]
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    ns: upgrade-restore-check
    # every Velero resource fully qualified: `backup` alone is CNPG's Backup
    kubectl: "kubectl --kubeconfig {{ kubeconfig }}"
    velero: "kubectl --kubeconfig {{ kubeconfig }} -n velero"
    # an image the cluster runs already (the etcd backup's upload), with a shell
    image: rclone/rclone:1.75.1
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Facts (the backup's name fixed once)
      ansible.builtin.set_fact:
        _name: "{{ ns }}-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"

    - name: Its names are the fixed ones - what it deletes cannot be redirected with -e
      ansible.builtin.assert:
        that:
          - ns == 'upgrade-restore-check'
          - _name is match('^upgrade-restore-check-[0-9]+$')
        fail_msg: "REFUSED: ns={{ ns }} name={{ _name }}"
        quiet: true

    - name: No namespace left from an earlier run
      ansible.builtin.command: "{{ kubectl }} delete namespace {{ ns }} --ignore-not-found --wait=true --timeout=300s"
      changed_when: false

    - name: A pod that writes a random token to its emptyDir once
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          - apiVersion: v1
            kind: Namespace
            metadata: { name: "{{ ns }}" }
          - apiVersion: apps/v1
            kind: Deployment
            metadata: { name: token, namespace: "{{ ns }}" }
            spec:
              replicas: 1
              selector: { matchLabels: { app: token } }
              template:
                metadata: { labels: { app: token } }
                spec:
                  terminationGracePeriodSeconds: 1
                  containers:
                    - name: token
                      image: "{{ image }}"
                      command: [/bin/sh, -c]
                      args:
                        - >-
                          [ -s /data/token ] || head -c 32 /dev/urandom | md5sum | cut -d' ' -f1 > /data/token;
                          exec sleep 2147483647
                      resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
                      volumeMounts: [{ name: data, mountPath: /data }]
                  volumes: [{ name: data, emptyDir: {} }]

    - name: Its token
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} -n {{ ns }} rollout status deployment token --timeout=300s > /dev/null
        {{ kubectl }} -n {{ ns }} exec deploy/token -- cat /data/token
      args:
        executable: /bin/bash
      register: _before
      changed_when: false
      failed_when: _before.stdout | length != 32

    - name: Back the namespace up, its volume included
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: velero.io/v1
          kind: Backup
          metadata: { name: "{{ _name }}", namespace: velero }
          spec: { includedNamespaces: ["{{ ns }}"], defaultVolumesToFsBackup: true, ttl: 1h }

    - name: The backup completes
      ansible.builtin.command: "{{ velero }} get backups.velero.io {{ _name }} -o jsonpath={.status.phase}"
      register: _backup
      changed_when: false
      retries: 60
      delay: 10
      until: _backup.stdout in ['Completed', 'PartiallyFailed', 'Failed', 'FailedValidation']
      failed_when: _backup.stdout != 'Completed'

    - name: Delete the namespace
      ansible.builtin.command: "{{ kubectl }} delete namespace {{ ns }} --wait=true --timeout=300s"
      changed_when: true

    - name: Restore it
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: velero.io/v1
          kind: Restore
          metadata: { name: "{{ _name }}", namespace: velero }
          spec: { backupName: "{{ _name }}" }

    - name: The restore completes
      ansible.builtin.command: "{{ velero }} get restores.velero.io {{ _name }} -o jsonpath={.status.phase}"
      register: _restore
      changed_when: false
      retries: 60
      delay: 10
      until: _restore.stdout in ['Completed', 'PartiallyFailed', 'Failed', 'FailedValidation']
      failed_when: _restore.stdout != 'Completed'

    - name: The restored pod has the same token - its volume came back
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} -n {{ ns }} rollout status deployment token --timeout=300s > /dev/null
        {{ kubectl }} -n {{ ns }} exec deploy/token -- cat /data/token
      args:
        executable: /bin/bash
      register: _after
      changed_when: false
      retries: 12
      delay: 10
      until: _after.rc == 0
      failed_when: _after.rc != 0 or _after.stdout != _before.stdout

    - name: Remove the namespace, the restore, the backup (its data too) and the namespace's repository
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} delete namespace {{ ns }} --wait=true --timeout=300s
        {{ velero }} delete restores.velero.io {{ _name }} --ignore-not-found
        cat <<EOF | {{ velero }} create -f - > /dev/null
        apiVersion: velero.io/v1
        kind: DeleteBackupRequest
        metadata: { generateName: {{ _name }}-, namespace: velero }
        spec: { backupName: {{ _name }} }
        EOF
        {{ velero }} delete backuprepositories.velero.io -l velero.io/volume-namespace={{ ns }} --ignore-not-found
      args:
        executable: /bin/bash
      changed_when: true

    - name: Velero restores
      ansible.builtin.debug:
        msg: "VELERO RESTORE OK: {{ _name }} - the emptyDir's token {{ _before.stdout }} came back"
