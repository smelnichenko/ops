---
# The Wave 0 backups restore - rehearsed on the Vagrant copy, right after `upgrade-backup.yml -e store=<store>` took one
# (task test:upgrade:wave0). Each restore reads the backup back from the Pi store (its sha256 checked against the
# stored one), not from the node's local copy, and must bring back the seeded canaries:
#
#   -e store=postgres    every dump of the backup replayed into an empty side CNPG cluster (upgrade-wave0-restore),
#                        one at a time: no error but the roles and databases it had, every table of every database
#                        with the rows the dump has (files/pg-dump-verify.py), production's dump with data-check's
#                        seeded rows (count and md5, computed here). The CNPG base backup of the run: restore-check.yml
#                        -e restore_backup=wave0 (task test:upgrade:wave0 runs both)
#   -e store=clickhouse  the canary table's frozen parts attached to a new table of its schema
#                        (upgrade_check.canary_restore): survival-check's rows (count and md5)
#   -e store=grafana     the database copy intact (SQLite's integrity check), the canary dashboard in it, and every
#                        dashboard UID survival-check recorded
#   -e store=kafka       in place: one message more in data-check's canary topic after the backup (the end offset
#                        one past where it was proves it arrived), then the broker stopped (the operator paused, the node cordoned - a
#                        recreated pod waits Pending; not running when its volume is replaced), its volume replaced by
#                        the backup's, started again - the topic holds exactly
#                        the seeded messages and ends there, the extra one gone (so the data came from the backup)
#   -e store=scylla      in place: data-check's canary table truncated, then restored with sctool from the snapshot
#                        the Wave 0 run recorded (snapshots.txt beside it) - exactly the seeded rows
#   -e store=gateway     in place: a Tempo trace pushed after the backup; the pods of the in-cluster object store,
#                        Mimir and Tempo held off (their node cordoned), the three volumes replaced by the backup's -
#                        before they start, every object the backup listed back with its ETag and every bucket with
#                        its ACL (files/objectstore-manifest.py); then survival-check's trace back and the later one
#                        gone, Mimir's `up` series at the seed's time as many as then and a stored block covering it
#
# Vagrant only. Postgres, ClickHouse and Grafana restore beside the copy's own data (a side cluster, a new table, a
# file), and what they create they remove; Kafka, ScyllaDB and the gateway volumes are restored in place - the
# copy's data for them is the backup's afterwards.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/wave0-rehearsal.yml -e store=postgres
- name: A Wave 0 backup restores
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    kubectl: "kubectl --kubeconfig {{ kubeconfig }}"
    endpoint: "http://{{ keepalived_vip }}:9000"
    bucket: upgrade-backups
    local_dir: /var/backups/upgrade
    work_dir: /var/backups/upgrade-rehearsal
    store_curl: "{{ work_dir }}/store.curl"
    pg_namespace: schnappy-production
    pg_cluster: schnappy-production-postgres
    restored: upgrade-wave0-restore
    rows: 10000
    # as data-check.yml: md5 of the rows' payloads (md5 of each id), comma-joined in id order
    expected_md5: "{{ range(1, rows + 1) | map('string') | map('hash', 'md5') | join(',') | hash('md5') }}"
    # data-check.yml's Kafka and ScyllaDB canaries, the same definitions (1 000 each)
    kafka_expected_md5: "{{ (range(1, 1001) | map('regex_replace', '^', 'm-') | join('\n') ~ '\n') | hash('md5') }}"
    scylla_expected_md5: "{{ (range(1, 1001) | map('regex_replace', '^(.*)$', '\\1|v-\\1') | join('\n') ~ '\n') | hash('md5') }}"
    # the gateway store's volumes (upgrade-backup.yml's), survival-check's trace, and one pushed after the backup
    gateway_pvcs: [schnappy-infra-s3gw, schnappy-mimir, schnappy-tempo]
    infra_proxy: /api/v1/namespaces/schnappy-infra/services
    survival_trace_id: 5eedc0de5eedc0de5eedc0de5eedc0de
    extra_trace_id: a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0
    # the pods that mount any of the claims given: "<pod> <node or -> <phase> <ready or not>", one per line
    mounting_py: |
      import json, sys
      claims = set(sys.argv[1:])
      for p in json.load(sys.stdin)["items"]:
          mine = {(v.get("persistentVolumeClaim") or {}).get("claimName") for v in p["spec"].get("volumes", [])}
          if mine & claims:
              ready = any(c["type"] == "Ready" and c["status"] == "True" for c in p["status"].get("conditions", []))
              print(p["metadata"]["name"], p["spec"].get("nodeName") or "-", p["status"]["phase"], "ready" if ready else "not")
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: The store is one this rehearsal restores
      ansible.builtin.assert:
        that: store | default('') in ['postgres', 'clickhouse', 'grafana', 'kafka', 'scylla', 'gateway']
        fail_msg: "-e store=postgres|clickhouse|grafana|kafka|scylla|gateway"

    - name: Its names are the fixed ones - what it deletes cannot be redirected with -e
      ansible.builtin.assert:
        that:
          - restored == 'upgrade-wave0-restore'
          - restored != pg_cluster
          - work_dir == '/var/backups/upgrade-rehearsal'
        fail_msg: "REFUSED: restored={{ restored }} work_dir={{ work_dir }}"
        quiet: true

    - name: The latest backup of the store (its time)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: set -euo pipefail; ls -1 {{ local_dir }}/{{ store }} | sort | tail -1
      register: _stamp
      changed_when: false
      failed_when: _stamp.rc != 0 or _stamp.stdout | length == 0

    - name: A clean work directory
      ansible.builtin.shell: rm -rf {{ work_dir }} && mkdir -m 0700 {{ work_dir }}
      changed_when: true

    - name: The store's credentials in a curl config only root reads (in the work directory)
      ansible.builtin.copy:
        content: |
          user = "{{ (backup_root_user ~ ':' ~ backup_root_password) | replace('\\', '\\\\') | replace('"', '\\"') }}"
          aws-sigv4 = "aws:amz:us-east-1:s3"
        dest: "{{ store_curl }}"
        mode: '0600'
      no_log: true

    # ── postgres: every dump of the backup, each into a side cluster (the base backup: restore-check.yml) ──
    - name: Postgres - the dumps of the backup
      ansible.builtin.find:
        paths: "{{ local_dir }}/postgres/{{ _stamp.stdout }}"
        patterns: "*.sql.gz"
      register: _dumps
      failed_when: _dumps.matched == 0
      when: store == 'postgres'

    - name: Postgres - the production cluster's spec (the side cluster's image and storage)
      ansible.builtin.command: "{{ kubectl }} -n {{ pg_namespace }} get clusters.postgresql.cnpg.io {{ pg_cluster }} -o json"
      register: _cluster
      changed_when: false
      when: store == 'postgres'

    - name: Postgres - the dump checker on the node
      ansible.builtin.copy:
        src: files/pg-dump-verify.py
        dest: "{{ work_dir }}/pg-dump-verify.py"
        mode: '0700'
      when: store == 'postgres'

    - name: Postgres - each dump replayed into a side cluster and checked
      ansible.builtin.include_tasks: tasks/wave0-pg-dump.yml
      loop: "{{ _dumps.files | default([]) | map(attribute='path') | map('basename') | sort }}"
      loop_control:
        loop_var: dump_name
      when: store == 'postgres'

    # ── a file of the backup, read back from the store (clickhouse, grafana) ──
    - name: The backup's file read back from the Pi store, its parts and the whole checked
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/tasks/upgrade-backup-download.yml"
      vars:
        download_key: "{{ store }}/{{ _stamp.stdout }}/{{ {'clickhouse': 'clickhouse.tar.gz', 'grafana': 'grafana.db.gz'}[store] }}"
        download_file: "{{ work_dir }}/backup"
        upgrade_backup_endpoint: "{{ endpoint }}"
        upgrade_backup_bucket: "{{ bucket }}"
      when: store in ['clickhouse', 'grafana']

    # ── clickhouse ────────────────────────────────────────────────────
    - name: ClickHouse - the canary's frozen parts restored into a new table of its schema
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          K="{{ kubectl }} -n schnappy-infra"
          q() { $K exec schnappy-clickhouse-0 -c clickhouse -- sh -c 'clickhouse-client --user schnappy --password "$CLICKHOUSE_PASSWORD" -q "$1"' _ "$1"; }
          mkdir {{ work_dir }}/x && tar -C {{ work_dir }}/x -xzf {{ work_dir }}/backup
          # the database's metadata link resolved inside the backup; the table made from the backup's own schema
          link=$(readlink {{ work_dir }}/x/metadata/upgrade_check)
          sql={{ work_dir }}/x/${link#/var/lib/clickhouse/}/canary.sql
          uuid=$(grep -oE "UUID '[0-9a-f-]{36}'" "$sql" | cut -d"'" -f2)
          src=$(ls -d {{ work_dir }}/x/shadow/*/store/*/"$uuid")
          ddl=$(tr '\n' ' ' < "$sql" | sed -E "s/^ATTACH TABLE _ UUID '[0-9a-f-]{36}'/CREATE TABLE upgrade_check.canary_restore/")
          [[ $ddl == "CREATE TABLE upgrade_check.canary_restore "* ]] || { echo "not a table schema: $ddl"; exit 1; }
          q "DROP TABLE IF EXISTS upgrade_check.canary_restore SYNC"
          q "$ddl"
          path=$(q "SELECT data_paths[1] FROM system.tables WHERE database = 'upgrade_check' AND name = 'canary_restore'")
          pvc=$($K get pod schnappy-clickhouse-0 -o jsonpath='{.spec.volumes[?(@.name=="data")].persistentVolumeClaim.claimName}')
          dir=$({{ kubectl }} get pv "$($K get pvc "$pvc" -o jsonpath='{.spec.volumeName}')" -o jsonpath='{.spec.hostPath.path}{.spec.local.path}')
          detached="$dir/${path#/var/lib/clickhouse/}detached"
          owner=$(stat -c %u:%g "$dir/${path#/var/lib/clickhouse/}")
          for part in "$src"/*/; do
            p=$(basename "$part"); cp -a "$part" "$detached/$p"; chown -R "$owner" "$detached/$p"
            q "ALTER TABLE upgrade_check.canary_restore ATTACH PART '$p'"
          done
          q "SELECT count(), lower(hex(MD5(arrayStringConcat(arrayMap(x -> x.2, arraySort(groupArray((k, v)))), ','))))
             FROM upgrade_check.canary_restore"
          q "DROP TABLE upgrade_check.canary_restore SYNC"
      register: _ch_restore
      changed_when: true
      failed_when: >-
        _ch_restore.rc != 0
        or _ch_restore.stdout_lines[-1].split() != ['1000', range(1, 1001) | map('string') | map('regex_replace', '^', 'v-') | join(',') | hash('md5')]
      when: store == 'clickhouse'

    # ── grafana ───────────────────────────────────────────────────────
    - name: Grafana - the database copy intact, the canary dashboard and every recorded dashboard in it
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          gzip -dc {{ work_dir }}/backup > {{ work_dir }}/grafana.db
          python3 -c '
          import json, os, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          assert db.execute("pragma integrity_check").fetchone()[0] == "ok", "integrity"
          # dashboards in unified storage (the resource table - Grafana 12 writes them there) and the legacy table
          text = lambda v: v if isinstance(v, str) else bytes(v).decode()
          found = {r[0]: text(r[1]) for r in db.execute(
              "select name, value from resource where resource = ?", ("dashboards",))}
          found.update({r[0]: text(r[1]) for r in db.execute("select uid, data from dashboard where is_folder = 0")})
          uids = set(found)
          assert "upgrade survival canary" in found.get("upgrade-check", ""), "canary"
          missing = set(json.loads(os.environ["SURVIVAL"])["grafana_uids"]) - uids
          assert not missing, "missing %s" % sorted(missing)
          print(len(uids), "dashboards, the canary intact")' {{ work_dir }}/grafana.db
      environment:
        # the dashboards survival-check recorded at its seed (on the controller)
        SURVIVAL: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../.upgrade/survival.json') }}"
      register: _grafana_restore
      changed_when: false
      when: store == 'grafana'

    # ── kafka (in place) ──────────────────────────────────────────────
    - name: Kafka - the production cluster's broker, its volume directory
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          K="{{ kubectl }} -n schnappy-production"
          pod=$($K get pods -l strimzi.io/cluster=schnappy-production,strimzi.io/broker-role=true -o jsonpath='{.items[0].metadata.name}')
          pvc=$($K get pod "$pod" -o jsonpath='{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}' | grep . | head -1)
          echo "$pod $({{ kubectl }} get pv "$($K get pvc "$pvc" -o jsonpath='{.spec.volumeName}')" -o jsonpath='{.spec.hostPath.path}{.spec.local.path}')"
      register: _broker
      changed_when: false
      failed_when: _broker.rc != 0 or _broker.stdout.split() | length != 2
      when: store == 'kafka'

    - name: Kafka - one message more in the canary topic, after the backup (the end offset before it, printed)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ kubectl }} -n schnappy-production exec {{ _broker.stdout.split()[0] }} -c kafka -- \
            /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 --topic upgrade-check --time -1 \
            | awk -F: '{n += $3} END {print n}'
          echo after-the-backup | {{ kubectl }} -n schnappy-production exec -i {{ _broker.stdout.split()[0] }} -c kafka -- \
            /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic upgrade-check \
            --producer-property acks=all > /dev/null
      register: _kafka_before
      changed_when: true
      when: store == 'kafka'

    # the producer sends asynchronously and exits 0 on a failed send: only the log's end offset shows it arrived -
    # without it, "the extra one gone" would hold for a restore that changed nothing
    - name: Kafka - it arrived (the topic's end offset one past where it was)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          {{ kubectl }} -n schnappy-production exec {{ _broker.stdout.split()[0] }} -c kafka --
          /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 --topic upgrade-check --time -1
          | awk -F: '{n += $3} END {print n}'
      register: _kafka_extra
      changed_when: false
      retries: 6
      delay: 5
      until: _kafka_extra.rc == 0 and (_kafka_extra.stdout | int) == (_kafka_before.stdout | int) + 1
      when: store == 'kafka'

    - name: Kafka - the backup's broker volume read back from the Pi store
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/tasks/upgrade-backup-download.yml"
      vars:
        download_key: "kafka/{{ _stamp.stdout }}/schnappy-production-{{ _broker.stdout.split()[0] }}.tar.gz"
        download_file: "{{ work_dir }}/broker.tar.gz"
        upgrade_backup_endpoint: "{{ endpoint }}"
        upgrade_backup_bucket: "{{ bucket }}"
      when: store == 'kafka'

    - name: Kafka - the broker stopped, its volume replaced, started again
      when: store == 'kafka'
      block:
        - name: Kafka - the operator paused on the cluster
          ansible.builtin.command: >-
            {{ kubectl }} -n schnappy-production annotate kafkas.kafka.strimzi.io schnappy-production
            strimzi.io/pause-reconciliation=true --overwrite
          changed_when: true

        - name: Kafka - the reconciliation reported paused
          ansible.builtin.shell: >-
            {{ kubectl }} -n schnappy-production get kafkas.kafka.strimzi.io schnappy-production
            -o jsonpath='{.status.conditions[?(@.type=="ReconciliationPaused")].status}'
          register: _paused
          changed_when: false
          retries: 30
          delay: 5
          until: _paused.stdout == 'True'

        # the StrimziPodSet controller recreates a deleted broker even while the Kafka is paused: the cordon keeps the
        # new pod Pending (as upgrade-backup.yml does)
        - name: Kafka - the broker's node cordoned
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              node=$({{ kubectl }} -n schnappy-production get pod {{ _broker.stdout.split()[0] }} -o jsonpath='{.spec.nodeName}')
              {{ kubectl }} cordon "$node" > /dev/null
              echo "$node"
          register: _kafka_node
          changed_when: true

        - name: Kafka - the broker pod deleted and gone
          ansible.builtin.command: >-
            {{ kubectl }} -n schnappy-production delete pod {{ _broker.stdout.split()[0] }} --wait=true --timeout=300s
          changed_when: true

        - name: Kafka - the volume's content replaced by the backup's
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              dir="{{ _broker.stdout.split()[1] }}"
              [ -d "$dir" ] && [ "$dir" != / ]
              find "$dir" -mindepth 1 -delete
              tar --numeric-owner -C "$dir" -xzf {{ work_dir }}/broker.tar.gz
              # stopped throughout: a recreated pod waited Pending on the cordoned node while its files were replaced
              [ "$({{ kubectl }} -n schnappy-production get pod {{ _broker.stdout.split()[0] }} --ignore-not-found \
                -o jsonpath='{.status.phase}/{.spec.nodeName}')" != "Running/{{ _kafka_node.stdout }}" ] \
                || { echo "the broker ran while its volume was replaced"; exit 1; }
          changed_when: true
      always:
        - name: Kafka - the node uncordoned
          ansible.builtin.command: "{{ kubectl }} uncordon {{ _kafka_node.stdout }}"
          changed_when: true
          when: _kafka_node.stdout | default('') | length > 0

        - name: Kafka - the pause lifted
          ansible.builtin.command: >-
            {{ kubectl }} -n schnappy-production annotate kafkas.kafka.strimzi.io schnappy-production
            strimzi.io/pause-reconciliation-
          changed_when: true

        - name: Kafka - Ready again
          ansible.builtin.command: >-
            {{ kubectl }} -n schnappy-production wait kafkas.kafka.strimzi.io schnappy-production
            --for=condition=Ready --timeout=600s
          changed_when: false

    - name: Kafka - the canary topic holds exactly the seeded messages (the extra one gone)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          pod=$({{ kubectl }} -n schnappy-production get pods -l strimzi.io/cluster=schnappy-production,strimzi.io/broker-role=true \
            -o jsonpath='{.items[0].metadata.name}')
          # the console consumer exits non-zero when its timeout ends: what it printed decides
          out=$({{ kubectl }} -n schnappy-production exec "$pod" -c kafka -- /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic upgrade-check --from-beginning --timeout-ms 30000 2> /dev/null || true)
          printf '%s\n' "$out" | grep -c . ; printf '%s\n' "$out" | md5sum | cut -d' ' -f1
          {{ kubectl }} -n schnappy-production exec "$pod" -c kafka -- /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server localhost:9092 --topic upgrade-check --time -1 | awk -F: '{n += $3} END {print n}'
      register: _kafka_back
      changed_when: false
      retries: 10
      delay: 15
      until: _kafka_back.rc == 0 and _kafka_back.stdout_lines == ['1000', kafka_expected_md5, '1000']
      when: store == 'kafka'

    # ── scylla (in place) ─────────────────────────────────────────────
    # the snapshot the Wave 0 run took and recorded (snapshots.txt beside the backup: "<cluster id> <name> <task>
    # <location> <tag>") - every snapshot since the seed holds the same rows, so only the record ties the restore to
    # this backup. Scylla Manager lists a snapshot a little after its backup is done: waited for
    - name: Scylla - the Wave 0 backup's snapshot record read back from the Pi store
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/tasks/upgrade-backup-download.yml"
      vars:
        download_key: "scylla/{{ _stamp.stdout }}/snapshots.txt"
        download_file: "{{ work_dir }}/snapshots.txt"
        upgrade_backup_endpoint: "{{ endpoint }}"
        upgrade_backup_bucket: "{{ bucket }}"
      when: store == 'scylla'

    - name: Scylla - the Wave 0 backup's own snapshot, recorded and listed in its location
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          M="{{ kubectl }} -n scylla-manager exec deploy/scylla-manager -c scylla-manager --"
          rec=$(awk '$2 ~ /(^|\/)schnappy-production-scylla$/' {{ work_dir }}/snapshots.txt)
          read -r c name task loc tag <<< "$rec"
          [[ $tag =~ ^sm_[0-9]{14}UTC$ ]] || { echo "no snapshot recorded for schnappy-production-scylla: $rec"; exit 1; }
          # grep reads to the end: -q would close the pipe on the first match, and kubectl dying of SIGPIPE fails it
          $M sctool backup list -c "$c" -L "$loc" | grep -F -- "$tag" > /dev/null || { echo "$tag not (yet) in $loc"; exit 1; }
          echo "$c $loc $tag"
      register: _scylla_snap
      changed_when: false
      retries: 8
      delay: 15
      until: _scylla_snap.rc == 0
      when: store == 'scylla'

    - name: Scylla - the canary table truncated, then restored from that snapshot
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          M="{{ kubectl }} -n scylla-manager exec deploy/scylla-manager -c scylla-manager --"
          read -r c loc tag <<< "{{ _scylla_snap.stdout }}"
          node=$({{ kubectl }} -n schnappy-production get pods -l scylla/cluster=schnappy-production-scylla -o jsonpath='{.items[0].metadata.name}')
          {{ kubectl }} -n schnappy-production exec "$node" -c scylla -- cqlsh -e "TRUNCATE upgrade_check.canary;"
          task=$($M sctool restore -c "$c" -L "$loc" -T "$tag" --restore-tables -K 'upgrade_check.canary')
          echo "$c $task $tag"
      register: _scylla_restore
      changed_when: true
      when: store == 'scylla'

    - name: Scylla - the restore done
      ansible.builtin.command: >-
        {{ kubectl }} -n scylla-manager exec deploy/scylla-manager -c scylla-manager --
        sctool progress -c {{ _scylla_restore.stdout.split()[0] }} {{ _scylla_restore.stdout.split()[1] }}
      register: _scylla_progress
      changed_when: false
      retries: 60
      delay: 15
      until: _scylla_progress.stdout is search('Status:\s+(DONE|ERROR|ABORTED)')
      failed_when: _scylla_progress.stdout is not search('Status:\s+DONE')
      when: store == 'scylla'

    - name: Scylla - exactly the seeded rows again
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          node=$({{ kubectl }} -n schnappy-production get pods -l scylla/cluster=schnappy-production-scylla -o jsonpath='{.items[0].metadata.name}')
          {{ kubectl }} -n schnappy-production exec "$node" -c scylla -- cqlsh -e "PAGING OFF; SELECT k, v FROM upgrade_check.canary;" \
            | awk -F'|' 'NF == 2 && $1 ~ /^ *[0-9]+ *$/ {gsub(/ /, "", $1); gsub(/^ +| +$/, "", $2); print $1 "|" $2}' \
            | sort -n > {{ work_dir }}/rows
          echo "$(wc -l < {{ work_dir }}/rows) $(md5sum < {{ work_dir }}/rows | cut -d' ' -f1)"
      register: _scylla_rows
      changed_when: false
      failed_when: _scylla_rows.rc != 0 or _scylla_rows.stdout != '1000 ' ~ scylla_expected_md5
      when: store == 'scylla'

    # ── gateway (in place: the in-cluster object store, Mimir, Tempo) ──
    - name: Gateway - the three volumes' directories
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          for pvc in {{ gateway_pvcs | join(' ') }}; do
            pv=$({{ kubectl }} -n schnappy-infra get pvc "$pvc" -o jsonpath='{.spec.volumeName}')
            echo "$pvc $({{ kubectl }} get pv "$pv" -o jsonpath='{.spec.hostPath.path}{.spec.local.path}')"
          done
      register: _gw
      changed_when: false
      failed_when: _gw.rc != 0 or _gw.stdout_lines | length != 3 or _gw.stdout_lines | map('split') | map('length') | unique != [2]
      when: store == 'gateway'

    - name: Gateway - each volume's backup and the object list read back from the Pi store, parts and whole checked
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/tasks/upgrade-backup-download.yml"
      vars:
        download_key: "gateway/{{ _stamp.stdout }}/{{ item }}"
        # the objects the backup checked into the archive: what the restore must give back
        download_file: "{{ work_dir }}/{{ 'objects.json' if item.endswith('.objects.json') else item }}"
        upgrade_backup_endpoint: "{{ endpoint }}"
        upgrade_backup_bucket: "{{ bucket }}"
      loop: "{{ (gateway_pvcs | map('regex_replace', '$', '.tar.gz') | list) + ['schnappy-infra-s3gw.objects.json'] }}"
      when: store == 'gateway'

    - name: Gateway - the object store's checker on the node
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/files/objectstore-manifest.py"
        dest: "{{ work_dir }}/objectstore-manifest.py"
        mode: '0700'
      when: store == 'gateway'

    - name: Gateway - a second trace pushed after the backup (the restore must take it away)
      ansible.builtin.include_tasks: tasks/tempo-push.yml
      vars:
        proxy: "{{ infra_proxy }}"
        push_trace_id: "{{ extra_trace_id }}"
        push_span_id: "{{ extra_trace_id[:16] }}"
        push_name: upgrade-after-backup
      when: store == 'gateway'

    - name: Gateway - Tempo holds it
      ansible.builtin.command: >-
        {{ kubectl }} get --raw '{{ infra_proxy }}/schnappy-tempo:3200/proxy/api/traces/{{ extra_trace_id }}'
      register: _gw_extra
      changed_when: false
      retries: 12
      delay: 5
      until: _gw_extra.rc == 0 and 'upgrade-after-backup' in _gw_extra.stdout
      when: store == 'gateway'

    # the replacement pods held Pending on a cordoned node while the volumes are replaced (a scale to 0 would be
    # undone by Argo CD's self-heal); the node uncordoned whatever happens
    - name: Gateway - the volumes replaced by the backup's, the pods that mount them held off
      when: store == 'gateway'
      block:
        - name: Gateway - the pods mounting the three volumes, their node cordoned
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              {{ kubectl }} -n schnappy-infra get pods -o json | python3 -c "$MOUNTING" {{ gateway_pvcs | join(' ') }} > {{ work_dir }}/pods
              nodes=$(awk '{print $2}' {{ work_dir }}/pods | sort -u)
              [ "$(wc -l < {{ work_dir }}/pods)" -ge 3 ] && [ "$(echo "$nodes" | wc -l)" = 1 ] && [ "$nodes" != - ] \
                || { echo "expected the pods of three volumes on one node:"; cat {{ work_dir }}/pods; exit 1; }
              {{ kubectl }} cordon "$nodes" > /dev/null
              echo "$nodes"
          environment:
            MOUNTING: "{{ mounting_py }}"
          register: _gw_node
          changed_when: true

        - name: Gateway - those pods deleted and gone, their replacements Pending
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              {{ kubectl }} -n schnappy-infra delete pod $(awk '{print $1}' {{ work_dir }}/pods) --wait=true --timeout=300s
          changed_when: true

        - name: Gateway - nothing mounts the three volumes now
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              {{ kubectl }} -n schnappy-infra get pods -o json | python3 -c "$MOUNTING" {{ gateway_pvcs | join(' ') }}
          environment:
            MOUNTING: "{{ mounting_py }}"
          register: _gw_held
          changed_when: false
          retries: 20
          delay: 3
          until: _gw_held.rc == 0 and _gw_held.stdout_lines | reject('search', ' - Pending not$') | list | length == 0

        - name: Gateway - each volume's content replaced by the backup's, extended attributes too
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              while read -r pvc dir; do
                [ -d "$dir" ] && [ -s "{{ work_dir }}/$pvc.tar.gz" ]
                find "$dir" -mindepth 1 -delete
                tar --numeric-owner --xattrs --xattrs-include='user.*' -C "$dir" -xzf "{{ work_dir }}/$pvc.tar.gz"
                echo "$pvc $(du -sh "$dir" | cut -f1)"
              done <<< "{{ _gw.stdout }}"
          register: _gw_replaced
          changed_when: true

        # before the pods start (nothing written yet): every object the backup listed, with its ETag (a single-part
        # one's content its md5), and every bucket with its ACL - the posix backend reads both from extended attributes
        - name: Gateway - the object store restored as the backup listed it
          ansible.builtin.command: >-
            python3 {{ work_dir }}/objectstore-manifest.py verify-tree
            {{ _gw.stdout_lines | select('match', 'schnappy-infra-s3gw ') | first | split | last }}/buckets {{ work_dir }}/objects.json
          register: _gw_xattrs
          changed_when: false
      always:
        - name: Gateway - the node uncordoned
          ansible.builtin.command: "{{ kubectl }} uncordon {{ _gw_node.stdout }}"
          changed_when: true
          when: _gw_node.stdout | default('') | length > 0

    - name: Gateway - the pods mounting the three volumes running and ready again
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ kubectl }} -n schnappy-infra get pods -o json | python3 -c "$MOUNTING" {{ gateway_pvcs | join(' ') }}
      environment:
        MOUNTING: "{{ mounting_py }}"
      register: _gw_up
      changed_when: false
      retries: 40
      delay: 15
      until: >-
        _gw_up.rc == 0 and _gw_up.stdout_lines | length >= 3
        and _gw_up.stdout_lines | reject('search', ' Running ready$') | list | length == 0
      when: store == 'gateway'

    - name: Gateway - Tempo has the seeded trace back, and not the one pushed after the backup
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          t() { {{ kubectl }} get --raw "{{ infra_proxy }}/schnappy-tempo:3200/proxy/api/traces/$1" 2>&1; }
          seeded=$(t {{ survival_trace_id }}) || { echo "seeded: $seeded"; exit 1; }
          grep -q upgrade-canary <<< "$seeded" || { echo "seeded trace without its span"; exit 1; }
          if extra=$(t {{ extra_trace_id }}); then echo "the trace pushed after the backup is still there"; exit 1; fi
          grep -q NotFound <<< "$extra" || { echo "after: $extra"; exit 1; }
          echo "seeded trace back, the later one gone"
      register: _gw_tempo
      changed_when: false
      retries: 30
      delay: 10
      until: _gw_tempo.rc == 0
      when: store == 'gateway'

    - name: Gateway - Mimir's `up` series at the seed's time, as many as then
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ kubectl }} get --raw \
            '{{ infra_proxy }}/schnappy-mimir:9009/proxy/prometheus/api/v1/query?query=count(up)&time={{ _survival.mimir_at }}' \
            | python3 -c 'import json, sys; r = json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)'
      vars:
        _survival: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../.upgrade/survival.json') | from_json }}"
      register: _gw_mimir
      changed_when: false
      retries: 20
      delay: 15
      until: _gw_mimir.rc == 0 and (_gw_mimir.stdout | int) > 0 and (_gw_mimir.stdout | int) >= (_survival.mimir_up | int)
      when: store == 'gateway'

    - name: Gateway - Mimir's stored blocks, read by the store-gateway from the restored bucket
      ansible.builtin.include_tasks: tasks/mimir-blocks.yml
      vars:
        mimir_proxy: "{{ infra_proxy }}"
        mimir_at: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../.upgrade/survival.json') | from_json).mimir_at }}"
      when: store == 'gateway'

    - name: Remove the work directory
      ansible.builtin.file:
        path: "{{ work_dir }}"
        state: absent

    - name: Restored
      ansible.builtin.debug:
        msg: "WAVE 0 {{ store }} RESTORES: {{ _restored[store] }}"
      vars:
        _restored:
          postgres: "{{ _pg_restored | default(['?']) | join('; ') }}"
          clickhouse: >-
            {{ _download.stdout | default('') }} -> upgrade_check.canary_restore, rows and md5
            {{ _ch_restore.stdout_lines[-1] | default('?') }}
          grafana: "{{ _download.stdout | default('') }}: {{ _grafana_restore.stdout | default('?') }}"
          kafka: >-
            {{ _broker.stdout | default('') }} -> the topic upgrade-check holds
            {{ (_kafka_back.stdout_lines | default(['?', '?', '?']))[0] }} messages, md5
            {{ (_kafka_back.stdout_lines | default(['?', '?', '?']))[1] }}, ends at offset
            {{ (_kafka_back.stdout_lines | default(['?', '?', '?']))[2] }} - the extra one (offset
            {{ _kafka_extra.stdout | default('?') }} before) gone
          scylla: >-
            upgrade_check.canary truncated, restored from {{ _scylla_restore.stdout.split()[-1] | default('?') }}:
            {{ _scylla_rows.stdout | default('?') }} (rows md5)
          gateway: >-
            {{ gateway_pvcs | join(', ') }} -> {{ _gw_replaced.stdout_lines | default([]) | join(', ') }};
            {{ _gw_xattrs.stdout | default('?') }}; Tempo: {{ _gw_tempo.stdout | default('?') }};
            Mimir {{ _gw_mimir.stdout | default('?') }} `up` series at the seed, {{ _mimir_block.stdout | default('?') }}
