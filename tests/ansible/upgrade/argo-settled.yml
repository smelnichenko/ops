---
# Wait until the Vagrant copy has settled - files/argo-settled.py: every Argo CD Application Synced and Healthy, no
# operation running, its last sync not failed, its sync status computed against its current spec, and every pod ready
# (a node-shutdown leftover excepted), all held for stable_polls polls in a row with no container restarting in
# between. Checked together: right after a restart Argo still shows the health it had before the shutdown, so its apps
# look green while their pods are still starting (2026-10-02: a wait that checked the apps first passed on its first
# try). A failed kubectl call is not green. On timeout it prints every app and pod that is not green, then fails.
#
# One green poll ended the wait, a failed sync passed, restarts were not looked at, and a failed pod query counted as
# every pod ready. stable_polls 4 holds green for 30 s; the step runner's first wait, before a
# step's playbooks, takes 1 - the wait after them decides the step.
#
# With -e expect_mirror=true (after a mirror push) every app source from the mirrored repos must also be synced to the
# commit the mirror pushed (.upgrade/mirror-revisions.json): until Argo has fetched it, an app still shows the old
# commit as Synced + Healthy and the wait would pass before the step was even applied. Off before any mirror push
# (the base's own wait).
#
# With -e allow_out_of_sync=<app>,<app> those apps may be OutOfSync (still Healthy, nothing running, on the pushed
# commit): a step that turns an app's automated sync off and then changes what its chart would put back (Strimzi's v1
# conversion) leaves it so on purpose, until the next step. The runner passes a step's argo-out-of-sync lines.
#
# With expect_mirror it first asks Argo to refresh every app (argocd.argoproj.io/refresh=normal): otherwise Argo sees
# the pushed commits only at its next 3-minute poll, and the wait averaged 3.8 min a step in full run 2 (2026-10-04).
#
# With -e record_apps=true (the build's Argo stage) the Applications' names go to .upgrade/argo-apps.txt; with -e
# expect_apps=true (every step's waits) exactly those must exist - no step adds or removes one, and a child app gone
# would otherwise settle by its absence. With -e restart_step=<step> (a step's deciding wait) a pod whose containers
# restarted during this step and the one before fails it: a crash loop slower than 5 minutes settles between restarts
# (the history in /var/lib/upgrade-test on the node). With -e restarts_expected=true as well (a step's
# restarts-control-plane line: the Kubernetes upgrades restart the controllers holding leader leases with the API
# server) the step's restarts are recorded, not judged; the next step judges its own against them (a pod restarting
# there too is a crash loop, caught a step later).
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/argo-settled.yml [-e settle_minutes=40]
#        [-e expect_mirror=true] [-e allow_out_of_sync=strimzi] [-e stable_polls=1] [-e restart_quiet=120]
#        [-e record_apps=true]
#        [-e expect_apps=true] [-e restart_step=<step> [-e restarts_expected=true]]
- name: Argo CD settled (all apps Synced + Healthy, all pods ready)
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    settle_minutes: 40
    poll_seconds: 10
    stable_polls: 4
    # no container restarted in the last restart_quiet seconds (argo-settled.py's --restart-quiet): 300 is
    # CrashLoopBackOff's longest back-off - a crash loop never settles in its own step; the step runner's deciding wait
    # takes 120 (a crash loop slower than that settles once, and the restart history fails it at the next step)
    restart_quiet: 300
    expect_mirror: false
    allow_out_of_sync: ""
    record_apps: false
    expect_apps: false
    restart_step: ""
    # the step restarts the control plane (its restarts recorded, not judged - argo-settled.py --restarts-expected)
    restarts_expected: false
    apps_file: "{{ playbook_dir }}/../../../.upgrade/argo-apps.txt"
    restart_history: /var/lib/upgrade-test/restart-history.json
    mirror_revisions: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../.upgrade/mirror-revisions.json') | from_json
         if expect_mirror | bool else {} }}

  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Argo refreshes every app now, so it sees the pushed commits at once
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n argocd annotate applications.argoproj.io --all
        argocd.argoproj.io/refresh=normal --overwrite
      when: expect_mirror | bool
      changed_when: true

    - name: The restart history's directory
      ansible.builtin.file:
        path: "{{ restart_history | dirname }}"
        state: directory
        mode: '0700'
      when: restart_step | length > 0

    - name: Wait until every app is green and every pod is ready, held for stable_polls polls in a row
      ansible.builtin.script:
        cmd: >-
          files/argo-settled.py --kubeconfig {{ kubeconfig }} --minutes {{ settle_minutes }} --poll {{ poll_seconds }}
          --stable-polls {{ stable_polls }} --restart-quiet {{ restart_quiet }} --allow-out-of-sync '{{ allow_out_of_sync }}'
          {{ '--print-apps' if record_apps | bool else '' }}
          {{ ('--expect-apps ' ~ (lookup('ansible.builtin.file', apps_file).split() | join(','))) if expect_apps | bool else '' }}
          {{ ('--restart-history ' ~ restart_history ~ ' --step ' ~ restart_step) if restart_step | length > 0 else '' }}
          {{ '--restarts-expected' if restarts_expected | bool else '' }}
        executable: python3
      environment:
        MIRROR_REVISIONS: "{{ mirror_revisions | to_json }}"
      register: _settled
      changed_when: false
      failed_when: false

    - name: Not settled
      ansible.builtin.fail:
        msg: "{{ _settled.stdout_lines[-60:] | join('\n') }}{{ _settled.stderr | default('') }}"
      when: _settled.rc != 0

    - name: The Applications' names recorded for the steps' waits
      ansible.builtin.copy:
        content: "{{ (_settled.stdout_lines | select('match', '^APPS ') | last)[5:].split(',') | join('\n') }}\n"
        dest: "{{ apps_file }}"
        mode: '0644'
      delegate_to: localhost
      become: false
      when: record_apps | bool

    - name: Settled
      ansible.builtin.debug:
        msg: "{{ _settled.stdout_lines | select('match', '^ARGO SETTLED') | last }}"
