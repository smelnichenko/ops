---
# Wait until every Argo CD Application in the Vagrant upgrade test is Synced and Healthy with no operation running
# AND every pod is ready - the test's definition of green, checked together in one loop: right after a restart Argo
# still shows the health it had before the shutdown, so its apps look green while their pods are still starting
# (2026-10-02: a wait that checked the apps first passed on its first try). On timeout it prints, for each app that
# is not green, its sync/health/operation state and the resources that are out of sync or unhealthy, plus the pods
# that are not ready, then fails.
#
# With -e expect_mirror=true (after a mirror push) every app source from the mirrored repos must also be synced to the
# commit the mirror pushed (.upgrade/mirror-revisions.json): until Argo has fetched it, an app still shows the old
# commit as Synced + Healthy and the wait would pass before the step was even applied. Off after a snapshot restore,
# whose Forgejo holds older commits than that file.
#
# With -e allow_out_of_sync=<app>,<app> those apps may be OutOfSync (still Healthy, nothing running, on the pushed
# commit): a step that turns an app's automated sync off and then changes what its chart would put back (Strimzi's v1
# conversion) leaves it so on purpose, until the next step. The runner passes a step's argo-out-of-sync lines.
#
# With expect_mirror it first asks Argo to refresh every app (argocd.argoproj.io/refresh=normal): otherwise Argo sees
# the pushed commits only at its next 3-minute poll, and the wait averaged 3.8 min a step in full run 2 (2026-10-04).
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/argo-settled.yml [-e settle_minutes=40]
#        [-e expect_mirror=true] [-e allow_out_of_sync=strimzi]
- name: Argo CD settled (all apps Synced + Healthy, all pods ready)
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    settle_minutes: 40
    poll_seconds: 10
    expect_mirror: false
    allow_out_of_sync: ""
    mirror_revisions: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../.upgrade/mirror-revisions.json') | from_json
         if expect_mirror | bool else {} }}

  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Argo refreshes every app now, so it sees the pushed commits at once
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n argocd annotate applications.argoproj.io --all
        argocd.argoproj.io/refresh=normal --overwrite
      when: expect_mirror | bool
      changed_when: true

    - name: Wait until every app is green and every pod is ready
      ansible.builtin.shell: |
        set -o pipefail
        K="kubectl --kubeconfig {{ kubeconfig }}"
        apps=$($K -n argocd get applications -o json | python3 -c '
        import json, os, sys
        items = json.load(sys.stdin)["items"]
        want = json.loads(os.environ["MIRROR_REVISIONS"])
        allowed = set(filter(None, os.environ["ALLOW_OUT_OF_SYNC"].split(",")))
        def stale(a):
            spec, sync = a.get("spec", {}), a.get("status", {}).get("sync", {})
            sources = spec.get("sources") or [spec.get("source", {})]
            revisions = sync.get("revisions") or [sync.get("revision")]
            return any(s.get("repoURL") in want and r != want[s["repoURL"]] for s, r in zip(sources, revisions))
        out_of_sync = sorted(a["metadata"]["name"] for a in items
                             if a.get("status", {}).get("sync", {}).get("status") != "Synced")
        bad = [a["metadata"]["name"] for a in items
               if (a.get("status", {}).get("sync", {}).get("status") != "Synced" and a["metadata"]["name"] not in allowed)
               or a.get("status", {}).get("health", {}).get("status") != "Healthy"
               or a.get("status", {}).get("operationState", {}).get("phase") == "Running"
               or stale(a)]
        print(len(items), len(bad), ",".join(sorted(bad)) or "-", ",".join(n for n in out_of_sync if n in allowed) or "-")')
        read -r total not_green names allowed_out <<< "$apps"
        not_ready=$($K get pods -A --no-headers | awk '{split($3,a,"/"); if ($4!="Completed" && (a[1]!=a[2] || $4!="Running")) n++} END {print n+0}')
        echo "apps=$total not_green=$not_green pods_not_ready=$not_ready not_green_apps=$names out_of_sync_allowed=$allowed_out"
        [ "$total" -gt 0 ] && [ "$not_green" = 0 ] && [ "$not_ready" = 0 ]
      args:
        executable: /bin/bash
      environment:
        MIRROR_REVISIONS: "{{ mirror_revisions | to_json }}"
        ALLOW_OUT_OF_SYNC: "{{ allow_out_of_sync }}"
      register: _green
      retries: "{{ (settle_minutes | int * 60 / poll_seconds | int) | int }}"
      delay: "{{ poll_seconds }}"
      until: _green.rc == 0
      changed_when: false
      failed_when: false

    - name: Read the apps for the report
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: argocd
      register: _apps
      when: _green.rc != 0

    - name: Pods that are not ready
      ansible.builtin.shell: |
        set -o pipefail
        kubectl --kubeconfig {{ kubeconfig }} get pods -A --no-headers \
          | awk '{split($3,a,"/"); if ($4!="Completed" && (a[1]!=a[2] || $4!="Running")) print}'
      args:
        executable: /bin/bash
      register: _unready
      changed_when: false
      when: _green.rc != 0

    - name: The state of every app that is not green
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}: sync={{ item.status.sync.status | default('?') }}
          health={{ item.status.health.status | default('?') }}
          op={{ item.status.operationState.phase | default('-') }}
          {{ (item.status.operationState.message | default(''))[:300] }}
          | resources not green: {{ item.status.resources | default([])
             | rejectattr('status', 'equalto', 'Synced') | map(attribute='name') | list
             + (item.status.resources | default([]) | selectattr('health', 'defined')
                | rejectattr('health.status', 'equalto', 'Healthy') | map(attribute='name') | list) }}
          | conditions: {{ item.status.conditions | default([]) | map(attribute='message') | list }}
      loop: >-
        {{ _apps.resources | default([])
           | rejectattr('status.health.status', 'equalto', 'Healthy') | list
           + (_apps.resources | default([]) | rejectattr('status.sync.status', 'equalto', 'Synced') | list) | unique }}
      loop_control:
        label: "{{ item.metadata.name }}"
      when: _green.rc != 0

    - name: Not settled
      ansible.builtin.fail:
        msg: |
          Argo CD did not settle in {{ settle_minutes }} min: {{ _green.stdout | default('') }}
          Pods not ready:
          {{ _unready.stdout | default('') }}
      when: _green.rc != 0

    - name: Settled
      ansible.builtin.debug:
        msg: "ARGO SETTLED: {{ _green.stdout }}"
