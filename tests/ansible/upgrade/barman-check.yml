---
# CNPG still backs Postgres up after an upgrade step (the runner runs this after the steps marked barman-check: the
# CNPG operator, its store, PostgreSQL 18) - production's own playbook (postgres-base-backup.yml, which production's
# done phase runs after the same steps), behind the Vagrant guard: a host that fails it is dropped from the plays after.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/barman-check.yml
- name: Vagrant VMs only
  ansible.builtin.import_playbook: ../vagrant-only-play.yml

- name: Production's base backup playbook
  ansible.builtin.import_playbook: ../../../deploy/ansible/playbooks/postgres-base-backup.yml
