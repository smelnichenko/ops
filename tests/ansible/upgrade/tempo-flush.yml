---
# A step that replaces Tempo's major (its tempo-flush line): Tempo 3 does not replay Tempo 2's WAL, so the spans Tempo
# 2 still holds are lost unless they are flushed first - production's merge flushes right before the repo the line
# names (scripts/upgrade-production.py merge). In the Vagrant copy, before the step's mirror push:
#
#   -e mode=flush   a fresh trace pushed and found (Tempo 2 holds it), then Tempo flushed and the flush waited for -
#                   scripts/tempo-flush.py, as production runs it; then a second pushed and found (what arrives after
#                   the flush, until Tempo 2 stops); both IDs kept in .upgrade/tempo-preflush.txt
#   -e mode=verify  after the step: both traces by their IDs - on Tempo 3, from the store (the flush put the first
#                   there, Tempo 2's stop the second: flush_all_on_shutdown)
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/tempo-flush.yml -e mode=flush|verify
- name: Vagrant VMs only
  ansible.builtin.import_playbook: ../vagrant-only-play.yml

- name: Tempo flushed before its major changes, the spans it held kept
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    proxy: /api/v1/namespaces/schnappy-infra/services
    id_file: "{{ playbook_dir }}/../../../.upgrade/tempo-preflush.txt"
  tasks:
    - name: The mode is flush or verify
      ansible.builtin.assert:
        that: mode | default('') in ['flush', 'verify']
        fail_msg: "-e mode=flush|verify"
        quiet: true

    - name: Flush
      when: mode == 'flush'
      block:
        - name: A trace ID of this run's own
          ansible.builtin.set_fact:
            _trace: "{{ lookup('ansible.builtin.pipe', 'date +%s%N | sha256sum | cut -c1-32') }}"

        - name: The trace, pushed while Tempo 2 holds it
          ansible.builtin.include_tasks: tasks/tempo-push.yml
          vars:
            push_trace_id: "{{ _trace }}"
            push_span_id: "{{ _trace[:16] }}"
            push_name: upgrade-preflush

        - name: Tempo has it (in its ingester, not yet in a block)
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ kubeconfig }} get --raw '{{ proxy }}/schnappy-tempo:3200/proxy/api/traces/{{ _trace }}'
          register: _held
          changed_when: false
          retries: 30
          delay: 5
          until: _held.rc == 0 and 'upgrade-preflush' in _held.stdout

        - name: Tempo flushed, the flush waited for - the script production's merge runs
          ansible.builtin.script:
            cmd: "{{ playbook_dir }}/../../../scripts/tempo-flush.py --kubeconfig {{ kubeconfig }}"
            executable: python3
          changed_when: true

        # what arrives after the flush, until Tempo 2 is replaced: written to the store by its stop
        # (flush_all_on_shutdown) - Tempo 3 does not replay 2's WAL
        - name: A second trace ID, for a trace pushed after the flush
          ansible.builtin.set_fact:
            _after: "{{ lookup('ansible.builtin.pipe', 'date +%s%N | sha256sum | cut -c1-32') }}"

        - name: The second trace, pushed after the flush
          ansible.builtin.include_tasks: tasks/tempo-push.yml
          vars:
            push_trace_id: "{{ _after }}"
            push_span_id: "{{ _after[:16] }}"
            push_name: upgrade-postflush

        # when, by the API server's clock - the pods' times are its (the controller's needed 20 s of slack, and a
        # Tempo made in it before the push, the one that held the trace, passed as replaced): a server-side dry run
        # writes nothing, its object's creationTimestamp the server's now - read after the push, never before it
        - name: The second trace's push time, by the API server's clock
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ kubeconfig }} -n schnappy-infra create configmap tempo-flush-clock
            --dry-run=server -o jsonpath={.metadata.creationTimestamp}
          register: _after_clock
          changed_when: false
          failed_when: _after_clock.rc != 0 or _after_clock.stdout is not match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$')

        - name: Tempo has it (in its ingester - only its stop writes it to the store)
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ kubeconfig }} get --raw '{{ proxy }}/schnappy-tempo:3200/proxy/api/traces/{{ _after }}'
          register: _held_after
          changed_when: false
          retries: 30
          delay: 5
          until: _held_after.rc == 0 and 'upgrade-postflush' in _held_after.stdout

        - name: Both IDs kept for the check after the step, each with its span's name (the second's push time too)
          ansible.builtin.copy:
            content: "{{ _trace }} upgrade-preflush\n{{ _after }} upgrade-postflush {{ _after_clock.stdout }}\n"
            dest: "{{ id_file }}"
            mode: '0644'
          delegate_to: localhost
          become: false

    # the second trace proves flush_all_on_shutdown only if Tempo 2 stopped while it still held it: within its
    # max_block_duration (5 min) of the push - later, Tempo 2 wrote it to the store itself and finding it proves nothing.
    # Tempo is replaced by Recreate: its new pod made after the old one stopped - one made before the push (both times
    # the API server's) is the Tempo that held it, never replaced; none running is nothing read: neither proves it
    - name: Tempo 2 stopped within 5 minutes of the trace pushed after the flush (else its check proves nothing)
      when: mode == 'verify'
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          made=$(kubectl --kubeconfig {{ kubeconfig }} -n schnappy-infra get pod -l app.kubernetes.io/component=tempo \
            --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.creationTimestamp}' | tr ' ' '\n' \
            | sort | tail -1)
          [ -n "$made" ] || { echo "NOT PROVEN: no Tempo pod running"; exit 1; }
          [[ $PUSHED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] \
            || { echo "NOT PROVEN: the push's time not the API server's ('$PUSHED') - seed again"; exit 1; }
          lived=$(( $(date -d "$made" +%s) - $(date -d "$PUSHED" +%s) ))
          echo "Tempo 2 replaced $lived s after the trace pushed after the flush"
          [ "$lived" -ge 0 ] || { echo "NOT PROVEN: Tempo made $(( -lived )) s before it - never replaced"; exit 1; }
          [ "$lived" -le 280 ] || { echo "NOT PROVEN: Tempo 2 lived $lived s after it - over its 5-minute blocks"; exit 1; }
      environment:
        PUSHED: "{{ (lookup('ansible.builtin.file', id_file).splitlines() | select('search', ' upgrade-postflush ') | first).split()[2] }}"
      changed_when: false

    - name: The traces pushed before and after the flush, after the step - each by its ID, its span's name in it
      when: mode == 'verify'
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} get --raw '{{ proxy }}/schnappy-tempo:3200/proxy/api/traces/{{ item.split()[0] }}'
      loop: "{{ lookup('ansible.builtin.file', id_file).splitlines() }}"
      register: _kept
      changed_when: false
      retries: 30
      delay: 10
      until: _kept.rc == 0 and item.split()[1] in _kept.stdout
