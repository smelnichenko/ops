---
# Wait until the Vagrant copy is usable after its VMs (re)start: the Pis isolated from production, Vault ACTIVE on the
# Pi VIP and the kubeadm node Ready.
# After a cold start of both Pis, Vault is unsealed but takes ~45 s to elect an active node (Consul lock); in between
# every request bounces between standbys (health 474, "Exceeded 30 redirects") and the Vault seeding refuses to run
# (2026-10-02, after the first base-ready snapshot).
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/vms-ready.yml
- name: The VMs answer SSH (a freshly started VM's private interface comes up a while after `vagrant up` returns)
  hosts: target:pi1:pi2
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

# isolated from production before anything else runs (a snapshot taken before the Pi fence existed lacks it)
- name: The Pi VMs are isolated from production
  ansible.builtin.import_playbook: ../isolate-pis.yml

- name: The Vagrant VMs are ready
  hosts: target
  become: true
  gather_facts: false
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Vault answers on the Pi VIP with an active node (standbyok - the VIP may sit on the standby, which forwards)
      ansible.builtin.uri:
        url: "https://{{ keepalived_vip }}:8200/v1/sys/health?standbyok=true"
        validate_certs: false
        timeout: 5
        status_code: [200]
      register: _vault
      retries: 60
      delay: 5
      until: _vault.status == 200

    - name: The node is Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait node --all --for=condition=Ready --timeout=300s
      changed_when: false
