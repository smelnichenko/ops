---
# Objects that exist on ten but in no git repo, recreated in the Vagrant copy so it starts from production's state.
# Each entry says why it is not in git and what fixes that for good.
#
#   schnappy-production-postgres-app (an ExternalSecret from Vault's postgres-monitor, see the task) - the CNPG
#     Cluster's initdb names this Secret (platform helm/schnappy-data,
#     cnpg-cluster.yaml), and nothing creates it: on ten CNPG generated it when the cluster was first bootstrapped
#     (2026-04-10, owner=Cluster, kubernetes.io/basic-auth) through a path that named no secret. A fresh bootstrap
#     waits for it forever (Vagrant, 2026-10-02: "secret schnappy-production-postgres-app not found"), so a DR
#     rebuild that bootstraps with initdb would too. Its password only matters during initdb: the init-users job
#     then sets every role's password, the owner's included, from that service's own Secret.
#
#   ServiceAccounts schnappy-alertmanager, -grafana, -mimir, -reports (schnappy-infra) - the observability chart
#     (release "schnappy") runs its pods as schnappy-<name>, but the mesh chart creates schnappy-infra-<name>; on ten
#     the four were created by hand on 2026-04-10 14:58:43 (no Argo, Helm or kubectl-apply trace). Without them
#     Alertmanager, Grafana and Mimir never get a pod.
#
#   pmon-dev-wildcard-tls (schnappy-infra) - production's own *.pmon.dev certificate (operator 2026-10-03, see the
#     task). Production's is a public Let's Encrypt certificate that every in-cluster client of https://auth.pmon.dev
#     verifies against public CAs; the Vagrant copy cannot get one of its own.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/production-state.yml
- name: Production state that is in no git repo
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    production_ssh: sm@192.168.11.2   # ten
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Namespaces the objects below live in (this runs before Argo; its cluster-config applies their labels)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: [schnappy-production, schnappy-infra]

    # The CNPG owner secret as ten has it - CNPG's own (an earlier bootstrap path generated it), username "app" - not a
    # fix of it: the CNPG steps must meet production's state. CNPG's instance manager then fails to sync the owner's
    # password from it, as on ten ("wrong username 'app' in secret, expected 'monitor'", about 6 an hour, read
    # 2026-10-04), and only that failure keeps monitor's password (the apps' own, from Vault). Its password is none of
    # monitor's; it is made once, when the Secret is absent.
    - name: Is the CNPG owner secret there already
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: schnappy-production
        name: schnappy-production-postgres-app
      register: _app_secret
      no_log: true

    - name: CNPG owner secret schnappy-production-postgres-app as ten has it (username app)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/basic-auth
          metadata:
            name: schnappy-production-postgres-app
            namespace: schnappy-production
            labels:
              cnpg.io/cluster: schnappy-production-postgres
              cnpg.io/reload: "true"
              cnpg.io/userType: app
          stringData:
            username: app
            password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
            dbname: app
      when: _app_secret.resources | length == 0
      no_log: true

    - name: ServiceAccounts the observability chart runs as, made by hand on ten (2026-04-10)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "schnappy-{{ item }}"
            namespace: schnappy-infra
      loop: [alertmanager, grafana, mimir, reports]

    - name: Read production's *.pmon.dev wildcard Secret on ten (read-only; held in memory, never written here)
      ansible.builtin.command:
        argv: [ssh, "{{ production_ssh }}", sudo, kubectl, -n, schnappy-infra, get, secret, pmon-dev-wildcard-tls, -o, json]
      delegate_to: localhost
      become: false
      register: _prod_wildcard
      changed_when: false
      no_log: true

    - name: Production's wildcard as the Vagrant cluster's (operator 2026-10-03)
      # Every in-cluster client of https://auth.pmon.dev - the apps' JWKS fetch, admin's Keycloak Admin API, Centrifugo,
      # the gateway's route to Keycloak, istiod - verifies it against public CAs; a Vagrant-issued certificate fails all
      # of them (2026-10-02: the smoke's token was refused everywhere). The Vagrant copy has no Certificate for this
      # Secret (the mirror leaves the mesh chart's out): with one, cert-manager replaced the copy at once ("Secret
      # contains a private key that does not match the current CertificateRequest", 2026-10-03). Production renews its
      # certificate 30 days before expiry; a re-run copies the new one. Caddy on the Vagrant Pis serves the same Secret
      # (setup-caddy.yml).
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        force: true
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/tls
          metadata:
            name: pmon-dev-wildcard-tls
            namespace: schnappy-infra
            annotations: "{{ w.metadata.annotations }}"
            labels: "{{ w.metadata.labels | default({}) }}"
          data: "{{ w.data }}"
      vars:
        w: "{{ _prod_wildcard.stdout | from_json }}"
      no_log: true

    - name: The Vagrant wildcard is production's Let's Encrypt certificate, valid for at least another day
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig {{ kubeconfig }} -n schnappy-infra get secret pmon-dev-wildcard-tls -o jsonpath='{.data.tls\.crt}' \
          | base64 -d | openssl x509 -noout -issuer -ext subjectAltName -checkend 86400
      args:
        executable: /bin/bash
      register: _wildcard_check
      changed_when: false
      failed_when: >-
        _wildcard_check.rc != 0 or "Let's Encrypt" not in _wildcard_check.stdout
        or 'DNS:*.pmon.dev' not in _wildcard_check.stdout

# Keycloak's unit as production's Pis have it (read 2026-10-08, both alike): its URL without a server type, its
# passwords inline (the copy's own here), no EnvironmentFile, no /etc/keycloak, no restart stamp - and the Keycloak
# running booted from it, as production's: step 00 compares the password the secrets file gives with the running
# process's before writing the unit - booted from the playbook's own secrets file, that comparison could not fail on the
# copy. PgBouncer restarted first: its startup parameters fresh, as production's working ones (a pool's first server
# connection to the replica kept in_hot_standby=on, and the URL without a server type refused it - what step 00 fixes).
# Step 00 writes the playbook's unit and secrets file and restarts Keycloak, the Pi without the VIP first, as it will on
# production. Given the URL alone, step 00 ran green on a unit production does not have
- name: Keycloak's unit as production's Pis have it
  hosts: pis
  become: true
  gather_facts: false
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    # a full run from a later step builds production as the steps before it left it: step 00 wrote the playbook's unit
    - name: Production's unit only until step 00 is done (a run from a later step - production has the playbook's then)
      ansible.builtin.meta: end_play
      when: (upgrade_from | default('00-gluster-boot')) > '00-gluster-boot'

    - name: Its unit as production's (no restart)
      ansible.builtin.copy:
        dest: /etc/systemd/system/keycloak.service
        mode: '0644'
        content: |
          [Unit]
          Description=Keycloak SSO
          After=network-online.target patroni.service haproxy.service
          # Wants (soft) rather than Requires (hard): orders start AFTER
          # patroni+haproxy when they exist, but doesn't block keycloak
          # from starting if those units aren't installed yet (fresh
          # vagrant run where playbook order matters). Keycloak retries
          # its DB connection internally so eventual-consistency is fine.
          Wants=network-online.target patroni.service haproxy.service
          [Service]
          Type=exec
          User=keycloak
          Group=keycloak
          Environment=KC_DB=postgres
          Environment=KC_DB_URL=jdbc:postgresql://127.0.0.1:6432/keycloak
          Environment=KC_DB_USERNAME=postgres
          Environment=KC_DB_PASSWORD={{ postgres_admin_password }}
          Environment=KC_HOSTNAME=auth.pmon.dev
          Environment=KC_PROXY_HEADERS=xforwarded
          Environment=KC_HTTP_ENABLED=true
          Environment=KC_HTTP_PORT=8080
          Environment=KC_BOOTSTRAP_ADMIN_USERNAME=admin
          Environment=KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_admin_password }}
          ExecStart=/opt/keycloak/bin/kc.sh start-dev
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      no_log: true

    - name: No secrets file, no restart stamp - as production
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/keycloak, /var/lib/config-loaded/keycloak.sha256]

    # systemd reads it so: kept in memory, the playbook's unit named the file just removed - a crash restart before step
    # 00 failed to load it
    - name: systemd reads production's unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: PgBouncer's startup parameters fresh (as production's working ones)
      ansible.builtin.systemd:
        name: pgbouncer
        state: restarted

    - name: Keycloak booted from production's unit (its inline password - what step 00's guard reads)
      ansible.builtin.systemd:
        name: keycloak
        state: restarted

    - name: Keycloak serving on production's unit
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/realms/master
        status_code: 200
        timeout: 10
        follow_redirects: none
      register: _keycloak_on_production_unit
      until: _keycloak_on_production_unit.status | default(0) == 200
      retries: 120
      delay: 2

# The Pis' Gluster as production's have it before step 00 (read 2026-10-08): the copy's build runs today's
# setup-gluster.yml, so step 00's own change - the fstab entries rewritten with the boot unit's ordering, the unit
# added, forgejo-repos' and backup-git-mirror's owner options set (four live `gluster volume set`, client graph switches
# under Forgejo's writes), the mirror's root given its user - never ran in a full run (step 00 changed nothing there).
# Put back, it runs on every full run from step 00; a run from a later step builds production as step 00 left it
- name: Gluster as production's Pis have it before step 00
  hosts: pis
  become: true
  gather_facts: false
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Production's Gluster only until step 00 is done (a run from a later step - production has today's then)
      ansible.builtin.meta: end_play
      when: (upgrade_from | default('00-gluster-boot')) > '00-gluster-boot'

    - name: The glusterfs mounts in fstab without the boot unit's ordering (no remount - as production's)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: ',x-systemd\.after=gluster-volumes-ready\.service'
        replace: ''

    - name: No boot unit waiting for the volumes' bricks
      ansible.builtin.systemd:
        name: gluster-volumes-ready
        enabled: false

    - name: Its unit and its script gone
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/systemd/system/gluster-volumes-ready.service, /usr/local/sbin/gluster-volumes-ready]

    - name: systemd reads the fstab and units as production's
      ansible.builtin.systemd:
        daemon_reload: true

    - name: forgejo-repos' and backup-git-mirror's owner options unset (production's, read 2026-10-08)
      ansible.builtin.shell: |
        set -euo pipefail
        gluster volume reset forgejo-repos storage.owner-uid > /dev/null
        gluster volume reset forgejo-repos storage.owner-gid > /dev/null
        gluster volume reset backup-git-mirror storage.owner-uid > /dev/null
        gluster volume reset backup-git-mirror storage.owner-gid > /dev/null
      args:
        executable: /bin/bash
      run_once: true
      changed_when: true

    - name: The mirror's root root:root 0755 (production's - its sync refused every repository so)
      ansible.builtin.file:
        path: /mnt/backups/git-mirror
        state: directory
        owner: root
        group: root
        mode: '0755'
      run_once: true
