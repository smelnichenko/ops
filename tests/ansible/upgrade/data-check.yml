---
# Data that must survive every upgrade step, in the Vagrant copy of production.
#
#   -e mode=seed    once, on a green copy: a table of 10 000 rows with a known content (schema upgrade_check of the CNPG
#                   cluster's database - Liquibase owns only its own schema), nothing else touched;
#   -e mode=verify  after each step: every Postgres instance, replicas included, holds exactly those rows (count and an
#                   md5 over all of them, compared with the value computed here, not read back from the seed), and the
#                   primary takes a write. A missing table fails: it is never re-created by a verify.
#
# Both first wait until CNPG has finished: the cluster healthy with every instance ready, each instance pod run by the
# operator version now running (annotation cnpg.io/operatorVersion = the operator image's tag). After an operator
# upgrade Argo is green at once while CNPG restarts the instances a minute later (Vagrant 2026-10-03, step 03: the
# checks ran while it did). -e cnpg_operator_version=<v> overrides the version waited for (to prove the wait bites).
#
# Why: a CNPG operator upgrade restarts every instance in place (and the PostgreSQL 18 step rewrites the data
# directory); the smoke test only proves the apps answer, not that the rows are still there.
#
# Kafka the same way (second play): a topic of 1 000 known messages; verify reads them all from the start and compares
# count and md5 with the value computed here, after waiting until Strimzi has finished - the Kafka cluster Ready,
# reconciled by the operator now running, at the Kafka version it asks for. The Strimzi steps (1.x, Kafka 4.3) roll
# the brokers.
#
# ScyllaDB the same way (third play): a keyspace upgrade_check with 1 000 known rows, read back through cqlsh and
# compared (count + md5) after the operator has finished - every rack updated and ready at the version the cluster
# asks for, Available and not Progressing. The Scylla steps roll the database through 2025.1, 2026.1 and 2026.3.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/data-check.yml -e mode=seed|verify
- name: Postgres data that must survive the upgrade
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    pg_namespace: schnappy-production
    cluster: schnappy-production-postgres
    rows: 10000
    # md5 of the rows' payloads (md5 of each id), comma-joined in id order - what Postgres must compute
    expected_md5: "{{ range(1, rows + 1) | map('string') | map('hash', 'md5') | join(',') | hash('md5') }}"
    kubectl: "kubectl --kubeconfig {{ kubeconfig }} -n {{ pg_namespace }}"
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: The mode is seed or verify
      ansible.builtin.assert:
        that: mode | default('') in ['seed', 'verify']
        fail_msg: "-e mode=seed or -e mode=verify"

    - name: The operator version now running
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} get deploy -A -l app.kubernetes.io/name=cloudnative-pg
        -o jsonpath={.items[0].spec.template.spec.containers[0].image}
      register: _operator
      changed_when: false
      when: cnpg_operator_version is not defined

    - name: CNPG has finished - cluster healthy, every instance ready and run by that operator version
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} get clusters.postgresql.cnpg.io {{ cluster }} -o json | python3 -c '
        import json, sys
        c = json.load(sys.stdin)
        phase, ready, n = c["status"].get("phase"), c["status"].get("readyInstances"), c["spec"]["instances"]
        print(f"HEALTHY {n}" if phase == "Cluster in healthy state" and ready == n else f"WAIT {phase} {ready}/{n}")'
        {{ kubectl }} get pods -l cnpg.io/cluster={{ cluster }},cnpg.io/podRole=instance -o json | python3 -c '
        import json, sys
        for p in json.load(sys.stdin)["items"]:
            statuses = p["status"].get("containerStatuses", [])
            ready = bool(statuses) and all(c.get("ready") for c in statuses)  # a Pending pod has none: not ready
            print(p["metadata"]["name"], p["metadata"].get("annotations", {}).get("cnpg.io/operatorVersion"), ready)'
      args:
        executable: /bin/bash
      vars:
        want: "{{ cnpg_operator_version | default(_operator.stdout.split(':')[-1]) }}"
      register: _cnpg
      changed_when: false
      retries: 40
      delay: 15
      until: >-
        _cnpg.rc == 0 and _cnpg.stdout_lines[0].startswith('HEALTHY ')
        and (_cnpg.stdout_lines[1:] | length) == (_cnpg.stdout_lines[0].split()[1] | int)
        and (_cnpg.stdout_lines[1:] | reject('match', '^\\S+ ' ~ (want | regex_escape) ~ ' True$') | list | length) == 0

    - name: The cluster's primary, its instances and its database
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} get clusters.postgresql.cnpg.io {{ cluster }} \
          -o jsonpath='{.status.currentPrimary} {.spec.bootstrap.initdb.database}{"\n"}'
        {{ kubectl }} get pods -l cnpg.io/cluster={{ cluster }},cnpg.io/podRole=instance -o name
      args:
        executable: /bin/bash
      register: _pg
      changed_when: false

    - name: Facts
      ansible.builtin.set_fact:
        primary: "{{ _pg.stdout_lines[0].split()[0] }}"
        database: "{{ _pg.stdout_lines[0].split()[1] }}"
        instances: "{{ _pg.stdout_lines[1:] | map('regex_replace', '^pod/', '') | list }}"

    - name: Seed - the table and its rows on the primary (only rows that are missing)
      ansible.builtin.shell: |
        {{ kubectl }} exec {{ primary }} -c postgres -- psql -v ON_ERROR_STOP=1 -qAt -d {{ database }} -c "
          create schema if not exists upgrade_check;
          create table if not exists upgrade_check.canary (id int primary key, payload text not null);
          insert into upgrade_check.canary select g, md5(g::text) from generate_series(1, {{ rows }}) g
            on conflict do nothing;"
      when: mode == 'seed'
      changed_when: true

    - name: Every instance holds exactly the seeded rows
      ansible.builtin.shell: |
        {{ kubectl }} exec {{ item }} -c postgres -- psql -v ON_ERROR_STOP=1 -qAt -d {{ database }} -c "
          select count(*) || ' ' || md5(string_agg(payload, ',' order by id)) from upgrade_check.canary"
      loop: "{{ instances }}"
      register: _rows
      changed_when: false
      retries: 10        # a replica just restarted by the step may still be catching up
      delay: 6
      until: _rows.stdout | trim == rows ~ ' ' ~ expected_md5
      failed_when: _rows.stdout | trim != rows ~ ' ' ~ expected_md5

    - name: The primary takes a write (rolled back)
      ansible.builtin.shell: |
        {{ kubectl }} exec {{ primary }} -c postgres -- psql -v ON_ERROR_STOP=1 -qAt -d {{ database }} -c "
          begin; insert into upgrade_check.canary values (-1, 'write check'); rollback;"
      changed_when: false

    - name: Data intact
      ansible.builtin.debug:
        msg: "DATA OK: {{ instances | length }} instances x {{ rows }} rows, md5 {{ expected_md5 }}, primary {{ primary }} writable"

- name: Kafka data that must survive the upgrade
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    kafka_namespace: schnappy-production
    kafka_cluster: schnappy-production
    topic: upgrade-check
    messages: 1000
    # md5 of the messages m-1 .. m-N, newline-separated with a trailing newline - what the consumer prints
    expected_md5: "{{ (range(1, messages + 1) | map('regex_replace', '^', 'm-') | join('\n') ~ '\n') | hash('md5') }}"
    kubectl: "kubectl --kubeconfig {{ kubeconfig }} -n {{ kafka_namespace }}"
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: The operator version now running
      ansible.builtin.shell: >-
        kubectl --kubeconfig {{ kubeconfig }} -n strimzi get deployment strimzi-cluster-operator
        -o jsonpath='{.spec.template.spec.containers[0].image}'
      register: _strimzi
      changed_when: false

    - name: Strimzi has finished - Kafka Ready, reconciled by that operator, at the version it asks for
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} get kafkas.kafka.strimzi.io {{ kafka_cluster }} -o json | python3 -c '
        import json, sys
        k = json.load(sys.stdin)
        s, spec = k.get("status", {}), k["spec"]["kafka"]
        ready = any(c["type"] == "Ready" and c["status"] == "True" for c in s.get("conditions", []))
        print(ready and s.get("observedGeneration") == k["metadata"]["generation"]
              and s.get("kafkaVersion") == spec.get("version"), s.get("operatorLastSuccessfulVersion"))'
      args:
        executable: /bin/bash
      register: _kafka
      changed_when: false
      retries: 60
      delay: 15
      until: _kafka.rc == 0 and _kafka.stdout == 'True ' ~ _strimzi.stdout.split(':')[-1]

    - name: A broker pod
      ansible.builtin.command: "{{ kubectl }} get pods -l strimzi.io/broker-role=true -o jsonpath={.items[0].metadata.name}"
      register: _broker
      changed_when: false
      failed_when: _broker.stdout | length == 0

    - name: Seed - the topic and its messages (only when the topic is new)
      ansible.builtin.shell: |
        set -euo pipefail
        B="{{ kubectl }} exec {{ _broker.stdout }} -c kafka --"
        if $B /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list | grep -qx '{{ topic }}'; then
          echo exists; exit 0
        fi
        $B /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic {{ topic }} \
          --partitions 1 --replication-factor 1 > /dev/null
        seq 1 {{ messages }} | sed 's/^/m-/' | {{ kubectl }} exec -i {{ _broker.stdout }} -c kafka -- \
          /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic {{ topic }} \
          --producer-property acks=all > /dev/null
        echo created
      args:
        executable: /bin/bash
      register: _seeded
      changed_when: "'created' in _seeded.stdout"
      when: mode == 'seed'

    - name: The topic holds exactly the seeded messages, from the start
      ansible.builtin.shell: |
        set -euo pipefail
        out=$(mktemp); trap 'rm -f "$out"' EXIT
        {{ kubectl }} exec {{ _broker.stdout }} -c kafka -- /opt/kafka/bin/kafka-console-consumer.sh \
          --bootstrap-server localhost:9092 --topic {{ topic }} --from-beginning \
          --max-messages {{ messages }} --timeout-ms 60000 2> /dev/null > "$out" || true
        echo "$(wc -l < "$out") $(md5sum < "$out" | cut -d' ' -f1)"
      args:
        executable: /bin/bash
      register: _read
      changed_when: false
      retries: 5
      delay: 15
      until: _read.stdout == messages ~ ' ' ~ expected_md5
      failed_when: _read.stdout != messages ~ ' ' ~ expected_md5

    - name: Kafka data intact
      ansible.builtin.debug:
        msg: "KAFKA DATA OK: {{ topic }} {{ messages }} messages, md5 {{ expected_md5 }}, operator {{ _strimzi.stdout.split(':')[-1] }}"

- name: ScyllaDB data that must survive the upgrade
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    scylla_namespace: schnappy-production
    scylla_cluster: schnappy-production-scylla
    rows: 1000
    # md5 of "k|v-k" for k = 1..N, sorted by k, newline-separated with a trailing newline - what the read prints
    expected_md5: "{{ (range(1, rows + 1) | map('regex_replace', '^(.*)$', '\\1|v-\\1') | join('\n') ~ '\n') | hash('md5') }}"
    kubectl: "kubectl --kubeconfig {{ kubeconfig }} -n {{ scylla_namespace }}"
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: The operator has finished - every rack updated, ready, at the version asked for; Available, not Progressing
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kubectl }} get scyllaclusters.scylla.scylladb.com {{ scylla_cluster }} -o json | python3 -c '
        import json, sys
        c = json.load(sys.stdin)
        s, want = c.get("status", {}), c["spec"]["version"]
        conds = {x["type"]: x["status"] for x in s.get("conditions", [])}
        racks = s.get("racks", {}).values()
        ok = (s.get("observedGeneration") == c["metadata"]["generation"]
              and conds.get("Available") == "True" and conds.get("Progressing") == "False"
              and racks and all(r.get("version") == want and r.get("updatedMembers") == r.get("members") == r.get("readyMembers")
                                for r in racks))
        print(ok, want)'
      args:
        executable: /bin/bash
      register: _scylla
      changed_when: false
      retries: 60
      delay: 15
      until: _scylla.rc == 0 and _scylla.stdout.startswith('True ')

    - name: A ScyllaDB pod
      ansible.builtin.command: "{{ kubectl }} get pods -l scylla/cluster={{ scylla_cluster }} -o jsonpath={.items[0].metadata.name}"
      register: _node
      changed_when: false
      failed_when: _node.stdout | length == 0

    - name: Seed - the keyspace, the table and its rows (only rows that are missing)
      ansible.builtin.shell: |
        set -euo pipefail
        {
          echo "CREATE KEYSPACE IF NOT EXISTS upgrade_check WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1};"
          echo "CREATE TABLE IF NOT EXISTS upgrade_check.canary (k int PRIMARY KEY, v text);"
          for k in $(seq 1 {{ rows }}); do echo "INSERT INTO upgrade_check.canary (k, v) VALUES ($k, 'v-$k');"; done
        } | {{ kubectl }} exec -i {{ _node.stdout }} -c scylla -- cqlsh > /dev/null
      args:
        executable: /bin/bash
      changed_when: true
      when: mode == 'seed'

    - name: The table holds exactly the seeded rows
      ansible.builtin.shell: |
        set -euo pipefail
        out=$(mktemp); trap 'rm -f "$out"' EXIT
        {{ kubectl }} exec {{ _node.stdout }} -c scylla -- cqlsh -e "PAGING OFF; SELECT k, v FROM upgrade_check.canary;" \
          | awk -F'|' 'NF == 2 && $1 ~ /^ *[0-9]+ *$/ {gsub(/ /, "", $1); gsub(/^ +| +$/, "", $2); print $1 "|" $2}' \
          | sort -n > "$out" || true
        echo "$(wc -l < "$out") $(md5sum < "$out" | cut -d' ' -f1)"
      args:
        executable: /bin/bash
      register: _read
      changed_when: false
      retries: 5
      delay: 15
      until: _read.stdout == rows ~ ' ' ~ expected_md5
      failed_when: _read.stdout != rows ~ ' ' ~ expected_md5

    - name: ScyllaDB data intact
      ansible.builtin.debug:
        msg: "SCYLLA DATA OK: upgrade_check.canary {{ rows }} rows, md5 {{ expected_md5 }}, ScyllaDB {{ _scylla.stdout.split()[1] }}"
