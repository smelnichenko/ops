# Vagrant only (upgrade test): memory REQUESTS shrunk so production fits the 20 GB VM (ten's pods use ~30 GB;
# operator 2026-10-02). Requests only decide scheduling - limits, and so the JVMs' sizing, stay production's.
app:
  resources:
    requests: { memory: 1Gi }        # ten: 3Gi
chatService:
  resources:
    requests: { memory: 768Mi }      # ten: 1536Mi
chessService:
  resources:
    requests: { memory: 768Mi }      # ten: 1536Mi

# The nightly Hyperfoil load test's image is a floating git.pmon.dev/schnappy/hyperfoil:latest, which the kubelet
# pulls on every run (pull policy Always) from production's registry - unreachable here by design. Its 03:00 pod sat
# in ImagePullBackOff holding 550m CPU (2026-10-03). Plan 100 defect 15.
hyperfoil:
  enabled: false
