---
# Monitoring still works after an upgrade step: Prometheus reconciled by its operator and available, every scrape
# target up (bar the ones that cannot be up in a VM, listed below with the reason), Mimir holding samples Prometheus
# remote-wrote less than two minutes ago, and container logs reaching ClickHouse (Fluent Bit, ClickHouse steps).
#
# Why: an operator or Prometheus upgrade, or a CNI/runtime one, can leave every pod ready while
# targets go down or remote write stops - the alerts that would say so run on this very Prometheus.
#
# Targets that vanish are not "down": a ServiceMonitor whose selector stops matching drops its targets, and the rest
# stay up. So the scrape pools and their target counts are kept in .upgrade/scrape-pools.json - recorded on a green
# copy (-e record_scrape_pools=true, the build's Argo stage), then after each step no pool may be gone or smaller, and
# the file takes the counts that passed (a new pool is fine).
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/upgrade/metrics-check.yml
#        [-e record_scrape_pools=true]
- name: Prometheus scrapes everything and writes to Mimir
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    proxy: /api/v1/namespaces/schnappy-infra/services
    record_scrape_pools: false
    scrape_pools_file: "{{ playbook_dir }}/../../../.upgrade/scrape-pools.json"
    # scrape pools that are down in the Vagrant copy by nature
    allowed_down:
      # setup-host-hardening.yml sets the exporter up only where a disk reports SMART (ten's NVMe); the VM's virtio
      # disk does not, so 192.168.56.10:9633 has nothing listening
      - scrapeConfig/schnappy-infra/schnappy-smartctl-exporter
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Prometheus is reconciled by the operator and available
      # shell, quoted: the command module's word splitting strips the quotes inside the jsonpath filter
      ansible.builtin.shell: >-
        kubectl --kubeconfig {{ kubeconfig }} -n schnappy-infra get prometheus schnappy-prometheus
        -o jsonpath='{.status.conditions[?(@.type=="Reconciled")].status}/{.status.conditions[?(@.type=="Available")].status}'
      register: _prom
      changed_when: false
      retries: 20
      delay: 15
      until: _prom.stdout == 'True/True'

    # up now, and up through the last 3 minutes (min_over_time of `up`): one lucky poll does not pass a target that
    # flaps without restarting (scrape timeouts, an intermittent 503 through the mesh)
    - name: Every scrape target is up, and stayed up for 3 minutes
      ansible.builtin.shell: |
        set -euo pipefail
        P='{{ proxy }}/schnappy-prometheus:9090/proxy/api/v1'
        d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
        kubectl --kubeconfig {{ kubeconfig }} get --raw "$P/targets?state=active" > "$d/targets"
        kubectl --kubeconfig {{ kubeconfig }} get --raw "$P/query?query=min_over_time(up%5B3m%5D)%20%3C%201" > "$d/flapped"
        ALLOWED='{{ allowed_down | to_json }}' python3 - "$d" <<'PY'
        import json, os, sys
        d = sys.argv[1]
        targets = json.load(open(d + "/targets"))["data"]["activeTargets"]
        allowed = set(json.loads(os.environ["ALLOWED"]))
        allowed_jobs = {t["labels"].get("job") for t in targets if t["scrapePool"] in allowed}
        down = ["%s %s: %s" % (t["scrapePool"], t["scrapeUrl"], t["lastError"][:100]) for t in targets
                if t["health"] != "up" and t["scrapePool"] not in allowed]
        flapped = ["%s %s" % (r["metric"].get("job"), r["metric"].get("instance"))
                   for r in json.load(open(d + "/flapped"))["data"]["result"] if r["metric"].get("job") not in allowed_jobs]
        print("%d targets, %d down, %d down at some time in the last 3 minutes" % (len(targets), len(down), len(flapped)))
        for x in down:
            print("  DOWN", x)
        for x in flapped:
            print("  WAS DOWN", x)
        sys.exit(1 if down or flapped or not targets else 0)
        PY
      args:
        executable: /bin/bash
      register: _targets
      changed_when: false
      retries: 20
      delay: 15
      until: _targets.rc == 0

    - name: The recorded scrape pools (taken on a green copy - -e record_scrape_pools=true)
      ansible.builtin.stat:
        path: "{{ scrape_pools_file }}"
      delegate_to: localhost
      become: false
      register: _pools_file

    - name: A record to compare with
      ansible.builtin.assert:
        that: record_scrape_pools | bool or _pools_file.stat.exists
        fail_msg: "no {{ scrape_pools_file }}: record it on a green copy with -e record_scrape_pools=true"
        quiet: true

    - name: No scrape pool gone or smaller than recorded (a selector that stops matching drops targets unseen)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig {{ kubeconfig }} get --raw '{{ proxy }}/schnappy-prometheus:9090/proxy/api/v1/targets?state=active' \
            | python3 -c '
          import collections, json, os, sys
          now = collections.Counter(t["scrapePool"] for t in json.load(sys.stdin)["data"]["activeTargets"])
          before = json.loads(os.environ["BEFORE"])
          lost = ["%s: %d -> %d" % (p, n, now.get(p, 0)) for p, n in sorted(before.items()) if now.get(p, 0) < n]
          for l in lost:
              print("  GONE OR SMALLER", l)
          print(json.dumps(dict(sorted(now.items()))))
          sys.exit(1 if lost or not now else 0)'
      environment:
        BEFORE: "{{ lookup('ansible.builtin.file', scrape_pools_file) if _pools_file.stat.exists and not record_scrape_pools | bool else '{}' }}"
      register: _pools
      changed_when: false
      retries: 12
      delay: 15
      until: _pools.rc == 0

    - name: The pools that passed become the record
      ansible.builtin.copy:
        content: "{{ _pools.stdout_lines[-1] | from_json | to_nice_json }}\n"
        dest: "{{ scrape_pools_file }}"
        mode: '0644'
      delegate_to: localhost
      become: false

    - name: Mimir holds samples remote-written in the last two minutes
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl --kubeconfig {{ kubeconfig }} get --raw \
          '{{ proxy }}/schnappy-mimir:9009/proxy/prometheus/api/v1/query?query=max(timestamp(up))' \
          | python3 -c '
        import json, sys, time
        r = json.load(sys.stdin)["data"]["result"]
        age = time.time() - float(r[0]["value"][1]) if r else None
        print("newest sample", "none" if age is None else "%.0f s old" % age)
        sys.exit(0 if age is not None and age < 120 else 1)'
      args:
        executable: /bin/bash
      register: _mimir
      changed_when: false
      retries: 8
      delay: 15
      until: _mimir.rc == 0

    - name: Container logs reach ClickHouse (Fluent Bit -> logs.podlogs, rows of the last two minutes)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          K="kubectl --kubeconfig {{ kubeconfig }} -n schnappy-infra"
          p=$($K get pods -l app.kubernetes.io/component=clickhouse -o jsonpath='{.items[0].metadata.name}')
          # as schnappy, the one user ClickHouse is meant to have (the image's `default` goes with the ClickHouse 25.8 step)
          $K exec "$p" -c clickhouse -- sh -c 'clickhouse-client --user schnappy --password "$CLICKHOUSE_PASSWORD" -q "$1"' _ \
            "SELECT count() FROM logs.podlogs WHERE timestamp > now() - 120{{ logs_filter }}"
      vars:
        logs_filter: ""
      register: _logs
      changed_when: false
      retries: 8
      delay: 15
      until: _logs.rc == 0 and (_logs.stdout | int) > 0

    - name: Monitoring works
      ansible.builtin.debug:
        msg: >-
          METRICS OK: {{ _targets.stdout_lines[0] }} (allowed down: {{ allowed_down | length }}), Mimir {{ _mimir.stdout }},
          {{ _logs.stdout }} log rows in the last 2 min
