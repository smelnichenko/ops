---
# Keycloak's way back, rehearsed on the copy with production's tasks (deploy/ansible/playbooks/tasks/keycloak-dump.yml
# and tasks/keycloak-restore.yml - what upgrade-keycloak.yml and restore-keycloak.yml run on production; plan 122): a
# marker row of this run written into a table of its own in the keycloak database, the dump taken, a second marker
# written after it, then the database restored from that dump and the dump's Keycloak version put back. The first
# marker must be there, the second gone, and Keycloak must run and serve that version on both Pis. The copy's own version
# stands for "the old one" (the steps are the same at any version: the dump's database and its version's install).
#
# Only when this passes may the keycloak store's `missing` clear (scripts/upgrade-stores.json - the one-way rule: the
# way back rehearsed first). Logins on the copy are down while it runs: run it on a readied copy, alone.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/keycloak-way-back-check.yml
- name: Vagrant VMs only
  ansible.builtin.import_playbook: ../vagrant-only-play.yml

- name: Keycloak's way back, rehearsed
  hosts: pis
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../../../deploy/ansible/vars/keycloak.yml
  vars:
    keycloak_dump_password: "{{ postgres_admin_password }}"
    keycloak_db_user: keycloak
    dump_dir: /var/backups/keycloak
    vip: "{{ keepalived_vip }}"
    marker: "way-back-{{ lookup('ansible.builtin.pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    marker_sql: >-
      CREATE TABLE IF NOT EXISTS keycloak_way_back_marker (name text PRIMARY KEY, phase text NOT NULL);
  tasks:
    - name: The Pi that starts first (it holds the VIP)
      ansible.builtin.command:
        argv: [ip, -o, -4, addr, show, to, "{{ vip }}/32"]
      register: _addrs
      changed_when: false

    - name: The first Pi
      ansible.builtin.set_fact:
        _first: >-
          {{ (ansible_play_hosts | map('extract', hostvars) | selectattr('_addrs.stdout', '!=', '')
              | map(attribute='inventory_hostname') | list + ansible_play_hosts) | first }}
      run_once: true

    - name: The marker from before the dump
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          read -r PGPASSWORD; export PGPASSWORD
          psql -w -h 127.0.0.1 -p 5000 -U postgres -d keycloak -v ON_ERROR_STOP=1 \
            -c "{{ marker_sql }} INSERT INTO keycloak_way_back_marker VALUES ('{{ marker }}-before', 'before')"
        stdin: "{{ keycloak_dump_password }}"
      changed_when: true
      delegate_to: "{{ _first }}"
      run_once: true
      no_log: true

    - name: The dump, as upgrade-keycloak.yml takes it
      ansible.builtin.include_tasks: ../../../deploy/ansible/playbooks/tasks/keycloak-dump.yml
      vars:
        keycloak_dump_running: "{{ keycloak_version }}"

    - name: The marker from after the dump (the restore must lose it)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          read -r PGPASSWORD; export PGPASSWORD
          psql -w -h 127.0.0.1 -p 5000 -U postgres -d keycloak -v ON_ERROR_STOP=1 \
            -c "INSERT INTO keycloak_way_back_marker VALUES ('{{ marker }}-after', 'after')"
        stdin: "{{ keycloak_dump_password }}"
      changed_when: true
      delegate_to: "{{ _first }}"
      run_once: true
      no_log: true

    - name: The way back, as restore-keycloak.yml runs it
      ansible.builtin.include_tasks: ../../../deploy/ansible/playbooks/tasks/keycloak-restore.yml
      vars:
        keycloak_restore_dump: "{{ _dump.stdout.split() | first }}"
        keycloak_restore_host: "{{ _first }}"
        keycloak_restore_version: "{{ keycloak_version }}"

    - name: The markers after the restore
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          read -r PGPASSWORD; export PGPASSWORD
          psql -w -h 127.0.0.1 -p 5000 -U postgres -d keycloak -tA -v ON_ERROR_STOP=1 \
            -c "SELECT phase FROM keycloak_way_back_marker WHERE name LIKE '{{ marker }}-%' ORDER BY phase"
        stdin: "{{ keycloak_dump_password }}"
      register: _markers
      changed_when: false
      delegate_to: "{{ _first }}"
      run_once: true
      no_log: true

    - name: The marker from before there, the one from after gone
      ansible.builtin.assert:
        that: _markers.stdout_lines == ['before']
        fail_msg: "KEYCLOAK WAY BACK FAILED: markers after the restore {{ _markers.stdout_lines }} (want ['before'])"
        success_msg: "KEYCLOAK WAY BACK OK: {{ _dump.stdout }} restored - the marker from before there, the one from after gone; Keycloak {{ keycloak_version }} serving on {{ ansible_play_hosts | join(', ') }}"
      run_once: true

    - name: The marker table gone again (the copy's database as the build left it)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          read -r PGPASSWORD; export PGPASSWORD
          psql -w -h 127.0.0.1 -p 5000 -U postgres -d keycloak -v ON_ERROR_STOP=1 -c "DROP TABLE keycloak_way_back_marker"
        stdin: "{{ keycloak_dump_password }}"
      changed_when: true
      delegate_to: "{{ _first }}"
      run_once: true
      no_log: true
