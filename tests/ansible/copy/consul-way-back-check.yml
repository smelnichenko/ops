---
# Consul's way back, rehearsed on the copy with production's playbooks - task test:copy:consul-way-back [MODE=snapshot]
# runs, in turn: this playbook's `before` (the three servers on setup-consul.yml's pin, healthy; a KV marker written);
# upgrade-consul.yml to a newer version (the Consul unit's target - its snapshot taken on pi1, the old binary kept, every
# server moved); `after` (a second marker on the new version; a Patroni switchover, so the snapshot's leader key names the
# Pi that is no longer the primary - the key restore-consul.yml must delete; the primary and its timeline noted; the
# restore's confirmation); restore-consul.yml from the running cluster's KV (MODE current, the default) or that snapshot;
# `verify` (the pin on all three, three voters and a leader; the first marker there with its value, the second there too
# for the current KV and gone for the snapshot; the primary and its timeline as noted - no failover, no promotion; Patroni
# healthy, not paused, no marker left, the database writable through each Pi's HAProxy; Vault unsealed, one active; the
# tier-0 backup and restore-check timers back; External Secrets reading Vault through the VIP - its store Ready, an
# ExternalSecret force-synced after the way back); `cleanup` always (both markers deleted). The marker's name is the
# task's, one per run. Only when both modes pass may the consul store's `missing` clear (scripts/upgrade-stores.json -
# the one-way rule: the way back rehearsed first).
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/consul-way-back-check.yml
#          -e phase=before|after|verify|cleanup -e marker=<name> [-e mode=current|snapshot] [-e consul_to=<version>]
# (a phase var, not tags: --tags would skip the untagged Vagrant guard play)
- name: Vagrant VMs only
  ansible.builtin.import_playbook: ../vagrant-only-play.yml

- name: Consul's way back, rehearsed
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    _setup: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../../deploy/ansible/playbooks/setup-consul.yml') | from_yaml)[0].vars }}"
    consul_version: "{{ _setup.consul_version }}"
    consul_http: http://127.0.0.1:8500
    upgrade_dir: /var/backups/consul-upgrade
    patronictl: patronictl -c /etc/patroni/patroni.yml
    pg_noted: "{{ playbook_dir }}/../../../.copy/consul-way-back-primary"
  tasks:
    - name: A phase and a marker name given (one per run - the task's)
      ansible.builtin.assert:
        that:
          - phase | default('') in ['before', 'after', 'verify', 'cleanup']
          - marker | default('') is match('^way-back-[0-9TZ]+$')
          - mode | default('current') in ['current', 'snapshot']
        fail_msg: "-e phase=before|after|verify|cleanup -e marker=way-back-<UTC time> [-e mode=current|snapshot] - the task gives them"
        quiet: true
      run_once: true

    - name: Before - a newer version to go to (the unit's target)
      ansible.builtin.assert:
        that: (consul_to | default('') | length > 0) and consul_to is version(consul_version, '>')
        fail_msg: "-e consul_to=<a version newer than the pin {{ consul_version }}> - the Consul unit's target"
        quiet: true
      run_once: true
      when: phase == 'before'

    - name: Before and verify - each agent on the pin
      ansible.builtin.uri:
        url: "{{ consul_http }}/v1/agent/self"
        return_content: true
      register: _self
      retries: 12
      delay: 5
      until: _self.status == 200 and _self.json.Config.Version == consul_version
      when: phase in ['before', 'verify']

    - name: Before and verify - three voters, one leader, autopilot healthy
      ansible.builtin.uri:
        url: "{{ consul_http }}/v1/operator/autopilot/health"
        return_content: true
        status_code: [200, 429]
      register: _autopilot
      retries: 12
      delay: 5
      until: >-
        _autopilot.status == 200 and _autopilot.json.Healthy
        and _autopilot.json.Servers | selectattr('Voter') | list | length == 3
        and _autopilot.json.Servers | selectattr('Leader') | list | length == 1
      delegate_to: pi1
      run_once: true
      when: phase in ['before', 'verify']

    - name: Before - the marker from before the upgrade
      ansible.builtin.command:
        argv: [consul, kv, put, "way-back/{{ marker }}-before", before]
      changed_when: true
      delegate_to: pi1
      run_once: true
      when: phase == 'before'

    - name: After - the marker from after the upgrade (the restore must lose it)
      ansible.builtin.command:
        argv: [consul, kv, put, "way-back/{{ marker }}-after", after]
      changed_when: true
      delegate_to: pi1
      run_once: true
      when: phase == 'after'

    # the snapshot's leader key then names the Pi that is no longer the primary: the key restore-consul.yml deletes
    - name: After - a switchover to the replica
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          m=$({{ patronictl }} list -f json)
          leader=$(python3 -c 'import json, sys; print(next(x["Member"] for x in json.load(sys.stdin) if x["Role"] == "Leader"))' <<< "$m")
          replica=$(python3 -c 'import json, sys; print(next(x["Member"] for x in json.load(sys.stdin) if x["Role"] != "Leader"))' <<< "$m")
          {{ patronictl }} switchover --leader "$leader" --candidate "$replica" --force > /dev/null
          echo "$replica"
      register: _switched
      changed_when: true
      delegate_to: pi1
      run_once: true
      when: phase == 'after'

    - name: After - the new primary serving, the old one streaming from it
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          {{ patronictl }} list -f json | python3 -c 'import json, sys
          m = json.load(sys.stdin)
          lead = [x["Member"] for x in m if x["Role"] == "Leader" and x["State"] == "running"]
          ok = lead == [sys.argv[1]] and all(x["State"] == "streaming" for x in m if x["Role"] != "Leader")
          sys.exit(0 if ok else 1)' "{{ _switched.stdout | trim }}"
      register: _settled
      retries: 24
      delay: 5
      until: _settled.rc == 0
      changed_when: false
      delegate_to: pi1
      run_once: true
      when: phase == 'after'

    # the primary and its timeline before the way back: verify wants both unchanged (a promotion moves the timeline)
    - name: After - the primary and its timeline noted
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          # a checkpoint first: right after a promotion the control file's timeline lags until its end-of-recovery
          # checkpoint completes (a standby's is a restartpoint)
          runuser -u postgres -- psql -w -h /var/run/postgresql -d postgres -qc checkpoint > /dev/null
          runuser -u postgres -- psql -w -h /var/run/postgresql -d postgres -Atc \
            "select not pg_is_in_recovery(), (select timeline_id from pg_control_checkpoint())"
      register: _pg_before
      changed_when: false
      when: phase == 'after' and inventory_hostname in groups['pis']

    - name: After - noted on the controller
      ansible.builtin.copy:
        content: "{{ groups['pis'] | map('extract', hostvars, ['_pg_before', 'stdout']) | zip(groups['pis'])
                     | selectattr('0', 'match', '^t[|]') | map('reverse') | map('join', ' ') | first }}\n"
        dest: "{{ pg_noted }}"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true
      when: phase == 'after'

    - name: After - the newest snapshot on pi1 (the upgrade's)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          shopt -s nullglob
          snaps=({{ upgrade_dir }}/consul-*.snap)
          [ -n "${snaps[0]-}" ] || { echo "no snapshot in {{ upgrade_dir }}" >&2; exit 1; }
          printf '%s\n' "${snaps[@]}" | LC_ALL=C sort | tail -n 1
      register: _newest
      changed_when: false
      delegate_to: pi1
      run_once: true
      when: phase == 'after' and mode | default('current') == 'snapshot'

    - name: After - the restore's confirmation (.copy/consul-way-back-confirm - the pin's name, or the snapshot's)
      ansible.builtin.copy:
        content: "{{ ('consul-' ~ consul_version) if mode | default('current') == 'current' else (_newest.stdout | basename) }}\n"
        dest: "{{ playbook_dir }}/../../../.copy/consul-way-back-confirm"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true
      when: phase == 'after'

    - name: Verify - the markers after the restore
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          consul kv get -keys "way-back/{{ marker }}-" | LC_ALL=C sort
      register: _markers
      changed_when: false
      delegate_to: pi1
      run_once: true
      when: phase == 'verify'

    - name: Verify - the value of the one from before
      ansible.builtin.command:
        argv: [consul, kv, get, "way-back/{{ marker }}-before"]
      register: _value
      changed_when: false
      failed_when: false
      delegate_to: pi1
      run_once: true
      when: phase == 'verify'

    - name: Verify - the marker from before there with its value, the one from after gone
      ansible.builtin.assert:
        that:
          - _markers.stdout_lines == _want
          - _value.stdout | default('') | trim == 'before'
        fail_msg: >-
          CONSUL WAY BACK FAILED ({{ mode | default('current') }}): markers after it {{ _markers.stdout_lines }} (want
          {{ _want }}), the first one's value '{{ _value.stdout | default('') | trim }}' (want 'before')
        success_msg: >-
          CONSUL WAY BACK OK ({{ mode | default('current') }}): upgraded, then back - the marker from before there, the one
          from after {{ 'there too' if mode | default('current') == 'current' else 'gone' }}; Consul {{ consul_version }} on
          {{ ansible_play_hosts | join(', ') }}, three voters, one leader
      vars:
        _want: >-
          {{ ['way-back/' ~ marker ~ '-after', 'way-back/' ~ marker ~ '-before'] if mode | default('current') == 'current'
             else ['way-back/' ~ marker ~ '-before'] }}
      run_once: true
      when: phase == 'verify'

    - name: Verify - Patroni healthy, a leader running and the replica streaming
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          patronictl -c /etc/patroni/patroni.yml list -f json | python3 -c 'import json, sys
          m = json.load(sys.stdin)
          leaders = [x for x in m if x["Role"] == "Leader" and x["State"] == "running"]
          others = [x for x in m if x["Role"] != "Leader"]
          ok = len(leaders) == 1 and others and all(x["State"] == "streaming" for x in others)
          print(("HEALTHY " if ok else "NOT HEALTHY ") + ", ".join("%s %s %s" % (x["Member"], x["Role"], x["State"]) for x in m))
          sys.exit(0 if ok else 1)'
      register: _patroni
      retries: 12
      delay: 5
      until: _patroni.rc == 0
      changed_when: false
      delegate_to: pi1
      run_once: true
      when: phase == 'verify'

    - name: Verify - the primary and its timeline as noted before the way back (no failover, no promotion)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          # a checkpoint first: right after a promotion the control file's timeline lags until its end-of-recovery
          # checkpoint completes (a standby's is a restartpoint)
          runuser -u postgres -- psql -w -h /var/run/postgresql -d postgres -qc checkpoint > /dev/null
          runuser -u postgres -- psql -w -h /var/run/postgresql -d postgres -Atc \
            "select not pg_is_in_recovery(), (select timeline_id from pg_control_checkpoint())"
      register: _pg_after
      changed_when: false
      when: phase == 'verify' and inventory_hostname in groups['pis']

    - name: Verify - the same primary on the same timeline
      ansible.builtin.assert:
        that: _now == lookup('ansible.builtin.file', pg_noted) | trim
        fail_msg: >-
          CONSUL WAY BACK FAILED: the primary and its timeline now '{{ _now }}', before the way back
          '{{ lookup('ansible.builtin.file', pg_noted) | trim }}'
        quiet: true
      vars:
        _now: >-
          {{ groups['pis'] | map('extract', hostvars, ['_pg_after', 'stdout']) | zip(groups['pis'])
             | selectattr('0', 'match', '^t[|]') | map('reverse') | map('join', ' ') | first | default('none') }}
      run_once: true
      when: phase == 'verify'

    - name: Verify - Patroni not paused (its own check)
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../../../deploy/ansible/playbooks/scripts/patroni-pause.py check"
        executable: python3
      changed_when: false
      delegate_to: pi1
      run_once: true
      when: phase == 'verify'

    - name: Verify - no pause marker left
      ansible.builtin.command:
        argv: [consul, kv, get, ansible/patroni-paused-by]
      register: _marker_left
      changed_when: false
      failed_when: _marker_left.rc == 0
      delegate_to: pi1
      run_once: true
      when: phase == 'verify'

    - name: Verify - the tier-0 backup and restore-check timers active again where enabled
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          for t in pi-tier0-backup pi-restore-check; do
            [ "$(systemctl is-enabled $t.timer 2> /dev/null)" != enabled ] || [ "$(systemctl is-active $t.timer)" = active ] \
              || { echo "$t.timer enabled, not active"; exit 1; }
          done
      changed_when: false
      when: phase == 'verify' and inventory_hostname in groups['pis']

    # a transaction id is assigned only on a writable primary (a standby refuses it): the database writable, not just up
    - name: Verify - the database writable through each Pi's HAProxy
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          read -r PGPASSWORD; export PGPASSWORD
          psql -w -h 127.0.0.1 -p 5000 -U postgres -d postgres -Atc 'select txid_current()' > /dev/null
        stdin: "{{ postgres_admin_password }}"
      register: _writable
      retries: 12
      delay: 5
      until: _writable.rc == 0
      changed_when: false
      no_log: true  # the password went in on stdin
      when: phase == 'verify' and inventory_hostname in groups['pis']

    - name: Verify - Vault unsealed on both Pis
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        ca_path: /etc/vault.d/tls/ca-cert.pem  # its certificate names 127.0.0.1
        status_code: [200, 429]
      register: _vault
      retries: 12
      delay: 5
      until: _vault.status in [200, 429]
      when: phase == 'verify' and inventory_hostname in groups['pis']

    - name: Verify - exactly one Vault active
      ansible.builtin.assert:
        that: groups['pis'] | map('extract', hostvars, ['_vault', 'status']) | select('equalto', 200) | list | length == 1
        # a string: a list of pairs is no fail_msg (the module refuses it, even when the assertion holds)
        fail_msg: "{{ groups['pis'] | zip(groups['pis'] | map('extract', hostvars, ['_vault', 'status'])) | list | to_json }}"
        quiet: true
      run_once: true
      when: phase == 'verify'

    - name: Cleanup - both markers gone (the copy's Consul as the build left it)
      ansible.builtin.command:
        argv: [consul, kv, delete, -recurse, "way-back/{{ marker }}-"]
      changed_when: true
      delegate_to: pi1
      run_once: true
      when: phase == 'cleanup'

# External Secrets is Vault's consumer in the cluster: through the VIP, Kubernetes auth, Vault's keys on the restored
# Consul - its store Ready, and an ExternalSecret force-synced now refreshed after the restore and Ready
- name: Consul's way back - External Secrets reads Vault on the restored Consul
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubectl: kubectl --kubeconfig /etc/kubernetes/admin.conf
  tasks:
    - name: Verify - the ClusterSecretStore Ready
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, get, clustersecretstore, vault-backend, -o,
               "jsonpath={.status.conditions[?(@.type=='Ready')].status}"]
      register: _store
      changed_when: false
      retries: 12
      delay: 5
      until: _store.stdout == 'True'
      when: phase == 'verify'

    - name: Verify - an ExternalSecret force-synced now
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ
          {{ kubectl }} -n argocd annotate externalsecret vault-cleanup-token force-sync="$(date +%s)" --overwrite > /dev/null
      register: _since
      changed_when: true
      when: phase == 'verify'

    - name: Verify - refreshed after that and Ready
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, -n, argocd, get, externalsecret, vault-cleanup-token, -o,
               "jsonpath={.status.refreshTime} {.status.conditions[?(@.type=='Ready')].status}"]
      register: _synced
      changed_when: false
      retries: 24
      delay: 5
      until: >-
        (_synced.stdout.split() + ['', ''])[0] >= _since.stdout_lines[0]
        and (_synced.stdout.split() + ['', ''])[1] == 'True'
      when: phase == 'verify'
