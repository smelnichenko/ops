---
# The backup on the Pis' volume equals the copy's Forgejo, and restores - read through {{ mirror_pi }} (the Pi holding
# the VIP: the one the sync pushed through). Included by offsite-mirror-check.yml, before and after the VIP moves.
#   - every repository of the organisation is there, none extra
#   - each has Forgejo's branches and tags at the same commits (refs/heads, refs/tags)
#   - its HEAD is Forgejo's default branch, and a plain clone of it checks that branch's commit out, its objects whole
- name: Forgejo's repositories, their default branches and refs - read with the mirror's own token (never on a command line)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      python3 -I - <<'PY'
      import json, os, subprocess, urllib.request
      token = open(os.environ["TOKEN_FILE"]).read().strip()
      repos, page = {}, 1
      while True:
          if page > 20:
              raise SystemExit("over 20 pages of repositories - not all read")
          req = urllib.request.Request(f"{os.environ['API']}?limit=50&page={page}")
          req.add_unredirected_header("Authorization", f"token {token}")
          with urllib.request.urlopen(req, timeout=60) as r:
              batch = json.load(r)
          if not batch:
              break
          for x in batch:
              repos[x["name"]] = {"default": x.get("default_branch") or "main"}
          page += 1
      # the token through git's environment (GIT_CONFIG_*), never its command line
      env = dict(os.environ, GIT_TERMINAL_PROMPT="0", GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.extraHeader",
                 GIT_CONFIG_VALUE_0=f"Authorization: token {token}")
      for name, r in repos.items():
          url = f"{os.environ['BASE']}/{os.environ['ORG']}/{name}.git"
          out = subprocess.run(["git", "ls-remote", "--heads", "--tags", url], env=env, capture_output=True, text=True,
                               check=True).stdout
          # a tag's peeled line (^{}) left out: the backup's refs name the tag object, as ls-remote's own line does
          r["refs"] = {ref: sha for sha, ref in (l.split("\t") for l in out.splitlines() if l)
                       if not ref.endswith("^{}")}
      print(json.dumps(repos, sort_keys=True))
      PY
  environment:
    TOKEN_FILE: "{{ token_file }}"
    API: "{{ base }}/api/v1/orgs/{{ org }}/repos"
    BASE: "{{ base }}"
    ORG: "{{ org }}"
  become: true
  become_user: "{{ mirror_user }}"
  register: _forgejo_side
  changed_when: false

- name: The backup on the Pis' volume - each repository's refs and HEAD, and a plain clone of each (read through {{ mirror_pi }})
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      timeout 60 mountpoint -q "$PIDIR"
      python3 -I - <<'PY'
      import glob, json, os, subprocess, tempfile
      pidir = os.environ["PIDIR"]
      git = ["git", "-c", "safe.directory=*"]  # the repositories are the mirror user's; this reads them as root
      out = {}
      for d in sorted(glob.glob(os.path.join(pidir, "*.git"))):
          name = os.path.basename(d)[:-4]
          refs = subprocess.run(git + ["-C", d, "for-each-ref", "--format=%(refname) %(objectname)", "refs/heads", "refs/tags"],
                                capture_output=True, text=True, check=True).stdout
          head = subprocess.run(git + ["-C", d, "symbolic-ref", "HEAD"], capture_output=True, text=True,
                                check=True).stdout.strip()
          # the restore: a plain clone, as one would make from the backup
          with tempfile.TemporaryDirectory(dir="/var/tmp") as t:
              subprocess.run(git + ["clone", "-q", d, os.path.join(t, "r")], check=True, capture_output=True)
              checked = subprocess.run(git + ["-C", os.path.join(t, "r"), "rev-parse", "HEAD"], capture_output=True,
                                       text=True).stdout.strip()
              fsck = subprocess.run(git + ["-C", os.path.join(t, "r"), "fsck", "--no-progress", "--connectivity-only"],
                                    capture_output=True, text=True).returncode
          out[name] = {"refs": dict(l.split(" ", 1) for l in refs.splitlines() if l), "head": head,
                       "restored": checked, "fsck": fsck}
      ls = os.path.join(pidir, "last-success")
      print(json.dumps({"repos": out, "last_success": open(ls).read().strip() if os.path.exists(ls) else ""},
                       sort_keys=True))
      PY
  environment:
    PIDIR: "{{ pidir }}"
  delegate_to: "{{ mirror_pi }}"
  become: true
  register: _backup_side
  changed_when: false

- name: Every repository of the organisation backed up, none extra
  vars:
    fj: "{{ _forgejo_side.stdout | from_json }}"
    bk: "{{ (_backup_side.stdout | from_json).repos }}"
  ansible.builtin.assert:
    that:
      - fj | length > 0
      - fj.keys() | sort | list == bk.keys() | sort | list
    fail_msg: "Forgejo's {{ fj.keys() | sort | list }}, the backup's (through {{ mirror_pi }}) {{ bk.keys() | sort | list }}"
    quiet: true

- name: Each backup - Forgejo's branches and tags at their commits, its HEAD Forgejo's default, a clone of it that branch's commit, whole
  vars:
    fj: "{{ _forgejo_side.stdout | from_json }}"
    bk: "{{ (_backup_side.stdout | from_json).repos }}"
  ansible.builtin.assert:
    that:
      - bk[item].refs == fj[item].refs
      - bk[item].head == 'refs/heads/' ~ fj[item].default
      - bk[item].restored == fj[item].refs['refs/heads/' ~ fj[item].default] | default('none')
      - bk[item].fsck == 0
    fail_msg: >-
      {{ item }} through {{ mirror_pi }}: refs equal {{ bk[item].refs == fj[item].refs }}
      ({{ (fj[item].refs.keys() | list) | symmetric_difference(bk[item].refs.keys() | list) | join(', ') or 'same names' }});
      HEAD {{ bk[item].head }} (Forgejo's default {{ fj[item].default }}); a clone checked out {{ bk[item].restored or 'nothing' }};
      fsck {{ bk[item].fsck }}
    quiet: true
  loop: "{{ (_forgejo_side.stdout | from_json).keys() | sort | list }}"
