---
# The offsite git mirror on the Vagrant copy (task test:copy:check runs it; test:copy:argo installs it with production's
# own playbook, setup-velero.yml, as deploy:velero does on ten). Its daily job had failed unnoticed for months in
# production - this proves, each run:
#   1. the unit as systemd loaded it (systemd ignores a directive it does not know): no start limit, its retries
#      backing off; the target's systemd as the unit relies on it (a transient unit); a sync now - production's own
#      tasks/offsite-mirror-run.yml (a run going waited out, systemctl start) - ends clean; its result this run's
#   2. the backup holds what the copy's Forgejo has - every repository (a private fixture among them: the reader's team
#      grant, which the copy's public repositories alone never needed), every branch and tag at its commit, HEAD the
#      default branch - and restores: a plain clone of each checks that branch's commit out, its objects whole
#      (tasks/offsite-mirror-equal.yml; Forgejo read with the copy's admin credentials, never the mirror's own reading)
#   3. it KEEPS what it held: Forgejo deletes the fixture's branch and force-pushes its main, the VIP moves to the other
#      Pi (the mirror's key on both - it was on pi1 alone), a sync through it: the deleted branch still in the backup
#      at its commit, main the new one, the replaced commit in its reflog; keepalived on every Pi again however the
#      play ends, one Pi holding the VIP, Forgejo answering
#   4. it is watched: last-success on the volume is this run's, node_exporter serves its time and count, and Prometheus
#      evaluates the OffsiteGitMirrorMissing rule (healthy, after this sync) with its series and the alert not firing
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/offsite-mirror-check.yml
- name: Vagrant VMs only
  ansible.builtin.import_playbook: ../vagrant-only-play.yml

- name: The offsite git mirror backs every repository up, keeps what it held, restores, survives a VIP move, and is watched
  hosts: target
  become: true
  gather_facts: false
  vars:
    mirror_user: "{{ offsite_backup_user | default('sm') }}"
    pidir: /mnt/backups/git-mirror
    org: schnappy
    fixture: mirror-fixture
    base: "{{ (forgejo_root_url | default('https://git.pmon.dev/')) | regex_replace('/+$', '') }}"
    kubeconfig: /etc/kubernetes/admin.conf
    proxy: /api/v1/namespaces/schnappy-infra/services
    metrics_url: "http://{{ node_ip_override | default(ansible_host) }}:9100/metrics"
    # the fixture's history written from here, with the copy's admin credentials - read from stdin, handed to git in its
    # environment (never an argv, never a task's environment: under become, sudo's argv)
    _fixture_git: |
      set -euo pipefail
      IFS= read -r ADMIN; IFS= read -r ADMIN_PW
      w=$(mktemp -d /var/tmp/mirror-fixture.XXXXXX)
      trap 'rm -rf "$w"' EXIT
      export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=3
      export GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $(printf '%s:%s' "$ADMIN" "$ADMIN_PW" | base64 -w0)"
      export GIT_CONFIG_KEY_1=user.name GIT_CONFIG_VALUE_1=offsite-mirror-check GIT_CONFIG_KEY_2=user.email GIT_CONFIG_VALUE_2=check@copy
      u="$BASE/$ORG/$FIXTURE.git"
      git clone -q "$u" "$w/r"
      cd "$w/r"
      # a fixture just made is empty: main unborn; else main where Forgejo has it
      if git rev-parse -q --verify origin/main > /dev/null; then git checkout -q -B main origin/main
      else git symbolic-ref HEAD refs/heads/main; fi
      case "$STEP" in
        seed)  git commit -q --allow-empty -m "fixture $(date -u +%s%N)"
               git push -q --force origin main
               git push -q --force origin main:refs/heads/doomed ;;
        change) git commit -q --amend --allow-empty -m "rewritten $(date -u +%s%N)"
               git push -q --force origin main
               git push -q origin :refs/heads/doomed ;;
      esac
      git ls-remote --heads origin | awk '{print $2, $1}'
  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    # a check run cut short before (Ctrl-C, the host guard) can have left keepalived stopped on a Pi: stopping the
    # other's would leave no Pi holding the VIP - refused before anything moves
    - name: Keepalived runs on every Pi before anything moves  # noqa: command-instead-of-module - read, the module would start it
      ansible.builtin.command: systemctl is-active keepalived
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      register: _ka_before
      changed_when: false
      failed_when: _ka_before.stdout != 'active'

    - name: The VIP's holder now
      ansible.builtin.include_tasks: ../../../deploy/ansible/playbooks/tasks/pi-vip-holder.yml

    - name: The holder the sync pushes through first
      ansible.builtin.set_fact:
        first_pi: "{{ pi_vip_holder }}"
        other_pi: "{{ groups['pis'] | reject('equalto', pi_vip_holder) | first }}"

    # ── the fixture: a private repository with a branch to lose ──────────
    - name: The fixture repository, private, in the copy's organisation (made where none)
      ansible.builtin.uri:
        follow_redirects: none
        url: "{{ base }}/api/v1/orgs/{{ org }}/repos"
        method: POST
        url_username: "{{ forgejo_admin_user }}"
        url_password: "{{ forgejo_admin_password }}"
        force_basic_auth: true
        body_format: json
        body: {name: "{{ fixture }}", private: true, default_branch: main}
        status_code: [201, 409]  # there already: kept
      register: _fixture_made
      changed_when: _fixture_made.status == 201

    - name: The fixture's main and its doomed branch, a new commit each run
      ansible.builtin.shell:
        cmd: "{{ _fixture_git }}"
        executable: /bin/bash
        stdin: &fixture_creds "{{ forgejo_admin_user }}\n{{ forgejo_admin_password }}"
      no_log: true  # its stdin, the admin's password
      environment:
        BASE: "{{ base }}"
        ORG: "{{ org }}"
        FIXTURE: "{{ fixture }}"
        STEP: seed
      register: _fixture_seeded
      changed_when: true

    # ── 1. the unit as systemd loaded it, its systemd, a sync now ────────
    # systemd ignores a directive it does not know (a warning in its journal, nothing else): what it loaded, read back
    - name: The mirror's unit as systemd loaded it
      ansible.builtin.systemd_service:
        name: offsite-backup.service
      register: _unit_loaded

    - name: The unit as systemd loaded it - no start limit, a failed run retried, backing off
      ansible.builtin.assert:
        that:
          - _unit_loaded.status.StartLimitIntervalUSec == '0'
          - _unit_loaded.status.Restart == 'on-failure'
          - _unit_loaded.status.RestartUSec == '45min'
          - _unit_loaded.status.RestartSteps == '3'
          - _unit_loaded.status.RestartMaxDelayUSec == '6h'
        fail_msg: >-
          offsite-backup.service as systemd loaded it:
          {{ _unit_loaded.status | dict2items | selectattr('key', 'match', '^(Restart|StartLimit)') | items2dict }}
        quiet: true

    # what the unit relies on, on the target's own systemd (an OS upgrade can change it; a stub cannot show it): a
    # transient unit failing, the unit's directives in seconds - RestartSec=1 backing off to 4 in 2 steps (retries 1,
    # 2, 4 s apart), no start limit; then six starts while a retry is pending, each run at once, none refused
    - name: The target's systemd - a failed run's retries backing off, starts while one is pending run at once
      ansible.builtin.command:
        cmd: python3 -I -
        stdin: |
          import json, os, shutil, subprocess, tempfile, time
          u = f"offsite-mirror-probe-{int(time.time())}.service"
          d = tempfile.mkdtemp(dir="/var/tmp", prefix="offsite-mirror-probe.")
          runs = os.path.join(d, "runs")
          count = lambda: sum(1 for _ in open(runs)) if os.path.exists(runs) else 0
          try:
              subprocess.run(["systemd-run", "--quiet", "--no-block", f"--unit={u}", "-p", "Type=oneshot", "-p", "Restart=on-failure",
                              "-p", "RestartSec=1", "-p", "RestartSteps=2", "-p", "RestartMaxDelaySec=4",
                              "-p", "StartLimitIntervalSec=0", "/bin/sh", "-c", f"date +%s.%N >> {runs}; exit 1"],
                             capture_output=True, text=True, check=True)
              deadline = time.monotonic() + 20
              while count() < 4 and time.monotonic() < deadline:
                  time.sleep(0.1)
              t = [float(x) for x in open(runs)][:4]
              before, starts = count(), []
              for _ in range(6):
                  s = time.monotonic()
                  rc = subprocess.run(["systemctl", "start", u], capture_output=True).returncode
                  starts.append([rc, round(time.monotonic() - s, 2)])
              print(json.dumps({"gaps": [round(b - a, 1) for a, b in zip(t, t[1:])], "starts": starts,
                                "ran": count() - before}))
          finally:
              subprocess.run(["systemctl", "stop", u], capture_output=True)
              subprocess.run(["systemctl", "reset-failed", u], capture_output=True)
              shutil.rmtree(d, ignore_errors=True)
      register: _systemd_probe
      changed_when: false

    - name: Retries backing off; six starts while one was pending, each run at once and failed with its run, none refused
      vars:
        probe: "{{ _systemd_probe.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - probe.gaps | length == 3
          - probe.gaps[0] >= 0.7 and probe.gaps[0] <= 2
          - probe.gaps[1] >= 1.7 and probe.gaps[1] <= 3
          - probe.gaps[2] >= 3.7 and probe.gaps[2] <= 5.5
          - probe.starts | length == 6
          - probe.starts | map('first') | select('equalto', 0) | list | length == 0
          - probe.starts | map('last') | select('ge', 2) | list | length == 0
          - probe.ran >= 6
        fail_msg: "the target's systemd: {{ probe }} - want retries 1, 2, 4 s apart, six starts each failing at once (< 2 s), six runs"
        quiet: true

    # production's own run (deploy:velero's): a run going waited out, this run's start, systemctl start
    - name: A sync now
      ansible.builtin.include_tasks: ../../../deploy/ansible/playbooks/tasks/offsite-mirror-run.yml

    # ── 2. the backup holds what Forgejo has, and restores ───────────────
    - name: The backup holds what Forgejo has, through {{ first_pi }}
      ansible.builtin.include_tasks: tasks/offsite-mirror-equal.yml
      vars:
        mirror_pi: "{{ first_pi }}"

    - name: The fixture's backup before Forgejo changes it
      ansible.builtin.set_fact:
        _fixture_before: "{{ ((_backup_side.stdout | from_json).repos[fixture]).refs }}"

    - name: The first sync's last-success is this run's
      vars:
        last: "{{ (_backup_side.stdout | from_json).last_success }}"
        floor: "{{ '%Y%m%dT%H%M%SZ' | strftime((_mirror_started.stdout.split()[0] | int) - 60, utc=true) }}"
      ansible.builtin.assert:
        that:
          - last is match('^\d{8}T\d{6}Z$')
          - last >= floor
        fail_msg: "last-success on the volume is '{{ last }}' - not this run's (it started {{ _mirror_started.stdout.split()[1] }})"
        quiet: true

    # ── 3. Forgejo deletes and rewrites, the VIP moves - the backup keeps what it held ──
    - name: Forgejo deletes the fixture's doomed branch and force-pushes its main
      ansible.builtin.shell:
        cmd: "{{ _fixture_git }}"
        executable: /bin/bash
        stdin: *fixture_creds
      no_log: true  # its stdin, the admin's password
      environment:
        BASE: "{{ base }}"
        ORG: "{{ org }}"
        FIXTURE: "{{ fixture }}"
        STEP: change
      register: _fixture_changed
      changed_when: true

    - name: The VIP moved to the other Pi, a sync through it, the backup keeping what it held - keepalived back however it ends
      block:
        - name: Keepalived stopped on the first Pi - the VIP goes to the other, {{ other_pi }}
          ansible.builtin.systemd:
            name: keepalived
            state: stopped
          delegate_to: "{{ first_pi }}"

        - name: The other Pi holds the VIP
          ansible.builtin.command: ip -o -4 addr show to {{ keepalived_vip }}/32
          delegate_to: "{{ other_pi }}"
          register: _vip_there
          changed_when: false
          until: (' inet ' ~ keepalived_vip ~ '/') in _vip_there.stdout
          retries: 30
          delay: 2

        - name: Forgejo answers at the VIP again (the other Pi's)
          ansible.builtin.uri:
            url: "{{ base }}/api/healthz"
            status_code: 200
          register: _healthz
          until: _healthz.status == 200
          retries: 30
          delay: 2

        # a run going waited out - it began before the VIP moved, its pushes through the first Pi
        - name: A sync through the other Pi
          ansible.builtin.include_tasks: ../../../deploy/ansible/playbooks/tasks/offsite-mirror-run.yml

        - name: The backup holds what Forgejo has, through {{ other_pi }}
          ansible.builtin.include_tasks: tasks/offsite-mirror-equal.yml
          vars:
            mirror_pi: "{{ other_pi }}"

        - name: The replaced main's reflog on the backup  # noqa: command-instead-of-module - the git module clones, never reads a reflog
          ansible.builtin.command: git -c safe.directory=* -C {{ pidir }}/{{ fixture }}.git reflog show --format=%H refs/heads/main
          delegate_to: "{{ other_pi }}"
          register: _fixture_reflog
          changed_when: false

        - name: The backup kept what Forgejo deleted and rewrote - the doomed branch at its commit, main the new one, the replaced commit in its reflog
          vars:
            kept: "{{ ((_backup_side.stdout | from_json).repos[fixture]).refs }}"
            forgejo_main: "{{ (_forgejo_side.stdout | from_json)[fixture].refs['refs/heads/main'] }}"
          ansible.builtin.assert:
            that:
              - "'refs/heads/doomed' not in (_forgejo_side.stdout | from_json)[fixture].refs"
              - kept['refs/heads/doomed'] | default('gone') == _fixture_before['refs/heads/doomed']
              - kept['refs/heads/main'] == forgejo_main
              - forgejo_main != _fixture_before['refs/heads/main']
              - _fixture_before['refs/heads/main'] in _fixture_reflog.stdout_lines
            fail_msg: >-
              the fixture's backup: doomed {{ kept['refs/heads/doomed'] | default('gone') }} (it was
              {{ _fixture_before['refs/heads/doomed'] }}), main {{ kept['refs/heads/main'] }} (Forgejo's {{ forgejo_main }},
              before {{ _fixture_before['refs/heads/main'] }}), the replaced commit in its reflog
              {{ _fixture_before['refs/heads/main'] in _fixture_reflog.stdout_lines }}
            quiet: true

        - name: Its last-success is this sync's
          vars:
            last: "{{ (_backup_side.stdout | from_json).last_success }}"
            floor: "{{ '%Y%m%dT%H%M%SZ' | strftime((_mirror_started.stdout.split()[0] | int) - 60, utc=true) }}"
          ansible.builtin.assert:
            that:
              - last is match('^\d{8}T\d{6}Z$')
              - last >= floor
            fail_msg: "last-success on the volume is '{{ last }}' - not this sync's (it started {{ _mirror_started.stdout.split()[1] }})"
            quiet: true
      always:
        - name: Keepalived started again on every Pi
          ansible.builtin.systemd:
            name: keepalived
            state: started
          delegate_to: "{{ item }}"
          loop: "{{ groups['pis'] }}"

    # keepalived's own hand-over settles (one priority: the VIP stays where it went; the restarted Pi comes up backup)
    - name: Keepalived runs on every Pi again  # noqa: command-instead-of-module - read, the module would start it
      ansible.builtin.command: systemctl is-active keepalived
      delegate_to: "{{ item }}"
      loop: "{{ groups['pis'] }}"
      register: _ka_after
      changed_when: false
      until: _ka_after.stdout == 'active'
      retries: 15
      delay: 2

    - name: Forgejo answers at the VIP
      ansible.builtin.uri:
        url: "{{ base }}/api/healthz"
        status_code: 200
      register: _healthz_after
      until: _healthz_after.status == 200
      retries: 30
      delay: 2

    - name: One Pi holds the VIP
      ansible.builtin.include_tasks: ../../../deploy/ansible/playbooks/tasks/pi-vip-holder.yml

    # ── 4. watched ───────────────────────────────────────────────────────
    - name: The node_exporter on ten serves the sync's result
      ansible.builtin.uri:
        url: "{{ metrics_url }}"
        return_content: true
      register: _metrics
      check_mode: false

    - name: Its time is this sync's, its count every repository
      vars:
        lines: "{{ _metrics.content.splitlines() | reject('match', '^#') | list }}"
        ts: "{{ lines | select('match', '^offsite_git_mirror_last_success_timestamp_seconds ') | map('split') | map('last') | first | default('0') }}"
        count: "{{ lines | select('match', '^offsite_git_mirror_repositories ') | map('split') | map('last') | first | default('-1') }}"
      ansible.builtin.assert:
        that:
          - ts | float | int >= (_mirror_started.stdout.split()[0] | int) - 60
          - count | float | int == (_forgejo_side.stdout | from_json) | length
        fail_msg: >-
          node_exporter serves offsite_git_mirror_last_success_timestamp_seconds {{ ts }} (this sync started
          {{ _mirror_started.stdout.split()[0] }}) and offsite_git_mirror_repositories {{ count }} (Forgejo has
          {{ (_forgejo_side.stdout | from_json) | length }})
        quiet: true

    # Prometheus scrapes node_exporter every 30-60 s and evaluates the rule each minute: healthy, evaluated after this
    # sync, the series there, the alert not firing (a fresh or broken rule reads "inactive" too - its health and
    # evaluation time read with it)
    - name: Prometheus evaluates the rule after this sync, healthy, with its series - not firing
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          P='{{ proxy }}/schnappy-prometheus:9090/proxy/api/v1'
          t=$(mktemp -d /var/tmp/offsite-mirror-check.XXXXXX)
          trap 'rm -rf "$t"' EXIT
          # files, not the environment: every alert rule's JSON is over the 128 KiB one variable may hold
          kubectl --kubeconfig {{ kubeconfig }} get --raw "$P/rules?type=alert" > "$t/rules"
          kubectl --kubeconfig {{ kubeconfig }} get --raw "$P/query?query=offsite_git_mirror_last_success_timestamp_seconds" > "$t/series"
          python3 -I - "$t/rules" "$t/series" "{{ _mirror_started.stdout.split()[0] }}" <<'PY'
          import datetime, json, re, sys
          rules = json.load(open(sys.argv[1]))["data"]["groups"]
          found = [r for g in rules for r in g["rules"] if r.get("name") == "OffsiteGitMirrorMissing"]
          series = json.load(open(sys.argv[2]))["data"]["result"]
          if not found:
              print("rule 0")
              sys.exit(0)
          r = found[0]
          # RFC 3339 with nanoseconds: its fraction cut to microseconds for Python
          ev = datetime.datetime.fromisoformat(re.sub(r"\.(\d{1,6})\d*", r".\1", r["lastEvaluation"]).replace("Z", "+00:00"))
          after = ev.timestamp() > int(sys.argv[3])
          print(f"rule {len(found)} state {r['state']} health {r['health']} evaluated-after {after} series {len(series)}")
          PY
      register: _prom
      changed_when: false
      until: _prom.stdout == 'rule 1 state inactive health ok evaluated-after True series 1'
      retries: 20
      delay: 15
