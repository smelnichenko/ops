---
# Wait until the Vagrant copy has settled - files/argo-settled.py: every Argo CD Application Synced and Healthy, no
# operation running, its last sync not failed, its sync status computed against its current spec, and every pod ready
# (a node-shutdown leftover excepted), all held for stable_polls polls in a row with no container restarting in
# between. Checked together: right after a restart Argo still shows the health it had before the shutdown, so its apps
# look green while their pods are still starting (2026-10-02: a wait that checked the apps first passed on its first
# try). A failed kubectl call is not green. On timeout it prints every app and pod that is not green, then fails.
#
# One green poll ended the wait, a failed sync passed, restarts were not looked at, and a failed pod query counted as
# every pod ready. stable_polls 4 holds green for 30 s; test:copy:check's first wait takes 1 (the change already
# settled), the build's and a change's deciding waits 2 polls 5 s apart (Taskfile's COPY_SETTLE).
#
# With -e expect_mirror=true (after a mirror push) every app source from the mirrored repos must also be synced to the
# commit the mirror pushed (.copy/mirror-revisions.json): until Argo has fetched it, an app still shows the old
# commit as Synced + Healthy and the wait would pass before the change was even applied. With expect_mirror it first
# asks Argo to refresh every app (argocd.argoproj.io/refresh=normal): otherwise Argo sees the pushed commits only at
# its next 3-minute poll.
#
# With -e allow_out_of_sync=<app>,<app> those apps may be OutOfSync (still Healthy, nothing running, on the pushed
# commit): a change that turns an app's automated sync off on purpose.
#
# With -e record_apps=true (the build, or a change that adds or removes apps) the Applications' names go to
# .copy/argo-apps.txt, printed; with -e expect_apps=true exactly those must exist - a child app gone would otherwise
# settle by its absence. With -e restart_stage=<label> a pod whose containers restarted during this stage and the one
# recorded before it fails it: a crash loop slower than the quiet window settles once between restarts (the history in
# /var/lib/vagrant-copy on the node). Each stage a label of its own (build-, change-, check-<time>): a label used again
# compares with the stage before its first use, and records no new restart - with the same two labels every time no
# crash loop was ever caught.
#
# Usage: ansible-playbook -i inventory/vagrant.yml ../../tests/ansible/copy/argo-settled.yml [-e settle_minutes=40]
#        [-e expect_mirror=true] [-e allow_out_of_sync=<app>] [-e stable_polls=1] [-e restart_quiet=120]
#        [-e record_apps=true | -e expect_apps=true] [-e restart_stage=<label> [-e restarts_expected=true]]
- name: Argo CD settled (all apps Synced + Healthy, all pods ready)
  hosts: target
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/kubernetes/admin.conf
    settle_minutes: 40
    poll_seconds: 10
    stable_polls: 4
    # no container restarted in the last restart_quiet seconds (argo-settled.py's --restart-quiet): 300 is
    # CrashLoopBackOff's longest back-off - a crash loop never settles in its own stage; the copy's deciding waits take
    # 120 (a crash loop slower than that settles once, and the restart history fails it at the next stage)
    restart_quiet: 300
    expect_mirror: false
    allow_out_of_sync: ""
    record_apps: false
    expect_apps: false
    restart_stage: ""
    # this stage restarts the control plane on purpose (an ops playbook: a kubeadm upgrade): its restarts recorded, the
    # next stage judging against them
    restarts_expected: false
    apps_file: "{{ playbook_dir }}/../../../.copy/argo-apps.txt"
    # the CronJobs whose runs fail on the copy by nature (the file says why): their failed runs not waited for
    failing_cronjobs_file: "{{ playbook_dir }}/copy-failing-cronjobs.txt"
    failing_cronjobs: >-
      {{ lookup('ansible.builtin.file', failing_cronjobs_file).splitlines() | map('trim') | reject('match', '^(#|$)')
         | join(',') }}
    restart_history: /var/lib/vagrant-copy/restart-history.json
    mirror_revisions: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../.copy/mirror-revisions.json') | from_json
         if expect_mirror | bool else {} }}

  tasks:
    - name: Vagrant VMs only (fails closed on any other host)
      ansible.builtin.import_tasks: ../vagrant-only.yml

    - name: Argo refreshes every app now, so it sees the pushed commits at once
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ kubeconfig }} -n argocd annotate applications.argoproj.io --all
        argocd.argoproj.io/refresh=normal --overwrite
      when: expect_mirror | bool
      changed_when: true

    - name: The restart history's directory
      ansible.builtin.file:
        path: "{{ restart_history | dirname }}"
        state: directory
        mode: '0700'
      when: restart_stage | length > 0

    # --sync-stalled: an app Argo will not auto-sync again synced once (the copy only - production's settle says it
    # STALLED and stays red for the operator)
    - name: Wait until every app is green and every pod is ready, held for stable_polls polls in a row
      ansible.builtin.script:
        cmd: >-
          files/argo-settled.py --sync-stalled --kubeconfig {{ kubeconfig }} --minutes {{ settle_minutes }}
          --poll {{ poll_seconds }}
          --stable-polls {{ stable_polls }} --restart-quiet {{ restart_quiet }} --allow-out-of-sync '{{ allow_out_of_sync }}'
          {{ '--print-apps' if record_apps | bool else '' }}
          {{ ('--expect-apps ' ~ (lookup('ansible.builtin.file', apps_file).split() | join(','))) if expect_apps | bool else '' }}
          --failing-cronjobs '{{ failing_cronjobs }}'
          {{ ('--restart-history ' ~ restart_history ~ ' --step ' ~ restart_stage) if restart_stage | length > 0 else '' }}
          {{ '--restarts-expected' if restart_stage | length > 0 and restarts_expected | bool else '' }}
        executable: python3
      environment:
        MIRROR_REVISIONS: "{{ mirror_revisions | to_json }}"
      register: _settled
      changed_when: false
      failed_when: false

    - name: Not settled
      ansible.builtin.fail:
        msg: "{{ _settled.stdout_lines[-60:] | join('\n') }}{{ _settled.stderr | default('') }}"
      when: _settled.rc != 0

    # a change that adds or removes apps records them anew (test:copy:change APPS_CHANGED=true): what it added and
    # removed, against the record before it, said
    - name: The Applications against the record before (added, removed)
      ansible.builtin.debug:
        msg: >-
          added: {{ (_now | difference(_before)) | join(', ') or '-' }};
          removed: {{ (_before | difference(_now)) | join(', ') or '-' }}
      vars:
        _now: "{{ (_settled.stdout_lines | select('match', '^APPS ') | last)[5:].split(',') }}"
        _before: "{{ (lookup('ansible.builtin.file', apps_file, errors='ignore') or '').split() }}"
      when: record_apps | bool

    - name: The Applications' names recorded for the later waits
      ansible.builtin.copy:
        content: "{{ (_settled.stdout_lines | select('match', '^APPS ') | last)[5:].split(',') | join('\n') }}\n"
        dest: "{{ apps_file }}"
        mode: '0644'
      delegate_to: localhost
      become: false
      when: record_apps | bool

    - name: Settled
      ansible.builtin.debug:
        msg: "{{ _settled.stdout_lines | select('match', '^ARGO SETTLED') | last }}"
