# The Pis' service versions as production runs them, where the playbooks pin another (they install their own where
# a service is missing): the Vagrant copy installs production's. Written by scripts/production-inventory.sh
# (task test:copy:inventory) from what the Pis run - not edited by hand. amd64 only (the Vagrant VMs). Extra vars,
# after vars/vault.yml. pi_apt_versions: Debian's packages at production's versions
# (tests/ansible/copy/pi-apt-versions.yml moves the copy's to them).
pi_apt_versions:
  postgresql-17: 17.12-0+deb13u1
  pgbouncer: 1.24.1-1+deb13u2
  haproxy: 3.0.11-1+deb13u4
  glusterfs-server: 11.1-6
  keepalived: 1:2.3.3-1
