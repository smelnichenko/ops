---
# Re-running the Pi playbooks on a live Vagrant Pi stack is safe:
#   setup-patroni, Patroni stopped on pi2: refused, naming the reason, and pi2's data untouched (every file's name,
#   size and time as after the stop); Patroni started again (whatever happened) and back to streaming, the same run
#   passes on pi2 and leaves its database port (PgBouncer's) as it was; with PgBouncer stopped it is refused, the
#   port kept.
#   setup-consul with every config's key drifted from the one Consul runs (the old playbook's leftover): the live key
#   written back, each server restarted one at a time and Patroni paused around each - sampled every 0.2 s on each
#   server: no two agents down together, Patroni paused whenever one is down - no failover, resumed; then on the
#   converged cluster: the same key, no server restarted.
#   setup-patroni with its config, then its unit, hand-edited on both Pis: the config reloaded (Patroni's PID kept),
#   the unit restarted one node at a time paused (PIDs new) - Postgres never restarted, roles and timelines unchanged,
#   not paused after.
#   setup-consul on pi2 rebuilt (agent stopped, key blanked) alone: the others' key written; refused while someone else
#   paused Patroni, the pause left; setup-patroni the same; the unit restart one node at a time, the replica first.
#   setup-vault-pi with a restart pending (Vault's record stale): each Vault restarted alone, unsealed, one active; no shares on the controller.
#   setup-keepalived with a drifted router_id that keepalived already runs: rewritten and reloaded - the running
#   router_id back, the PID kept, the VIP where it was.
# Vagrant only (the guard play first). Usage: task test:pi:rerun-guards
- name: Vagrant VMs only
  ansible.builtin.import_playbook: vagrant-only-play.yml

- name: The Patroni re-run guard on pi2
  hosts: pi2
  become: true
  gather_facts: false
  vars:
    ansible_playbook: "{{ ansible_playbook_python | dirname }}/ansible-playbook"
    deploy_dir: "{{ playbook_dir }}/../../deploy/ansible"
    # every file's name, size and modification time (Postgres stopped: nothing of its own changes them)
    fingerprint: |
      set -euo pipefail
      d=$(ls -d /var/lib/postgresql/*/main | head -1)
      [ -f "$d/PG_VERSION" ] && [ -f "$d/patroni.dynamic.json" ]
      echo "$d $(find "$d" -type f ! -name postmaster.pid -printf '%P %s %T@\n' | sort | sha256sum | cut -c1-16) $(find "$d" -type f | wc -l) files"
  tasks:

    - name: The database port Forgejo and Keycloak use on pi2 (PgBouncer's, as on the Pis)
      ansible.builtin.shell: |
        set -o pipefail
        grep '^HOST = ' /var/lib/forgejo/custom/conf/app.ini
        grep -o 'KC_DB_URL=[^ "]*' /etc/systemd/system/keycloak.service
      args:
        executable: /bin/bash
      register: _db_before
      changed_when: false
      failed_when: _db_before.rc != 0 or ':6432' not in _db_before.stdout

    - name: Stopped, re-run, refused - Patroni started again whatever happens
      block:
        - name: Patroni stopped on pi2
          ansible.builtin.systemd:
            name: patroni
            state: stopped

        - name: Pi2's data, stopped
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: "{{ fingerprint }}"
          register: _before
          changed_when: false

        - name: setup-patroni on pi2 while Patroni is stopped - refused
          ansible.builtin.command:
            cmd: "{{ ansible_playbook }} -i inventory/vagrant.yml playbooks/setup-patroni.yml --limit pi2"
            chdir: "{{ deploy_dir }}"
          delegate_to: localhost
          become: false
          register: _refused
          changed_when: false
          failed_when: _refused.rc == 0 or 'REFUSED on pi2' not in _refused.stdout

        - name: Its data untouched
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: "{{ fingerprint }}"
          register: _after
          changed_when: false
          failed_when: _after.rc != 0 or _after.stdout != _before.stdout
      always:
        - name: Patroni started on pi2
          ansible.builtin.systemd:
            name: patroni
            state: started

    - name: Pi2 streaming again
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8008/patroni | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["role"], d["state"])'
      register: _back
      retries: 30
      delay: 5
      until: _back.rc == 0 and _back.stdout in ['replica streaming', 'replica running', 'primary running']
      changed_when: false

    - name: setup-patroni on pi2 with Patroni running - passes
      ansible.builtin.command:
        cmd: "{{ ansible_playbook }} -i inventory/vagrant.yml playbooks/setup-patroni.yml --limit pi2"
        chdir: "{{ deploy_dir }}"
      delegate_to: localhost
      become: false
      register: _passed
      changed_when: false

    - name: The same database port after the re-run
      ansible.builtin.shell: |
        set -o pipefail
        grep '^HOST = ' /var/lib/forgejo/custom/conf/app.ini
        grep -o 'KC_DB_URL=[^ "]*' /etc/systemd/system/keycloak.service
      args:
        executable: /bin/bash
      register: _db_after
      changed_when: false
      failed_when: _db_after.stdout != _db_before.stdout

    - name: PgBouncer stopped, re-run, refused - PgBouncer started again whatever happens
      block:
        - name: PgBouncer stopped on pi2
          ansible.builtin.systemd:
            name: pgbouncer
            state: stopped

        - name: setup-patroni on pi2 while PgBouncer is stopped - refused
          ansible.builtin.command:
            cmd: "{{ ansible_playbook }} -i inventory/vagrant.yml playbooks/setup-patroni.yml --limit pi2"
            chdir: "{{ deploy_dir }}"
          delegate_to: localhost
          become: false
          register: _refused_pgbouncer
          changed_when: false
          failed_when: _refused_pgbouncer.rc == 0 or 'PgBouncer is installed but' not in _refused_pgbouncer.stdout
      always:
        - name: PgBouncer started on pi2
          ansible.builtin.systemd:
            name: pgbouncer
            state: started

    - name: The same database port after the refused run
      ansible.builtin.shell: |
        set -o pipefail
        grep '^HOST = ' /var/lib/forgejo/custom/conf/app.ini
        grep -o 'KC_DB_URL=[^ "]*' /etc/systemd/system/keycloak.service
      args:
        executable: /bin/bash
      register: _db_after_pgbouncer
      changed_when: false
      failed_when: _db_after_pgbouncer.stdout != _db_before.stdout

    - name: Guarded
      ansible.builtin.debug:
        msg: >-
          PATRONI RE-RUN GUARD: stopped -> refused ({{ _refused.stdout | regex_search('REFUSED on pi2[^"]*?not active') }}),
          data untouched ({{ _after.stdout }}); running -> passed, the database port kept
          ({{ _db_after.stdout_lines | join(', ') }}); PgBouncer stopped -> refused, the port kept

# setup-consul with every config's key drifted from the one Consul runs (as the old playbook left them: a new key
# written each run, which Consul ignores after its first start): the live key written back, each server restarted
# alone (no two down together), Patroni paused around each (no failover) and resumed. Then a re-run on the converged
# cluster: nothing restarted, the key kept.
- name: Consul - every config's key drifted; the live key and Patroni's state before
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  vars:
    live_key: |
      set -euo pipefail
      curl -sf --max-time 5 http://127.0.0.1:8500/v1/operator/keyring | python3 -c '
      import json, sys
      print(" ".join(sorted({k for p in json.load(sys.stdin) if not p["WAN"] for k in p["PrimaryKeys"]})))'
  tasks:
    - name: The time before the re-run
      ansible.builtin.set_fact:
        _t_drift: "{{ lookup('pipe', 'date +%s') | int }}"

    - name: The key Consul runs with
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{{ live_key }}"
      register: _live_before
      changed_when: false

    - name: Another key, the same for all three (as the old playbook generated)
      ansible.builtin.command: consul keygen
      register: _drift_key
      changed_when: false
      run_once: true

    - name: Written into each config
      ansible.builtin.lineinfile:
        path: /etc/consul.d/consul.hcl
        regexp: '^encrypt = '
        line: 'encrypt = "{{ _drift_key.stdout }}"'

    - name: Each Patroni's Postgres before
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_before_consul
      when: inventory_hostname != 'target'

    - name: Each Vault before (200 active, 429 standby)
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        validate_certs: false
        status_code: [200, 429, 473, 501, 503]
      register: _vault_before_consul
      when: inventory_hostname != 'target'

    - name: The sampler's directory
      ansible.builtin.file:
        path: /var/lib/rerun-guards-test
        state: directory
        mode: '0700'

    # every 0.2 s on each server: is its own agent up (it knows a leader), and is Patroni paused (its config key in
    # Consul says "pause": true) - from these, the restarts' down windows and what the others saw meanwhile
    - name: A sampler on each server (bounded; ends on its stop file)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          d=/var/lib/rerun-guards-test; rm -f $d/stop; : > $d/consul-samples
          for i in $(seq 1 3000); do
            [ -e $d/stop ] && exit 0
            t=$(date +%s%3N)
            if [[ "$(curl -sf --max-time 0.5 http://127.0.0.1:8500/v1/status/leader 2>/dev/null)" == *:* ]]; then up=up; else up=down; fi
            if c=$(curl -sf --max-time 0.5 'http://127.0.0.1:8500/v1/kv/service/schnappy-postgres/config?raw' 2>/dev/null); then
              if [[ "$c" == *'"pause":true'* ]]; then p=pause; else p=nopause; fi
            else
              p=unknown
            fi
            echo "$t $up $p" >> $d/consul-samples
            sleep 0.2
          done
      async: 1200
      poll: 0
      register: _consul_sampler
      changed_when: false

- name: setup-consul re-run on the drifted keys
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Consul after - the live key written back, each restarted alone; no failover; resumed
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  vars:
    live_key: |
      set -euo pipefail
      curl -sf --max-time 5 http://127.0.0.1:8500/v1/operator/keyring | python3 -c '
      import json, sys
      print(" ".join(sorted({k for p in json.load(sys.stdin) if not p["WAN"] for k in p["PrimaryKeys"]})))'
  tasks:
    - name: Each server's restart window (stopped, started) and its config's key
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(date -d "$(systemctl show consul -p ActiveExitTimestamp --value)" +%s)" \
             "$(date -d "$(systemctl show consul -p ActiveEnterTimestamp --value)" +%s)" \
             "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl)"
      args:
        executable: /bin/bash
      register: _consul_window
      changed_when: false

    - name: The key Consul runs with, after
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{{ live_key }}"
      register: _live_after
      changed_when: false

    - name: Restarted in this run; the config holds the live key again; the live key unchanged
      ansible.builtin.assert:
        that:
          - _consul_window.stdout.split()[0] | int >= _t_drift | int
          - _consul_window.stdout.split()[2] == _live_before.stdout
          - _live_after.stdout == _live_before.stdout
        fail_msg: "{{ inventory_hostname }}: window+config {{ _consul_window.stdout }}, live {{ _live_before.stdout }} -> {{ _live_after.stdout }}"
        quiet: true

    - name: The samplers stopped
      ansible.builtin.file:
        path: /var/lib/rerun-guards-test/stop
        state: touch
        mode: '0600'

    - name: Their end
      ansible.builtin.async_status:
        jid: "{{ _consul_sampler.ansible_job_id }}"
      register: _consul_sampler_end
      until: _consul_sampler_end.finished
      retries: 10
      delay: 1

    - name: Their samples
      ansible.builtin.slurp:
        src: /var/lib/rerun-guards-test/consul-samples
      register: _consul_samples

    # a restart's stop, to the millisecond: systemd's monotonic stamp as wall-clock time (a restart can be shorter
    # than one sample, so the samples alone can miss it)
    - name: When each server's agent stopped
      ansible.builtin.command:
        cmd: >-
          python3 -c "import subprocess, time; m = int(subprocess.check_output(['systemctl', 'show', '-p',
          'ActiveExitTimestampMonotonic', '--value', 'consul'])); print(int((time.time() - (time.clock_gettime(time.CLOCK_MONOTONIC)
          - m / 1e6)) * 1000))"
      register: _consul_exit_ms
      changed_when: false

    # each server down from its agent's stop until its own samples see it up again: no two overlap, and the other
    # servers saw Patroni paused just before and just after (the old handler restarted all three at once; without
    # the pause, nothing held Patroni's leader while its agent was away)
    - name: One at a time, Patroni paused around each - judged from the samples
      ansible.builtin.command:
        cmd: python3 -c "{{ judge }}"
        stdin: >-
          {{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, ['_consul_samples', 'content'])
             | map('b64decode') | zip(ansible_play_hosts | map('extract', hostvars, ['_consul_exit_ms', 'stdout']))
             | map('list'))) | to_json }}
      vars:
        judge: |
          import json, sys
          d = json.load(sys.stdin)
          samples = {h: [(int(t), up, p) for t, up, p in (l.split() for l in v[0].splitlines() if l.strip())] for h, v in d.items()}
          problems, downs = [], {}
          for h, (txt, stop) in d.items():
              start = int(stop)
              if not samples[h] or samples[h][0][0] >= start:
                  problems.append('%s stopped before its sampler started' % h)
                  continue
              end = next((t for t, up, p in samples[h] if t > start and up == 'up'), None)
              if end is None:
                  problems.append('%s not up again after its stop' % h)
                  end = samples[h][-1][0]
              downs[h] = (start, end)
          hs = sorted(downs)
          for i, a in enumerate(hs):
              for b in hs[i + 1:]:
                  (s1, e1), (s2, e2) = downs[a], downs[b]
                  if s1 < e2 and s2 < e1:
                      problems.append('%s and %s down together' % (a, b))
          for h in hs:
              s, e = downs[h]
              before = [max((x for x in samples[o] if x[0] <= s), default=(0, '', 'none'))[2] for o in hs if o != h]
              after = [min((x for x in samples[o] if x[0] >= e), default=(0, '', 'none'))[2] for o in hs if o != h]
              if 'pause' not in before or 'pause' not in after:
                  problems.append('%s down without Patroni paused (others just before %s, just after %s)' % (h, before, after))
          print(dict((h, '%d ms' % (downs[h][1] - downs[h][0])) for h in hs), '|', '; '.join(problems) or 'one at a time, Patroni paused around each')
          sys.exit(1 if problems else 0)
      register: _consul_judged
      changed_when: false
      failed_when: _consul_judged.rc != 0
      delegate_to: localhost
      become: false
      run_once: true

    - name: No failover - the same role and timeline, Postgres not restarted
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_after_consul
      failed_when: >-
        _pg_after_consul.json.postmaster_start_time != _pg_before_consul.json.postmaster_start_time
        or _pg_after_consul.json.role != _pg_before_consul.json.role
        or _pg_after_consul.json.timeline != _pg_before_consul.json.timeline
      when: inventory_hostname != 'target'

    - name: Patroni resumed
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          out=$(patronictl -c /etc/patroni/patroni.yml list)
          if grep 'Maintenance mode' <<< "$out" > /dev/null; then echo PAUSED; exit 1; fi
      changed_when: false
      run_once: true
      delegate_to: pi1

    # what the restarts did beyond Patroni: HAProxy's /primary check (a primary marked down cuts its sessions), and
    # Vault, whose lock is a Consul session of the active node's agent
    - name: HAProxy never marked the primary down
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          leader={{ (['pi1', 'pi2'] | map('extract', hostvars) | selectattr('_pg_before_consul.json.role', 'in', ['primary', 'master'])
                     | map(attribute='inventory_hostname') | first) }}
          n=$(journalctl -u haproxy --since @{{ _t_drift }} --no-pager -o cat | grep -cE "postgres_primary/$leader( \\('[^']*'\\))? is DOWN" || true)
          # the pattern's control: the replica fails /primary at every HAProxy start, so this boot's log has it DOWN -
          # a log line the pattern no longer matches would read 0 above for ever
          replica={{ (['pi1', 'pi2'] | map('extract', hostvars) | rejectattr('_pg_before_consul.json.role', 'in', ['primary', 'master'])
                      | map(attribute='inventory_hostname') | first) }}
          r=$(journalctl -u haproxy -b --no-pager -o cat | grep -cE "postgres_primary/$replica( \\('[^']*'\\))? is DOWN" || true)
          echo "$leader marked down $n times (the control: $replica, a replica, marked down $r times this boot)"
          [ "$n" = 0 ] && [ "$r" -ge 1 ]
      register: _haproxy_consul
      changed_when: false
      when: inventory_hostname != 'target'

    - name: Vault after - one active, none sealed; whether the active one moved
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        validate_certs: false
        status_code: [200, 429, 473, 501, 503]
      register: _vault_after_consul
      retries: 12
      delay: 5
      until: _vault_after_consul.status in [200, 429]
      when: inventory_hostname != 'target'

    - name: One Vault active
      ansible.builtin.assert:
        that: _active_after | length == 1
        fail_msg: "Vault active after the restarts: {{ _active_after }}"
        quiet: true
      vars:
        _active_after: "{{ ['pi1', 'pi2'] | map('extract', hostvars) | selectattr('_vault_after_consul.status', 'equalto', 200) | map(attribute='inventory_hostname') | list }}"
      run_once: true

    - name: Converged, one at a time
      ansible.builtin.debug:
        msg: >-
          CONSUL KEY DRIFT RE-RUN: the live key written back on each; down windows {{ _consul_judged.stdout }};
          no failover; resumed; HAProxy {{ ['pi1', 'pi2'] | map('extract', hostvars, ['_haproxy_consul', 'stdout']) | join(', ') }};
          Vault active {{ ['pi1', 'pi2'] | map('extract', hostvars) | selectattr('_vault_before_consul.status', 'equalto', 200) | map(attribute='inventory_hostname') | join(',') }}
          -> {{ ['pi1', 'pi2'] | map('extract', hostvars) | selectattr('_vault_after_consul.status', 'equalto', 200) | map(attribute='inventory_hostname') | join(',') }}
      run_once: true

    - name: Key and start time before the unchanged re-run
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl) $(systemctl show consul -p ActiveEnterTimestampMonotonic --value)"
      args:
        executable: /bin/bash
      register: _consul_before_rerun
      changed_when: false

- name: setup-consul re-run on the converged cluster
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Consul's key and start times after - unchanged
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: Key and start time as before
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl) $(systemctl show consul -p ActiveEnterTimestampMonotonic --value)"
      args:
        executable: /bin/bash
      register: _consul_after_rerun
      changed_when: false
      failed_when: >-
        _consul_after_rerun.stdout != _consul_before_rerun.stdout or _consul_after_rerun.stdout.split() | length != 2

    - name: Unchanged
      ansible.builtin.debug:
        msg: "CONSUL RE-RUN: {{ inventory_hostname }} kept its key and was not restarted"

# Consul's HTTP API for its own node only (client_addr 127.0.0.1): each agent answers there, and no server's API
# answers on its address from another - it has no ACLs (KV, the gossip keyring, the backups' lock)
- name: Consul's HTTP API on each node itself, not across the network
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: Its own agent answers; the others' do not on their addresses
      ansible.builtin.shell: |
        set -uo pipefail
        curl -sf --max-time 5 http://127.0.0.1:8500/v1/status/leader > /dev/null && echo local-answers || echo LOCAL-SILENT
        {% for h in ['pi1', 'pi2', 'target'] | difference([inventory_hostname]) %}
        curl -s --max-time 5 -o /dev/null http://{{ hostvars[h].ansible_host }}:8500/v1/status/leader \
          && echo "{{ h }}-ANSWERS" || echo "{{ h }}-closed"
        {% endfor %}
      args:
        executable: /bin/bash
      register: _consul_http
      changed_when: false
      failed_when: >-
        _consul_http.stdout_lines | select('eq', 'local-answers') | list | length != 1
        or _consul_http.stdout_lines | select('match', '.*-closed$') | list | length != 2

# the RPC port serves the keyring, KV, sessions and snapshots with no ACLs: open between the servers, closed to the
# rest of the LAN - the controller is no server
- name: Consul's RPC port - closed to the LAN, open server to server
  hosts: pi1,pi2
  become: true
  gather_facts: false
  vars:
    probe: >-
      python3 -c 'import socket, sys;
      s = socket.socket(); s.settimeout(3);
      print("open" if s.connect_ex((sys.argv[1], 8300)) == 0 else "closed")'
  tasks:
    - name: From the controller (no server) - closed
      ansible.builtin.command: "{{ probe }} {{ ansible_host }}"
      delegate_to: localhost
      become: false
      register: _rpc_lan
      changed_when: false
      failed_when: _rpc_lan.stdout != 'closed'

    - name: From the other Pi (a server) - open
      ansible.builtin.command: "{{ probe }} {{ hostvars[groups['pis'] | difference([inventory_hostname]) | first].ansible_host }}"
      register: _rpc_peer
      changed_when: false
      failed_when: _rpc_peer.stdout != 'open'

# a run limited to one server (pi2) keeps the key the others run - it found none among the run's hosts and wrote an
# empty one - and a restart left pending there (the agent's record of its loaded config stale, as after a run cut
# short between writing and restarting) is done; the servers outside the run are not touched
- name: Consul before the limited run - a restart pending on pi2
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: Start time and key before
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl) $(systemctl show consul -p ActiveEnterTimestampMonotonic --value)"
      args:
        executable: /bin/bash
      register: _consul_before_limited
      changed_when: false

    - name: The consul running as if it loaded another config - its record stale (a run cut short before the restart)
      ansible.builtin.copy:
        dest: /var/lib/config-loaded/consul.sha256
        content: "stale\n"
        mode: '0600'
      when: inventory_hostname == 'pi2'

- name: setup-consul limited to pi2
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook, --limit pi2
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml --limit pi2"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Consul after the limited run - the same key everywhere; pi2 restarted, the others not
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: Key and start time after
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl) $(systemctl show consul -p ActiveEnterTimestampMonotonic --value)"
      args:
        executable: /bin/bash
      register: _consul_after_limited
      changed_when: false
      failed_when: >-
        _consul_after_limited.stdout.split() | length != 2
        or _consul_after_limited.stdout.split()[0] != _consul_before_limited.stdout.split()[0]
        or (_consul_after_limited.stdout.split()[1] != _consul_before_limited.stdout.split()[1])
           != (inventory_hostname == 'pi2')

    - name: The limited run
      ansible.builtin.debug:
        msg: >-
          CONSUL LIMITED RE-RUN: {{ inventory_hostname }} kept the key,
          {{ 'restarted (its pending config)' if inventory_hostname == 'pi2' else 'not restarted (outside the run)' }}

# a server rebuilt alone (its agent stopped, its config without a key) gets the key the others run - read from them,
# not generated (it wrote "" before); Patroni paused meanwhile (pi2's own agent away)
- name: Consul on pi2 rebuilt - Patroni paused first
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Patroni pause
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml pause --wait
      changed_when: true

- name: Consul on pi2 rebuilt - its agent stopped, its config's key gone
  hosts: pi2
  become: true
  gather_facts: false
  tasks:
    - name: Stopped, the key blanked
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl stop consul
        sed -i 's/^encrypt = .*/encrypt = ""/' /etc/consul.d/consul.hcl
      args:
        executable: /bin/bash
      changed_when: true

- name: setup-consul on the rebuilt pi2 alone
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml --limit pi2"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: The rebuilt pi2 has the others' key and runs
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: pi2's agent
      ansible.builtin.command: systemctl is-active consul
      register: _pi2_consul_active
      changed_when: false
      failed_when: false
      when: inventory_hostname == 'pi2'

    - name: Its config's key
      ansible.builtin.command: sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl
      register: _key_rebuilt
      changed_when: false

    - name: The same key on all three, none empty; pi2's agent running
      ansible.builtin.assert:
        that:
          - _keys | unique | length == 1
          - _keys | first | length > 0
          - hostvars['pi2']._pi2_consul_active.stdout | default('') == 'active'
        fail_msg: "keys {{ _keys }}"
        quiet: true
      vars:
        _keys: "{{ ['pi1', 'pi2', 'target'] | map('extract', hostvars, ['_key_rebuilt', 'stdout']) | list }}"
      run_once: true
      delegate_to: pi2
      delegate_facts: false

- name: Consul on pi2 rebuilt - Patroni resumed
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Patroni resume
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml resume --wait
      changed_when: true

# Patroni paused by someone else (an operator's maintenance) and a Consul restart pending on pi2: refused - the run's
# resume would have ended that pause - and left paused
- name: Someone else's pause - Patroni paused
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Patroni pause
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml pause --wait
      changed_when: true

- name: Someone else's pause - a Consul restart pending on pi2
  hosts: pi2
  become: true
  gather_facts: false
  tasks:
    - name: The consul running as if it loaded another config - its record stale (a run cut short before the restart)
      ansible.builtin.copy:
        dest: /var/lib/config-loaded/consul.sha256
        content: "stale\n"
        mode: '0600'

- name: setup-consul refused while Patroni is paused by someone else
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook, refused
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml --limit pi2"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      register: _refused_run
      changed_when: false
      failed_when: _refused_run.rc == 0 or 'Patroni is paused' not in _refused_run.stdout

- name: Still paused - the run left someone else's pause alone
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Paused
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "set -o pipefail; patronictl -c /etc/patroni/patroni.yml list | grep -c 'Maintenance mode'"
      register: _still_paused
      changed_when: false
      failed_when: _still_paused.stdout | int < 1

- name: Someone else's pause - over
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Patroni resume
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml resume --wait
      changed_when: true

- name: setup-consul does pi2's pending restart now
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml --limit pi2"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

# setup-keepalived with a changed config: keepalived reloaded, not restarted (its PID kept - a restart runs the stop
# drop-in, releasing Nexus on the active Pi), the VIP where it was, and the reload applied: pi1 runs a drifted
# router_id (its config changed and reloaded by hand), the re-run writes the config back and the running one follows
# setup-patroni on a cluster whose config, then whose unit, differs from what the playbook writes: the config change
# reloaded (Patroni's PID kept), the unit change restarted one node at a time paused - either way Postgres never
# restarted, no failover, the cluster resumed (it restarted both Patronis at once, unpaused: both Postgres down)
- name: Patroni's config hand-edited on both Pis; Patroni and Postgres before
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: A line the playbook does not write
      ansible.builtin.lineinfile:
        path: /etc/patroni/patroni.yml
        line: "# rerun-guards: a hand edit"

    - name: Patroni's PID and Postgres before
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_before_config

    - name: Patroni's PID before
      ansible.builtin.command: systemctl show patroni -p MainPID --value
      register: _pid_before_config
      changed_when: false

- name: setup-patroni re-run on the edited config
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Patroni after the config's re-run - reloaded, not restarted; then its unit hand-edited
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: The config as the playbook writes it
      ansible.builtin.command: grep -c "rerun-guards" /etc/patroni/patroni.yml
      register: _drift_left
      changed_when: false
      failed_when: _drift_left.stdout != '0'

    - name: Patroni's PID kept (a reload), Postgres not restarted, the same role and timeline
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_after_config
      failed_when: >-
        _pg_after_config.json.postmaster_start_time != _pg_before_config.json.postmaster_start_time
        or _pg_after_config.json.role != _pg_before_config.json.role
        or _pg_after_config.json.timeline != _pg_before_config.json.timeline

    - name: Patroni's PID after
      ansible.builtin.command: systemctl show patroni -p MainPID --value
      register: _pid_after_config
      changed_when: false
      failed_when: _pid_after_config.stdout != _pid_before_config.stdout

    - name: A line the playbook does not write, in the unit
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/patroni.service
        line: "# rerun-guards: a hand edit"

    - name: The patroni running as if it loaded another config - its record stale (a run cut short before the restart)
      ansible.builtin.copy:
        dest: /var/lib/config-loaded/patroni.sha256
        content: "stale\n"
        mode: '0600'

    - name: Postgres before the unit's re-run
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_before_unit

# the unit edited and Patroni paused by someone else: setup-patroni refuses and leaves the pause; then the re-run
- name: Someone else's pause before the unit's re-run
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Patroni pause
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml pause --wait
      changed_when: true

- name: setup-patroni refused while Patroni is paused by someone else
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook, refused
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      register: _refused_run
      changed_when: false
      failed_when: _refused_run.rc == 0 or 'the cluster is paused' not in _refused_run.stdout

- name: Patroni still paused - the run left someone else's pause alone
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Paused
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "set -o pipefail; patronictl -c /etc/patroni/patroni.yml list | grep -c 'Maintenance mode'"
      register: _still_paused
      changed_when: false
      failed_when: _still_paused.stdout | int < 1

- name: That pause over
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: Patroni resume
      ansible.builtin.command: patronictl -c /etc/patroni/patroni.yml resume --wait
      changed_when: true

- name: setup-patroni re-run on the edited unit
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-patroni.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Patroni after the unit's re-run - restarted on both, paused, Postgres untouched, resumed
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: The unit as the playbook writes it
      ansible.builtin.command: grep -c "rerun-guards" /etc/systemd/system/patroni.service
      register: _unit_drift_left
      changed_when: false
      failed_when: _unit_drift_left.stdout != '0'

    - name: Patroni restarted here (its PID new), Postgres not, the same role and timeline
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_after_unit
      failed_when: >-
        _pg_after_unit.json.postmaster_start_time != _pg_before_unit.json.postmaster_start_time
        or _pg_after_unit.json.role != _pg_before_unit.json.role
        or _pg_after_unit.json.timeline != _pg_before_unit.json.timeline

    - name: Patroni's PID after
      ansible.builtin.command: systemctl show patroni -p MainPID --value
      register: _pid_after_unit
      changed_when: false
      failed_when: _pid_after_unit.stdout == _pid_after_config.stdout

    # one node at a time, the replica first: each node's restart window (its stop to its start, systemd's monotonic
    # stamps as wall-clock time - a restart can be shorter than any sample) - the replica's ends before the leader's
    # begins (paused, both at once would also have kept Postgres up)
    - name: This node's restart window
      ansible.builtin.command:
        cmd: >-
          python3 -c "import subprocess, time; m = lambda p: int(subprocess.check_output(['systemctl', 'show',
          'patroni', '-p', p, '--value']).strip() or 0) / 1e6; w, n = time.time(), time.monotonic();
          print('%.3f %.3f' % (w - (n - m('ActiveExitTimestampMonotonic')), w - (n - m('ActiveEnterTimestampMonotonic'))))"
      register: _restart_window
      changed_when: false

    - name: One at a time, the replica first
      ansible.builtin.assert:
        that:
          - _replica | length == 1
          - (hostvars[_replica[0]]._restart_window.stdout.split()[1] | float)
            <= (hostvars[_leader[0]]._restart_window.stdout.split()[0] | float)
        fail_msg: >-
          windows {{ ['pi1', 'pi2'] | map('extract', hostvars, ['_restart_window', 'stdout']) | list }} (stop, start),
          replica {{ _replica }}, leader {{ _leader }}
        quiet: true
      vars:
        _replica: "{{ ['pi1', 'pi2'] | map('extract', hostvars) | selectattr('_pg_before_unit.json.role', 'equalto', 'replica') | map(attribute='inventory_hostname') | list }}"
        _leader: "{{ ['pi1', 'pi2'] | map('extract', hostvars) | rejectattr('_pg_before_unit.json.role', 'equalto', 'replica') | map(attribute='inventory_hostname') | list }}"
      run_once: true

    - name: Not paused
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          out=$(patronictl -c /etc/patroni/patroni.yml list)
          if grep 'Maintenance mode' <<< "$out" > /dev/null; then echo PAUSED; exit 1; fi
      changed_when: false
      run_once: true

    - name: Applied without a failover
      ansible.builtin.debug:
        msg: >-
          PATRONI RE-RUN: a config edit reloaded (PIDs kept), a unit edit restarted each Patroni paused (PIDs new) -
          Postgres not restarted, roles and timelines unchanged, resumed
      run_once: true

- name: Keepalived before - pi1 running a drifted router_id
  hosts: pi1,pi2
  become: true
  gather_facts: false
  vars:
    running_router_id: |
      set -euo pipefail
      pid=$(systemctl show keepalived -p MainPID --value)
      # 0 when keepalived is not running: `kill 0` would signal this task's own process group
      [ "$pid" -gt 1 ] || { echo "keepalived is not running (MainPID $pid)" >&2; exit 1; }
      rm -f /tmp/keepalived.data
      kill -s "$(keepalived --signum=DATA)" "$pid"
      for i in $(seq 1 20); do [ -s /tmp/keepalived.data ] && break; sleep 0.25; done
      sed -n 's/^ *Router ID = //p' /tmp/keepalived.data
  tasks:
    - name: Keepalived's PID and whether this Pi holds the VIP
      ansible.builtin.shell: |
        echo "$(systemctl show keepalived -p MainPID --value) $(ip -o -4 addr show to {{ keepalived_vip }}/32 | wc -l)"
      register: _ka_before
      changed_when: false

    - name: Pi1's router_id drifted in its config and reloaded by hand
      ansible.builtin.shell: |
        set -o pipefail
        sed -i 's/^  router_id .*/  router_id drift-pi1/' /etc/keepalived/keepalived.conf
        systemctl reload keepalived
      args:
        executable: /bin/bash
      changed_when: true
      when: inventory_hostname == 'pi1'

    - name: Pi1 runs it
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{{ running_router_id }}"
      register: _ka_drifted
      retries: 5
      delay: 2
      until: _ka_drifted.stdout == 'drift-pi1'
      changed_when: false
      when: inventory_hostname == 'pi1'

- name: setup-keepalived re-run
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-keepalived.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Keepalived after - reloaded, the VIP where it was
  hosts: pi1,pi2
  become: true
  gather_facts: false
  vars:
    running_router_id: |
      set -euo pipefail
      pid=$(systemctl show keepalived -p MainPID --value)
      # 0 when keepalived is not running: `kill 0` would signal this task's own process group
      [ "$pid" -gt 1 ] || { echo "keepalived is not running (MainPID $pid)" >&2; exit 1; }
      rm -f /tmp/keepalived.data
      kill -s "$(keepalived --signum=DATA)" "$pid"
      for i in $(seq 1 20); do [ -s /tmp/keepalived.data ] && break; sleep 0.25; done
      sed -n 's/^ *Router ID = //p' /tmp/keepalived.data
  tasks:
    - name: The same PID, the same VIP holder
      ansible.builtin.shell: |
        echo "$(systemctl show keepalived -p MainPID --value) $(ip -o -4 addr show to {{ keepalived_vip }}/32 | wc -l)"
      register: _ka_after
      changed_when: false
      failed_when: _ka_after.stdout != _ka_before.stdout

    - name: The running router_id the playbook's again (the reload applied the rewritten config)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{{ running_router_id }}"
      register: _ka_router
      retries: 5
      delay: 2
      until: _ka_router.stdout == inventory_hostname
      changed_when: false

    - name: Kept
      ansible.builtin.debug:
        msg: >-
          KEEPALIVED RE-RUN: {{ inventory_hostname }} kept PID and VIP ({{ _ka_after.stdout }}), runs router_id
          {{ _ka_router.stdout }}{{ ' (was drift-pi1)' if inventory_hostname == 'pi1' else '' }}

# setup-vault-pi with a change to apply on both Pis (Vault's record of its loaded config stale): each Vault restarted one at a time,
# unsealed before the next (both at once sealed both), one active after; and no unseal shares left on the controller
# (a fetch left every share in its /tmp)
- name: Vault before - a restart pending on both Pis
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: No unseal shares on the controller before the run
      ansible.builtin.file:
        path: /tmp/vault-unseal-keys
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

    - name: Vault's start before
      ansible.builtin.command: systemctl show vault -p ActiveEnterTimestampMonotonic --value
      register: _vault_start_before
      changed_when: false

    - name: The vault running as if it loaded another config - its record stale (a run cut short before the restart)
      ansible.builtin.copy:
        dest: /var/lib/config-loaded/vault.sha256
        content: "stale\n"
        mode: '0600'

- name: setup-vault-pi re-run with the change to apply
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-vault-pi.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Vault after - each restarted alone, unsealed, one active; nothing left on the controller
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: Restarted here
      ansible.builtin.command: systemctl show vault -p ActiveEnterTimestampMonotonic --value
      register: _vault_start_after
      changed_when: false
      failed_when: _vault_start_after.stdout == _vault_start_before.stdout

    - name: Its restart window (stop, start - monotonic stamps as wall-clock time)
      ansible.builtin.command:
        cmd: >-
          python3 -c "import subprocess, time; m = lambda p: int(subprocess.check_output(['systemctl', 'show',
          'vault', '-p', p, '--value']).strip() or 0) / 1e6; w, n = time.time(), time.monotonic();
          print('%.3f %.3f' % (w - (n - m('ActiveExitTimestampMonotonic')), w - (n - m('ActiveEnterTimestampMonotonic'))))"
      register: _vault_window
      changed_when: false

    - name: Unsealed (200 active, 429 standby)
      ansible.builtin.uri:
        url: https://127.0.0.1:8200/v1/sys/health
        validate_certs: false
        status_code: [200, 429, 473, 501, 503]
      register: _vault_health
      retries: 12
      delay: 5
      until: _vault_health.status in [200, 429]

    - name: One at a time (one's window ends before the other's begins), one active
      ansible.builtin.assert:
        that:
          - (_w[0][1] <= _w[1][0]) or (_w[1][1] <= _w[0][0])
          - (['pi1', 'pi2'] | map('extract', hostvars, ['_vault_health', 'status']) | select('equalto', 200) | list | length) == 1
        fail_msg: "windows {{ _w }}, health {{ ['pi1', 'pi2'] | map('extract', hostvars, ['_vault_health', 'status']) | list }}"
        quiet: true
      vars:
        _w: "{{ ['pi1', 'pi2'] | map('extract', hostvars, ['_vault_window', 'stdout']) | map('split') | map('map', 'float') | map('list') | list }}"
      run_once: true

    - name: No unseal shares on the controller after
      ansible.builtin.stat:
        path: /tmp/vault-unseal-keys
      register: _shares_left
      delegate_to: localhost
      become: false
      run_once: true
      failed_when: _shares_left.stat.exists

    - name: Applied one at a time
      ansible.builtin.debug:
        msg: >-
          VAULT RE-RUN: each restarted alone ({{ ['pi1', 'pi2'] | map('extract', hostvars, ['_vault_window', 'stdout']) | list }}),
          unsealed, one active; no shares on the controller
      run_once: true
