---
# Re-running the Pi playbooks on a live Vagrant Pi stack is safe:
#   setup-patroni, Patroni stopped on pi2: refused, naming the reason, and pi2's data still there (the same files in
#   its data directory but postmaster.pid, which a stopped Postgres removes); Patroni started again (whatever happened)
#   and back to streaming, the same run passes on pi2 and leaves its database port (PgBouncer's) as it was.
#   setup-consul on an unchanged cluster: the same gossip key on every server, no server restarted.
# Vagrant only (the guard play first). Usage: task test:pi:rerun-guards
- name: Vagrant VMs only
  ansible.builtin.import_playbook: vagrant-only-play.yml

- name: The Patroni re-run guard on pi2
  hosts: pi2
  become: true
  gather_facts: false
  vars:
    ansible_playbook: "{{ ansible_playbook_python | dirname }}/ansible-playbook"
    deploy_dir: "{{ playbook_dir }}/../../deploy/ansible"
    list_data: |
      set -euo pipefail
      d=$(ls -d /var/lib/postgresql/*/main | head -1)
      echo "$d"
      ls "$d" | grep -v '^postmaster.pid$' | sort | tr '\n' ' '
  tasks:
    - name: Pi2's data directory and what is in it
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "{{ list_data }}"
      register: _before
      changed_when: false

    - name: The database port Forgejo and Keycloak use on pi2 (PgBouncer's, as on the Pis)
      ansible.builtin.shell: |
        set -o pipefail
        grep '^HOST = ' /var/lib/forgejo/custom/conf/app.ini
        grep -o 'KC_DB_URL=[^ "]*' /etc/systemd/system/keycloak.service
      args:
        executable: /bin/bash
      register: _db_before
      changed_when: false
      failed_when: _db_before.rc != 0 or ':6432' not in _db_before.stdout

    - name: Stopped, re-run, refused - Patroni started again whatever happens
      block:
        - name: Patroni stopped on pi2
          ansible.builtin.systemd:
            name: patroni
            state: stopped

        - name: setup-patroni on pi2 while Patroni is stopped - refused
          ansible.builtin.command:
            cmd: "{{ ansible_playbook }} -i inventory/vagrant.yml playbooks/setup-patroni.yml --limit pi2"
            chdir: "{{ deploy_dir }}"
          delegate_to: localhost
          become: false
          register: _refused
          changed_when: false
          failed_when: _refused.rc == 0 or 'REFUSED on pi2' not in _refused.stdout

        - name: The same files in its data directory
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: "{{ list_data }}"
          register: _after
          changed_when: false
          failed_when: >-
            _after.stdout != _before.stdout or 'PG_VERSION' not in _after.stdout
            or 'patroni.dynamic.json' not in _after.stdout
      always:
        - name: Patroni started on pi2
          ansible.builtin.systemd:
            name: patroni
            state: started

    - name: Pi2 streaming again
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8008/patroni | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["role"], d["state"])'
      register: _back
      retries: 30
      delay: 5
      until: _back.rc == 0 and _back.stdout in ['replica streaming', 'replica running', 'primary running']
      changed_when: false

    - name: setup-patroni on pi2 with Patroni running - passes
      ansible.builtin.command:
        cmd: "{{ ansible_playbook }} -i inventory/vagrant.yml playbooks/setup-patroni.yml --limit pi2"
        chdir: "{{ deploy_dir }}"
      delegate_to: localhost
      become: false
      register: _passed
      changed_when: false

    - name: The same database port after the re-run
      ansible.builtin.shell: |
        set -o pipefail
        grep '^HOST = ' /var/lib/forgejo/custom/conf/app.ini
        grep -o 'KC_DB_URL=[^ "]*' /etc/systemd/system/keycloak.service
      args:
        executable: /bin/bash
      register: _db_after
      changed_when: false
      failed_when: _db_after.stdout != _db_before.stdout

    - name: Guarded
      ansible.builtin.debug:
        msg: >-
          PATRONI RE-RUN GUARD: stopped -> refused ({{ _refused.stdout | regex_search('REFUSED on pi2[^"]*?not active') }}),
          data untouched; running -> passed, the database port kept ({{ _db_after.stdout_lines | join(', ') }})

# setup-consul re-run on an unchanged cluster: the same gossip key on every server, and no server restarted (each
# consul's start time as before) - it used to make a new key and restart all three at once
- name: Consul's key and start times before
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: Key and start time
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl) $(systemctl show consul -p ActiveEnterTimestampMonotonic --value)"
      args:
        executable: /bin/bash
      register: _consul_before_rerun
      changed_when: false

- name: setup-consul re-run
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: The playbook
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python | dirname }}/ansible-playbook -i inventory/vagrant.yml playbooks/setup-consul.yml"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      changed_when: false

- name: Consul's key and start times after - unchanged
  hosts: pi1,pi2,target
  become: true
  gather_facts: false
  tasks:
    - name: Key and start time as before
      ansible.builtin.shell: |
        set -o pipefail
        echo "$(sed -n 's/^encrypt = "\(.*\)"$/\1/p' /etc/consul.d/consul.hcl) $(systemctl show consul -p ActiveEnterTimestampMonotonic --value)"
      args:
        executable: /bin/bash
      register: _consul_after_rerun
      changed_when: false
      failed_when: >-
        _consul_after_rerun.stdout != _consul_before_rerun.stdout or _consul_after_rerun.stdout.split() | length != 2

    - name: Unchanged
      ansible.builtin.debug:
        msg: "CONSUL RE-RUN: {{ inventory_hostname }} kept its key and was not restarted"
