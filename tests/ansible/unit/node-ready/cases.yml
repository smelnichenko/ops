---
# The node-Ready wait after a reboot or a kubelet restart (tests/ansible/upgrade/tasks/node-ready.yml) against a stub
# kubectl: the API server refusing its first connections is asked again until it answers; one that never answers fails
# after the task's retries, each call bounded by its own --timeout
- name: The node-Ready wait
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      - {name: "Ready at once", refusals: 0, want: ready, calls: 1}
      - {name: "the API server refusing its first two connections (still starting)", refusals: 2, want: ready, calls: 3}
      - {name: "an API server that never answers", refusals: 99, want: failed, calls: 6}
  tasks:
    - name: Each case
      ansible.builtin.include_tasks: case.yml
      loop: "{{ cases }}"
      loop_control:
        loop_var: c
