---
# upgrade-patroni.yml on the Vagrant Pis from production's version, checked from outside the playbook:
#   set back   the cluster at production's 4.1.0 (as ten's Pis run; paused meanwhile, so Postgres keeps running)
#   before     each node's Postgres start time, the leader and the timeline; the time the run starts
#   after      each node's Patroni on the target (its REST API); no failover - the same leader and timeline, no
#              Postgres restarted; HAProxy never marked the leader down; not paused; Forgejo answering
#   again      a second run restarts nothing; refused: a downgrade, a run without every node, a paused cluster; a
#              run whose package install fails resumes the cluster anyway
# Vagrant only. Usage: task test:patroni-upgrade
- name: Vagrant VMs only
  ansible.builtin.import_playbook: vagrant-only-play.yml

- name: The cluster at production's Patroni (4.1.0)
  hosts: pi1,pi2
  become: true
  gather_facts: false
  vars:
    patronictl: patronictl -c /etc/patroni/patroni.yml
    from_version: "4.1.0"
  tasks:
    - name: Its version now
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _now

    - name: Set back to production's, paused
      when: ansible_play_hosts | map('extract', hostvars, ['_now', 'json', 'patroni', 'version']) | unique | list != [from_version]
      block:
        - name: Paused
          ansible.builtin.command: "{{ patronictl }} pause --wait"
          changed_when: true
          run_once: true
        - name: The package
          ansible.builtin.pip:
            name: "patroni[consul]=={{ from_version }}"
            state: present
            break_system_packages: true
        - name: Restarted
          ansible.builtin.systemd:
            name: patroni
            state: restarted
          throttle: 1
        - name: On it
          ansible.builtin.uri:
            url: http://127.0.0.1:8008/patroni
            return_content: true
          register: _set
          retries: 30
          delay: 5
          until: _set.status | default(0) == 200 and _set.json.patroni.version == from_version
      always:
        - name: Resumed
          ansible.builtin.command: "{{ patronictl }} resume --wait"
          changed_when: true
          run_once: true

- name: Before the run - each Postgres's start, the leader, the timeline
  hosts: pi1,pi2
  become: true
  gather_facts: false
  tasks:
    - name: The time the run starts
      ansible.builtin.set_fact:
        _t_up: "{{ lookup('pipe', 'date +%s') | int }}"
      run_once: true

    - name: Each node's Postgres, as Patroni reports it
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_before

- name: Production's upgrade playbook
  ansible.builtin.import_playbook: ../../deploy/ansible/playbooks/upgrade-patroni.yml

- name: After - from outside the playbook
  hosts: pi1,pi2
  become: true
  gather_facts: false
  vars_files:
    - ../../deploy/ansible/vars/patroni.yml
  tasks:
    - name: Each node's Patroni on the target, its Postgres not restarted, the same role and timeline
      ansible.builtin.uri:
        url: http://127.0.0.1:8008/patroni
        return_content: true
      register: _pg_after
      failed_when: >-
        _pg_after.json.patroni.version != patroni_version
        or _pg_after.json.postmaster_start_time != _pg_before.json.postmaster_start_time
        or _pg_after.json.role != _pg_before.json.role
        or _pg_after.json.timeline != _pg_before.json.timeline

    - name: HAProxy never marked the leader down during the run
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          leader={{ (['pi1', 'pi2'] | map('extract', hostvars) | selectattr('_pg_before.json.role', 'in', ['primary', 'master'])
                     | map(attribute='inventory_hostname') | first) }}
          n=$(journalctl -u haproxy --since @{{ hostvars['pi1']._t_up }} --no-pager -o cat | grep -c "postgres_primary/$leader is DOWN" || true)
          echo "$leader marked down $n times"
          [ "$n" = 0 ]
      register: _haproxy
      changed_when: false

    - name: Not paused
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          out=$(patronictl -c /etc/patroni/patroni.yml list)
          if grep 'Maintenance mode' <<< "$out" > /dev/null; then echo PAUSED; exit 1; fi
      changed_when: false
      run_once: true

    - name: Forgejo's API, which reads its database
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/v1/repos/search?limit=1
        return_content: true
      register: _fj
      failed_when: _fj.status != 200 or not _fj.json.ok

    - name: Each Patroni's start before the second run
      ansible.builtin.command: systemctl show -p ActiveEnterTimestampMonotonic --value patroni
      register: _patroni_started
      changed_when: false

- name: A second run - nothing to do
  ansible.builtin.import_playbook: ../../deploy/ansible/playbooks/upgrade-patroni.yml

- name: Nothing restarted; refusals; a failed install still resumes
  hosts: pi1,pi2
  become: true
  gather_facts: false
  vars:
    run_playbook: >-
      env -i HOME={{ lookup('env', 'HOME') }} PATH={{ lookup('env', 'PATH') }}
      venv/bin/ansible-playbook -i inventory/vagrant.yml {{ playbook_dir }}/vagrant-only-play.yml playbooks/upgrade-patroni.yml
    patronictl: patronictl -c /etc/patroni/patroni.yml
  tasks:
    - name: Each Patroni's start, after
      ansible.builtin.command: systemctl show -p ActiveEnterTimestampMonotonic --value patroni
      register: _patroni_started_after
      changed_when: false
      failed_when: _patroni_started_after.stdout != _patroni_started.stdout

    - name: Refused - a downgrade, a run without every node
      ansible.builtin.command:
        cmd: "{{ run_playbook }} {{ item.args }}"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      loop:
        - {name: downgrade, args: "-e patroni_version=4.1.0", expect: "newer than 4.1.0"}
        - {name: one node, args: "--limit pi1,target", expect: "REFUSED: the run has"}
      loop_control:
        label: "{{ item.name }}"
      register: _refused
      changed_when: false
      failed_when: _refused.rc == 0 or item.expect not in _refused.stdout
      delegate_to: localhost
      become: false
      run_once: true

    - name: A paused cluster refused (even with nothing to do), then resumed
      block:
        - name: Paused
          ansible.builtin.command: "{{ patronictl }} pause --wait"
          changed_when: true
          run_once: true
        - name: Refused
          ansible.builtin.command:
            cmd: "{{ run_playbook }}"
            chdir: "{{ playbook_dir }}/../../deploy/ansible"
          register: _refused_paused
          changed_when: false
          failed_when: >-
            _refused_paused.rc == 0 or 'REFUSED: the cluster is paused' not in _refused_paused.stdout
          delegate_to: localhost
          become: false
          run_once: true
      always:
        - name: Resumed
          ansible.builtin.command: "{{ patronictl }} resume --wait"
          changed_when: true
          run_once: true

    - name: A run whose install fails (a version pip cannot find) - fails, and leaves the cluster resumed
      ansible.builtin.command:
        cmd: "{{ run_playbook }} -e patroni_version=4.1.99"
        chdir: "{{ playbook_dir }}/../../deploy/ansible"
      register: _failed_install
      changed_when: false
      failed_when: _failed_install.rc == 0 or 'Resumed' not in _failed_install.stdout
      delegate_to: localhost
      become: false
      run_once: true

    - name: Not paused after it
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          out=$({{ patronictl }} list)
          if grep 'Maintenance mode' <<< "$out" > /dev/null; then echo PAUSED; exit 1; fi
      changed_when: false
      run_once: true

    - name: Rehearsed
      ansible.builtin.debug:
        msg: >-
          PATRONI UPGRADE REHEARSED: 4.1.0 -> {{ hostvars['pi1']._pg_after.json.patroni.version }}; no failover
          (leader, timeline {{ hostvars['pi1']._pg_after.json.timeline }}, Postgres start times unchanged);
          {{ hostvars['pi1']._haproxy.stdout }}; Forgejo answering; second run restarted nothing; refused: downgrade,
          one node, paused; a failed install left the cluster resumed
      run_once: true
