---
# The Pis' tier-0 backup (setup-pi-backups.yml) taken on the Vagrant Pi stack and every piece restored, all read back
# from the Pi store:
#   before     a marker database with a random row; two probe backups in the bucket, named 31 and 29 days back
#   the run    started on both Pis: exactly one backs up and it is the VIP's Pi; the daily timer on, on both
#   consul.snap      into a throwaway Consul dev agent on other ports - Vault's keys (vault/core/) and Patroni's
#                    (service/) there
#   pg-<db>.dump     a dump for every database, each into a scratch database - every table it lists there, the marker
#                    row there, Forgejo's and Keycloak's users as many as live
#   keycloak-*.json  one per realm Keycloak has, each with clients
#   last-success     this run's time
#   retention        by the backups' names (pi_backup_keep 1 here): the 31-day probe gone, the 29-day one kept
#   a clock ahead    retention 0 - every backup older than the cutoff: the newest pi_backup_keep (2) stay, no other
#   Keycloak down    the rest uploaded with a failure marker, the run failed, last-success not moved
# Vagrant only (the guard play first). Usage: task test:pi-backups
- name: Vagrant VMs only
  ansible.builtin.import_playbook: vagrant-only-play.yml

- name: Production's backup playbook
  ansible.builtin.import_playbook: ../../deploy/ansible/playbooks/setup-pi-backups.yml
  vars:
    # only this run's backup kept by count: the 31-day probe then goes by its name
    pi_backup_keep: 1

- name: Before - a marker row, retention probes
  hosts: pi1
  become: true
  gather_facts: false
  tasks:
    - name: A marker database with a random row
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          P=(-h 127.0.0.1 -p 5000 -U postgres -v ON_ERROR_STOP=1)
          v=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
          psql "${P[@]}" -d postgres -qc "drop database if exists backup_probe" -c "create database backup_probe"
          psql "${P[@]}" -d backup_probe -qc "create table marker (v text)" -c "insert into marker values ('$v')"
          echo "$v"
      register: _marker
      changed_when: true

    - name: Two probe backups in the bucket, named 31 and 29 days back
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
          for age in 31 29; do
            n=$(date -u -d "-$age days" +%Y%m%dT%H%M%SZ)
            mkdir -p "$d/$n"; echo probe > "$d/$n/probe"; echo "$n" >> "$d/names"
          done
          rclone mkdir "store:$PI_BACKUP_BUCKET"
          rclone copy "$d" "store:$PI_BACKUP_BUCKET" --exclude names > /dev/null
          cat "$d/names"
      register: _probes
      changed_when: true

- name: A backup taken now (the VIP's Pi does it, the other finds it is not)
  hosts: pis
  become: true
  gather_facts: false
  tasks:
    - name: The service run on both
      ansible.builtin.systemd:
        name: pi-tier0-backup.service
        state: started

    - name: This run's invocation
      ansible.builtin.command: systemctl show -p InvocationID --value pi-tier0-backup.service
      register: _invocation
      changed_when: false

    - name: Its output, this run's only
      ansible.builtin.command: journalctl _SYSTEMD_INVOCATION_ID={{ _invocation.stdout }} --no-pager -o cat
      register: _journal
      changed_when: false

    - name: Whether this Pi holds the VIP
      ansible.builtin.command: ip -o -4 addr show to {{ keepalived_vip }}/32
      register: _vip
      changed_when: false

    - name: Exactly one Pi backed up, and it holds the VIP
      ansible.builtin.assert:
        that:
          - _backed_up | length == 1
          - _backed_up == _vip_holders
        fail_msg: "backed up: {{ _backed_up }}, VIP on: {{ _vip_holders }}"
        quiet: true
      vars:
        _backed_up: "{{ ansible_play_hosts | map('extract', hostvars) | selectattr('_journal.stdout', 'search', 'PI TIER-0 BACKUP') | map(attribute='inventory_hostname') | list }}"
        _vip_holders: "{{ ansible_play_hosts | map('extract', hostvars) | selectattr('_vip.stdout', '!=', '') | map(attribute='inventory_hostname') | list }}"
      run_once: true

    - name: This run's time
      ansible.builtin.set_fact:
        _run_ts: "{{ ansible_play_hosts | map('extract', hostvars, ['_journal', 'stdout']) | join('\n') | regex_search('PI TIER-0 BACKUP ([0-9TZ]+):', '\\1') | first }}"
      run_once: true

    - name: The daily timer on, with a next run
      ansible.builtin.command: systemctl show -p UnitFileState -p NextElapseUSecRealtime pi-tier0-backup.timer
      register: _timer
      changed_when: false
      failed_when: >-
        'UnitFileState=enabled' not in _timer.stdout_lines
        or _timer.stdout_lines | select('match', 'NextElapseUSecRealtime=.+') | list | length != 1

- name: Every piece restored, read back from the store
  hosts: pi1
  become: true
  gather_facts: false
  vars:
    work: /var/backups/pi-backup-rehearsal
  tasks:
    - name: The last success is this run's, read back
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          last=$(rclone cat "store:$PI_BACKUP_BUCKET/last-success")
          [ "$last" = "{{ _run_ts }}" ] || { echo "last-success $last, this run {{ _run_ts }}"; exit 1; }
          rm -rf {{ work }}; mkdir -p {{ work }}
          rclone copy "store:$PI_BACKUP_BUCKET/$last" {{ work }}
          echo "$last"; ls {{ work }}
      register: _got
      changed_when: false

    - name: Retention - the 31-day probe gone, the 29-day one kept (then removed)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          dirs=$(rclone lsf --dirs-only "store:$PI_BACKUP_BUCKET" | sed 's#/$##')
          old={{ hostvars['pi1']._probes.stdout_lines[0] }} young={{ hostvars['pi1']._probes.stdout_lines[1] }}
          rclone purge "store:$PI_BACKUP_BUCKET/$young" 2> /dev/null || true
          ! grep -qx "$old" <<< "$dirs" || { echo "the 31-day probe $old is still there"; exit 1; }
          grep -qx "$young" <<< "$dirs" || { echo "the 29-day probe $young is gone"; exit 1; }
          echo "the 31-day probe gone, the 29-day one kept"
      register: _retention
      changed_when: false

    - name: Consul's snapshot into a throwaway dev agent - Vault's and Patroni's keys there
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          d=$(mktemp -d)
          consul agent -dev -node=restore-rehearsal -data-dir="$d" -bind=127.0.0.1 -client=127.0.0.1 \
            -http-port=18500 -server-port=18300 -serf-lan-port=18301 -serf-wan-port=-1 -dns-port=-1 -grpc-port=-1 -grpc-tls-port=-1 \
            > "$d/agent.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; wait $pid 2>/dev/null || true; rm -rf "$d"' EXIT
          # up and its own leader (a restore before the election fails: "No cluster leader")
          for i in $(seq 1 60); do
            [ "$(curl -s http://127.0.0.1:18500/v1/status/leader)" = '"127.0.0.1:18300"' ] && break
            sleep 1
          done
          consul snapshot restore -http-addr=127.0.0.1:18500 {{ work }}/consul.snap > /dev/null
          vault=$(consul kv get -http-addr=127.0.0.1:18500 -recurse vault/core/ | wc -l)
          patroni=$(consul kv get -http-addr=127.0.0.1:18500 -recurse service/ | grep -c '/leader:' || true)
          echo "vault/core keys $vault, Patroni leader keys $patroni"
          [ "$vault" -gt 0 ] && [ "$patroni" -gt 0 ]
      register: _consul
      changed_when: false

    - name: Each database dump into a scratch database - its tables, the marker row, the users
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          P=(-h 127.0.0.1 -p 5000 -U postgres)
          q() { psql "${P[@]}" -d "$1" -Atc "$2"; }
          # a dump for every database Patroni has, none missing
          have=$(q postgres "select datname from pg_database where not datistemplate and datname <> 'postgres' order by 1" | tr '\n' ' ')
          dumped=$(ls {{ work }}/pg-*.dump | sed 's|.*/pg-||; s|[.]dump$||' | sort | tr '\n' ' ')
          [ "$have" = "$dumped" ] || { echo "databases: $have; dumped: $dumped"; exit 1; }
          [ -s {{ work }}/pg-globals.sql ] || { echo "no roles dump"; exit 1; }
          for f in {{ work }}/pg-*.dump; do
            db=$(basename "$f" .dump); db=${db#pg-}; scratch="restore_rehearsal_$db"
            psql "${P[@]}" -d postgres -qc "drop database if exists $scratch" -c "create database $scratch"
            pg_restore "${P[@]}" --no-owner --no-privileges -d "$scratch" "$f"
            want=$(pg_restore --list "$f" | awk '$4 == "TABLE" && $5 != "DATA" {n++} END {print n + 0}')
            got=$(q "$scratch" "select count(*) from information_schema.tables where table_type = 'BASE TABLE' and table_schema not in ('pg_catalog', 'information_schema')")
            extra=""
            case "$db" in
              backup_probe) extra=" marker $(q "$scratch" "select v from marker")"
                            [ "$(q "$scratch" "select v from marker")" = "{{ _marker.stdout }}" ] || { echo "$db: marker missing"; exit 1; } ;;
              forgejo) live=$(q forgejo 'select count(*) from "user"'); rest=$(q "$scratch" 'select count(*) from "user"')
                       extra=" users $rest/$live"; [ "$rest" = "$live" ] && [ "$live" -gt 0 ] || { echo "$db: users$extra"; exit 1; } ;;
              keycloak) live=$(q keycloak 'select count(*) from user_entity'); rest=$(q "$scratch" 'select count(*) from user_entity')
                        extra=" users $rest/$live"; [ "$rest" = "$live" ] && [ "$live" -gt 0 ] || { echo "$db: users$extra"; exit 1; } ;;
            esac
            psql "${P[@]}" -d postgres -qc "drop database $scratch"
            echo "$db: $got of $want tables$extra"
            [ "$want" -gt 0 ] && [ "$got" = "$want" ]
          done
      register: _pg
      changed_when: false

    - name: One export per realm Keycloak has, each with clients
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          kc=http://127.0.0.1:8080
          token=$(printf '%s' "$KC_ADMIN_PASSWORD" | curl -fsS -d client_id=admin-cli -d username=admin \
            --data-urlencode password@- -d grant_type=password "$kc/realms/master/protocol/openid-connect/token" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          live=$(curl -fsS -K <(printf 'header = "Authorization: Bearer %s"\n' "$token") "$kc/admin/realms" \
            | python3 -c 'import json, sys; print(" ".join(sorted(r["realm"] for r in json.load(sys.stdin))))')
          exported=$(ls {{ work }}/keycloak-*.json | sed 's|.*/keycloak-||; s|[.]json$||' | sort | tr '\n' ' ' | sed 's/ $//')
          [ "$live" = "$exported" ] || { echo "realms: $live; exported: $exported"; exit 1; }
          for f in {{ work }}/keycloak-*.json; do
            python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); n = len(d.get("clients", []));
          assert n > 0, "no clients"; print(d["realm"], n, "clients")' "$f"
          done
      register: _kc
      changed_when: false

    - name: The work directory and the marker database gone
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . /etc/pi-backup/env; set +a
          rm -rf {{ work }}
          psql -h 127.0.0.1 -p 5000 -U postgres -d postgres -qc "drop database if exists backup_probe"
      changed_when: true

    - name: Restored
      ansible.builtin.debug:
        msg: >-
          PI TIER-0 BACKUP {{ _got.stdout_lines[0] }} RESTORES: consul - {{ _consul.stdout }}; postgres -
          {{ _pg.stdout_lines | join(', ') }}; keycloak - {{ _kc.stdout_lines | join(', ') }}; retention -
          {{ _retention.stdout }}

# the cases a normal day does not reach, on the VIP's Pi (the other exits at once)
- name: A clock ahead keeps the newest; Keycloak down still backs up the rest
  hosts: pis
  become: true
  gather_facts: false
  tasks:
    - name: Whether this Pi holds the VIP
      ansible.builtin.command: ip -o -4 addr show to {{ keepalived_vip }}/32
      register: _vip_now
      changed_when: false

    - name: The VIP's Pi
      when: _vip_now.stdout | length > 0
      block:
        - name: Retention 0 (the cutoff now - every backup "old", as under a clock gone ahead), keep 2
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              set -a; . /etc/pi-backup/env; set +a
              PI_BACKUP_RETENTION_DAYS=0 PI_BACKUP_KEEP=2 /usr/local/sbin/pi-tier0-backup.sh > /dev/null
              rclone lsf --dirs-only "store:$PI_BACKUP_BUCKET" | sed 's#/$##' | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort
          register: _kept
          changed_when: true
          failed_when: _kept.rc != 0 or _kept.stdout_lines | length != 2

        - name: Keycloak down - the run fails, the rest uploaded with the failure marker, last-success not moved
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -uo pipefail
              set -a; . /etc/pi-backup/env; set +a
              before=$(rclone cat "store:$PI_BACKUP_BUCKET/last-success")
              systemctl stop keycloak
              trap 'systemctl start keycloak' EXIT
              out=$(/usr/local/sbin/pi-tier0-backup.sh 2>&1); rc=$?
              newest=$(rclone lsf --dirs-only "store:$PI_BACKUP_BUCKET" | sed 's#/$##' | grep -E '^[0-9]{8}T' | sort | tail -1)
              files=$(rclone lsf "store:$PI_BACKUP_BUCKET/$newest" | sort | tr '\n' ' ')
              after=$(rclone cat "store:$PI_BACKUP_BUCKET/last-success")
              echo "rc=$rc newest=$newest files=$files last-success $before -> $after ($(tail -1 <<< "$out"))"
              [ "$rc" != 0 ] && [ "$after" = "$before" ] && [ "$newest" != "$before" ] \
                && grep -q KEYCLOAK-EXPORT-FAILED <<< "$files" && grep -q consul.snap <<< "$files" \
                && grep -q 'pg-keycloak.dump' <<< "$files" && ! grep -q 'keycloak-.*json' <<< "$files"
          register: _kc_down
          changed_when: true

        - name: Keycloak serving again
          ansible.builtin.uri:
            url: http://127.0.0.1:8080/realms/master
          register: _kc_back
          retries: 30
          delay: 10
          until: _kc_back.status == 200

        - name: The two cases
          ansible.builtin.debug:
            msg: "kept under a clock ahead: {{ _kept.stdout_lines | join(', ') }}; Keycloak down: {{ _kc_down.stdout }}"

