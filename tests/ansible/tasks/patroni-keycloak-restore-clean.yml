---
# test-patroni-keycloak-restore.yml's clean-up, before and after: its scratch database off the leader, its dumps
# wherever the restore left them (moved aside, or in place), a dump that was there before put back. Runs on pi1.
# Expects: dump, db, the restore_leader group.
- name: The test's database gone
  ansible.builtin.command: sudo -u postgres psql -v ON_ERROR_STOP=1 -qc "DROP DATABASE IF EXISTS {{ db }}"
  delegate_to: "{{ groups['restore_leader'] | first }}"
  changed_when: true

- name: The test's dumps gone
  ansible.builtin.shell: |
    set -euo pipefail
    for f in "$(dirname {{ dump }})"/keycloak-restored-*.sql {{ dump }}; do
      if [ -f "$f" ] && grep -q '^CREATE TABLE restore_probe' "$f"; then rm -f "$f"; fi
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: A dump that was there put back
  ansible.builtin.command: mv {{ dump }}.kept-by-test {{ dump }}
  args:
    removes: "{{ dump }}.kept-by-test"
